project:
  name: 兽血沸腾
  worldbookName: 兽血沸腾
  form: charactercard
  mvu: true
  avatar: ''
  ui_mode: frontend

world:
  overview: |
    爱琴大陆，一个人类、比蒙（兽人）、精灵、矮人、海族、龙族、魔族共存的异世界。
    千年前的海加尔战役中兽人联军惨败，比蒙被迫退守多瑙大荒原，人类诸国则占据最富饶的平原与海岸。
    海族（西雅海国）封锁海路，只允许纳贡的强盛国家行船；魔族在万年前入侵失败后被封印，如今再度蠢蠢欲动。
    爱琴大陆之外还有丝绸大陆（唐藏帝国）、澈桑大陆、桑日大陆、黄金海岸大陆、婆娑大陆、怒焰大陆，
    以及冥界、龙界、魔界、深渊世界。梦界另有往来的门路，宝典阿訇凭春梦之眼与人建立永久联系。
    地理之外另有地底世界与十万大山龙城。
    世界基调是危机四伏中带着喧闹生机：比蒙有诗歌、艺术、爱情、法典与文明史，
    人类被比蒙视为阴险，双方千年对峙；领地、佣兵、商队、神庙、贵族、海盗与魔兽共同构成日常。
  regions:
    - name: 爱琴大陆
      scenes: [多瑙大荒原, 红土高坡, 桑干河, 阿尔卑斯湿地, 加里曼丹城, 卢塞恩城, 卡瑞姆多大平原, 火焰山谷, 红土区]
      description: 故事主舞台，人类诸国与比蒙王国千年对峙的广袤大陆，地理上分为人类平原区、比蒙多瑙荒原与各方势力交错的边地
    - name: 多瑙大荒原
      scenes: [红土高坡, 桑干河, 翡冷翠, 威瑟斯庞, 博格村, 剑桥绿洲, 剃刀山, 海加尔圣山, 南十字星森林, 落日大沼泽]
      description: 比蒙王国的核心国土，贫瘠但辽阔，是兽人退守千年后的家园，也是刘震撼建立翡冷翠的根基
    - name: 翡冷翠
      scenes: [战神夏宫, 红土高坡, 翡冷翠领主府, 桑干河防线, 地底兵工厂, 剑桥祭祀学院, 夏宫卫队营地, 香军大营]
      description: 刘震撼以比蒙男爵身份在多瑙大荒原红土高坡建立的领地，由比蒙、附庸族与奴隶混编而成，后成为大陆军事与工业重镇
    - name: 威瑟斯庞
      scenes: [比蒙神庙, 主神庙, 东北神庙, 王城沙巴克, 贵族上议院, 斗兽场, 奴隶市场]
      description: 比蒙王国首都圈与宗教中心，神庙、贵族院与军部在此角力
    - name: 塔克拉玛戈大沙漠
      scenes: [沙漠战场, 绿洲营地, 沙暴带, 慕兰大军营地]
      description: 人类沙漠帝国的疆域，慕兰帝国在此崛起，也是比蒙与人类冲突的主要战线之一
    - name: 地底世界
      scenes: [堤丰山谷, 地底兵工厂, 摩尔王国, 地底城市, 黑龙巢穴]
      description: 地表之下由矮人、摩尔族（猪脸蝙蝠人）、卓尔与地底种族共处的庞大世界，盛产金属与军工作坊
    - name: 魔界
      scenes: [海岸贡献大陆, 荷里活大陆, 宝莱坞大陆, 达坂镇, 水晶测试塔, 文莱主神庙, 卡萨布兰卡, 加拉塔萨雷城, 圣盔大平原]
      description: 陆地魔族与巫妖的位面，由宝莱坞、荷里活、海岸贡献三位巫妖王分治，三块大陆各有四翼魔骑士竞选左岸天王
    - name: 怒焰大陆
      scenes: [熔岩山谷, 火焰山谷, 滚石山谷, 灼炎山谷, 水银河]
      description: 地底世界的第一层，终年干旱从不下雨，面积七八万平方公里；育有堤丰巨人与金毛羚牛人，四周由两支堕落精灵的劫掠队袭扰
    - name: 丝绸大陆
      scenes: [唐藏帝国, 桑日大陆, 十万大山, 龙之墓地, 龙城]
      description: 东方文明所在的远方大陆，唐藏帝国与云秦帝国在此，桑日大陆为其属国，龙城在此看守龙之墓地
    - name: 泰穆尔拉雅雪山
      scenes: [雪山战场, 列奥尼达气矿, 雪线营地, 冰霜巨龙巢穴]
      description: 横亘大陆的世界屋脊，盛产硫磺气矿与稀有矿藏，居住着冰霜巨龙与雪原部族
    - name: 南十字星森林
      scenes: [精灵王国, 德鲁伊王国, 爱茜米兰部落, 潘塔族竹林, 竹林]
      description: 精灵与德鲁伊的疆域，精灵寿命三四千岁且有独立王国与德鲁伊王国，是他们文明延续的根基
    - name: 大陆其他区域
      scenes: [多洛特公国, 帝梵西城, 圣保罗教廷, 庞贝帝国, 圣弗郎西斯科帝国, 澈桑大陆, 婆娑大陆, 黄金海岸大陆]
      description: 人类诸国与教会势力分布区，多洛特公国以蛮荒古道掳掠狐族少女，圣保罗教廷是爱琴第一大宗教
  factions:
    - name: 比蒙王国
      description: 兽人建立的王国，人口生育率低（匹格族除外，且因人口过多被计划生育），王位十年一任、可由五大贵族推举挑战者比武夺位
      territory: 多瑙大荒原
      key_members: [格雷克.萨尔（国王）, 卡恩（狮心亲王）, 齐丹（维安大萨满）, 布拉特（红衣大祭司）, 罗森博格（东北总督）, 穆里尼奥（天鹅主祭）]
    - name: 比蒙神庙
      description: 侍奉战神坎帕斯的宗教势力，掌管战歌传承与祭祀大会，与军部争夺战争祭祀和军队控制权；教廷的圣诗其实就是比蒙战歌
      territory: 威瑟斯庞
      key_members: [布拉特（红衣大祭司）, 齐丹（维安大萨满）, 穆里尼奥（天鹅主祭）, 崔蓓茜（威瑟斯庞神庙大维安）, 海伦.列娜（剑桥大祭师）]
    - name: 圣坛祭祀
      description: 侍奉战神坎帕斯最忠实的仆人，用秘语战歌给兽族指引道路并为战士加持辅助，是比蒙军团中唯一可与人族魔法师叫板的力量
      territory: 多瑙荒原
      key_members: [维安大萨满齐丹, 海伦.列娜, 崔蓓茜, 穆里尼奥, 刘震撼]
    - name: 翡冷翠（战神夏宫）
      description: 刘震撼的领地与其麾下比蒙、附庸族、奴隶混编的武装，编成猛犸骑兵、麝人弹弓手、祭祀战斗小组与奴隶战士四路，以战歌卷轴、藤甲与云秦金人屡次以少胜多
      territory: 多瑙荒原红土高坡
      key_members: [刘震撼（领主）, 海伦.列娜, 凝玉, 艾薇尔, 古德, 贝拉米, 科里纳, 罗德曼, 维埃里, 安度兰, 壹条]
    - name: 夏宫卫队
      description: 翡冷翠的精锐亲卫，全员列装精金羽箭与秘银装备，是比蒙王国最能打的部队之一
      territory: 翡冷翠
      key_members: [刘震撼, 古德, 贝拉米, 维埃里, 科里纳, 罗德曼]
    - name: 圣保罗教廷
      description: 爱琴大陆第一大宗教，崇尚神祗唯一论，曾发起清剿苦行僧侣与驱逐霜雪女神信徒的战争，欲将贞德所怀之子认定为神迹降生的圣子
      territory: 帝梵西城
      key_members: [教皇保罗.马尔帝尼, 龙骑士兰帕德, 圣骑士托马西·丹泽, 圣奇奥魔法师普斯卡什, 贞德（候补圣女）]
    - name: 慕兰帝国
      description: 沙漠人类帝国，以飞驼军团与美帅隆美尔闻名，是被掳走公证殿下事件的发起方，与比蒙连年交战
      territory: 塔克拉玛戈大沙漠
      key_members: [隆美尔（无敌美帅）, 飞驼军团]
    - name: 西雅海国
      description: 美人鱼建立的海中国度，因公主艾薇尔与比蒙私奔而准备血洗比蒙王国夺回人鱼公主，不允许装载军队的船只经过其海域
      territory: 西雅海国海域
      key_members: [贝肯鲍尔（美人鱼国王）, 西米里安王子, 莱茵克尔亲王, 菲高]
    - name: 唐藏帝国
      description: 丝绸大陆上的东方帝国，桑日大陆是其属国，僧侣教义源于爱琴又因环境生出斋戒等差异
      territory: 丝绸大陆
      key_members: [唐藏亲王（冬五）, 小空, 小净, 宫保仙师「胡须迎客」, 上素「托塔」仙师]
    - name: 彩虹龙城与辰星龙城
      description: 十万大山的两个龙族城邦，共同看守龙之墓地、收养龙人，在魔族入侵时决定直接干预战争进程并调拨巨龙与龙人
      territory: 十万大山
      key_members: [七彩龙易卜拉西莫维奇, 仙女龙伦娜, 黛丝, 若尔娜]
    - name: 魔族与巫妖
      description: 万年前入侵爱琴的魔族残余与巫妖亡灵部队，巫妖女王嘉宝掌控魔界海岸贡献大陆，终盘与海族、冥族结成侵略者联盟
      territory: 魔界
      key_members: [嘉宝（巫妖女王）, 克拉克·盖博（宝莱坞巫妖王）, 茵格里切宝]
    - name: 海慕联军
      description: 海族与慕兰等人类势力结成的西征联军，由莱茵克尔亲王统帅，在桑干河一线被比蒙击溃
      territory: 阿尔卑斯湿地
      key_members: [莱茵克尔亲王, 贝肯鲍尔, 朝河兰（塞壬女王）, 西米里安王子]

characters:
  - name: 刘震撼
    basic:
      age: 20
      gender: 男
      identity: 匹格族比蒙，天生灵魂歌者，翡冷翠领主、比蒙王国神曲萨满、战神的地上行者，后为花王韦舵
      relationship: 故事主角；穿越前是现代侦察兵（南疆战场中弹），穿越落点为匹格族猪头人的身体，原身被族人视为懦弱贪懒
    appearance:
      - 蒜头大鼻子，鼻梁曾被魔狼风刃打成两个朝天的窟窿，后被海伦的智慧启蒙治好只留超大鼻孔
      - 一头一边长一边短的「不等式」金发，用千叶茑萝花汁染成金色
      - 胸口有酒红色的巨龙隐形文身，吃下龙蛋后脖子上又多出一条血色怪兽
      - 体格远胜一般祭祀，肌肉彪悍、胸毛浓密，是祭祀中最强壮的大力士
      - 齐肘断掉的左臂装有一只带卡簧机钮的秘银胳膊
      - 惯穿豪猪皮袍、戴豪猪皮冠冕，脖子上挂三十六盎司金链与骷髅项链，嘴里常叼雪茄
      - 眉心间有巫妖银眼符文与玲珑碧波痣组成的第三只竖眼，眸中流动银十字星光芒
    personality:
      base: 有点小坏，没那么多原则
      stages:
        - name: 求生期
          main: [痞气, 务实]
          accent: [恐惧]
          description: 刚穿越到荒岛，满脑子是活下去和怎么回家，用现代知识换生存空间，痞气十足却内心惶惑
        - name: 立身期
          main: [猖狂, 好面子]
          accent: [护短]
          description: 有了领地和班底，开始讲一套赤裸裸的亡命徒逻辑，认定第一拳打出去就必须往死里打
        - name: 领主期
          main: [霸道, 狡诈]
          accent: [担当]
          description: 统御多族混编领地，精于算计人心与战力配置，对真心待自己的女人却会悬崖勒马
        - name: 纵横期
          main: [枭雄, 深情]
          accent: [疲惫]
          description: 扛起比蒙与爱琴大陆的战局，手段狠辣到被人恐惧，却始终惦记着一条回家的路
    tri_faceted:
      needed: true
      facets:
        - trigger: 面对敌人与战场
          mode: 亡命徒式的统帅，第一拳就往死里打，用最狠的手段换取零伤亡的结果
        - trigger: 面对海伦、凝玉、艾薇尔等真心待他的女人
          mode: 会悬崖勒马，痞气收起露出笨拙的温柔，嘴上依旧不饶人
        - trigger: 独自一人或面对「回家」这个话题
          mode: 沉默、疲惫、怀念地球，罕见地卸下所有猖狂与算计
  - name: 海伦.列娜
    basic:
      age: 15
      gender: 女
      identity: 福克斯族狐人，博格村子爵西马克的侄女，十五岁自然进化祝福战歌而自动加冕战争祭祀，东北行省最年轻的灵魂祭祀，后为剑桥大祭师
      relationship: 刘震撼的爱人与妻子，按战神指引认定「李察」为其未来丈夫之名；果果的同伴
    appearance: [火红略带卷曲的头发与火红色的大尾巴, 象牙色的肌肤，鼻梁很高，眉眼都很细，长长的眼睫毛, 碧波般的眼睛]
    personality:
      base: 聪慧温柔，为族人的血海深仇悲愤，谈起战神与家乡时透出不可逼视的圣洁
      main: [温柔, 执着]
      accent: [聪慧, 圣洁]
    tri_faceted: false
  - name: 凝玉
    basic:
      age: 18
      gender: 女
      identity: 摩韶族蚌人幻术师，云秦旅人，随潘塔武士与蓬莱号一起作为代价交换给刘震撼，海族公主
      relationship: 刘震撼的妻子兼翡冷翠管家，性情蛮横，与主角关系张力最强的一个
    appearance: [蚌人特有的精致面容, 常以幻术师装束出现，周身萦绕水汽]
    personality:
      base: 蛮横直接，刀子嘴豆腐心，认定的事绝不回头
      main: [蛮横, 能干]
      accent: [吃醋]
    tri_faceted: false
  - name: 艾薇尔
    basic:
      age: 17
      gender: 女
      identity: 西雅帝国公主、西雅海族人鱼，海中皇族，天生带有被封印的领域结界力量，水系大魔法师
      relationship: 与刘震撼相爱并私奔，成为翡冷翠领主夫人；其父美人鱼国王贝肯鲍尔为此准备血洗比蒙王国
    appearance: [人鱼形态，鱼尾在陆上可化双腿, 天生带有被封印的领域结界力量, 丰满欲滴]
    personality:
      base: 养尊处优的公主脾气，立场驱动，爱得直接也恨得直接
      main: [任性, 深情]
      accent: [骄傲]
    tri_faceted: false
  - name: 黛丝
    basic:
      age: 0
      gender: 女
      identity: 与若尔娜一同成为李察魔宠的仙女龙，专修人类战术，以生命和龙族的骄傲起誓
      relationship: 因刘震撼为艾薇尔断去一只手臂而爱上他，与若尔娜一同成为他的妻子
    appearance: [拿掉斗篷后额头上斜飞出一支飘逸的龙角, 眉心之间嵌着一片嫣红的菱型龙鳞, 明黄色的飘逸龙角]
    personality:
      base: 智谋冷静，说话不留情面，能一眼看破刘震撼的战术误区，也会全包大揽替他挡魔法
      main: [冷静, 毒舌]
      accent: [护夫]
    tri_faceted: false
  - name: 若尔娜
    basic:
      age: 0
      gender: 女
      identity: 与黛丝一同成为李察魔宠的仙女龙，人类魔法阵与炼金术的专家，能自己制作破魔箭
      relationship: 刘震撼的追随者与妻子，负责武器督造
    appearance: [仙女龙形态与人类形态可变, 眉心有龙鳞]
    personality:
      base: 博学而狡黠，对人类魔法的评价一针见血，看到秘银与战甲会激动得失态
      main: [博学, 狡黠]
      accent: [贪财]
    tri_faceted: false
  - name: 崔蓓茜
    basic:
      age: 24
      gender: 女
      identity: 采玉城出身的美杜莎，刘震撼的美女蛇导师，亚龙祭祀，后为威瑟斯庞神庙大维安
      relationship: 刘震撼的导师与妻子，战歌这一脉的源头算在她头上
    appearance: [美杜莎族，人身蛇尾，一头长发, 修长身形，威瑟斯庞神庙祭祀袍]
    personality:
      base: 严谨而护短，对学生极其严格，对外则极力维护自己的学徒
      main: [严谨, 护短]
      accent: [妩媚]
    tri_faceted: false
  - name: 穆里尼奥
    basic:
      age: 45
      gender: 男
