mvu:
  structure: |
    顶层结构：
    ├── 世界
    │   ├── 日期
    │   ├── 时段
    │   ├── 当前区域
    │   ├── 当前场景
    │   ├── 天气
    │   └── 近期事务
    ├── 剧情
    │   ├── 当前卷
    │   ├── 章节序号
    │   ├── 章节节点
    │   ├── 主线进度
    │   ├── 已触发事件
    │   └── 分歧记录
    ├── 主角
    │   ├── 身份 / 阶位 / 阵营声望
    │   ├── 生命 / 歌力 / 体力
    │   ├── 属性（力量、敏捷、体质、感知、魅力、智慧）
    │   ├── 状态
    │   ├── 诅咒
    │   ├── 战歌 / 自创战歌
    │   ├── 异体原
    │   ├── 装备 / 物品栏
    │   └── 淫乱度 / 精力
    ├── 技能树
    │   ├── 战歌树
    │   ├── 异体原
    │   ├── 兵种树
    │   ├── 领地科技树
    │   └── 自定义
    ├── 战斗
    │   ├── 进行中 / 回合 / 阶段 / 环境（含结界）
    │   ├── 环境（地形、天气、结界）
    │   ├── 我方 / 敌方
    │   ├── 战歌加持
    │   └── 战报
    ├── 领地
    │   ├── 名称 / 等级 / 声望
    │   ├── 人口 / 民心 / 治安
    │   ├── 资源
    │   ├── 建筑
    │   ├── 兵力
    │   └── 附庸族
    ├── 魔宠
    │   └── 各魔宠（种类、忠诚、阶位、技能、状态）
    ├── 关系
    │   └── 各角色（好感度、信任度、关系阶段、亲密、孕事、已触发互动）
    ├── 后宫
    │   ├── 成员
    │   ├── 子嗣
    │   └── 孕事
    └── 系统
        ├── 难度
        ├── 规则开关
        └── 玩家自定义
  variables:
    # ── 世界 ──
    - path: 世界.日期
      format: YYYY/MM/DD
      description: 当前场景日期
    - path: 世界.时段
      enum: [凌晨, 清晨, 上午, 正午, 下午, 黄昏, 夜晚, 深夜]
      description: 当前时段，影响场景光照与角色行动
    - path: 世界.当前区域
      description: 角色当前所在的大区域，控制地理条目的 EJS 显隐
    - path: 世界.当前场景
      description: 当前具体场景，控制场景条目的 EJS 显隐
    - path: 世界.天气
      enum: [晴, 阴, 雨, 雪, 雾, 沙暴, 风暴]
      description: 当前天气，影响战斗环境修正
    - path: 世界.近期事务
      type: record
      description: 进行中的主线与支线事件标记
    # ── 剧情 ──
    - path: 剧情.当前卷
      enum: [荒岛篇, 胸罩岛篇, 海上篇, 多瑙大荒原篇, 博格村与领地初建, 翡冷翠领主期, 比蒙王国纵横]
      description: 当前所处的原作卷，控制阶段指导的显隐
    - path: 剧情.章节序号
      type: number
      range: 0~763
      description: 当前推进到的原作章节序号，0 起算，控制 48 个事件条目的显隐
    - path: 剧情.章节节点
      description: 当前推进到的原作章节名，与 故事大纲.yaml 的 chapters 对应
    - path: 剧情.主线进度
      type: number
      range: 0~100
      description: 主线推进百分比，用于总览仪表盘进度条
    - path: 剧情.已触发事件
      type: record
      description: 已触发的原作关键事件清单
    - path: 剧情.分歧记录
      type: record
      description: 玩家造成的与原作不同的分歧，供剧情编年史回溯
    # ── 主角 ──
    - path: 主角.身份
      description: 当前公开身份，如匹格族族人、比蒙男爵、翡冷翠领主、神曲萨满
    - path: 主角.阶位
      enum: [无, 风语祭祀, 灵魂祭祀, 战争祭祀, 权杖祭祀, 维安大萨满, 十二主祭, 红衣大祭司]
      description: 圣坛祭祀七阶中的当前阶位，龙祭祀与神曲萨满等荣誉头衔记在身份字段
    - path: 主角.生命
      type: object
      fields:
        当前: number
        上限: number
    - path: 主角.歌力
      type: object
      fields:
        当前: number
        上限: number
      description: 驱动战歌的能量，对应人类魔力，靠冥想恢复
    - path: 主角.体力
      type: number
      range: 0~100
      description: 体力，近身肉搏与长途行军消耗
    - path: 主角.属性
      type: object
      fields:
        力量: number
        敏捷: number
        体质: number
        感知: number
        魅力: number
        智慧: number
      description: 六维属性，影响战斗结算与对话选项
    - path: 主角.状态
      type: record
      description: 当前状态标记，如负伤、狂化、加持、中毒
    - path: 主角.诅咒
      type: object
      fields:
        血之祭奠: boolean
        说明: string
      check: 默认为 true 且不可解除；仅当剧情推进到终盘并达成特定条件才可变更
    - path: 主角.战歌
      type: record
      description: 已掌握的正牌战歌清单，由技能树解锁写入
    - path: 主角.自创战歌
      type: record
      description: 以汉语自创的战歌，玩家与主角可自定义新增；效果等同正宗比蒙战歌但属异端
    - path: 主角.异体原
      type: object
      fields:
        龙力系: number
        花系: number
        金刚伏魔之力: number
        秘银断臂: boolean
      description: 主角独有的异体成长线，与技能树异体原联动
    - path: 主角.装备
      type: z.record
      description: 装备栏，按部位记录，如 头盔/胸甲/武器/饰品
    - path: 主角.物品栏
      type: z.record
      description: 背包，可动态增删键
    - path: 主角.淫乱度
      type: number
      range: 0~100
      check: 亲密行为累积增长，长期无亲密行为缓慢衰减；影响 NSFW 场景的主动程度与角色反应
    - path: 主角.精力
      type: number
      range: 0~100
      description: 亲密行为消耗，休息恢复；精力不足时影响判定
    # ── 技能树 ──
    - path: 技能树.战歌树
      type: z.record
      description: 以原文实名战歌为键，值为 解锁(bool)/熟练度(0~100)/层级；按祭祀七阶限制可解锁项，禁止新增原文未出现的战歌名
    - path: 技能树.异体原
      type: z.record
      judge: 刘震撼专属成长线，节点为 龙力系/花系/金刚伏魔之力/秘银断臂 等；玩家自定义节点写入 技能树.自定义
      description: 龙力系、花系、金刚伏魔之力的节点解锁状态
    - path: 技能树.兵种树
      type: z.record
      description: 比蒙战士、猛犸骑兵、熊猫武士、麝人弹弓手等兵种的解锁与等级
    - path: 技能树.领地科技树
      type: z.record
      description: 祭祀学院、祭坛、战歌图腾柱、摩云磁暴灯等建设节点
    - path: 技能树.自定义
      type: record
      description: 玩家自定义的技能或成长节点，元素含 名称/说明/消耗/状态；支持战歌、异体原、兵种、科技树以外的任意扩展
    # ── 战斗 ──
    - path: 战斗.进行中
      type: boolean
      description: 是否处于战斗状态，控制战斗面板显隐
    - path: 战斗.回合
      type: number
      description: 当前回合数
    - path: 战斗.阶段
      enum: [未开始, 布阵, 交锋, 鏖战, 追击, 撤退, 结算]
      description: 战斗流程阶段
    - path: 战斗.环境
      type: object
      fields:
        地形: string
        天气: string
        结界: z.array
      description: 战场环境与双方布下的结界
    - path: 战斗.我方
      type: record
      description: 我方参战单位，元素含 名称/兵种/生命/状态/站位
    - path: 战斗.敌方
      type: record
      description: 敌方参战单位，元素含 名称/兵种/生命/状态/站位
    - path: 战斗.战歌加持
      type: record
      description: 当前生效的战歌光环，元素含 战歌/施法者/剩余时限
    - path: 战斗.战报
      type: record
      description: 逐回合战报，供战斗面板回放与 AI 叙事取用
    # ── 领地 ──
    - path: 领地.名称
      description: 领地名称，默认翡冷翠
    - path: 领地.等级
      type: number
      range: 1~10
      description: 领地规模等级，影响可建造项与人口上限
    - path: 领地.声望
      type: number
      range: 0~100
      description: 在爱琴大陆的声望，影响招揽与外交
    - path: 领地.人口
      type: number
      description: 总人口，含比蒙、附庸族与奴隶
    - path: 领地.民心
      type: number
      range: 0~100
      description: 民心，影响生产与暴动风险
    - path: 领地.治安
      type: number
      range: 0~100
      description: 治安，影响商路与事件触发
    - path: 领地.资源
      type: object
      fields:
        金币: number
        粮食: number
        木材: number
        石料: number
        铁: number
        精金: number
        魔晶: number
      description: 领地核心资源，供建造与军备消耗
    - path: 领地.建筑
      type: z.record
      description: 以建筑名为键，值为等级与状态
    - path: 领地.兵力
      type: z.record
      description: 以兵种为键，值为数量与训练度
    - path: 领地.附庸族
      type: record
      description: 已归附的种族与部族清单
    # ── 魔宠 ──
    - path: 魔宠
      type: z.record
      description: 以魔宠名为键，值为 种类/忠诚/阶位/技能/状态/契约
      check: 每个灵魂歌者终生只能有一只魔宠；果果未签灵魂契约，可与其他魔宠并存
    # ── 关系 ──
    - path: 关系
      type: z.record
      description: 以角色名为键，值为 好感度/信任度/关系阶段/亲密/孕事/已触发互动/印象
    - path: 关系.海伦.好感度
      type: number
      range: 0~100
      check: 关键事件触发跳升，日常互动小幅增长，冷落则缓慢衰减
    - path: 关系.海伦.信任度
      type: number
      range: 0~100
      check: 坦诚与帮助行为增长，隐瞒与伤害行为大幅下降；影响其分享心事与战歌心得的深度
    - path: 关系.海伦.关系阶段
      enum: [初识, 同伴, 相知, 相爱, 妻子, 疏离]
      description: 关系阶段，控制角色条目的多阶段调色盘渲染
    - path: 关系.海伦.孕事
      type: object
      fields:
        状态: string
        胎数: number
        孕期: string
        预产期: string
      description: 怀孕状态，由亲密行为与判定写入，控制孕事面板
    - path: 关系.凝玉.好感度
      type: number
      range: 0~100
    - path: 关系.凝玉.信任度
      type: number
      range: 0~100
    - path: 关系.凝玉.关系阶段
      enum: [初识, 同伴, 相知, 相爱, 妻子, 疏离]
    - path: 关系.艾薇尔.好感度
      type: number
      range: 0~100
    - path: 关系.艾薇尔.信任度
      type: number
      range: 0~100
    - path: 关系.艾薇尔.关系阶段
      enum: [初识, 同伴, 相知, 相爱, 妻子, 疏离]
    - path: 关系.黛丝.好感度
      type: number
      range: 0~100
    - path: 关系.若尔娜.好感度
      type: number
      range: 0~100
    - path: 关系.崔蓓茜.好感度
      type: number
      range: 0~100
    - path: 关系.茉儿.好感度
      type: number
      range: 0~100
    - path: 关系.歌坦妮.好感度
      type: number
      range: 0~100
    # ── 后宫 ──
    - path: 后宫.成员
      type: record
      description: 已确认的后宫成员清单，元素含 姓名/种族/身份/关系阶段/加入章节
      check: 由 关系.{角色}.关系阶段 达到 相爱 或以上、且完成确认事件后写入；移出需明确的分歧或死亡事件
    - path: 后宫.子嗣
      type: record
      description: 已出生的子嗣，元素含 姓名/母亲/种族/年龄/特征/天赋
      check: 由 后宫.孕事 孕期走完自然分娩写入；种族与天赋按母系种族与父母属性衍生
    - path: 后宫.孕事
      type: record
      description: 进行中的怀孕记录，元素含 母亲/胎数/孕期/预产期/受孕章节
      check: 仅在 系统.规则开关.孕事系统 为 true 时更新；由亲密行为的受孕判定写入，孕期按 世界.日期 推进分期，分娩后移入 后宫.子嗣
    - path: 后宫.亲密记录
      type: record
      description: 近期亲密行为记录，元素含 对象/日期/场景/摘要；供孕事判定与关系面板回看
    # ── 系统 ──
    - path: 系统.难度
      enum: [轻松, 标准, 硬核]
      description: 难度，影响受伤与资源判定
    - path: 系统.规则开关
      type: object
      fields:
        孕事系统: boolean
        战斗自动结算: boolean
        领地自动产出: boolean
        作者插话: boolean
    - path: 系统.玩家自定义
      type: z.record
      description: 玩家自定身份、种族、出身与任意扩展标记

