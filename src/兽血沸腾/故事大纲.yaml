  - 博德族奥斯崔特鸵鸟人的种族异能是没顶沙丘，虫族帕尼比蜂人的种族异能是致命毒刺；帕尼比蜂人已经灭亡
  - 自创战歌一度被神庙法典判为异端，米高斯科菲尔德因自创以比蒙语为主体的致幻战歌被教宗特批严办入狱，关押在东北宗教禁锢所狐狸河监狱并成功越狱
  - 冬眠结界之歌是制作美杜莎徽章的关键战歌，前任金袍主祭米卢是昔日唯一掌握者，这个纪录直到穆里尼奥的战歌技艺日趋成熟才被打破
  - 七度金戒指如果脱离地面的海拔过高便无法使用，最大作用是转载，与魔法传送阵配合是翡冷翠实施蛙跳战术的主心骨
  - 海族正规军装备中有一级加密的军用辎重敢死药丸，黑珍珠状药丸浸泡在海水海苔中才能长期保质，服下如同加持嗜血术且无副作用，前身是海槟榔，重要性等同于比蒙的狂化战歌
  - 魔族只有惊寂之黄泉与碧落之黄泉两种泉水，惊寂之黄泉能驱散一身魔力，还能做出延迟发作的效果用于害人
  - 巫妖王的皇极变身术只有两次使用机会，一旦使用就会彻底变成目标物种，从灵魂到外在都没有任何区别，就算神祇亲至也辨不出
  - 假面罗刹是巫妖研发出的可以任意改变脸型的顶级间谍道具，蝴蝶人只能看透隐身而无法看穿面具下的真实容貌
  - 心灵犀角只有感情最真挚的犀牛人夫妻才能诞生，持有者无论相隔多么遥远都能心有灵犀一点通；比蒙布尔族从古到今只诞生过不到十对，如今搜遍国库也凑不出一对
  - 布尔血脉强大的适应能力可以让牛头人在任何地域安身立命，地底世界有伊米尔，黄金海岸大陆有米诺陶斯，浩瀚的海洋里有海牛族
  - 菠萝密药丸是慕兰阿訇用来补益元素力量的节魔药丸，吃一颗全身魔力就能掰成两半花；节魔装备在爱琴大陆除刘震撼的死亡领主耳钉外还没听说过有其他种类
  - 貔貅是丝绸大陆特有的野兽，生来就能用鼻子寻找矿脉，只以金属为食，唾液还有分解金属结构的效力，排出的粪便即经胃肠消化提纯的金属之精，是东方朔士豢养的专业炼金兽
  - 狂化战歌的覆盖光环范围高达数百青方，每一次覆盖都会造成数百人死亡，是海族炮灰拉锯战术的克星
  - 音刃琴魔的音刃攻击不逊于高级魔法，只在释放速度上差强人意；人类世界的魔法师全凑到一起也没有两千人
  - 三千年前的海陆大战，第一个击败海族军队的是比蒙；如今的海陆大战，第一个击败海族军队的依然还是比蒙
  - 爱琴大陆所有超过百万人规模的集团军会战，能在半个月之内分出胜负的都很少见
  - 魔界的囚笼法则中奥法等级的高低并不是衡量法术战力的唯一标准，合理运用智慧以弱搏强，弑杀神祇也并非绝不可能
  - 元素精灵使代表着一系奥法的创生境界，与神祇相比或许仅仅是不够古老，只要你进入这个物质位面就会被囚笼法则桎梏
  - 海族战士在本届海陆大战中改用丝绸方士福格森.徐制作的安尔乐离水法阵，法阵加持出笼罩城市的超大型离水结界，体积上百平方、重达数吨，平时须有专门卫队看管隐藏与转移
  - 离水徽章是单兵装备，制作过程较为烦琐，但溃逃时不会出现窒息脱水之类的非战斗减员，海族若拿到徽章制造工艺至少要推迟十年八年才能侵略爱琴
  - 安尔乐法阵的破绽在于结界范围有限且无法随溃军移动，一战败就逼得海族战士冲出结界自相践踏，这一届海陆大战海族因此付出了远超刀兵的死亡代价
  - 海族由西雅海国与亚力士海国两大阵营组成，美人鱼皇帝贝肯鲍尔与塞壬女王朝河兰各领一国，出征爱琴负责运动辎重后勤的民夫合计高达二十一亿人
  - 亚力士海国前来爱琴的补给线长达上万里，海族高层给登陆多瑙的军团定下的心理底限是三个月内攻克多洛特
  - 海族偏师登陆多瑙的战略目的是挥师西进，与卡瑞姆多大平原上的主力两面夹击人类，长期围困比蒙城市只是浪费宝贵时间
  - 人类或比蒙的军制中指挥超过十万人的大型集团军，最高统帅下辖的军事参谋与战术幕僚至少要有上百人，隆美尔却在所有人眼皮底下以一人一嘴临阵指挥五个军团
  - 海族风暴撕裂者术士中的招潮蟹施暴雨术、电鳗施三联闪电链，两系法术配合衍变出「法术组合」这一新魔法名词，把直线攻击变成无处可躲的曲射弹幕
  - 娜迦是月精灵这种上位精灵的直系后裔，属于正宗的堕落精灵，生活在多瑙西海，全部部众约两万，倾力动员也只有八千人
  - 娜迦天生拥有多条手臂，凭借十二根弓弦的竖琴战弓，一个人在瞬间就能射出好几枝箭，射速不逊于神箭哲琴，大兵团作战中足以弥补阻击火力的缺陷
  - 娜迦的种族异能「群体默言术」是鼎鼎出色的魔法师克星，能让体质孱弱的法师集体无法吟唱咒语，觉醒几率虽低但八千名娜迦足以筛选出相当数量的异能者
  - 娜迦以月精灵食物「莲菝丝」的变种「古灯海莲」为行军口粮，制成的苔条只需食用一口，一天就不用再进食，因此无须进驻桑干河补充给养
  - 海娜迦曾与华伦泊尔族蝙蝠人签订守望相助的战争盟约，蝙蝠人被剿灭后失去回陆地的消息渠道，被塞壬女王一纸征召令拉上多瑙西部土地充当偏师
  - 卢塞恩城三百万总人口中河仙人有两百万，实行摩尔与卓尔轮流派人执政的轮值城主制，每隔一个月轮换一次，轮值城主在任期内享有重大事件独裁专断的特权
  - 卢塞恩堕落种族全民皆兵，摩尔、卓尔、血精灵、灰矮人、河仙人各自保有独特的战争古树与兵种传统，战车编制也是堕落精灵竭力保持下来的
  - 比蒙的传统立威方式是用敌人的皮肤蒙制人皮战鼓，海族军队流行在树上缚满俘虏或尸体的「海神祭」，魔族军队喜欢砍下头颅堆成「京观」或者「首丘」
  - 慕兰军人的标准装备是圆盾、弯刀、投枪和健驼，即使失去座骑仍能凭投枪技巧顽抗，逼到绝境必然亡命反击
  - 比蒙以战歌图腾柱的禁魔效果遏制敌方法师部队，己方法师占据制高点反而能脱离禁魔桎梏，这种魔法对战的新战术与新打法开创了时代先河
  - 比蒙祭祀的战歌光环最高覆盖半径可达八百平方，处于密集队形的炮灰兵种每瞬间的死亡都以千计，已具备导师阶覆盖类魔法的攻击力
  - 海族炮灰兵种上阵前都会服食「敢死药丸」，心脏泵血已到达极限，再叠加嗜血术或者狂化加持便会脑溢血而亡
  - 爱琴兵家认为歼灭四成敌军即为「上获」，在冷兵器为主的时代想要全歼一支人数超过十万的敌军是不可能完成的任务
  - 战略能源成为爱琴的新军事焦点，炭精由一百磅煤炭提炼出一磅，遇火即燃且燃烧温度高到溶金化铁，是地底世界最早的空用航弹原料
  - 泰穆尔拉雅雪山的硫磺地隙被雪山土著称为「列奥尼达」，浓度极高的硫磺气嗅入肺腔会令肺脏凝固成硫磺状固体化石，致命气矿却凤毛麟角
  - 硫磺气灌充必须满足无泄露与大负荷量两个条件，盛器多用伸缩性最好的大型鱼鳔，气囊摆放时间过长会冷却成只能为敌人消毒的硫磺水
  - 战歌武器与能量武器的概念在人类军事院校引发研究热潮，条顿军事学院把「能量武器的起源与运用」定为今年的答辩论文主题
  - 隆美尔断言空军的黄金发展期到来之后，未来五千年以内的战争大多只会围绕「能源」一个目的，逐渐衍变成互相争夺能源的铁血冲突
  - 时空大裂缝提前开启、魔族即将进军爱琴的消息已被海族从人类俘虏口中得知，历史上海族从未与魔族打过交道
  - 爱琴参战各族在外貌特征上差异太过明显，细作与间谍几乎没有生存空间，各族军队只能靠一场场真刀真枪的搏杀慢慢了解敌人
  - 海族的跨海远征依赖两栖巨龟、巨型龙龟与拖拽蚌壳辎重的巨鱿，海洋中没有使用重型弩具的环境，重弩制造技术被视为绝密
  - 种族异能从未在爱琴大型会战中成编制形成战斗力，每使用一次冷却时间高达数小时，火力持续性极度不足，只适合佣兵部队和冒险团体小打小闹
  - 娜迦是月精灵堕落而成的海娜迦，拥有多条手臂、能同时使用多种武器的特殊体质，以风木双修魔法见长，其「群体默言术」也是种族异能
  - 卢塞恩的堕落精灵可以凭借月蚀之期举行「血月赞美仪式」，将摩尔法师的魔法职称直接晋升一阶，三百万人口的城市一共也才两千出头法师
  - 海族在陆地上每日摄盐量比陆地种族高出上百倍，离水结界只能保障海族皮肤的水分而不能提供任何盐份，咸盐因此被海族后勤部门列为天字第一号军需
  - 上届海陆大战时，海族军队的咸盐基地设在如今白令山脉下的佛罗仑多盐碱森林，如今那里已是比蒙王国的领土
  - 海族工兵培育的「珊瑚虫母」能快速繁殖大量珊瑚虫，珊瑚虫以石为食，腔门排泄的粪冷却后凝结成坚硬磐固的珊瑚礁盘，原理与精灵用「永恒月井」「生命古树」催生树木建筑极其相似
  - 多瑙大荒原缺乏石头，海族工兵在那里无法构筑工事；卡瑞姆多大平原的石头多如海底沙砾，能给珊瑚虫提供足够粮食
  - 复合角楼设计的多面棱堡会让每一支攻城部队都承受四五个方向的城防火力，与上届海陆大战时爱琴最流行的环形城堡相比，攻城难度增加百倍
  - 海族法师没有发展出「十一人魔法基本阵型」和「胡克盲点火控」，却发展出与人类一时瑜亮的魔法技战术理论「双法合壁」，专门研究射击角度和混合威力，能把直线射击改造成曲射弹幕
  - 「双法合壁」对站位技巧、配合频率、火力仰角、出手时间与射击角度有着无比苛刻的要求，若无内行指导，纸上谈兵者根本混合不出威力庞大的鸡尾酒法术
  - 比蒙战歌也早已诞生出组合加持，比如「石肤」与「敏捷」搭配、「通灵」与「狂化」搭配，原理并不复杂
  - 娜迦祭司用秘术培育的「永恒月藻」和「海洋生命古树」，与地表精灵的「永恒月井」一样是催生小精灵的子宫，有了它们就能就地种植「古灯海莲」
  - 玻兰秀尔星辰在爱琴传说中是上古月精灵女王玻兰秀尔的眼泪所化，是天空最亮的彻夜启明之星
  - 夏宫卫队的制式羽箭是镀了精金的羽箭，属于破魔加破甲二合一，战弓全部用弹性无限的特殊水银丝拉制，动力极强，精金提炼程度之高几乎无法再次回炉和剥离
  - 地底世界的青色地焰温度极高，不用耗费任何木材或者煤炭做燃料，足以溶炼绝大多数金属，只有特种金属需要油瓜汁和酒精提纯温度才能锻造
  - 通灵之歌分为上下两阕，只是一曲歌引，后面加上其他的副本战歌便能召唤出不一样的宠物，雷克萨据此发明了语宠与弑宠两首通灵副本
  - 语宠战歌能给哑巴魔兽加持大量精神力，使其获得开口说话的权利；它的光环还能让直系学徒精神力暴涨，师徒结成「比扬德乐队」联奏召唤战歌，每多一个直系学徒就能增幅光环范围一成
  - 战歌光环的笼罩面积存在八百平方的最高限制，多出来的余地正是留给语宠副本战歌的师徒乐队去突破的
  - 弑宠战歌能召唤一个魔兽成为兽王的死亡替身，关键时刻代替兽王释放「星云连锁闪电」；它的光环能把「闪电护盾」永久加持给某个人
  - 「闪电护盾」平时隐藏、战时随心启发，即使被击溃一天之后又能再次复元，宿主不死便永不消散
  - 只要魔兽心甘情愿成为弑宠，兽王危急时让它付出生命召唤「星云连锁闪电」，就不会承受「血之祭奠的诅咒」，这与故意让战宠去送死是两码事
  - 风语祭祀一旦超过二十岁便无法晋级，启蒙之后一年内不晋级就失去晋级的可能，他们没有魔宠，只能靠吹奏乐器释放战歌光环指挥军队跑位
  - 故意杀害祭祀的魔宠在比蒙王国等同于杀人大罪，祭祀与骑士都不愿让魔宠或座骑经受任何非人道的待遇
  - 海加尔圣山永久租借的条件是土地所有权仍归圣弗郎西斯科帝国所有，比蒙可以在那里驻军五千维护治安，但不能禁止人类在海加尔山进出
  - 夏宫卫队是一支宗教武装而不是正规军队，讨伐异教徒被其视为神圣的天职
  - 德莱尼人是上古时期的爱琴土著，最早研究开创魔法谱系学说，一万年前的神魔大战中轻信魔族互不侵犯承诺选择永久中立，后遭魔族大肆屠杀而无人救援
  - 魔界城市大多设在地下，进出口较少；魔族的魔法传送法阵虽然泛滥，短时间之内仍无法靠传送阵大规模调兵遣将
  - 海族的塞壬能使用「四海大合唱」，集众人魔力于一体使用出等级更高的法术，与比蒙祭祀用「七星联唱地毯」排出七人北斗阵有异曲同工之处
  - 一万三千多名海族风暴撕裂者术士中，真正超过高级职称的高阶法师最多一千人，其余上万人以十人甚至数十人联手聚魔的方式吟唱咒语，就能召唤出超过图腾柱禁魔限制的魔法
  - 魔族是最擅长联魔的种族，训练有素的魔族巫妖甚至不需要黑曜毁灭者的帮忙也能多人联手释放越阶奥术；人类魔法师分系繁杂，很难集魔成功
  - 死亡领主装备可以召唤出八个浑身笼罩裴寂寒气、躯体凝结霜花的冰霜牛头人巡游者
  - 艾薇尔铁塔以海底电光火山喷发时雷电岩浆冲刷出的雷云风暴螺纹钢铸造，只要一丝电弧激发就能引带大自然的雷电，堆砌的重量越大雷暴越强
  - 雷云电柱是沛然自然能量而不是魔法元素，战歌图腾柱无法豁免，四象防御大阵也挡不住，只有物理防御和超猛魔御能力才可能硬抗
  - 艾薇尔铁塔是能量武器而非攻城器械，每天可以释放四道雷柱，中间无须冷却间隔，风向标指向哪里便打到哪里
  - 雷云风暴螺纹钢在三千年前第一次海陆大战时就被海族储备进皇家仓库，直到此次登上陆地掌握了火焰铸造与炼金技术才造出两尊各重上百吨的铁塔
