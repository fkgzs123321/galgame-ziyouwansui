  - 万年前的众神之战在爱琴大陆上留下许多文明产物，如海岸边一大半淹没在水里的女神雕塑和拿仑角附近的两座持剑神相，那些文明连名字都已消逝在风中
  - 权术和政治在智慧生物的世界里永远无法避免，即使是以勇武闻名的比蒙王国也有着复杂的权力网与官场是非
