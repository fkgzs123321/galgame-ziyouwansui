  - name: 马赛回旋
    summary: 豪斯箭手的绝技，第一箭故意射偏，第二箭后发先至撞在箭尾上改变方向，绕过盾牌射进对手盔甲的空隙
  - name: 一叶障目
    summary: 碧玉龙的植物系隐身魔法，射出一片巨大的绿色树叶化作漫天树叶雨，让巨龙和龙骑士一起消失在空中
  - name: 朦胧术
    summary: 潮汐领主革瑞恩的隐身手段，通过抖动波纹化作无形的空气，被龙骑士误认作隐身术
  - name: 花冠
