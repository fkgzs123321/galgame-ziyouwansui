  - name: 剃刀荒丘
    description: 红土高坡附近最大的地精强盗部落所在，拥有三千之众，刘震撼把针对它的围剿正式誊上备忘录，准备一个礼拜内解决
    scenes: []
  - name: 白头乌鸦野人部落
    description: 被人类强盗收买、帮其一起抢劫的野人强盗部落，与岩石强森食人魔部落同为红土高坡附近的大股强盗
    scenes: []
