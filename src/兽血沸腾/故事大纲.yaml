    summary: 由精灵堕落而来的种族，为追求黑暗法术退入地底山洞，不能见阳光，掌握深幽黑暗与召唤异界魔兽的黑暗法术，霸占生命之泉泉眼繁衍后代
    territory: 墨晶峡谷
