  - name: 生石灰
    summary: 堤丰巨人撒下的大理石白垩粉，本用于追踪隐形灰矮人脚印，遇水沸腾成石灰乳煮死数千灰矮人
  - name: 廓尔克弯刃
    summary: 羚牛武士一米五长的锋利回旋镖，投掷后甩出不符合空气动力学的弧线，是翡冷翠的主要防空火力
  - name: 重装巨镰盔甲
    summary: 庞贝帝国制式重甲，由九十八名獒人战士全套列装
  - name: 蚤筋强弓与湮甲魔箭
    summary: 史前巨蚤腿筋制作的金属强弓配湮甲箭镞，射程高达两千码，可狙杀巨龙
  - name: 花萼长剑
    summary: 血精灵剑咏以咏叹调和手势操控的细长飞剑，掺有稀有金属，锋利到可洞穿藤甲
  - name: 骷髅头项链
    summary: 用指头大小的猎物头颅制成的颅骨项链，只有食过人并佩带资格的寇涛人鱼王才有
  - name: 双料大油瓜库存与生命之泉
    summary: 翡冷翠的油瓜生产依赖生命之泉，最多再产一千枚即到界限，剃刀山地精已开始培植秧苗
  - name: 魔法传送阵
    summary: 地底与地表之间的双向通道，原理早已成熟，难在极品魔法原料与炼金术士，刘震撼以此为筹码换取堕落精灵的兵力与宝物
  - name: 帝维水晶
    summary: 记忆水晶的史前形态，磨制的水晶球足可以拍摄记录一两个小时、上万祯连贯画面，还可以记录声音
  - name: 珐琅海
    summary: 远东丝绸大陆称为蟹舍利的僧侣坐像，水中的巨蟹上年纪后会在壳子里产生，能让僧侣的祷言更精纯耐久并对死灵有强大杀伤力
  - name: 黑珍珠
    summary: 地底河流中某种巨蜃的特产，光看外表就象星空一样深邃，还带有随露天时间愈久愈浓郁的怡然香味
  - name: 高岑设计图
    summary: 地精设计师刻在石版上的八足蜘蛛形机械怪物设计图与分解图，带一对可折叠伸缩的腭形油锯
  - name: 机械高岑
    summary: 地精以齿轮为动力制造的金属蜘蛛傀儡，背部加装半封闭式喷火炮塔与巨型腭吻链锯，驾驶舱以双斜角金属挡板防护
  - name: 古力火统
    summary: 刘震撼手中的青铜火器，冷静折膛装弹，能在一千二百码外打瞎山丘之王的眼睛
  - name: 风暴之槌
    summary: 山丘之王手中的兽骨鼓槌武器，携带巨大的物理力量与眩晕效果，连石肤的罗德曼也被砸得口吐鲜血
  - name: 死亡领主的护盾
    summary: 小修女贞德提供的护盾，可挡住战争古树爆开的小刺果与密集的远程打击
  - name: 神圣护甲
    summary: 海伦学会的天使十二音阶战歌，近战反弹百分之五十攻击力量，就是冷却时间快了点
  - name: 湮甲破魔箭
    summary: 豪斯族神箭手哲琴的箭矢，射程超远，能像热刀子切牛油一样贯穿摩尔法师的魔法护盾
  - name: 火焰箭
    summary: 娜娜借雪原无面巨兽之力腰带的霜系加成临时制作的箭，命中后因两种魔法元素反斥而爆裂
  - name: 战争古树
    summary: 堕落精灵主城的上古巨树，已有一万年树龄，离土挪动不能超过两小时，两根树根腿能像人一样迈步，被刘震撼从十棵砍到六棵收进空间戒指
  - name: 地心玄钢
    summary: 堤丰巨人珍藏多年的锻造材料，匀出一半人马献给领主大人，为翡冷翠制造第三批制式武器
  - name: 点金桑金刚
    summary: 由点金桑从土地之中自然凝结的钢材，需在流水中冲刷数年褪去土元素，才能制作出硬度傲人的武器
  - name: 血引
    summary: 摩尔法师的偏门魔法，以对手喷出的鲜血糅成血球驱动，一旦被本身的血引所攻击，满腔的热血就有可能被全部吸出体外
  - name: 镜像
    summary: 绿党族螳螂人以纯正念力修成的绝技，罗德曼的镜像为二阶，可以幻化两个没有攻击力却如同真人的分身并净化不良状态
  - name: 致命一刀
    summary: 罗德曼融会大地精单手拔剑术自创的反手提撩刀，以速度增幅力量，由领主大人亲自赐名
  - name: 暗影突袭
    summary: 守望者拥有的超能力，在夜晚能控制体重不超过五百磅的人或动物的影子从而控制其身体，没有豁免方法
  - name: 伽玛射线
    summary: 河仙人的天赋异能，平时用来探路，经强化训练也可用于战斗，灼伤性强还能穿透金属图腾柱
  - name: 百合香酒
    summary: 用星尾龟的酒珠浸泡清水后提炼的美酒，在地底绝迹万年后让堤丰巨人与羚牛人倾倒
  - name: 隐身术
    summary: 潮汐领主革瑞恩的超阶魔兽能力，凭空消失在空气中让摩尔大军陷入混乱
  - name: 苦洱藤
    summary: 地底打猎时用来熏野兽洞穴的藤蔓，与半干蕈秆捆在一起点燃制造出土造的芥子气
  - name: 大风车
    summary: 刘震撼在多洛特收罗的民生商品，可借风力、水力驱动也能用人力驱动，用来吹散卓尔的毒烟
  - name: 雪原无面巨兽之力腰带
    summary: 豪斯箭手马大师友情支援肥罗的腰带，提供霜系魔法加成与巨兽之力
  - name: 秘银拳头
    summary: 刘震撼的秘银义手，可以硬接战争古树掷来的巨型刺果
  - name: 羽翼飞马
    summary: 刘震撼的飞行坐骑，能凝神准备水晶风华
  - name: 双头奇美拉
    summary: 黑暗精灵故老相传的飞行坐骑，体形巨大、皮糙肉厚但转圈迟钝，八大主城各留一百头作仪仗队，共八百头被刘震撼索走，用来背负持回旋飞镖的羚牛武士
  - name: 超阶魔晶
    summary: 制作双向魔法传送阵所需的极品魔晶，需两枚超阶魔尊等级，堕落精灵被迫去猎杀六翼炎魔与火焰君主来凑
  - name: 虿盆
    summary: 精灵古语中的兽坑，专指蝎化卓尔的饲栏，其中的巢农巨蝎酷嗜鲜肉，卓尔以此威胁要把改信萨满教义的族人投入其中
  - name: 蜡溶妖
    summary: 蛛后萝丝的侍女，以自身燃烧充当堕落仪式的计时器，火焰变成暗青色后便接近燃尽，届时仪式仍不成功即算失败
  - name: 密林守护者与密林树妖
    summary: 卓尔与塞纳留斯杂交而来的两种密林半精灵，全族仅一万三千余人，魔索布拉达就有四千多，拥有海绵体皮肤与天生魔抗，是堕落仪式真正寄予厚望的备选
  - name: 地底苍蝇水
    summary: 黑暗精灵秘制的春药，第五日用于测试候选人的扰药性与掌控能力，刘震撼事后从卓尔手里抄到了调配方子
  - name: 名器寸金
    summary: 号称光阴难买一寸金的名器，赫莲娜是其拥有者，卓尔主母们以此判断男人是否身怀异禀
  - name: 名器鹿月吻
    summary: 两位被选中的密林树妖所拥有的名器，吸力强劲，摩尔亲王判断她们也撑不过堕落仪式
  - name: 黑暗吮吸术
    summary: 卓尔精灵独有的秘术，主母们用来在堕落仪式中汲取守望者的精华，一旦对方一泻如注就会被抽成人干
  - name: 迷迭春香与杜蕾丝幻雾
    summary: 萝丝蛛后借女神像口中喷出的高浓度春烟与催情幻雾，能唤起人心中最原始的欲望并淹没其他意识
  - name: 固态蛛网术
    summary: 刘震撼作为守望者获得的奖励之一，喷出八卦蜘蛛网般的白网，一次性粘力时限五分钟，没有两千磅力气被裹住便跑不了，一天只能用三次
  - name: 龟吸领域
    summary: 水元素人鱼的二重进化结界，以薄如蝉翼的贴身水障裹住全身，使呼吸完全静止，全凭肺中空气循环自给，让美人鱼得以长时间在陆地上生活
  - name: 水元素人鱼护盾
    summary: 刘震撼原有的水元素魔法护盾，贴身水障也可当一次性魔法护盾使用且有一定魔抗，一旦被打回水元素，龟吸领域也随之失效
  - name: 剑齿兽战车
    summary: 摩尔血精灵的主力骑兵战车，至今不过二百五十乘，为训育剑齿兽每年都要牺牲大量摩尔
  - name: 狼脚蜘蛛战车
    summary: 卓尔的鸟翼战车，以两米高的狼脚蜘蛛拖曳，载着卓尔骑士与月刃长戟，数量足足一千乘
  - name: 巨型树獭
    summary: 洞穴巨熊的近亲，皮糙肉厚神力无比，十二寸利爪可撕毁制式钢甲，能像壁虎一样攀附建筑，是维埃里的坐骑
  - name: 宝剑巨蜘蛛
    summary: 萝丝神庙看家护院的巨蛛，被刘震撼用固态蛛网术擒下后裹进两米巨茧，出茧之后认艾弗森为主
  - name: 储物腰带
    summary: 贝尼特斯亲王的腰带，装着拉斐尔家族的珍宝与驮都，在街头群殴的混乱中被人潮抽走，令魔索布拉达全城戒严
  - name: 驮都
    summary: 血婴寿终焚化后留下的魔法结晶，摩尔精灵语意为血滴子、血珍珠，六大驮都分别是茹毛、汗血、心血、歃血、含血、落红
  - name: 石版百美图
    summary: 摩尔皇宫中秘藏的图册，贝尼特斯认为上面最漂亮的是比蒙斯派尔族孔雀美女，刘震撼估摸那是春宫图，还向他借阅
  - name: 血胶棒子
    summary: 刘震撼亲手制作的中空血胶巨棒，模仿奥尼尔殴打奴隶的血胶棒，借厚度隔绝黑暗吮吸术，表层残留蛋清凝固的亮晶晶颜色
  - name: 血羽之心
    summary: 罕见的聚魔之晶，只要灌输基础歌力即可自行回魔、分线存储，使夔鼓中的魔晶无需海伦亲自灌注歌力
  - name: 血婴
    summary: 摩尔法师以自身鲜血血饲宿卵十个月孵出的幼婴，与本体长得一样，拥有半数魔力与同等寿命，永远固定在三岁婴儿形态
  - name: 帝维实况
    summary: 用帝维水晶球与火系潜力拍摄并放映的战争实况，可制成存储法阵的水晶卡单独储存
  - name: 皇冠荆棘战甲
    summary: 一万年前地精标号n03的重甲，关节要害镶半寸利锥围十二寸三棱刺，配燕形臂盾与破甲战锤，带磁性牵引并减轻七成重量
  - name: 火焰压榨护甲
    summary: 火焰君主的魔抗能力，与神圣荆棘护甲、海绵护甲、密林守护者充血海绵体一样能反弹百分之五十近战伤害
  - name: 献祭卷轴
    summary: 为战士加持火焰免疫与灼伤灵魂能力的卷轴，刘震撼曾后悔没先给壹条加持
  - name: 避火龙珠
    summary: 龙子霸下的名门出品，无形避火障既能隔绝火焰之力，又能让持有者成功施展火焰法术，壹条凭它取得水火风三系豁免
  - name: 血羽地鹰
    summary: 地底罕见的飞行系魔兽，其晶核即血羽之心
  - name: 夔牛皮鼓
    summary: 比蒙神器，用夔牛皮蒙制，每敲击九十九下可召唤一个耐力光环，原为龙祭祀柯奇士的辅助乐器，海加尔战役后不知所踪
  - name: 博浪沙火鹤
    summary: 刘震撼的超阶火系魔宠，拥有火晶护甲与斐雯丽蟒胆汁带来的可怕自愈能力
  - name: 保龄铜锤
    summary: 果果的武器，被它抡圆砸进火焰君主嘴里崩掉门齿数个
  - name: 夸克多水银
    summary: 地底水银河畔夸克多蚯蚓粪便提炼的水银，有强反弹性，制成锁后非原配钥匙无法开启，只有堤丰巨人凝焰切割能打开
  - name: 秘银手臂
    summary: 刘震撼镶着含血驮都的左臂，在磁城中会感应到牵引力，攻城时则被牢牢吸附在城楼上无法动弹
  - name: 彗环护盾
    summary: 血系魔导士的体表护盾，由二十五颗米粒大小的血珠组成的细碎慧环
  - name: 月轮护盾
    summary: 血系魔导士的半月型元素弯刃，环绕体表游弋并可抵御中级魔法突袭
  - name: 日轮
    summary: 刘震撼在邪眼暴君与咸水夔牛血液加持后凝出的空心日轮，与月轮合为日月金轮
  - name: 血魄驮都
    summary: 血婴西罗继承自坎通纳魔导师的巨大魔力仓库，配上血婴瞬发鸡尾酒魔法使其战斗力超越巨龙，也是众人觊觎之物
  - name: 含血驮都
    summary: 水银手套上的驮都之一，原本只有嚼舌头时才能使用的加持能力，让七伤法术喷出的血箭不致白费
  - name: 心血驮都
    summary: 可凭心血来潮取得他人鲜血的血系能力
  - name: 歃血驮都
    summary: 刘震撼取自魔导士血婴的驮都，获取对手血液抹在嘴唇上即可歃血为盟互不攻击
  - name: 七度金戒指
    summary: 刘震撼用来瞬间调运超阶魔兽、人类法师、祭祀与兽王的利器，海族没有同类装备因此只能花两个多小时周转法师团
  - name: 箫中剑
    summary: 刘震撼拔出的利刃，配合秘银箭与血系御力，一剑把竹节巨蜈蚣的脑袋剁成两半并取出魔晶与蜈蚣珠
  - name: 图腾柱
    summary: 刘震撼惯用的重兵器，几棒抡下去便放倒了六翼炎魔
  - name: 青锋剑
    summary: 壹条从口中吐出的四尺长剑，无锋无刃、前端尖锐，疑为鸟喙的变异形态
  - name: 鸟嘴长剑
    summary: 壹条的成名兵器，可化为七尺流火长枪，枪头锐如鹤嘴并带银焰战旗
  - name: 倒挂旗枪
    summary: 壹条的成名绝艺，以自身重量加坠落速度将雁翎刀凝成火元素旗枪自上而下刺击，威力可透穿铁人
  - name: 灵魂锁链卷轴
    summary: 刘震撼随身携带的疗伤卷轴，可为重伤者稳住伤势
  - name: 火蚕丝斗篷
    summary: 黛丝的斗篷，质地堪比精钢，却被邪眼暴君的须鞭一记鞭梢抽成蝴蝶
  - name: 帝维水晶球
    summary: 刘震撼用来摄下歌坦妮悲观绝望眼神的魔法道具，被他一怒之下抛掉，成了逼迫天鹅小美人表态的工具
  - name: 七星弩箭
    summary: 黛丝手持的弩与穿甲箭，因是二次使用的无效产品而收效甚微
  - name: 冰芒羽箭
    summary: 内德维德与小崔使用的羽箭，能在超阶魔兽身上剐开魔法火花
  - name: 火焰轮锯
    summary: 奥特加大师的高阶火焰法术，是围攻邪眼暴君时少数未脱靶的打击
  - name: 金弹子
    summary: 三足金蟾的金属系攻击，面对钢铁大军时威风八面
  - name: 霜雪冰弹
    summary: 果果的冰系魔法，正是它引发了邪眼暴君的魔法反噬
  - name: 冻顶乌龙
    summary: 壹条蒙顶甘露晋阶之后进化出的炎系上位火焰魔法，能把熊熊火焰凝结成紫玫瑰一般的固体雕塑
  - name: 大印象火焰塑形
    summary: 壹条罄尽全身法力、用三昧真火将对手形态永久固始在人型的绝技
  - name: 大红袍
    summary: 壹条自剥的鹤皮所化红色雾障，把邪眼暴君裹成流星砸落地面
  - name: 精神烙印契约
    summary: 最不平等的邪恶魔法契约，能把施法对象转化成没有意志的傀儡
  - name: 霓虹射线
    summary: 邪眼暴君十二根触须独眼发射的射线魔法，附带的负面力量隐蔽而狠辣
  - name: 恐惧之力
