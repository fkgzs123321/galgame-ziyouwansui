  - 战歌没有元素反噬之虞，可以在元素万花筒领域中安然释放，但战歌有射程限制；单控光环不须吟唱就能召唤，又是无豁免机制的战歌攻击模式
  - 名剑召唤并非空间系魔法，而是一首用冥语和比蒙古语交杂的通灵战歌，能让施术者与万千位面的史诗名剑签定临时助战契约
  - 神器战剑是比真珠还真的实际物品，其攻击模式很像魔法却不该算成法术，防御护盾无法抵挡；剑有剑胆，神器战剑是集天地菁华为一体的灵物
  - 主系魔法在魔界受传统与政治双重打压，主系法师每出现一个福喀斯级别的强者，巫妖王就会勒令其永久加持出一件精品武器，任何法师一旦施展永久加持都会连退四级沦为平庸
  - 一万年前的神魔大战让爱琴法师从魔族学到空间魔法和亡灵魔法，也让魔族从爱琴学到气火水土四大主系魔法
  - 海洋魔族做了一万多年的移民陆地之梦，登陆爱琴后才发觉与山清水秀的爱琴相比魔界简直就是垃圾排放地，于是放下架子主动联系陆地魔族
  - 陆地魔族从爱琴海族换来安尔乐离水保湿法阵，再用离水法阵从海洋魔族换取攻克桑干河天险的脱水法阵，双方由此结成共同瓜分爱琴的军事合作盟约
  - 魔界三大海洋魔族王国是海龙人、海胆人和丽人鱼，他们并未与爱琴海族结盟，结盟对象只是陆地魔族，目标是铲除比蒙和人类之后再消灭所有爱琴海族，一统陆地和海洋
  - 金亢龙与银亢龙是雌雄合璧的海洋上位巨龙，号称已知世界没有他们学不会的魔法；金杯银杯两大光环交汇在五米距离以内可舛驰有无并增幅双倍魔力，一旦分开超过五米便双双失效
  - 金亢龙的天赋异能是短时间内跃升一阶修为的埃德贝里彻燃魔之手，银亢龙的天赋异能是将敌人魔法修为打退一级的波切蒂诺退魔吐息，两大异能毕生只能使用一次
  - 汇丰峡谷是南十字星森林的第一险地，每天黄昏起雾、第二天日上三竿才消散，血肉之躯将汇丰雾气吸入肺腑后被阳光晒够一天就会变成晶雕
  - 晶雾必须在光线辐射到某个临界点时才发作效力，常规阳光太过温煦所以要照够一天，月石与玫琳凯珍珠镁粉遇火爆发的双料强光可在瞬间激活晶化
  - 汇丰峡谷内的迷迭草榨汁制成的药剂可解析晶雾效力，但效力只能维持一昼夜，且汇丰峡谷只有日上三竿之后才是安全时间
  - 魔力共鸣体质能与大自然时时刻刻保持同步共鸣，只要空间内还有元素力量存在，本体就能源源不断地分享和获取魔力
  - 六阶祖玛冥龙能将浑身骨骼切换移动成甲胄状从而获得人形，额部高高凸起的巨瘤中是一个进化出来的二元大脑，可以同时释放两种不同谱系的法术，这是六阶冥龙的专利
  - 律令系奥术是海洋魔族在奥术研究上独一无二的世纪成就，把奥法与精神力有机结合，只要法师固执地认为可能便会妄想成真，比拼的是执念与意志
  - 冥界生物怕光，入夜后帝波罗隐退，爱琴的黑暗再也无法束缚冥兽的强大战力
  - 四大魔龙皇族的通幽召唤奥术具有临时助战契约效力，契约冷却之前被召者只能按召唤使意愿向敌人痛下杀手，召唤时限不会低于半个小时
  - 杜蕾斯爆裂箭是一次性消耗的群体杀伤魔法箭，用盾牌或肉体阻挡都无效
  - 时空大裂缝的开启和关闭，以前只能通过哑月的来到和离去达成，晋阶圣霄者也能凭元素潮汐的剧烈变动强行开阖
  - 圣普没有领域，只有法则；茵格里切宝的时间遗忘法则能让整整一个位面世界彻底停转
  - 战歌靠正确吟唱完整音阶获得歌力，歌力决定射程、境界决定威力，战歌可分瞬发与默发
  - 名剑召唤能召出诸位面的神器名剑，同一柄名剑一天之内只会响应一次召唤
  - 剑胆、琴心属于知识叠加型特种战歌，祭祀经历过的位面越多，能召唤的名剑与神琴就越多
  - 冥界生物怕光，冥界靠父神俄狄斯设计的雨积云遮挡光线；爱琴只有一个帝波罗，冥界有四个帝波罗
  - 沾染晶雾者被阳光晒足一天就会变成透明晶雕，嘉宝因此成为终生不能再见阳光的类亡灵生物
  - 冥界霸主可以通过吞噬脑浆获得新的语言技能；冥语只有三大统领、瑞博克大恶魔、瓢甲虫法老和冥龙等少数存在会
  - 地球这个位面曾经有过元素潮汐极其强大的年代，从高魔世界退化成如今的无魔世界，刘震撼来自地球
  - 魔族六百万大军依靠通幽传送阵与真空储物水晶保障后勤，时空大裂缝一旦关闭便断绝补给
  - 神曲萨满三件套中包含能自由封印魔兽的美杜莎蛇珠戒指「璀璨之心」
  - 人类魔法力量在大战中损失两位圣奇奥、三位魔导师和七位魔寻士；比蒙阵亡百分之四十权杖祭祀与教宗
  - 玛龙水晶制成的魔法传送阵是时空大裂缝关闭后唯一能跨位面双向传递的装备
