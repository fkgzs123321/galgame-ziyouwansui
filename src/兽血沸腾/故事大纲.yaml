  - 比蒙骑士的准则是食用没有发酵的面饼，喝清洁的泉水，用战斗的意志去拒绝堕落和腐化，远离酒精和美色，远离华丽的饰物，用勇士的热血去证明自己的勋章
  - 比蒙王国十年一度举行王位角逐，其他种族的战士若能击败现任的莱茵国王，就能获得释放囚犯的可能
  - 道格族是比蒙中最忠心的种族，一个獒人这辈子只伺奉一个主人，一旦决定跟随，即使主人再蹩脚也始志不渝
  - 獒人战士的征召必须是在战时组织冲锋团的时候才行，平时不允许用钱雇佣，但角斗场的场主可以私下来监狱花钱赎几个强壮的斗士走
  - 祭祀法典从一百八十页到一百九十页全是记载另类祭祀，和人类的亡灵魔法师一样，这些另辟蹊径的祭祀在比蒙中也是异端，被获知身份肯定会被神庙烧死
  - 祭祀法典中记载三百二十四年前比蒙神庙中出过一个很另类的契克因族鸡头人祭祀，他创造淫亵的战歌导致契克因一族的女性被淫亵思想玷污，逐渐蜕变成比蒙一族出了名的妓户，最后被神庙烧死
  - 使用别的语种来吟唱战歌，只要效果还是正宗的比蒙战歌，就没有脱离到魔鬼的轨道上去
  - 恩特族牧树人是由植物进化的智慧人类，与由动物进化的种族身体构造基本相同，拥有和植物交流的能力与超长寿命，靠放牧森林为生
  - 恩特族牧树人惧怕沙漠与火，沙漠中因此没有森林；他们喜爱收集奇妙的植物，如同巨龙喜爱收集金币
  - 恩特族牧树人每隔一千年左右就进入长时间沉睡，苏醒后能从身体上的年轮知道自己沉睡了多久
  - 恩特族牧树人的家乡是亚特兰蒂斯大陆，如今已经湮没在无边的海水中；他当年从亚特兰蒂斯大陆来到多瑙大陆时这里还只是神魔大战后的战场
  - 神魔大战时魔族曾从南十字星森林的时空裂缝入侵，恩特族牧树人与比蒙兽人并肩抵抗过
  - 森林最深处隐秘的地方有生命之泉和元素之泉，都是森林精灵千万年间凝结而成的精华
  - 森林生命之泉是可以孕育生命的精华之泉，每一滴都可以让荒芜的大地变成沃土，可以让植物在一天的时间里成长到十年后的颠峰状态
  - 只要喝下一滴生命之泉的泉水，就可以象树木一样，不需要交媾就可以孕育出一个崭新的生命，代价是消耗自身生命的精华
  - 森林元素之泉富含充沛的元素力量，可以瞬间帮助祭祀补充歌力，也可以帮魔法师补充魔力
  - 南十字星森林深处散布着数十个山岭巨人和丘陵巨人部落，这些只长着一只眼睛的巨人是传说中泰坦的后裔，身高在五刃左右，力大无穷
  - 巨人是极度排外的种族，只和近亲矮人能够相处，其他种族侵犯领地会被砸成肉饼
  - 南十字星森林中的魔兽严格划分地盘，进入某一种魔兽的地界就会遭受该种类魔兽的攻击，有瀑布和溪水的地方是公共地域相对安全
  - 南十字星森林中还有一个约五千人口的精灵王国，分成三个部落星散在森林之中
  - 精灵族无论男女都有极其美丽的外表、善良而智慧的个性与敏锐的视觉听觉，可以永远年青健康，寿命长达三四千岁，可以被杀死或因为心碎而死
  - 每个精灵都极其擅长射箭，即使在黑夜急行于密林深处也能迅速拔箭射中百米开外小鸟的眼睛
  - 比蒙军队最大的弊病是缺少铁制盔甲的保护，普通牛头人士兵只有木桩制成的图腾柱作武器，布尔族牛头人有夜盲症，黑暗中战力大幅度下降
  - 比蒙各族普遍惧怕火，俄勒芬巨象一族与猛犸族都不能用火，猛犸族靠泰穆尔拉雅雪山滚烫的温泉吃热食
  - 暗精灵是由追求邪恶黑暗法术的精灵堕落而来，箭术非凡、阴险狡诈，黑暗法术十分可怕，巢穴构筑在黑暗的山洞之中
  - 暗精灵不能暴露在阳光之下，属于她们的最低级法术深幽黑暗可以让任何一个种族的视线变成漆黑一片，她们还能召唤来自幽暗地狱的异界魔兽
  - 暗精灵一族女性生育极其艰难，后代中基本上没有男性出现，即使出现也会因为受不了无休止的媾和交配在幼年因精力衰竭死去
  - 邪恶的暗精灵一族霸占着墨晶山谷的生命之泉泉眼，用自身的生命精华为代价孕育崭新的生命，整个暗精灵王国也只有五六百人口
  - 暗精灵每年都会让比蒙军队中失踪一些士兵，若不是她们不能暴露在阳光下，与龙角力军团的麻烦会更多
  - 苦行僧是爱琴大陆人类国家众多宗教中的一个，海加尔战役中随队出征僧侣的祷言庇佑与牧师的圣光治疗术让许多受伤垂危的战士重新投入战场，让人类大军占尽上风
  - 海加尔战役后人类的信仰发生很大改变，强大霸道的圣保罗教排斥异教，大肆发动十字军护教征战，将其他教派基本上从各个人类国家一扫而空
  - 苦行僧注重用刻苦的修炼锻炼意志，以风餐露宿的流浪作为考验，近百年来被以传播异端的罪名用十字架钉死在路边，残余者漂流到人烟罕至的地方继续流浪修行
  - 苦行僧侣会使用祷告抚慰之光，兽人和人类的战争中比蒙就因为缺乏足够的医疗而吃尽苦头
  - 比蒙中的匹格族能出产祭祀已经很罕见，匹格能学会魔法足以颠覆目前存在的一切伦理，王城神庙的异端裁判可能会不顾国王和长老院的反对将他烧死
  - 比蒙的后代中会有一定的几率出现兽亲，也就是只拥有少数智慧的野兽形态后代，这个几率一直相当高，是比蒙人口一直居低不上的主要原因
  - 精金是最贵重的金属，锻造的武器无坚不摧，爱琴大陆的精金出产量非常少，据说每一个麦粒大小的精金重量都在十磅左右
  - 巨龙是爱琴大陆最强横的智慧生物，非常贪婪，除了闪亮的金属和宝石之外对任何尘世的东西也不会产生兴趣
  - 巨龙之中除却拥有远古天神血脉的七彩龙和仙女龙，其他巨龙必须达到四阶之后才能幻化成人形生物
  - 巨龙的好色和贪财一样名声在外，几乎大陆上任何的生物都可以是它们渔色的对象，这也是无数种亚龙兽的由来
  - 巨龙的骄傲闻名遐迩，只有最高贵的勇士才可以得到他们的亲睐，龙骑士和龙祭祀因此成为传说和神话中才应该出现的英雄
  - 巨龙之中也有等级，即使是比较差劲的地狱黑龙也依然拥有着恐怖的实力
  - 泰穆尔拉雅雪山是比蒙史诗传说中支撑天与地之间的四根神柱之一，多瑙大荒原一大半的疆域都和它连接在一起
  - 泰穆尔拉雅雪山帮助比蒙王国阻挡住来自特拉维夫冰封雪原的寒冷季风，让海加尔战役后退守的比蒙找到繁衍生息的土地
  - 泰穆尔拉雅雪山上有很多喷泉，有温泉也有冰泉，全是自然的造化，冰泉的万年寒气可以让雪蕉茁壮成长
  - 猛犸族隶属于俄勒芬巨象一族，在比蒙古老习惯的称呼中被称为毛象人，体格比一般的巨象人更加硕大魁梧，是连独眼巨人都要汗颜的大力士种族
  - 猛犸一族在祭祀法典中最近的记载是八百年前，人类国王屋大维麾下曾有四个猛犸大力士作为仪仗队
  - 华伦泊尔族的蝙蝠人在海加尔战役前就投靠了人类并被大肆封赐爵位，战后立刻鸟尽弓藏，被人类冠以吸血鬼的称呼几乎赶尽杀绝
  - 俄勒芬巨象一族的食物中绝对不能缺少热带水果香蕉，每年还要吃一些红土，这种古怪的饮食习惯很大程度上制约着他们种族的人口繁衍
  - 猛犸族以泰穆尔拉雅雪山盛产的雪蕉替代香蕉，才得以在苦寒之地生存下来
  - 比蒙的大家族越来越屹立不倒而小家族越来越没落，主要原因是人材被垄断，有潜质的战士和祭祀倘若不加入大家族很难有出头之日
  - 圣坛祭祀中战争祭祀是在部队服役的，试炼相对比较严格，军部的参谋们可以制订试炼任务，祭祀没有挑食的权利
  - 比蒙贵族的封地人口必须维持在最低限度的一千人，否则神庙会因为资源浪费将封地兼并给其他贵族，封地考察由贵族监察院负责
  - 比蒙贵族有责任保护领地内子民的安全，有权征召士兵也有权征收税收，所得金币归自己支配
  - 初夜权这项权限仅限于针对奴隶而并非是领民
  - 多瑙荒原桑干河以北才有比蒙军队和村庄驻扎，桑干河以南至红土高坡半径五百里的范围是地精和食人魔强盗最猖獗泛滥的大荒原内部地带
  - 科摩多战争巨兽是能和云和雷电的精灵对话的双系魔法魔兽，自海加尔战役以后比蒙再没有驱使战争巨兽踏入战场
  - 圣殿骑士的米纱徽章和祭祀的美杜莎徽章异曲同工，都带有冬眠次元空间，但圣殿骑士的坐骑由神庙专门饲养魔兽的训兽师提供
  - 宠户就是专门帮神庙饲养圣殿骑士坐骑的训兽师，说白了是神庙的家臣，上位贵族中很少有人会自降身份去干这种并不体面的活
  - 王族本来和神庙是两个不相重合的权力机构，但几位王子加入神庙圣殿骑士行列之后，主神庙的大萨满在做任何决定的时候都会有自己的难处
  - 猛犸一族无法忍受自己被一个无法在武力上胜过他们的比蒙所管辖，因此拒绝了当时邀请他们下山的莱茵狮子
  - 灰矮人出售魔法武器与巨人手臂制成的饰物，冰封之海的水晶与幽暗地底的冥界黑水晶都是人类商人眼中的珍品
  - 故事发生在名为爱琴大陆的异世界，多瑙大荒原上有比蒙兽人、地精、食人魔、野人等种族，荒原之外还有人类国度与海族
  - 多瑙荒原是上古神魔大战的战场，红土高坡与巨石阵等处遍布神魔大战遗留的遗迹与青铜兵器
  - 一万年前地精曾是世界上最聪明的种族，是最早拥有楔形文字的智慧种族，被称为创世之神的宠儿
  - 地精商人曾携带豢养的巨兽把地精商店开遍爱琴大陆所有的穷乡僻壤，有路就有地精的商店
  - 神魔大战前地精英雄加布林能用奇怪的黑色粉末炸开高山寻找极品矿石，还能用矿石和蒸汽制作机器傀儡
  - 地精的精英全毁于神魔大战，湮没文字后失去传承文明的方式，如今只以打家劫舍和奸淫掳掠闻名
  - 地精部落只保留雄性后代，多出来的雌性婴儿除少数留作传宗接代外一律遗弃荒原任其自生自灭
  - 熊地精是所有类地精生物中最强壮的，得名于熊一样的面部，高达两刃、体重两百多磅
  - 绿党族螳螂人是比蒙王国最后一支虫族比蒙，历来是比蒙军队的刀法教官，手腕天生两柄折叠骨质战刀，擅长潜行，高阶刀圣可幻化镜像分身
  - 螳螂族新娘会在新婚之夜吃掉自己新郎的脑袋，绿党族因此人口锐减接近灭绝
  - 玳瑁族即远东大陆所称的文甲族，水陆两栖、寿命极长，安度兰已四千多岁，游历过大半个世界
  - 苦行僧以珍惜生命为唯一法则，拥有祷言抚慰之光的治疗能力，不受食人魔与地精伤害
  - 医疗技术是比蒙军队中最虚弱的环节，比蒙巫医无法满足战争的需要
  - 人类国度的圣保罗教迫害僧侣，迫使苦行僧流浪到信仰自由的比蒙国度
  - 比蒙圣坛祭祀的战歌分辉煌光环与邪恶光环两大类，辉煌光环是加持己方战士的辅助型战歌，邪恶光环是加持在敌人身上的攻击类战歌
  - 邪恶光环战歌相当消耗歌力，没有权杖祭祀级别的雄浑歌力支撑，没有祭祀敢胡乱使用
  - 比蒙战歌不带重叠附加效果，同一战歌重复使用属于资源浪费
  - 歌力严重透支绝对可以夺去祭祀的生命，这在《祭祀法典》中有着最重要的注释
  - 极品魔晶可以封存几首完整的战歌，用来作为歌力储存器
  - 幻术只具有威慑力，是从心底带给敌人恐惧，前提必须有强大的力量环伺才能保障发挥，反复施展会使敌人证实自己的判断而彻底失效
  - 水系攻击魔法在各系魔法中相对而言威力最差劲，大型水系攻击魔法必须通过魔法卷轴才能召唤
  - 地精、食人魔等荒原强盗按部落划分地盘，荒原内部的强盗全是骁勇强壮的战士，荒原边缘只有弱小部落
  - 荒原南岸这一带没有石山，无法采石建造石头城堡，光靠木头栅栏无法抵御大规模强盗联合部队
  - 曾有一支两千多人的丘陵矮人部落迁来荒原，与安度兰的想法一样以进攻当作防御，最终被联手起来的荒原强盗赶走
  - 人类商人冒着危险穿越荒原是因巨额贸易利润，比蒙猎取的野兽骨架、晶核、毛皮在人类世界都是天价
  - 人类捕奴队与私掠者冒险团体胆大包天，甚至敢进入比蒙王国境内抢劫
  - 食人魔部落以家庭为单位聚族而居，每个家庭拥有十到二十名左右的雌性食人魔，而雄性食人魔即巨魔永远只会有一个，除抵御争夺地盘的外敌之外其余时间各不相顾
  - 荒原南岸与红土高坡一带地精强盗势力众多，除科森熊地精部落外还有剃刀荒丘地精部落、岩石强森食人魔部落、白头乌鸦野人部落，另有人类强盗收买野人部落一起抢劫
  - 桑干河是泰穆尔拉雅雪山水融化的支流，也是多瑙荒原上最大的河流，只有冬季枯水期才会安静，河面宽达五箭之地
  - 红土和香蕉是俄勒芬象族食物中不可或缺的两种东西，比蒙王国每年春夏之交才有俄勒芬族来红土高坡采挖红土
  - 猛犸族与俄勒芬族同属象族，猛犸大力士超过三刃的身高，皮肤坚硬无敌，天生不惧一般伤害，最讨厌火
  - 香蕉不适合生长在多瑙大荒原，生长周期缓慢，只有最有势力的福克斯家族才有财力向人类商人购买香蕉供养俄勒芬勇士
  - 熊猫族进入狂化不靠怒意，纯粹依赖高纯度酒精，狂化后还能喷出腹中的酒液化为大醉侠焚身烈焰，喷完之后仍保持清醒头脑与敏捷身手
  - 巨魔就是雄性食人魔，成年巨魔皮肤天生石化，可以忽略一定程度物理伤害并附抗毒与抗魔能力，食人魔长着两个脑袋却只有一个心脏
  - 比蒙军队中只有单独猎杀过雄性食人魔的战士才有资格被称为巨魔猎手，蓝色鲜血染红的羽毛是其征明，觐见贵族时可免去脱帽致敬的礼节
  - 比蒙军队中最出类拔萃的弓箭手称号为神箭哲琴，与巨魔猎手一样是勇士的代名词
  - 俄勒芬巨象武士的皮肤天生没有痛觉、厚实有如橡胶，与巨魔一样是典型的天生斗士
