  - 千年前海加尔战役中，千古第一龙祭祀柯奇士在自己的风系巨龙赫斯基战死时爆发生命礼赞的祝福，使一条本属于人类龙骑士坐骑的火系巨龙产生了心灵契约的转嫁
  - 海加尔战役中龙祭祀柯奇士以一己之力格杀了三位人类龙骑士，靠的就是生命礼赞的祝福
  - 心灵契约不能向同是神仆的人类转嫁
