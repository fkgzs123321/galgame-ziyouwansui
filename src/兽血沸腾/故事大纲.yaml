    description: 亡魂的故乡位面，冥界第一大统领灵魂大河统领茵格里切宝是圣奇奥级，冥界三大神器尽毁于爱琴
    scenes:
      - 灵魂大河
      - 骸骨大河
      - 碧落血河
      - 死亡之地
      - 底特律灵魂大河
      - 时空大裂缝
      - 统领寝殿
      - 冥界神殿
  - name: 爱琴人类诸国
    description: 与比蒙王国并存的人类国度，拥有三大军事强国以及圣罗兰士、圣瑞雪尔两大永久中立国
    scenes:
      - 采玉城
      - 圣罗兰士公国
      - 圣瑞雪尔公国
      - 多洛特公国
  - name: 比蒙王国东北行省
    description: 福克斯族经营数百年的比蒙行省，设有异端裁判所掌控的宗教监狱
    scenes:
      - 福克斯河监狱
      - 西南行省
  - name: 彩虹和辰星两大龙城
    description: 爱琴巨龙的两大龙城，城主为阿加西与波姬小丝，出征南十字星森林的巨龙全体阵亡后嫡系血脉几近断绝
    scenes:
      - 彩虹和辰星两大龙城
      - 辰星龙城
  - name: 晨曦龙城
    description: 魔龙一族的老巢，经此一役只剩三对上位魔龙外加十七头普通魔龙
    scenes:
      - 晨曦龙城
  - name: 慕兰军营寨
    description: 慕兰前锋军团扎在威瑟斯庞城三十里外的营地，只挖了几条象征性壕沟，没有鹿砦、栅栏与瞭望塔楼
    scenes:
      - 篝火营地
  - name: 海慕联军本阵
    description: 威瑟斯庞城外的海慕联军大营，两翼布阵、法师居中、艾薇尔铁塔殿后，溃败后成为比蒙衔尾追杀的屠场
    scenes:
      - 悉尼大贝壳营寨
      - 水井传送阵
      - 联军本阵
      - 艾薇尔铁塔阵地
      - 水井魔法传送阵
      - 离水法阵
  - name: 漠野冻土
    description: 北国冻土，伊斯西丁金属的产地
    scenes:
      - 北国漠野冻土
  - name: 海慕联军大本营
    description: 正对威瑟斯庞南门城楼的联军营寨，以螺贝壳子兵营构成，内含木工作坊与后勤补给基地
    scenes:
      - 木工作坊
      - 后勤补给基地
      - 螺贝壳子兵营
  - name: 魔界大陆
    description: 魔族所在的位面，只有三大王者与宫罔宠臣能穿地穴领主吐丝织成的锦绸
    scenes:
      - 魔界大陆
  - name: 油丘
    description: 卢塞恩军队与二十万娜迦大军血战的战场，隆美尔在此布下陷阱尽歼上千名堕落法师，战后各方在此搜刮战利品并整编娜迦俘虏
    scenes:
      - 沥青丘陵
      - 油丘指挥中枢
      - 卢塞恩预备队潜伏的南方沥青丘陵
  - name: 阿尔卑斯湿地
    description: 一年中有三百二十天阴雨不歇的湿地，海族西征大营设在此地，忘忧谷与叹息之墙扼住海族西进的黄金水道，海族工兵在忘忧谷一带筑起珊瑚海防线
    scenes:
      - 海族西征大营
      - 忘忧谷
      - 叹息之墙
      - 珊瑚海防线
      - 阿尔卑斯湿地
      - 彩虹贝壳野战军帐
      - 海族大本营
      - 沼泽化的泥泞地带
      - 海螺营帐
      - 海螺王帐
  - name: 利兹城
    description: 圣图兰朵王国的都城，盛产法师却无力反击，被海族展示出曲射电浆弹幕
    scenes:
      - 利兹城
  - name: 伊夫堡
    description: 多洛特的天险关隘，号称西壁一线天，以复合角楼的多面棱堡抵御攻城
  - name: 忘忧谷
    description: 爱琴兵家必争之地，东西两座乱石山陵夹出的狭长盆谷，南北被瓦登山脉与阿尔卑斯湿地的泥泞地带掐死，东部高地海拔约四十米、西面高地约八十米
    scenes:
      - 东部高地
      - 西面高地
      - 矮小高地
      - 叹息之墙
      - 珊瑚海防线
      - 火力平台
  - name: 落基山脉
    description: 魔界海岸贡献大陆极西之地，方圆一千五百里的红土高原，水土流失严重，遍布巨大深幽的峡谷沟壑，土壤与岩层都蒙着红锈
    scenes:
      - 红河大峡谷
      - 土冈
  - name: 蒙太拿
    description: 魔族在海岸贡献大陆以西最偏远的地下定居点，约莫七万人口，盛产质地绝佳的万宝路野牛巨骨，是翡冷翠屠城计划的第四座也是最后一座目标城市
    scenes:
      - 地下入口
      - 城主府邸
      - 地下城黄土穹顶
      - 耐奥祖巨骨雕像
  - name: 飞亚达城
    description: 海岸贡献大陆三座玉石产地之一，建在地上、背靠崇山峻岭，附近山脉盛产各种玉石乃至能互相吸合的稀有磁玉，被花廷占据作为根据地
    scenes:
      - 城主府邸
      - 城墙
  - name: 遗忘森林
    description: 煤炭哥利亚世代隐居放牧炭层的森林，中央设立着刻满玄奥符号的金字塔祭台，台下郁积雨水落叶的地毯已被盘藤与苍苔掩盖
    scenes:
      - 海岸边的高高悬崖
      - 金字塔祭台
  - name: 宝莱坞
    description: 魔界六翼天王与羽翼骑士的所在地，海岸贡献大陆的巫妖女王向其发出求援消息
  - name: 荷里活
    description: 魔界六翼天王与羽翼骑士的所在地，与宝莱坞同为魔界精锐空军的来源地
  - name: 毒蔼大洋
    description: 魔界的海洋，海平面上只有毒雾而没有水，清晨会有两个帝波罗争先绽放
  - name: 奎冈森林
    description: 魔界森林，其中的绿色之森哥利亚部落曾接待十位煤炭哥利亚青年并与之联姻
    scenes:
      - 绿色之森
  - name: 瓦登山脉
    description: 山高林密的巨大山脉，与阿尔卑斯湿地的泥泞地带一起把忘忧谷的南北朝向牢牢掐死
  - name: 霍桑比克山脉
    description: 爱琴大陆南部山脉，金精灵在此拥有树屋部落和魔法传送阵，往来爱琴与西方大陆相当方便
    scenes:
      - 树屋部落
  - name: 剑桥
    description: 比蒙祭祀培养之地，海伦任大祭师，剑桥祭祀团驻地
    scenes:
      - 剑桥祭祀团
  - name: 爱琴东部
    description: 海族占领区，民间义军与飞驼军团活动之地
    scenes:
      - 宝剑峰
      - 一线天
      - 圣毛丹公国
      - 沙巴克
  - name: 佛罗伦多盐碱地森林
    description: 魔族第一、第二、第三集团军踏出的集结地，盐田上座落着鸟笼状巨型骨冢
    scenes:
      - 鸟笼状巨型骨冢
  - name: 伊夫堡天险
    description: 多洛特公国的门户要塞，魔族白令山脉进军的必经之路
    scenes:
      - 白令山脉
      - 烽火燧台
  - name: 汇丰峡谷
    description: 南十字星第一险境，每日黄昏起雾，吸雾后经日晒会凝结成晶雕
    scenes: []
  - name: 忘忧谷防线
    description: 人类与海族对峙的防线，由西多夫元帅驻防
    scenes:
      - 忘忧谷防线
  - name: 星界
    description: 诸位面中赫赫有名的低魔世界，星界生物到高魔世界后法术威力几何级倍增，星界之王达历桑德罗的故乡
    scenes:
      - 星澜之门
  - name: 镜界
    description: 理论上独立存在的位面空间，镜子中出现过的生物在镜界都有相同的自己，星澜之门便借其原理造出两个达历桑德罗
    scenes:
      - 星澜之门
  - name: 地球
    description: 无魔位面，刘震撼的前世故乡
    scenes:
      - 越南战场
