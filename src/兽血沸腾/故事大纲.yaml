    summary: 风系魔狼的皮毛，雨水落到上面象碰到油脂一样滚落，被刘震撼当褥子和小狐狸的防风披风使用
  - name: 狼皮弓与狼牙箭镞
    summary: 刘震撼用鲸鱼肋骨做弓、裁狼皮做弦、把十几颗狼牙废物利用制成的箭镞
  - name: 魔兽晶核
    summary: 风系魔狼尸体烧毁后从余烬里拨出的鸽蛋大小六棱状半透明蓝色结晶，被火一烧便闪着蓝幽幽的光，刘震撼误认作胆结石挂在果果脖子上
  - name: 蚌壳大锅
    summary: 刘震撼从海里撬下的斗笠大小海蚌的壳，用来煮椰子汁荷包蛋和海水制盐
  - name: 羽衣
    summary: 小狐狸拆了自己红色袍子上的线，用青红与珍珠斑点的长翎毛为刘震撼编成的披风
  - name: 巨木图腾柱
    summary: 兽人帝国经过一千年修养生息后，重新在多瑙荒原上树起的帝国标志
  - name: 星云连锁闪电
    summary: 比蒙祭祀燃烧自己生命召唤的生命魔法，狐族祭祀曾在海加尔战役后阻住人类联军，被刘震撼当作谈判筹码
  - name: 海族的巨型铁锚
    summary: 班尼路族鲸鱼武士手持海底沉船上的巨型铁锚作为武器，远不是泛大陆任何种族的木船所能抗衡
  - name: 智慧启蒙
    summary: 圣坛祭祀的一次性能力，让没有听过战神之歌的人听懂兽人的语言与知识，使刘震撼能与地精用夹杂东北荒原口音的地精语交谈
  - name: 通灵战歌
    summary: 灵魂歌者拥有的秘语战歌，使听者与祭祀的语言相通，并能让祭祀召唤兽宠；刘震撼的通灵战歌声音激昂而歌力微薄
  - name: 狂暴战歌
    summary: 战争祭祀级别的秘语战歌，能让最优秀的兽人战士进入狂化状态，对可怕的魔法也有一定的抵抗能力
  - name: 生命魔法
    summary: 只有晋级战争祭祀之后才能领悟的燃烧自己生命换取魔法的力量，对比蒙祭祀属于自杀行为
  - name: 禁咒
    summary: 人类魔法师中最厉害的几个可以呼唤天外的陨石，将一个城市变成燃烧的火海，一千年中也出不了几个
  - name: 魔法卷轴与魔法增幅物
    summary: 人类制作的复杂卷轴可不经长时间吟唱瞬间发出魔法，宝石与魔兽晶核能为其源源不断补充魔力
  - name: 祝福战歌
    summary: 海伦在情感的瞬间领悟中自然进化出的战歌，不靠乐器与晶核增幅即可吟唱，令她自动加冕战争祭祀
  - name: 心灵锁链战歌
    summary: 权杖祭祀才能学习的秘语战歌，可让最多四个战士的生命变成互相分配的资源，即使遭受超重伤害也能留下最后生机
  - name: 狂化战歌
    summary: 比蒙祭祀专门针对海族炮灰兵种的反向加持战歌，一次性覆盖范围达四十万平方，让海族战士成片无声倒伏
  - name: 血之祭奠的诅咒
    summary: 圣坛祭祀的宠物非自然死亡后把魔法元素力量嫁接给祭祀的现象，千年只有两例，代价是战歌失效并背负魔法反噬风险
  - name: 美杜莎徽章
    summary: 比蒙祭祀召唤与收回魔宠的凭信，古款美杜莎徽章还需冬眠结界之歌才能制作，神庙祭祀带着大量古款徽章内盛驯兽师调教的猛兽
  - name: 龟壳
    summary: 刘震撼魔宠模特留下的巨大龟壳，肋纹只有四根，壳上有神秘文字与黑点，福格森.徐认定它是东方龙子霸下的遗骸
  - name: 夜明珠
    summary: 从巨龟下颌掏出的鹅蛋大明珠，遍体流光溢彩，内部滚动着气流一样的雾气，夜里照亮周围半径十五米
  - name: 血渍袜子布条
    summary: 刘震撼唯一属于原来世界的袜子，裁成布条系在海伦发梢与果果脖子上，成为爱情的见证
  - name: 狼皮与狼皮靴
    summary: 母风系魔狼的蓝皮被剥下做褥子，海伦用鱼棱骨针为他缝制狼皮靴
  - name: 竹筏
    summary: 用整棵佛肚竹编成的双层筏子，配狼皮与水箭兔皮缝的破帆，载着两人一鸟一兽漂过安第斯信风海域
  - name: 香瓜
    summary: 刘震撼在岛上栽种的翠皮条纹香瓜，出海前赶上第一批成熟，成为漂流途中留给病中海伦的珍贵水分
  - name: 卧牛石
    summary: 竹林边四方形的青色巨石，足有二千多斤，果果举它验证诅咒，刘震撼单手掀飞它砸倒无数佛肚竹
  - name: 水晶竖琴
    summary: 美人鱼公主艾薇尔拨弄的乐器，叮咚之声不绝于耳，歌声妖异媚惑摄人心魄
  - name: 大鼓
    summary: 刘震撼向海伦推荐的乐器，理由是抡起来威风且帮子上可以镶嵌许多储存歌力的魔兽晶核
  - name: 血玉扳指
    summary: 福格森.徐双手拇指各戴一只的血玉扳指，殷红中透出雪白图纹，又名芥子扳指，云秦金人平时便收纳其中
  - name: 斋殆金人
    summary: 云秦始皇帝收集六国青铜兵器熔化铸成的青铜巨人，身高十米，靠奇门遁甲阵法与水银符箓驱动，可立于水面，现存四个
  - name: 离水玉佩
    summary: 摩韶族仅存的一块玉佩，上面有云秦方士篆刻的阵法，佩戴者不必回到水中也能生活，此种阵法已经失传
  - name: 红铅
    summary: 云秦帝国皇室专用的宫廷催情药，方士自幼学习炼铅化汞为君王秘制，需以催情极品的巨型海马入药，一年也炼不出几颗
  - name: 定石
    summary: 栓在船上的棕绳结头处的上好玄武岩，每块有奶酪那么大、重十至十八磅，被刘震撼抓起砸塌了鲸鱼武士的鼻梁
  - name: 生锈的巨型铁锚
    summary: 班尼路武士菲高插在珊瑚鞍鞯下的巨大武器，取自某艘沉船，三个勾起的锚尖生满红色铁锈
  - name: 猎鲷叉
    summary: 潘塔族熊猫武士使用的带倒钩三股渔叉，冷杉木叉柄，狂化后掷出可穿透魔鲨武士与虎头鲨
  - name: 卡帝乐鳄鱼撞角
    summary: 镶嵌在蓬莱号船头的鳄鱼形撞角，是当年卡帝乐族扬子鳄武士与海族契约的象征
  - name: 龙丹
    summary: 东方龙子脱壳化龙后，壳上五截肋纹中凝练岁月精华而成的丹药，据说服下能与日月同老
  - name: 心锁战歌
    summary: 又称发如血与心灵锁链战歌，刘震撼自然进化后能够使用的战歌，可与他人形成生命连锁、平均分担伤势
  - name: 长生不老仙药
    summary: 云秦始皇帝命方士出海寻找的仙药，找不到便不许归国，云秦后人为此漂流千年仍每五十年派船寻访
  - name: 宫廷朱红丹药
    summary: 福格森.徐拿出的珍珠大小朱红色药丸，声称可让海伦与人鱼公主在两天里补足身体最缺乏的元气
  - name: 海市蜃楼幻术
    summary: 摩韶族蚌人的幻术，只以光线欺骗人的视觉，甚至能变出拖着影子、带着狐香的假刘震撼
  - name: 金色珊瑚銮车
    summary: 西雅海族王子西米里安的座驾，由四条长达十刃的海龙拽行，金盔金甲与三叉戟是海中皇族的威仪
  - name: 风灯
    summary: 熊猫武士在暴风雨中放起的四角方形灯，表面像纸糊，却能固执地升上乌云遍布的天空
  - name: 海螺号角
    summary: 海族魔鲨武士与正规军团使用的号角，吹响时连潮汐的声音都被淹没
  - name: 双修结界
    summary: 又名星空倒影，是美人鱼夫妻相爱至深才会出现的领域结界，会映出对方心中的念头，幻化出的水元素人鱼可作天然魔法盾，每千次进化一次并最终打开星空之门
  - name: 星空之门
    summary: 双修结界已知的第一次进化产物，能在身后的结界中打开一道互相连贯的空间，让双修结界中的任何一人跨越空间阻隔出现在对方面前
  - name: 赑屃神珠
    summary: 龙子赑屃龟壳四肋中的四颗珠子，分别是避水珠、避火珠、避土珠与避木珠；凑齐第五颗避金珠便可褪壳化龙，五珠同服可长生不老
  - name: 避水珠
    summary: 刘震撼项链上的龙珠，只有避水、避风与避火三种用处，进入水面后能在方圆五刃之内拓开一条干燥道路供人行军渡河
  - name: 避土珠
    summary: 赑屃四神珠之一，被人鱼佩带或服下后即可像正常人类一样在陆地上生活
  - name: 探骊得珠
    summary: 蚌人天生采珠手用来摘取龙珠的秘法，能破开连魔狼风刃都难以伤害的坚硬龟壳
  - name: 祭祀袍
    summary: 比蒙祭祀的身份标识，红色为灵魂祭祀，白色为战争祭祀，黑色为权杖祭祀，绛紫色配塔尖帽则是维安大萨满
  - name: 祭祀专用乐器
    summary: 战争祭祀用来增幅歌力与魔兽晶核配合的专属乐器，必须在亲自猎取到魔兽晶核后才能决定款式与制作
  - name: 祭祀法典
    summary: 封面用娟秀比蒙古文书写、扉页以吐火罗灯芯草纸张装订的典籍，记载战神教义与比蒙种族的兴亡往事
  - name: 生命锁链战歌
    summary: 刘震撼曾经用来救回海伦性命的战歌，能用彼此的生命去证明爱情，令西马克子爵大为吃惊
  - name: 兽浪结界
    summary: 西米里安王子的领域结界，结界升空后能幻化出十刃高的巨浪乃至几百匹由海浪组成的奔马，把沿途的船只与植物踏得七零八落
  - name: 地行龙
    summary: 维安大萨满齐丹的亚龙魔宠，小山般巨大，龙眼中带着目空一切的藐视，能收入美杜莎徽章冬眠
  - name: 熔岩雕齿兽
    summary: 人马祭祀普约尔的火系顶尖魔兽，骨板鳞甲与狼牙棒一般的骨质长尾，被果果一套拳击打得吐牙翻倒
  - name: 唐古拉冰熊
    summary: 沃尔夫权杖祭祀雷德克纳普的霜雪冰冻系魔兽，能喷出半寸长的冰息，却因主人被果果偷袭而落败
  - name: 酸液鱼鹰
    summary: 海伦的魔宠，能吐出酸液，因威瑟斯庞神庙祭祀嘲笑其魔法微薄而让刘震撼被称作厄运兽祭祀
  - name: 金属蛋
    summary: 李察王子手中色彩斑斓的金属蛋，上面插着交叉的剑与法典，镶着小宝石，在阳光下闪烁七彩光芒
  - name: 巨木图腾柱与战神塑像
    summary: 坎帕斯神庙前二十刃高的战神坐像，左手握锯形大剑、右手按法典，月台下还有与真物等大的美女蛇、巨熊米纱与豪猪李德三尊魔宠雕像
  - name: 弯刀上的宝石
    summary: 刘震撼那柄弯刀刀柄上的四颗宝石，被他全部撬下来送给西马克子爵抵作几百人的伙食费
  - name: 蓬莱号
    summary: 刘震撼从海族手中夺来的巨大航船，载着熊猫武士、摩韶蚌女与三百童男童女横渡爱琴海域抵达多瑙荒原
  - name: 骑士伺从头衔
    summary: 西马克子爵以子爵身份所能封赐的最高奖赏，让博格村监狱的匹格们眼红不已，约克夏四十岁也不过是小队长
  - name: 密集阵
    summary: 原名黑龙的弹簧狼牙棒，全由雷霆山脉的星辰精钢锻造，柄轴可转动使狼牙短刺从蜂巢般的洞眼中弹出，柄底空洞能藏细刺剑，号称两千磅实际只有一千一百磅
  - name: 记忆魔法水晶
    summary: 篆刻着复杂魔法符录的水晶圆球，能记录人的影像，往往出现在人类奴隶贩子手中用来记录货物的姿色
  - name: 彩蛋
    summary: 李察王子送给海伦的见面礼，上面珠光宝气，刘震撼估计能值不少钱
  - name: 尼龙袜子条
    summary: 刘震撼送给海伦与凝玉、艾薇尔的发带，被海伦视为珍宝并以此拒绝王子的绸带
  - name: 水晶皇冠
    summary: 艾薇尔的水晶皇冠，刘震撼本想拿去换钱，最后又给她戴上
  - name: 云秦斋殆金人
    summary: 每个重达二十四万磅的巨大金人，已历经数千年战斗、伤痕累累，是刘震撼压箱底的召唤战力
  - name: 柳叶匕首
    summary: 矮人大师制作、半尺长的柳叶状弧度匕首，去掉护手并抹上毒药后由獒人学作飞刀
  - name: 棱枪
    summary: 潘塔熊猫武士的掷枪，射程高达一百码，三棱枪尖能洞穿骑士昂贵的战盾，本章一出手便夺去七八十名骑士性命
  - name: 踏弩
    summary: 多洛特公国的军用制式弩，要用脚来上弦，射程长达两百五十码
  - name: 软甲
    summary: 用陆行地蜥皮和森蚺皮制作的大号皮甲，是重装板甲之外比蒙武士可得的护具
  - name: 星尾龟晶核
    summary: 圆锥盾体结晶，足有鸡蛋大小，通体粉红瑰丽光泽，是能储存很多歌力的顶级晶核
  - name: 星尾龟珠
    summary: 星尾龟下颌中取出的鸽卵大小漆黑珠子，散发奇妙酒香，浓缩了香酒百合酒液精华，泡水一夜即成醇厚原酒
  - name: 龙珠项链
    summary: 凝玉用龙子贡献的夜明珠做的项链，只能避火、避风和避水，不带避电功能
  - name: 猪皮地图
    summary: 西马克子爵交给刘震撼的比蒙王国疆域地图，用猪皮硝制，发黄模糊，害得他找不到墨晶峡谷的标的地
  - name: 香酒百合
    summary: 霍比特半身人酿制朗姆酒的原料，叶似翠竹沿茎轮生，花色郁白状如喇叭，散发甜甜馥郁的酒香，也是星尾龟最爱的食物
  - name: 霍比特朗姆酒
    summary: 霍比特半身人用香酒百合酿制的美酒，是赛酒大会上不能缺席的佳酿，连狼骑兵闻到都咽口水
  - name: 猡莎兽后腿棒骨
    summary: 獒人自己挑选的武器，白生生的大棒骨，在星尾龟身上一敲就集体断成两截
  - name: 亚龙兽坐骑
    summary: 李察王子召唤出的骑士坐骑，一匹长满了剑刃一般骨甲的亚龙兽
  - name: 密集阵狼牙棒
    summary: 刘震撼自称为辅助乐器的蜂巢大棒，弹出弹进的狼牙刺可一棒打开漫天血雨，杆首圭状手柄中藏着寒光四射的细刺剑
  - name: 元素之泉
    summary: 森林精灵凝结的精华，可瞬间补充祭祀歌力与魔法师魔力，盛在自然长成的木壶中，被刘震撼偷灌走两加仑又被喀秋莎偷喝大半
  - name: 生命之泉
    summary: 刘震撼交给三位夫人种植的泉水，一滴就可以让一棵树达到十年的生长期，科里纳多倒了半袋子便催生出整片竹林与桫椤蕉林
  - name: 星尾龟龟珠
    summary: 千岁星尾龟的漆黑色龟珠，泡在水中数日即成高纯度酒精，饮用会让人送命，被刘震撼用来现场制酒
  - name: 桫椤蕉种子
    summary: 上古神龙时代的植物，如今已经绝迹，茎干高达八刃，羽状叶片中是最上等的蕉肉，收割之后还能继续长出
  - name: 千色茑萝种子
    summary: 已经绝种的植物，开出的每一朵花都有独特颜色，可给女孩子染指甲并装饰府邸，结的红色果实能吸收体味
  - name: 精金钵盂
    summary: 唐藏帝国亲王送的黑碗，精金锻造，最贵重的金属，其武器无坚不摧，被刘震撼当场拒绝收下
  - name: 白色玉佩
    summary: 唐藏帝国亲王交给刘震撼的信物，质地温润触手温暖，后被凝玉拿来换钱，成为赎回的对象
  - name: 暗精灵女王的皇冠
    summary: 地底七度金制作的皇冠，从暗精灵女王身上搜来，人类商人一眼认出却不敢收
  - name: 艾薇尔的水晶皇冠
    summary: 用冰封之海的水晶制作，被人类商人认为是天价的皇家收藏品
  - name: 冥界黑水晶
    summary: 刘震撼在暗精灵女王身上搜来的墨色水晶，出自幽暗地底
  - name: 兽皇宝石彩蛋
    summary: 李察王子送给海伦的礼物，被刘震撼拿出来变卖，人类商人一眼认出并推还
  - name: 地狱黑龙的龙晶与龙皮
    summary: 巴掌大的墨色龙晶通体华贵，龙皮被龙炎烧坏大半，刘震撼用仅存的一小块制作了一把乐器
  - name: 冰蚌珍珠
    summary: 泰穆尔拉雅雪山冰泉中的珍珠，由万年冰晶凝结而成，入手彻骨冰凉，可让食物长时间冷冻不腐
  - name: 雪蕉
    summary: 只生长在高高冰川上的猛犸族珍宝，白色略带芝麻点的表皮，入口冰冷彻骨后转为香糯甘甜
  - name: 米纱徽章
    summary: 圣殿骑士的徽章，与美杜莎徽章异曲同工都带有冬眠次元空间，用于召唤神庙提供的坐骑
  - name: 沙漏摇铃
    summary: 海因策战争祭祀的辅助乐器，一对镶嵌着粉红魔晶
  - name: 科摩多战争巨兽
    summary: 能和云和雷电的精灵对话的双系魔法魔兽，庞大到让圣殿骑士的坐骑惊惶，背负战鼓与銮辇踏入战场
  - name: 猡莎兽膀胱水袋
    summary: 刘震撼用来盛水与装酒的皮囊，被他当成酒壶递给牧树人，又用来装元素之泉与生命之泉
  - name: 科摩多战争巨兽阿拉贡
    summary: 海伦的魔兽，食用过歌唱水晶、能同云和雷电的精灵交流的极品电系魔兽，一口咬掉蕉树树冠，喷酸液与链状闪电摧毁整片雪蕉林
  - name: 金人魔偶
    summary: 刘震撼召唤出的四个天神般高大的金人，其中一个乌黑倒卧，是他震慑猛犸与熊地精的最大凭仗
  - name: 桫椤蕉与桫椤蕉林
    summary: 上古龙兽最喜欢食用的香蕉，刘震撼从牧树人手中换来的种子与秧苗，是他收编猛犸族的筹码
  - name: 泰穆尔拉雅雪蕉
    summary: 猛犸族全族心血伺弄的雪白色粗壮香蕉，长在雪蕉洞的蕉叶间，是俄勒芬一族不可缺少的食物，被毁后猛犸全族只能迁徙
  - name: 藤蔓舟
    summary: 桑干河边前沿兵站为拓荒者准备的渡河大船，用荒原上油分很足的野葡萄藤编成再经暴晒收缩，坚硬到军刀只能砍出四分之一深的缺口
  - name: 藤蔓盔甲
    summary: 艾薇尔提议仿照海族海苔盔甲、用坚硬藤蔓精心编织花纹制成的廉价盔甲，用以解决领地买不起钢铁盔甲的困境
  - name: 刺剑弦子
    summary: 刘震撼的歌力增幅乐器，镶着一块地狱黑龙晶，被当作歌力储存器使用
  - name: 地狱黑龙晶
    summary: 镶嵌在刺剑弦子上的极品魔晶，本可封存几首完整战歌，却因刘震撼从不冥想积攒歌力而经常空空如也
  - name: 姜之忍耐夔歌
    summary: 邪恶光环类别中的迟钝之歌，刘震撼以自创战歌《红土高坡》的形式唱出，使敌人动作变得如木头人般僵硬迟缓
  - name: 邪恶光环与辉煌光环
    summary: 比蒙战歌的两大类别，辉煌光环加持己方战士属于辅助，邪恶光环加持敌人属于攻击，后者极耗歌力
  - name: 麻痹闪电
    summary: 泰穆尔拉雅雪山蝾螈集群释放的电气系蹩脚闪电，只有眩晕与迟缓效果而无杀伤力，仍能麻痹科摩多战争巨兽
  - name: 象牙长刀
    summary: 猛犸力士人手一柄的象牙磨制利刃，长达两刃、质地坚硬却不锋利，砍中后熊地精无一具身体完整，在人类世界可换一栋房子
  - name: 钉头棒
    summary: 地精强盗的主战武器，用荒原上生长几十年的铁皮仙人掌枝桠修凿而成，结实且尖刺不易折断
  - name: 青铜大斧
    summary: 熊地精首领的兵器，取材于地下挖出的神魔大战时期的青铜兵器，只有最强的地精勇士才有资格使用
  - name: 铁嚼子
    summary: 翡冷翠大迁徙中大车上拉车野猪的罩头，由博格村乡下作坊用两块弯曲废铁敲成，被刘震撼徒手拉成弯钩用以钩裂熊地精首领的嘴
  - name: 箬莎草纸
    summary: 比蒙王国所有纸张中最便宜的一种，一个金币一刀，凝玉用鹅毛笔在其上记录熊地精的供词
  - name: 《祭祀法典》
    summary: 崔蓓茜送给刘震撼的比蒙经典，扉页注释称爱琴大陆的文明是站在地精肩膀上发展起来的，最末页记载了地精的辉煌历史，并对歌力透支有最重要的注释
  - name: 泰穆尔拉雅蝾螈
    summary: 会放麻痹闪电的小魔兽，被刘震撼拔了舌头养在狼牙棒柄洞里，听话便给奶淇淋吃
  - name: 三棱猎魔枪
    summary: 熊猫武士的招牌兵器，五十码内能破开撸盾贯胸，刘震撼独闯剃刀山时借来一支，用它挑飞四辆滑刃车后断成两截
  - name: 猡莎兽后腿骨棒
    summary: 獒人最初使用的骨制武器，中空的骨茬扎进巨魔身体后会被气压吸住无法拔出，却在第一波攻击中就断成两截
  - name: 棱枪与红松鼠尾绒球
    summary: 熊猫武士的棱枪，枪头用银链拴着红松鼠尾绒球，拔枪时那团凸起物会让受伤的巨魔自己都呻吟出声
  - name: 酒醉狂化
    summary: 潘塔族熊猫武士靠高纯度酒精进入狂化的种族天赋，是他们能成为古丝绸大陆最强比蒙的神秘原因
  - name: 大醉侠焚身烈焰
    summary: 熊猫在酒醉狂化后喷出腹中烈酒、与空气摩擦燃起的烈焰，能把冲上来的巨魔燎成巨大的火人
  - name: 比蒙战舞
    summary: 《祭祀法典》中记载并已失传的技艺，只有自然进化的祭祀有几率领悟，与战歌同用可同时出现两种战歌效果
  - name: 斯迈禁空战歌
    summary: 斯迈族天鹅祭祀独有的秘语战歌，使空气产生束缚力让飞鸟从高空坠下摔死，对巨龙却无法产生束缚
  - name: 罗侬撒歌剧
    summary: 用来鉴定未知生物的战歌，海伦在崔蓓茜教导下学会，消耗歌力不大
  - name: 山岭呓语之歌
    summary: 石肤战歌的别称，能让目标皮肤变成石头一样坚硬，海伦两天之内便已掌握
  - name: 水刃风暴
    summary: 艾薇尔捏碎魔法蚌壳卷轴后召出的水系魔法，硕大的水刃带着盘旋的空气在雉堞上乱舞，把一排地精战士横扫成血雨
  - name: 蚌壳魔法卷轴
    summary: 艾薇尔用桑干河里的大蚌壳篆刻魔法阵制作的卷轴，能让她轻易召唤出大型水系魔法，但缺少贵重香料与魔兽血液这些原料
  - name: 藤甲
    summary: 艾薇尔带领妇孺用野葡萄藤经纬编织的盔甲，用千叶茑萝花汁染成金光灿灿，刷上猡莎兽脂肪油暴晒后坚硬到能磕出火星
  - name: 千叶茑萝
    summary: 海伦栽在红土笋旁的花，每朵有海碗那么大且一根枝蔓上颜色绝不重复，花汁可染指甲与头发，结出的能吸收体味的果实因受不了寒冷全部黄萎
  - name: 奶淇淋
    summary: 刘震撼发明的甜品，用桫椤蕉掺羊奶捣烂、以猛犸族的冰珠镇凉再用蛋皮裹成，连河马诗人吃了都发誓不走
  - name: 参薯
    summary: 竹林里豚鼠带来的野生块茎，只有麻雀蛋大，霍比特半身人烤成面包，刘震撼用木炭烤出金丝或磨成浆掺蜂胶糖，喝起来像羊奶
  - name: 古尔冬琴
    summary: 河马诗人奥尼尔随身携带的乐器，用来弹唱《可爱的睡莲花》一类的情歌
  - name: 多洛特之歌
    summary: 佣兵之国多洛特为表彰自己在与比蒙战争中的英勇请吟游诗人创作的军歌，在比蒙领土上明目张胆地唱出
  - name: 《比蒙史诗》
    summary: 与《祭祀法典》齐名的比蒙珍贵史料，又名《河马史诗》，由河马人写成，比法典更详细地记载了比蒙曾经经历的苦难
  - name: 米纱坐骑
    summary: 圣殿骑士以交出全部附庸族为代价向神庙换取的坐骑，维埃里的是四刃高、前爪长达十二寸的巨型树獭，歌坦妮的是一头独角兽
  - name: 香囊
    summary: 迪尔族鹿头人奴隶藏在腰部皮下的圆型皮囊，散发丝丝药香，人类佣兵宰杀老弱奴隶只为把它掏出来
  - name: 记忆水晶球
    summary: 卡佩罗侯爵手中记录五位美女与匹格领主幻像的水晶球，被吟游诗人窥见后画成油画传遍整个爱琴大陆
  - name: 刺剑龙晶弦子
    summary: 刘震撼的专属乐器，用刺剑做柄，以地狱黑龙魔晶封存战歌，曾封存罗侬撒歌剧未知物品鉴定之歌。
  - name: 魔兽血液
    summary: 人类魔法师制作魔法卷轴的必备原料，也是绿魔萨满法杖神术的动力源，须与神术光环同色，高阶魔兽血威力更大。
  - name: 樱桃木法杖
    summary: 食人魔一支认为樱桃木是智慧之树，树龄五十年以上者可为森林指明向南的道路，杖身刻有巴巴鲁克智慧之文并以魔兽血灌注凹槽。
  - name: 战歌卷轴
    summary: 刘震撼用樱桃木木轴与魔兽血液制成的瞬发战歌载体，此战共带十五根，除三根灵魂锁链战歌外还有五根狂化、五根迟钝；砸出后能召唤邪恶光环或辉煌光环，只有灌输本人歌力的魔兽血液制成的卷轴才起效
  - name: 豹皮坎肩
    summary: 凝玉为刘震撼缝制的五排插袋坎肩，用来插满几十根战歌卷轴。
  - name: 七度金皇冠
    summary: 用七度金制作的暗夜精灵女王皇冠，被小猪崽喀秋莎偷送给歌坦妮。
  - name: 圣弗郎西斯科银币
    summary: 人类国度制式钱币，正面印皇冠，背面印郁金香与流苏，并带有国名简写字母。
  - name: 獒人号角与河螺号角
    summary: 翡冷翠的警报器物，河螺号角一响全领地即刻转入战备。
  - name: 大地獭
    summary: 剃刀山地精豢养的五刃开外巨兽，不逊于地行龙，前爪锋利獠牙森亮，是其杀手锏。
  - name: 暗夜精灵女王的皇冠
    summary: 刘震撼藏在床底的孽缘纪念品，被小猪崽偷出送给歌坦妮。
  - name: 古力矮人青铜火铳
    summary: 一万年前地精大贤者加布林与矮人大贤者道根合作制成的究级武器，总产量仅一百支，此战出现的一支完好无损，一刃长，扳机和握把枪托上雕有镂空花纹并镶嵌硕大纯净宝石，铳口前端装着半尺长的铳剑，膛线是手工拉割的，花纹与楔形文字都是上古风格
  - name: 桑葚状铜弹
    summary: 青铜火铳的弹药，外表全是光滑可爱的小疙瘩，没有底火，靠触碰或撞击爆炸后以弹片穿透盔甲杀伤，刘震撼用匕首轻斩半分便引爆，一名熊地精奴隶因此丧命，用三十磅力气摔在石头上也会爆炸
  - name: 灵魂锁链战歌卷轴
    summary: 能召唤辉煌光环把伤害由施法者与受术者分担的战歌卷轴，刘震撼用它把光环贯入重伤的科里纳与两头倒卧的猛犸巨象体中，果果也用它救回了吐血倒地的艾薇尔
  - name: 通灵战歌卷轴（站在高岗上）
    summary: 刘震撼唯一制作的通灵战歌卷轴，除智慧启蒙与安抚灵魂之外的唯一附加功能就是定心灵契约，被果果折断后为果果签下巨鹤与仙女龙安菲特里忒两个魔宠
  - name: 献祭战歌
    summary: 最高阶的辉煌类别战歌，刘震撼自主狂化后以自创激昂战歌召出，辉煌光环直径惊人，覆盖范围足有两百个平方，比蒙战士浑身浸浴神庙供奉战神的祭坛之火
  - name: 迟钝之歌（海克斯咏唱）
    summary: 崔蓓茜教授的两个邪恶光环战歌之一，邪恶光环范围约五十平方，能让地精骑兵动作像木头人一样僵硬迟缓，是此战胜利的关键
  - name: 力量汲取之歌
    summary: 崔蓓茜教授海伦的另一邪恶光环战歌，分为三个进阶，第一阶段就能在每次播洒光环时汲取地精骑兵三分之一的力量加持到附庸族战士身上
  - name: 塞壬虚弱战舞
    summary: 海伦施展的邪恶光环战舞，与力量汲取之歌配合让形势变成一面倒
  - name: 闪电护盾
    summary: 权杖祭祀级别的守护战歌洛丹伦守护者直歌所召唤，八面闪电盾牌浮现在迅猛龙四周，把接近的骑术出色地精骑兵电得浑身冒烟
  - name: 山岭呓语战歌
    summary: 崔蓓茜接近前线前早已准备妥当的战歌，因民兵已改为反冲锋而没能用上
  - name: 最后的挽歌
    summary: 以生命作为代价召唤星云连锁闪电的战歌，海伦学会还没有几天，在阵前刚唱响就被崔蓓茜用凝眸石化术截成两段
  - name: 凝眸石化术
    summary: 崔蓓茜的种族异能，能将人石化，但对处子无效；她用它将弟子海伦石化以中断最后的挽歌
  - name: 云秦金人
    summary: 刘震撼召唤出的巨大金属人形魔偶，云秦帝国为陆战设计的终极武器，重二十四万磅，此战中三个金人硬挡五头洞穴巨熊骑士，两个金人滚过强盗战阵压死两千人，一个金人被打断了一条腿
  - name: 龟壳盾牌
    summary: 龙子大人的龙龟壳与星尾龟大龟壳，门板一样大小，立起来如两块磐石般挡住强盗的手斧、梭镖与箭雨；刘震撼还抡起它砸开一片空地，维埃里也抡起星尾龟龟壳
  - name: 洞穴巨熊重甲
    summary: 强盗预备队五头洞穴巨熊身上的青铜甲片，做工精细、甲片加厚，光这套战甲重量就超过一千磅，爪上还套着青铜爪尖；刘震撼缴来其中一身作为独闯剃刀山的最外层甲胄
  - name: 大地獭铜甲
    summary: 从大地獭身上剥下来的铜甲，被刘震撼披在藤甲之外作为第二层甲胄
  - name: 犄角青铜头盔
    summary: 生着犄角的巨型青铜头盔，是刘震撼三层重甲造型的一部分
  - name: 羽翎衣
    summary: 凝玉在刘震撼出征前替他披上并整理衣领的外衣
  - name: 翡翠之梦
    summary: 仙女龙一生只能使用一次的种族异能，可通过心灵召唤与神圣巨龙遗留的龙威召来附近一只巨龙或强力魔兽，并能抽取该魔兽的元素力量自行使用
  - name: 元素反噬指
    summary: 仙女龙的天赋绝技，能让人类魔法师的魔法、比蒙祭祀的战歌、魔族巫妖的通幽术与死灵术全部反噬施法者本人，被魔族巫妖尊称为死亡一指
  - name: 虹吸火炼术
    summary: 仙女龙通过翡翠之梦抽取巨鹤体内魔力才能支撑的连续滚龙般火焰，烧了刘震撼许久也烧不动他的火免疫之身
  - name: 银霄斗气
    summary: 天鹅女骑士歌坦妮的斗气绝技，刘震撼当众宣称这是自己的本事，还用它骗过了仙女龙
  - name: 瞬间移动与翔空术
    summary: 仙女龙的空间魔法与风系魔法，能凭虚幻的波纹凭空消失或浮上天空，刘震撼认出这是人类空间魔法师的传送门与科勒恩逃脱术一级的手段
  - name: 火焰盾牌
    summary: 仙女龙以单手挥出一道圆弧绕出，用来防御物理攻击的护盾
  - name: 飓浪斩
    summary: 水系魔法中单挑型的上品魔法攻击手段，威力大、力道强，艾薇尔用魔法蚌壳卷轴急速召出，却被仙女龙一指化成柔软水波
  - name: 波涛护盾
    summary: 艾薇尔捏碎另一个魔法蚌壳卷轴召出的半椭圆护盾，拦在她的头上挡开角楼投来的梭镖
  - name: 滑刃车
    summary: 剃刀山守山用的纯木结构四轮小车，面朝斜坡的一面木头挡板上插满了青铜刀刃，一辆总重量起码在八百磅左近，四辆前后成排冲下山道
  - name: 十二刃冷杉树矛
    summary: 强盗用未剥皮冷杉树削成的超级长矛，长达十二刃、粗可双抱，须得七八个最强壮的强盗架在撸盾上才能抬起，泼上油点燃后可逼退怕火的猛犸巨象
  - name: 巨型撸盾
    summary: 强盗步兵前排四人一组抬控的两刃高巨型木盾，被猛犸骑兵身后拖拽的檑木滚子撞出无数裂纹，也被刘震撼与维埃里用龟壳撞过
  - name: 檑木滚子
    summary: 猛犸巨象屁股后面拴着的檑木磙子，能在转弯时腾空划出弧圆撞裂撸盾，但也会拖慢猛犸群的速度
  - name: 石头神像
    summary: 剃刀山地精平放在栅栏门后、由一帮地精战士用撬棒推动的十几刃高石像，被当作滚石沿山道碾向刘震撼
  - name: 床弩
    summary: 剃刀山箭塔上架设的弩机，用两指粗鹿筋绞索制作，射出的指头粗细巨弩包了一层铜皮，能穿透最外层甲胄
  - name: 火瓜
    summary: 剃刀山角楼与箭塔上砸下的大冬瓜状物，翠皮已经萎缩，摔破后爆出红色汁水，遇火箭立刻燃起青色的冲天烈焰
  - name: 蟒珠与斐雯丽魔晶
    summary: 巨鹤从斐雯丽毒蟒的蟒首中衔出的艳碧色珠子与塔状七彩魔晶，连同一颗还在跳动的蟒胆一起被推到果果面前当作礼物
  - name: 铜弹鹿皮袋子
    summary: 刘震撼从大地精王者身上搜出的一整袋桑葚状铜弹，足有百来颗，被随手赏给了麝人阿杜
  - name: 竹板与极品魔晶
    summary: 果果手中的竹板能敲击出清脆的魔晶声响，还曾在最后关头脱手撞开射向刘震撼胸口的青铜弹丸，竹板碎裂、魔晶飞到草丛中
  - name: 牛皮战鼓与猡莎兽骨捶
    summary: 海伦的战舞乐器，战鼓响彻云霄，骨捶在石化的姿势中仍被紧紧抓住
  - name: 三角铃与十字银剑
    summary: 崔蓓茜的战歌乐器与佩剑，在目睹献祭战歌时双双掉落尘埃
  - name: 象牙大砍刀
    summary: 科里纳狂化后手持的双刀，砍断后便从背上再抽出两把，完全放弃防御大开大阖
  - name: 竹矛
    summary: 熊猫武士背后背着的成捆削尖竹矛，两支一起出手时让强盗的v字阵线出现巨大缺口
  - name: 魔法蚌壳卷轴
    summary: 艾薇尔随身携带的瞬发水系魔法卷轴，捏碎外壳即可召出水刃风暴、飓浪斩与波涛护盾
  - name: 玄铁重甲与米索莉铠甲
    summary: 维埃里身上的米索莉铠甲被狂化战歌卷轴的红光崩成碎片，他原本披挂的重甲也挡不住强盗的武器
  - name: 点歌卷轴
    summary: 刘震撼独创的比蒙战歌卷轴，折断即能召唤战歌光环，只有拥有相同龙息的他与果果可以使用
  - name: 龙晶弦子
    summary: 刘震撼背后掖着的歌力增幅乐器，上面镶着硕大的地狱龙晶，被他一把扔在地上震慑仙女龙
  - name: 地精军刀
    summary: 地精大贤者加布林一万年前制作的折叠工具，可掰出锯条、青铜锹、铜刀刃、铜针、鲨鱼皮锉刀、伸缩柄与蛛丝丝弦
  - name: 古力火铳
    summary: 被娜迦补充风系魔力之后射程达到两千码的火铳，刘震撼把它插在燕尾服内侧的插袋里，两百码之内百发百中
  - name: 摩拉丁怒火
    summary: 麝人以麋鹿角大弹弓发射的铜弹，射程高达一百五十码且全距离都是有效射程是对付空骑的利器
  - name: 金钢实
    summary: 点金桑果实腐烂后留下的纯金属内核，质地胜过优质碳钢且元素契合性良好
  - name: 点金桑
