  - 科摩多战争巨兽能吞噬它们想吞噬的一切，胃中的强腐蚀酸液甚至连石头也能消化
  - 科摩多战争巨兽生性温和，一般不会主动攻击，但当它们受到攻击和被阻碍进食时，会变成最可怕的敌人，进食的时候不能骚扰
