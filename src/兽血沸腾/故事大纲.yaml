  - name: 珊瑚妇人
    summary: 寇涛人鱼进贡的地底湖泊象牙珊瑚美女像，每一千年自湖底圣井诞生一尊，肤色洁白、蓝色眼眸，身体柔韧温暖有弹性，胜过任何智慧种族
  - name: 马龙水晶
