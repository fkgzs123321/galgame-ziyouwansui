    summary: 青雅.白玉拼了五百年修行才用来挣脱束缚的丝绸大陆法术，之后她带着伏波珍珠钻进了七宝塔
  - name: 水晶宫领域
    summary: 革瑞恩进阶潮汐大公爵后获得的新领域，集水压与冰冻为一体
  - name: 爆骨萤磷
    summary: 许德拉吉安娜的亡灵魔法，燃烧骨质中的磷质彻底摧毁生命，歹毒无比
  - name: 伏波珍珠
    summary: 三枚序列器珍珠之一，内里吸满温度足以涮火锅的硫磺沸泉，此战未及在魔族军队身上开苞
  - name: 翡翠黄金三重冕
    summary: 刘震撼送给教宗布拉特的礼物，翡翠黄金镶嵌、冠心饰以夜明珠
  - name: 夸克多水银弦战弓
    summary: 对膂力要求极高的长弓，弓臂以魔法水银制作，射程超过对手最少双倍
  - name: 八分银隋珠
    summary: 薇芝送给贝克汉姆的蛇珠，能弥补不会释放覆盖类法术的缺憾
  - name: 巫师变羊咒
    summary: 被普斯卡什大师改造，使本该变成绵羊的魔法作用力变成贞德母亲的形象
  - name: 巫师裸女咒
    summary: 由巫师变羊咒扭转而成的变形咒，所幻化的裸女同样是贞德母亲的形象
  - name: 自杀卷轴
    summary: 由三百童男童女制造的战歌卷轴变体，能产生星云连锁闪电
  - name: 幻兽座龙（基头座龙）
    summary: 兼具飞行能力与两三百吨力量的人造幻兽，可变换为金毛巨兽或龙人射手，被龙城追认为虹彩龙
  - name: 奥术香料
    summary: 施展亡灵天灾这一死灵系顶级禁咒所必须消耗的大量特制香料
  - name: 大风战舞
    summary: 海伦利用战舞翻译出的战歌，能让祭祀释放大风歌的光环
  - name: 碧浪潮生曲
    summary: 布吕克纳老公爵十年漂泊海外领悟的战歌，可汲取动植物生命力转换成双倍元素力量
  - name: 圣甲虫跳弩
    summary: 圣荷西帝国皇家制式跳弩，以弹性机簧单发连射十二枚金属十字刃，百米内可削穿高级魔法护盾
  - name: 暴雪星陨轮盘
    summary: 冰雪女神教从未动用过的镇教神器，元素波动与序列器珍珠极为相似
  - name: 奥喀理拉魔法水银徽章
    summary: 以最名贵水系特种魔法金属锻造的龙领领主徽章，遇水汽能幻化出实质彩虹
  - name: 仙道樟魔芯
    summary: 温格赠给十太子的植物系魔芯，延伸弹性高达二十米，可变幻成任何武器并储魔增幅
  - name: 镭射宝石
    summary: 用于在假设的结界盲点位置标出红外座标的魔法器具，使魔法部队能在黑夜中实施集群性精确打击
  - name: 黑索银
    summary: 白银矮人以白银提炼的爆炸物，一磅白银仅得两打兰；以秘银提炼的黑索银装成炮弹威力堪比禁咒
  - name: 海菲冰
    summary: 北地冻土层下天然凝结的紫色冰块，能像火油一样旺盛燃烧且泼水不熄，是巴比伦巨炮的廉价炮弹
  - name: 魔法水银弓
    summary: 夏宫仆射团使用的长弓，弹性超强、贯穿力霸道，射程高达上千码
  - name: 大黄床架弩
    summary: 东方巨弩，大如卧床，上弦后是一粗九细的十支铁叶翎箭，属攻城武器
  - name: 泰穆尔拉雅油瓜
    summary: 翡冷翠战略武器，靠生命之树、永恒月井、永恒月藻与绿巨人的嫁接技术增产，库存一万四千多颗
  - name: 三足金蟾金属豁免法袍
    summary: 以三足金蟾皮所制的法袍，供警卫旗队的十六位年青恩特穿着
  - name: 驮都戒指
    summary: 刘震撼送给儿媳安瑞达的戒指，足以保证魔导师级别的法力
  - name: 云系法术与驭云法阵
    summary: 丝绸大陆普及的冷门法术分支，篆刻在武器上可托载神兽升空飞翔
  - name: 五行防御大阵
    summary: 唐藏皇室绝密的军用守城设备，一城仅配一套，由金木水火土五个系列的钻石制成，分置五个方向自动联成蛋形屏障，可拆解重布为四象、三才、两仪防御大阵
  - name: 堪典罗盘师与司南罗盘
    summary: 能根据天文星相与山川走势测定风水方位的阵法灵魂，五行防御大阵缺其相助便无法重布
  - name: 九宫数独阵
    summary: 云秦方士设在七宝塔地宫的禁锢法阵，比八门金锁阵更高一级，可圈禁闪烁瞬移并隔绝声音
  - name: 秘密笔记
    summary: 第一代云秦寻药方士只传长房的笔记，详细记载各大著名阵眼，含七宝塔与海上诸阵，可解九宫数独阵
  - name: 万里飞云
    summary: 唐藏朔士装备，靠金属八角牌上篆刻的大型法阵聚拢云雾托出浮云结界，最大可承载上千人，动力全凭高空狂风，无法在阴雨天使用也不能充当军事要塞
  - name: 镭射镜炮
    summary: 圣荷西镭射宝石与翡冷翠传送水晶的双重产物，聚焦型烧灼光线，红外准星保证七百码内百发百中，对金属物穿透烧灼效果优秀
  - name: 战歌图腾柱
    summary: 神曲萨满李察制造的战歌武器，以每根为半径、四周二百五十个平方内禁绝中级以下魔法，是三维立体作用范围，木头所制并不值钱
  - name: 雪铁龙战剑
    summary: 魔族六翼天王的佩刃，号称全魔界第一锋利，后被文泰克莱尔用于对唐藏女剑神之战
  - name: 比亚乔
    summary: 凝玉随身携带的大砖头式通讯器具，可拨通坐标联系地宫内的骨联宝盒
  - name: 画眉弓与金习羽箭
    summary: 唐藏第一神羿手的战弓与羽箭，弓臂嵌象牙画眉鸟，弓弦以不知名白丝织成，箭身刷满金漆且不装金属箭镞
  - name: 回风拂柳箭
    summary: 唐藏神羿手的箭罡之一，羽箭洞穿麻雀后自行返射回箭囊，爱琴称之为燕返
  - name: 情人箭与流星蝴蝶箭
    summary: 唐藏神羿手的箭罡，前者双箭齐飞，后者旋出银球爆散成星屑蝴蝶绞碎大片麻雀
  - name: 雷动九天箭与九阳箭
    summary: 唐藏神羿手的箭罡，前者如旱雷碾滚云层震落麻雀，后者一分为三再一分为三共裁成九枝飞箭
  - name: 树欲静而风不止
    summary: 丝绸木系介质类罡气，专属于神羿手，靠木箭达到各自匹配的风速爆出风系芒刃，别人修炼也无用
  - name: 金介气
    summary: 丝绸目前最流行的罡气，又称驭剑，可让短剑暴涨出长达十米的金色剑罡
  - name: 铁血狂化
    summary: 文泰克莱尔悟出的攻击型狂化，靠怒意与自我催眠调动鲜血并由金属武器引导释放，能在武器上镀出均匀静止的血色锋芒，攻守兼备且增加物理力量
  - name: 截血指
    summary: 青雅.白玉得自神秘流浪前辈的指法，以随时流动的血头为目标截断血液，能作用于任何有血液的生物并令其身体僵硬如石
  - name: 秘孔术
    summary: 丝绸大陆流行的武技，以人形生物体表固定的一千多个筋络秘孔为攻击目标，可令人无法动弹甚至瞬间致死
  - name: 隔山打布尔拳
    summary: 丝绸大陆传统武技，讲究隔物击物甚至隔空击物，青雅.白玉恰好精通
  - name: 毒火龟珠
    summary: 自赤火毒龟法江体内探出的惨绿色龟珠，内有一簇跳动的暗赤火焰，可加持出毒火溅射能力
  - name: 雌雄双剑
    summary: 唐藏女剑神三世同堂的双手短剑，剑穗为雅黄色，可暴涨成两柄三米长的金色巨剑
  - name: 橘黄色宝剑
    summary: 青雅.白玉随身佩剑，颜色古怪并散发着怪异香味，被刘震撼以雪铁龙一剑格飞
  - name: 金丹
    summary: 丝绸大陆可补充法力的丹药，共有九转
  - name: 金刚草
    summary: 五殿下幼时偶然服食的灵草，使他凭空得来一身六丁六甲之力
  - name: 潘塔狂化
    summary: 文泰克莱尔模仿潘塔武士醉酒狂化而成的狂化攻击，借武器与自我催眠喷出酒液燃起大醉侠焚身烈焰，不费血只费烈酒，但只有一次使用机会且酒液不具切割力
  - name: 香雪稻
    summary: 麋人书儒种植的巨型稻米，每一颗粒至少两尺半长，稻香沁人洁白如玉，吃一口能饱三日，被刘震撼称作东方的莲菝丝
  - name: 皇家显影之尘
    summary: 可拆穿一切元素伪装的魔法道具，靠磁力共振发动极细微的试探性魔法攻击，只有显影作用而无破坏能力
  - name: 胡克火控小组与魔法定律师
    summary: 靠魔法仪器丈量建筑结构、推算出结界重点布防区域与胡克盲点的法师小组，负责用镭射宝石标注红外座标以引导定点突破
  - name: 奥喀理拉魔法水银法杖
    summary: 以四大特种魔法金属之一奥喀理拉魔法水银镀镏的特种金属法杖，唯一作用是增幅双倍的水系魔法威力，连禁咒也包含在内，由虹彩龙领领主徽章熔铸成十根
  - name: 老房子腰带
    summary: 斯蒂法诺大师临时借用的无名腰带，以六翼炎魔翅皮缝制可增幅百分之十火焰之力，另镶地狱黑龙骊珠、八分银蛇珠、许德拉九曲珠、碧炎龟珠与一排血羽之心
  - name: 卡理亚纳重压水瀑与卡素斯火焰绝唱
    summary: 文托拉与斯蒂法诺准备召唤的两个宗师级大型魔法，与领域力量只差一步之遥，仅辐射范围不广且一次定型无法随法师意志移动布控，本分片中被用作诱敌的假动作
  - name: 有花堪折直须折
    summary: 高阶希芙精灵指挥棒挥洒出的加持术，人类法师称作断音释放，受术者咏唱咒语时可直接省掉最后一段音阶提前放出完整魔法
  - name: 湮甲箭
    summary: 爱琴人类依靠炼金优势研制的魔法箭，打破了爱琴巨龙无敌金身的神话，使屠龙在理论上可以实现，本分片正是它射杀了花廷四大守山神兽
  - name: 精金箭
    summary: 夏宫箭手的制式箭矢，即使不篆刻湮甲魔法阵，精金武器的切割力也足以让巨龙皱眉
  - name: 萨鲁曼巫师之眼
    summary: 由近千颗超阶魔兽之眼做成的侦测器具，可在高空自由移动并辐射数百里地面，把鸟瞰景象忠实反映到魔法沙盘
  - name: 魔法沙盘
    summary: 与萨鲁曼巫师之眼配套的战略指挥沙盘，最高分辨率可精确到土拨鼠脸上的雀斑，翡冷翠魔法太保另在其上拓印了一比五万的高空俯瞰地图并标注经纬度
  - name: 帝维晶卡
    summary: 贝克汉姆随手抛给值星官的记录媒介，熟悉翡冷翠领主作战风格的人都知道里面必然拍摄着屠城实况
  - name: 加菲九条命
    summary: 莱茵王族附庸加菲猫人的种族异能，非正常死亡后逐一变为木乃伊武士、骷髅武士与气冰土木水火六种元素巨人，每被摧毁一次进化成下一形态，现仅十三名加菲拥有
  - name: 仆莱伯艾三窟
    summary: 泰戈王族附庸兔人的种族异能，能在地面震裂出三个大窟窿，对冲锋中的骑兵是致命打击
  - name: 神仆
    summary: 美杜莎死亡后诞生出的僵尸蛇人，既是不死之身又隶属宗教信仰，能召唤出十个骷髅弓箭手，波拿巴大陆答应支援五百名
  - name: 珍珠七弦琴与目之丁冬和弦
    summary: 天下霸唱家族带来的操琴指法与战歌，可释放目滴水箭，萨尔陛下已把整套指法帝维普及下发给风语祭祀
  - name: 猎鲸弩
    summary: 警卫旗队恩特保镖配备的岸基弩炮，全金属结构，可同时发射五枝带亚麻拖绳的巨型锚钩箭
  - name: 金百合花
    summary: 紫色霞云指间凌空打旋的金色花朵，被刘震撼屈指取下花瓣后弹出，可射穿木棉树与石头地面
  - name: 凤形佩剑
    summary: 紫色霞云腰畔的丝绸名刃，剑柄为凤凰形状，剑刃上游弋着叠成七彩的漂亮云纹
  - name: 七杀碑
    summary: 云雾山花廷山门前由石兽驼住的白玉巨碑，刻有七条擅闯、解剑、放浪、怪力乱神、心怀叵测、亵渎仙子、妄议玉皇者杀的禁令，被壹条添上此处禁止随地大小便一条
  - name: 豹姬图
    summary: 幽帝在英雄大会上拿出的彩头，图里封印了一个幽冥美人和一只僵尸豹子，都可放出作战，幽冥美人也能伴寝并吸食他人精华自补法力
  - name: 鞋杯
    summary: 用美人鞋子做成的酒杯，丝绸大陆视其为第一风雅香艳之事，因丈夫也未必能触碰妻子莲足而彰显身份高贵
  - name: 黑白珍珠耳链
    summary: 刘震撼送给唐藏女剑神三世同堂的贡物级奢侈品，银藤耳链各镶一黑一白两粒珍珠，黑的是可浸水泡出柑橘味饮料的蜜蜃珍珠，白的是可供消夏镇凉的雪山冰珠
  - name: 万年玉钟乳
    summary: 丝绸大陆六脉剑罡的速成灵药，喝下一滴可永久穿行于血液中保障一根手部主脉贯通，玉皇亦能靠控玉之力从服食者血中将它召成利刃
  - name: 斋殆扳指
    summary: 刘震撼押上赌桌的血玉扳指，内藏一尊云秦金人与一堆废铜，能把召唤咒传给五殿下
  - name: 法力遗忘珍珠
    summary: 可以让别人永久遗忘一个法术的绝世珍珠
  - name: 火符
    summary: 丝绸大陆的通讯工具，明黄色纸鹤扇翼悬浮空中，擦燃时发出类似火柴头的声音，花廷留守兵力靠它疯狂求援
  - name: 祟脂玉瓶
    summary: 玉皇身上盛放万年玉钟乳的颈枝秀雅玉瓶，后文又写作祟脂玉净瓶
  - name: 黑昙金棍
    summary: 可以无限延伸的魔界金属长棍，九太子对敌时可突然暴长数尺如长枪贯通对手
  - name: 东方三尖两刃刀
    summary: 东方卡帝乐武士的兵器，以古代特种配方锻造的云秦玻璃铜制成，与物体摩擦时会突然产生电流，在禁魔领域中依然能爆发能量
  - name: 雷霆酒桶
    summary: 七宝塔地宫中发现的书儒武器，熊猫武士使用时依靠摩擦产生强大碳化电流，属于能量武器
  - name: 玉洗
    summary: 财神玉盂的真名，只能手动制造单质和无机物的落后机器，有机物体的克隆不在其能力范围之内
  - name: 离水保湿徽章
    summary: 爱琴称呼为安尔乐徽章，能让海族脱离雾蔼海洋上岸而皮肤不失水气，老刘用原版法阵图与分解设计图向魔界海族换兵
  - name: 霸下龙珠
    summary: 邓肯掌控的龙珠，老刘召他到魔界就是为了驱云散雾清开雾蔼之洋
  - name: 马龙水晶传送阵
    summary: 一次可传送八十个单位且需持续消耗法力的水晶传送设施，特制后可自行吸收风系力量用于跨位面迁徙
  - name: 九宫玉露丸
    summary: 花廷炼制的丝绸丹药之一，随上百口花梨木箱一起被搬进领主大厅
  - name: 三转金丹
