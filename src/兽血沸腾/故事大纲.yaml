  - name: 杯弓蛇影箭法
    summary: 暗精灵一族独有的高强箭法，以身做弓、把弓弦解下刚好塞满一个酒杯，是传说中解放了弓箭手双手的箭法
  - name: 角斗术
    summary: 羚牛一族故老相传的绝技，利用坚硬而犀利的牛角作为武器配合手中图腾柱，是一等一的亡命打法
  - name: 先祖之魂
