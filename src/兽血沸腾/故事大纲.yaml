  - name: 巨锚
    summary: 菲高的长柄武器，长达十刃、重两千磅，附火系与风系魔法阵
  - name: 大凡歌
    summary: 穆里尼奥正在研制的使用风刃进行攻击的比蒙战歌，若成功将是比蒙祭祀的第一首攻击战歌
  - name: 英捷尔法勒
    summary: 普斯卡什大师独创的气系魔法，只能用于隆胸且尺寸固定为三十六艾芙即木瓜大小，加持后气体封闭于皮下组织无法撤销，须拿中空狗尾巴草慢慢搓入放气，属不入官方记载的野路数法术
  - name: 魔法信传送阵
    summary: 佣兵工会之间互相通达消息所需的空间传送阵，购置与自建都耗费巨大
