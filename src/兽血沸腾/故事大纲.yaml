  - 东方大陆的元素潮汐比爱琴大陆更加浑厚，所以东方神兽能够轻易修炼成人形
  - 鲮鲤就是穿山甲，古称维金兽，是当年与矮人齐名的爱瑟开山者，比蒙王国为数不多的矿场全由鲮鲤族打理
  - 鲮鲤族有一门秘不外宣的铁甲术，可将肌肤化作铁甲般坚硬，使指甲锐利如凿
  - 指芒是斗气剑芒中的不传之秘，特点是瞬发，修炼关键在于贯通手脉，最高等级为五级五指芒刃
  - 羽萝斗气属于木属性的斗气，是延续威力最长的一种斗气
  - 爱琴苦行僧侣有五种祷言，分别是止血咒、愈合咒、度血咒、宁神咒和超度咒
  - 佛巨人有十种祷言，除爱琴僧侣的五种之外还有大雷音怯毒咒、断续咒、甘露催眠咒、安胎咒和沸血咒
  - 丝绸大陆的苦行僧侣教义是舶来品，传承和翻译过程中存在不少文化断层与互相矛盾之处
  - 所谓自然投影是空间磁场的特殊作用力造成的，原理与蕴涵丰富磁场的记忆水晶、帝维水晶相同
  - 在爱琴大陆，姓名链接越长越意味着血统纯正，母姓来自母亲，父亲的完整姓名则原样保留
  - 比蒙王国法典规定，祭祀的配偶若暗地犯下偷懒罪，奸夫必须接受决斗、以鲜血赎还祭祀的尊严
  - 奸夫怯战并携情人远走高飞时，宗教裁判所会发出荆棘通辑令，飞鹰传书各地祭祀追缉
  - 奸夫的配偶将代替丈夫犯下的可耻错误，沦为那位被侮辱尊严的祭祀的专用女奴，财产也作为补偿折冲
  - 比蒙王国的祭祀力量已经形成军方、夏宫和神庙三大势力体系
  - 异族通婚在比蒙中没有传统，但神庙一直很鼓励异族通婚
  - 比蒙中拥有元素力量的基本上只有祭祀，魔法师实在太少
  - 金冠角斗大赛每年一度在威瑟斯庞举行，角斗士借它重新获得自由，主委会甚至允许一对二的局面
  - 波拿巴大陆大致位于比蒙王国的西方，盛产橡胶和矮小的毛人，距离爱琴大陆究竟多远谁也说不清楚
  - 龙族夫妻大多性格独立，怀孕期间因妊娠综合症闹到老死不相往来是很有可能的事
  - 人类把矮人的胡克反弹定律应用到魔法上，通过定律师使用科学测算手段找出敌人魔法护盾上的胡克盲点
  - 庞贝帝国的胡克火控小组由十名魔法定律师携带大量魔法仪器组成，隶属宫廷魔法师部队，既测算敌方护盾的胡克盲点也侦测己方结界的弱点
  - 圣弗郎西斯科帝国的宫廷法师部队配属魔法教练师，精通各式各样的魔法师战斗阵型
  - 白银基座战甲集合风系漂浮法阵、金属契合法阵和星云空间法阵三种魔法阵，能减重、自动闭合组装并汲取空气元素力量提供永恒动力
  - 比蒙有两大终极战令，第一种是荆棘草环征召令，第二种是更加极端的海廷加动员令
  - 海廷加动员令起源于海加尔时代，俗称割乳令，一旦下达，一天之内主战种族的成年妇女必须做好战场厮杀准备，附庸族成年妇女则在五天内做好战斗准备
  - 比蒙主战种族的妇女个个体型高大、天生巨乳，这个生理特征在格斗中非常碍事，所以割乳令要求她们割去右乳
  - 比蒙的十支主战之族是莱茵、泰戈、彼尔、布尔、豪斯、俄勒芬、匹格、沃尔夫、模特和左丹奴
  - 慕兰强盗的沙漠人类斥候给养全部通过停泊在西海岸的船只提供，他们和海族之间有贸易往来和对话渠道
  - 魔族有三百万机关憎恶叛军被全部逼在一个地下城之中，魔族必须留守大量军队防备这些叛军趁机作乱
  - 魔界的水晶矿非常丰富，充裕的传送水晶可以让魔族迅速部署好侵略兵力
  - 魔族天王就是爱琴所说的堕落天使，属于魔族最高阶层，统兵权最少是五十万
  - 哑月的回归还有半年时间，时空大裂缝原本应该在半年之后才开启
  - 故事发生在名为爱琴大陆的异世界，多瑙大荒原上有比蒙兽人各族，荒原之外还有人类诸国、海族、龙族与地底世界
  - 魔族入侵爱琴的战略是先扫平多瑙大荒原作为根据地，再一步一步攻占整个爱琴大陆，稳扎稳打的低姿态反而让所有爱琴种族头皮发炸
  - 亡灵天灾是死灵系奥术的顶级禁咒，必须使用大量特制的奥术香料，除巫妖王之外其他魔族根本没有能力召唤使用，而魔族全族只有三位巫妖王
  - 亡灵天灾有冷却时间，一次不成功就意味着巨大无比的损失；一万年前的神魔大战中，只有当时科技文明最发达的爱琴地精品尝过一次
  - 亡灵天灾对应特定的生命基因，再通过流动的人群大规模扩散，若无人因瘟疫大量死亡就不会产生恐慌与难民潮，传播范围便被锁死在狭窄区域内
  - 能释放亡灵天灾的地点是多洛特公国与卡瑞姆多大平原上范围够大的时空大裂缝
  - 吸香红豆可以立刻控制住亡灵天灾的传染源头，它由千叶茑萝的果实配合稀释后的生命之泉培植，千叶茑萝每一株都能结出上千颗果实
  - 爱琴的人类国度一共只有二十三个，其中圣罗兰士王国与圣瑞雪尔王国是两个永久中立国，其余国度在魔族压力下全部站到比蒙王国一边
  - 爱琴三大人类军事强国是圣弗郎西斯科帝国、庞贝帝国和东海岸的圣荷西帝国，军援计划由它们负责统筹
  - 爱琴人类总人口八千万，一半是白色雅非安人种，是科技最发达、魔法最昌盛的人种
  - 海族天生闭塞，根本没有途径知道时空大裂缝的提前开启和魔族即将入侵爱琴的消息
  - 龙领是某一支谱系巨龙的龙界统称，龙领的领主就是该支巨龙谱系的首领；爱琴每一支巨龙都有世袭领主，这是纯靠血脉延续的荣誉头衔
  - 经过漫长岁月与龙族生育率低下，爱琴龙领早已只存在族长而不存在领主，因此新任龙领领主是各系巨龙中唯一的一位
  - 龙领的领主与七彩龙、仙女龙一样同属上位龙族，若龙领的领主遭受攻击，就是整支龙领的战争
  - 爱琴普通巨龙习惯离群索居，但本系巨龙之间有特殊的精神联系方式，危急时刻能呼应领主的召唤一同抗击仇敌
  - 爱琴大陆各大巨龙谱系之间也有世仇死敌，比如地狱黑龙当年就和风系巨龙经常爆发战争
  - 虹彩龙是龙城为翡冷翠幻兽座龙新设的龙族谱系，这种亚龙拥有双倍于巨龙的体型和两三百吨的力量，弥补了龙族缺少正面肉搏金毛巨兽的龙种的短板
  - 爱琴大陆的异系巨龙通婚，雄性后代随父系魔法分系，雌性后代随母系魔法分系
  - 龙族禁止本族成员远涉其他大陆，这条戒律源自爱琴龙族对世界力量无比清醒的高度认知，贸然进入异族地盘会被群起而攻
  - 魔界的魔龙一族拥有噬龙这个技能，可以通过吞噬巨龙的皮骨晶核获得爱琴巨龙的魔法能力，理论上吞尽所有巨龙亚属就能成为全系魔法高手
  - 龙城城主的标志是飘逸清秀的龙角上烙有帝波罗和香帕的魔法刺青，这种右月左日的刺青意味着七彩龙和仙女龙两大上位龙族的核心主宰
  - 特种魔法金属只对应气、火、水、土四大主系魔法而生，比秘银和精金更加稀有；以特种魔法金属镀层制作对应本系的魔法杖，能将法师释放的每一个魔法威力整整扩大一倍，包括禁咒在内
  - 魔芯只有魔法植物才有，仙道樟是已知世界中最高级别的魔法植物之一，属于高阶类别
  - 爱琴的圣奇奥魔法师灭绝之后，人类魔导师就是魔法金字塔最顶端的存在，是唯一还掌控着禁咒法术的魔法师阶层
  - 魔法史在圣奇奥魔法师之上又添圣普魔法师与圣霄魔法师两级，刘震撼获爱琴魔法师工会承认为圣霄魔法师
  - 血侍与刘震撼是三位一体的元素生命体与元素宿体，本应是一个平衡的整体，元素精灵使若想使用魔法必须与主人分享
  - 四大纯血杜伊嘉尔分别是黄金矮人、白银矮人、野矮人和盾斧矮人，是守护整个爱琴四大擎天柱的泰坦血脉
  - 白银矮人擅长从银子中提纯出黑索银，如今已通过特殊的提纯和炼化确保安全无害地使用
  - 盾斧矮人具备独门的盾翼制造技巧，可以凭借两面飞盾在天空象小鸟一样翱翔，并利用手中的飞斧杀敌
  - 野矮人是四大纯血杜伊嘉尔中天生的炼金大师，信奉沉默是金，其分工明确、多人合作、配合默契的炼金方式被称为安特炼金模式
  - 地精工匠当年制造机械高岑的初衷只是伐倒参天古木，依照仿生学原理制造的蜘蛛体型可以让它攀山越岭如履平地
  - 时空大裂缝的时空紊流让一切生物在其中的衰老速度都放慢了许多，在里面待上一天比外面过一个月还要漫长
  - 丝绸大陆的人形神兽是登记在册的合法居民，身份如同翡冷翠的精灵与巨人，虽人数稀少却算本国人氏，钻了宪典的空子官府也无法事后追究
  - 丝绸大陆的人形神兽所炼化的法宝大多取材于自己身体中的某个部件，只能固定给自己使用，旁人是无法借用的，各门派都有绝不外传的炼制法门
  - 丝绸大陆的人形神兽级别越高越喜欢贴身作战，并用魔法装备辅助形成双重魔法攻击，这与爱琴超阶魔兽不屑使用魔法道具的习惯截然不同
  - 云系魔法与风系魔法同属气系魔法分支，在爱琴只有雾蔼巨人修炼云系魔法，因此爱琴炼金术中从没有出现过云系装备；丝绸大陆的云系反而普及，驭云法阵篆刻在武器上能托载神兽升空
  - 丝绸大陆的炼金技术远远不如爱琴，但制药技术远远高于爱琴，山清水秀、灵草奇葩多不胜数，某些矿物和神兽的内丹都可以制炼药物
  - 丝绸大陆的丹药可以迅速止血镇痛、增长法力，罕见灵草奇花炼制的丹药能直接提升一阶修为且没有任何毒副作用，还能延年益寿
  - 丝绸大陆之所以会出现能够白日飞升的超级强者，主要就是靠丹药，单靠自我修炼很难达到度厄境界
  - 爱琴大陆炼药技术最好的当属僧侣，其次是牧师和巫医，僧侣被当成异教徒扫清之后炼药学一退三千里
  - 丝绸大陆有一句谚语叫上有鸿均门下有荷露城，鸿均门是东方传说中神祇们所居住的天上寝宫
  - 梵宇是丝绸大陆苦行僧侣们日常居住、研习教义的宗教场所，与主张不三宿空桑的笥葭教义其实相悖
  - 爱琴魔法理论中的召唤法术体系可分为八大类别，包括魔兽主动签约、龙语大召唤术、魔族死灵奥术与通幽奥术、卓尔精灵黑暗系魔法、比蒙圣坛祭祀的野性呼唤以及人类的将门召唤术
  - 人类的将门召唤术固定坐标于某一个异界且不可更改，一次性最多召唤三个魔宠并签定打手契约，召唤师可以借调一头魔宠的法力进行自主作战
  - 巨龙因为一生娶妻过多，血脉广布，远古巨龙的直系后裔并不罕见
  - 魔法传送阵是比蒙王国与人类国度之间调兵与转运物资的核心设施，王城的精灵魔法师数量较多，传送起来比南部行省更快捷
  - 丝绸大陆与爱琴大陆修行体系截然不同，丝绸修行者靠云系道具飞翔往来，从未发展出跨地域乃至跨空间的魔法传送阵
  - 唐藏帝国的官方炼金术士称「朔士」，本质与云秦方士属于同一范畴，是前朝翰留帝国的「东方朔士」挖掘古墓、发掘整理古云秦方士文化后重新建立起来的职业，如今主业是烧汞炼铅炼制丹药，法宝制造因古代阵法大规模失传已成为副业
  - 丝绸大陆以「书儒」称呼兽人，云秦时代战斗力最强的书儒大将被暴君骗进塔底地宫活活圈饿而死，这些书儒都是拥有超阶神兽的超级战将
  - 丝绸大陆的潘塔（熊猫）使用鼓腹滚圆、镶金错玉的金属酒桶作武器，是公认的王牌战士；另有东方卡帝乐武士使用战戟等长兵器
  - 丝绸大陆的法宝装备制造走尖端的是各支历史悠久的神兽门派，普及化程度高于爱琴，但更加私有化
  - 丝绸大陆的法宝装备多依靠身体零件炼化，只能给自己使用，别人不好借用；能批量制作的通用型法宝只有云系道具
  - 「五行防御大阵」是唐藏最机密的军用守城设备，一城仅能配发一套，只有大型都市才有资格拥有，需金、木、水、火、土五个系列的钻石才能制造，制作技术始终被唐藏皇室掌握
  - 「五行防御大阵」分五大部分设于所在地的五个方向，一旦遭元素攻击便自动联为一体，构筑蛋形法术屏障笼罩整个区域；未遭攻击时自动休眠隐形，理论上最高笼罩范围可达两个荷露城大小
  - 「五行防御大阵」必须配备专业的「堪典罗盘师」才能发挥威力，罗盘师可依天文星相与山川走势测定风水方位；部件被击破后可重布为「四象防御大阵」、「三才防御大阵」与「两仪防御大阵」，每缺一个部件防御就削减一重
  - 丝绸大陆的禁锢法阵与爱琴完全相反，爱琴禁锢阵需外人击败守卫、破坏中枢才能破阵，丝绸法阵则须先入阵，再由内向外按程序破解阵眼；「九宫数独阵」比「八门金锁阵」更高一级，可圈禁闪烁瞬移并隔绝声音
  - 云秦方士阵法大多湮没失传，云秦后裔最高只能掌握「七星系列」以下阵法，且布阵者之外其他方士并不知晓阵眼秘密；远赴海外寻药的第一代方士留有只传长房的秘密笔记，记载各大著名阵眼
  - 丝绸大陆的「秘孔术」以人形生物体表固定不变的「筋络秘孔」为攻击目标，共有一千多个，绝大多数并无用处；「截血指」则以随时流动的「血头」为目标，可作用于任何体内有血液的生物，但只能令身体僵硬，不能伤人
  - 丝绸大陆传统武技讲究近身格斗与套路，有隔物击物、隔空击物的「隔山打布尔拳」，武技水准高者如青雅白玉能令黎山门老母都自叹不如
  - 丝绸大陆把斗气称为「罡气」，人体手部只有六条筋脉（右手五脉加左手小指的三焦脉），故有「六脉剑罡」之称
  - 神羿手专修的箭罡属木系介质类罡气，名为「树欲静而风不止」，须靠木箭在空气中达到各不相同的最佳风速，才能爆出风系音爆、风系牵引、风裂与拟形风刃，别人修炼也无用
  - 丝绸罡气的「金介气」即驭剑，可让短剑暴涨出长达十米的金色剑罡，被爱琴人形容成把手电筒攥在手里照人
  - 丝绸神兽一旦拥有人形，外表与普通人类一模一样，绝不会有尾巴、角或翅膀；只有厥戎大草原上的神兽才会留有这种未完全进化的生理特征
  - 厥戎大草原的蛮族与当地神兽自古经常入侵丝绸腹地，与丝绸神兽是天生的死对头，故丝绸神兽见到长尾巴、生龙角的异类会本能地充满敌意
  - 比蒙狂化分「战歌狂化」、「二度狂化」与「自主狂化」三种，前两种只要外部条件足够任何比蒙都能做到，自主狂化则是高阶比蒙武士与天赋挂钩的专利，能让眼中所见的每个动作被放慢分解，即刘震撼所称的「蒙太奇视界」
  - 比蒙武技中的狂化、斗气、念力、锁息本水火不容，文泰克莱尔却能让它们共融于一身
  - 爱琴斗气谱系仅有火系、水系、木系、土系与金属系五种，金属系最普及，约一百个爱琴武士中有九十人修炼；爱琴斗气无法延伸至弓箭等远程武器，一旦武器脱手即被掐断传输通道
  - 爱琴曾有人修炼出十指指芒，历史记载中最高者为死亡领主萨穆埃尔，其次是只有六指的荒野游侠阿拉贡
  - 爱琴大陆只有血精灵能御剑作战
  - 爱琴大陆从未出现过完全笼罩城市的封闭式结界；圣瑞雪尔与圣罗兰士是爱琴两大永久中立国，专攻防守型魔法装备，圣瑞雪尔国立炼金室研制的「梦幻喷泉结界塔」由「魔法结界师」操控，以塔基与魔晶动力抽调活水喷出扇弧形水墙，可抵御魔法与部分物理攻击
  - 爱琴魔法体系中的「介质类法术」与丝绸的介质类罡气同理，斗气谱系与魔法谱系完全共通，故介质类斗气理论上也能诞生
  - 在爱琴魔法体系中硬给普通羽箭加持魔法称为永久加持，每加持一次法师退步四个级别，代价极大
  - 唐藏帝国幅员辽阔，各地方言不下两千种，皇家禁卫部队称「执金吾」，是帝国真正的高端力量；皇帝拥有三千号称万人敌的剑士
  - 「万里飞云」在丝绸大陆的地位等同爱琴的魔法传送阵，拥有者非富甲天下的巨贾即权势滔天的豪门显贵，金色是皇家独一无二的标志
  - 唐藏帝国本有四个亲王，其中两个已被皇帝除掉
  - 戈利德族鹰身人已经灭绝千年，如今只有圣坛祭祀与某些老牌贵族圈子还在使用古老的戈利德鹰语，鹰语是古代比蒙沙龙舞会中最优雅的社交用语
  - 丝绸大陆以纳芥装备收纳物品，故地宫宝藏可被整批搬空
  - 云秦时代的丝绸大陆也有数量稀少的金发人类，属杰出近身肉搏好手，擅长使用弹爪，因天生厌水晕船而未被方士出海寻药时带走
  - 潘塔（熊猫）是丝绸大陆公认的王牌战士
  - 七宝塔始建于云秦时代，塔身全铜构筑分镇天下九州，当年云秦暴君为消灭最强大的书儒武士，让方士在塔底造下禁锢法阵，把战功卓著的武士骗入地宫自行领赏，活活圈饿而死
  - 爱琴盗墓贼行话称「湿万载干千年」，有水的环境比干燥处更易长久保存尸体
  - 丝绸大陆有可补充法力的丹药，金丹共有九转
  - 比蒙狂化本是自身辅助型技能，只能强化防御与体质，从来无人想过把它研究出攻击力
  - 「铁血狂化」依靠蓬勃怒意与狂热的自我催眠调动体内鲜血，再借金属武器引导释放，把鲜血镀在武器上形成均匀静止的血色锋芒，既能攻又能守还能增加物理力量
  - 铁血狂化不属于任何一系的元素修炼体系，故级别虽能提升攻击力，人体血量却固定不变，永远无法靠修炼增加
  - 能施展铁血狂化者须先达到「自主狂化」境界；普通武士靠战歌狂化后理智失控，无法灵活掌握释放血量，实验结果是把浑身血液一次喷尽，威力只够十步之内
  - 狂信法师的狂热信仰与魔法师的冥想本质相同，都是盯住一个念头拼命幻想，属于精神麻醉与自我催眠，也是激发人体潜能最好的办法
  - 「潘塔狂化」是文泰克莱尔援引铁血狂化的套路、以武器和自我催眠喷射酒液而成的狂化攻击，模仿潘塔武士的「醉酒狂化」与「大醉侠焚身烈焰」，不必修炼东方炼气术，但只有一次使用机会且喷出的酒液不具切割力
  - 比蒙中的布尔族牛头人、契尔族猪头人与迪尔族鹿头人是反刍种族，天生四个胃，其潘塔狂化可以维持四次，战歌狂化与自主狂化的武士都能办到
  - 「双子座骠骑」指骑士与兽亲坐骑发生「同步狂化」的组合，骑士的血液加上坐骑的血液，铁血释放出的威力堪比魔兽，比蒙王国共有一百五十三人
  - 魔法想要为八百七十六人各加持一个辅助类魔法，需要八百七十六名魔寻师同时出手，加持完毕后全部退化为见习魔法师且终身不再有寸进；战歌的永久加持只需一名神曲萨满出手，代价仅是歌力略告消乏
  - 战歌的永久加持只能作用于人，无法作用于武器道具，神曲是唯一的例外；魔法的永久加持则可涵盖任何物体
  - 「永久冷静狂化」等于同时被永久加持耐力光环、肤甲光环、力量增幅光环、疼痛豁免光环与嗜血光环五大能力，受术者虽无「蒙太奇视界」，但狂化效果永不消失、终身伴随，不可豁免也不可驱散
  - 冷静狂化属于「单控狂化」的范畴；神曲萨满的战歌境界由「单控光环」继续向上突破即为「永久光环」
  - 斗气与狂化不能同时存在于一名武士身上，被永久加持狂化后斗气便彻底作废
  - 丝绸大陆的法术与爱琴一样按金木水火土谱系划分，唐藏宫廷十大执金吾仙长中的五位另创琴、棋、书、画、酒五大系新型法术，装备依次为焦尾琴、墨玉棋秤、紫金葫芦、如椽大笔与山水立轴
  - 酒系法术能做到水火共融，以紫金葫芦召出的水箭可有一半窜起淡蓝色火浪，爱琴魔法一直无法穿透这一禁区
  - 琴系法术靠拨弄琴弦释放音刃，其「淼刃」是浊黄色的水系上位魔法，带有桑拿三温暖般的高蒸热度，只能通过古琴召唤
  - 书系法术靠如椽大笔在空气中书写篆文，篆文即刻化作气弹，笔画越复杂威力越惊人，联句齐射就是一个大型魔法链，还能为白纸加持出不惧刀劈的气系魔法盾
  - 画系法术把山水立轴抛向空中铺开成小天地，即丝绸所称的「天地洪炉」，也就是爱琴的领域力量；「江山社稷图」已研究出罗浮、压顶、黑宙、光宇四种，分别对应失重、重力、混沌空间与强光领域
  - 棋系法术撒出黑白棋子即可拔地而起十六个石元素，含石盾武士、石箭手、石马骑士、石象骑士、石头战车、石鸟骑士与石头皇冠巨人，可在泥土、石头、美玉、沙砾中召唤，塘泥棋兵的躯体在召唤时限内抗打击能力不逊于钢铁
  - 丝绸大陆的法师并非开辟了新元素，而是开辟了全新的修炼模式，琴棋书画酒均可望突破各系元素的天然界线而自成一个魔法新系统
  - 「魔法定律师」与「胡克火控小组」靠魔法仪器丈量建筑结构，推算出重点布防的结界区域并列出可能性最大的「胡克盲点」，再用镭射宝石在假设盲点位置标出红外座标，供魔法部队实施集群性定点突破
  - 「皇家显影之尘」是可拆穿一切元素伪装的魔法道具，靠磁力共振发动极细微的试探性魔法攻击，只有显影作用而无破坏能力
  - 希芙精灵是没有攻击力但本领特殊的元素指挥家，能安全中断魔法师的持咒，其加持术「有花堪折直须折」被人类法师称作「断音释放」，可让受术者省掉咒语最后一段音阶而提前放出完整魔法；希芙还能布置层层过滤法术反击的魔法削弱屏障
  - 魔法湮甲箭由爱琴人类依靠炼金优势研制，具备跨时代意义，打破了爱琴巨龙无敌金身的神话，使屠龙在理论上可以实现
  - 高地希芙之外，夏宫卫队的制式弓箭射程恰好等同于床弩，箭手编制接近三个联队且用的是精金箭，三百码之内可直接洞穿躯体
  - 唐藏帝国的官方炼金术士称「朔士」，「万里飞云」即朔士装备，靠金属八角牌上篆刻的大型法阵聚拢云雾托出浮云结界，最大可承载上千人，动力全凭高空狂风自然驱动
  - 万里飞云无法在阴雨天使用，雷电会干扰破坏云层结构；过度遭受元素攻击时浮云结界的稳定也会被打破，因此只能作交通工具而无法充当军事要塞
  - 丝绸大陆神兽行会自发举办的竞技大赛称「英雄大会」，大型行会或帮派在大会上推出彩头招纳良才，历年此时草莽高手蜂拥聚集木兰城，官府执金吾必须到场布控防范
  - 想竞争「风尘四花」必须先同意为玉皇和花廷效命，获胜后还须回花廷大摆筵席定下名分，方能采取处子红丸
  - 爱琴商人采购丝绸瓷器其实都是在「娟之大陆」成交，该大陆横跨外海把暴风海峡拦腰斩断，人种语言与丝绸无异并自称为丝绸大陆，唐藏人则称其为娟之人氏
  - 木兰城是唐藏古都名城，盛产木棉与柔桑，古称「呕丝之野」，为东方书儒中嫘祖族蚕人的故乡，如今仍有蚕人专为皇室织绸刺绣
  - 麋人与蚕人是东方书儒中仅存于世的两个特例，因生活技能出色又无战斗力与桀骜脾性，当年云秦暴君才手下留情
  - 木兰城的蚕人姑娘若看中男子，便用丝绦牵在对方脖子上强行娶回家，若遭拒绝则整个家族都会来找其拼命
  - 桑干河出现密密麻麻的鱼潮是海族大军即将动手的征兆，这些带着旗鳍、鳞色五彩的巨鱼都是海族为大军储备的粮食；上一次海陆大战时八百里密西西比湖中也出现过同样的鱼潮
  - 海族的盟友是慕兰人，魔族的盟友是娜迦，海族一旦进军必然四面开花，人类必定先顾自己，比蒙在多瑙大荒原承受的压力最大
  - 慕兰帝国人口上千万，可组织起八十万到一百五十万军队，但无论走陆路横跨沙漠还是走海路都受淡水与后勤限制，故须由海族提供大量座头鲸鱼充当纤夫拉动运兵船，只要航速提高便可把淡水需求压到最小
  - 加菲猫人是莱茵王族的附庸，其种族异能并非寻常意义的九条命，而是非正常死亡后逐一变成木乃伊武士、骷髅武士与气、冰、土、木、水、火六种元素巨人，每被摧毁一次就进化成下一个形态，在魔法理论中属于本体死亡后仍能实行八次「灵魂仿生」
  - 仆莱伯艾是泰戈王族的附庸兔人，其种族异能「三窟」能在地面震裂出三个大窟窿，对冲锋中的骑兵是致命打击，大致相当于土系魔法中的「地裂术」
  - 「神仆」是美杜莎死亡后因不知名神秘原因诞生出的僵尸蛇人，既是不死之身又隶属宗教信仰，能召唤出十个骷髅弓箭手
  - 波拿巴大陆的原始土著只有长毛矮人，迁居当地的美杜莎已发展到五十来万人口并统治着将近三百万长毛矮人，两千年基本没打过仗
  - 人类国度原始山脉中仍藏有比蒙遗脉，中央山脉的豪斯部落约三千人，火鹘火山荒原的麝人与牛头人混居部落约五千人并已产生没有生理弊病的混血后代「麝牛人」
  - 只有稀有金属「伊斯西丁」打造的武器才能让普通比蒙武士冷静狂化，而比蒙王国并不出产这种金属
  - 「作战实验室」负责实时监控翡冷翠的魔法沙盘，成员从五大行省军队中抽调的幕僚军官组成
  - 「萨鲁曼巫师之眼」由近千颗超阶魔兽之眼做成，可在高空自由移动并辐射数百里范围内的地面，把鸟瞰景象忠实反映到魔法沙盘，最高分辨率的沙盘图像能精确到土拨鼠脸上的雀斑
  - 「时空大裂缝」的提前开启等于宣判了比蒙整体灭族的命运，罪魁祸首正是刘震撼
  - 丝绸大陆的法师工会职称比爱琴多一个级别，宫保仙师高于上素仙师，上素仙师又高于鼎湖仙师，宫保仙师相当于爱琴圣普，上素仙师相当于爱琴圣奇奥
  - 与爱琴圣霄魔师持平的度厄金仙在丝绸大陆不算法师级别，因为度厄金仙已经白日飞升，不能再划归红尘等级
  - 花爵中人并无上下直辖的从属关系，只有动用到花系法术时才能看出差别，四大花仙曾放话凡花爵中人都应归她们管辖
  - 唐藏官府碍于历史渊源不好插手江湖纷争，想竞争风尘四花的人必须先答应效力花廷才有资格上擂台
  - 合欢主人对越强大的金系修炼者吸引力越强，如同极品蜂蜜对于彼尔族熊人的诱惑，身为金枝玉叶的九太子无法拒绝这种天然魅惑
  - 万年玉钟乳是丝绸大陆六脉剑罡的速成灵药，喝下一滴就可永久穿行于血液中，保障一根手部主脉贯通；玉皇也能以控玉之力把它从服食者血中召出，化作透体而出的利刃
  - 云秦金人是古云秦时代方士文化的最高艺术结晶，谁拥有了它，几乎就意味着陆战无敌
  - 丝绸大陆的通讯工具叫火符，是明黄色的纸鹤，扇翼悬浮于空中，擦燃时发出类似火柴头的声音
  - 血系在爱琴魔法分系制度中确是水系的分支，但绝不是上位魔法，而是偏门外加堕落性质的魔法
  - 亡灵属于元素生命体，每一个亡灵都以灵魂力量构成生命形式，陰力极为旺盛；亡灵与亡灵结合是陰上加陰，不会有后代，亡灵与阳力旺盛的物质生命结合则阴阳调和，有微小几率诞生后代
  - 德鲁伊的新信条认为凡是生命体，无论是元素生命还是物质生命，都有延续后代的权利，都有平等的生存权，并公开反对种族歧视
  - 梓树化身天生拥有长青领域，可以让五十里范围内的树木替自己承受元素伤害，因此在森林地带几乎是不死之身，但龙城全是石头，领域便无从借力
  - 地底世界一共有三层大陆，每一层大陆的井梯都无处不在，想找出第四层森之原野大陆必须先发现一个井梯，再穿过无数地下立体洞穴
  - 时空道标的双向传送无豁免，被召唤到爱琴的异界强者若不摧毁召唤仪式或杀掉召唤师，冷却时间一到就得回原位面
  - 横跨时空只能靠马龙水晶传送阵这种稀有的水晶，一次只能传送八十个单位，而且需要持续消耗法力
  - 把深渊界到主物质界的时空道标与爱琴某个时空大裂缝的四维座标相加，再特制可自行吸收风系力量的马龙水晶传送阵，就能把整族子民迁徙到爱琴
