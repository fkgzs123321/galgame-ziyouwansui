items:
  - name: 鲸鱼骨长矛
    summary: 刘震撼从沙滩上庞大鲸鱼骨架敲下的断茬肋骨，长约一米五，是他在岛上唯一自卫的天然长矛，被风系魔狼的风刃削断后改成短刺
  - name: 椰瓢
    summary: 刘震撼吃剩的椰子壳，先当钢盔戴在头上，又用树藤穿起来做内裤遮住要害
  - name: 灰色涤纶袜子
    summary: 刘震撼身上唯一剩下的衣物，先后用作止血包、投射椰子的投索和钻木取火的引火拉索
  - name: 弯刀
    summary: 从触礁沉船上获得的羚羊角弧度弯刀，刀身有碳元素织成的织锦花纹，刀把镶宝石，刀鞘饰满异国纹理
