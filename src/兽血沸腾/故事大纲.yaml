    key_members:
      - 海因策（豪斯族半人马战争祭祀）
  - name: 苦行僧侣
    summary: 人类宗教中以刻苦修炼与风餐露宿锻炼意志的派别，掌握祷告抚慰之光，被圣保罗教以传播异端的罪名用十字架钉死，残余者漂流修行
    territory: 人烟罕至的地方
  - name: 德尔雷家族
