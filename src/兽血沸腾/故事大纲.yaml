    key_members:
      - 罗森博格
  - name: 猛犸族
    summary: 隶属俄勒芬巨象一族的毛象人，体格硕大魁梧、力大无穷，在泰穆尔拉雅雪山以雪蕉为食隐居千年，不上报王国官方
