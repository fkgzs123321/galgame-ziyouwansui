  - 对一个祭祀而言，拥有了生命礼赞就代表着绝对可以挑战整个大陆最强的魔兽而不落下风，即使对手是地底岩浆炎魔或者巨龙
  - 血之祭奠和生命礼赞同是比蒙圣坛祭祀中的两大传说中的传说，血之祭奠是可怕的诅咒，生命礼赞却是美好的祝福
  - 祭祀的假想敌并不是面对自己的比蒙祭祀，万一对手是一个人类龙骑士，人家在空中有一百种办法可以玩死祭祀
  - 祭祀依靠自己的魔宠去战斗本身就是巨大的缺陷
