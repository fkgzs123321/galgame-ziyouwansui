  - 张伯伦亲王号称每天都要和四名以上的女子同床，平生最爱美色佳丽，据说是他的母亲和哥哥乱伦后生下了他，与现任弗郎西斯科帝国国王是同父异母的兄弟
  - 多洛特两位驸马爷争相购买最美丽的女子讨好册封钦差，谁在美女上占得先机，加冕的胜算才能更大
