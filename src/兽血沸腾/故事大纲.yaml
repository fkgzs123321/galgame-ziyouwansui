volumes:
  - name: 荒岛篇
    first_chapter: 第一章 勇斗魔狼
    last_chapter: 第九章 望乡
    note: 穿越求生，遇海伦，收果果
  - name: 胸罩岛篇
    first_chapter: 第一章 胸罩岛
    last_chapter: 第十二章 血之祭奠的魔兽诅咒
    note: 受血之祭奠诅咒，以汉语自创战歌，得爵位
  - name: 海上篇
    first_chapter: 第一章 艰难的旅程
    last_chapter: 第十章 想唱就唱
    note: 海族与人鱼凝玉，海上征战
  - name: 多瑙大荒原篇
    first_chapter: 第一章 前倨后恭
    last_chapter: 第十二章 不厚道的妹夫
    note: 比蒙社会、部族与神庙，向翡冷翠迁徙
  - name: 博格村与翡冷翠初期
    first_chapter: 第一章 前进，目标是博格村监狱
    last_chapter: 第十六章 闷棍一般的竹杠
    note: 领主起步，领地初建
  - name: 翡冷翠领主期
    first_chapter: 第一章 以自由的名义
    last_chapter: 第十三章 这个小猪好厉害{V第十二章}
    note: 建国、军事与外交，领地经营
  - name: 比蒙王国纵横
    first_chapter: 第二章 翡冷翠领主
    last_chapter: 第七百零七章 大结局{下}
    note: 大陆战局与魔族入侵，终盘决战；原文缺第六百六十八至六百七十章
chapters:
  - name: 第一章 勇斗魔狼
    notes: 刘震撼在南疆战场中弹后于荒岛醒来，以鲸鱼肋骨为矛、椰瓢遮身求生，结识会模仿他动作的金毛小兽并取名果果；入夜通体瓦蓝的巨狼现身，口喷风刃削断骨矛，他以拳膝重创其鼻梁，最后扯下树藤要勒死它
  - name: 第二章 荒岛大采购
    notes: 果果在危急时喷出冰冻气团冻住巨狼风刃并将其击杀，刘震撼勒住狼颈致树藤绷断，随后取走狼皮狼牙制成弓与箭镞；他潜入海中撬开巨大海蚌，用蚌壳当锅煮海水制盐，还发现异界的月亮大得惊人
  - name: 第三章 救了一个狐狸精
    notes: 夜半狂风暴雨中一艘巨大风帆木船触礁沉没，刘震撼披着狼皮游过去登船搜刮，在压在最底层的大木箱里发现四五个长着狐狸尾巴的红发女孩；他只救出唯一还有心跳的一个，绑在桌子上撞开舷窗跳海带回岸边
  - name: 第四章 毛手毛脚
    notes: 刘震撼抱着赤裸的小狐狸用体温救她，用果果冻出的冰块和嘴对嘴渡椰汁退烧；他去砍红柳树时被一只会喷水箭的肥兔子射伤胳膊，回程砍树炖兔肉，换褥子时手又不小心抓到了小狐狸的尾巴
  - name: 第五章 造锅记
    notes: 刘震撼嚼碎兔肉和鱼汤一口口喂小狐狸，用弯刀在门口挖蓄水池，用弓箭射海鸟并以长袍做鱼线钓上一条四五斤的大鱼；他拿鱼肋骨穿上鱼肠给自己缝好手臂伤口，却在煮东西的蚌锅水面上看到自己塌成两个窟窿的鼻子
  - name: 第六章 狐狸精开口说话了
    notes: 刘震撼吃瓜吃坏肚子，一夜泻到几乎虚脱，醒来发现小狐狸已挣扎着做好饭并把褥子让给他；他铲回长着瓜苗的粪便移栽成瓜棚。小狐狸唱歌为他行智慧启蒙，两人接吻后她第一次开口说话，讲出处女花冠对祭祀的意义
  - name: 第七章 一首奇妙的战歌
    notes: 小狐狸自报姓名海伦.列娜，并按战神坎帕斯的指引给刘震撼取名李察；她讲述智慧启蒙与比蒙战歌、爱琴大陆上兽人人类矮人精灵的分布、千年前海加尔战役兽人惨败退守多瑙荒原的历史，还认出果果是霜雪皮丘兽魔兽
  - name: 第八章 奇妙的美女之族
    notes: 海伦讲解人类魔法师的缺点与禁咒威力、狐族萨满用星云连锁闪电掩护族人撤退的往事；她说明福克斯族因军功被封世袭贵族、自己有男爵采邑，又讲出狐香与狐族少女被贩卖的悲惨处境，认定刘震撼是天生的灵魂歌者
  - name: 第九章 望乡
    notes: 海伦说出比蒙没有大型战舰、西雅海族封锁海路，回家无望；刘震撼提议召鱼鹰当魔宠，并要她教自己燃烧生命的魔法；海伦透露自己才十五岁、祭祀十八岁前不能成家，还要他答应隐瞒人类身份以免被当做异端烧死
  - name: 第一章 胸罩岛
    notes: 刘震撼梦到与列娜洞房后醒来，为造木筏探遍全岛却无合用木材；海伦以通灵战歌召来酸液鱼鹰作魔宠并讲魔宠契约与天生灵魂歌者；他发现邻岛死火山口长满竹子，两岛退潮时以石梁相连，约定明日伐竹
  - name: 第二章 另类祭祀的启蒙之歌
    notes: 半月后两人登邻岛，海伦讲歌力靠冥想积累、战歌加持有五盎司沙漏时限、祭祀体质孱弱可收追随者；刘震撼苦练侦察兵锁技赛勃，果果跟着学压韧带；他在火山口唱起歌，山谷回声让海伦目光异样
  - name: 第三章 火山坑探秘
    notes: 海伦说他的歌声里有澎湃歌力，换成比蒙语再唱却毫无效果；她纠正他的粗口，两人斗嘴后她表白异族之恋的心意；他以树藤垂降二十多米深的火山口，把血渍袜子裁成布条系在海伦与果果身上
  - name: 第四章 自然进化的战歌
    notes: 谷底见幽深山洞，他涂满狼粪掩去气味潜入，手刀与扭颈连杀三只幼狼；出洞后海伦的战歌忽然变化，竟自然进化出祝福战歌，令他目明体敏；竹林深处随即响起母风系魔狼的示威狼嗥
  - name: 第五章 贪心猎人
    notes: 难产的母风系魔狼与头生鹿角的巨龟在竹林中央对峙；巨龟卡着一枚龟蛋、失血虚弱，风刃砍不动其龟壳；魔狼舍命扑咬咽喉，巨龟一爪把它半截身子砸进地面，气浪震得刘震撼险些呕吐
  - name: 第六章 刘大官人的处女召唤
    notes: 魔狼半截身子嵌在土里，他补箭穿喉；龟壳上刻着中国古篆数字，他惊觉刻字者与自己同源；他吟唱通灵战歌把巨龟收作处女魔宠，只收到赑屃断续的心念，巨龟随即死去，他泪如雨下
  - name: 第七章 草包变成了大儒
    notes: 海伦攀崖赶到，他用枯竹火葬巨龟并剥下半条狼皮；海伦辨出龙息，说导师崔蓓茜是亚龙祭祀、家乡神庙的维安大萨满是模特族龟人；她通晓多族语言却认不出龟壳文字，刘震撼自称认识
  - name: 第八章 胆大包天的龙蛋大餐
    notes: 海伦推断龟壳文字与李察同源，他不再提回家的事；他剖开龟尸掏出番瓜大的龟蛋烤着吃，果果同食，邀海伦共餐被婉拒；两人聊起霍比特半身人与匹格族贪食的原罪，海伦警告他不可吃自己的魔兽
  - name: 第九章 祭祀和魔法师的争论
    notes: 两人定下带走龟壳当帐篷，他从龟下颌剖出夜明珠，龟头内却无晶核；海伦讲晶核的用途与比蒙出口晶核的缘由，又论祭祀与魔法师、人类与比蒙的优劣；她将转职战争祭祀，选乐器时被他劝用大鼓
  - name: 第十章 只是当时已惘然的初夜
    notes: 海伦为大鼓一事生气又被哄好；刘震撼与果果吃下龙蛋后浑身滚烫，胸口浮出怪兽脑袋；海伦依狐族传说以处女花冠为他解除不良状态，两人在竹林中初夜，她自认背弃教导失去处女祭祀花冠
  - name: 第十一章 诅咒的前奏
    notes: 果果拖走羽衣并捅醒海伦，闹剧收场；海伦见他颈上有血色怪兽纹身，郑重警告祭祀不可随意文身；两人怀疑是吃下亚龙蛋导致的类狂化，她讲狂化战歌的威力、后遗症以及比蒙巫医的设定
  - name: 第十二章 血之祭奠的魔兽诅咒
    notes: 海伦先讲自主狂化的狂兽战士，再排除狂化，判定他中了千年仅两例的血之祭奠的诅咒，战歌效用只剩两成；果果因趴在他头顶吃下龙卵被牵连，被她称作厄运之兽，他护短改称幸运之兽
  - name: 第一章 艰难的旅程
    notes: 本卷章节号重置为第一章。果果举起二千多斤卧牛石验证诅咒，刘震撼掀石救它并感到双臂神力；两人乘竹筏顺安第斯信风漂流大半月，椰子被虎头鲨咬碎，海伦病重，拿仑角海峡在望
  - name: 第二章 发如血
    notes: 竹筏驶过拿仑角两侧的持剑巨神像，海伦弥留之际求他唱歌；他以比蒙通用语自创发如血，金色光线穿透海伦、鱼鹰与果果，竟施展出权杖祭祀级的心灵锁链战歌，海伦由此好转；礁石上传来美人鱼歌声
  - name: 第三章 蛮横的人鱼公主
    notes: 西雅帝国皇族美人鱼拨水晶竖琴现身，十二名骑虎头鲨的加布林魔鲨骑士围住竹筏；她称两人中只许一人活命，另一个要献给海神之妻安菲特里忒；两人以迎战作答，她遂命虎鲨骑士理查德出战
  - name: 第四章 交锋 才刚刚开始
    notes: 理查德以波涛之盾挡下果果的霜球，刘震撼用赛勃锁技徒手绞杀这位魔鲨骑士，把成型的水龙扼散；波塞冬请战被美人鱼以骑士荣誉喝止，公主自报名艾薇尔后骑海马离去；海伦提醒海族有出尔反尔的权利
  - name: 第五章 神秘的东方比蒙
    notes: 海伦力竭倒在刘震撼怀里，说祭祀是比蒙前进的明灯，不许他与强敌硬拼。刘震撼自称受诅咒的龙力祭祀，又提出入赘福克斯，海伦神色黯淡，哭着求他永不放弃自己。竹筏撞上巨船，东方比蒙古德自报蓬莱号水手长兼护卫。
  - name: 第六章 云秦旅人
    notes: 人类老者福格森.徐现身，自称祖先是丝绸大陆云秦帝国最优秀的方士，讲云秦横扫六国、始皇帝派三千童男童女出海求长生不老仙药，找不到便不许归国，族人从此定居澈桑大陆。蚌女凝玉以海市蜃楼幻术变出假刘震撼。
  - name: 第七章 海族又至
    notes: 凝玉讲明摩韶幻术只欺视觉，比不上猛禽德鲁伊。福格森.徐答应送二人回多瑙荒原，条件是让族人进入南十字星森林、泰穆尔拉雅雪山和落日大沼泽采药，海伦以男爵身份担保。海面浪起，海族再次追至。
  - name: 第八章 我是龙祭祀我怕谁
    notes: 虎头鲨群围船，班尼路族鲸鱼武士、西雅海国禁卫军总长路易斯.菲高现身，质问箭鱼被杀一事，抽出生锈铁锚要教训东方旅人。人鱼公主艾薇尔乘黑色海马再现，指认要船交出刘震撼与海伦两人谢罪。
  - name: 第九章 暗流
    notes: 鲸鱼武士掷锚，熊猫武士以渔叉硬拼成平手；刘震撼假意下跪，趁众人回头用定石砸塌其鼻梁又扇耳光。福格森.徐念咒召出两个十米高的斋殆金人，把鲸鱼武士拖入海中。海伦起身称战死沙场是比蒙祭祀最好的归宿。
  - name: 第十章 想唱就唱
    notes: 凝玉召十二金人围住海族，人鱼公主仍逼徐老头交出二人。海伦高唱悲壮的通灵战歌，凝玉唱摩韶送行歌，刘震撼自创狂化战歌使二十名潘塔武士狂化，古德一叉重创艾薇尔。刘震撼跳海捞回人鱼公主做人质。
  - name: 第一章 前倨后恭
    notes: 凝玉说明斋殆金人一日仅能召唤一次、每次不超过四盎司沙漏，且无法立于水面，云秦金人只剩四个。刘震撼以心锁战歌救活艾薇尔，赢得凝玉道歉。福格森.徐认出龟壳是东方龙子霸下，高呼他是龙祭祀。
  - name: 第二章 从天而降的交易
    notes: 福格森.徐以东海龙子活满万岁脱壳化龙、壳内龙丹能延寿的传说诱刘震撼，又拿三百童男童女与凝玉作价。凝玉哭称自己是人不是货物，刘震撼拒绝，坚持索要能召金人的血玉扳指与宝船，老徐不舍，只答应再考虑。
  - name: 第三章 隐蔽的陷阱
    notes: 福格森.徐自曝童男童女本是祭海工具、卡帝乐武士牺牲无数，坦承为求仙药一切牺牲都值得。他劝刘震撼占有凝玉与艾薇尔，被识破催眠伎俩。老徐暗命凝玉陪食，并在燕麦糊里下了云秦宫廷催情药红铅。
  - name: 第四章 一入喉门深似海
    notes: 凝玉为刘震撼理出遮住鼻洞的不等式发型，镜中刚劲的容貌让凝玉与艾薇尔心神失守。红铅发作，凝玉、艾薇尔与醒来的海伦同时失控，刘震撼拉下舷窗后被三人按倒，与她们发生关系。
  - name: 第五章 一语道破
    notes: 刘震撼与福格森.徐摊牌，老徐承认下的是云秦宫廷催情药红铅。刘震撼揭穿他打算独吞龙肉、带金人回丝绸大陆打江山，揪住他领口几欲扔下海，古德出面拦阻。老徐又提议把武士送去角斗场、童女卖入妓寨，刘震撼震怒。
  - name: 第六章 大军压境
    notes: 徐老头以神明起誓立约，交出一枚血玉扳指与蓬莱号，二十名潘塔武士宣誓效忠。海族正规军团压境，马库拉族招潮蟹人风暴撕裂者术士召来雷电，金甲将用金枪鱼挑落白旗，古德一叉钉穿金枪鱼。
  - name: 第七章 倒霉的人质
    notes: 金甲将自报是西雅海族王子西米里安.波塞顿，要求交还妹妹。刘震撼以战神坎帕斯发誓归乡后放人，又索要人质，便卸下福格森.徐的下巴、夺其扳指，把他抛进海里。古德说破人鱼婚后尾变腿、出水落地会失语的秘密。
  - name: 第八章 巧妙的推委和解释
    notes: 凝玉与已能用双腿行走的艾薇尔质问刘震撼，他说出南疆战场与猫耳洞的往事，认下责任，承诺以心锁战歌分担寿命、绝不让凝玉自杀。海伦从背后抱住他，说无论他来自哪里都只是她的李察。
  - name: 第九章 双修领域结界
    notes: 刘震撼坦白来自异界，许诺通过神庙审核当上祭祀后娶众人；凝玉以幻术巨鼠立威并自居长姐，定下戒律；他展示双修结界，水元素人鱼竟是艾薇尔，其结界随之觉醒并映出赤裸的他。
  - name: 第十章 没有翅膀的爱情
    notes: 凝玉讲解星空倒影双修结界只有相爱至深的人鱼夫妻才会共同出现，两人生命连成一体同生共死，每千次可进化出跨越空间的星空之门；避土珠能让人鱼上陆，凝玉以探骊得珠破壳取珠；章末交代海族上陆时限与处子鱼尾。
  - name: 第十一章 早安 多瑙大荒原
    notes: 海族一路追随蓬莱号，泰穆尔拉雅雪山与多瑙荒原终于出现；海伦讲安第斯信风、唐古拉峰、特拉维夫的狂战士国度与海加尔战役后的边境格局；凝玉拿出只够三天的干粮，逼他拿不到祭祀称号就去当角斗士赚钱养家。
  - name: 第十二章 不厚道的妹夫
    notes: 蓬莱号靠岸，刘震撼以兵器盔甲贸易和奉送歌女哄住西米里安王子拖延时间，又假称凝玉是自己的奴隶，待船员登岸便撒腿逃走；王子醒悟时木盒里只剩一盒水；王子怒以兽浪结界幻化奔马巨浪追砸，他靠避水珠滴水未沾。
  - name: 第一章 前进，目标是博格村监狱
    notes: 艾薇尔一边自责一边咒骂刘震撼，走不动路只好让他背着；多瑙荒原地广人稀，海伦说除匹格族外各族生育力都很差；海伦哭诉枫叶村惨案，家人被借多洛特公国商船潜入的沙漠人类杀死；凝玉说干粮只够三天。
  - name: 第二章 亲人相见
    notes: 部队抵达博格村监狱，老匹格约克夏跪吻海伦手背；醉酒的叔叔西马克子爵抱住她痛哭，枫叶村出事后他天天喝酒；海伦谎称船触礁家人全亡；他自称散居匹格，获封骑士伺从，又亮出天生灵魂歌者与龙祭祀身份震住全场。
  - name: 第三章 神秘的囚犯
    notes: 刘震撼吹嘘龙宠带自己漂到荒岛并死于风暴，西马克称须神庙高阶神官认证；他介绍熊猫武士、摩韶蚌女与美人鱼奴隶，还撩裙展示脚踝鱼鳞；采石场中黄鼠狼人耍流氓被古德一拳打飞，一群戴铁镣的金发犯人引起注意。
  - name: 第四章 恋人未满
    notes: 西马克解释这些是沃尔夫附庸道格族中的獒人，因长相酷似莱茵皇族而以谕制之罪获罪，须参战活下来才能豁免；刘震撼献出弯刀上的宝石抵伙食费；西马克劝他放弃；凝玉反驳，海伦偷听后仍选择他。
  - name: 第五章 又是一个李察
    notes: 狐族之城威瑟斯庞登场，八万人口，意为荒原上的珍珠；海伦凭祭祀身份获十名士兵护送；坎帕斯神庙高踞数百级台阶，有十二对石雕巨柱与战神三魔宠雕像；两位狮虎王子自报是国王之子，其中一位也叫李察。
  - name: 第六章 华丽的登场
    notes: 神庙东大殿以中空穹顶的天光照射中央，维安大萨满拖着龟壳在四名圣殿骑士与十几名权杖祭祀簇拥下登场；他宣布海伦与匹格学徒申请晋级战争祭祀，并称刘震撼是天生灵魂歌者且收过一条龙宠，满殿哗然。
  - name: 第七章 超级败家子祭祀
    notes: 维安大萨满召出地行龙，证明自己正职亚龙祭祀的眼光，并说李察王子也是亚龙骑士；刘震撼谎称龙宠是火系龙兽且已死于风暴，又捧出果果当新魔宠，海伦自报魔宠是酸液鱼鹰，令大萨满失望地嘟囔败家子，只给他红袍。
  - name: 第八章 一个不用魔法的魔兽
    notes: 刘震撼以歌力不足被拒战争祭祀后据理力争，称祭祀每年都有权申请试炼；大萨满给出与试炼神官比试控制魔兽的任务；人马祭祀普约尔放出熔岩雕齿兽并出言讥讽；果果先装求饶，随即一套拳击把雕齿兽砸得吐牙翻倒。
  - name: 第九章 擒贼先擒王
    notes: 人马祭祀抗议魔兽不用魔法只靠拳击，众祭祀跟着起哄；沃尔夫权杖祭祀雷德克纳普以唐古拉冰熊登场，果果穿裆绕后一拳黑虎掏心打倒祭祀本人；刘震撼以黑加菲白加菲之喻舌战群雄；大萨满喝止众人，宣布他通过试炼。
  - name: 第十章 试炼并非坦途
    notes: 李察王子与维安大萨满耳语之后，大萨满给出南十字星森林与落日大沼泽两个试炼地；刘震撼选最近的南十字星森林；崔蓓茜私下召二人到卧房，赠一整袋魔兽晶核，并道破两地其实是权杖祭祀的晋级试炼地。
  - name: 第十一章 师生恋 这是传统
    notes: 崔蓓茜讲权杖祭祀的实权与福克斯仰狼族鼻息的处境，点破越级试炼是为平息众怒；她讲出身世，导师穆里尼奥在南十字星森林捡到一枚蛋并孵化出她；她与导师的师生恋被家族与长老院拆散，临别赠出《祭祀法典》。
  - name: 第十二章 一个说我想买
    notes: 神庙外凝玉与艾薇尔被人类佣兵围住，原来古德散布了出售美人鱼奴隶的消息，多洛特商人上门要买；崔蓓茜看到美人鱼已有人类双腿，明白海伦失去处子花冠并怒斥她；刘震撼以师门传统堵住导师，李察王子换便装出场。
  - name: 第十三章 一个说我卖
    notes: 多洛特富商向李察王子控告刘震撼，反被砸得骨裂呕血；王子以剥夺称号相逼，他喊出五百万金币卖艾薇尔，商人用记忆魔法水晶录下她的容貌；崔蓓茜点明人鱼是海中王族，王子揭出女大公之争与好色亲王张伯伦。
  - name: 第十四章 打土豪
    notes: 刘震撼借口采购装备拉王子同行，王子赠海伦彩蛋并当街求爱，被海伦以他送的尼龙袜子发带婉拒；凝玉与艾薇尔吃醋后也各得一条；王子带众人逛威瑟斯庞商业街博取好感，刘震撼决意在远东之路商店狠敲竹杠。
  - name: 第十五章 军火大采买
    notes: 刘震撼在远东之路商店为三女与熊猫成批采购衣服，又冲进武器店道根之锤，识破踏弩与双手大剑的成色并震慑矮人工匠；他买下棱枪、柳叶匕首并索要毒药，被矮人推荐订购星辰精钢的弹簧狼牙棒黑龙，当场改名密集阵。
  - name: 第十六章 闷棍一般的竹杠
    notes: 刘震撼再向罗格订购软甲与棱枪匕首，让罗格直接找李察王子结帐；王子签下盖着萨尔纹章的羊皮欠条，罗格认出姓氏后拒收货款，甚至要把签单裱起来挂在店堂，刘震撼自称扈从还向罗格索要回扣。
  - name: 第一章 以自由的名义
    notes: 李察王子在威瑟斯庞城外显露亚龙坐骑，向海伦索要手套求爱被婉拒；刘震撼用敲竹杠得来的钱向西马克子爵赎买獒人囚犯，领头者贝拉米率众吻靴立誓效忠；他唱前线牢歌被海伦用祭祀法典中另类祭祀被烧死的记载警告。
  - name: 第二章 荒原大宴的开胃菜
    notes: 獒人只肯接受皮甲并自带猡莎兽后腿棒骨，刘震撼甩飞刀扎中贝拉米掌侧逼其学飞刀，熊猫们也练起飞刀；随队巫医诺查丹玛斯出场，海伦讲道格族獒人一生只伺奉一个主人；队伍沿荒原边境线行进，遭地精日夜骚扰。
  - name: 第三章 完全野性
    notes: 刘震撼逼问俘获的食人魔卡鲁并命其拉车，又让獒人踢裂地精俘虏的脾脏、踏断手腕立威，最后用雪茄在卡鲁胯下烫出印签；队伍走到南十字星森林边缘，看见牛顿巨鸟盘旋，他发现自己看错地图，找不到墨晶峡谷兵站的方位。
  - name: 第四章 沙罗曼祭祀
    notes: 沃尔夫米格军团截住队伍，军官罗伯特.巴乔露出萎缩的双手，被认出是狈族沙罗曼祭祀；海伦讲明狈族以双手换来洗浑战歌、只对狼族近支有效的来历；罗伯特求助驱赶闯入半身人村庄的星尾龟。
  - name: 第五章 超级霉运
    notes: 队伍抵达白令山脉的霍比特半身人达多村，长老哭诉星尾龟吃光酿酒用的香酒百合；罗伯特吟唱洗浑战歌令獒人与狼骑兵狂化，刘震撼以密集阵迎战，时空裂缝旁又钻出科摩多战争巨兽。
  - name: 第六章 生命礼赞
    notes: 刘震撼回顾科摩多战争巨兽的习性与海加尔战役后驯养术失传；凝玉以幻术巨兽诱敌，鱼鹰阿拉贡被雷霆闪电劈成焦炭，海伦因魔宠阵亡触发千年只有两次的生命礼赞，与战争巨兽签下心灵契约，狈人罗伯特嫉妒得几乎发疯。
  - name: 第七章 偏门的龟珠
    notes: 海伦因生命礼赞得到科摩多战争巨兽，注定要以战鼓为乐器；刘震撼从星尾龟尸身取出顶级晶核与散发酒香的漆黑龟珠，半身人长老道出龟珠泡水成酒、能酿出世间最香醇美酒的奇效，双方约定日后由半身人做采邑的烹调主管。
  - name: 第八章 下一站天王
    notes: 半身人长老用烤岩蛙腿说服刘震撼收下半身人主厨；果果赖在艾薇尔怀里不肯随他上路；刘震撼独自前往南十字星森林，临行前泄露龙祭祀身份，罗伯特惊得痴呆，古德与贝拉米偷走他的雪茄。
  - name: 第九章 一笔大生意
    notes: 刘震撼独自从白令山脉进入南十字星森林，一路猎杀魔兽取得晶核；夜间恩特族牧树人寻香现身，自称植物进化的智慧人类，用元素之泉、桫椤蕉与千色茑萝种子换走香瓜种子，被他偷灌走两加仑元素之泉。
  - name: 第十章 厄运连连
    notes: 刘震撼抵达墨晶峡谷兵站，熊人中队长维埃里出示军部授权书，命他去暗精灵地盘营救被困的唐藏帝国亲王；维埃里讲述暗精灵来历、黑暗法术与生命之泉，队伍进洞即遭箭雨伏击，牛头人夜盲伤亡惨重。
  - name: 第十一章 艰难任务！
    notes: 刘震撼抛出夜明珠照亮战场，以密集阵狼牙棒与细刺剑连杀四名暗精灵女弓箭手；十六名布尔战士眼眶中箭阵亡，他逼供女俘虏，问出四名东方旅行者中有一位会魔法的匹格喝了生命之泉。
  - name: 第十二章 一个崭新的生命
    notes: 东方旅行者现身，奄奄一息的匹格魔法师产下兽亲小猪崽后死去；苦行僧亲王将女儿托付给同为匹格的刘震撼，留下白色玉佩与精金钵盂，答应回国后推动唐藏帝国与比蒙王国通商。
  - name: 第十三章 这个小猪好厉害{V第十二章}
    notes: 刘震撼与维埃里解剖地狱黑龙取龙晶龙皮，维埃里单膝跪地立誓追随；回到博格村，小猪崽喀秋莎连发水箭射倒食人魔卡鲁、射塌两座角楼，三个美女与果果惊叹不已。
  - name: 第A章 二进宫{V第十三章}
    notes: 海伦驾驭背负战鼓的科摩多战争巨兽回到威瑟斯庞，全城比蒙欢呼；李察王子率圣殿骑士相迎，维安大萨满拥吻海伦；刘震撼受冷遇，崔蓓茜告知其贵族身份与领地已无问题，随后赴总督罗森博格的接风宴会。
  - name: 第二章 翡冷翠领主
    notes: 总督宴会上贵族炫耀人类与巨人奴隶，海伦想起枫叶村惨状；崔蓓茜与李察王子为海伦解围，维安大萨满宣布刘震撼晋级战争祭祀、封男爵，却否认其龙祭祀头衔，封地为桑干河以南荒原中心的翡冷翠。
  - name: 第三章 铁扫帚扫尽天下穷鬼
    notes: 崔蓓茜在威瑟斯庞郊外单独召见，点破刘震撼隐瞒金人与屠龙，劝其收敛并把海伦留下修炼，海伦执意跟随；刘震撼用暗精灵女王皇冠等物找人类商人罗格换钱遭拒，凝玉摘下玉佩换钱买粮。
  - name: 第四章 猎龙
    notes: 刘震撼与海伦单独上泰穆尔拉雅雪山，实为觊觎巨龙宝藏并想让有生命礼赞的海伦收服冰霜巨龙；途中在温泉旁惊走一个长鼻獠牙的丑陋比蒙小孩，其父科里纳率十几名猛犸勇士赶来质问。
  - name: 第五章 冰山上的来客
    notes: 科里纳自报是泰穆尔拉雅猛犸族第一勇士，这支绝迹八百年的俄勒芬巨象分支靠雪山雪蕉为生；他讲述几十年前翻越雪山的莱茵狮子正是现任国王格雷克.萨尔，并邀二人进山洞吃温泉涮肉。
  - name: 第六章 硬汉就得下猛药
    notes: 刘震撼用半身人好酒套近乎并连续摔倒猛犸勇士，科里纳用长鼻子偷袭将他撂倒；他以龙祭祀名义封科里纳为翡冷翠马刺骑士，老波吉回赠冰蚌珍珠；因冰霜巨龙在主峰还有半月路程，他改打招揽猛犸人的主意。
  - name: 第十九章 釜底抽薪
    notes: 刘震撼潜入猛犸族雪蕉园，海伦放出科摩多战争巨兽阿拉贡摧毁全族雪蕉林，他再以龙息与亚龙之说嫁祸泰穆尔拉雅冰霜雪龙，用桫椤蕉林和四大金人魔偶作饵，把科里纳及猛犸全族收为家臣。
  - name: 第二十章 藤甲的创意
    notes: 凝玉与艾薇尔带着三百童男童女、昆克族臭鼬人和海沟虹族刺猬人渡过桑干河，抵达封地翡冷翠红土高坡；艾薇尔提议用坚硬藤蔓编织盔甲，古德则率熊猫与獒人赶往雪山砍伐松木建营地。
  - name: 第二十一章 老乡见老乡
    notes: 窑洞中隐居的绿党族螳螂人与附庸族争抢洞穴，凝玉艾薇尔出面道歉；玳瑁族苦行僧安度兰现身，自述四千余岁、与美人鱼同属海族，讲出苦行僧来历与螳螂族新婚夜吃新郎脑袋的旧俗。
  - name: 第二十二章 鸡肋幻术
    notes: 小猪崽喀秋莎喷连环水箭射穿铜盔镇住安度兰；一百多名熊地精强盗突袭红土高坡，抢掠兽群并合围童男童女，艾薇尔首发水箭失准，只得幻化出俄勒芬巨象武士虚影吓退地精。
  - name: 第二十三章 巨象过河
    notes: 卡鲁被熊地精钉头棒打破脑袋后逃到桑干河边，躲在芦苇丛中哭泣时目睹刘震撼率猛犸长毛象踏水渡河抵达，他哭着自报身份，被举着夜明珠的刘震撼一行发现。
  - name: 第二十四章 顶梁柱回归
    notes: 熊地精看破巨象武士只是幻象后大举围攻，绿党螳螂刀圣五刀连斩数名地精护住凝玉艾薇尔，终因寡不敌众身负重伤；果果与喀秋莎趁机要挟喂奶，刘震撼骑巨兽赶到荒原。
  - name: 第二十五章 扫射
    notes: 猛犸力士与科里纳横扫熊地精，刘震撼当众处决地精、逼降者吃土，随后抱起喀秋莎以连环水箭射杀七名冲阵的熊地精，上百强盗彻底崩溃跪降。
  - name: 第二十六章 红与黑
    notes: 熊地精被押着挖坑，刘震撼由《祭祀法典》追忆地精万年前拥有楔形文字与机器傀儡的辉煌文明；他识破地精首领的激将法，命两个喽罗用铁嚼子钩裂首领的嘴。
  - name: 第二十七章 判刑
    notes: 玳瑁长老安度兰以珍视生命为由求情，刘震撼取消活埋改判鞭刑与烙印为奴，把手上沾血的几十名熊地精打断脊梁放逐，并驳回了熊地精首领的上诉，长老自认欠下人情。
  - name: 第二十八章 骷髅旗飘扬
    notes: 刘震撼连夜提审两名熊地精头目，查明比蒙骑士故意把人类商人送进科森部落并放出匹格村庄迁徙的消息；又知悉剃刀荒丘地精、岩石强森食人魔、白头乌鸦野人及人类捕奴队，宣布自己要做强盗。
  - name: 第二十九章 以盗制盗
    notes: 刘震撼力主以盗制盗，打算挟裹熊地精奴隶去抢掠其他强盗部落养战；安度兰以丘陵矮人部落被数万强盗联手逼走为例警告，凝玉报出剃刀荒丘已有三千之众，刘震撼仍坚持进攻就是最好的防御。
  - name: 第三十章 一个小小的教训
    notes: 红色骷髅猪头与双剑交叉龙首旗升上红土高坡，刘震撼率熊地精奴隶首战洗劫科森部落老家，又转攻岩石强森食人魔部落；他以自创《红土高坡》连施四遍迟钝之歌，歌力透支倒地后饮元素之泉复原。
  - name: 第三十一章 东方最强武士的狂化
    notes: 卡鲁临阵脱逃又被迫折返战场，熊猫武士以棱枪穿透巨魔咽喉，双头巨魔拔出枪头再战；熊猫吐出烈酒化为大醉侠焚身烈焰，首次揭示熊猫族靠高纯度酒精而非怒意进入酒醉狂化。
  - name: 第三十二章 荒原绿宝石
    notes: 熊猫以三棱枪翻绞巨魔心脏，獒人徒手折断巨魔四肢，果果与喀秋莎扫射助战；食人魔全军投降，刘震撼把俘虏全分给卡鲁、烧掉帐篷并拖走石头女神像，归途中留守的熊地精早已逃走。
  - name: 第三十三章 豪斯族猛男
    notes: 红土高坡被生命之泉催生成竹林与桫椤蕉林，凝玉讲述科里纳多倒泉水、艾薇尔造喷泉、海伦栽千叶茑萝；报警哨声响起，刘震撼赶到桑干河滩涂，发现艾薇尔正被一群壮硕的比蒙大汉围着大骂。
  - name: 第三十四章 荒原上吹来了文化的风
    notes: 海伦说明河马人是豪斯族近支，与斑马人、骆马人同族，因体型壮硕被排出弓箭手选拔；《比蒙史诗》又名《河马史诗》，河马是深受爱戴的吟游诗人；刘震撼以红土为要挟收编三百余口桑干河河马族，奥尼尔转投海伦门下。
  - name: 第三十五章 比蒙战舞
    notes: 河马诗人入伙当晚设流水宴席，女神像喷泉顶着夜明珠通明；奴隶被逼下河洗澡千遍，霍比特半身人掌厨；宴上科里纳跳战刀舞、螳螂僧侣演刀法、古德耍醉拳、奥尼尔唱情歌，海伦即兴起舞时身上爆出乳白色光圈。
  - name: 第三十六章 天鹅族女骑士
    notes: 崔蓓茜道破海伦跳的是《祭祀法典》失传的比蒙战舞，只有自然进化的祭祀才有几率领悟；她带来西北战线开战、公证殿下被沙漠人类掳走的消息与神庙指派的两位守护骑士，女骑士歌坦妮是斯迈族天鹅、穆里尼奥之女。
  - name: 第三十七章 对立，在不经意间产生
    notes: 补叙天鹅族采邑与落日大沼泽的德鲁伊威胁、禁空战歌与田纳西空战；歌坦妮摘盔惊艳全场，刘震撼因神庙欲夺走海伦而口出亵渎神庙之言，歌坦妮爆出人类武技斗气，古德夜袭窑洞被扔出，刘震撼坚持海伦哪里也不去。
  - name: 第三十八章 送上门的教练
    notes: 刘震撼放弃剿匪改谋赚钱过冬，渡口建成却无人经过；崔蓓茜教战歌，刘震撼歌力一用即弱只得专修武技，海伦却两天学会罗侬撒歌剧与山岭呓语之歌；刘震撼用激将法逼歌坦妮训练民兵，后来她发现民兵私改招式与巫医毒药。
  - name: 第三十九章 摩登时代
    notes: 第一场雪落下，多瑙大荒原进入严冬与雨季；熊人维埃里携米纱坐骑加入；千叶茑萝枯萎断了财路，崔蓓茜否掉开酒店之议；全民染发热潮中艾薇尔率妇孺用野葡萄藤编出金光藤甲，被歌坦妮以怕火反驳，只有刘震撼肯定。
  - name: 第四十章 渡口恩仇（上）
    notes: 荒原强盗掠走放牧的肥羚并杀害刺猬牧民，刘震撼限定放牧不超红土高坡五十里；翡冷翠渡口开张，按人头与阔绰程度浮动收取过路费，人类商人抱怨后仍得掏钱，老熟人罗格老板被狠宰一刀，箭塔哨兵又吹响河螺军号。
  - name: 第四十一章 渡口恩仇（中）
    notes: 夏尔巴商团用五艘藤舟渡河，携百名比蒙奴隶与两百佣兵，贝普赛妓女随行；刘震撼索要每人十枚金币，两名总督家臣匹格军官出面施压；艾薇尔捏碎蚌壳召出大型水系魔法水刃风暴搅碎芦苇，人类佣兵当场噤声。
  - name: 第四十二章 渡口恩仇（下）
    notes: 崔蓓茜以夏尔巴商团掌握五家武器作坊、战时急需人类兵器为由劝刘震撼放行；奴隶全是迪尔族鹿头人，老鹿人被车拖伤又被割腰取香囊，维埃里认出旧日附庸恩里克动手，崔蓓茜喝止，刘震撼最终吹哨召民兵追上。
  - name: 第四十三章 我为奴隶狂
    notes: 麝人奴隶被人类贩奴团活摘肾囊，崔蓓茜讲述海加尔战役麝人神射手因体香暴露埋伏而全军覆没，战后被贬为奴户并剥夺用弓之权。刘震撼坚持营救，被崔蓓茜以美杜莎凝眸石化术定住三小时，解禁后率十二头猛犸出征。
  - name: 第四十四章 渔翁和鹬蚌
    notes: 獒人贝拉米循麝人药香追踪两小时找到人类宿营地，刘震撼与螳螂僧侣潜伏侦察，看清佣兵剑术与营地布防，艾薇尔借魔晶与元素之泉施暴雨术浇熄篝火。民兵正要发起冲锋，荒丘后忽然冲出上千偷袭者，抢先袭击人类营地。
  - name: 第四十五章 成竹在胸
    notes: 刘震撼以罗侬撒歌剧认出偷袭者是绿魔与盐魔，且拥有会嗜血术的萨满巫师。盐魔盐甲与石化皮肤压制佣兵，佣兵竖白旗后强盗竟放走人类商人。强盗押麝人北行，刘震撼判断其必经巨魔荒丘之原，决定回领地休整后再伏击。
  - name: 第四十六章 踏进鬼门关
    notes: 视角转入绿魔首领范尼，剃刀山地精部落以人类少女与青铜武器为报酬，邀雾都绿魔、阿仙奴盐魔、白头乌鸦野人部落合攻红土高坡。范尼偷袭人类商团，因商人承诺送钢铁盔甲而放其生路，行至巨魔荒丘之原时骤闻蹄声。
  - name: 第四十七章 无法阻挡
    notes: 十二头猛犸巨象自左右荒丘俯冲，以二十刃宽队列反复碾压一千五百强盗，被踩踏而死起码六百人，盐魔盐甲在巨蹄下形同虚设。比蒙战士冲杀，绿魔三萨满被俘，一百多麝人奴隶获救。刘震撼留萨满活口，命人给尸体补刀。
  - name: 第四十八章 指鹿为马
    notes: 战利品有兽皮、蜂蜜、魔兽血液与一小袋魔晶，另有麝人奴隶一百零四个与三名绿魔萨满俘虏。麝人阿杜射雁落空，歌坦妮一箭射落大雁并出言嘲讽。刘震撼宣布对外称麝人为豪斯族半人马，以骷髅猪头纹身遮住奴隶烙印。
  - name: 第四十九章 天鹅女骑士终身之辱
    notes: 歌坦妮为喀秋莎讨蜜饯，径自闯入领主窑洞，撞见刘震撼与艾薇尔双修千次进化，惊叫出声后被溅了一脸，掩面干呕逃走。凝玉扶她回房，只说这只是一个噩梦。刘震撼喃喃自语要给窑洞安个大门。
  - name: 第五十章 一个天才的构思
    notes: 审问绿魔萨满得知其神术靠法杖、魔兽之血与意念之力瞬时施展，比战歌吟唱更快，法杖必用樱桃木，杖身图案是巴巴鲁克智慧之文。刘震撼找到比蒙战歌无法制作阵图的破局之法，免去三萨满劳役，决意自制瞬发战歌法杖。
  - name: 第五十一章 今夜无人入眠
    notes: 强盗未至，安度兰断定即将来攻，巫医诺查丹玛斯占卜称强盗正在准备一件杀伤力巨大的武器。晚宴上歌坦妮见牛奶作呕。刘震撼部署夜防与毒药，夜里逼老绿魔刻樱桃木法杖灌注摩兰陀飞鸟血，见识上品魔兽血的威力。
  - name: 第五十二章 误打误撞
    notes: 灌注魔兽血时因光圈颜色不符发生爆炸，改由绿魔吸取魔獍血才成功，法杖却谁也催动不了。刘震撼折杖，意外触发姜之忍耐歌的迟钝光环，才知造出的是战歌卷轴。艾薇尔以星空之门瞬移现身，揭示千次进化所得穿越能力。
  - name: 第五十三章 训练有素的强盗
    notes: 大地精骑士埃姆雷持剃刀山旗帜递战书，自称德科三世册封的荣誉骑士，宣告一小时后进攻。强盗联军五千余人列突击阵型，前排撸盾、两翼青铜长戟骑士、阵前十头大地獭。科里纳斩杀逃兵立威，守护骑士亮出圣殿骑士身份。
  - name: 第五十四章 战斗，这才算是开始
    notes: 强盗以千名地精骑兵分两翼突击，刘震撼掷出狂化与迟钝战歌卷轴，猛犸大力士与兽亲同体狂化成双子座骠骑踏破骑阵；果果吊在大地獭胯下捣乱，崔蓓茜与歌坦妮惊见匹格祭祀的邪恶光环战歌。
  - name: 第五十五章 天灵盖和狼牙棒
    notes: 强盗竖起十二刃冷杉树矛并泼油纵火，逼退天生怕火的猛犸巨象；刘震撼命科里纳回师扫清残敌，海伦与崔蓓茜亲临战场，崔蓓茜召出八面闪电护盾，阿杜以弹弓石弹打倒迂回偷袭的地精骑兵。
  - name: 第五十六章 预备队之战
    notes: 民兵结半月阵用棱枪竹矛压制强盗远射，强盗又投入五头重装洞穴巨熊骑士；刘震撼放出三个云秦金人硬挡，海伦以生命为代价吟唱最后的挽歌，被崔蓓茜用凝眸石化术截断，刘震撼震怒之下异变。
  - name: 第五十七章 值得尊敬的对手
    notes: 刘震撼自主狂化，以自创献祭战歌召出两百平方的祭坛之火；金人屠杀两千强盗，科里纳亦狂化却被神秘铜弹击倒；刘震撼救下科里纳，喀秋莎水箭扫平大地精，他捡到上古古力矮人青铜火铳。
  - name: 第五十八章 前往剃刀山
    notes: 战后翡冷翠零伤亡，崔蓓茜与歌坦妮逼问战歌卷轴的来历，实验证明只有刘震撼带龙息的歌力才能激发；崔蓓茜允诺写信给穆里尼奥帮他报名全国祭祀奥林匹克，刘震撼不听劝阻率两百余人杀奔剃刀山。
  - name: 第五十九章 独闯龙潭
    notes: 行军途中刘震撼拆解青铜火铳，推断击锤上刻着风系微型魔法阵、铜弹靠触碰爆炸穿透甲胄；他披三层重甲独闯剃刀山唯一的四十五度山道，硬扛上百根檑木，又用棱枪挑飞四辆滑刃车，棱枪折断。
  - name: 第六十章 幕后黑手
    notes: 角楼上出现戴斗篷的女子，指挥地精放出石头神像、床弩与火瓜，刘震撼凭火免疫安然无恙并砸破栅栏；艾薇尔赶来助战，被斗篷女一指反噬吐血倒地，果果掷松塔打落斗篷，露出额上龙角，原来是仙女龙。
  - name: 第六十一章 一力降十会
    notes: 仙女龙的元素免疫与元素反噬指设定揭晓，刘震撼木桩砸不中便取出火铳射击并谎称身怀银霄斗气；他砸破栅栏门闯入山寨，跃壕沟时被守护神曼陀因巨蟒吞下，果果在蛇腹内踹打，阿杜以铜弹打瞎蟒眼才脱身。
  - name: 第六十二章 翡翠之梦
    notes: 刘震撼把发狂的斐雯丽毒蟒引向地精村舍，仙女龙被迫动用一生一次的翡翠之梦，却阴差阳错召来一只巨大丹顶鹤而非冰霜巨龙；巨鹤抓起毒蟒摔死并啄出蟒胆与蟒珠，果果跳上鹤头揪住肉冠。
  - name: 第六十三章 厄运之兽?
    notes: 仙女龙道出报恩缘故：一万年前地精大贤者加布林与她的长辈有深厚友谊；果果折断唯一的通灵战歌卷轴与巨鹤签订心灵契约，连带借翡翠之梦与巨鹤心灵共通的仙女龙安菲特里忒也被签下，果果一下有了两个魔宠。
  - name: 第六十四章 祸福难料
    notes: 刘震撼坐在地精王德科三世的宝座上审问仙女龙，亮出点歌卷轴承认自己是龙祭祀，讲明果果因同源龙息也能使用卷轴才误签了她。艾薇尔喝下蟒胆汁疗伤却变成体液带毒的毒人，古德抄出地精军刀与加布林武器图纸。
  - name: 第六十五章 没有矿脉的巨大矿藏
    notes: 海伦、崔蓓茜、歌坦妮与抱喀秋莎的凝玉赶来，认出巨鹤是云秦帝国的博浪沙火鹤，果果从此拥有火鹤与仙女龙两大魔宠。仙女龙自述百年卧底剃刀山、训练地精、驱逐溪谷矮人，抛出整个红土荒原都是矿藏的秘密换取自由。
  - name: 第六十六章 点土成金
    notes: 仙女龙讲出红土不长草的真相：土中金属元素过多，而溪谷矮人的点金桑能汲取金属结出金钢实与摩拉丁怒火。刘震撼以果果驱赶地精要挟，逼她交出十万磅金钢并指导锻造，代价是承认剃刀山地精为翡冷翠第二批平民。
  - name: 第六十七章 不爱红装爱武装
    notes: 翡冷翠内部为留不留仙女龙分歧，崔蓓茜与安度兰反对，民兵与熊猫武士力挺。五十吨金钢不足以当军火商，全数锻成武器；维埃里带回西线两联队失踪、土伦军团折损一半的坏消息，刘震撼派僧侣团上前线，安度兰两月后归。
  - name: 第六十八章 翡冷翠空军的构想
    notes: 安度兰讲述西线战事收尾与沙漠人类的弯刀、拜火教阿訇，并透露维安大萨满邀刘震撼参加明年奥林匹克。刘震撼提出照人类狮鹫部队组建空中民兵队，崔蓓茜与仙女龙以穆里尼奥用角鹰兽载精灵箭手失败的旧例泼冷水。
  - name: 第六十九章 仙女龙的冷水
    notes: 歌坦妮讲出父亲穆里尼奥麾下的精灵御刃神射手与各族追随者，以及角鹰兽载不动人马与猛犸的窘境。刘震撼以短距弹弓加空投巨鸟破解火铳之困，仙女龙用连环弩筒、朔风与人类善学逐条驳回，崔蓓茜猜出坐骑是牛顿巨鸟。
  - name: 第七十章 少女之心
    notes: 刘震撼用墨晶给四十名麝人做避风镜，又打造蛤蟆镜与墨镜当宝贝，并交出萨满利爪、陀螺伞、金属折扇与龙珠项链设计图，用墨晶换仙女龙锻造。歌坦妮苦等领主来求她抓鸟却落空，独处时回想被李察拔下翅膀白翎的往事。
  - name: 第七十一章 羊肠和卷轴 都是用来对付“鸟”
    notes: 歌坦妮发现领主早已带麝人出发，又撞见晾晒的肥羚肠怒骂其荒淫。刘震撼在白令山脉用麦穗陷阱与火鹤抓捕均失败，最后焚巢夺雏、以十根战歌卷轴震晕牛顿巨鸟，一次抓回五十四只，还移植点金桑并催出上万枚摩拉丁怒火。
  - name: 第七十二章 哨卡惊变
    notes: 刘震撼顺路看沙罗曼祭祀罗伯特，发现其哨站被屠尽，狼骑兵被补刀并割去尾巴，营地留有白面包屑、铁掌蹄印与麻绳，荒原七个哨卡同时被拔除。他判断是打着外交使节旗号、装备连环弩筒的人类斥候，遂回翡冷翠布置拦截。
  - name: 第七十三章 红颜难道真的是祸水
    notes: 视角转向人类，夏尔巴家族的卡萨诺伯爵为争夺多洛特女大公之位，借好色亲王张伯伦与丹泽家族暗斗。因商团记忆水晶球录下翡冷翠五位美人，家族纠集三千人与魔法师费兰远征捕奴，卡萨诺率斥候拔哨卡后被骑兵层层截杀。
  - name: 第七十四章 随波逐流的军师
    notes: 卡萨诺伯爵逃命途中被果果与火鹤戏弄，美人鱼艾薇尔以身挡下连环弩箭，刘震撼用虎头钩缴下他的剑，把他捆在马后拖走。审讯得知夏尔巴家族雇多洛特佣兵与宫廷魔法师弗兰远征捕奴，狈人军官罗比痛陈四十名哨兵遇害。
  - name: 第七十五章 有心算无意
    notes: 仙女龙自报名字黛丝并接过指挥权，在饭堂用面包和盘子做沙盘推演，点明三百人对三千人的劣势。凝玉拍板军号定为香军，歌坦妮道出红土高坡已修成睡美人造型、只留一条台阶通道，罗比请求回盐碱地森林调狼骑兵。
  - name: 第七十六章 当古董遇上古董
    notes: 托蒂伯爵用鹰眼套筒镜观察翡冷翠，驱兵强攻台阶通道。金属蔷薇佣兵团以磷火箭与麻药战戟开路，藤甲因掺松香蚌壳粉而防火。刘震撼率巨象武士反冲，珍妮佛推出上古精灵鸟翼弩车，刘震撼用古力火铳击毙弩手夺车。
  - name: 第七十七章 火！火！火！
    notes: 佣兵用拒马龙枪封死台阶通道，刘震撼被射成刺猬后诈死，扭断两名大剑士的脖子，抡铡刀杀回通道。弗兰以火焰之墙焚烧窑洞口，果果抛下点燃的雪茄，献祭战歌令八名比蒙获得火焰吸收。
  - name: 第七十八章 喋血桑干河
    notes: 地火焚城把红土高坡烧成火山，托蒂伯爵在鹰眼镜中看到对岸六位顶级美女，逼全军卸甲泅渡。地精防线溃成被讥为睾丸战阵的两团橹盾，二十几名豪斯族河马战士从水下浮出，用短斧与巨斧砍碎四十艘竹筏并追杀泅渡骑兵。
  - name: 第七十九章 战局如棋
    notes: 侥幸上岸的三百佣兵重组V字阵，凝玉撤去幻术屏障，露出香军旗号下的十二头猛犸长毛象、三头大地獭与十六名俄勒芬武士。歌坦妮骑铁十字兽、维埃里跨巨型树獭，两个圣殿骑士亮出徽章，伯爵以血髓召来批毛犀骑兵。
  - name: 第八十章 处处吃憋
    notes: 科里纳率猛犸骑兵冲垮批毛犀与金属蔷薇骑兵，凝玉以二十头幻术猛犸助攻，三百名大地精战士推进。艾薇尔以一挑五压制两位大师与三名学徒，霍比特半身人厨师持菜刀单挑珍妮佛。
  - name: 第八十一章 贪欲 你是我最爱的原罪
    notes: 托蒂伯爵在北岸滩涂摆出王字战阵，比蒙藤舟停在离岸三十码处齐唱改编的桑干河歌。彼尔族熊人、莱茵族狮人与迪尔族麝人突现人类后方河堤，伯爵自陈损失过半。
  - name: 第八十二章 夺面双雄
    notes: 托蒂伯爵现出华伦泊尔族蝙蝠人原形，七金星肉翼升空，用七星种族异能超声波伪象幻出八个分身。民兵冲垮人类战阵，罗德曼以鼻子拔刀术偷袭，歌坦妮骑铁十字兽以银霄斗气封住天空，人类放下武器投降。
  - name: 第八十三章 巨大的诱惑
    notes: 翡冷翠大胜后清点上千人类俘虏与战利品，红土高坡大火未熄，粮荒与现金短缺浮现；托蒂伯爵以打通海加尔圣山通道为饵求活，刘震撼答应与丹泽家族为敌，却命古德打断他三根肋骨。
  - name: 第八十四章 翡冷翠男人如山，翡冷翠女人如水
    notes: 大火熄灭后红土高坡被烧成紫红釉质城堡，佛肚竹林开花结出竹米解了粮荒；崔蓓茜与罗比分头回神庙和盐碱地森林求援，刘震撼以蚂蚁与龙族的比喻向仙女龙黛丝摊牌。
  - name: 第八十五章 名利场
    notes: 维安大萨满齐丹随刘震撼回翡冷翠，代神庙应下托蒂的条件，放伯爵回去请卡佩罗侯爵；他讲解国王、神庙与长老院三分天下的格局，说出战争打的是钱并答应派权杖祭祀与圣殿骑士参战。
  - name: 第八十六章 同志
    notes: 托蒂伯爵带着叔叔卡佩罗侯爵飞回翡冷翠，正撞上刘震撼给牛顿空骑兵讲解自编空战战术；凝玉用象牙针牛皮线缝好巨鸟肉翼，侯爵称赞比蒙居然研究天空作战技巧并定下合作。
  - name: 第八十七章 双龙祭祀
    notes: 黛丝哭诉与若尔娜的恋情，刘震撼靠实战与实验揭出斐雯丽蟒毒素实为超纯度活性凝血酶；黛丝代若尔娜做主请他做史上第一个双龙祭祀，说出彩虹龙城与辰星龙城守卫龙之墓地的秘密。
  - name: 第八十八章 磨刀霍霍
    notes: 奥特加大师与学徒梅西用照明指焰烧断绳索越狱，被黛丝与若尔娜一个照面击倒；刘震撼以自由为价收他入翡冷翠法师团，随后坚壁清野收竹米、迁领民、织第二代血胶藤甲备战。
  - name: 第八十九章 矛与盾
    notes: 加图索·丹泽喊出为巨镰手报仇的口号却迟迟不动，罗比带回两百沃尔夫狼骑兵与两名狈族沙罗曼祭祀；卡佩罗侯爵报来龙卷风佣兵团倾巢而出并借到白银基座战士与庞贝援军的坏消息。
  - name: 第九十章 尖啸死神
    notes: 龙卷风前锋两千五百骑逼近，刘震撼在红土广场搓麻将麻痹对手；五名骏鹰骑士低空挑衅，被六名豪斯神箭手与四十名麝人击落两人，四十名牛顿空骑兵随即升空迎战。
  - name: 第九十一章 双狂大战
    notes: 牛顿空骑的双料油瓜未能爆炸，特拉维夫狂战士被激怒狂化冲锋。刘震撼撕开祭祀袍演说，率翡冷翠民兵裸身迎战，全歼五百狂战士；罗德曼领悟镜像攻击与刀刃旋风，首领涅寇斯被斩，人类轻骑逃散。
  - name: 第九十二章 谁持彩练当空舞
    notes: 壹条以火焰之柱与爱琴上投追杀人类轻骑兵，庞贝骏鹰斥候现身，果果从鹤身拔出一支浸过人面蜘蛛毒腺的破魔弩箭。龙骑士兰帕德与飞马圣骑士托马西赶到，中毒的壹条以鹤语魔法和脱羽箭雨重创金龙与飞马后返航。
  - name: 第九十三章 神迹时代
    notes: 光秃的壹条回到翡冷翠，安度兰鉴定弩箭为人面蜘蛛毒腺，若尔娜辨出箭上湮甲魔法阵，猎豹人因扎吉以婴儿颅骨酒杯与蜜酒指认庞贝帝国插手。黛丝解说龙族魔法免疫真相，牧师则称斐雯丽毒蟒胆汁是神迹。
  - name: 第九十四章 豪华的魔法阵容
    notes: 加图索处决两名联队长立威，用马其诺方阵与阶梯塔车三面进攻。七头大型魔兽自窑洞轰毁塔车，三个比蒙魔法师以火海、飓浪斩与几十道迟钝之歌屠戮佣兵。壹条一夜长满羽毛，喷火柱烧伤神甫，又以箭雨把金龙射成毽子。
  - name: 第九十五章 七箭下天山
    notes: 兽精灵神箭手与豪斯族人马箭手对射。六名豪斯箭手被钉在冰壁上，五名兽精灵三箭贯脑而亡；最后一名佝偻的人马箭手以花式箭法射杀逃跑的兽精灵，逼退余敌。刘震撼落泪，领民齐呼神箭哲琴，他唱出长箭之歌致意。
  - name: 第九十六章 仙鹤神针
    notes: 人类以同兵种角斗叫阵。狼骑兵用隐花仙人掌纤维抛网全歼两百人类轻骑，猛犸重骑亮相吓得敌骑掉头；白银基座战士披秘银战甲登场，河马诗人用双料油瓜配合熊猫重装龙枪将其全歼，比蒙抢走一百套秘银战甲。
  - name: 第九十七章 两种人
    notes: 刘震撼摔倒兰帕德，壹条一喙洞穿黄金巨龙。兰帕德以死亡领主的戒指换回巨龙性命，刘震撼收下戒指放人。风系魔导士静止时间，加图索毁约放出钢铁魔偶，海伦召唤科摩多战争巨兽，刘震撼默发召出云泰金人砸碎魔偶。
  - name: 第九十八章 神圣诅咒
    notes: 龙卷风佣兵团在多瑙荒原溃逃，加图索团长携子托马西与三名魔法师沿蛮荒古道北逃。刘震撼借基头座龙石肤术伪装成石头神像，配合凝玉幻象斩杀百余名亲卫与三位魔法师。托马西临死发出神圣诅咒，刘震撼眉心浮出黑点。
  - name: 第九十九章 陌生的海族
    notes: 刘震撼赶回翡冷翠，见歌坦妮与奴隶、地精战士已被塞壬歌声操控，率戈利德鹰身人与娜迦围攻民兵，维埃里被地精三枪加歌坦妮一剑重创。海伦以鉴定战歌识破海族身份，用塞壬虚弱战舞配合默发战歌反杀七位塞壬。
  - name: 第一百章 挥刀问情
    notes: 刘震撼审问女娜迦与塞壬俘虏，得知艾薇尔被八臂娜迦以风洞传送带回西雅海国，福格森.徐为海族研制安尔乐法阵，海族打算造出避水装备后血洗比蒙王国。众人束手无策，刘震撼自断左臂减轻体重，独闯星空之门。
  - name: 第一百零一章 极度深寒
    notes: 刘震撼坠入漆黑的海底森林，靠避水珠结界与祭坛之火视物，骑羽翼飞马闯入由死火山雕成的海底城市，冲进人鱼形火山城堡，见到被海藻捆绑的菲高、美人鱼国王贝肯鲍尔、西米里安王子与福格森.徐，随即被金属囚笼罩住。
  - name: 第一百零二章 消灭灵魂的祭典
    notes: 海族押着金属囚笼经海神庙传送至海面小岛沼泽，准备献祭两位神使。塞壬女公爵戴安娜以控灵之歌和灵魂转移把艾薇尔灵魂移入巨虫。刘震撼临场爆发自创战歌，用二段力量汲取战歌狂踹囚笼，笼破后九头蛇怪许德拉现身。
  - name: 第一百零三章 绝对力量
    notes: 潮汐领主革瑞恩与九头蛇怪许德拉同时觉醒现身，人面蛇怪革瑞恩自称欺诈者化身，与刘震撼谈笑并互相提防。刘震撼以二段力量汲取战歌汲取十位鲸鱼武士三分之二的力量，配狂化与龙力抡起石碑，一击打飞许德拉六颗蛇首。
  - name: 第一百零四章 绝对阴险
    notes: 许德拉断首化成分裂体逃回老巢，仅剩三首的它升空以风系魔法猛攻。潮汐领主以日朦胧术隐身暗算，被转移到巨虫身上的艾薇尔用网状闪电破解，菲高抱着艾薇尔与虫子挡在刘震撼身前。革瑞恩自称已册封许德拉为潮汐骑士。
  - name: 第一百零五章 绝对震撼
    notes: 壹条、两位仙女龙、凝玉与奥尼尔赶到，刘震撼以通灵战歌对巨虫施放智慧启蒙，意外将其收为祭祀学徒。双方亮出白银基座盔甲与破魔弩箭对峙。革瑞恩为求活命吐露秘密：巨虫是比蒙鸳弗瑞族蝴蝶人。
  - name: 第一百零六章 绝对沧桑的历史
    notes: 潮汐领主革瑞恩吐露虫族比蒙秘史：鸳弗瑞族蝴蝶人与斯凯德族蝉人仍有遗脉流落海外，它与九头蛇许德拉被云泰方士以八门金锁阵禁锢一千五百余年，海族把虫人当贡品供其吞食，揭出冬虫夏草、真实之眼与控灵术灵魂转移。
  - name: 第一百零七章 绝对天才的学徒
    notes: 刘震撼会见虫族遗脉，蝴蝶长老坎波斯与蝉人长老贝利率众行五心贴地大礼；革瑞恩与许德拉强求当魔宠被拒，果果撒出战歌卷轴，壹条提铡刀重创革瑞恩，许德拉被喀秋莎水箭射杀，茉儿意外以心灵契约收下革瑞恩。
  - name: 第一百零八章 绝对可怕的估测
    notes: 若尔娜勘明八门金锁阵没有魔法中枢，只以八座珊瑚礁石为基点；虫人孩子借月光行茧化成蝶与金蝉脱壳仪式脱去胎衣，茉儿化成黑发少女并透露自己得了五首汉语战歌；刘震撼断臂因斐雯丽蟒胆汁自愈，他收避尘珠赠菲高。
  - name: 第一百零九章 绝对低估了海族的耐心
    notes: 篝火夜菲高讲海族为何向往陆地，茉儿令革瑞恩沉睡；水井传送阵亮起，贝肯鲍尔陛下率塞壬、娜迦与美人鱼四十护卫杀上岛，云泰金人挡下鲸鱼武士巨锚，混战中茉儿以九头蛇珠施水玲珑九连环，幽灵九头蛇许德拉现身救人。
  - name: 第一百一十章 破阵子
    notes: 刘震撼以沼泽陆龟砸破海族护盾，撞出八门金锁阵的阵眼，弗格森·徐讲明休生上杜景死惊开八门与三十五名牺牲者的代价；茉儿追问贝肯鲍尔，刘震撼宣布自己破阵并放走海族，又审出内奸出自神秘消失的美杜莎族。
  - name: 第一百一十一章 有朋自远方来
    notes: 弗格森·徐赌门破阵后被戒灵骑士一剑穿心，茉儿扣下美人鱼国王换二十头抹香鲸与艾薇尔首饰，并替艾薇尔戴上水晶指环；虫人返乡唱响离子之歌，王国十二主祭之一穆里尼奥率上百追随者到翡冷翠巡查，金刚鹦鹉当众骂人。
  - name: 第一百一十二章 惹尘埃是非
    notes: 穆里尼奥率追随者夜访翡冷翠，猛犸大力士与鲸鱼武士菲高亮相震慑全场；他劝刘震撼效忠天鹅族被拒，宣布美杜莎三千人回归并把八百里荒原封给他们，又请刘震撼营救地底鹰身人与犀牛人，末了刘震撼当众求婚歌坦妮。
  - name: 第一百一十三章 你惹撒野我把酒奉陪
    notes: 穆里尼奥在宴上纵论二十系魔法，让丛林德鲁伊艾弗森变身巨蚊与冰熊、让圣光系魔法师演示熔断餐刀；他揭示三胞胎中歌莉妮与歌麦斯是魔歌双修祭祀并将在明年祭祀奥林匹克登场，还宣布正研制第一首攻击型战歌大凡歌。
  - name: 第一百一十四章 倾城一笑
    notes: 安度兰长老献上英雄靠吹的宣传秘诀，刘震撼派出四支宣传队，年轻比蒙武士纷纷前来朝圣；匹格族长贝隆来访，翡冷翠纹章编入匹格族首页谱系；罗森博格送来福克斯帐房与企鹅管家贾巴尔，夏尔巴家族送四公主和亲被拒。
  - name: 第一百一十五章 文明世界
    notes: 贾巴尔举办壮行酒会并挑选二十名蝴蝶族侍女；刘震撼留下贝拉米等人训练八十六名獒人囚犯，带上肥罗与两位彼尔族权杖祭祀出发。队伍经伊夫堡进入卡瑞姆多大平原与瓦伦西亚城，乡民跪拜歌坦妮为天使；托蒂伯爵接待。
  - name: 第一百十六章 圣女和流氓
    notes: 刘震撼在瓦伦西亚街头拧小修女贞德的屁股，贞德一路跟随；罗西认出她领口的火焰纹章，揭示她是圣奇奥大魔法师普斯卡什之女与下届圣女，已度化九十九人并选中刘震撼；刘震撼投资猛虎佣兵团，圣骑士华金率队破门问罪。
  - name: 第一百一十七章 狻猊舞
    notes: 龙骑士加西亚自报宝剑橡叶圣骑士团副团长并挑战刘震撼，刘震撼定下输赢都能带走贞德、输了教廷还须答应他一件事的赌约；茉尔拦下请战的民兵，派古德与鲸鱼武士菲高下场，菲高缩身抡翻四头雄狮。
  - name: 第一百一十八章 总在斗争的边缘
    notes: 古德赤手空拳杀死三头棕熊，刘震撼当场认输求教廷施展神圣净化与神圣还原却被拒；加茜娅抛出教廷即将讨伐比蒙王国，卡卡主教宣布正准备递交战书，茉尔下战书，果果一拳打掉主教牙齿，双方定下文斗与武斗。
  - name: 第一百一十九章 文斗
    notes: 歌德大剧院文斗开场，潘帅率二十名判塔武士跳唱不得不爱，歌坦妮的天鹅湖压过精灵舞娘的弗拉门戈舞；卡卡主教耍赖引发火并边缘，果果第二记冲天炮把红衣主教打下二楼，圣骑士纷纷抛手套挑战麝人与内德维德。
  - name: 第一百二十章 长室中，箭气纵横
    notes: 普斯卡什与刘震撼论人类知不足而比蒙执着并约定角斗后私下相谈；麝人骑牛顿巨鸟空骑压住低阶圣骑士，普斯卡什索走七度金空间戒指；内德维德以天残地缺箭法、反手背箭与马赛回旋射穿高阶圣骑士华金的手掌与腰眼。
  - name: 第一百二十一章 潮汐祭祀成名战
    notes: 加茜娅骑碧玉龙登场，茉儿释放潮汐领主革瑞恩与菲高应战；碧玉龙以龙语驱使上百盆铁树合成六米巨型树精，茉儿用九连环闪电与九叠飓浪斩重创碧玉龙，普斯卡什惊叹一心两用，菲高把巨型树精砸成一堆铁树。
  - name: 第一百二十二章 武斗的结局
    notes: 壹条抽出星辰精钢狼牙棒几棒砸晕白色风龙，人类世界三名龙骑士全部败于翡冷翠领主，人类集体被石化；黛丝答刘震撼就在今天成为天下第一，普斯卡什当众叫走刘震撼，几名比蒙佣兵弯腰低唤天王祭祀。
  - name: 第一百二十三章 一个老滑头 一个小滑头
    notes: 普斯卡什在烟花柳巷托付贞德，自述其母是栗色头发的贝普赛女人、贞德自幼被剃光头，只因圣女必须是拥有花冠的年轻处女；他讲出一万年前神魔大战龙骑士与龙祭祀不少于一百位，末了答应替他谋来死亡领主护盾。
  - name: 第一百二十四章 要命还是要贞操?
    notes: 普斯卡什揭出斐雯丽蟒胆汁第一遍净化不彻底便再难解除，亮出狐女花冠与精灵以毒攻毒两条路，并断定黛丝或许只剩一个月性命后甩袖离去；娜娜哭晕，凝玉带众人离开，只余黛丝与刘震撼面对反噬的抉择。
  - name: 第一百二十五章 龙鳞道
    notes: 黛丝与刘震撼在黑暗中谈论两难处境，她劝他离开，他装君子出门后懊悔不已；黛丝用瞬间移动返回表白，说自他为艾薇尔断臂起就爱上了他，两人结合，若尔娜随即瞬移进来也表白献身。
  - name: 第一百二十六章 姜是老的辣
    notes: 普斯卡什大师带小修女贞德来，赠死亡领主护盾与巨兽之力腰带，还交出把贞德寄养给李察的寄养证书，揭穿以毒攻毒只是玩笑；他劝刘震撼勿倚仗装备，并讲述哑月万年一临、将坠于桑干河的秘密。
  - name: 第一百二十七章 葱是嫩的香
    notes: 普斯卡什之言应验，圣弗郎西斯科帝国特使与夏尔巴家族托蒂伯爵来邀宴，刘震撼以交出一尊钢铁魔偶残骸换得帝国不支持教廷讨伐；他借空间戒指赶路，抵卡瑞姆多平原艾泽拉斯山下地下入口，即将进入地底世界。
  - name: 第一百二十八章 血案迷情
    notes: 刘震撼一行穿过壁障进入地底，飞越巨型石桥与螺旋石阶，试出地底罡风之威；发现被火系魔法杀死并取走魔晶的地狱三头犬克尔柏洛斯，果果捡到凤凰羽毛令歌坦妮变色，随后又见穴居人被屠戮的田垄。
  - name: 第一百二十九章 数点血花亡国泪，二分明月故臣心
    notes: 刘震撼在石笋林救下被鹰牛人围攻的黑暗精灵崔斯特与穴居人婴儿，结识金毛羚牛人邓肯一行；黑犀部落长老唐金讲述千年前比蒙逃入地底的惨史，揭出杜鹃人掉包鹰卵而生出鹰牛人的由来。
  - name: 第一百三十章 决定
    notes: 崔斯特传来消息：斯迈祭祀穆里尼奥赴黑域大陆魔索布拉米城谈判破裂；歌坦妮透露父亲有两只孪生不死鸟魔宠。刘震撼决定赴火焰山谷，提出教穴居人战斗的勇气、建城集中兵力，并答应帮牛头人守护粮种。
  - name: 第一百三十一章 遭遇不祥
    notes: 古德以隔山打牛击败羚牛武士邓肯，熊猫武士与牛头人比武结谊；刘震撼查明穴居人矮山上空必有地底太阳，庄稼靠它生长，它却成了劫掠者的指路明灯。史前巨蚤吸干羚牛武士罗宾逊的血，崔斯特跳上蚤背斩杀巨蚤。
  - name: 第一百三十二章 牛鬼蛇神
    notes: 唐金长老坦承黑犀部落靠亡灵形态的灵魂巡游者复活僵尸战士守营，权杖祭祀力主消灭，刘震撼以祭坛之火与茉儿的真实之眼逼出亡灵后承认了他们；到火焰山谷时堤丰巨人正与寇涛人鱼激战，民兵加入战团。
  - name: 第一百三十三章 朝贡
    notes: 黛丝指挥翡冷翠民兵突袭围攻火焰山谷的寇涛人鱼，菲高与河马诗人下水屠杀，奥尼尔活捉人鱼王；堤丰巨人酋长扬科勒现身致谢，供出血精灵摩尔收买人鱼的内情，刘震撼索要魔法金属赎金。
  - name: 第一百三十四章 珊瑚美人与马龙水晶
    notes: 寇涛人鱼献上地底圣井千年凝结的胶体珊瑚美女像与邮差水晶；德尚讲述高山矮人与钟乳石美女像的传说，众人怀疑珊瑚真有生命。黛丝认出邮差水晶可建传送阵，刘震撼宣布风洞传送阵早已备好，下令先转移老弱。
  - name: 第一百三十五章 弯弓盘马
    notes: 风洞传送阵把牛头人老弱送回翡冷翠，老人见星空痛哭；贝拉米与美杜莎打群架，安度兰长老告知敏克族水貂人为貂蝉族联姻而来，刘震撼拒绝包办。贾巴尔雇来美杜莎侍女与两百蛇族雇佣兵，众人大谈李察是哪个星座降世。
  - name: 第一百三十六章 阴招迭出
    notes: 摩尔血精灵大军进攻，灰矮人隐形、牛鹰人空袭；堤丰巨人撒生石灰粉破隐形，羚牛武士铁链锁身以廓尔克弯刃防空。麝人弹弓手自地底太阳俯射牛鹰人，歌坦妮以禁空之歌令两三百人坠地。
  - name: 第一百三十七章 冬季到地底来看雨
    notes: 摩尔大军连番骚扰疲敌，刘震撼撤回羚牛武士休整；血精灵法师与剑咏首次上阵，地底突降暴雨浇伤焰肤的堤丰巨人。刘震撼命内德维德鸣镝，菲高与奥拉朱旺自直布罗陀河跃出反击。
  - name: 第一百三十八章 盘肠大战
    notes: 血精灵剑咏御剑重创不死牛头武士，刘震撼开献祭卷轴反冲锋，翡冷翠民兵锥形阵首度被灰矮人百年辫髯战士钳制。暴雨令生石灰沸腾，数千灰矮人被活活煮死，八十六名獒人倒下八十三人，白银基座战甲报废。
  - name: 第一百三十九章 堕落大串联
    notes: 交代化学是女巫的学问，刘震撼仍想不通少量石灰何以煮死数千人，靠避水龙珠撑开雨幕，还从天上接到一条无眼地底鱼。他派小崔、若尔娜与娜迦乘壹条去其他三个堤丰营地探查，古德质疑两支精灵何以能施水系魔法。
  - name: 第一百四十章 卷土重来
    notes: 血精灵法师不信比蒙能穿过罡风天堑；刘震撼以魔法传送阵为饵，提出带堕落精灵返回地表，暗中盘算把他们丢到卡瑞姆多大平原消耗人类。他骑革瑞恩探天梯山井梯，发现降雨源自穴居人凿通的地下水泡。
  - name: 第一百四十一章 外籍刀圣
    notes: 肥罗扛白旗护送血精灵使者过河谈判，被山丘之王用风暴之槌偷袭，遭巨斧开颅时以绿党刀法镜像脱身，用大地精单手拔剑术自创的致命一刀剖开山丘之王肚皮；内德维德湮甲箭攒射摩尔法师，壹条持床弩参战。
  - name: 第一百四十二章 桃色谈判
    notes: 摩尔亲王贝尼特斯亲身验证传送阵后与刘震撼谈判，刘震撼要求终止对四个巨人山谷的军事行动；若尔娜汇报南部熔岩山谷被卓尔围而不攻；贝尼特斯揭出卓尔内部分歧，开出只有靠淫媒献身才能完成的日光洗礼仪式条件。
  - name: 第一百四十三章 巨人之心
    notes: 刘震撼驰援熔岩山谷，破掉卓尔用湿蕈秆与苦洱藤制造的土造芥子气；拿破仑巨人艾弗森持火焰长剑殿后救出牛头人妇孺，被招揽为贴身侍卫。他调集四大山谷堤丰巨人修复云秦金人，下令全力铸造机械高岑。
  - name: 第一百四十四章 两岸连通
    notes: 菲高从寇涛人鱼手中掠得马龙水晶与多种珍宝；若尔娜在滚石、灼炎两谷建成风洞传送阵。堤丰巨人献出地心玄钢锻造第三批武器并修好云秦金人。刘震撼瞒着妻妾准备日光洗礼仪式，带小修女贞德与四大龙禁卫赴黑域大陆。
  - name: 第一百四十五章 他乡遇故知
    notes: 刘震撼抵达魔索布拉达城，双头奇美拉仪仗队与战争古树亮相，他遭古树掷果与两名女精灵刺杀，内德维德射杀刺客；穆里尼奥主祭出面喝止，他竟已让上千卓尔改信萨满教义，主母们选他作洗礼人选，亲王当众点出寸金之名。
  - name: 第一百四十六章 贼咬一口，入木三分
    notes: 穆里尼奥在魔索布拉达备受卓尔主母追捧，刘震撼被簇拥进主母府邸；八位主母分成激进与保守两派，他开出八百头双头奇美拉、六棵战争古树、超阶魔晶与两百灰矮人铁匠的条件，幽月儿随后决定召见天鹅主祭。
  - name: 第一百四十七章 天鹅主祭的张良计
    notes: 穆里尼奥一口应承守望者备选，卓尔主母以虿盆威胁改信萨满教义的族人；贝尼特斯抖出密林树妖与密林守护者由塞纳留斯杂交而来及其血谱禁忌，穆里尼奥索要布谷族杜鹃人和二十名卓尔信徒，刘震撼提出先铺设魔法传送阵。
  - name: 第一百四十八章 过墙梯被拆
    notes: 摩尔与卓尔为谁先回地表争吵，刘震撼踢飞茶几压场；穆里尼奥改提多瑙大荒原桑干河南畔、泰穆尔拉雅雪山脚下针叶松林为落脚点，历数人类床弩与破魔箭之强，并盘算吞并德鲁伊、森林精灵与山丘巨人以腾出三个军团。
  - name: 第一百四十九章 双赢
    notes: 两位祭祀在护城河边并肩密谈，穆里尼奥吐露对自由民主的向往与比蒙王国内情——神庙、长老院与王权三足鼎立，莱茵与泰戈争位，齐丹归附布拉特，六大贵族各有私军；他当场提走卓尔四台鸟翼弩车，气得幽月儿破口大骂。
  - name: 第一百五十章 守望者海选
    notes: 刘震撼把双头奇美拉与六棵战争古树收进空间戒指，卓尔八大主城投入守望者海选；一万三千余密林半精灵中魔索布拉达占四千多，经丈量、耐力、地底苍蝇水、声音与魔法抗性筛选，定出一名守护者与两名树妖加老刘。
  - name: 第一百五十一章 美色的典故
    notes: 血精灵的巨魔蝙蝠接连被偷吃翅膀，摩尔亲王用蜡溶妖火苗计时解说仪式规则；那密林守护者进神庙片刻便被吸干成一具僵尸武士，刘震撼随后上场，行文中还考据了沉鱼落雁、闭月羞花、倾国倾城与风华绝代的典故。
  - name: 第一百五十二章 虚伪的圣洁――堕落仪式
    notes: 萝丝神庙内十三级台阶、二百五十步与檀香迷烟环环设套，蜡溶妖幻化成刘震撼兄长的模样乱其心神，八位主母以迷迭春香与杜蕾丝幻雾催情；赫莲娜的黑暗吮吸术只使八成放水，幽月儿接过前排，老刘却在浓雾中挣脱消失。
  - name: 第一百五十三章 洒下裂缝的种子
    notes: 巨魔蝙蝠尸体出现在虿盆引发摩尔与卓尔街头群殴，摩尔亲王也挨了黑拳；肥罗一刀背拍翻蛛化卓尔，卓尔调来狼脚蜘蛛与鸟翼战车围住众人，维埃里放出雷兽、肥罗放出巨型树獭反压，文中详解战车骑兵被淘汰的缘由。
  - name: 第一百五十四章 拔鸟无情
    notes: 贝尼特斯抱怨摩尔剑齿兽战车仅二百五十乘而卓尔狼脚蜘蛛战车有千乘，艾弗森看上宝剑巨蜘蛛；蜡溶妖火焰转暗青将熄，刘震撼扛着巨茧走出神庙，黑暗精灵已尽数化为能影遁的暗夜精灵，摩尔的储物腰带也被趁乱抽走。
  - name: 第一百五十五章 龟吸领域结界
    notes: 众人回到城门口吊在空中的树屋驿馆，肥罗剖开蚕蛹放出宝剑蜘蛛，刘震撼以固态蛛网术将其降服并赐给艾弗森；他讲述堕落仪式的奖励，除暗影突袭与每日四次的蛛网术外，还有二重进化结界龟吸领域，第三层结界已成小半。
  - name: 第一百五十六章 大棒与女神
    notes: 刘震撼向维埃里、肥罗、罗德曼讲述堕落仪式细节，血胶棒子与龟吸领域如何豁免黑暗吮吸术；爱琴大陆历来从无神祇现身人间的记载，蛛后萝丝却疑似亲自降临仪式现场，幽魂九头蛇怪吉安娜点头证实珊瑚美人活过。
  - name: 第一百五十七章 鸡肋集中营
    notes: 果果献上沾着处女血的餐巾作哈达，刘震撼下令封口不许茉儿等老板娘知情；果果偷来摩尔亲王的储物腰带，匣中青铜书、血精灵剑谱与六枚驮都悉数曝光，艾弗森讲解驮都乃摩尔法师血婴焚化后的魔法结晶。
  - name: 第一百五十八章 血羽之心
    notes: 摩尔亲王贝尼特斯追讨玉玺与铜版秘籍，刘震撼谎称驮都已扔；亲王邀他以守望者身份角逐卓尔高层并提议摩尔公主联姻，被拒后赠送七颗能自动回魔的血羽之心，老刘则盘算借刀消耗卓尔空军。
  - name: 第一百五十九章 电影传奇
    notes: 堕落精灵全民迁徙需三到五个月，联合空军开赴堤丰山谷；暗夜魔猎手加林查的断水、木龟计先后失败，帝维实况拍下战况让全军如痴如醉连播十遍，众人竟一致决定看完实况再进兵猎魔。
  - name: 第一百六十章 闷声大发财
    notes: 联军进入地狱焦盐沼泽，巴托恶魔与盐霜巨人率魔兽大军迎击，刘震撼与奥特加剖析血婴混合溅射魔法的成因；他私下打着血饲血婴、拓印精灵古书的主意，尸骨小山炸裂，方知火焰君主的魔冢就在第一线脚下。
  - name: 第一百六十一章 屠魔不成反被屠
    notes: 火焰君主巴斯图尔克从骷髅山下破土而出，盐霜巨人盐矛与伊米尔牛头人石盾冲垮卓尔阵线；河仙人的伽玛射线、伊米尔牛头人的来历与火焰君主豢养魔兽大军逐一揭示，火焰君主还带有反弹伤害的火焰压榨护甲。
  - name: 第一百六十二章 金牌替补
    notes: 火焰君主以陨石雨重创堕落精灵大军，一万河仙人仅剩四千余；加林查被迫求援，幽月儿开出十枚血羽之心与四台鸟翼弩车的价码，刘震撼一句你应该早点说便率皇冠荆棘重甲的翡冷翠战士上场。
  - name: 第一百六十三章 敌我不明
    notes: 六翼炎魔率吐火罗鸦群抄了精灵空军后路，咸水夔牛与三足金蟾又自左右包夹，火焰君主道破地底超阶魔兽因惧怕地狱黑龙与邪眼暴君而结盟；博浪沙火鹤壹条驮着果果现身后与火焰君主对峙，各方彼此猜忌敌我不明。
  - name: 第一百六十四章 火鹤已随云影杳
    notes: 加林查变身木乃伊战士死战，刘震撼率三百比蒙以云秦金人与猛犸重骑兵碾开魔兽群；壹条与火焰君主血战被完美火山重伤栽进岩浆，刘震撼悔恨未先给它加持献祭卷轴，火焰君主转身盯住他。
  - name: 第一百六十五章 银拳犹带火光寒
    notes: 火焰君主巴斯图尔克借岩浆治愈水疱，因天魔解体大法反噬而顿悟晋阶火焰帝君，人型形态与火翼到手；刘震撼用秘银手臂汲取其近三分之一力量，掷枪贯穿其小腹，又贴身痛殴，并从烧红的黑曜石里发现冻结其中的壹条
  - name: 第一百六十六章 永夜的极光
    notes: 火焰帝君与六翼炎魔欲借熔岩遁走，被壹条用变异火系法术「冻顶乌龙」冻住岩浆；壹条又以「大印象火焰塑形」将帝君永久固始在人型状态，再由刘震撼拧断其颈骨夺命，壹条随即宣告自己名叫极光
  - name: 第一百六十七章 唇枪可比十万军
    notes: 十二头地狱黑龙现身索要两位仙女龙，族长罗纳尔迪尼奥以全族之力相胁；刘震撼先抛出魔族万年入侵之期劝黑龙投奔魔族被斥，再搬出祖先之罪不该由后代承担的言辞，终于说动黑龙动身去地表
  - name: 第一百六十八章 有笑有泪
    notes: 潮汐领主革瑞恩七寸受创将死，刘震撼用菲高的巨型佩剑送它一程，再以死亡领主戒指汲取其血液、把它变成保持生前思想的戒灵，好与幽魂许德拉吉安娜永不分开；卓尔主母幽月儿为咸水夔牛上门讨说法
  - name: 第一百六十九章 无事献殷勤
    notes: 摩尔亲王被刘震撼拿话堵住仓皇告辞；内德维德以豪斯族「相马术」与「相训秘语」降服犀牛大小的三足金蟾当坐骑，被封翡军索骥骑士；空中的邪眼暴君用精神力在所有人心里说话，众人才知它能无声控制精神
  - name: 第一百七十章 不是你死，就是我亡
    notes: 摩尔亲王贝尼特斯揭出血系魔法禁忌：等级护盾、以血还血赎罪诅咒、每月冷热交替的剧痛与脑海中凝结的血魄驮都；邪眼暴君道破自己觊觎圣奇奥驮都的真意，刘震撼亮出古力火铳，壹条持青锋剑冲上云霄
  - name: 第一百七十一章 裸战
    notes: 壹条与邪眼暴君展开肉搏，以成名绝招「倒挂旗枪」刺穿其精神力护盾、刺飞三根触须；邪眼暴君用精神冲击夺去壹条一瞬恍惚，以四道霓虹射线将他重创；章末壹条自剥鹤皮使出「大红袍」，随后倒地
  - name: 第一百七十二章 祭祀之血，熊熊燃烧！
    notes: 歌坦妮挺枪冲锋，却被邪眼暴君精神控制后反手刺穿刘震撼手掌、斩断其右脚肌腱；刘震撼与果果先后被触须裹住，果果被送到獠齿巨嘴边，邪眼暴君逼刘震撼签下精神烙印契约，却忘了他还是一位比蒙祭祀
  - name: 第一百七十三章 一滴老鼠屎可坏一锅粥
    notes: 果果把「霜雪冰弹」喷进未完成的魔法契约，邪眼暴君遭魔法反噬，触须上的独眼尽数炸碎；刘震撼以魔导士血箭射爆其主眼，与果果砸死暴君；若尔娜的「翡翠之梦」召来加百列魔蝶，茉儿抢先收作魔宠，片末龙吟声起
  - name: 第一百七十三章 真兰乱舞
    notes: 穆里尼奥赶到地底追问歌坦妮伤势，加百列魔蝶一场天魔乱舞让十二头地狱黑龙与众人都跳着舞退走；刘震撼把邪眼暴君肉球当皮球玩，两支堕落精灵交割血羽之心与双头奇美拉，黑龙族长上门谈回地表条件
  - name: 第一百七十四章 圣奇奥！唐白虎！
    notes: 穆里尼奥带冰凰与歌坦妮回地表，刘震撼留下处理地底事宜并招降地狱黑龙；翡冷翠夜宴迎接领主归来，泰戈族彪人武士与白虎祭祀丹尼斯·博格坎普登场，自称红衣大祭司特使
  - name: 第一百七十五章 利益的拉拢
    notes: 博格坎普以泰戈族友谊拉拢刘震撼，赠兔美人侍女与四位彪人武士；监察院特使加内特伯爵一再挑衅威胁弹劾，崔蓓茜提醒勿得罪小人；宴上海伦以狐步舞戏弄加内特，美杜莎领主特雷泽盖与长老霍利尔现身
  - name: 第一百七十六章 剑桥大祭师
    notes: 博格坎普宣布王国将建比蒙剑桥祭祀学院并由海伦出任首任院长，众祭祀震惊；战舞不受拗口音阶限制可大规模传承；海伦获封剑桥大祭师与孔雀翎祭祀袍，品阶等同红衣大祭司
  - name: 第一百七十七章 跳蚤金车和秘密武器
    notes: 加内特伯爵献跳蚤金车宝物，被果果泼忌廉烫死跳蚤而当场晕厥；博格坎普透露春季攻势将占四个沙漠绿洲加剑桥绿洲，在王国西北部竖起屏障并可能再添一个小行省；海伦决心参战
  - name: 第一百七十八章 局势迷离
    notes: 摩尔亲王问比蒙巨兽骑士被支开，穆里尼奥谎称堕落精灵是雪山精灵；秘密武器为作伥军团十位彪人空骑士与二十骑角鹰精灵骑士；荣耀骑士团成立，穆里尼奥谋取指挥权并图谋南十字星森林
  - name: 第一百七十九章 壮志雄心
    notes: 刘震撼以千年牛黄承诺为冰凰接生，两人摊牌承认嫉妒并约定做对手；穆里尼奥吐露想借联合席议为斯迈族争话语权；又揭出美杜莎是被本族放逐的双头蛇人与画蛇人后代，崔蓓茜亦在其中
  - name: 第一百八十章 巴蛇吞象
    notes: 壹条因盯着费雯丽被美杜莎巨蟒武士围攻，肥罗拔刀护主；美杜莎刀圣永贝里现身，刘震撼提议以切磋定夺，赌注是不再盯着费雯丽；两位刀圣交手，永贝里以破衡与卸力占尽上风
  - name: 第一百八十一章 七刀连环
    notes: 永贝里亮出巫医秘技蛇蛊刀，肥罗以鼻刀、辫刀、涵道刀桨与挑刀术七刀齐出反胜；刘震撼向崔蓓茜摊牌，表明翡冷翠与美杜莎不可能同路；又逼问壹条是否喜欢费雯丽，壹条只答放屁
  - name: 第一百八十二章 桃花劫
    notes: 壹条追述丝绸大陆往事：博浪沙火鹤将卵产在火沙巨蚕体内，他由松鼠妈妈养大因而性情开朗；出山后得名永夜的极光，遭伏击重伤被老法师所救；老法师临终占卜出桃花劫、驿马迫火行、大利西方
  - name: 第一百八十三章 驿马迫火行
    notes: 壹条与青玉灵蟒白素青在桃花树下相遇动情，白素青为救恩人而来盗紫芝草，壹条改赠醒魂草；白素青笑称与恩人只是兄妹相称；二人回城后男人报官，黎山门趁势以归来去兮露废掉壹条法力并制住白素青
  - name: 第一百八十四章 大利西方
    notes: 壹条讲述白素青自毁五百年修行、以蛇蜕术自囚于云秦方士所铸七宝塔禁锢水窖的往事；他依老法师「大利西方」的预言西行寻地精，刘震撼派若尔娜与黛丝护送他返回远东丝绸大陆，并筹划搭建魔法传送阵。
  - name: 第一百八十五章 内务统筹
    notes: 晚宴过后刘震撼清点战利品，加内特伯爵索要美婢侍寝，被塞了两个食人魔女奴；猛虎佣兵团团长罗西携夫人米娅及八百余森林精灵来投，翡冷翠兵工厂集齐四大铁匠，两支堕落精灵在地底驻兵的隐患令他头痛。
  - name: 第一百八十六章 孪生血婴
    notes: 刘震撼用咸水夔牛牛黄误治冰凰，导致唐蓓尔金娜早产下一枚无法孵化的凰蛋；冰凰将蛋冻结成冰雕，穆里尼奥扬言杀他，刘震撼砸冰血饲，孵出一个霜雪皮丘兽模样的血婴与一个酷似穆里尼奥的男婴。
  - name: 第一百八十七章 天下第一伦理错乱
    notes: 血婴原理被详加解释，血婴抽取宿卵一半元素力量并可延续法师寿命；刘震撼察觉两个血婴没有丝毫元素波动，推断凰蛋是穆里尼奥与冰凰之子，伦理错乱令他当场昏厥，为二子取名唐家二少与唐家三少。
  - name: 第一百八十八章 调皮的儿子
    notes: 两个儿子失踪引发全城大乱，刘震撼先赴地底从卓尔精灵空骑士手中抢夺奇美拉卵，又以冰雕飞凰替换雪山山洞中的凰蛋；回城后众人遍寻不着，最终发现兄弟俩化成两棵佛肚竹，冬虫夏草的猜测被推翻。
  - name: 第一百八十九章 比翼鸟 连理枝 并蒂莲
    notes: 孪生血婴展示变身之能，先化为佛肚竹，再于桑干河化作各持一翼的鸢尾大鸟合体飞行，最后成为一红一白并蒂莲；摩尔亲王警告孪生血婴会抽干全部元素力量，刘震撼谎称宿卵是蜡溶妖，长老指出孩子咳嗽是先天风寒。
  - name: 第一百九十章 凤凰之秘
    notes: 加内特伯爵被食人魔卡鲁拖进奴隶洞穴受罚；安度兰长老随后揭示凤凰的诸多分支与凤凰之神夏圭维持世界平衡的职责，并讲述飞廉、鸠鸟、巨龙只能充当比蒙坐骑、黄金家族血脉以及凤凰为精灵专属魔宠等秘辛。
  - name: 第一百九十一章 冰霜巨龙
    notes: 长老说明穆里尼奥凭外籍精灵身份赢得神圣凤凰滴血认亲，故成钻石家族；二少三少是受诅咒的鹣鲽，永生永世不能分开，可化身任何动植物但变身时没有魔法；长老最终自承是五阶冰霜巨龙阿斯顿维拉·安度兰·帕克。
  - name: 第一百九十二章 剑咏绝技
    notes: 冰凰唐蓓尔金娜登门道谢并为冰雕所惑，请求带两个孩子回采玉城小住，刘震撼答应并赌她不敢砸碎假蛋；他随后修习摩尔剑咏却只学会起手剑式，索性把长剑换成无柄战斧，自称圣奇奥斧咏，断臂与鼻洞渐愈。
  - name: 第一百九十三章 分赃大会{上}
    notes: 无柄战斧以月刃式钩型双翼定型，堤丰巨人焊接铁箱装载两百把，一息双发、千码压制；摩尔亲王被这种圣奇奥鸡尾酒法术式的双重混搭吓傻，长老点明龙力与血系双修之理。分赃开始，奥特加与茉儿各得重宝。
  - name: 第一百九十四章 分赃大会{下}
    notes: 分赃继续，了望者号角与死亡领主的护盾、姜之忍耐夔鼓、萨拉斯火焰魔弓各归其主，小修女贞德获不死战士；逃兵娜迦与塞壬被放逐远东。刘震撼率众赴沙巴克王城参加奥林匹克盛典，长老独留高坡，醒悟诅咒已应验。
  - name: 第一百九十五章 神曲萨满
    notes: 刘震撼随天鹅主祭穆里尼奥横穿多瑙大荒原赴王都沙巴克，沿途向流浪牧民布道剿匪，忽生顿悟，以自创汉语战歌领悟终极战歌「战神光辉之神曲」，成为神曲萨满。
  - name: 第一百九十六章 国王的邀请
    notes: 狮虎王子李察率五十名「战神之鞭」牦牛重骑兵招摇踏入战神广场，当众告知海伦其外公沃勒尔已升任训兽总长并获伯爵头衔，随后以国王之名派皇家马车接走海伦与茉儿入宫赴宴，留下刘震撼面对王子的刁难。
  - name: 第一百九十七章 井底之蛙
    notes: 李察王子当众讥讽翡冷翠民兵是杂牌，邓肯自称米诺陶斯人身份被质疑；刘震撼与王子互殴，獒人、河马诗人、彪人武士一拥而上打散牦牛重骑兵，歌坦妮出面劝阻时刘震撼与果果已扑向王子。
  - name: 第一百九十八章 魔歌武!三修祭祀!
    notes: 刘震撼以迟钝光环和两道固态蛛网术两招将狂化的李察王子裹成蛛网茧，果果率孪生血婴变身连体牧树人痛打剑甲龙；穆里尼奥以火凤凰威压制止混战，众人才知他是歌魔武三修祭祀。
  - name: 第一百九十九章 后台强劲
    notes: 红衣大祭司布拉特霓下携两位角蝰神使与狮心亲王卡恩同至，卡恩要求军部发落翡冷翠民兵；刘震撼剥了王子臀部甲片被虎尾抽脸，内德维德以魔弓震慑王子，王子仍坚持决斗。
  - name: 第二百章 不是猛龙不过江
    notes: 比蒙决斗惯例要求挑战祭祀者同时面对其追随者与魔宠，两位祭祀与两位草原精灵法师主动追随李察王子；翡冷翠一方的宝剑蜘蛛、雷兽、三足金蟾、双头奇美拉与皇冠荆棘战甲尽出。
  - name: 第二百零一章 新颖的加冕仪式
    notes: 刘震撼于邓肯的金属图腾柱与广场战神雕像之间连发两道神曲光环，令两位精灵法师无处措手；布拉特霓下点破其神曲萨满身份逼退王子，随即为他换上「歌唱衣冠」等萨满装备。
  - name: 第二百零二章 初夜权
    notes: 布拉特霓下在沙巴克主神庙设清水面包之宴，坦承神庙已分莱茵、穆里尼奥与泰戈三派，并请刘震撼以首席萨满身份随军出征沙漠掠夺铁匠与矿区；刘震撼请封狈人沙罗曼为侍从神官。
  - name: 第二百零三章 夜生活
    notes: 刘震撼看破自己在春季攻势中被当作神庙与军方争夺战利品的出头鸟，仍装傻应承；布拉特霓下以姆格酒相待，讲解壁虎兽亲看门称「守宫」、管家称「宫相」等古代神职称谓。
  - name: 第二百零四章 禁卫军的消息
    notes: 刘震撼回战神广场途中见贝拉米与内德维德拆射戏摊子、半身人厨师偷吃第六顿晚餐；进酒吧后得知四位绿党族螳螂刀圣来自王宫内廷，为首者正是禁卫军刀法总教官希勒。
  - name: 第二百零五章 无良父亲
    notes: 希勒要求绿党僧侣回族群结婚生子，刘震撼以苦行僧禁欲教义回绝，又搬出神曲萨满身份宣布可设「巫医神官」收编僧侣；他让海沟虹族族长切尼替自己纹刺青，一边搂着二少三少编派王子。
  - name: 第二百零六章 四重力道纹
    notes: 小狐狸与小蝴蝶一夜未归，刘震撼让海沟虹族刺猬族长切尼为他重针纹身：背后纹下山猛虎，左右臂各刺一行词句，大腿根又添两幅敦煌飞天神女，共得四重力道纹。
  - name: 第二百零七章 国王、王后、公主
    notes: 祭祀盛典开幕，刘震撼迟到后由红衣大祭司布拉特引见十一位主祭，暗中盘算莱茵与教宗的势力网；国王格雷克·萨尔携安琪尔王后入场，宣布调拨海伦赴剑桥绿洲建立祭祀学院，王后认海伦为义女。
  - name: 第二百零八章 演出开始了
    notes: 刘震撼推演以金属图腾柱加持神曲光环、组建禁魔军团；教宗临场点圣凯路袋鼠主祭穆罕·阿里下场与海伦比拼战歌光环，国王朗读阿里简历，牵出南星会战与杰斯特人丛林漫步者旧事。
  - name: 第二百零九章 海伦时间
    notes: 海伦与袋鼠主祭在金冠角斗台比拼战歌光环，她以战舞压制对手，夔鼓爆出邪恶光环与辉煌光环，众祭祀认出祭祀神器姜之忍耐夔鼓；她连施盐霜、石肤、荆棘、闪电多重护甲。
  - name: 第二百一十章 醋海生波
    notes: 海伦先假装与刘震撼划清界限、骂他丑陋粗俗，又痛骂插话的袋鼠主祭阿里，随后破功承认自己是在吃醋；她的表演把满场贵族一并耍了，国王上前与刘震撼寒暄。
  - name: 第二百一十一章 沙城上空的明珠
    notes: 东北神庙阵容寒酸，刘震撼开赛两分钟就弃权回包厢，只为不淘汰执着的年轻祭祀鲁尼；茉儿与契克因族祭祀茜茜对垒，茜茜拥有三胞胎三头火焰鳄首龟，茉儿以九连环闪电与云秦金人应对。
  - name: 第二百一十二章 冒牌先知
    notes: 国王以狮子吼喝止茜茜吟唱星云连锁闪电，茉儿的魔法引发军方与神庙争抢；刘震撼把云秦金人冒充土元素，谎称茉儿自然进化出两首失传战歌，索取苍穹先知头衔。
  - name: 第二百一十三章 淫亵战歌的后人
    notes: 穆里尼奥以黄金笛与腹语术演示自创战歌大风歌，风刃集群把大理石花坛切成碎块，刘震撼用帝维水晶偷录；民间契克因祭祀茜茜请求神庙为三百二十四年前被烧死的祖父普拉蒂尼在法典中正名。
  - name: 第二百一十四章 抬杠
    notes: 长老院昆丁与贵族齐声要求烧死异端，首席昆丁老雷德克纳普接手火刑；茜茜承认已掌握简爱战歌并当众辩解；刘震撼质疑法典记载，狼族主祭斯普雷维尔发起决斗，被他召出的潮汐领主当场斩杀魔宠。
  - name: 第二百一十五章 逼奸
    notes: 国王制止双方，刘震撼抢先将茜茜征召为战神夏宫圣女，海伦以教义感化条款与茉儿共同反击；茜茜讲述绿党族新婚夜领悟淫之歌、普拉蒂尼八年研究出简爱战歌的原委，沃尔夫大昆丁逼刘震撼亲自验证。
  - name: 第二百一十六章 血腥真相
    notes: 国王以三百年无危害为由劝阻教宗，刘震撼带茜茜搬入国王新赐的王族包厢；穆里尼奥与崔蓓茜揭出真相：祭祀神话普拉蒂尼因竞选红衣大祭司破坏莱茵与泰戈的三权平衡而被诬陷为异端，契克因本非天生妓户。
  - name: 第二百一十七章 国王的眼光
    notes: 国王格雷克.萨尔单独召见刘震撼与海伦，授予战神骑士勋章，盛赞翡冷翠战绩与藤甲创意，透露美杜莎脱离、斯迈族欲独立的内情，警告新贵远离权力是非圈，并明言无法为简爱战歌正名。
  - name: 第二百一十八章 天才一系!乱伦一系!
    notes: 秋刀宴上彼尔族长老以花粉蜜换麝人、俄勒芬族长谈猛犸归宗、绿党族长讨螳螂僧侣婚配；茉儿借普斯卡什之女身份压服众法师。夜宴贵族逼刘震撼证明淫亵战歌，神曲光环意外罩中歌坦妮等四女，取消觖选，双龙降临。
  - name: 第二百一十九章 龙族的公事
    notes: 七彩龙易卜拉西莫维奇与仙女龙伦娜点名李察，索讨黛丝与若尔娜；伦娜以两龙城信誉告知万年之期将满、魔族入侵不可避免，南十字星森林与白令山脉均有时空裂缝。国王立誓不让比蒙种族消失，刘震撼谎称阿斯顿维拉已死。
  - name: 第二百二十章 龙族的私事
    notes: 刘震撼以黑昙光环召出许德拉与革瑞恩证明自己能上雪山，坚称黛丝若尔娜只是顾问；七彩龙出言轻视比蒙，刘震撼揭破龙族畸形后代木须龙之秘。七彩龙横扫皇家卫士，国王狂化坠地，两拨追随者列阵对峙。
  - name: 第二百二十一章 三大巨力
    notes: 祭祀放出十头以上魔宠、十余位魔法师汇成魔法风暴逼退双龙；穆里尼奥与刘震撼改用纯物理较量。穆里尼奥以力量汲取之歌造出九牛二虎一只鸡的镇水之力，刘震撼以龙象之力迎战，七彩龙施展金属固化化为全金属结构。
  - name: 第二百二十二章 拳脚相加
    notes: 穆里尼奥掷出四百磅花坛砸中七彩龙却毫发无伤，两人移师金冠擂台。刘震撼一拳把金属化的伊布震飞十几码；穆里尼奥以密袈大手印硬撼旋风踢打技，七十六次交手后双方各自退开。叙述补出泛大陆两大徒手格斗技法。
  - name: 第二百二十三章 赖皮武术家
    notes: 穆里尼奥当众削木生火使出燃木大手印；刘震撼以秘银手臂诱敌、就地翻滚摔倒伊布并以反关节捕俘术锁喉。仙女龙斥其违规，人马箭手内德维德骑癞蛤蟆现身震慑全场。刘震撼亮出隐形纹身护盾，再偷袭得手后被龙威震晕。
  - name: 第二百二十四章 弥天大谎
    notes: 七彩龙疑似用魔法金刃割开蜘蛛网；穆里尼奥以火浦珠与黑天鹅之说威慑受伤的伊布。刘震撼十息即起，自称圣奇奥，仙女龙讲解预言系魔法不算三系魔法。双龙猜他是龙人后裔，刘震撼谎称父亲是冰霜之舞者阿斯顿维拉。
  - name: 第二百二十五章 龙族大八卦
    notes: 双龙把刘震撼拉到墙角密谈，他靠血系御力在空中显摆；伦娜称已大体相信他与阿斯顿维拉关系密切，但龙城绝不公开承认。二人抖出龙族最大丑闻：人型巨龙与智慧种族生下龙人，两龙城替混蛋龙擦屁股，刘震撼索要坐骑。
  - name: 第二百二十六章 翡冷翠未来法师团
    notes: 龙城拒绝调拨巨龙坐骑，并揭示主动参战是为报一万年前魔族盗空两处龙之墓地两百多具龙骨之仇，龙族怀疑魔族会拼造骨龙。大陆巨龙不满两百头，与两龙城有往来者仅十七头。伊布擅作主张答应调拨一百五十名成年龙人。
  - name: 第二百二十七章 世上没有无缘无故的爱
    notes: 龙人以精灵系占五成、巨人系占三成、比蒙与人类系占两成；刘震撼催龙人早日到翡冷翠备战。伊布赠予十二报时腕轮并以火焰短信联络，末了揭出自己也姓泽拉坦，双龙竟是黛丝的父母，刘震撼当场成了毛脚女婿。
  - name: 第二百二十八章 身份悬案
    notes: 比蒙权贵集体质疑李察的种族身份，怀疑他不是匹格而是芒克族；刘震撼以外籍精灵导致鼻型变化搪塞，吟诵改编小诗蒙混过关；沃尔夫大昆丁老雷德克纳普逼他十天内让茜茜怀孕；国王留下赠言，刘震撼踩断教宗棘皮尾巴。
  - name: 第二百二十九章 圣奇奥遇险记
    notes: 客栈酒吧被二十来个比蒙小流氓掀桌闹事；圣奇奥大法师普斯卡什现身，与刘震撼熊抱相认；他取出红泥金印盒在刘震撼手腕画出六芒星阵，验出刘震撼所修为血系法力；贞德被唤来见亲生父亲却满脸不情愿。
  - name: 第二百三十章 旧日血婴，今为大害
    notes: 普斯卡什自述当年与血系法师坎通纳苦战才晋升圣阶，刘震撼讲出每个血婴脑中都有驮都、圣阶血法师会诞生血魄驮都的秘密；坎通纳的血婴已破坏时空大裂缝禁制并被赶到多瑙荒原；刘震撼怀疑它藏在堕落精灵的地表新城。
  - name: 第二百三十一章 口是心非
    notes: 普斯卡什与安度兰互相推崇，刘震撼讲完沙巴克见闻后被骂鼠目寸光；两位智者指出堕落精灵在地底积累万年、早已武装到牙齿的威胁；刘震撼宣称自己不信元素力量源于神祇却信仰战神，海伦听了差点吓晕过去。
  - name: 第二百三十二章 座骑闹剧
    notes: 茉儿被授予苍穹先知头衔，与十二主祭同级；神庙拿不出冥河符文宝石与先知法杖，只能伪造一根镶火焰宝石的法杖；海伦抗议坐骑被罢免，刘震撼在晋级仪式上撒泼，扯住普斯卡什的衣领要借调一头巨龙给茉儿当坐骑。
  - name: 第二百三十三章 众星耀沙城
    notes: 国王调拨军用役兽与千里马供茉儿挑选坐骑；十二人对战中歌莉妮率丛林漫步者等女子追随者、歌麦斯率精灵战士双双晋级，采玉城费雯丽的美杜莎巨蟒武士也顺利过关；普斯卡什当众称赞李察，权贵们争相巴结。
  - name: 第二百三十四章 因鸟而起
    notes: 小鹦鹉病情加剧，巫医诺查丹玛斯与安度兰都验不出病因，被掳来的美杜莎巫医断言毒入膏肓；刘震撼揍了巫医，穆里尼奥带采玉城族长上门问罪；冰凰唐蓓尔金娜为两位血婴给鹦鹉输血，穆里尼奥默默离去，两边关系搞僵。
  - name: 第二百三十五章 吹哨子
    notes: 教宗悻悻离去后，海伦为冲撞教宗的死罪后怕，四位彪人武士挑战领主被斥退；小鹦鹉恢复骂人；安度兰剖析李察与穆里尼奥互相较劲的根由；果果用海伦的空间戒指放出钢板魔法阵，凝玉、若尔娜、黛丝和壹条赶回沙巴克。
  - name: 第二百三十六章 毛遂之茜茜
    notes: 黛丝与若尔娜误会茜茜是刘震撼新惹的情债；众人讨论小鹦鹉中毒的蹊跷，凝玉推测是采玉城美杜莎下毒；壹条以自己的血替鹦鹉解毒，小鹦鹉康复后被海伦命名为马特拉奇；一直被忽视的茜茜毛遂自荐要用战歌辨毒。
  - name: 第二百三十七章 本物天下霸唱
    notes: 海伦揭示五线曲谱与天下霸唱家族的来历，千古第一异端普拉蒂尼正是这个契克因家族后裔；茜茜自述家族五十七口逃到塔克拉玛戈大沙漠牛津绿洲，四百多族人遭沙漠强盗屠杀；茉儿承诺包下珍珠做七弦琴。
  - name: 第三百三十八章 谁是幕后黑手?
    notes: 茜茜讲出家族自创的丝路水韵之歌改编自司高帝族蝎人的卡尔文洞察韵律，可凭声波检测毒性；她当场演示战歌，血色光幕浮现鹦鹉骨架与毒素名称血腥玛莉，战歌日志却没有解药配方；她痛陈沙漠人类屠杀族人的血仇。
  - name: 第二百三十九章 毒物连环陷阱
    notes: 普斯卡什与安度兰解释血腥玛莉由精灵提取、成瘾难戒且无解，检测发现壹条也已中毒；推宫过血让毒素在受血者之间传染，小崔直言摩尔精灵根本没有解药；众人议定绑架美杜莎巫医或求食毒蛊，黛丝最后提出用龙珠辟毒。
  - name: 第二百四十章 珍珠收藏家
    notes: 刘震撼清点自己多年收藏的各类魔兽珍珠；娜娜与黛丝甘愿取出下颌骊珠换取修习魔法的机会；凝玉以摩韶族蚌人的探骊取珠论证取珠不伤性命；普斯卡什的传讯魔球送来消息，教廷龙骑士加茜娅与兰帕德已到城外五十里。
  - name: 第二百四十一章 乱局已现
    notes: 普斯卡什坦承开龙骑士的玩笑，又与刘震撼探讨龙珠与魔晶的根本区别；凝玉推断仙女龙龙珠的能力是魔法闪耀；大师用千里传音宣告教廷龙骑士到来，点明庞贝帝国与圣弗郎西斯科帝国即将开战，导火索在多洛特。
  - name: 第二百四十二章 似是故人来
    notes: 普斯卡什与刘震撼闲谈魔族旧事：魔族撤离爱琴大陆裹挟两百多具巨龙骨骸，以亡灵天灾瘟疫灭绝地精；李察交出剪刀手爱德华残骸泄密，庞贝与圣弗郎西斯即将开战，龙骑士赶到沙巴克，刘震撼献十九头巨龙换一年停战。
  - name: 第二百四十三章 死亡领主的四件套
    notes: 兰帕德引荐四阶碧玉巨龙吉格斯与即将进化为三头黄金巨龙的哈塞尔巴因克，刘震撼炫耀内德维德的三足金蟾座骑；兰帕德报告庞贝已出动四尊新型魔像开膛手黑杰克，刘震撼当场索要艾马尔手中的死亡领主耳钉。
  - name: 第二百四十四章 蝎龙和戒指
    notes: 普斯卡什讲出死亡领主四件套的来历与冰峰王座铠甲，答应替刘震撼向艾马尔换取耳钉，刘震撼以燃灵之链与三头地狱犬尸体交换；兰帕德欲讨七度金空间戒指，亮出朗星护腕倒出五具阿卡那瑟德蝎龙尸体与一颗雄性蝎龙魔晶。
  - name: 第二百四十五章 请君入瓮
    notes: 若尔娜点明阿卡那瑟德甲壳富含琉璃水晶、可提纯后镀在机械高岑外壳上，劝刘震撼做成这笔一换五的买卖；奥胖交出七度金戒指换来蝎龙与朗星护腕，刘震撼又白送加茜娅一枚戒指，海伦因当众被吼落泪。
  - name: 第二百四十六章 舍了孩子套了狼
    notes: 刘震撼向加茜娅自称也是龙祭祀，谎称妻子凝玉的植物系巨龙大卫与吉格斯外型相似，用凝玉的东方幻术变出西贝碧玉龙；凝玉借抚摸下巴之机取走吉格斯下颌的碧玉龙珠，天鹅主祭穆里尼奥随即昂然入场，两人目光交锋。
  - name: 第二百四十七章 和事佬
    notes: 穆里尼奥讥讽刘震撼拣垃圾，两人当众口角；普斯卡什强行压服并为双方引荐，两位龙骑士奉命先行赶往庞贝，顺路观察雪山脚下堕落精灵新开辟的城市且绝不可与之接触；穆里尼奥的挽留宴请落空，只得当面写下邀请。
  - name: 第二百四十八章 牧树人和元素之泉
    notes: 穆里尼奥以藤蔓魔法戏弄壹条，被其火焰墙化解；普斯卡什痛骂两人内讧，宣布南十字星森林的恩特族牧树人克鲁伊夫将驻跸穆里尼奥领地，而这名牧树人收藏着积攒整整一万年的元素之泉，刘震撼当场坚决反对。
  - name: 第二百四十九章 火浦珠 翡城单兵装备
    notes: 普斯卡什说明三十磅元素之泉将平均分配给爱琴大陆两千余名法师，刘震撼与穆里尼奥都表态豁达；穆里尼奥部署斯迈与精灵弓箭手封锁鹰牛人空军，刘震撼细数翡冷翠单兵装备，以箬莎草纸的用途逗笑全场并谈成火浦珠交易。
  - name: 第二百五十章 一句话，煽动了一次永远的对立
    notes: 普斯卡什提出小鹦鹉与壹条中了血腥玛莉之毒，穆里尼奥当场暴怒，认定刘震撼一再伤害冰凰唐蓓尔金娜；民兵持鸟翼飞廉弩车闯入对峙，穆里尼奥更当众揭穿刘震撼曾用一枚蛋换走凤凰卵、血婴与他长得极像的旧事。
  - name: 第二百五十一章 从此穆郎是路人
    notes: 刘震撼承认用奇美拉卵换走凤凰卵并孵出血婴二少三少，表示愿与穆里尼奥分享儿子但绝不允许被夺走；他拔剑自刺腹部两剑还清旧怨，宣布此后只认唐蓓尔金娜与孩子的血缘关系，穆里尼奥转身离去，只与两个血婴挥手作别。
  - name: 第二百五十二章 碧玉龙珠
    notes: 绿党僧侣欧文止血咒连连失败，安度兰长老接手治伤并险些弄丢碧玉龙珠；普斯卡什鉴定出龙珠内蕴植物系生命本源力量，不能辟毒只能强力愈合，须贴身收藏并大量喝水，刘震撼却打起了制售治疗药水的主意。
  - name: 第二百五十三章 巨龙失珠 安知非福
    notes: 安度兰长老拒绝交出自己下颌的冰霜巨龙龙珠；普斯卡什提出龙珠既是龙神的恩赐也是桎梏，取出后方能突破魔法瓶颈，刘震撼遂批准黛丝与若尔娜取出龙珠修炼魔法，两位仙女龙誓要成为历史上第一对战斗型仙女龙。
  - name: 第二百五十四章 珊瑚美人的异变
    notes: 普斯卡什以斯蒂法诺能封印禁咒卷轴为例，说明等级不代表才华；刘震撼倒空空间戒指存货，取出竹节巨蜈蚣珠被大师命名为柳暗花明珠。大师负气离去后，果果指向珊瑚美人，众人发现其小腹隆起、手臂姿势已被改动。
  - name: 第二百五十五章 珊瑚美人之谜
    notes: 众人围论珊瑚美人是否怀孕：巫医诺查丹玛斯测不出脉搏，只见眼中鹅黄色血丝；刘震撼讲述德尚说的石女故事，承认在魔索布拉达城与珊瑚美人有过情缘。凝玉追问日期，若尔娜凭直觉断定怀孕，安度兰称有验证之法。
  - name: 第二百五十六章 取珠待客
    notes: 安度兰长老以剑伤加愈合祷言证明珊瑚美人是生命体，并由此推断她已受孕；刘震撼用通灵之歌收她为第二位学徒，讲明驮都乃复制血婴魔法的血舍利，决意取出二少三少的变身驮都，自己那枚血魄驮都因怕被偷而作罢。
  - name: 第二百五十七章 功夫不负有心人
    notes: 祭祀奥林匹克落幕，穆里尼奥一系被公认为天才一系，费雯丽凭沥青甲雷霆巨鼠夺得第一青年祭祀；刘震撼从魔宠披甲悟出松香砂石护甲之法，在秋刀宴上被贵族集体疏远，仍被教宗任命为远征祭祀团首席萨满。
  - name: 第二百五十八章 夺面枭雄
    notes: 国王萨尔与教宗密谈，教宗疑刘震撼是细作，国王以大海从不担心会被溪流淹没回绝；刘震撼在马车里向老板娘们说明用变身驮都冒充穆里尼奥骗美杜莎巫医解毒的计划，黛丝亮出艺人面罩，众人议定动手。
  - name: 第二百五十九章 痛苦的西贝父亲
    notes: 刘震撼佩戴变身驮都化作穆里尼奥住进西南会馆，恰逢采玉城与伦敦城祭祀归来；歌莉妮跳上膝头亲昵撒娇，歌麦斯与歌坦妮畏惧严父，他方知费雯丽是穆里尼奥契女，险些当场穿帮。
  - name: 第二百六十章 有一种嫉妒源于父爱
    notes: 霍利尔与特雷泽盖请战教训李察，崔蓓茜力主送食毒蛊缓和关系；特雷泽盖点破零死亡全靠防御战与地利，刘震撼由此看清翡冷翠武士的短板，也得知崔蓓茜在美杜莎族中身份崇高、歌坦妮早已向父亲承认喜欢自己。
  - name: 第二百六十一章 换位思考
    notes: 刘震撼反省与穆里尼奥由师徒到决裂的经过，体谅天鹅主祭护女之心；歌坦妮在楼梯上哭泣，他以下令调拨两位巫医送食毒蛊解毒了结此事，被崔蓓茜说成与李察是一类人，随后跟她走上三楼那间卧房。
  - name: 第二百六十二章 痴情之花
    notes: 崔蓓茜吟出穆里尼奥当年写给她的腓体诗《等爱》，十七年后终于献出守了十七年的处子之身；刘震撼因佩戴鹣鲽驮都被凝眸石化术定住无法脱身，美杜莎徽章被摘走，只能以冒名的穆里尼奥之身承受这一切。
  - name: 第二百六十三章 退一步,海阔天空
    notes: 壹条与小鹦鹉经食毒蛊解毒成功，两位巫医的本命蛊就此报废；刘震撼宣布把二少三少托付给教母唐蓓尔金娜，每年可相伴半年，并要壹条做教父、派彪人武士护卫，赢得众人掌声。
  - name: 第二百六十四章 剑桥印象
    notes: 祭祀团跋涉十五天抵达剑桥大绿洲，鸵鸟骑兵皮埃罗出迎，狮心亲王卡恩率远征军等候；歌莉妮获称飞姬，刘震撼开价五十颗拳头大玛瑙要买全部康湖水檀，被歌莉妮故意压成十五颗成交，齐丹因不忠天鹅主祭被鸵鸟骑士冷落。
  - name: 第二百六十五章 美人鱼悲歌
    notes: 剑桥绿洲的摩尼神庙中，茉儿指认神像上万年不灭的青色圣火是美人鱼脂肪提炼的灯油，讲述三千年前摩尼神教为求永生捕杀淡水美人鱼致其灭绝，刘震撼则以海水盐分解释淡水美人鱼无法逃入大海避难。
  - name: 第二百六十六章 祭祀是个香饽饽
    notes: 摩尼神庙战前会议，茉儿讲述淡水美人鱼希丁克大师研究离水结界引发海陆大战。卡恩亲王引见宪兵总队长扎内蒂、混编联队长博班与幕僚长平托，刘震撼分派远征祭祀团，平托争抢祭祀优先挑选权被海伦斥退。
  - name: 第二百六十七章 行军方略
    notes: 刘震撼以采玉城祭祀实力压服战神之鞭，平托摊开羊皮地图讲补给基地设于耶鲁绿洲；契克因少女茜茜指认自家小绿洲在耶鲁绿洲东侧，沿途有蝎人、蛇人与秃鹫人土著，卡恩决意先扫荡钉子。
  - name: 第二百六十八章 淫诗戏女神
    notes: 刘震撼一怒砸断摩尼女神像双臂，露出照壁上颂神诗与屠戮淡水美人鱼的落款；他跃上神坛在女神胸口题写淫秽的赠摩尼女神之赞歌，卡恩亲王哑然，奥尼尔击节称奇。
  - name: 第二百六十九章 出师不利
    notes: 沙漠行军第三日清水告急，匹格战士拒绝前进，督战队斑马武士一天砍下上百颗抢水囚犯的头颅。雷耶斯惊觉远征祭祀团从不索要清水，派近卫潜入打探，结果被獒犬打成鼻青脸肿扔了出来。
  - name: 第二百七十章 太阳级武器
    notes: 刘震撼中午接管土伦联队，搬出一百罐五百加仑巨型水桶供全军畅饮，匹格战士彻底折服。他当面点破中军三十里外并未跟进、前锋已成孤军，又教军官夜间跷脚睡眠恢复体力。
  - name: 第二百七十一章 慕兰强敌
    notes: 金刀魔羯阿里.代伊身世揭晓：摩雅人被慕兰吞并，他率三千人守粟米特绿洲拖延战。他拷问两名精灵俘虏未果，女精灵心碎而死，他反手一刀斩下自己人的脑袋。
  - name: 第二百七十二章 秘密武器
    notes: 阿里.代伊亮出撒手锏：加厚土墙骆驼、海螺号角、光之乞愿塔与十三名阿訇登塔、驯狮女驱火眼狻猊、窨黩蛇奴以笛声放出七条八米长眼镜王蛇钻入兽洞。
  - name: 第二百七十三章 全线突击
    notes: 刘震撼下令全军以散兵线无预备队突击土墙，违令者斩，令雷耶斯与众队长错愕。阿里.代伊放出两千骆驼骑兵绕墙夹击，并命阿訇与镜炮手待敌进入三百码集中射击。
  - name: 第二百七十四章 翡冷翠实战演习
    notes: 翡冷翠夏宫卫队借金钢传送阵自空帐篷涌出，四十八位堤丰铁匠先以凝焰陨石压制阿訇，猛犸重骑、连环羚牛、奇美拉空骑与牛头人武士前后夹击，火眼狻猊与眼镜王蛇被獒犬撕碎，慕兰军阵崩溃。
  - name: 第二百七十五章 投降的要求
    notes: 猛犸刀圣罗德曼一刀制住阿里.代伊，慕兰王帐银刀摩羯死伤过半。刘震撼令奴隶出列，宣布爱琴俘虏可交赎金赎回，阿里.代伊提出放两百人回去取赎金，双方暂缓。
  - name: 第二百七十六章 暗夜獠牙
    notes: 刘震撼先给被围慕兰武士送水，随后以五台鸟翼飞廉弩车射出锯齿月刃，七百羚牛武士跃墙抛廓尔克弯刃，十二门镜炮与云秦金人碾杀，慕兰军被屠戮殆尽；蒙席阿訇蒙塔沙里投降。
  - name: 第二百七十七章 过河拆桥
    notes: 帅帐中挂着慕兰人绘制数百年的军用地图，比蒙边境布防与剃刀山、红土高坡尽在其中，令刘震撼脊背发凉。蒙席阿訇交代慕兰三百年吞并十七国，供出隆美尔统帅即将回师，随即被挑断手脚筋。
  - name: 第二百七十八章 一场不值得骄傲的胜利
    notes: 刘震撼训斥雷耶斯与土伦军官：己方以五倍魔法、九名祭祀与夏宫卫队两千余人击败三倍敌军，不值骄傲。战后清点伤亡、缴获骆驼与一千五百余名奴隶，贝拉米拆下镜炮示其晨星宝石储光原理。
  - name: 第二百七十九章 惊艳
    notes: 塔克拉玛戈大沙漠中，慕兰统帅美帅隆美尔接见秃鹫首领哈什米安，凭尸体上的巨大开放伤断定比蒙空军来犯；命塔勒布鲁率三千骑兵骚扰粟米特绿洲、矮人卡提比潜行焚敌辎重，其锦袍下露出红色狐尾。
  - name: 第二百八十章 可笑的乱伦预言
    notes: 刘震撼在耶鲁绿洲等候迎亲团，小修女贞德首次改口叫他爸爸，随后哭诉普斯卡什大师占卜出六天后她将与教父生下孩子；刘震撼以果果的性命起誓绝不侵犯，贞德释然归去。
  - name: 第二百八十一章 残废侍卫
    notes: 刘震撼反复推演预言并自省滥情，又替怀孕的珊瑚美人谭雅擦脸；灰矮人山丘之王巴特尔与巴克利求战，果果一拳掏中巴克利裤裆又用皮球戏耍，两人改口愿穿盔甲，被收为贴身侍卫。
  - name: 第二百八十二章 比蒙巨兽祭祀
    notes: 茜茜伯父一家三位契克因随迎亲团归来，伯父雅辛是比蒙巨兽祭祀；其魔宠小白只是白色幼生期比蒙巨兽，帮不上恢复神职，刘震撼改将他们编入夏宫卫队法师队。
  - name: 第二百八十三章 风云始动
    notes: 远征军团主力抵达耶鲁绿洲，神庙与军部为战利品争吵；四波斥候几乎全军覆没，情报显示对手是慕兰名将隆美尔麾下「慕兰风暴」军团和秃鹫空军，卡恩命刘震撼留守绿洲护粮。
  - name: 第二百八十四章 勇敢者的游戏
    notes: 三千比蒙战士在横断山脉壑口与慕兰军队对峙；慕兰临时统帅塔勒布鲁等待太阳偏斜，以施展美帅所订的骑兵反光战术，狮心亲王则拒绝祭祀助战，坚持勇士的荣誉。
  - name: 第二百八十五章 血肉交响曲
    notes: 比蒙方阵随战鼓与咆哮推进，人马射手抢先仰射；慕兰骑兵用龟壳圆盾反光致盲布尔战士，再借冲锋惯性掷出棘短矛，前排牛头人被贯穿仍拔矛再战，双方魔法师同时开火。
  - name: 第二百八十六章 壮哉!牛头人战士!
    notes: 双方魔法对射胶着，七位祭祀合唱阿晨娜驱散之歌压住慕兰阿訇的火系魔法；布尔族牛头人硬撼三倍雪驼骑兵，近身混战中以图腾柱与牛角角斗术屠杀对手，金环武士重现战场。
  - name: 第二百八十七章 空中格斗
    notes: 秃鹫人先合围翡冷翠空骑并抢占高度；邓肯等羚牛武士拆下十二尊光之乞愿塔的镜炮当空战武器，银光柱把俯冲秃鹫烧成焦炭，濒死秃鹫射出七彩电芒击落双头奇美拉，羚牛武士靠地精陀螺伞与藤甲生还。
  - name: 第二百八十八章 王族预备队
    notes: 慕兰骑兵重整后三路再冲，一度分割牛头人并压制人马射手；卡恩投入王族子弟兵狮虎混编联队，泰戈武士用斧枪接力挑飞雪驼，莱茵重剑手仅二十人跳劈斩碎百余名骑兵。
  - name: 第二百八十九章 最后的赌本
    notes: 泰戈武士以虎尾分尸处决残存慕兰骑兵，七人自刎；骶勒射手被「比加之风」挑战式集射击溃。塔勒布鲁率两百五十名飞驼骑士冲阵救人，慕兰唯一重装骑兵登场。
  - name: 第二百九十章 睿智决定
    notes: 神曲萨满刘震撼与狮心亲王卡恩为祭祀总攻的指挥权对峙，掏出古力火铳抵住亲王腰肋，第一发却是臭子；卡恩表明自己只想由主帅下令，祭祀团遂以冬眠光环与魔宠围杀慕兰飞驼预备队。
  - name: 第二百九十一章 悠闲假期
    notes: 横断山脉战役以比蒙大胜结束，刘震撼留守耶鲁绿洲接应剑桥联队辎重，并复盘慕兰乌兹宝刀、光之乞愿塔与秃鹫人的七彩电芒武器，反思比蒙与其他智慧种族在教育上的巨大差距。
  - name: 第二百九十二章 乌龙磅礴走泥丸
    notes: 翡冷翠侍女穿鱼皮水靠陪刘震撼在湖中嬉水，歌莉妮讨要千叶茑萝花染发；歌坦妮透露父亲穆里尼奥是青蒿森林月精灵部落的驸马，另有一个半精灵哥哥是钻石家族继承人，老刘的鱼皮短裤被雪茄烫出破洞。
  - name: 第二百九十三章 地底突袭
    notes: 茜茜与贞德缠着刘震撼教游泳，歌莉妮翻出他私藏的帝维晶卡，两个天鹅姐妹怒骂他畜生后离去；湖面忽然剧烈震荡，精灵法师唐宁报告东北空中出现秃鹫人，湖岸沙地同时蹿出巨型田螺。
  - name: 第二百九十四章 沙舟部队!奇袭成功!
    notes: 二十艘巨螺沙舟载四百沙漠矮人与阿訇破土偷袭，以大纸包白垩石灰毒杀湖水，刘震撼护着茜茜、贞德摔上湖岸；战争古树抛掷榴莲巨果，棘刺果重创矮人，魔法免疫的翡冷翠战士反将偷袭者围住。
  - name: 第二百九十五章 不是冤家不聚首
    notes: 羚牛武士以角斗术配合双头奇美拉酸液屠杀沙漠矮人，小巨人艾弗森斩杀矮人首领卡提比；亡灵法师赞迪献上死亡领主镯轮诈降，趁刘震撼分神以七星手弩发难，化十二个蝙蝠人伪像逃遁。
  - name: 第二百九十六章 孤单北半球
    notes: 亡灵法师实为比蒙叛徒华伦泊尔蝙蝠人，以湮甲箭破开护盾，刘震撼胯下、小腹与肩窝中箭，贞德被余箭射中腹部；歌坦妮扑上来替他捂住伤口，刘震撼当场求婚，她含泪应下。
  - name: 第二百九十七章 逼供
    notes: 奥尼尔以烙铁与通条酷刑拷问无果，山丘之王巴克利献计以美酒攻心；刘震撼用溺杀与美酒相逼，诱出沙舟部队编制、巨螺晶心驱动原理以及摩云神灯与温拿手套的霓虹磁暴机密。
  - name: 第二百九十八章 翡城亲友团
    notes: 鸵鸟联队长博班怒闯主帅营帐问罪，被奥尼尔与肥力打出门外；安度兰长老替刘震撼诊治箭伤，判断与夏尔巴家族蝙蝠人有关，随后翡冷翠众长老与茜茜伯父雷哈格尔一家经传送阵抵达绿洲。
  - name: 第二百九十九章 婚礼的刀光前奏
    notes: 刘震撼讲解七度金空间戒指的自然空间原理；罗西汇报猛虎佣兵团已扩至四千人，因征召猛犸、河马与羚牛部族妇孺老人遭到痛骂；长老们领受烧砖建塔、渔业捕捞与地底救济的差事。
  - name: 第三百章 分水岭
    notes: 博班将军带着歌莉妮、歌麦斯闯帐问罪，歌莉妮痛斥逼婚害姐，歌麦斯请求公平决斗；刘震撼扣下博班充当人质，并向长老们交代遗嘱，还定下用巨螺沙舟改制战甲打孔机的办法。
  - name: 第三百零一章 姗姗新娘
    notes: 婚宴上奥斯崔特中队长皮埃罗借献鸵鸟蛋行刺被肥罗识破，驼鸟战士两度冲锋皆被羚牛武士与神曲萨满的目光压服；新娘歌坦妮迟迟不至，两头待宰野驴跪地流泪，宴会气氛压抑。
  - name: 第三百零二章 人算不如天算
    notes: 歌坦妮以合卺酒骗刘震撼喝下与弟妹合力所得的七日醉，再命奥斯崔特与翡冷翠武士散去；刘震撼凭龟吸结界毫无睡意，反而用暗影突袭缚住她，天鹅小美人彻底绝望。
  - name: 第三百零三章 男人心
    notes: 刘震撼点起雪茄，用帝维水晶球摄下歌坦妮被绝望包围的脸，直言摆婚筵就是逼她在「选择我！还是选择你的亲人！」之间抉择，并自陈与穆里尼奥必有一人倒下，随后讲了一个大英雄因退缩而家破人亡的故事。
  - name: 第三百零四章 女人心
    notes: 刘震撼看到歌坦妮臂上的「朱颜血」而悬崖勒马，叹气放她离开，却发现来的是妹妹歌莉妮。歌莉妮用「七日醉」迷倒姐姐李代桃僵，又因倾心刘震撼而宣称要他负责。
  - name: 第三百零五章 后院失火?
    notes: 歌莉妮牵着刘震撼公开亮相，逼弟弟歌麦斯叫姐夫，耶鲁绿洲哗然，长老们却为强暴女祭祀的罪名惊恐。刘震撼倾囊调出全部双料大油瓜，并留下一部魔法传送阵与两棵战争古树守绿洲。
  - name: 第三零六章 精灵小王子
    notes: 半精灵马里骑独角兽登场，自称斯迈族领主长子与月精灵部落储君，二十岁却只有孩童心智。他透露父亲穆里尼奥因崔蓓茜怀孕而酗酒，令在场众人震惊，也让刘震撼暗暗叫苦。
  - name: 第三百零七章 魔箭强援
    notes: 众人议论崔蓓茜另嫁美杜莎丈夫以撇清与穆里尼奥的干系，刘震撼内心愧疚。马里亮出月精灵月神魔弓「爱露尼之吻」与黑鳌皮箭囊中的三叶月刃，被刘震撼留在身边对付慕兰空骑。
  - name: 第三百零八章 仙人果
    notes: 比蒙远征军即将穿越红石大峡谷，刘震撼带队砍伐巨型仙人掌、摘食仙人果，被卡恩亲王当众斥责治军散漫。亲王借机派他去查勘那座有古怪吸引力的古城遗址。
  - name: 第三百零九章 沙漠第一名帅
    notes: 慕兰无敌美帅隆美尔坐在银象上赞叹比蒙军容，命砒霜巨人、秃鹫人哈什米安与飞蜥骑士马达维基亚出战，又令慕赭阿訇升空，并在辕门外用地缝与驼皮布下杀局。
  - name: 第三百一十章 神秘磁城
    notes: 翡冷翠武士冲入滹夜古城，只见满地人兽干尸、香樟木人头蚁身像与金戒指。猛犸大力士穆托姆博发现此山能吸附玄铁长刀，刘震撼认出是露天磁铁山，急令卸下皇冠荆棘战甲。
  - name: 第三百一十一章 狂蚁之灾
    notes: 慕兰人以侏儒蒸汽攻城战车抛射上百吨血浆，引出地下亿万嗜金蚁，比蒙步兵方阵溃乱、狼骑兵被啃成骨架。刘震撼发现慕兰人真正的用意是把蚁群全部引诱出来。
  - name: 第三百一十二章 禁魔！禁武！
    notes: 慕赭阿訇以磁山之力和禁魔领域吸走全军钢铁兵器，刘震撼取出康湖水檀当枪杆应变。两千潜沙兵团的沙漠勃泥战士从沙下钻出，面对的却是手持原木与巨兽的比蒙武士。
  - name: 第三百一十三章 屠龙专业户
    notes: 揭示嗜金蚁与雅圜古国血葬之地的来历，潜沙兵团被原木与巨兽逼垮。刘震撼骑革瑞恩追击齐布林飞行器，先败后胜，用死亡领主戒指击杀慕兰飞蜥骑士马达维基亚与巨龙。
  - name: 第三百一十四章 死亡之路
    notes: 狼骑兵撞上慕兰人精心伪装的地隙天堑全军覆没。刘震撼以献祭战歌开路，打醒卡恩亲王领残军突围，又命航空兵先救祭祀，末尾察觉到蚁后即将出场。
  - name: 第三百一十五章 四大魔琴！
    notes: 蚁后携四头骏马般的巨型雄蚁破沙而出，八千沃尔夫狼骑血战只剩两千；羚牛航空兵甩出「漫天洒花雨」的廓尔克飞刃，四位契克因神官雷哈格尔、索菲娅、莫吉、茜茜以珍珠七弦琴音刃水箭击落雄蚁。
  - name: 第三百一十六章 逃出生天
    notes: 果果掷出献祭战歌卷轴开路，奇美拉航空兵掳走蚁后诱使蚁群转向，刘震撼自主狂化续上歌力，堤丰巨人以火焰通道接应残军撤入古城；他吟唱通灵之歌安抚亡魂并划面立下鲸面毒誓，艾弗森从巨蚁体内认出蚁钢。
  - name: 第三百一十七章 蚁牛
    notes: 蚂蚁驱赶一百五十头乳牛状蚁牛入城，蝉人小贝利揭穿这是被放牧产蜜的蚜虫；刘震撼拖蚁后出城谈判无果，内德维德以相驯秘语收服巨马蚁；卡恩亲王报出二十支联队仅余三千一百三十四人，保莱塔主祭失踪。
  - name: 第三百一十八章 雪上加霜
    notes: 卡恩亲王细数伤亡：米格兵团五支狼骑全灭、金狼古蒂阵亡、凯日曼重伤、李察王子阵亡；众将议定据城死守；亲王道出驯兽师双徽章即驯化的霸王箭猪；夜半吸血蝙蝠袭入山洞，刘震撼以血系御力卷沙封洞屠杀蝙蝠。
  - name: 第三百一十九章 谷道艰难
    notes: 刘震撼夜练血系御力未成，感叹爱琴已衍生十八系魔法；齐肘而断的左手靠碧玉龙珠半年只长出半个掌面。歌坦妮从七日醉中苏醒，以云森铂银剑甲解释未被磁城吸走，两人借朱颜血坦白和解；他构想用夜明龙珠改造镜炮。
  - name: 第三百二十章 福克斯慕兰统帅
    notes: 慕兰使者劝降被拒，隆美尔骑银象携两百砒霜巨人与一联队沙漠美莱茨现身；卡恩亲王从狐尾认出他是福克斯，刘震撼又点破他是福克斯与慕兰混血。他腰悬可挡一次致命伤害的卡嘉瑞德宝石，放话明年率军南下。
  - name: 第三百二十一章 琵琶射手
    notes: 隆美尔自陈家世：母亲十三岁被比蒙权贵卖到慕兰加里曼丹城，二十岁死于凌辱，他诅咒比蒙二十七年；他点名东北行省总督罗森博格是贩奴同谋。海伦怒斥其背叛同族，刘震撼立誓回国诛杀罗森博格。
  - name: 第三百二十二章 罪恶计划
    notes: 沙漠美莱茨以琵琶蜂箭变射杀死比加之风的神箭哲琴，马里小王子以爱露妮之吻的铂银月刃变线折射斩敌，内德维德空手贯穿对手右掌留其性命。刘震撼定下单独投降、中心开花屠灭加里曼丹城的计划，并封存油瓜备用。
  - name: 第三百二十三章 古怪的守城法
    notes: 慕兰围城七天，苏丹近卫军统帅戈勒穆罕默迪与飞驼军团争功后执意强攻；比蒙放弃城楼退守城内，以人头蚁身神像堵门、仙人刺毒箭覆盖云梯。慕兰以百台投石车抛射石弹木弹，刘震撼以添油打法消耗近卫军。
  - name: 第三百二十四章 落石成阵
    notes: 近卫军抢夺蒸汽攻城战车与飞驼军火并；一百台投石车就位，押沙地学者测算落点。隆美尔剖析比蒙弃城楼守内城的战术并暗赞对手，卡恩亲王则为投石车威力忧心；比蒙在洞前列半月战阵，重装突击队保住青铜重锤与巨斧。
  - name: 第三百二十五章 学习老板好榜样
    notes: 慕兰人涌下古城与比蒙近战，卡恩亲王以滚雷重斩当先；羚牛武士水檀棍棒、豪斯箭手仙人刺与两翼重骑兵横切，肥罗双刀连斩王帐刀手。小巨人艾弗森独守城门，连挥四次原木击溃六十名骆驼骑兵后放走三名降者。
  - name: 第三百二十六章 家家有本难念的经
    notes: 慕兰王室近卫军第四次无间隔冲击滹夜古城，一万六千战士填进窟窿，统帅戈勒穆罕默迪亲手刺死眼球爆裂的骆驼伤兵；隆美尔劝其收兵，并剖析比蒙重骑、棍棒、利刃、原木四种武器造成的恐怖伤势。
  - name: 第三百二十七章 美帅的指挥棒
    notes: 亡灵法师赞迪向隆美尔讲述比蒙龙祭祀李察的来历与俄勒芬巨象、彼尔暴熊、布尔羚牛、狮虎王子、麝人空骑的战力；隆美尔决定进军爱琴大陆，派秃鹫人首领哈什米安入夜潜访李察谈投降之事。
  - name: 第三百二十八章 三个条件
    notes: 隆美尔与李察首次会晤，李察踢翻角力奴隶、拒碰慕兰酒食、调戏斟酒侍女；十二名纥兰舞姬跳起艳舞后，隆美尔提出投降的三个条件，要八十头巨型蚜虫、两百对两百君子战、随他回加里曼丹。
  - name: 第三百二十九章 两难的投降
    notes: 隆美尔压低声音提出第三个代价，要李察救出比蒙公主后刺杀哈里发阿卜杜拉，以此激慕兰出兵爱琴；李察自认成了导火索仍被迫答应，回城后众将商议，歌坦妮献上给绿洲水源投毒之计。
  - name: 第三百三十章 绅士一样战斗
    notes: 围城十二天磁禁领域消失，隆美尔邀比蒙举行消失千年的君子战，追述海加尔战役豪斯族名将麦克马拉曼与人类将军汉尼拔的君子箭战；两百砒霜巨人对阵两百比蒙武士，千名沙漠美茵耶奏琶琴大曲半江沉月乱比蒙军心。
  - name: 第三百三十一章 战歌武器
    notes: 刘震撼用帝维晶卡播放驯狮女与火眼狻猊交欢的光幕破掉琶琴心理战，海伦召唤基头座龙敲响夔皮战鼓重振军心；两百比蒙武士借皇冠荆棘战甲与战神光辉之神曲挡住霜痕辐射，几乎全歼砒霜巨人，隆美尔认输。
  - name: 第三百三十二章 盗墓专家
    notes: 行军途中隆美尔讲述侏儒武器来历，三千侏儒乘齐布林飞行器逃入塔克拉玛戈定居五百年后被沙漠土著荡平；他靠六牙银象缔听透视地底盗掘侏儒王陵得到蒸汽战车与暴雨梨花弩，又与刘震撼赌塔罗牌大输。
  - name: 第三百三十三章 无心插柳柳成荫
    notes: 大军穿过塔克拉玛戈抵达幼发拉底河与隧桥天险，隆美尔介绍慕兰母亲河与牵牛魔芋；抵加里曼丹城后刘震撼被关进木笼游街，见到两百名幻兽骑士凭金属羽翼飞翔，隆美尔也露出拜火教阿訇身份并坦言自己是宝典阿訇。
  - name: 第三百三十四章 很布尔B的佛巨人
    notes: 刘震撼被关进巴士比监狱，与邻牢的佛巨人、泥足巨人对谈；佛巨人酋长德塞利自称苦行僧侣教义由佛巨人传播出去，并称祷言治疗术分两大类共十种，令只会五种祷言的安度兰长老相形见绌。
  - name: 第三百三十五章 更布尔B的泥足巨人
    notes: 泥足巨人酋长基恩展示泥塑般的大脚板，讲述第三只眼的多普勒射线能把魔兽改造成琉璃金系幻兽，慕兰幻兽骑士的座骑本是泥足巨人丢弃的幻兽靴子；隆美尔用水化掉二十五名泥足巨人双脚并囚禁全族。
  - name: 第三百三十六章 是可忍，孰不可忍
    notes: 隆美尔带刘震撼去蜂房看皇箭蜂，刘震撼借吹捧套出飞驼军四面城墙布防与总部位置；两人逛盂盆节夜市，隆美尔自称修习影系法术的宝典阿訇、恨人侮辱母亲与导师，夜遇慕兰肥佬牵着福克斯狐女与加菲猫女当宠物。
  - name: 第三百三十七章 互相拉拢
    notes: 刘震撼瞬移进铁器铺夺斧，当街砍死肥佬、保镖和车夫，救下狐女丽薇与猫女维多利亚；隆美尔指其杀的是哈里发直系亲属、全城将戒严；刘震撼劝隆美尔随他回比蒙，隆美尔反劝其投降并许以比蒙之王，两人互相拉拢未果。
  - name: 第三百三十八章 沙漠星尾龟
    notes: 刘震撼与隆美尔进入加里曼丹王冠珍珠拍卖场，交百金币入场费并以水熏悉密香熏衣。隆美尔讲述断臂女神与艾姬国艳后典故。刘震撼出八千金币买下帛兕国商人贩来的沙漠星尾龟，腹中掏出十二颗散发刺鼻酒味的巨大黑珍珠。
  - name: 第三百三十九章 千年魔芋美人
    notes: 果果付四张金券结账并砸开无壳龟脑袋掏出魔晶龟珠，力气震动全场。拍卖转入人口贸易，蕞尔小国男妃以八千五百金币成交，随后拍卖牵牛魔芋人形种子。隆美尔讲述其妙用后叫价一万五千金币买下赠刘震撼。
  - name: 第三百四十章 坐莲女子
    notes: 隆美尔以赠送魔芋美人换取刘震撼追随被拒，又以六千金币买下坐莲女子一并相赠，并揭示宝典阿訇须先达蒙席阿訇再挥刀自阉才能修炼影系魔法。刘震撼揭开坐莲女子面纱，被她睁眼射出的金光击晕。
  - name: 第三百四十一章 韦舵巨人
    notes: 刘震撼在巴士比地下监狱醒来，被巨型镣铐锁成大字，果果被捆吊，小鹦鹉舌头被拔。隆美尔道破坐莲女子是佛巨人姬丝凯碧，年一百二十岁折合比蒙六岁，并讲述佛巨人女子为沙漠第一号美女、护法战士韦舵巨人之事。
  - name: 第三百四十二章 幼妻
    notes: 隆美尔宣布刘震撼揭开姬丝凯碧面纱便须娶她为妻，讲解面纱风俗只容心爱男人掀开，姬丝凯碧唤他檀郎。隆美尔坦白原计划是刺杀哈里发并栽赃，还揭示佛巨人盥阴之光的秘密，刘震撼血系魔力与龙力几近尽失。
  - name: 第三百四十三章 龙游浅水
    notes: 隆美尔告知蜂农即女性佛巨人与泥足巨人，并惊讶刘震撼是圣奇奥。两人互留邀约与忠告，刘震撼扬言把这里变成复仇火焰的海洋。隆美尔翌日领军出征马尔罕，留导师马拿利护送出城，场景转向仰望西北天空的壹条。
  - name: 第三百四十四章 将星荟萃
    notes: 刘震撼靠缩骨术挣脱镣铐，果果喷霜冻裂绳索脱困。佛巨人酋长德塞利发现他符合韦舵巨人身高，欲以醍醐灌顶测试。果果布下金钢传送阵，卡恩亲王、普斯卡什、伊布夫妇、兰帕德、斯蒂法诺与穆里尼奥齐聚地下监狱。
  - name: 第三百四十五章 攻击规划
    notes: 伊布开启狱门，普斯卡什以沉睡之云放倒美茵茨射手，翡冷翠战士血洗军营并救出巨人女眷，维埃里扫荡军火库。刘震撼用传送阵送巨人回翡冷翠，随后集结两万余精锐下达红带屠城令，只留工匠并禁止劫掠纵火强奸。
  - name: 第三百四十六章 红带屠城
    notes: 比蒙军队四面合围加里曼丹，奇美拉空军与牛顿航空队轰炸四门并放下万磅重闸，三尊机械高岑与堤丰巨人沿城墙推进。刘震撼下令将沙漠精灵挑筋拔舌，龙人首领埃托奥出言指责被逐。两百幻兽骑士升空迎战。
  - name: 第三百四十七章 圣阶法术
    notes: 幻兽骑士长设拉子巴格被刘震撼在一千八百码外一枪暴颅，六头超阶魔兽的瞬发魔法打落半数幻兽骑士，壹条以雁翎双刀砍杀并砸穿圆顶建筑。普斯卡什咏唱圣阶禁魔领域，伊布点破这是为防慕兰亲王传送逃走。
  - name: 第三百四十八章 一报还一报
    notes: 战神夏宫卫队提前出击实为黛丝安排，刘震撼真正目标是掠夺军械与慕兰铁匠并擒住哈里发，兼报枫叶村灭族之仇。禁魔领域内众人陆续赶到，刘震撼披上皇冠荆棘战甲，以内德维德、维埃里、艾弗森与壹条合力破开王城石闸。
  - name: 第三百四十九章 宝典阿訇
    notes: 加里曼丹仅剩九个千人编制的慕兰战士与五千赏金猎人，王城守军一千、宫廷阿訇二十五人。翡冷翠武士破阵杀入殿前广场，刘震撼以山丘之王抛掷阿訇打靶，自称是被奴役的比蒙同族。出城时宝典阿訇马拿利现身拦路。
  - name: 第三百五十章 腐朽之处显神奇
    notes: 宝典阿訇马拿利以摩尼女神地上行者身份挑战，普斯卡什大师抢先出战，用自创的见习级气系法术「二氧护盾」扣住对手口鼻，令其吸入二氧化碳中断咒语、遭受元素反噬落败。
  - name: 第三百五十一章 超强影系魔法
    notes: 马拿利改与七彩龙伊布切磋，其影子侍卫实为伊布自己的影子，攻击影子等于伤害本体。他宣称影系法术只有控制力没有杀伤力，要求比蒙撤离加里曼丹，伊布随即以金属控制术驱动箭雨反击。
  - name: 第三百五十二章 春梦了无痕
    notes: 伊布以乱箭将马拿利射成肉泥，马拿利却以影子分身重生。刘震撼凭暗夜守望者异能「暗影突袭」控制住分身，马拿利自爆前以生命为代价对他施放宝典阿訇神赐异能「春梦之眼」，让他从此每夜在梦界与梦魔相伴。
  - name: 第三百五十三章 蛮横公主
    notes: 南希公主与哈里发阿卜杜拉被押到阵前，公主得知三个哥哥战死，拔剑要杀哈里发，被山丘之王扭送军营。熊猫武士古川登场认主，刘震撼为熊猫族安排定居与神职，又扯下阿卜杜拉面罩取笑其青春痘。
  - name: 第三百五十四章 大局已定
    notes: 潘帅回报王城武器库、金库、粮食库与镜室皆已拿下，贝拉米靠嗅觉找到逃生秘道。刘震撼下令洗劫加里曼丹，以「晾咸鱼」酷刑震慑而收服哈里发。安度兰长老清点战利品，宣称今后要拿金币当床睡。
  - name: 第三百五十五章 吸血战歌
    notes: 刘震撼下令十日封刀前每名比蒙战士须带回三十个鼻子，佛巨人酋长德塞利虽愤怒，却认定他就是佛巨人等待已久的韦舵巨人。德塞利讲述韦舵巨人有水陆两栖、金钢伏魔之力与七大种族异能，愿为他举行醍醐灌顶。
  - name: 第三百五十六章 魔力之秘
    notes: 刘震撼以吸血战歌抽取上百慕兰俘虏每人约七分之一血液再回注。大师们指出这是三重属性的邪恶光环战歌，并道破他不会冥想才无法恢复魔力。他以一百五十名龙人射手换得牧树人克鲁伊夫，随即答应韦舵试练。
  - name: 第三百五十七章 千红一窟之主
    notes: 德塞利为刘震撼行醍醐灌顶，霞光中莲台巨美女与童男童女现身，他眉心生出玲珑碧波痣、眸中滚过银色十字星，得金钢伏魔之力与拈花指、移花接木等花系异能。因生于二月二十二日百花生日，他被认定为千红一窟之主。
  - name: 第三百五十八章 王国第一乱伦高手
    notes: 德塞利告知七大花系法术又名七伤法术，杀伤见血必自伤呕血，并称韦舵巨人本是婆夷血海恶魔转生。凝玉拍板让姬丝凯碧做刘震撼的檀奴。贞德已怀孕两月，刘震撼惊怒否认，凝玉却逐字证实孩子确是他的。
  - name: 第三百五十九章 圣主保
    notes: 安度兰长老解释贞德因耶鲁绿洲一箭携带精液而处女怀孕。教廷龙骑士加茜娅与兰帕德宣称这是神迹、孩子是圣子，李察只能做圣子养父并获圣李察主保头衔。刘震撼最终认下孩子，还盘算借教廷之力建翡冷翠圣母院。
  - name: 第三百六十章 梦入神机
    notes: 加里曼丹四面被围，羚牛武士与金环武士夜战破宅，城中财富被大批运走。刘震撼睡后进入梦界，见到自称追梦人的蓝发少女西尔芙，她有观心术并与他相伴二十年。西尔芙讲述梦界是真实世界，每人皆有梦界代理。
  - name: 第三百六十一章 收获
    notes: 刘震撼摆夜宵酒席与家人聚饮，姬丝凯碧、贞德与七彩龙夫妇同席。他清点战利品：掳获六千七百四十三名铁匠、上千吨乌兹钢锭、四万套军械与千吨粮食，艾玛尔大师还从清单中发现雷神之怒战斧与天使之泪魔弓。
  - name: 第三百六十二章 炼金之王
    notes: 艾玛尔大师鉴定双刃战斧是狂战八勇士沙龙留下的雪佛兰战斧，掺伊斯西丁金属，月圆之夜可助二度狂化；魔弓天使之泪是真品。他要用魔导大炮的青铜设计图纸换取死亡领主的耳钉，并答应指导翡冷翠炼金师。
  - name: 第三百六十三章 富贵逼人
    notes: 艾玛尔揭出土系龙珠本源之力为聚沙成塔，能回魔回力，欲以冥河符文宝石交换；刘震撼改要他代为制作魔法装备，并添上道格拉斯风暴号角。七彩龙伊布抢夺盛放雷霆钻石和法力克隆珍珠的木盒，被安度兰长老带人掐住。
  - name: 第三百六十四章 战歌大刑
    notes: 家贼事件以伊布与黛丝、安度兰长老争吵收场。比蒙国王萨尔赶到加里曼丹，见刘震撼披冰封王座铠甲、紫发银瞳而吃惊，并告警堕落精灵空军频现白令山脉与南十字星森林；亡灵法师赞迪被擒并受吸血战歌酷刑。
  - name: 第三百六十五章 死亡阴影
    notes: 赞迪供出隆美尔勾结魔族，华伦泊尔蝙蝠人全族投靠魔族，魔族首攻目标就是比蒙王国；他是族长卡佩罗之兄、魔族金牌代理人。魔族定计以多瑙大荒原为根据地，联合娜迦、慕兰帝国与堕落精灵四面合击。
  - name: 第三百六十六章 星空下第一水货军团
    notes: 教廷龙骑士与普斯卡什、斯蒂法诺、七彩龙伊布、仙女龙伦娜纷纷离开，或回国通报或重排龙城部署；国王下令战利品由李察先挑。刘震撼在红土广场夜茶，谋划用多普勒射线改造基头座龙为幻兽。
  - name: 第三百六十七章 平魔八策{上}
    notes: 刘震撼备五百万金币收购一百头基头座龙，向基恩酋长下封口令并截留青年祭祀；又让佛巨人刺凶兽纹身、持巨型方便铲。他向国王提出平魔八策前三条：重建重装骑兵联队、献巨蚁千里马组空中重骑兵、推广砂石挂甲。
  - name: 第三百六十八章 平魔八策{下}
    notes: 刘震撼续说平魔八策：战歌战舞帝维专辑、剑桥祭祀学院设于翡冷翠、主城间架风系传送阵、增设投石部队、全军配神曲图腾柱达中级魔法免疫、长期供铁；并索要麝人、解除獒人囚犯法律、册封狈人、取消契克因妓户身份。
  - name: 第三百六十九章 忍放风筝哈里发
    notes: 穆里尼奥请艾玛尔大师到采玉城做客，佛巨人吓疯食人魔强盗；刘震撼纠结西尔芙的双生共鸣之说，索性在梦里继续睡觉。屠城十天结束，隆美尔率飞驼大军赶回加里曼丹，只见满城腐尸与血书大字报，他狂喷鲜血栽倒。
  - name: 第三百七十章 性感女神
    notes: 刘震撼拒绝留哈里发做人质下令处死；因一名沙漠精灵女孩曾喂他一口水，放过一千名沙漠美茵射手并关入巴士比地下监狱。返程一路破坏水源，又在滹夜古城祭奠阵亡将士。磁山崩裂，人面巨蚁现身自称摩尼女神。
  - name: 第三百七十一章 弑神？{上}
    notes: 云霄巨人部落下山，安度兰长老本以为投奔翡冷翠，实被穆里尼奥以道格拉斯风暴号角拐去采玉城；穆里尼奥遣美杜莎武士送来蝶扇剑赔罪。刘震撼不怒反赞，私下告知长老路上可能干掉了一个女神，随后与之谈论神祇。
  - name: 第三百七十二章 弑神？{中}
    notes: 长老阐述魔法师的平衡世界观：神祇能毁灭世界，但要融入就必须变弱，故神迹皆为神格降临的分身。刘震撼忆及萝丝女神附身谭雅旧事。长老惊见果果已具力道纹护盾、跃升圣奇奥而晕倒；刘震撼取出巨蚁尸首讲述经过。
  - name: 第三百七十三章 弑神？{下}
    notes: 长老断定巨蚁是神圣巨龙放逐的四大史前魔兽之一蓝眼高棉巨蚁，并非神格附身，又解析卡嘉瑞德宝石不能抵挡自然死亡。刘震撼说出真相：单控战歌光环被法力克隆珍珠复制，两道光环抽干其体力致死；果果因此晋升圣奇奥。
  - name: 第三百七十四章 完美的后路
    notes: 刘震撼自加里曼丹返回翡冷翠，半月内基头座龙已达十九头，罗纳尔多被凝玉以十柄慕兰金刀挽留并受封夏宫前仆射。他与四位方士长老谈判云泰旅人去留，仅不到两千人愿加入，遂定下澈桑大草原为二城与退路。
  - name: 第三百七十五章 几度风雨几度春秋
    notes: 艾玛尔大师从蓝眼高棉巨蚁体内取出深渊投影纹章，判断其来自深渊国都的暴君级魔兽，本源力量被强行灌注异种魔力而损坏，只能改制成深渊投影铁幕。刘震撼决定今后所得血液魔力全给果果，并已格毙三头越阶超阶魔兽。
  - name: 第三七十六章 侏儒武器
    notes: 刘震撼清点加里曼丹所得侏儒武器，将十三颗沙漠醉龟龟珠改作喷火器，把暴雨梨花弩配给矮小附庸族藏兵于民。他惦记墨晶山谷的生命之泉，也察觉堕落精灵要吞并白令与南十字星森林的精灵巨人。
  - name: 第三百七十七章 风暴号角的召唤
    notes: 壹条自称已用大印象火焰塑形指永久封印姬丝凯碧，并提出萝莉养成计划，要刘震撼教她用盥阴之光对付魔族，安度兰长老赞同。刺猬人哨兵通报有被风暴号角召唤的巨人求见，来者自称矮人雷鸣登，实为黄金矮人先行探路者。
  - name: 第三百七十八章 外籍恩特
    notes: 雷鸣登自称黄金矮人，须披纯金战甲作战，八十位族人需十二吨黄金，四天后却再无音讯。王国特使揭出隆美尔之母为被掠狐女玫蓝，隆美尔竟是海伦嫡亲表哥；罗森博格被制成瓮人，牧树人克鲁伊夫到访。
  - name: 第三百七十九章 堕落精灵的势力
    notes: 刘震撼一身外籍恩特打扮携三十八位佛巨人至卢塞恩城，见两座地底太阳悬于城上。克鲁伊夫长老揭出精灵靠永恒月井与生命之树汲取森林精华筑城，又点破战争古树接近两万年是因生命之泉，并指出城中古树比地底多两棵。
  - name: 第三百八十章 差一步就是鸿门
    notes: 议事堂中地狱黑龙族长罗纳尔迪尼奥与血婴西罗现身，勒索七度金皇冠并逼刘震撼平分地底世界。刘震撼以拈花指洞穿树穹、召出八十位伊米尔牛头人与三大戒灵，克鲁伊夫长老则假冒绿巨人召唤十头树熊震住全场。
  - name: 第三百八十一章 羊入虎口
    notes: 刘震撼剖析堕落精灵七十万常备军与十六万牛鹰人空军，自认首次走麦城，既没赶走对方也失去生命之泉，只能答应和亲。冰凰唐蓓尔金娜带二少三少到翡冷翠，转告何塞已释前嫌，精灵小王子马里成为夏宫仆射。
  - name: 第三百八十二章 酒后发生的强奸大案
    notes: 刘震撼饮下十坛姆格酒后装作醉遁，抽斧封门把凝玉与姬丝凯碧留宿领主卧室。凝玉、茉儿、黛丝、娜娜、海伦、莉莉、妮妮与茜茜、费雯丽围观整夜，姬丝凯碧以心眼电波造出仙闺幻境；次日歌坦妮臂上朱颜血已消。
  - name: 第三百八十三章 流氓自有流氓的办法
    notes: 安度兰长老三堂会审痛斥刘震撼，德塞利酋长解释佛巨人女子以心眼电波释放檀郎阴暗心理的仙闺幻境，双方为伦理辩了大半天。长老命众人退场让他向费雯丽认错，他却把虚幻变成事实，还宣称从不跟女人认错。
  - name: 第三百八十四章 男人的烦恼
    notes: 安度兰长老劝刘震撼借迎接黄金矮人之名赴雪梨城避开凝玉。生命之泉已被卢塞恩城堕落精灵榨干，战争古树由十六棵增至二十棵，平魔八策失去强力武器根基；荆棘草环征召令下达，五大行省收缩防御。
  - name: 第三百八十五章 强力武器登场
    notes: 黄金矮人全族四百七十二人下山投奔翡冷翠，族长克虏伯是雷鸣登之父，索要全族黄金行头；其孪生妹妹、女战士勃郎宁索要五百磅黄金战锤，刘震撼只够为四十位战士打造小型飞锤，回翡冷翠后凝玉冷战。
  - name: 第三百八十六章 和解
    notes: 艾玛尔说明魔导投石大炮放大十倍后：全重三十一点五吨、石弹直径三百五十公分，射程一千五百至两千码，需分叉底座固定；刘震撼命名为巴比伦巨炮。德塞利以两尊炮身换五个击锤成交，凝玉持白色羽翎大麾与他和好。
  - name: 第三百八十七章 神龙使者
    notes: 兰帕德代表教皇与圣弗郎西斯科大帝借调翡冷翠航空兵剿灭多洛特公国蝙蝠人，教廷空骑士不足百人而蝙蝠人数千。圣奇奥范巴斯滕吃午餐被肉饼呛死。刘震撼瞒着家人只带两位山丘之王与姬丝凯碧远征地底龙之墓地。
  - name: 第三百八十八章 最简单的证明
    notes: 龙之墓地是七簇莲瓣死火山丛，遍布骷髅龙与死亡冻气；刘震撼冒充西贝神龙使，令龙巫妖特拉帕多尼与五头亡灵巨龙将信将疑。他抽出腰带，以银带头镶嵌的七枚菱形仙女龙龙鳞自证身份，六头亡灵巨龙跪拜参见金龙神使。
  - name: 第三百八十九章 仙女龙巫妖？
    notes: 金龙战车险些踏碎黑石祭台与台上红参朱果参草；龙巫妖要通知最高的存在便隐身离去，五位亡灵巨龙钻入皇冠徽章与碎钻耳钉。刘震撼点破特拉帕多尼隐身查勘，其背上多出一位仙女龙幼女，实为黑龙第一美人阿仙奴。
  - name: 第三百九十章 无耻之尤
    notes: 刘震撼不知阿仙奴是谁而露馅，龙巫妖斥其骗子。阿仙奴自称混血仙女龙：母亲织布尔娜巾与比蒙布尔武士相爱，随地狱黑龙同遭龙城流放，产卵后忧郁而亡，她自行破壳且自带死亡气息，父亲葬在泰穆尔拉雅最高处。
  - name: 第三百九十一章 意料之外的强劲
    notes: 姬丝凯碧的盥阴之光一击放倒龙巫妖特拉帕多尼，阿仙奴震惊于其实力能瞒过不死生物感知。刘震撼以耐奥祖穿心钉重创阿仙奴，阿仙奴召出气火双华之盾与摄魂龙吟反击，又以死灵弥撒术召出二十名龙骨武士。
  - name: 第三百九十二章 大块头碰上大块头
    notes: 阿仙奴接连丢出九道死灵弥撒术，召出近二百名龙骨武士与骷髅战士围攻，八十位伊米尔牛头人结铁锁横江大阵扼守。刘震撼令四头幻兽变成比蒙巨兽冲阵践踏，阿仙奴随即召出骨冢之门，冥界守卫者蜂拥而入。
  - name: 第三百九十三章 千载难逢的良机
    notes: 揭示冥界守卫者即阿迪达斯玛，为碧落血河渡口守卫、准超阶龙兽档次，源自冥界古代恶魔谱系，群居如狼群。阿仙奴以时空通道召其前来，四头比蒙巨兽堵住骨冢之门。
  - name: 第三百九十四章 堵路狂魔
    notes: 两位山丘之王把刘震撼去年身中凝血酶剧毒时积攒的尿液涂在两百柄三棱长戟上，飞戟连穿成排阿迪达斯玛。戟斧掷尽后，刘震撼连发雷霆闪电、飞花、血箭与蛛网术淹没骨冢之门，又唱吸血战歌以含血驮都汲取靛蓝血液魔力。
  - name: 第三百九十五章 有父必有子
    notes: 血河大统领耐温尔因克是冥神俄狄斯的爱子、冥界三大统领之一，挤入时空通道时被维京重斧劈中眉心白色勾形标志，因体型过大反将骨冢之门崩裂。阿仙奴变形求情，果果趁机锁住她逼其撤除领域。
  - name: 第三百九十六章 断背峰来客
    notes: 安度兰长老三堂会审痛斥影响极其恶劣，茉儿献上黑龙参草；长老命黛丝发火焰短信给伊布把龙骸接去龙城墓地安葬，四十七枚龙晶留下，黄金矮人凑出二百三十六名法师。新来客是大卫·贝克汉姆与绿巨人酋长圣克鲁兹。
  - name: 第三百九十七章 军旗漫卷
    notes: 安度兰长老介绍绿巨人的春风剪刀嫁接术，刘震撼谋以此复活油瓜与摩拉丁怒火，却欠缺永恒月井与生命古树。他重整夏宫卫队，成立翡城法师团，贝克汉姆任团长，麝人射手获封东风破射手。
  - name: 第三百九十八章 黄金右脚
    notes: 空中青台哨官将翡翠空军误认作渡鸦群，八头黄金双头巨龙与两条巨蛇随后兵临城下。刘震撼索要精神损失费即空中平台，一百五十位矮人闪电法师轰塌北侧树墙，贝克汉姆的火焰刀削飞摩尔亲王冠冕。
  - name: 第三百九十九章 双管其下
    notes: 贝克汉姆以角度与弧线扭曲魔法飞行轨迹，是继普斯卡什之后低阶法术的新用法。血法师沙利文挑战被瞬发火焰刀击溃，他更隔五千码削掉破法学堂双子塔楼顶铁公鸡，暴露魔导师级射程。
  - name: 第四百章 忍字头上一刀
    notes: 刘震撼摊牌称风洞魔法传送阵令堕落精灵有来无回，地底四头地狱黑龙已被茉儿与罗比打跑，摩尔亲王忍辱割让空中平台。克鲁伊夫以元素之泉催动二十棵战争古树化恩特，十六位出走四位留下，亲王临走警告来日必报。
  - name: 第四百零一章 偷得浮生半日闲
    notes: 堕落精灵捏着鼻子认亏，地底驻军撤尽。翡冷翠流行雪莲雪茄与荷东舞场，伊布夫妇来接黑龙尸骨，先抡铁棍追打女婿又勾肩喝酒。邓肯带回四头基头座龙，兰帕德留下任圣母侍卫并愿做幻兽骑士团团长。
  - name: 第四百零二章 无毒不丈夫
    notes: 刘震撼带家人在地底围猎魔兽，熊猫老头暴打海绵七尾龟，罗纳尔多驯服三足金蟾。他入睡后与追梦人西尔芙谈论谭雅。歌坦妮归来报讯：穆里尼奥以琴鹨酐毒杀七万牛鹰人空军，并邀他赴花精灵处做客。
  - name: 第四百零三章 战神的绯闻女友
    notes: 刘震撼按凝玉设计的粗犷造型赴沉寂之海，会晤穆里尼奥与月精灵女王丽芙，见识了上位精灵的高傲。穆里尼奥说明琴鹨酐战绩与将渣打峡谷方圆五百里土著迁往采玉城的计划。花精灵拒绝搬迁，因他们守护着爱琴之花艾莉婕。
  - name: 第四百零四章 救活！！
    notes: 穆里尼奥道出三大上位精灵粮食，即花精灵莲拔丝、金精灵兰勒尔与月精灵诺多林。刘震撼提议把莲拔丝送给缺粮的堕落精灵。艾莉婕并非死后成坟，而是被绝对零度指环与十星连珠寒潭封印，穆里尼奥决意救活她。
  - name: 第四百零五章 救世主
    notes: 花精灵长老切赫对刘震撼轻慢，穆里尼奥与丽芙女王捧出魔法嫁接卷轴，计划以地狱黑龙为嫁接体、以法力中和术抵消死亡一指的霜裂寒气来复活艾莉婕。切赫提出族中已有卡嘉瑞德宝石与月神封印的艾瑞达焰魔，只差活黑龙。
  - name: 第四百零六章 龙族石柱
    notes: 沉寂之海是四棵奇迹古树拱卫六口永恒月井与生命古树的湿地盆谷，穆里尼奥与刘震撼谈定以这两样交换采玉城军备。十星连珠寒潭边，众人见到与花精灵相依为命的最后一支淡水美人鱼。阿仙奴指出石柱符文是龙族文字。
  - name: 第四百零七章 失之东隅，收之桑榆
    notes: 潭中冰鳗误以为投食而扑岸，刘震撼、兰帕德与贝克汉姆合力将其斩成两截。花精灵暴怒，因为这条豢养千年的冰鳗本是托艾莉婕身体上岸的工具。刘震撼承诺下水搬人。阿仙奴说石柱是远古巨龙封印宝藏的禁制。
  - name: 第四百零八章 毒箭神射
    notes: 挖到天黑才取出套着六层箱子的银箱，里面是被风之符文傀儡锁链缠住的女孩，自称鸩女安瑞达。宴会时切赫之子提醒他鹦鹉只能活三年，被贝克汉姆拖进树林教训。丽芙以月石布阵，射手取安瑞达的血制成毒箭对付地狱黑龙。
  - name: 第四百零九章 爱琴之花
    notes: 穆里尼奥命刘震撼趁十五月圆取出寒潭中艾莉婕的遗体，潮汐领主革瑞恩托出坚冰结界；月精灵神射手以精灵披风伪装成蔷薇丛布下三角伏击阵，丽芙女王与花精灵祭司在月石六芒星阵吟唱广寒月影仪式。
  - name: 第四百一十章 劣质打手
    notes: 穆里尼奥清场，非精灵血统者全撤回翡冷翠，自己戴艺人面罩扮作普通精灵法师；刘震撼不会收敛元素波动，被风之符文傀儡锁链捆住封住气息，果果也一同被锁；穆里尼奥以七日醉迷倒安瑞达，果果却与安瑞达亲昵同食。
  - name: 第四百一十一章 月石，美色，引龙
    notes: 穆里尼奥连喷四道七日醉迷倒安瑞达，把风之符文傀儡锁链改绑到刘震撼身上；月石法阵冲起的银柱把丽芙与花精灵祭司的歌舞投上香帕，坚冰中的艾莉婕一同显现；穆里尼奥道破黑龙因至淫获罪，以月石与美色引龙上钩。
  - name: 第四百一十二章 魔力指挥家
    notes: 四头地狱黑龙闻声而至，在法阵上空盘旋示威；丽芙女王射出响弩，黑龙族长罗纳尔迪尼奥化成人形淫语相激；穆里尼奥嫡系格罗索、亨利现身做伏兵，切赫长老以灵犀魔饵箭显露三花聚顶的等级。
  - name: 第四百一十三章 龙人拜访
    notes: 四头黑龙分散俯冲肉搏，切赫长老以飞花逐月加持德鲁伊的冰霜之锥重创黑龙；月精灵神射手三波齐梅针箭沾着莫巴沙顶红增幅的毒液，四头巨龙中毒坠地；随后两三百名龙人与血婴西罗、摩尔法师从时空大裂缝现身。
  - name: 第四百一十四章 死亡游戏
    notes: 穆里尼奥踏碎月石现出天鹅羽翼，抛出七八百平方的禁空之歌，龙人与血法师纷纷坠地摔死；血婴西罗靠血色飞轮刹住下坠之势，与穆里尼奥的班底陷入僵持；广寒月影仪式被强制中断，双方在香帕下打成僵局。
  - name: 第四百一十五章 力量颠峰
    notes: 安瑞达破箱而出，以黑翎偷袭重创穆里尼奥并杀死德鲁伊与大批月精灵战士；她自陈天生雌灵之眼，宣布果果是一生的爱人，要众人推选一个先死的勇敢者；剑圣亨利拼死护主，穆里尼奥摘下艺人面罩，自称要死在李察前面。
  - name: 第四百一十六章 月夜狂化
    notes: 刘震撼借雪佛兰战斧在月圆之夜催发二度狂化，挣脱风之符文傀儡锁链一记正踹重创安瑞达；穆里尼奥以密袈大手印补击，二人合力将她打晕卸开关节；果果吞下西罗的驮都学会血月飞轮，李察力量已堪比十五六头巨龙。
  - name: 第四百一十七章 客似云来
    notes: 刘震撼从血婴西罗的尸体上取下嵌着血魄驮都的戒指，因穆里尼奥要死先死那句话把驮都转赠给他，穆里尼奥又转赠花精灵长老切赫；切赫讲解元素连枷与魔法嫁接术，刘震撼把戒指套到安瑞达手上准备解封。
  - name: 第四百一十八章 神圣凤凰
    notes: 安瑞达睁眼以黑焰之火偷袭穆里尼奥，本应打入艾莉婕的受体光波误射切赫长老；刘震撼弹出苜蓿花施移花接木，花瓣却打在小鹦鹉身上，魔法被嫁接给它；小鹦鹉化为神圣凤凰用龙语大骂，果果元素被抽空昏迷。
  - name: 第四百一十九章 赌命游戏
    notes: 上千魔族空军自时空大裂缝列阵而来，三大恐惧魔王巴蒂斯图塔、克雷斯波、萨维奥拉与六翼魔骑士奥维马斯依次通名；刘震撼以花系魔法红肥绿瘦召出花巨人威慑，乔科尔却用火焰回城卷轴带穆里尼奥等人逃走。
  - name: 第四百二十章 乱棍放翻老师傅
    notes: 刘震撼以卡嘉理德宝石保住性命，用生命战歌召出星云连锁闪电、天怒涅盘之火与绿色自然之愤怒，一举歼灭上千魔族菁英与三位恐惧魔王；宝石替他挡下非正常死亡后化作普通白石头；沙巴克王城现荆棘鸟之绝唱。
  - name: 第四百二十一章 圣上之价
    notes: 比蒙祭祀生命之歌的终极奥义是燃烧本体所有歌声，召出星云连锁闪电与对手同归于尽；刘震撼在二度狂化与天生灵魂歌者加持下歌力远超千年前七十四位狐人祭祀；最后他砍下四头黑龙脑袋取龙珠。
  - name: 第四百二十二章 伏兵无尽
    notes: 刘震撼的血系护盾半进阶，力道绞实体化成两个飞天裸女血侍，取得镜像助手与全视野；双子寒潭的六棱石柱接连倒下，两片风帆般巨大的东西从冻土中挤出，原来阿仙奴骗他放出了寒潭下被封印的东西。
  - name: 第四百二十三章 史前巨蚌
    notes: 十星连珠寒潭下钻出高逾二十米的巨蚌，安瑞达自述每两千年一轮回的返老还童体质却不肯说封印者。蚌壳开启，双头铜蜃领主席尔维斯特现身，阿仙奴以龙族至高神亥伯之名赌咒称刘震撼是强奸她的外籍龙族。
  - name: 第四百二十四章 挑战者
    notes: 刘震撼本想让铜蜃领主去龙城报仇再群殴，失口称自己是圣上之阶，反激起魔痴席尔维斯特留下挑战。他追不上巨蚌飞行速度，逼切赫长老加持音速增幅。结巴的爱琴之花艾莉婕醒来并一眼认出挑战者。
  - name: 第四百二十五章 全系魔兽
    notes: 席尔维斯特展开无序空间领域，可克隆对手表现出的能力并暂时屏蔽之。阿仙奴说明铜蜃领主是山蜃、海蜃、沙蜃一族的领主，双壳硬如精铜，是真正的全系魔兽；安瑞达称传说世界由蜃族之王金蜃幻化。
  - name: 第四百二十六章 泰穆尔拉雅压顶
    notes: 刘震撼以玄铁斧箱硬挡六支参合血箭，轮番使出祭祀战歌与蛛网术，暴露萨满身份令铜蜃领主震惊。他认输被拒后邀战肉搏，柳相铁飞斧被蚌壳弹碎，雪佛兰战斧在蚌壳吻线留伤。席尔维斯特诈飞天空，以整只巨蚌当头砸落。
  - name: 第四百二十七章 帽子戏法完成
    notes: 刘震撼含鹣鲽驮都变身双头牧树人硬接巨蚌，翻滚后骑上蚌背猛砸，果果以暴雨梨花弩自内部射穿铜蜃领主。剖蚌得到上百颗极寒珍珠与法力记忆、法力健忘两颗珍珠。阿仙奴变回霜雪皮丘求饶，刘震撼自称夏圭神使。
  - name: 第四百二十八章 花中皇后
    notes: 果果饮元素之泉恢复魔力，仍未进阶为镜像血侍，只多出血月飞轮，巨蚌体内也无碧血丹青。艾莉婕得知已过一万年而痛哭，切赫长老鼓吹精灵再度崛起。艾莉婕自陈是花中皇后，与花王同为八月十五慕罗丹花生日。
  - name: 第四百二十九章 死亡领主套装的秘密
    notes: 艾莉婕道出花后四大花系异能，即羯鼓催花、落英缤纷、花拳绣腿与只能用一次的万花朝宗。她解释萨穆埃尔靠死亡领主套装发出十指剑芒，故果果随套装一同法力清零，并警告套装会潜移默化改变穿戴者性格。
  - name: 第四百三十章 慕罗丹花下死
    notes: 刘震撼辩称自己不会嗜杀。切赫说出慕罗丹花下死、做亡灵也风流的典故，安瑞达补充花后皆是万里挑一的美女。被小贝打伤的守护武士米库指认刘震撼，三位花精灵随即看到仙女龙、金凤凰与黄金双头巨龙现身。
  - name: 第四百三十一章 一夜回到解放前
    notes: 海伦、黛丝、娜娜与兰帕德赶到，凝玉率老板娘与武士走出传送阵，刘震撼命搬空月石、奇迹古树与月精灵箭手尸体。萨尔国王提议他娶南希公主兼东北总督被拒；艾莉婕插话自称翡冷翠主人，用帝维戒指播放雷克萨求婚影像。
  - name: 第四百三十二章 巨大危机
    notes: 萨尔国王落荒而逃。艾莉婕承认只想借夏宫神姬名义保住花精灵的自尊，并率族人加入法师团，甚至愿做专属侍女，安度兰长老代为应允。长老随后道出真正大事：西米里安王子来招安或下战书，海族已能安全离水。
  - name: 第四百三十三章 旧日故人
    notes: 美人鱼王子西米里安到访，要刘震撼交还艾薇尔尸骸并带头投降，遭拒。他透露海族半年前攻占黄金海岸大陆、开矿锻造钢铁武器，并有三万风暴撕裂者；其堂弟卡洛斯以海洋幽魂领域结界保住福格森.徐亡灵，老徐认出凝玉。
  - name: 第四百三十四章 不算好的好消息
    notes: 献祭之火对东方亡灵无效，刘震撼找到翡冷翠唯一留居的蹩脚方士，按指点用沾污棉纱缠砖拍击，重创福格森.徐。他与西米里安约战戈戎。安度兰报告直布罗陀河底精金矿山无法开采，刘震撼取出四颗黑龙龙珠。
  - name: 第四百三十五章 魔法太保
    notes: 花精灵二百四十四人与淡水美人鱼一百二十七人全编入翡冷翠法师团，贝克汉姆提议更名夏宫太保团、统一盖世太保式立领袍，遭花精灵反弹并要求换团长。小贝在红土广场以脚发冷焰火焰刀连胜，痛骂众人靠烧钱装备。
  - name: 第四百三十六章 精灵岂非池中物
    notes: 刘震撼借骑士小说《精灵岂非池中物》戏弄艾莉婕，许诺下月十五为她举行广寒月影仪式，还要求封自己做一字并肩神。安瑞达正式拜见家人唤婆婆。安度兰解说铜蜃珍珠冰霜力量源自精神力克隆。
  - name: 第四百三十七章 仲夏香艳之夜
    notes: 安度兰剖析铜蜃领主以精神力克隆魔法，提议借千年魔芋美人吸收蜃珠精神力。艾莉婕因赠书之事上门动手，施展蝴蝶穿花腿却坐进老刘怀里羞逃。娜娜鉴定地上战剑为魔族四大天王佩剑雪铁龙，此时示警号角响起。
  - name: 第四百三十八章 再度屠魔
    notes: 圣保罗教皇保罗·马尔蒂尼率圣堂飞行骑士被魔族追杀，逃至黑幕笼罩的翡冷翠。小鹦鹉马特拉齐以龙语魔法与火中取栗痛击魔族追兵，龙骑士兰帕德率幻兽骑士出击。教皇小心询问眼前之人是否就是圣主保李察大人。
  - name: 第四百三十九章 圣阶陨落
    notes: 教皇详述帝梵西遭三大恐惧魔王等魔族突袭，普斯卡什大师率众阻击掩护突围，教廷传送阵遭干扰光波破坏，抵达者仅十八人。刘震撼惊觉自己昨晚也遭遇同样阵容。贞德转述父亲凌晨千里传音后当场昏厥。
  - name: 第四百四十章 魔界巨变
    notes: 艾莉婕揭示魔族已研制出克隆药物，可能同时出现两位巫妖王，众人盘点爱琴仅剩的魔导师与冰雪女神教狂信大祭司帕翻。小鹦鹉抓回魔族羽翼骑士。刘震撼宣布自己为圣上之阶立誓亲手复仇，又抱住安度兰长老求他别离开。
  - name: 第四百四十一章 血腥反击计划（上）
    notes: 刘震撼把海族明年大举入侵的消息告知教皇并索要金币武装雷鸣之子，教皇允诺号召国王组成联军。兰帕德首战漏网向老板告状。凝玉讲述丝绸大陆野兽修成神兽须过两道关，安度兰建议把驮都戒指交给安瑞达。
  - name: 第四百四十二章 血腥反击计划（下）
    notes: 刘震撼提出亲赴魔界，教皇解释跨位面传送阵须邮差水晶、时空大裂缝有重合冷却时间，安度兰自报旧身份冰霜之舞者阿斯顿维拉并反对。老刘打算用嗜金蚁让魔界断子绝孙，逼降俘本·华莱士灌注死灵奥术。
  - name: 第四百四十三章 苦尽甘来
    notes: 一周后桑干河畔野牛野马大迁徙，翡冷翠牧民大量捕猎入冰窖。革瑞恩与许德拉吞噬冥火骷髅暴君、黑龙族长、铜蜃领主后壮大。刘震撼推断普斯卡什大师引魔族至火鹘山脉欲以禁咒同归于尽而失败，澈桑大陆油瓜开始量产。
  - name: 第四百四十四章 精神魔法(上)
    notes: 艾莉婕劝刘震撼把庞大精神力让给资质远胜的小贝，并索要二百四十二颗雷霆钻石装备花精灵。伊布夫妇与斯蒂法诺大师应邀来到翡冷翠支持魔界之行。刘震撼打算用莲菝丝向卢塞恩换生命之泉与精灵奴隶以量产魔芋恩特。
  - name: 第四百四十五章 精神魔法(中)
    notes: 刘震撼解释开价高是为留还价余地。艾莉婕献计以元素连枷双倍增幅，先给千年魔芋美人灌下高强度春药激发本能、制造思维紊乱，试图让传输的精神力裂变出成型的攻击型精神魔法。当夜刘震撼喂药后由艾莉婕施展元素连枷。
  - name: 第四百四十六章 精神魔法(下)
    notes: 安度兰长老忙于南十字星森林土著部落搬迁，伊布与斯蒂法诺大师等在领主大厅闲谈看帝维。沙漠之狐隆美尔以藏形匿影潜入被识破，南希公主掷椅相击。刘震撼以精神力传音现身，直言隆美尔的导师马拿利死在自己手里。
  - name: 第四百四十七章 二气美帅
    notes: 隆美尔自述被气晕坠地假死的经过，刘震撼以精神力刺激其神经逼得他当场喷血。隆美尔代表卢塞恩城洽谈莲菝丝贸易，以十磅生命之泉、一万精灵奴隶与全部地穴居人奴隶成交。小鹦鹉以燃灵之火封死其隐身术。
  - name: 第四百四十八章 死亡高潮
    notes: 燃灵之火使隆美尔终生不能再隐形，刘震撼也中了一记。刘震撼坦白自己获得的精神魔法竟是元素连枷双倍增幅的同步死亡高潮，众人震惊羞恼，凝玉责问他是否对艾莉婕用过，安度兰担心此事传出成为爱琴第一大笑料。
  - name: 第四百四十九章 超史前生命
    notes: 刘震撼穿越时空大裂缝来到魔界，在无名山脉深埋嗜金蚁后并抹去痕迹，记述魔界双日双月与暴烈魔兽。他借精神力与珊瑚美人谭雅联系上，得知谭雅是水晶人、属远古矿物进化种族美德罗人，瘟疫令其石化而获长生。
  - name: 第四百五十章 渗透的第一步
    notes: 谭雅自述是史前水晶美德罗人，地底圣井实为水晶人研究室，刘震撼想用魔法破解她的石化，追梦人西尔芙则已失联。他凭精神力察觉数十里外蘑菇状山峰有激战，赶去见到七名魔族冒险者围攻深潭触手怪物。
  - name: 第四百五十一章 演出开始了
    notes: 深潭怪物是堪比亚龙的高阶魔兽，银瞳剑士博哈尼被腕触吸成干尸。刘震撼投出自制青铜投枪射穿怪物眼睛，再以两位血侍和血月飞轮将其击杀，夺得博哈尼的战剑；他还借魔界大花领悟拈花指威力。
  - name: 第四百五十二章 变异奥兽
    notes: 四名幸存魔族冒险者错认他为六天王，刘震撼自称隐居银瞳卡鲁。他套出魔界分海岸贡献、荷里活、宝莱坞三个大陆，三大陆靠魔法传送阵往来；还得知变异奥兽体内有能释放法术的奥骨，可制成奥骨斯都法杖。
  - name: 第四百五十三章 霸王餐
    notes: 四天跋涉中圣盔平原两度地震，众人抵达掏空大山而建的坑道城美津浓。魔族城市全在山体或地下，骨雕成风，送葬时载歌载舞。因贝币耗尽，刘震撼带四名伙伴连敲十五家酒吧，用甲片讹钱凑足盘缠。
  - name: 第四百五十四章 天王竞选的第一步
    notes: 老刘在卡萨布兰卡图书馆得知：六个爱琴种族沦为附庸平民，魔界已有四系奥术与晶石甲胄，五百万机关憎恶武士叛乱、约两百万固守宝莱坞一城。天王竞选开幕，他踩飞轮上台瞬杀恐惧骑士与黑曜毁灭者。
  - name: 第四百五十五章 肉搏样板戏
    notes: 海岸贡献巫妖王嘉宝竟是美貌女子，当众称赞银瞳勇士。刘震撼连杀七名空骑士，石像鬼纳什被拧断石颅，战剑崩断后改用铜棒。四翼魔骑士拉希德华莱士挑战，被他血月飞轮压制后一棒震碎胸骨而死。
  - name: 第四百五十六章 直肠子对上花花肠子
    notes: 全城死寂，六翼天王奉嘉宝之命召他入宫。刘震撼在井式大殿觐见，报出假名萨罗蒙.卡鲁，以传音入密只与巫妖王独谈。嘉宝看出他瞳孔银十字星与魅惑之眼，恐惧魔王贝斯特质疑魔界并无卡鲁姓氏的银瞳家族。
  - name: 第四百五十七章 一个不算好的开头
    notes: 嘉宝查出勇者之心只是最低的z级冒险团，指出老刘身边两个血侍其实是元素精灵使。他谎称用的是吃红果得来的霓虹系奥术，嘉宝提到十万大山杜宾人的彩虹系魔法。贝斯特建议试探，嘉宝仍封他为左岸天王。
  - name: 第四百五十八章 翻天巨变
    notes: 六翼天王斯托克顿陪他歇在别苑，点破左岸天王之争实为三位巫妖王分配空骑兵团军权，还讲梦魇座骑进化与银瞳开天眼之秘。此时普斯卡什大师现身门外，斯托克顿拔剑冲上，老刘提棒跟上。
  - name: 第四百五十九章 王后归来
    notes: 场景转回翡冷翠：悬赏第七的魔盗蕾贝卡求见领主，被贝拉米与贝克汉姆截下，小贝强留她做秘书。倾国倾城的王后艾薇尔自阶道而下，潘帅道出她正是沉睡的美人鱼公主、领主为救她断去左臂，夏宫卫队随即列阵。
  - name: 第四百六十章 灵丝密码
    notes: 嘉宝以皇极变身术扮成普斯卡什试探老刘，因他吃菜而失手。她出示细作的爱琴高手图册，直言三大陆突袭中宝莱坞全军覆没、荷里活活捉德鲁伊王子卡卡，并要求他去别的大陆再竞选左岸、留下指甲头发做傀儡。
  - name: 第四百六十一章 战地玫瑰
    notes: 嘉宝要的傀儡替代是以身体发肤制替身、受伤即反噬宿主的死灵奥术，老刘只肯割须、拒剪指甲，嘉宝遂作罢。夜里他为普斯卡什被拘魂而心痛，沉睡的艾薇尔被这刺激唤醒，携艾莉婕经星空之门赶来重逢。
  - name: 第四百六十二章 海魁本相
    notes: 第三次双修进化完成，老刘与艾薇尔获得第三阶领域结界海魁本相，可幻化三对元素手臂与额头虾枪，并具虾跃之能；众人见识后大笑。侍从送来左岸天王装备：黑云金左岸拳甲、水晶菲亚特长剑与十二枝水晶瓶。
  - name: 第四百六十三章 深挖内幕
    notes: 侍卫讲解菲亚特战剑以帝俄水晶制成、剑刃可弹射回返，永久加持燕返术须魔导士且施法者连退四级；艾莉婕点破魔族以政治制衡压制下位魔族修习爱琴主系魔法，提醒刘震撼魔族未必放心他。
  - name: 第四百六十四章 失败傀儡
    notes: 嘉宝女王追问刘震撼的精神力，以火红水晶测试塔测得三百五十七赫兹，满殿魔族跪倒；替身傀儡制作失败无法控制他，六翼天王斯托克顿建议重修银瞳死灵术被拒，女王下令带圣奇奥来施加灵丝密码。
  - name: 第四百六十五章 诡异的灵丝密码
    notes: 嘉宝以灵丝密码水晶从普斯卡什大师遗体剥离奥术，事先告知死体剥离的危险；大师额上血红晶钻映出人脸，刘震撼立誓用其魔法还击魔族；剥离竟抽出两道奥术，大师灵魂燃烧自身补足进奥术之中。
  - name: 第四百六十六章 未种情根，已种情根？
    notes: 揭示嘉宝在剥离中夹带巫妖种族异能倾心契约，令契约双方不可自拔相爱，刘震撼因无法拒绝魔法而中招，眉心多出银眼符文；剥离出的两道魔法是英捷尔法勒与巫师变形咒，他被封真武亲王，随即杀入后宫。
  - name: 第四百六十七章 光棍本色
    notes: 刘震撼血洗嘉宝后宫，斩杀多名银瞳嫔妃，嘉宝下令擒拿又怕伤他，只能任其泄愤；他当面辱骂女王并索要一千枚黑贝币离去，嘉宝向恐惧魔王贝斯特坦言无人敢用他，艾莉婕点明倾心契约只是元素强加的感情。
  - name: 第四百六十八章 欺男霸女
    notes: 三名爱琴人乘卡丁车游览魔界街市，刘震撼当街打昏银瞳骑士、拍碎其梦魇，与艾薇尔、艾莉婕劫走斯派尔族孔雀美人；随后抵达大型商号丰沃之田，见识古冢大楼、巨型肋骨楼架与水晶隔扇门。
  - name: 第四百六十九章 拿别人的枪戳别人的马
    notes: 丰沃之田老巫妖苏拉接待三人，认出卡鲁天王，告知一枚黑贝币可买一只比亚乔3000，并赠送一千个骨联宝盒；艾莉婕取出十二瓶血髓折价，刘震撼开出蓝影琉璃水晶、烟罗水晶测试塔与两万摩卡传送水晶清单。
  - name: 第四百七十章 不行就动武
    notes: 苏拉算出差额四十五万黑贝币并主动打半价，刘震撼只肯延期付款，扬言去别的大陆竞选左岸并向两位巫妖王索要封口费，还威胁不得走漏消息；苏拉请示主人后同意赊账交割，他放弃动手，改取水晶高跟鞋与紧身皮镂。
  - name: 第四百七十一章 早安，荷里活
    notes: 三人抵达荷里活大陆火山城市星光大道之城，刘震撼解说此城是魔界唯一全封闭城市，途中遇地震；他谈及魇马与军火贸易、联合沙漠国度与十万大山杜宾人的发财构想，并在演武台上用高压弩筒吓翻一位恐惧骑士。
  - name: 第四百七十二章 流氓学武术，谁也抗不住{A}
    notes: 羽翼骑士把刘震撼带到巫妖王保罗纽曼御座前，他掀开斗篷露出真面目；保罗纽曼一眼看穿倾心契约，提出以奥骨法杖换他退出竞选，刘震撼只索德鲁伊卡卡的剥离奥术，被拒后当场揭发嘉宝与八百男嫔之事。
  - name: 第四百七十三章 流氓学武术，谁也抗不住{B}
    notes: 追述魔族克隆多胎药丸内幕：只保留三胞胎药丸并限用于巫妖王与恐惧魔王，故魔界仍只有三王五天王；三大陆各自为政，四翼分布与左岸竞选规则被点明，保罗纽曼拒绝加持剥离奥术，刘震撼改口挑战三大恐惧魔王。
  - name: 第四百七十四章 流氓学武术，谁也抗不住{C}
    notes: 三位恐惧魔王以三点合击与恐惧光环围攻，一人暗放永恒睡眠，刘震撼凭超强精神抗力瞬间脱身，先用储存在法力记忆珍珠里的两道盥阴之光击倒一个，再以海魁本相八只手迎战，用水晶剑斩飞一位魔王的四根爪子。
  - name: 第四百七十五章 流氓学武术，谁也抗不住{D}
    notes: 刘震撼以巫师变形术把恐惧魔王反复变成裸女羞辱，两位魔王恼羞之下施展「奥吸」拼命吸取他的元素力量；他戴上法力驮都戒指以六倍魔力硬抗，最终两位魔王膨胀爆体而亡，另一位被盥阴之光射中废掉。
  - name: 第四百七十六章 流氓学法术，谁也抗不住{E}
    notes: 三人与被捆的德鲁伊卡卡转移到宝莱坞大陆萨日里窝城大酒店，途中甩掉多拨魔族暗探与各类谍报装备；艾莉婕劝撤退，刘震撼坚持留下，艾莉婕以苍穹之怒射出三枝荆棘绿箭示威，众人议论他的威慑价值。
  - name: 第四百七十七章 流氓学法术，谁也抗不住{F}
    notes: 刘震撼阐述必须留在魔界的理由：灵丝密码可把植物人与新鲜灵魂的奥术剥离转嫁，魔界仍能挽回战力；他分析魔族侵略靠数百万基础兵员，极道高手只是威慑，并提及海族西雅、亚力士与香帕三国的风暴撕裂族术士。
  - name: 第四百七十八章 流氓学法术，谁也抗不住{G}
    notes: 刘震撼说出留任做官的真实计划：率杂牌军先扫平海族一支先头部队，逼海族与魔族驳火，借翡冷翠双料大油瓜赢得盟友，保全比蒙后再从旁插刀；德鲁伊王子卡卡自报部落与全名，讲述地穴领主的吐丝与禁锢法师的水晶签子。
  - name: 第四百七十九章 一个小瘪三
    notes: 德鲁伊王子卡卡自述来历：部族因精灵与德鲁伊大决裂迁居落日沼泽，后南迁至十万大山。他闯时空大裂缝到魔界五十年，因劫富济贫遭巫妖王派兵围剿。刘震撼得知自己是天然媚惑之眼，并弄清杜宾人即丛林巫毒巨魔。
  - name: 第四百八十章 一个很强的小瘪三
    notes: 卡卡交代如何击溃魔族斩首部队：以迷踪飞鹭的混沌迷雾让敌人迷路，再一次释放储存八年的雷电。他的变身换成美罗拉帝企鹅和迷踪飞鹭，两兽都只懂致幻毒气。他抢来的名贵珍珠已被吞服融合，艾莉婕则提起佛巨人女子。
  - name: 第四百八十一章 变异奥兽的秘密
    notes: 刘震撼在萨日里窝城受宝莱坞巫妖王克拉克·盖博御宴款待，主菜是月蚂制成的月上清天。巫妖王炫耀变异奥兽骑士团，透露变异靠从白贝币提纯的瑙白金，一摩卡需二十万枚白贝币，他已组建一千三百人的变异卡丁兽骑士团。
  - name: 第四百八十二章 语言陷阱{上}
    notes: 巫妖王以一摩卡瑙白金换取刘震撼放弃左岸天王竞选，刘震撼忍痛拒绝，因为只有拿到领兵权才能挑起魔族与海族互斗。巫妖王转而强调军团战斗力在于基层军官素质，并暗示宝莱坞家底仍在，令羽翼骑士们按剑对峙。
  - name: 第四百八十三章 语言陷阱{下}
    notes: 巫妖王改以十摩卡瑙白金换友谊，与刘震撼结为异姓兄弟，并封他为圣武亲王，以此绕开女王嘉宝对后宫职衔的操控。刘震撼受封双料亲王，六翼天王阿泰斯特奉命取来大礼与一半瑙白金，巫妖王还劝他疏远z级冒险者朋友。
  - name: 第四百八十四章 双料亲王
    notes: 巫妖王揭出自己才是魔界最大商铺丰沃之田的幕后老板，刘震撼由此想通对方下血本的原因：自己在卡萨布兰卡的豪购被当成暗藏不臣之心。巫妖王再赠一百根奥骨法杖与一百颗护盾宝石，并叹息雷藏珍珠已被卡卡吞服融合。
  - name: 第四百八十五章 丽人鱼
    notes: 阿泰斯特带回丽人鱼拉蔻尔·薇芝与内库支取的瑙白金、奥骨法杖。巫妖王介绍丽人鱼是雾蔼之海海族，体液见血封喉，靠和合珍珠才能上岸；又警告刘震撼须把强抢的彩凤美人还给魔梦女神神殿，丽人鱼只可看不可亵玩。
  - name: 第四百八十六章 奥兽军种的阴谋
    notes: 巫妖王准备把先王珍藏的和合珍珠送给刘震撼，怂恿他下雾蔼之海收服丽人鱼部族以获白贝币。刘震撼反过来建议组建空中奥兽骑士团，与六翼天王阿泰斯特就空军价值激烈争论，并用冗长的战术论述说服巫妖王采纳空骑构想。
  - name: 第四百八十七章 珠联合“璧”{上}
    notes: 御宴后刘震撼与丽人鱼住进纯水晶砌成的双层水晶塔，惊叹魔界水晶工艺。他问出人鱼名叫拉蔻尔·薇芝，并说明要把她送回族人换白贝币。薇芝称自己已无直系亲人且违背祖制，并警告他下海必被临死诅咒所害。
  - name: 第四百八十八章 珠联合“璧”{下}
    notes: 刘震撼以语言漏洞层层逼问，拆穿薇芝是携和合珍珠潜逃上岸。薇芝承认一蚌双珠：合珠营造贴体结界，和珠调和阴阳可增元素力量，双珠并联另有璧系奥术，合浦则令珍珠报废。丽人鱼寿三百，佩合珠可延至千年。
  - name: 第四百八十九章 偷窥
    notes: 墙角银镜原是孪生镜花，半里外另一座水晶塔中，巫妖王与阿泰斯特正借它偷窥。二人评点卡鲁疑心极重、把生活当演戏，也承认他套问出的海族内幕有价值。刘震撼一边替薇芝梳发遮挡她的惊骇表情，一边不动声色继续交谈。
  - name: 第四百九十章 反偷窥
    notes: 巫妖王断言刘震撼别无选择只能依附一位巫妖王，并透露保罗纽曼明日将到宝莱坞作客，多半是来对付卡鲁。镜花回归银色后，他放出双艾、孔雀美人与卡卡，众人惊叹水晶宫；他讲明镜花秘密，艾薇尔把七度金戒指送给卡卡。
  - name: 第四百九十一章 雾隐珍珠
    notes: 刘震撼展示瑙白金、一百根奥骨法杖与一百颗护盾水晶钻。艾莉婕质疑变异违背元素规律，薇芝借鹦鹉学舌螺用通用语解释：变异以吸收空气元素之力为代价，容貌俱损，合珠只能减轻毒素。她又道出雾隐珍珠能吸收释放雾体。
  - name: 第四百九十二章 毒雾桃花
    notes: 众人推演两大极品珍珠的威力：雾隐珍珠在充斥毒雾的魔界等同超级生化武器，魔族一年可用十二次。艾莉婕主张谈禁咒不扩散或骗来珍珠，刘震撼拒绝，并提出吸香红豆净氧、厚实衣物、大火促挥发与挖坑道四法应对毒雾。
  - name: 第四百九十三章 强纳民女{上}
    notes: 艾莉婕竟满口答应陪李察睡一夜，令艾薇尔愕然。艾薇尔随后剖析：希芙复族须有大势力作后盾，而附庸壮大必遭领主压制，故艾莉婕的婚姻只能是政治婚姻并应留下混血后代，否则只能彻底依附翡冷翠或放弃理想。
  - name: 第四百九十四章 强纳民女{中}
    notes: 艾薇尔以皇家女子身份论证政治联姻无可避免，艾莉婕颓然沉默。双艾带卡卡返回翡冷翠，艾莉婕临走以「法力中和」替薇芝解除魔法烙印。刘震撼盘算招揽地精灵的私心，又誊写毒气对策与行动计划。
  - name: 第四百九十五章 强纳民女（下）
    notes: 鲛人谱系全面铺陈，海洋、淡水美人鱼与寇涛、毒蔼丽人鱼、沼泽、雕题人鱼各有渊源；丽人鱼体液带毒，握有临死诅咒与毒系奥术。刘震撼把春药混进茶水，薇芝鱼尾自背鳍裂开褪去，露出双腿与鳞线。
  - name: 第四百九十六章 第二个双修领域结界（上）
    notes: 艾薇尔经星空之门赶到，撞见刘震撼与两位血侍的荒唐场面，怒极落泪。老刘喊出双修领域结界才是血侍停不下来的根源。文中详辨血侍的半生命体性质：魔力恰与自然造物法则吻合而衍生，与不死幽魂同属半生命体。
  - name: 第四百九十七章 第二个双修领域结界{中}
    notes: 刘震撼一边与血侍纠缠一边谈正经事，艾薇尔却抢先想通关键：只要有和合珍珠，就能替领域结界未觉醒的淡水美人鱼夫妻配对，批量生产双修领域结界。只是珍珠具备还浦自毁之能，必须先拿下薇芝。
  - name: 第四百九十八章 第二个双修领域结界[下]
    notes: 艾薇尔说明西雅官方只登录战斗型领域结界，非战斗型不入宗人谱，上了陆地却可能化腐朽为神奇；四大珊瑚顶亲王镇守四方海疆，领域结界各具杀机。刘震撼摊开星空倒影，指出丽人鱼领域结界全是诅咒。
  - name: 第四百九十九章 南斗六星的祝福
    notes: 刘震撼交代规则：夫妻共得一次诅咒或祝福机会，南斗祝福六分之一、北斗诅咒七分之一成功，无论成败都须等一千次进化后才能再用。他承认祝福内容是让两位血侍每日主动求欢两次，事后懊悔没改成十次。
  - name: 第五百章 何塞家大老板
    notes: 刘震撼以百年五百次尝试说服艾薇尔。艾薇尔转告家事：穆里尼奥已渡过危险期；斯迈老公爵布吕克纳云游十年后归来，此人号称祭祀中的贝因芬，脾气又臭又硬，归来势必压下刘震撼与妮妮、莉莉的姻缘。
  - name: 第五百零一章 强中自有强中手
    notes: 何塞家的魔宠传统与荆棘鸟的荆棘光环、学舌本领一并补出。崔蓓茜为遮掩珠胎下嫁凯文子爵，名义丈夫与权杖祭祀之妻私通被捉，决斗中几乎必死。壹条率两百卫士闯过风暴海峡抵达桑日大陆，遭土著与八歧巨蛇袭击。
  - name: 第五百零二章 月若无恨月常圆
    notes: 刘震撼下令调集魔法太保团、祭祀团、夏宫仆射、牧树人、幻兽骑士与龙骑士兰帕德围剿八歧巨蛇，取它的隋珠；壹条视那蛇为平生仅见的最强魔兽，风系魔法比革瑞恩厉害百倍。卡卡被艾薇尔一吓，准备把雷藏珍珠相赠。
  - name: 第五百零三章 淫糜之夜的终章
    notes: 金冠角斗大赛上，刘震撼的贴身侍卫肥罗违背禁令偷偷报名，竟被一位毫无背景的年轻武士一招封喉。此人兼通多种族的失传绝技，七场连胜且自主狂化后眼神清澈，与刘震撼同名同貌、黑发黑眸，被称作海加尔之星。
  - name: 第五百零四章 泼皮无赖走天下
    notes: 薇芝醒来后并未走上极端，刘震撼靠誓言与床上功夫让她暂且接受既成事实，并嘱她瞒下这一夜。巫妖王盖博再见他时目瞪口呆，探问百毒不侵的底细后，以传音入密索要和合珍珠，要他去海族换白贝币。
  - name: 第五百零五章 貂蝉美人的秘辛
    notes: 刘震撼经水晶传送阵抵达达坂镇一家简陋的丰沃之田商号，老板是肥硕的地穴恶魔约克。薇芝试衣惊艳，约克盛赞她够格当女神圣女，并透露文莱主神庙的魔梦圣女使是快绝种的貂蝉美人，还道出貂蝉美人靠碧落之黄泉繁衍。
  - name: 第五百零六章 天衣？
    notes: 约克捧出野生碧萝果，刘震撼尝出酒酿般甘甜；达坂镇靠梯田种植银淀棕榈，前年有奥兽作祟被羽翼骑士多诺万斩杀。他大刮浮夸风，放话银淀棕榈能棵产上万摩卡，亮出左岸天王卡鲁的身份。薇芝的长裙只有经线不见纬线。
  - name: 第五百零七章 鹭鸶腿上刮瘦肉
    notes: 约克解说无纬线长裙并非织成，而是用菖麻丝经三夹版压版黏合，靠的是宝莱坞南部特产荔胶；荔瓶树一棵可割一千五百摩卡，黏合力胜过可液化水晶焊接，唯独怕雨水。刘震撼用奥术肖像换得荔胶与一千套水晶灯。
  - name: 第五百零八章 爱琴大陆最早的敌人（上）
    notes: 刘震撼沉浸于把滹夜古城当作练兵场、诱杀慕兰人的美梦。约克被天价索求吓住，借骨联宝盒向大老板请示；盖博在那头痛骂卡鲁是贪得无厌的瘪三。梦露公主疑心卡鲁以放浪麻痹父王，黑发俊男阿兰德隆现身王殿。
  - name: 第五百零九章 爱琴大陆最早的敌人{中}
    notes: 魔界宝莱坞王殿中，巫妖王克拉克·盖博与梦露公主、六翼天王辛克莱尔商谈，话题围绕传奇奥术师卡鲁；魔龙皇太子阿兰德隆来访，自称魔龙一族已恢复全盛实力。
  - name: 第五百一十章 爱琴大陆最早的敌人{下}
    notes: 盖博与魔龙皇太子阿兰德隆讨价还价，最终谈成两头普通魔龙加五百头混血地行龙；盖博吐露文莱主神庙圣火熄灭、魔梦女神失联的内幕，辛克莱尔担心魔龙噬龙天赋反噬，梦露断言卡鲁将是挥向魔龙的第一把屠刀。
  - name: 第五百一十一章 爱琴告急
    notes: 巫妖王盖博认定翡冷翠是爱琴势力的缩影，其主李察是爱琴圣奇奥，麾下有凤凰与黄金双头巨龙、数百奥兽空军和至少五百位爱琴魔法师，曾全歼宝莱坞先遣军；梦露奇怪另两位巫妖王迟迟不到，盖博怀中的骨联宝盒突然响起。
  - name: 第五百一十二章 花都大战
    notes: 刘震撼胁迫达坂镇丰沃之田分店的约克老板调来奥术师，带薇芝传送到文莱主神庙所在的加拉塔萨雷城，操控花潮步入庙前，却认出供奉的魔梦女神正是他捣毁过的摩尼女神；神殿骑士痛骂他冒充神使。
  - name: 第五百一十三章 花相出世{上}
    notes: 刘震撼拔剑血战神殿骑士，单手抡起一吨重的梦魇当武器，左岸拳甲舒展成赝品冰封王座战甲；他嘲笑对手连冲锋都不会，近千名梦魇骑士与二十尊骨偶魔像随即增援；艾薇尔、艾莉婕经星空之门赶到。
  - name: 第五百一十四章 花相出世{中}
    notes: 薇芝被两位敦煌血侍搀上高空；刘震撼召唤出十米高、二十四万磅的云秦挂甲金人碾碎梦魇骑士；艾莉婕施出花开并蒂令魔族法师耗魔翻倍，又用嘲讽之箭引偏奥术，艾薇尔狂砸皇家珍藏版奥骨法杖。
  - name: 第五百一十五章 花相出世{下}
    notes: 刘震撼以拈花指弹射后庭花，薇芝念动命运的双生子诅咒失手；四位飞行骑士突袭，他用巫师变形咒和水晶剑斩杀对手，云秦金人冷却消失；花相丽塔·海华丝以花枪拦下他，自称笼烟芍药主人与文莱神庙魔梦神使。
  - name: 第五百一十六章 冒牌神使{上}
    notes: 战后神庙前尸横遍野，刘震撼以通灵之歌超度亡魂，悄悄收集魔族高手的血之菁华，并把双艾收入七度金空间戒指、传令夏宫卫队备战；花相海华丝道出自己是花中宰相，还以恭敬语气称他为最高存在的花中之王。
  - name: 第五百一十七章 冒牌神使{中}
    notes: 刘震撼摘走海华丝鬓边的香水风信子魔法花卉；二十来名孔雀圣女涌出，其中十余人手拈鲜花，全是花衔中人；海华丝自陈掌握名花有主、耍花枪、落花流水三大花系奥术，自称神恩眷顾者并兼有光影霓虹与控花两大异能。
  - name: 第五百一十八章 冒牌神使{下}
    notes: 刘震撼以花潮表演震慑全城魔族，三位巫妖王落地责问；他恶人先告状，搬出普斯卡什大师奥术走到极致没有派系之分的理论，召唤出两个十米高的元素巨人红肥绿瘦，把保罗纽曼羞辱得无地自容；嘉宝追问另两个女人的下落。
  - name: 第五百一十九章 正牌神使{上}
    notes: 刘震撼弹射后庭花深深没入骨柱示威；海华丝当众称他是当代花王与自己的主宰，盖博惊觉被孪生镜花所骗；两位夜影魔龙史泰公爵和施瓦辛格公爵现身，刘震撼一剑捅穿施瓦辛格肚皮。
  - name: 第五百二十章 正牌神使{中}
    notes: 辛克莱尔与两名双翼骑士合力格挡刘震撼的杀招却虎口流血；刘震撼肘击施瓦辛格、勒住他脖子逼其跪地，顺手抹走他手上本属普斯卡什大师的七度金戒指；海华丝叱责银瞳放任魔龙，三王同气联枝索要证明。
  - name: 第五百二十一章 正牌神使{下}
    notes: 阿泰斯特受盖博指使揭出文莱主神庙圣火熄灭、海华丝与女神失联；海华丝坚称女神未抛弃银瞳，提出以薛南兰杜尔汲取召唤术作证；刘震撼被迫跟念咒文，空间传送门与梦魇马车当众显现。
  - name: 第五百二十二章 终极进化{上}
    notes: 刘震撼身被黑色元素光波链浸浴，地下文莱城上空翻起乌云旱雷，九道闪电链劈中他头顶，背上生出星空倒影之翼；追梦人西尔芙乘梦魇马车现身，三位巫妖王惊呼真正的人形梦魇；骨联宝盒传来时空大裂缝全部洞开的消息。
  - name: 第五百二十三章 终极进化{中}
    notes: 刘震撼用天都话骂人却被众魔族听出，嘉宝误以为是神赐异能，他顺势谎称自己讲的是神语；海华丝逼三位巫妖王承认女神化身，三王却只承认他是银瞳并新封魔翼天王，海华丝方知中计，刘震撼察觉大小s血侍眼中的杀气。
  - name: 第五百二十四章 终极进化（下）
    notes: 刘震撼的魔界间谍之旅彻底失败，神智失控下他打青嘉宝的脸、凌辱了多名女子；清醒后得知自己选了嘉宝提议的试练，去海岛击毙比目魔鲛取奥晶；海华丝率全部魔梦圣女追随他回海岸贡献大陆，他在阳台与嘉宝告别。
  - name: 第五百二十五章 是男是女真的很重要吗？
    notes: 墨文若克海岛，比目魔鲛栖息地。大s告知时空大裂缝因刘震撼晋阶而提前开启；两位血侍已进化为元素精灵使并宣告背叛，只留给他终极血盾；貂蝉美人海华丝自曝是女子，艾薇尔与艾莉婕自星空之门赶到。
  - name: 第五百二十六章 动植双修{上}
    notes: 刘震撼携大批美人回翡冷翠，凝玉剪了短碎发；人类画家提香大师受教皇之托绘制《圣徒》并想以貂蝉美人为蓝本；军官会议上老刘坦承造成时空大裂缝提前开启，并宣告血系魔力全废、新增两力侍与一真魂侍。
  - name: 第五百二十七章 动植双修{中}
    notes: 刘震撼说明两位力侍只能近战肉搏、真魂侍能帮他施展精神系魔法；暗夜守望者异能进化出蛛丝系魔法，花系魔法也得到基础魔力咒语可正式开宗立派；幕僚长罗比汇报基头座龙达六十四头、幻兽空军组建与镜炮炼金进展。
  - name: 第五百二十八章 动植双修{下}
    notes: 刘震撼召集所有低于萨满头衔的祭祀，借鹦鹉学舌螺让风语祭祀获得大维安级别基础歌力；他领悟通灵之歌第三阕，能用乐器奏出命令光环并召唤植宠，提出祭祀要动植双修；卡卡传讯桑日大陆遇袭求援。
  - name: 第五百二十九章 火焰魔法的大拿{上}
    notes: 桑日大陆雨中，壹条用浓缩酒精、喷水器与冻顶乌龙逼八歧巨蛇出洞；卡尼吉亚回忆自己释放史前魔兽后被打掉两阶修为、由飓风八歧退化为普通八歧；三位唐藏僧侣与一匹鳞甲白马现身，小空一棒打在壹条脑门上。
  - name: 第五百三十章 火焰魔法的大拿{中}
    notes: 壹条施展碧螺春火隔开漫天火雨，与三位唐藏僧侣和鳞甲白马照面；小空以焱系法术与壹条对拼，变身博浪沙火鹤，暴露水火风三系豁免之力；刘震撼率大队人马自魔法传送阵赶到，卡尼吉亚只剩逃跑的念头。
  - name: 第五百三十一章 火焰魔法的大拿（下）
    notes: 刘震撼认出英俊僧侣正是墨晶峡谷救出的唐藏亲王，亲王却把他当成修成金刚琉璃身的大德僧侣，欲行跪拜之礼；卡尼吉亚被两头魔兽堵住去路乖乖落地；小空以精金长棍缠斗，亲王急呼住手。
  - name: 第五百三十二章 风潜火匿{上}
    notes: 小空以纯精金长棍与刘震撼徒手对拼，老刘揪发将其按倒，壹条施展倒挂旗枪被老刘一把拧住刀尖拦下；亲王改用爱琴通用语盘问，老刘自称李察、小猪崽喀秋莎的养父，亲王方知打了恩人。
  - name: 第五百三十三章 风潜火匿{中}
    notes: 刘震撼以佛巨人羯语冒充渊博，答应为亲王开无遮大会讲笥葭奥义，实则想借唐藏国王亲弟弟之力对付黎山门；卡卡道出是自己用大变相毒气把小空变成帅哥；亲王自报名号玄奥的壮汉，并交代两位学徒的名号。
  - name: 第五百三十四章 风潜火匿{下}
    notes: 卡尼吉亚吐出鹅黄色风潜珍珠并交代其出自芭蕉树、能吸纳飓风；唐藏亲王提及丝绸大陆那枚能吸纳地火的火匿珍珠及其智者主人销毁它的往事；老刘打算用地底罡风天堑配合珍珠，小空自称花将。
  - name: 第五百三十五章 报与桃花一处开{上}
    notes: 小空跪拜称刘震撼为父王，唐藏亲王解释花王、花后与花将三位一体共生，蕴含无法背叛的伦理关系；金蕊即帝女花，小空是天生金枝玉叶；艾莉婕被点破花后身份，众人目光一片暧昧。
  - name: 第五百三十六章 报与桃花一处开{中}
    notes: 刘震撼把艾莉婕推出来认下花后名分，并接受缘分认小空为九郎；佛巨人明姚当众指出刘震撼与艾莉婕有夫妻之实，凭姬丝凯碧能看穿人心；小空依次拜见母后、三位母妃与叔叔壹条，并请教花衔奥秘。
  - name: 第五百三十七章 报与桃花一处开{下}
    notes: 唐藏亲王讲述唐藏名山中的花廷，前身是门派怡花宫，壹条当年被怡花宫领头围攻、靠父亲相救；四大花仙与玉系神恩眷顾者玉皇是其后盾；小空是控金又品玉的双系神恩眷顾者，凭控金术挥动十万八千磅精金棍。
  - name: 第五百三十八章 满城尽带黄金甲
    notes: 艾薇尔设想用九郎的控金术搬起地底直布罗陀河底的精金山砸敌；小空说明控金受空间面积与掌心半寸限制、原始形态决定能力；他说能点化三千花之国士，赐矢车箭技与大丽膂力，需细金装备方能成就金相玉质。
  - name: 第五百四十章 寥廓江天万里霜
    notes: 壹条透露怡花宫靠至宝财神玉盂发家，一枚金币加水就能变成满盂金币，老刘怀疑那是矿物智慧生命的科学结晶，动了夺宝之心；海伦邀三位僧侣赴翡冷翠；艾莉婕犹豫收八歧巨蛇为魔宠，刘震撼要为众人表演制造绝世戒灵。
  - name: 第五百四十一章 高处不胜寒{上}
    notes: 革瑞恩与吉安娜吞噬魔族菁英、两位恐惧魔王和四翼骑士后连升一阶，革瑞恩成为能幻化人形、掌控水晶宫领域的潮汐大公爵；时空大裂缝全开使爱琴与魔界成为同一片空间；刘震撼决定让两头亡灵回海中骚扰海族后方。
  - name: 第五百四十二章 高处不胜寒{下}
    notes: 壹条向刘震撼解释丝绸大陆的渡厄与白日飞升，断言抗过九道闪电的圣上上之阶法师其实是被血系终极护盾推向宇宙活活饿死；艾莉婕判定刘震撼的护盾会排斥地心引力，刘震撼决定不开启护盾，并继续让果果汲取血系魔力。
  - name: 第五百四十三章 大雨落幽燕
    notes: 崔蓓茜醉饮茱萸汁，回想自己为救凯文私许贝贝托并辞去东北大维安一职；教宗布拉特要她拿掉腹中孩子换取齐位名份，她只能靠骨联宝盒向海伦求救；玄奥的壮汉殿下折服于佛巨人的十种祷言。
  - name: 第五百四十四章 假逢真时真亦假{上}
    notes: 威瑟斯庞斗兽场上，海加尔之星以比蒙各族失传武技赤手空拳一招击败彼尔熊人与沃尔夫角斗士；教宗布拉特亲临观战，翡冷翠夏宫卫队乘飞行巨兽降临，刘震撼相貌已变。
  - name: 第五百四十五章 假逢真时真亦假{中}
    notes: 刘震撼登上主看台，认出与自己相貌雷同的海加尔之星使的是鲮鲤族铁甲术；他质问新任福克斯总督为何把魔法传送阵装在总督府而非神庙，并向教宗布拉特赠送翡翠黄金三重冕。
  - name: 第五百四十六章 假逢真时真亦假{下}
    notes: 教宗布拉特以法典条文对冲为由逼崔蓓茜改嫁贝贝托，贝贝托拒收翡冷翠的贿赂；刘震撼当众宣称与崔蓓茜早有白头之约、孩子是自己的，愿接受决斗；崔蓓茜放弃祭祀身份随他回翡冷翠。
  - name: 第五百四十七章 比蒙武典的化身{上}
    notes: 海加尔之星自称是刘震撼与仙女龙若尔娜来自未来世界的次子，在海加尔圣山获奇遇学全比蒙失传武技；他当场演示木属性羽萝斗气与单手四级指芒，威力堪比高级魔法。
  - name: 第五百四十八章 比蒙武典的化身{下}
    notes: 海加尔之星自述借瀑布天然六芒星阵穿越时空，依磁铁矿上的自然投影苦修百余年学全武技；他自称刘震撼未来有四十七子十三女，刘震撼认其为十郎，却暗定待兰帕德学会指芒后除掉他。
  - name: 第五百四十九章 矢车冲阵{上}
    notes: 刘震撼把醉酒的崔蓓茜送到猛犸故居千雪之幢醒酒，由此想到用伏波珍珠固定雪山沸泉与寒泉的温度对付魔族；海华丝颁封花官，艾莉婕从鸳弗瑞蝴蝶比蒙中挑出八十八位人选。
  - name: 第五百五十章 矢车冲阵{中}
    notes: 两大人类帝国的宫廷大师斯蒂法诺与艾玛尔争相索要魔法坐标，只为加入翡冷翠炼金实验室分享五五分成；刘震撼命人用年青祭祀试验自杀卷轴，并安排九郎点化三千花之国士。
  - name: 第五百五十一章 矢车冲阵{下}
    notes: 艾莉婕把余下的矢车箭手名额分给豪斯族河马诗人与道格族獒人，配夸克多水银弦战弓；奥尼尔当场试射一箭双发，被内德维德评为花哨有余战力不足；小空说明矢车花士分殿帅五弓、旅帅四弓、花士三弓。
  - name: 第五百五十二章 以母之名{上}
    notes: 艾莉婕安排卡卡回十万大山招募杜宾人枪咏冲锋队；西尔芙说明她当日是出嫁才穿大红、驾梦魇大车，因刘震撼精神力过强被一并带入；贞德始终盯着刘震撼浑身发抖。
  - name: 第五百五十三章 以母之名{下}
    notes: 真魂侍与巫师裸女咒的形象都是贞德死于难产的母亲，普斯卡什大师以此留下心结；刘震撼因此无法用该咒帮珊瑚美人谭雅解除石化；两大人类帝国派亲王送来胡克火控小组与白银基座战甲原版图纸。
  - name: 第五百五十四章 战争已经来临
    notes: 翡冷翠收下两大人类帝国的厚礼，皇冠荆棘战甲将升级为第四代；入夜国王萨尔带血渍赶回，单独告知刘震撼战争已经打响，时空大裂缝提前开启三小时内大量魔族涌入爱琴，但都不是正规军。
  - name: 第五百五十五章 十万死士
    notes: 萨尔引荐穆里尼奥之父布吕克纳老公爵，老公爵讲述美杜莎一族两千年前已迁往波拿巴大陆；刘震撼自认魔翼天王；国王宣布比蒙灭族概率高达百分之九十九点九，已派十万沃尔夫骑兵入魔界执行必死狙击任务。
  - name: 第五百五十六章 割乳令
    notes: 萨尔宣布将在王城发布海廷加动员令即割乳令，要十支主战种族的成年妇女割去右乳参战，刘震撼与布吕克纳老公爵激烈反对；萨尔许诺若能尽快把海族拖进战争泥潭便暂缓发布。
  - name: 第五百五十七章 与时间赛跑{上}
    notes: 安度兰老爹质问刘震撼带回的魔族女子，萨尔训他看人不应带个人好恶，布吕克纳老公爵附议；老刘讨要一个半联队豪斯箭手，获赐比加之海联队与沙漠之战残部共一千五百人及四百万金币，并献上通灵战歌第三阕。
  - name: 第五百五十八章 与时间赛跑{中}
    notes: 比蒙王都与二十一个人类国度会谈敲定军援计划，由三大人类军事强国统筹；众人揭示魔族禁咒亡灵天灾须巫妖王持咒，魔族全族仅三位巫妖王，翡冷翠以吸香红豆锁死瘟疫传播，人类提议递交战书逼海族参战。
  - name: 第五百五十九章 与时间赛跑{下}
    notes: 刘震撼重组空中部队并赐名斯图卡幻兽骑士团，班尼路武士菲高出任兰帕德副手；夏宫仆射团扩至两千九百三十三人，内德维德任百人留守仆射团团长；骷髅重装步兵团与婴儿重装骑士团、盖世魔法太保团一并亮相。
  - name: 第五百六十章 仍旧与时间赛跑{上}
    notes: 刘震撼暗令安瑞达须被安排在最前线，贝克汉姆的魔法太保团扩至六百四十三人；祭祀团选定澈桑大陆的引力脉冲香橼树为植宠，克鲁伊夫长老反对烧树逼服，香橼树先拒后突然集体同意，长老疑与十太子文泰克莱尔有关。
  - name: 第五百六十一章 仍旧与时间赛跑{中}
    notes: 克鲁伊夫长老提醒刘震撼提防十太子文泰克莱尔；祭祀们折损魔宠后统一换上基头座龙，豪斯祭祀的座龙将变身为龙人射手；巴比伦炮兵由三百三十四位长老操控六门巨炮，文泰克莱尔被留入警卫旗队监视。
  - name: 第五百六十二章 仍旧与时间赛跑{下}
    notes: 圣荷西帝国也挤进翡冷翠参与五五炼金分成，三大人类国度的炼金师却各专攻一项；刘震撼识破圣荷西只造光之乞愿塔半成品、回国嵌上月石即可开火的算计，又由对手密告得知黑索银破击炮与海菲冰的存在。
  - name: 第五百六十三章 长缨在手
    notes: 野矮人以安特炼金模式分工协作，最终炼出六千七百七十枝杜蕾丝爆裂箭；壹条飞回丝绸大陆，距七宝塔仅一天一夜路程；刘震撼获爱琴魔法师工会承认为圣霄魔法师，五位人类大魔导师上门祝贺并解开大小s血侍的疑团。
  - name: 第五百六十四章 何时缚得苍龙
    notes: 五位人类大魔导师应邀观礼广寒月影仪式，孔雀美人与海华丝被转为夏宫专职圣女；艾莉婕着旗袍登场，刘震撼与祭祀们一身清朝官服；两人在月石法阵铜镜前昭告英雄归来，号召爱琴人前来多瑙荒原迎战入侵者。
  - name: 第五百六十五章 新任龙领领主
    notes: 龙城贵宾驾临翡冷翠，远古巨龙温格现身并赠十太子文泰克莱尔一块仙道樟魔芯；彩虹龙城城主阿加西与辰星龙城城主波姬小丝颁封刘震撼为爱琴新任龙领领主，授奥喀理拉魔法水银徽章，众人方知所谓龙领即幻兽座龙。
  - name: 第五百六十六章 箭在弦上
    notes: 众人惊觉龙领领主头衔意味着幻兽座龙被承认为巨龙谱系，双头黄金巨龙哈塞尔巴因克直言反对；刘震撼索得一百五十万金币，才明白龙城是把他和座龙拉上对抗魔龙的战车；温格答应随他远行荷露城救援白素青。
  - name: 第五百六十七章 成功人士的烦恼
    notes: 刘震撼为玄奥的壮汉殿下既是唐藏亲王又是苦行僧侣而烦恼，怕在荷露城动武伤了亲戚情面；温格与伊布夫妇道出龙族禁足戒律与魔界魔龙噬龙的秘密；他率军抵达荷露城，在梵宇中与亲王谈七宝塔与黎山门旧怨。
  - name: 第五百六十八章 技术换外交
    notes: 唐藏亲王早猜到永夜的极光身份，说明神兽在丝绸大陆是登记在册的合法居民并劝刘震撼慈悲为怀；一条在旧怨与白素青师门之间犹豫，刘震撼替他决定铲平黎山门，又提出以军械制造技术合作换取那枚玉佩信符。
  - name: 第五百六十九章 莫猖狂
    notes: 黎山门庄园建于藕塘中央，唐藏将军调大黄床架弩封锁路口并一再拖延，刘震撼抽圣甲虫跳弩示威；羚牛武士的虹膜之眼可夜视，崔蓓茜却指出美杜莎是冷血生物，热源感应捕捉不到，五百名幻兽矢车箭手挡不住其跳水逃跑。
  - name: 第五百七十章 牛刀宰鸡
    notes: 黎山门城楼灯火通明并放出照明烟花，秃头壮汉以油釜床弩威慑，小空喊话被骂娘娘腔小子；夏宫仆射射断吊桥铁链，百多位祭祀的战歌光环刷新全军，航空兵与镜炮覆盖城墙，内德维德以心灵指引箭连穿数人，壹条辣手无情。
  - name: 第五百七十一章 主力蒸发
    notes: 黎山门的大型护盾结界被黄金矮人法师集群击溃，百余名神兽踩武器升空却抗打击力奇差；温格以龙语大召唤术唤出六头元素龙，安瑞达化作黑烟巨兽；壹条痛殴赤火毒龟法江，门主黎山老母与三四百名神兽不见踪影。
  - name: 第五百七十二章 炼药，炼金
    notes: 九太子小空向爱琴诸强介绍丝绸大陆的云系法术与制药技术，丹药可疗伤、增长法力，罕见灵草丹药更能无害提升一阶修为并延年益寿，令五位大魔导师争相求购；壹条提着奄奄一息的毒火赤龟法江得意返回。
  - name: 第五百七十三章 东方防御体系
    notes: 壹条踩住法江，五位人类大魔寻师为他打上锢魔烙印。小空揭穿黎山门护盾实为唐藏皇室独有、一城仅配一套的军用机密「五行防御大阵」。法江以勾结外人残害同胞相威胁，终被废去四肢双眼并取出毒火龟珠。
  - name: 第五百七十四章 第二次握手{上}
    notes: 唐藏军队接手拆卸「五行防御大阵」剩下四个部件，小空讲明此阵需堪典罗盘师重布为四象、三才、两仪防御大阵。刘震撼赶往七宝塔营救青雅白玉，壹条被小空抱住，众人方知塔底地宫是云秦方士留下的禁锢法阵。
  - name: 第五百七十五章 第二次握手{下}
    notes: 老板娘们进地宫救人却久无回音，小空指认地宫是「九宫数独阵」，连声音与瞬移都被圈禁。四位云秦后裔方士坦言只会七星以下阵法，破阵须靠福格森徐随蓬莱号送走的秘密笔记。刘震撼决意用战斧砍开全铜宝塔。
  - name: 第五百七十六章 柔能克刚{上}
    notes: 五百名灰矮人铁匠自翡冷翠赶来，掘坑砸基，露出厚达十一米三二的全铜塔基，温格算出七彩龙也难穿透。刘震撼凭金刚伏魔之身与霸下龙力，叠上自主狂化与月圆二度狂化劈砍铜墙，肥罗备下十四把精金镀层战刀。
  - name: 第五百七十七章 柔能克刚{下}
    notes: 刘震撼改用雪铁龙战剑剜绞，打通铜墙后游进梨形地宫，水底尽是书儒潘塔熊猫武士与金发人类武士的湿尸和兵器。衣不蔽体的青雅白玉用「截血」将他定成木桩，再夺剑抹向他脖颈，被壹条一声喊住。
  - name: 第五百七十八章 丝绸秘技
    notes: 壹条与白素青重逢相拥，青雅屡试才解开老刘的「截血」。壹条讲明截血指针对随时流动的血头，能作用于任何有血液的生物，却只能令人身体僵硬。青雅本是黎山门第一年青高手，伏波珍珠是那位神秘流浪前辈所赠。
  - name: 第五百七十九章 夺宝奇兵
    notes: 潘帅报唐藏上万大军围住七宝塔，内德维德射箭划界。黑髯将军接管地宫后发现宝藏已被夏宫搬空，限一柱香内缴械交宝。金色「万里飞云」载唐藏皇家禁卫「执金吾」与亲王「每月第一天的霸占」降临。
  - name: 第五百八十章 武士心 志在止戈
    notes: 五殿下自称唐藏第一大力士，刘震撼用六尊机械高岑与镭射镜炮烧死黑髯将军的坐骑立威。他提出以一百根战歌图腾柱换一部「五行防御大阵」与一部「万里飞云」，五殿下答应上报并索回一半宝藏，随后仍提出切磋。
  - name: 第五百八十一章 丝绸神羿
    notes: 唐藏五殿下派第一神羿手「云秦时代的穷困」比箭术，众人惊于人类箭手敢挑战豪斯。神羿手蒙眼盲射，在「秦王破阵大曲」军乐中射出回风拂柳箭、情人箭、流星蝴蝶箭、雷动九天箭与九阳箭，用普通弓箭造出魔法般的杀伤。
  - name: 第五百八十二章 一箭光寒十九州
    notes: 内德维德与唐藏神羿手按惯例「射住阵脚」决斗，一箭先发制人取胜，两人赛后相拥。他接连表演花式箭法、近身箭法与各类弩具。五殿下请派箭手赴唐藏任教官，刘震撼答应后追问对方所用斗气。
  - name: 第五百八十三章 斗气双极
    notes: 小鹦鹉调侃白素青与费雯丽容貌酷似，羞得崔蓓茜当场跑开。五殿下证实神羿手用的是罡气，箭罡为木系介质类斗气「树欲静而风不止」，另有金介气即驭剑。文泰克莱尔被勾起兴致，主动约战唐藏剑神「三世同堂」。
  - name: 第五百八十四章 铁血狂化
    notes: 双方主君各以方言与传音入密叮嘱「尽快解决，尽量和局」。两位剑手先以剑技试探，继以剑芒对十米金色剑罡，女剑神更使出「以身化剑」，文泰克莱尔终以「铁血狂化」劈出血红半月刃将其击散。
  - name: 第五百八十五章 比蒙千古第一武状元
    notes: 刘震撼对雪藏「铁血狂化」的文泰克莱尔一度动杀心，终因惜才作罢。文泰克莱尔讲出匹格勇士「亥」被兽人王关入「虿笼」与冰原巨虎同笼，以眼角鲜血打晕巨虎后不肯受辱自掐脖颈而死，坦言正是这旧事让他悟出铁血狂化。
  - name: 第五百八十六章 赶鸭子上架
    notes: 玄奥的壮汉殿下以「婆夷恶魔」称呼刘震撼，与五殿下重逢并赠以麋人书儒的「香雪稻」。刘震撼交代夏宫靠魔法定律师测出结界盲点、以镭射宝石标注红外座标攻破「五行防御大阵」，五位鼎湖仙师演示琴棋书画酒五系法术。
  - name: 第五百八十七章 孤篇盖全唐
    notes: 五殿下选定先魔法后战歌。刘震撼用普斯卡什独创的「英捷尔法勒」把七八百名唐藏大汉尽数隆胸，辩称可影响格斗与士气，放气须拿中空狗尾巴草搓入。他随后释放狂化光环，回头却见壮汉们神智清醒、脚下多出莲花投影。
  - name: 第五百八十八章 友邦惊诧
    notes: 萨尔陛下从骨联宝盒中怒吼，质问刘震撼是否打算叛国，并因八百七十六名唐藏武士被永久加持冷静狂化而气到昏厥。刘震撼顺势把这份礼物送给唐藏，并提出以租界形式租回海加尔圣山。
  - name: 第五百八十九章 加菲不在家
    notes: 壹条与白素青伫立云雾山花廷总坛之前。他奉老板密令执行「加菲不在家」，用金钢魔法传送阵把夏宫卫队与外援尽数拉来。幕僚长罗比以帝维播放滹夜古城战役做战前动员。
  - name: 第五百九十章 难以掌握的爱情
    notes: 两只博浪沙火鹤在火焰免疫的壹条手中只走一招便败，花廷四大守山神兽被神箭哲琴的湮甲箭射杀，全廷仅有两只火鹤突围。白素青目睹血腥后质疑壹条冷血，两人为强盗逻辑与立场争执不休。
  - name: 第五百九十一章 战争的脉搏
    notes: 桑干河涌来海族驱赶的鱼潮，萨尔陛下判断海族即将动手，并追问永久加持的真相，刘震撼只得承认并无把握。两人分析铁血狂化与潘塔狂化的利弊、双子座骠骑与反刍种族的优势，陛下更交出王族附庸加菲猫人的异能。
  - name: 第五百九十二章 一个耍流氓的借口
    notes: 刘震撼返木兰城之前完成两项布局：成立作战实验室，以萨鲁曼巫师之眼与魔法沙盘监控多瑙大荒原；把两大戒灵遣返西雅大洋。抵达木兰城后得知风尘四花只剩两位，便在街头以金百合花瓣慑服花娼紫色霞云。
  - name: 第五百九十三章 拒绝不了的诱惑
    notes: 紫色霞云领路，老刘带家眷登上云雾山北城花廷英雄大擂，与玉皇及四大花仙针锋相对。合欢主人的天然魅惑牵住九太子，老刘以素帝身份册封五朵金花，再用五颗绝世珍珠和云秦金人斋殆扳指豪赌玉钟乳与财神玉盂。
  - name: 第五百九十四章 晴天霹雳
    notes: 火符飞入花廷五大高层手中，玉皇丢下风尘四花赶回木兰城取财神玉盂。老刘用斋殆扳指与七度金戒指堵住五殿下的贪念，再向安瑞达、阿仙奴与文泰克莱尔摊牌，十太子自报洛拿特谢兰冰之名。
  - name: 第五百九十五章 乱世浮生绘
    notes: 卡卡带三百名莫科纳萨尔武士与父亲里瓦尔多公爵归来。里瓦尔多解释亡灵与物质生命阴阳调和可诞下后代，揭出雷克萨就是战神化身；老刘点破萨尔送十万沃尔夫入魔界的一石二鸟，随后又接到堕落精灵战书。
  - name: 第五百九十六章 暴风雨前最后一丝宁静
    notes: 博德族分裂令夏宫卫队少壮派请战，老刘不信教宗布拉特的撺掇，致电萨尔问明底细。萨尔坦言斯迈只想恢复往日地位，仍会协防禁空之歌。战利品是海量丝绸丹药，兰帕德得玉钟乳修成指芒，壹条与青雅成婚。
  - name: 第五百九十七章 绝路
    notes: 老刘独自赴魔界，三万余沃尔夫骑兵在圣盔大平原被围，五位将军宁死不退。兰帕德与九太子侦察后报，魔族围三阙一，要把狼骑兵逼入毒蔼之海。老刘令全军退往雾海，召邓肯携霸下龙珠驱散浓雾，另雇魔界海族设避雾结界。
  - name: 第五百九十八章 牵一发
    notes: 滴血十字骑士瓦尔德内尔清点五十名恐惧骑士的尸首，幼子波尔也死在东方三尖两刃刀下。六翼天王斯托克顿命他率一万五千人封锁雾霭之洋。老刘与纳斯达克雷东多做成交易，用安尔乐徽章法阵图换四千奥术师与三万瑙白金。
  - name: 第五百九十九章 魔族秘密武器：纷舞妖姬
    notes: 魔族一万五千阻击兵团在圣盔大平原拦截三万沃尔夫狼骑残旅。狼骑以集体抽刀急停震住对手，刘震撼借隔雾通道从背后偷袭，魔族双核武器纷舞妖姬发威，超声波在阵中剃出一条人肉弄堂。
  - name: 第六百章 能量武器的春天
    notes: 海龙王雷东多被无形无色无音的超声波震懵，刘震撼认出那是华伦泊尔蝙蝠人的种族异能超声波伪像，断定魔族裸女轮盘是护盾加能量攻击的双核武器，当即传令小贝留活口，瓦尔德内尔被迫投入死亡骑士预备队。
  - name: 第六百零一章 互观底牌
    notes: 刘震撼命小贝压住魔族奥术师却不逼死他们，以便研究这支正规部队的战法。夏宫航空兵与尚书仆射团以箭雨歼灭两千余魔族空军，五台绞肉机战车被月石镜炮光环穿透水晶车身，车内乘员尽数灼成焦碳。
  - name: 第六百零二章 刀尖上的舞蹈家
    notes: 内德维德射杀黑曜石毁灭者，上百位神箭哲琴以第六感预判联手射杀八位黑曜毁灭者，倒地的裸女轮盘以超声波在五百码直线内开出巨大壕沟。卡卡率三百名莫科纳萨尔杜宾武士以魔法枪咏近身屠灭魔族奥术师本阵。
  - name: 第六百零三章 陷阱？机遇？
    notes: 慕兰美帅隆美尔到访翡冷翠，向凝玉与安度兰长老提出以四大纯血杜伊嘉尔之一的盾斧矮人换取红土高坡。凝玉反提以剃刀山雪梨城交换，隆美尔因天鹅族采玉城毗邻而拒绝，只说明日再来、五天后开战。
  - name: 第六百零四章 扑朔迷离
    notes: 刘震撼凯旋回到翡冷翠，魔族主力停步未追，三万狼骑经隔雾通道撤入海岛。众人研判隆美尔的图谋，刘震撼想起缴获的慕兰爱琴地图上翡冷翠被标为战略要点、落款正是隆美尔，黛丝判定这是鲜花盛开的陷阱。
  - name: 第六百零五章 国王陛下的战略布局
    notes: 萨尔陛下向刘震撼讲明红土高坡的战略地位，它是桑干河九个渡口中最优质的一个，魔族无七度金戒指也无水军，欲攻北岸王城必经此地。国王答应调拨双子骠骑与海归勇士，刘震撼坦言换地只是空手套白狼。
  - name: 第六百零六章 冥界入侵
    notes: 隆美尔第二次来访共进午餐，自陈想脱离堕落精灵单干，愿演一出毁约戏把盾斧矮人送来。他随后揭露冥族大军将入侵，七十万冥族已借马龙水晶传送阵潜入南十字星森林。刘震撼决定联络龙族，趁白天以空军突袭。
  - name: 第六百零七章 寂寞高手
    notes: 冥族入侵的消息传开，爱琴各方破天荒联手备战；刘震撼拒绝放弃红土高坡，以利润分成换来唐藏五殿下与五位鼎湖仙师助战。盾斧矮人一百二十七人归顺并献上泰坦巡游战舰图纸，壹条透露青雅的师傅是佛巨人。
  - name: 第六百零八章 再一次 有其父必有其子
    notes: 刘震撼会晤佛巨人追问族中武技，明姚承认族内有一百零八种武技，截血指能瞬间僵化有血肉的生物；佛巨人以教义为由只肯对付亡灵。萨尔国王带来照夜玉狮子与的卢两位归国射手。
  - name: 第六百零九章 森林之怒
    notes: 爱琴历一百四十一年七月四日清晨，冥族躲进盆谷避光，耐温尔因克受脑痛之苦，哈格里夫斯借卓尔主母之手献上血腥玛莉。刘震撼率两路大军突袭，克鲁伊夫长老发动森林之怒，古树根须把冥族绞杀埋葬。
  - name: 第六百一十章 上阵父子兵
    notes: 刘震撼重提地底黑龙墓地那一斧的旧仇；幻兽座龙因吨位沉重和年轻祭祀心绪不稳失利，被命令落地清剿地面冥兽。瑞博克黑暗公爵用终极僵尸秘术把年青七彩龙变成僵尸，最终被刘震撼父子围杀。
  - name: 第六百一十一章 双火
    notes: 父子三人接连放倒地狱潜行者、萎缩眼魔大君与百足恶蛆领主；小空一气化三清贯杀哈迪斯三头冥狼，又释放火系第四进阶上位魔法燚火烧死至少七百头阿迪达斯玛。壹条领悟铁观音丹青之火，把两头脑狩魔拓印成黑白肖像。
  - name: 第六百一十二章 三雄会首
    notes: 场景转到魔界曙光龙城，魔龙皇帝卓别林与亲王李察·基尔争论把偷袭爱琴龙城的任务交给年轻皇太子一事。温格与耐温尔因克对决落败，以引导之歌唤来堡狮龙，自身冻成空心冰雕战死。耐温尔因克邀老刘单挑被拒。
  - name: 第六百一十三章 天灾还是人祸
    notes: 多瑙大荒原上，兰帕德、贝克汉姆与内德维德列阵待命；萨尔国王主张不出手，让逃出森林的冥兽受日光惩罚与饥饿折磨并自相残杀。魔界二十万先遣军在斯托克顿与瓦尔德内尔率领下进占佛罗仑多盐碱地。
  - name: 第六百一十四章 极道强者大派对
    notes: 魔龙、爱琴巨龙与冥族三方混战；耐温尔因克扭断虬角施展究级角斗术，左角把场面跨时空传给冥界两位哥哥，右角带二十四种负面属性。魔龙二太子穆图与未婚妻夏尔芬被它一叉串死，阿兰德隆放出裁决之刃重创它。
  - name: 第六百一十五章 血系魔法--深红枷锁领域!
    notes: 魔族菁英军团抵达后三方僵持，堡狮龙兰若诗质问魔龙为何背弃亥伯光环、与爱琴巨龙自相残杀；刘震撼当众以李察的身份向斯托克顿打招呼。耐温尔因克借道被拒，以二重奏吟唱释放深红枷锁领域，抽取有血生物的血液。
  - name: 第六百一十六章 代号火狐
    notes: 白头猎鹰为伊夫堡西多夫元帅送来血书，魔族二十万先遣军逼近佛罗仑多盐碱地森林，斯蒂法诺率法师赴南十字星森林。幕僚长瓦尔德内尔联系不上六翼天王，隆美尔以火狐代号乘银象携四头巨龙现身，自称要面呈机密。
  - name: 第六百一十七章 LOS
    notes: 时空大裂缝第三次开启，骷髅暴君、瓢甲虫法老与祖玛冥龙等超阶冥兽涌出，冥界第二大统领瑞卡顿雅布持冥神骨朵登场，耐温尔因克以碧血献祭苦撑。本土魔兽随商羊菲琳和小鹦鹉参战，空间倒置领域随即降下。
  - name: 第六百一十八章 领域大战
    notes: 夏宫卫队远观战局，黛丝点明瑞卡顿雅布的独眼是能分辨敌我的阿赖耶识之眼。炎龙壁障、美年达行云流水、苍白协奏、末日拂晓与美兰悲歌古曲等领域接连降下，贝克汉姆看出领域彼此抵消，瑞卡顿雅布随即锁定刘震撼。
  - name: 第六百一十九章 杀机暗伏
    notes: 刘震撼以罗侬撒歌剧辨位，召出龙虎力侍和影侍；暗影系魔法源自暗影突袭异能，可汲取灵魂晋升。他与瑞卡顿雅布互攻空间突破星球，果果、壹条靠黛丝遥控锁定方位，上位魔龙以百慕达副眼偷袭，魔导师召唤禁咒。
  - name: 第六百二十章 末日审判
    notes: 三位魔寻师以卷轴和龙晶召唤禁咒；刘震撼绞颈格杀掰下魔龙皇太子阿兰德隆的头颅，果果击杀魔龙公爵夫妇。两大巫妖王赶来释放黑洞领域与空间倾斜领域，三大禁咒被偏转射入时空大裂缝，三族高手几近全灭。
  - name: 第六百二十一章 神秘拓
    notes: 战后三方对峙，斯蒂法诺出示普斯卡什占卜拓印的图轴，预言刘震撼将成为魔界入侵爱琴的第一杀手并杀死普斯卡什与范巴斯滕。刘震撼因被人类当诱饵而心寒，放走人类法师，巫妖王与瑞卡顿雅布随即取出两件史诗神器。
  - name: 第六百二十二章 谁说祭祀不如法师
    notes: 萨弗拉斯权杖与湮灭镜轮来历揭晓，前者能永久魔阻实体化，后者令元素逆流引发噬爆。保罗纽曼戴幼童囟门皮手套冒充泰坦血脉，瑞卡顿雅布用镜轮把文托拉与里杰卡尔德化为碎片；耐温尔因克站起，萨尔率比蒙祭祀赶到。
  - name: 第六百二十三章 人不轻狂枉少年
    notes: 血河大统领耐温尔因克把湮灭镜轮当板砖砸兄长，被权曜之光加持成元素绝缘体；海伦以生命礼赞夺其契约。伊瓜因率银色黎明佣兵团驾水银幻兽现身，宣称神恩眷顾者将取代魔法。
  - name: 第六百二十四章 炮打司令部
    notes: 罗比尼奥以自然勾漏手造出石笋木桩风柱三重牢狱，银色黎明八人各展异能围攻冥魔二族，操控牢笼的盗贼被三合穿心轮斩杀。三名豪斯族神箭以秘银黑索银炮弹轰出黑色蕈云，刘震撼宣告能量武器时代到来。
  - name: 第六百二十五章 悲喜两重天
    notes: 半岛铁盒冒险团在凡贡森林寻到上古地精商店遗址，取得丹雪与魔力药水配方后遭淤泥怪可汗召唤四大战斗单位灭团。安度兰长老告知龙城巨龙与黛丝父母阵亡、玉盂被压碎，还查出六十七只霜雪皮丘进入深度冥想。
  - name: 第六百二十六章 失望的战利品
    notes: 大战落幕清点损失，翡冷翠折损过半幻兽座龙与六十二头巨龙，冥族骸河大统领阵亡、血河大统领被俘，魔族全军覆没。冥兽尸体在烈日下腐化成脓水无法利用；刘震撼拒答黑索银之秘，贝克汉姆与奥特加出走。
  - name: 第六百二十七章 神圣巨龙留给爱琴的遗产
    notes: 嘉宝女王在魔界皇宫宴请隆美尔，后者给魔族战略计划打八十分并剖析比蒙城邦制与两大天险，随后惊闻先遣别动队与两大巫妖王全军覆没。丽人鱼皇子献上神圣巨龙蛋，道出神圣巨龙被封印及碧落之黄泉受孕往事。
  - name: 第六百二十八章 海族螺号吹响
    notes: 刘震撼自时空大裂缝返回后变得冷厉，同意以马龙水晶换瑙白金、神圣巨龙蛋与无水结界，被安度兰长老斥为养虎为患。他三度利用六翼天王斯托克顿，把龙蛋赠龙城遭拒后交果果孵血婴；马特拉齐携独腿凤凰菲琳归家。
  - name: 第六百二十九章 神殿骑士团
    notes: 海族一夜抹平圣勒罗索与圣安东尼奥两公国、连破圣荷西帝国两郡，三天后联合幕兰军团登陆比蒙北部海岸线。刘震撼率夏宫卫队进驻威瑟斯庞，与教宗布拉特的神殿骑士团会师，两派宗教武装暗中较劲。
  - name: 第六百三十章 请君入瓮
    notes: 海慕联军十万慕兰骆驼骑兵前锋抵达威瑟斯庞，雷耶斯主张坚守不出，红衣大祭司布拉特力主出战。刘震撼否决旷野迎战，把洞开城门设为香饵布下请君入瓮之计，两台水晶绞肉机战车与机械高岑共组三道防线堵在城门处。
  - name: 第六百三十一章 蓬门今始为君开
    notes: 慕兰前锋主帅赛义德，卡斯不敢轻进，帕夏胡迈德，法克赫尔请战并劈杀奴隶。刘震撼把两台绞肉机战车垒到道路一侧，羚牛重装步兵出城以图腾柱横扫慕兰斥候，又亲自跃起劈断吊桥铁索并枭首示威。
  - name: 第六百三十二章 横扫千军
    notes: 羚牛武士在荒原摆出双层线型战阵，以铁血狂化血色镰刃横扫慕兰斥候驼队，海伦与茉儿联手放出吸血光环与迟钝光环。慕兰骑兵溃散后，刘震撼在吊桥外撕开亚麻布亮出航用六管重机枪。
  - name: 第六百三十三章 老壁虎的秘密
    notes: 刘震撼用航用六管重机枪连发奥骨斯都法杖法术，扫退慕兰骑兵与幻兽骑士，翡冷翠炼金师讥其为玩具。萨尔国王赶来斥其胡闹又赞其用绝对暴力挫敌士气的指挥风格；老壁虎发现羚牛武士装备伊斯西丁金属。
  - name: 第六百三十四章 觊觎神器
    notes: 十位大穹毯帕夏拔刀请战，麻葛大阿訇拉赫德，阿布杜拉赫曼判定六管机炮是爱琴神器并劝主帅抢夺。宴席上新角色特维斯与弗萝尔·美津浓登场，特维斯以固定飞翼箭技射穿旃旗桅杆；茉儿察觉慕兰人以光影幻术掩护偷袭。
  - name: 第六百三十五章 一个神器引发的血案
    notes: 慕兰人驱赶士兵填护城河、以木槌撞门，比蒙用沥青、板砖筐弹与毒龙航弹还击。飞驼近卫登城遭近身箭术与喷火器狙击；赛义德，卡斯见魔法太保、布尔琴魔与幻兽座龙现身，龙骑士与百名幻兽骑士被魔法洪流歼灭。
  - name: 第六百三十六章 光荣与梦想
    notes: 沙巴克望月塔楼上萨尔国王与天鹅族公爵观看帝维实况，看刘震撼向附庸族传授偷袭杀敌术。通讯官杜德尔汇报威瑟斯庞战果；国王列举李察引来海族、堕落精灵、慕兰、冥族与魔族的因果，称其既是英雄也是罪人。
  - name: 第六百三十七章 20万VS140万
    notes: 刘震撼以齐布林飞行器与幻兽空军追杀慕兰残兵六天，仅万余人逃回主力。海慕联军一百四十万抵达，西米里安王子与塞壬女侯爵卡米拉争执后决定强攻南墙；刘震撼单骑赴敌营挑衅，示众前锋十位帕夏首级后杀出重围。
  - name: 第六百三十八章 一个比一个更毒
    notes: 隆美尔带巫妖王嘉宝游历翡冷翠，分析海陆战局并建议魔族走采玉城雪山小道进攻北部荒原。萨尔国王在沙巴克以魔法传送阵为诱饵，用巨型爆破铁桶炸死海慕联军三百余名法师，阵亡者含珊瑚顶亲王保罗与塞壬女侯爵亚美蝶。
  - name: 第六百三十九章 战歌妙用
    notes: 安度兰长老发现六十七只深度冥想的霜雪皮丘生出魔纹，法师诞生率达百分之六点七，令猛虎佣兵团再捕并向桑干河投放冻鱼散播瘟疫。隆美尔携伪装成摩尔武士的嘉宝到访翡冷翠，请求借传送阵参战。
  - name: 第六百四十章 针尖对麦芒
    notes: 艾弗森戴艺人面罩伪装成鲸鱼武士菲高，骑车剑刃蜘蛛潜入海慕联军大营，在木工作坊布下六出梅花纵火阵，借热风回旋把大火引向敌军后勤基地。刘震撼调上战争古树与佛巨人、恩特守城，并向章鱼武士加持狂化光环。
  - name: 第六百四十一章 人海优势=落伍
    notes: 海伦因魔宠耐温尔因克中毒而瘫倒，夏宫卫士无一人分心。五行防御大阵被海慕法师团集射击溃后，城楼上的战歌图腾柱又令进入五百尺范围的九成魔法无声湮灭，法师团遭比蒙祭祀与太保反杀，奴隶射手崩溃。
  - name: 第六百四十二章 紧锣密鼓
    notes: 莱茵克尔亲王以密旨剥夺西米里安王子的指挥权，逼八万海慕联军无掩护波浪式攻城三小时，八名万人长仅海龟大将军杜舍尔生还。主帅决意动用艾薇尔铁塔，刘震撼则收到红十字法香水豚与水晶六首王蛇。
  - name: 第六百四十三章 损失惨重
    notes: 海慕联军打白旗拖回尸体检验，加布林磨炼师阿比亚蒂认定比蒙射手的精金箭无法二次熔炼。莱茵克尔亲王避开夏宫卫队改攻神殿骑士团，若尔娜与安瑞达带回红十字法香水豚和水晶六首王蛇，萨尔国王与安度兰长老送来捷报。
  - name: 第六百四十四章 底牌尽出
    notes: 巫妖女王嘉宝与隆美尔在云端观战。艾薇尔铁塔连放雷云电柱轰塌东侧城楼，红衣大祭司布拉特化为乌有，卡卡以灰色飞鹭之身吸走两道雷柱，穆里尼奥的涅槃之火焚尽海族，莱茵克尔下令撤兵。
  - name: 第六百四十五章 决战，提前上演
    notes: 莱茵克尔亲王自省海族既无空战能力也几乎不存在防空火力。刘震撼以星空之翼绕飞包抄铁塔，壹条当众插下战歌图腾柱封锁魔法，西米里安王子被果果打断腿、小瘌痢踏断双臂活捉。
  - name: 第六百四十六章 桑干河前浪推后浪
    notes: 比蒙发起总攻，八十四头重型幻兽踏破海慕方阵，全军炸营溃逃，莱茵克尔亲王被马蹄终结。刘震撼以影侍吞噬慕赭阿訇灵魂，穆里尼奥的致幻战歌使兽亲觉醒种族异能，萨尔国王为战死的九个爱子落泪。
  - name: 第六百四十七章 战争财富
    notes: 特维斯公开第四阕通灵之歌，野宠与终生守护骑士可扩大四到十倍并自带辉煌光环，貔貅帕瓦罗蒂登场。人类诸国争购战歌图腾柱与丝绸金丹，隆美尔以五万沙漠战士换联手追杀海慕联军。
  - name: 第六百四十八章 约定
    notes: 堤丰山谷清点战利品，凝玉颁下封口令；菲高指认敢死药丸即海槟榔的前身。巫妖女王嘉宝以皇极变身术假冒壹条混入领主大厅，骗大小s喝下惊寂之黄泉废掉两名元素精灵使，刘震撼凭乡音识破，与她订下赌约后放归魔界。
  - name: 第六百四十九章 尽歼侵略者
    notes: 安度兰斥责放走嘉宝，刘震撼辩称要诱魔族按既定步骤继续侵入爱琴。海族安尔乐离水法阵被自家溃兵冲垮，六十余万人死于自相践踏；隆美尔以围三阙一与幻术藤舟逼慕兰败兵火拼，萨尔国王擢升他为比蒙战役策划。
  - name: 第六百五十章 诡谲的使者
    notes: 人类军界盛赞比蒙的新战术与新兵种，条顿军事学院院长米哈伊洛维奇称重型幻兽为当之无愧的地面之王。美人鱼皇帝贝肯鲍尔与塞壬女王朝河兰拒绝两位珊瑚顶亲王的劝谏，改任塞壬第一名将玛莉亚，高树女公爵为统帅。
  - name: 第六百五十一章 娜迦，前来拜访！
    notes: 八月战局转入僵持，玛莉亚，高树女公爵派出的伐木队与斥候队被鬣狗群尽数歼灭，补给改走海路。海娜迦二十万大军三天内枭下荒原三大盗匪首级，直扑落日大沼泽的伦敦城；隆美尔从帝维实况中剖析出曲射电浆的法术组合。
  - name: 第六百五十二章 绣球战车
    notes: 卢塞恩实行摩尔与卓尔轮值城主制，幽月儿主母与香克利陛下索要地底世界、军械与粮秣。隆美尔以投名状与战略纵深力陈出兵的利害，终获十万地面部队与十万空军，主战场定在西南荒原的油丘；娜迦海狮石球战车首次亮相。
  - name: 第六百五十三章 海皇重弩
    notes: 娜迦石球战车碾碎卢塞恩战车与灰矮人，海澜战争古树的珍珠霰弹、竖琴战弓与巨鱿头顶的海皇重弩把卢塞恩空军压回高空。卓尔主母咆哮催战，隆美尔只得放出齐布林飞行器与摩尔猪脸蝙蝠骑士的炭精燃烧弹。
  - name: 第六百五十四章 崛起之路
    notes: 四位恩特投入战场，以琥珀脂浆把海狮石球战车风化成碧绿树脂化石。隆美尔公开硫磺气航弹原理：泰穆尔拉雅雪山的列奥尼达气矿配鱼鳔盛器、遇冷即成硫磺水；布吕克纳以唇典窃听，阻止卡恩亲王借魔界海族灌充毒雾航弹。
  - name: 第六百五十五章 特别战役
    notes: 双飞战阵两翼被海狮石球战车与海象骑兵打散，中路上千名堕落法师遭「群体默言术」集体哑火后被屠灭；布吕克纳劝隆美尔用预备队被顶回。隆美尔挂出总攻赤旗，鹰牛空军与地狱黑龙倾巢而出，二十万娜迦投降。
  - name: 第六百五十六章 无毒不丈夫
    notes: 隆美尔自陈故意葬送千名法师以动摇堕落精灵统治根基，好带五千特拉维夫狂战士脱离卢塞恩；他拒绝转让炭精提炼配方只肯代炼，并索要五万骆驼骑兵，又点破海慕联军必攻多洛特。附庸种族与娜迦军人转投斯迈族。
  - name: 第六百五十七章 意外发现
    notes: 战后分赃，翡冷翠夺得海澜古树、八足巨鱿与永恒月藻，莱茵剑士把绣球战车玩出任意球与盘带；刘震撼以魔法教官之职换娜迦团长波利斯传授双法合壁，又托卡恩把歌唱水晶转交穆里尼奥。卡卡说出杜宾的祭祀叫兽王。
  - name: 第六百五十八章 借兵
    notes: 阿尔卑斯湿地海族西征大营里，贝肯鲍尔与朝河兰为咸盐短缺和战略调整争执，又承认夏宫卫队全员列装精金羽箭、战歌图腾柱已被盟友找到克制之法。后半段刘震撼带两国特使参观熔岩山谷军工基地后开口借兵。
  - name: 第六百五十九章 千古谜团的揭开
    notes: 两国特使争相交出全部祭祀，刘震撼索要人数，得知美杜莎可出六百二十位祭祀、杜宾可出两千四百一十七名兽王。他弄清对方图的是战歌师承，并揭开通灵之歌加副本能召语宠之谜：师徒结成的比扬德乐队可突破光环上限。
  - name: 第六百六十章 六宠时代
    notes: 刘震撼追问雷克萨第三只战宠，得知是可代兽王释放星云连锁闪电的弑宠，斥其为堕落战歌，杜宾特使辩称魔兽自愿即豁免诅咒。美杜莎被迫交代隐宠战歌与真视之眼，各战歌母语及鹦鹉学舌螺复唱的办法一并揭开。
  - name: 第六百六十一章 海加尔圣山回归
    notes: 刘震撼列席元老院圆桌会议，为自创战歌平反却保住宗教裁判所，重划夏宫、军队、神庙三足鼎立的祭祀体制，并以狠话压服反对者接纳美杜莎。随后小贝求援，他回绝永久租借海加尔圣山等厚报，只换回贝克汉姆。
  - name: 第六百六十二章 再一次，红带屠城
    notes: 海族以珊瑚虫母在忘忧谷筑起珊瑚海防线，人类气系法师用「英捷尔法勒」遥控引爆加布林魔鲨武士。贝克汉姆献上人鼻肉山，讲述夏宫卫队屠灭十万人口的魔族城市，西多夫命人把鼻子送给海族。
  - name: 第六百六十三章 名将之局
    notes: 刘震撼伪装银瞳在落基山脉抄掉蒙太拿，这是屠城计划第四座也是最后一座，累计约二十五万魔界青民丧命。年轻城主骑变异奥兽挑战落败，美女巫妖夏莉莲被放走后立誓报复，隆美尔同步布局沙巴克轰炸。
  - name: 第六百六十四章 马蜂窝
    notes: 煤炭哥利亚酋长希斯菲尔德因恩人马特乌斯与十名青年被杀，决意唤醒金刚钻先祖并与魔族联手。玉皇占据飞亚达城准备立国却被内廷侍卫与元素干扰结界困死，上古皮亚琴察鳄王现身，新巫妖王梦露主张招安匪帮。
  - name: 第六百六十五章 世事无常
    notes: 忘忧谷地理与海族防线铺开，人类以毫无阵型的乱战全线猛攻，比蒙祭祀用狂化战歌覆盖四十万平方，海族炮灰成片倒伏。庆功酒会上老刘推介隆美尔，斯蒂法诺引荐三位年青法师，金精灵团长霞飞当众回绝招纳。
  - name: 第六百六十六章 太子诞
    notes: 贝肯鲍尔与朝河兰为盐耗亏空争吵，随后商定收买普莱恩虾人与湛蓝海龙、以龙龟组建幻兽空军。谭雅生下双胞胎男婴，取名刘抗美与刘援朝，万国来朝并引发三大教派争夺洗礼权；隆美尔借走五百金精灵空骑。
  - name: 第六百六十七章 备战【上】
    notes: 隆美尔把炭精配方卖给二十三个人类国度及唐藏、杜宾，比蒙御前会议商而无果，多瑙无煤，与美杜莎合作又恐资敌。刘震撼提议把配方也卖海族与魔族，另以两万份瑙白金诱安瑞达搅乱西海两国。
  - name: 第六百七十一章 两个打一个【中】
    notes: 人类十位高层密议屠灭卢塞恩，庞贝学者克林斯曼指卢塞恩是全木城池又紧邻针叶松林，力主火攻，人类愿赔采玉城损失，刘震撼接下此事。十一天后卢塞恩一夜化作火海，同天海慕联军在沙巴克遭地毯式轰炸。
  - name: 第六百七十二章 两个打一个【下】
    notes: 被遗忘国度迎来使节刘震撼。香克利、幽月儿、海德欲以千叶茑萝花汁染色伪装。老刘在珍珠广场展示莫托洛夫炭精鸡尾酒，揭穿隆美尔是影系魔法传人，给十屈指时间令其全族迁往波拿巴大陆。三百万人撤退耗时七天六夜。
  - name: 第六百七十三章 两个打一个【下之终章】
    notes: 宝剑峰战役。沙隆巴斯以八十万海族大军强攻一线天，飞驼军团用胡桃火球与万国牌器械死守。隆美尔泼下一千两百吨酒精与风动岩，十五万海族烧死谷中，谷外五十万被打散，沙隆巴斯拔剑自刎，东部十七城光复起义。
  - name: 第六百七十四章 大块头有大智慧
    notes: 贝肯鲍尔与朝河兰斥责海族幕僚无用，魔族特使许诺出兵援助。两位海皇用人类艺术品换来的水晶收买五阶海龙阿尔贝蒂尼偷袭宝剑峰夺航弹技术。刘震撼把炭精配方交给美杜莎，并宣布介丘海加尔与废除双重国籍。
  - name: 第六百七十五章 决战倒计时【1】
    notes: 介丘海加尔筹备，巫医伪造瑞兆，老刘三请三辞。废除双重国籍后杜宾兽王与美杜莎祭祀全数加入比蒙。十月二十六日四百万魔界大军兵发白令山脉，公开与海族结盟。魔族信使被科里纳弹雪茄羞辱，隆美尔献上海龙。
  - name: 第六百七十六章 决战倒计时【2】
    notes: 雷神之怒战斧的三道麻痹闪电曾令五头巨龙丧命，隆美尔把魔法禁制设在海龙影子上。夏宫众人为海龙轮番增幅水系魔力，瑙白金、元素之泉、水银魔杖与伊斯西丁金属徽章齐上，果果借此晋级圣普。比蒙已损二十万人。
  - name: 第六百七十七章 决战倒计时【3】
    notes: 佛罗伦多盐碱地鸟笼骨冢内，巫妖女王梦露召集上千魔族将佐观看威瑟斯庞南墙战实况，六翼天王阿泰斯特与沦为玉武亲王的草莽帝王玉皇列席；众人议论比蒙奥术，抱怨海族毁约拒供水纹龙龟，梦露定下先夺制空权的方略
  - name: 第六百七十八章 决战倒计时【4】
    notes: 桑干河边刘震撼自省由战术转向战略，与佛巨人酋长德塞利斗嘴；德塞利细数采玉城家底，透露穆里尼奥在打扫威瑟斯庞战场时捡到了塞壬尸身上的鹦鹉学舌螺，还从邪恶精灵女王手中得过一只可即时询问的魔镜
  - name: 第六百七十九章 决战倒计时【5】
    notes: 魔界双月下红骨祭坛血祭一对上位魔龙，两位巫妖女王持咒发动替身傀儡欲控制真武亲王；守护者皮亚琴察上古鳄王为避天罚自减修为，把鳄王之泪赠给魔龙皇帝。晚宴上谭雅推断神袛可能是矿石生命宇航员
  - name: 第六百八十章 决战倒计时【6】
    notes: 西雅公主美萝乐被海皇贝肯鲍尔强派往海加尔介丘仪式捣乱，父王苏比萨雷塔斥为送死，临行赠她海人参参王；阿尔卑斯湿地海螺营帐内，魔族正使冰主伊斯特伍德与副使纸主阿什利杨、红音受命，贝肯鲍尔又抛下填海钻石佩饰
  - name: 第六百八十一章 决战倒计时【7】
    notes: 海加尔山介丘仪式上，二少与三少以网状雷电宰牲并当众汲取魔兽灵魂，暴露堕落魔法，穆里尼奥与唐蓓尔金娜带走孩子退场；刘震撼讲出影侍叛变内情，并透露魔族遥控影侍反而把撕裂的末日教给了自己
  - name: 第六百八十二章 决战倒计时【8】
    notes: 澈桑大陆比蒙作战实验室的参谋们边饮酒边分析魔族三路进兵，四百万人马在桑干河沿岸集结却无渡河之法；穆里尼奥回绝弃守采玉城，众人议论李察借介丘设局逼魔海联盟打高端决战，狈人参谋送来拓图，若让平托当场晕倒
  - name: 第六百八十三章 决战倒计时【9】
    notes: 魔族借靼菲叙族海胆人的无水结界法阵辟开桑干河，四百万大军翻越天险，魔界三大海族就此介入大陆战事；四位魔海使节随后当众发难挑衅，美萝乐一句李察冕下果然是个皮丘控激得刘震撼杀机大起，他派古德三十秒内应战
  - name: 第六百八十四章 决战倒计时【10】
    notes: 爱琴众高手连番毒舌打击得美萝乐信心崩溃，红音出卖身世般地安慰她，暗示关键时刻才用填海钻石；纸主阿什利杨偷袭刘震撼被青雅以截血指凝住血脉，红音随即亲手一剑刺死同伴灭口，崔斯特则与美萝乐约定只比法术
  - name: 第六百八十五章 决战倒计时【11】
    notes: 崔斯特放出缇奈伦尔黑暗金属悬浮阳台百乐门漂浮舞台，召唤萨拉丁灯魔、蜡溶妖辣妹与木乃伊法老，在重金属音乐中与美萝乐比法术；刘震撼借机向隆美尔交底，称魔海联盟怕他，已摸清对方勇气尺度，有百分百必胜信心
  - name: 第六百八十六章 决战倒计时【12】
    notes: 美萝乐公主中三法术毫发无伤，原是可将元素攻击转为自身法力的噬魔体质，小崔以幽暗黑雾与莲焰火鞭强攻。老刘三问红音，揭穿其真身是巫妖女王梦露；她遁走前放出冥界茹芸模特，哭笑之咆让爱琴高手痛哭失声。
  - name: 第六百八十七章 决战倒计时【13】
    notes: 海加尔介丘仪式成了决战导火索。六翼天王阿泰斯特率三十万魔族大军进逼翡冷翠，逼魔龙皇帝卓别林吟唱禁咒以激出守军。采玉城被玉武亲王抢先打响，他随即下令全军压上，羽翼骑士冲入深渊铁幕遭元素狂潮痛击。
  - name: 第六百八十八章 决战倒计时【14】
    notes: 时光回溯一个多小时，老刘以福克斯少女花冠落红酿的万艳同杯解除哭笑之咆，并把茹芸模特送地底世界炼制装备。隆美尔质疑静观其变，老刘以敌方无生命法术相辩，随即分派凤凰与巨龙协防忘忧谷。
  - name: 第六百八十九章 决战倒计时【15】
    notes: 决战第一枪实由隆美尔在采玉城主动打响。他盛赞采玉城是依托雪山树墙、藤桥与温泉人工湿地构建的军事杰作，并猜出魔族保护针叶松林是为制造松节油航弹。巨龙无处藏身，穆里尼奥提议以十头巨龙设伏并请隆美尔指挥。
  - name: 第六百九十章 决战倒计时【16】
    notes: 穆里尼奥自称不止有两只凤凰魔宠，带众人传送回斯迈老巢伦敦城，揭开四头血龙与六个雾霭巨人，都是被血族初拥过的存在。他讲述初拥三原则并为血族担保，允许看不惯的巨龙离开；七彩龙只得选十头巨龙披精灵斗篷设伏。
  - name: 第六百九十一章 决战倒计时【17】
    notes: 隆美尔召唤禁咒逼魔族抢攻，代价是肉身死亡，但他修影系魔法可借影子不死。玉皇不请示嘉宝便带嫡系猛扑采玉城，普通魔龙随之而动。杜宾法师与德鲁伊来援，老刘令众人不得用目光锁定，并擒下六翼天王。
  - name: 第六百九十二章 终极决战
    notes: 魔龙皇帝以生命宝石躲过元素反噬，四魔龙皇族联手开启星澜之门。梦露改用钳形战阵并重赏格杀，魔族空军吞敢死药丸猛扑，被小空储存的燚火焚退。石像鬼以通体石化自杀投石砸毁铁幕发生器，翡冷翠全貌暴露。
  - name: 第六百九十三章 终极决战【2】
    notes: 采玉城捷报称魔龙一族近乎灭绝，老刘震惊之余忧心召唤禁咒的隆美尔生死。翡冷翠以北冕座流星雨、覆雨翻云、雷狱森林三记禁咒压阵，美萝乐被逼为翡冷翠持杖施法。翡冷翠先远后近开火，星界之王香君出场。
  - name: 第六百九十四章 终极决战【3】
    notes: 魔族首轮强攻翡冷翠即告失败，一窝蜂弩车与绞肉机战车把攻城器械尽毁；魔龙皇族以星澜之门召出镜面双生的两位星界之王达历桑德罗，六翼天王被娜迦默言术弄哑后遭刘震撼一记鞭腿抽飞。
  - name: 第六百九十五章 终极决战【4】
    notes: 梦露女王释放元素黑洞领域，自信以四位物理无敌的金刚钻哥利亚为底牌，却连带抽干了湛蓝海龙贴身的离水法阵，四对金亢龙银亢龙当场坠地，两百头海龙与两千龙人战士陷入窒息绝境。
  - name: 第六百九十六章 终极决战【5】
    notes: 海龙与龙人战士为求生路猛扑桑干河，壹条立下猎杀四十头海龙的军令状；血河大统领耐温尔因克落地吞食水晶憎恶武士。梦露发现夏宫高手仍能施法，决意撤走七千五百名奥术师。
  - name: 第六百九十七章 终极决战【6】
    notes: 两位香君以「我叫穆里尼奥」的开场白化解冲突，小空一泡尿反被视作辟疫，因他吃过温良如玉蓖麻而对马类有亲和力。刘震撼看破其魔力共鸣体质，双方约定以最差劲的法术打友谊赛。
  - name: 第六百九十八章 终极决战【7】
    notes: 梦露撤走黑洞领域以保住魔族奥术师这支最后家底，海龙被巴比伦空中花园的交叉火力成建制歼灭。两位星界之王低头承认李察正在统治这个时代，刘震撼下令空军预备队出动。
  - name: 第六百九十九章 终极决战
    notes: 采玉城战线开打，隆美尔以磁系禁咒逼玉皇出击，玉武亲王率上千玉廷高手与三十头魔龙俯冲城楼，被树冠中的禁空之歌摔成肉雨。冥界大统领茵格里切宝率四头六阶铠甲冥龙赶到。
  - name: 第七百章 万古绝唱之战
    notes: 魔界三大海族携三千五百四十七名奥术师与二百四十二头变异超阶奥兽现身采玉城。穆里尼奥致歉隆美尔并立誓永为朋友，随即以布雾石起雾、月石闪光弹激活晶化，把海洋魔族化为水晶雕像。
  - name: 第七百零一章 天下第一魔攻
    notes: 穆里尼奥揭示布雾石、迷迭草解药与月石闪光弹的整套布局，并展示硅基生命全知魔镜。茵格里切宝以名剑召唤连杀六头超阶魔兽，里贝里释放元素万花筒领域令十头巨龙因元素反噬爆成礼花。
  - name: 第七百零二章 小看祭祀=自寻死路
    notes: 霜岚领域与血之博弈领域罩下，里贝里以律令系奥术得手，地狱黑龙带头逃亡引发巨龙溃散，隆美尔与谛听银象被四头铠甲冥龙射碎。穆里尼奥被擒后以单控辉煌光环连杀冥龙与影侍。
  - name: 第七百零三章 巨星陨落
    notes: 穆里尼奥默发冥语版名剑召唤，召出石中宝剑埃克斯卡利巴；茵格里切宝以时间遗忘法则定住位面三刹那，避过单控冬眠光环后以战剑穿其心口。天鹅主祭战死化蓝天鹅星屑，布吕克纳公爵与龙人射手被射杀，二少三少被掳。
  - name: 第七百零四章 大局已定
    notes: 刘震撼用血婴小癞痢格飞茵格里切宝的炼狱界名剑提尔锋，并领悟琴心召月光之陨竖琴齐射，冥界大统领以暗黑失乐圆遁走，二少三少得保。忘忧谷战线开打，刘震撼亮出魔族战利品震慑海族金银亢龙，率众追杀。
  - name: 第七百零五章 大结局{上}
    notes: 介丘节战役落幕，爱琴江山定鼎，穆里尼奥被记为救世英雄，李察则被揭示为大战幕后黑手。唐藏仙师胡须迎客在魔界度厄晋级圣霄，刘震撼趁机提前关闭时空大裂缝，断掉六百万魔族大军粮道；嘉宝求鳄王出手被拒。
  - name: 第七百零六章 大结局{中}
    notes: 比蒙王国颁发荆棘草环征召令，准备拣魔族大军的洋落。萨尔国王到翡冷翠试探削兵权被拒；他见识夏宫卫队的毒系法术、鹦鹉学舌螺名琴、冥龙机甲与奥骨机炮后心惊。刘震撼表明不扩张，宣布翡冷翠征途是星辰大海。
  - name: 第七百零七章 大结局{下}
    notes: 十一月十五日大雪冻死数万魔族，十万伪军工兵被刘震撼下令屠杀；伊夫堡失守，两位人类魔寻师阵亡。嘉宝登门邀战三对三，茵格里切宝跪求饶冥界被小空砸死，上古鳄王被秒杀。刘震撼被幻境送回地球，嘉宝召唤秘名失败。
worldview:
  - 故事发生在名为爱琴大陆的异世界，除人类外还有兽人（比蒙）、矮人、精灵、海族等智慧种族在此繁衍生息
  - 一千年前的海加尔山战役中，兽人在人类联军的打击下大败，从此退出爱琴大陆，退守空旷的多瑙荒原
  - 人类是由比蒙兽人中的芒克族猴人进化而来，如今信奉异端邪教自诩是神的后代，不再承认这段历史
  - 比蒙兽人尊奉的最高之神是战神坎帕斯，圣坛祭祀是他最忠实的仆人，由祭祀口口相传许多不为人知的秘闻
  - 圣坛祭祀的秘语战歌能给比蒙战士加持祝福、嗜血、狂暴、石肤等战斗辅助技能，是比蒙大军中不可或缺的一份子
  - 圣坛祭祀是比蒙军团中唯一稍微可以和人类魔法师叫板的力量，其秘语战歌能打岔魔法师的吟唱，从而阻隔魔法师施法
  - 圣坛祭祀品阶由低到高为风语祭祀、灵魂歌者、战争祭祀、权仗祭祀，最高为神庙最高祭祀维安大萨满
  - 风语祭祀能用安抚心灵的秘语战歌与听者共鸣；灵魂歌者的通灵战歌能使听者与自己的语言相通，并拥有召唤兽宠的能力
  - 只有晋级战争祭祀才能使用狂暴战歌并领悟燃烧生命的生命魔法；燃烧生命对比蒙祭祀属于自杀行为，战神的教典规定自杀是懦夫的行为，死后无法进入比蒙的灵魂归宿
  - 圣坛祭祀出产比率极低，大多数兽人种族脑袋不够灵活无法领略战神意图，福克斯狐人内部出产比率也只有千分之一
  - 每个祭祀都拥有一次智慧启蒙的能力，可以让从没有听过战神之歌的人听完战神之歌后听懂兽人的语言和知识，通常只在祭祀导师教授祭祀学徒时使用
  - 魔兽天生能够使用魔法攻击；霜雪皮丘兽能使用气系冰冻魔法，风系魔狼能喷射锐利的风刃，水箭魔兔能发射水箭
  - 魔兽一旦超过使用次数，身体负荷不了魔法的强度，有可能导致自己丧命；魔狼是强悍的进攻型魔兽，只要身体条件许可就能施用无数次魔法
  - 每一个灵魂歌者只能征召一只魔宠，魔宠若不是在战斗中阵亡或者自然病死，就必须遵守契约，不可能再征召第二只
  - 人类魔法师必须通过吟唱、洒拨特制的香料、再通过卷轴才能召唤出相应的魔法，施法时不能被打断，否则会引起魔法反噬甚至丧命
  - 人类魔法师每次施法之后必须冥想，魔法并非取之不尽；召唤天外陨石之类的禁咒会对魔法师的寿命造成一定影响
  - 人类制作出复杂的魔法卷轴可不用长时间吟唱就瞬间发出魔法，还能寻找宝石与魔兽晶核等魔法增幅物源源不断补充魔力
  - 人类魔法师都是孱弱的身体，如果耗净了魔法连一个小孩也打不过，但泛大陆的强者都愿意寻找强大的魔法师作为同伴
  - 比蒙兽人将战斗视为极大的荣誉，贵族都是战斗型的种族，贵族的职业就是保护平民，战争爆发时要拿起剑和盾牌证明武勇
  - 平民种族只有靠立下军功的机会才能脱离附庸族的位置，晋级成为上位贵族
  - 福克斯族狐人靠战神赐予的智慧成为比蒙最佳内政人才，对数字和金钱有天生敏锐直觉，是比蒙中唯一没法上战场的贵族
  - 福克斯族狐人原本只是沃尔夫狼族的附庸，因在海加尔战役中掩护兽人血脉撤退的军功被国王册封为世袭贵族
  - 每个举行过成年礼（15岁）的狐族少女腋下都会生出一股天然香气，人类吟游诗人将这种香味称之为狐香
  - 狐族少女的容貌天生有种媚态，眼波一个流转就能将男人的魂勾去一半，人类还放言狐族少女的花冠能消除一些不良状态
  - 比蒙王国对祭祀结婚的年龄有着严格限制，必须达到十八岁向上，过早成家会被家室所累无法在战歌上有所突破，否则神庙会取消祭祀头衔作为惩罚
  - 人类贵族用比蒙兽人身上的皮草制作的裘皮大衣和靴子，永远是上流社会炫耀财富和势力的一种象征，福克斯族火红的毛皮和尾巴被人类视为极品的皮草和围脖
  - 一个狐族美女在人类世界的黑市上已经炒到了惊人的价格，多洛特公国的佣兵团体每年从蛮荒古道潜入比蒙王国绑架狐族少女
  - 大海中的西雅海族不允许任何装载着军队的舰船从他们头顶的天空驶过，认为那是对他们尊严的挑衅
  - 只有各个大陆上特别强盛的国家每年向海族交纳贡品，才能获得海族的行船许可，才能将商业贸易的货船在各个海洋上行驶
  - 比蒙没有制造大型战舰的水平，比蒙中还没有和人类工匠媲美的木工，海岸线上只布置了几个哨卡
  - 海族也有自己的疆域和国家，互相之间也有战争，人类和比蒙沿海的海岸线他们并不侵犯，也允许捕鱼
  - 除爱琴大陆外，遥远的东方还有强盛的丝绸大陆，南方还有富饶的撤桑大陆，海域的疆域远比陆地更加宽广
  - 人类遗留下来的龙骑士手札记载，龙骑士在飞跃海洋的时候发现整个世界的海洋远比陆地宽广
  - 古籍记载中的魔族是紫发银瞳，已经消失了几千年，海伦最初看到刘震撼的黑色头发时曾以为他是魔族
  - 比蒙王国东北部行省由福克斯族狐人镇守，与人类的多洛特公国在多瑙荒原上遥遥对峙，长达一个月路程的大荒原成为双方巨大的缓冲
  - 人类与比蒙之间的仇恨历经千年已淡化许多，但至今并没有任何人类国家和比蒙签定正式的贸易开发
  - 比蒙王国对人类的日用品和钢铁布匹需求量很大，人类商人自发组成的民间贸易对比蒙王国来说极为渴求
  - 海加尔战役后人类已经分裂成大大小小数十个国家，牢牢占据着爱琴大陆，大多数人类国度都极为仇视比蒙兽人
  - 人类与兽人之间小规模边境冲突时常发生，但再也没有谁再愿意做出头鸟挑起大规模战争
  - 爱琴大陆上只有人类可以制作出远洋航行的船只，其他生物都还没有这样庞大的人力和技术
  - 海族因为吃过人类的亏，所以才格外讨厌爱琴大陆的生物
  - 战神的教典严格规定自杀是懦夫的行为，死后无法进入比蒙的灵魂归宿
  - 沙漠人类强盗从东北部与他们有贸易往来的人类国家购买船只入境，并改扮成其他通商国家商人的形象以混过海族
  - 天生的灵魂歌者无须长时间学习就能达到普通圣坛祭祀苦修才能达到的水平，晋级速度快得难以想象，比蒙史诗中记载的几位天生灵魂歌者无一不是萨满级别的英雄
  - 千年前海加尔战役中比蒙王国唯一的天生灵魂歌者刚进阶战争祭祀，拥有一条龙作魔宠，是比蒙历史上唯一的龙骑祭祀，最终在与人类十位龙骑士的对阵中战死
  - 圣坛祭祀最低级别为风语祭祀，只能学习通灵战歌的前半阕，须超度无数比蒙亡魂后才能由神庙权杖祭祀赐予晋级并学习后半阕
  - 通灵战歌中有许多拗口音节，个别音阶由精灵语与龙语组合而成，很多风语祭祀在升级时一耽搁就是很多年，资质稍差者终其一生只是风语祭祀
  - 只有学完通灵战歌再晋级战争祭祀，才能学习狂暴战歌、祝福战歌、石肤战歌、辉煌战歌等高阶战歌，也才能在军队中谋职
  - 吟唱通灵战歌时要把自己想做的事与诚意全部通过歌声表达出来，被魔兽理解并接纳后才能订下契约；等阶越高、实力越强的魔兽越聪明，也越不易驯服
  - 召唤魔宠带有偶然性，地位卑下的灵魂歌者收服的魔宠有可能比权杖祭祀的魔宠更强大，祭祀在神庙中的地位很大程度取决于魔宠的实力
  - 一旦魔兽死去，因心灵契约的关系祭祀心里会如死去至亲般难过万分；无故抛弃魔宠，战神坎帕斯会剥夺其作为祭祀的所有能力
  - 家养型魔兽虽不如同类野生魔兽强大，但因与人亲昵，通灵战歌的成功率会提高很多，势力庞大的福克斯家族会孵化野生魔兽的蛋从小驯养备用
  - 歌力与人类魔法师的魔力同理，同属元素力量，没有祭祀能不停地吟唱战歌，歌力须靠冥想来积攒，歌力越强越精纯，战歌加持的范围与循环使用的次数就越多
  - 战歌加持的辉煌光环只有五盎司沙漏的时间，超过时限加持力量便消失，只能等待祭祀再次吟唱战歌
  - 一个匹格族豪猪掷矛手被加持辉煌战歌后射程增加三分之一，一个俄勒芬族巨象勇士被加持石肤战歌后皮肤异变成石头一样，物理伤害减半
  - 比蒙兽人中俄勒芬象族勇士身高达到两米五左右，彼尔族暴熊武士甚至能举起重达千斤的石头
  - 圣坛祭祀在比蒙兽人中属于身体孱弱的一类，多为身材矮小但头脑机灵的种族；祭祀哪怕只有骑士头衔也能拥有追随者，强大的比蒙战士愿意追随前途无量的祭祀
  - 比蒙世界的圣坛祭祀分为风语祭祀、灵魂祭祀、战争祭祀、权杖祭祀、维安大萨满、十二主祭、红衣大祭司七个级别
  - 维安大萨满是大城市神庙的负责人，十二主祭是比蒙王国神庙中负责巡视的钦差，红衣大祭司相当于人类教会的教皇
  - 龙是大陆上最强大的生物，有不亚于人类的智慧，亚龙种魔兽是龙与其他强大魔兽交配产生的后裔
