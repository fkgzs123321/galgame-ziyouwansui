    summary: 狂战士首领用稀有金属锻造的战斧，几乎每一个狂战士首领都号称自己的战斧是雷神之斧，奥尼尔手里这把是赝品
  - name: 安尔乐法阵
    summary: 福格森.徐研制的集避土结界与凝水结界为一体的保温法阵，配合避土龙珠威力可覆盖一座城市，被海族误传为避水结界
  - name: 八门金锁阵
    summary: 云泰帝国当年最赫赫有名的禁锢法阵，不需魔力，只在八个方位摆上珊瑚礁石便能产生禁锢力量，八门分别刻着休、生、上、杜、景、死、惊、开
  - name: 水井传递
    summary: 美人鱼的专属传送密技，只有血统纯正的美人鱼能启动，被云泰金人碾坏一角后便难以修复
  - name: 影武者
    summary: 美人鱼的天赋结界之一，把月光下的影子幻化成巨大黑布武士，移动迅速、免疫物理攻击却拥有物理攻击
  - name: 八面来凤
    summary: 八臂娜迦长老的导师阶单体魔法护盾，八道风墙呈正反对列的月弧状，用几何反作用力弹射开物理打击
  - name: 神圣还原术
    summary: 人类神甫神圣魔法中的还原术，有可能将被控灵术转移的灵魂还原，但只看概率
  - name: 死亡领主戒指
    summary: 说穿了就是一个亡灵的次元空间，虽然戒灵只能收下一个，但有自我思想的亡灵也能住在里面，八位布尔族灵魂巡游者现在就待在里面
  - name: 九头蛇珠
    summary: 许德拉下颌取出的海蓝色菱形魔晶与蛇珠，携佩者能加持九连环闪击，还带水系魔法加成的混合溅射，即水玲珑九连环
  - name: 汉语战歌
    summary: 刘震撼自创的五首战歌，即站在高岗上、将军令、冬天里的一把火、我家住在黄土高坡与香帕惹的祸，分别对应通灵、狂化、献祭、迟钝与力量汲取战歌，另有发如血即心灵锁链战歌
  - name: 潮汛媚惑之歌
    summary: 茉儿用艾薇尔的身体唱响的歌曲，歌声过后二十头抹香鲸集体冲滩搁浅
  - name: 离子之歌
    summary: 虫人在海外一万年间传唱的思乡之歌，返乡后在红土高坡前唱响，歌词呼喊海加尔圣山与虫人的乳名
  - name: 避尘珠
    summary: 刘震撼从果果肚兜里摸出赠给菲高的宝珠，能保证半天不需回水并有土系魔法免疫能力
  - name: 云泰金人魔偶
    summary: 二十四万磅的瘸腿云泰金人与费铜金人，能横在阵前当金属盾牌，也能就地翻滚碾碎珊瑚假山与椰子树
  - name: 七星连弩
    summary: 仙女龙、奥尼尔与果果使用的湮甲连弩，对魔法护盾威力奇大，在海底世界只存在于传说中
  - name: 古力火铳与摩拉丁怒火
    summary: 刘震撼手中的火器与带溅射效果的弹药，能击碎塞壬女公爵的身体，铜弹对影子武士这类物理免疫怪东西无效
  - name: 赝品雷神之怒
    summary: 奥尼尔扛着的赝品神斧，砸出去舍不得，用来擦着美人鱼国王的脖子晃荡勒索珍珠玛瑙
  - name: 艾薇尔的首饰
    summary: 装在扇贝首饰盒里的海底珍品，包括蝶翼会扑扇的蝴蝶式银簪、镂空成海紫荆花花藤的火山银长护腕与两只湛蓝色水晶指环
  - name: 黄金笛子
    summary: 穆里尼奥腰畔插着镶嵌数颗纯净魔晶的乐器，意味着他已达到默发战歌的超高水平
  - name: 金色主祭袍
    summary: 穆里尼奥身穿的主祭袍，胸口用红线绣着红色火焰不死鸟与莫巴沙九头鸟的描影，中间别一枚黄金美杜莎徽章
  - name: 夜明龙珠
    summary: 刘震撼独有的夜明珠，这个世界上不会再有第二颗，其他夜明珠与它相比简直就是萤火虫和香帕的差别
  - name: 星袍
    summary: 月白色的祭祀袍，勋带型领口缀以蓝色六角星点，只赐予年长引退的祭祀或覆盖死去老牌祭祀的尸体，穿着者觐见任何贵族或高级祭祀时可享受对方首先抚胸致敬
  - name: 云麾勋章
    summary: 颁赐给抗御外敌有功德的半指长剑刃勋章，紫色绶带、白银制成，刻着比蒙古语缄言你永远不会独行和云雾缭绕的圣山浮雕
  - name: 银星双头鹰勋章
    summary: 赐予刘震撼追随者们的勋章，奖励他们在战斗中的卓越贡献
  - name: 南十字星勋章
    summary: 威瑟斯庞神庙的最高荣誉，飘着红色勋带的特制水系勋章，表彰打通海加尔圣山道路的功劳
  - name: 战神骑士勋章
    summary: 比蒙只颁布给功勋卓著勇士的金质钻石型勋章，凸雕比蒙巨兽形象，用以表彰打通海加尔圣山道路的功勋
  - name: 丝绸之路勋章
    summary: 财政部门最高奖励，若比蒙王国与远东大陆开通贸易往来，刘震撼即可获得
  - name: 七度金
    summary: 最能吸附空间力量的罕有金属，七十咉司掺入金属器皿即可拥有七个次元空间的储存能力，也用于打造暗精灵女王皇冠与空间戒指
  - name: 七度空间戒指
    summary: 刘震撼佩戴的空间戒指，单个空间载重可达五十吨，取出物品时七个空间的东西会一股脑出来
  - name: 米莎徽章与美杜莎徽章
    summary: 带有冬眠结界空间的比蒙徽章，需掺杂能吸附空间力量的稀有金属，靠红衣大祭祀的冬眠结界之歌加持
  - name: 李德徽章
    summary: 两千五百年前取消的芒克族魔法师独门标志，名字取自战神坎帕斯的豪猪魔宠，茉儿所持的一枚被设计成喀秋莎的形象
  - name: 三系魔免金项链
    summary: 娜娜为刘震撼重新打造的栓狗式项链，样式依旧但做工精美
  - name: 银萧
    summary: 刘震撼替代弦子的增幅乐器，外表镀着秘银可当武器砸人，箫中藏着一把三棱刺
  - name: 许德拉蛇珠水晶项链
    summary: 茉儿的水晶项链，镶嵌着许德拉蛇珠，作为她的法杖
  - name: 避土龙珠项链与全钢盔甲
