  - name: 古德里安之风
    summary: 翡冷翠炼金术士为箭姬伦蒂妮特制的魔法战弓
  - name: 屠城战幡
    summary: 海族的攻城令旗，竖起即意味着攻下城市后可尽情掳掠发泄，会逼得守军更加玩命
  - name: 雷云电柱
    summary: 艾薇尔铁塔释放的沛然能量攻击，四道落下即把青条石城砖震成厚达两米的黑色酥粉，后两道被卡卡化身的灰色飞鹭吸纳储存为电能
  - name: 第四阕通灵之歌
    summary: 特维斯用家乡语言自行领悟的新型战歌，可征召野兽为野宠并征召一位骑士为终生守护骑士，两者战斗时自动扩大四到十倍体型且单控刷新祭祀所会的辉煌光环
  - name: 致幻战歌
    summary: 米高斯科菲尔德以比蒙语为主体自创的战歌，在兽亲脑海中营造从悬崖摔落、被猛兽追赶等惊险场面，用以启发潜伏在种族基因中的异能
  - name: 貔貅
    summary: 特维斯的野宠东方丝绸大陆野兽，生来能用鼻子寻找矿脉，只以金属为食、唾液能分解金属结构，排出的粪便即经胃肠提纯的金属之精
  - name: 帕瓦罗蒂
    summary: 特维斯给野宠貔貅起的名字，战斗形态可暴增三四倍体型，身上叠加米纱体格之歌等十大辉煌光环，平时只是一只啃金属竹子的熊猫姑娘
  - name: 心灵犀角
    summary: 只有感情最真挚的犀牛人夫妻才能诞生的血红犀角，持有者无论相隔多远都能心有灵犀一点通，比蒙布尔族从古到今只诞生过不到十对
  - name: 自磁玉
    summary: 壹条抢回的两颗卵形圆润绿玉，一触一碰就会像磁铁一样互相吸引并发出清脆碰响
  - name: 菠萝密药丸
    summary: 慕兰阿訇用来补益元素力量的湛蓝色节魔药丸，吃一颗全身魔力就能掰成两半花，原本只能使用一个禁咒吃了就能剩下一半元素力量
  - name: 驻颜之泉
    summary: 沙漠中的泉水，喝一滴从此素春永驻，被壹条从一名女阿訇身上抢到，后被嘉宝摔碎
  - name: 惊寂之黄泉
    summary: 魔界两种黄泉之一，能驱散一身魔力，还能做出延迟发作的效果，嘉宝用它冒充驻颜之泉骗大小s喝下
  - name: 假面罗刹
    summary: 巫妖研发出的可以任意改变脸型的顶级间谍道具，蝴蝶人只能看透隐身而无法看穿面具下的真实容貌
  - name: 安尔乐离水法阵
    summary: 海族登陆作战必须携带的移动保护法阵，脱离法阵保护的海族战士会直接窒息而死，是海族致命的命根子
  - name: 金戈铁马领域结界
    summary: 美人鱼大元帅莱茵克尔亲王的绝技，施加于海族武士身上能赐予通体金属化身躯与铠甲，并召唤金海马座骑与黄金海皇三叉戟，还带有隐身能力
  - name: 兽浪领域结界
    summary: 西米里安王子的领域结界，可用清水幻化出铁爪锋利、獠牙似钩的透明蝙蝠，在海洋中能幻化出数量更多体型更庞大的拟形猛兽
  - name: 涅盘之火
    summary: 不死鸟一族特有的火系魔法，由内向外燃烧，沾上一星半点便从人体窍门喷发星蓝色焰流，受害者还能活着爬起便可拥有自愈火焰光环
  - name: 补魔金丹
    summary: 唐藏帝国的丝绸丹药，五殿下以五百金币一颗满魔金丹、二百五十金币一颗半补魔金丹、一百八十金币一颗三成补魔金丹的价格向人类诸国出售
  - name: 荒芜光环
    summary: 比蒙祭祀能帮助魔法师补充魔力的战歌光环，被人类视为实惠到不能再实惠的技能
  - name: 重型幻兽
    summary: 由基头座龙与幻兽巨龟等苦力役兽改造成的全新谱系奥兽，拥有琉璃金能力与魔法护甲，身高十米、体长十五米，靠螺旋刺角与蹄足进行物理集群冲锋
  - name: 仙道樟
    summary: 远古巨龙温格赠送给文泰克莱尔的魔芯，可以随心所欲拟化各种形态的武器，十太子一眨眼便换了十七种兵器武技
  - name: 死亡领主装备
    summary: 刘震撼可召唤出八个布尔族灵魂巡游者的装备，另有死亡领主耳钉是爱琴大陆已知的节魔装备
  - name: 杜蕾丝爆裂箭的名牌品类
    summary: 蓝眼高棉巨蚁的百倍重压爆裂箭、六翼炎魔的红莲烈焰爆裂箭、火焰帝君的晚期梅毒爆裂箭、地狱黑龙的火焰龙卷爆裂箭
  - name: 音刃琴魔
    summary: 刘震撼为比蒙王国贡献的三千多名琴魔，音刃攻击不逊于高级魔法，只在释放速度上差强人意
  - name: 归来去兮露
    summary: 丝绸大陆出售的奇药，与惊寂之黄泉一样能废去巫妖女王的全部魔力
  - name: 魔法拓图
    summary: 夏宫空军高空拍摄的全景侦察图，可判断军团数量与兵种构成，让隆美尔第一次意识到比蒙已掌控荒原
  - name: 海澜战争古树
    summary: 娜迦适应海洋环境的变异战争古树，以藻叶上生长的细碎珍珠弹射杀敌，射程超过五百码
  - name: 绣球战车
    summary: 海狮族用四人才能操纵的高大滚圆石球，落到莱茵剑士脚下变成了「狮子踩绣球」，衍生出踩单车、任意球、颠球与盘带等玩法，踩球速度可达百米二十秒
  - name: 海皇重弩
    summary: 娜迦工兵架设在巨鱿头顶的重型弩具，外型神肖鸟翼飞廉弩车，配套环机具瞄准，一发七矢、射程上千码
  - name: 鱼干弩箭
    summary: 用晒干的箭鱼、刺拔鱼与金枪鱼制成的重弩弹药，靠扇面鱼鳍与旗状鱼尾翼保持规则抛物线飞行
  - name: 猪脸蝙蝠骑士
    summary: 摩尔空骑的制式部队，多毛的蝙蝠脖子上悬挂多耳金属莲灯，骑士以铁指套点燃胡桃状炭精燃烧弹
  - name: 炭精燃烧弹
    summary: 摩尔故老相传的空中制式武器，用煤炭提炼的浓缩精核制成，遇火即燃且温度高到溶金化铁
  - name: 硫磺航弹
    summary: 隆美尔私人卫队使用的毒气航弹，以泰穆尔拉雅雪山的列奥尼达致命硫磺气灌充大型鱼鳔制成
  - name: 列奥尼达
    summary: 雪山土著对喷射致命硫磺气体地隙的称呼，意为凶险之气，隆美尔半年只勘探出两处致命气矿
  - name: 毒雾航弹
    summary: 齐布林飞行器投下的橘黄色气囊航弹，破裂后爆出毒雾，闻者四肢痉挛、口吐白沫
  - name: 琥珀脂浆
    summary: 四位恩特牧树人喷出的浆液，能把海狮石球战车迅速风化成凝固死亡瞬间的碧绿树脂化石
  - name: 古灯海莲
    summary: 月精灵食物莲菝丝的变种，制成的苔条食用一口即可一天不再进食，是娜迦的行军口粮
  - name: 蛙眼护目镜
    summary: 隆美尔教卢塞恩工匠制作的聚光凸透眼镜，用澄净水晶磨制镜片，是河仙射手战力跃升的根源
  - name: 谛听银象
    summary: 隆美尔的座骑，能以缩地千里回航、速度堪比快速瞬闪，背上还可设背銮指挥部队
  - name: 虎狗鲳鱼
    summary: 唐藏帝国的特种军用装备，一百条能在五分钟内把一头黄牛啃成骨架，被倒进威城郊外的雪水支流
  - name: 侏儒攻城战车
    summary: 青铜结构的重型攻城器械，本是隆美尔留给慕兰帝国的遗产，两辆均落入刘震撼手中
  - name: 藤舟
    summary: 摩韶族幻术师布置在桑干河边的渡船，大部分只是幻术所化，诱使慕兰溃兵自相残杀
  - name: 双刃战斧
    summary: 特拉维夫狂战士的制式武器，被隆美尔留到总攻时刻才投入战场
  - name: 三叶盾刃
    summary: 血精灵破法者的破魔利器，注入血系魔力后能将接触到的适阶魔法完全分解
  - name: 魔力汲取
    summary: 破法者抽取敌方法师魔力的手段，与魔族黑曜毁灭者的奥力偷窃异曲同工，但无法转补给己方
  - name: 群体默言术
    summary: 娜迦的种族异能，能在会战中压制爱琴法师使其无法吟唱，配合双飞战阵让上千名堕落法师来不及逃跑
  - name: 海神祭
    summary: 海族军队炫耀武勋的特定方式，一场大捷过后在树上缚满俘虏或者尸体并堆起燃烧的篝火
  - name: 双飞战阵
    summary: 隆美尔事先与堕落高层磋商好的阵型，两翼齐飞、中路远程火力展开便能轻松击败娜迦，却被他自己反过来当成吞掉上前名堕落法师的陷阱
  - name: 海澜古树
    summary: 长满葡萄珍珠的娜迦古树，十棵被夏宫武士在油丘战后第一时间笑纳
  - name: 八足巨鱿
    summary: 力拔山兮气盖世的巨型海洋役兽，比巨型龙龟更耐饥渴，吃饱一次两个月不用进食，还是天然的起重机
  - name: 海洋生命古树
    summary: 娜迦随军携带的神奇植物，与永恒月藻同为催生小精灵的子宫，需配合森林树木种植古灯海莲
  - name: 永恒月藻
    summary: 娜迦祭司以秘术培育的海藻，作用等同地表精灵的永恒月井，共四棵，落入刘震撼手中后专用于增产油瓜
  - name: 海树宝瓶
    summary: 娜迦研制出来专门装载海洋植物随军开拔的植宠装备，外观是盛满湛蓝海水的雅致水晶花瓶，瓶中收集了玻兰秀尔星座的光芒可当免费电灯
  - name: 玻兰秀尔星座
    summary: 爱琴传说中上古月精灵女王玻兰秀尔的眼泪所化，是天空最亮的彻夜启明之星，其光芒被海树宝瓶收存
  - name: 海豹油
    summary: 海族的军用油脂，燃烧性能与爱琴流行的军用火油一样必须积薪齐上才能引燃，还可以食用，营养极其丰富，引起各方哄抢
  - name: 三维珍珠
    summary: 娜迦后勤系统使用的空间装备，品相不如海慕联军的海库宝石，容量最大的也不过三十来吨，而且又是海水储藏空间
  - name: 水银丝战弓
    summary: 用弹性无限的特殊水银丝拉制而成的战弓，动力极强，连沉重的精金羽箭都能射出去
  - name: 珊瑚虫母
    summary: 海族工兵培育的生物建材源头，能快速繁殖大量以石为食的珊瑚虫，虫粪冷却后凝结成坚硬磐固的珊瑚礁盘
  - name: 珊瑚海防线
    summary: 海族工兵在忘忧谷仓促筑成、后经抢修加固的防御工事，以坚固珊瑚礁盘按复式结构呈几何状堆砌在半山腰以上，外有鹿砦拒马、内有矮堞腰墙，高地顶端还有床弩与投石器的火力平台
  - name: 加勒比轨道船
    summary: 海族送给翡冷翠的十台装备，形似维京龙舟，用磁悬浮射线光波把十几座撞车和炮槌托上数百米高空再狠狠摔砸
  - name: 叹息之墙
    summary: 人类难民与溪谷矮人在匆忙中用草茎和夯土垒建出的防线，远不如海族同时构筑的珊瑚海防线坚硬高大
  - name: 双法合壁
    summary: 海族研发出来的魔法技战术理论，研究射击角度和混合威力，能把直线射击改造成曲射弹幕，落地龙卷配上凤仙催爆便能中心开花
  - name: 落地龙卷
    summary: 等级不高的风系单体攻击魔法，能把一个单位目标卷上数十米高空再往下猛摔
  - name: 凤仙催爆
    summary: 植物系法术，依靠一个元素凤仙球击中敌人后砰然爆散骨骼，在十码范围内形成短程溅射杀伤
  - name: 泰坦巡游战舰
    summary: 上古泰坦代替众神巡游天空的座驾，龙骨需要的富氧金属必须按配方勾兑，量太大无法短期造成，刘震撼只能先造它上面的武器
  - name: 战斧巡游礼炮
    summary: 盾斧矮人的贡献，蜂巢前端配后端风速涡轮，靠风力提供动力不停发射氧爆战斧，只能用于空中作战，射到距地面十米处就会被土壤吸收空气震爆波
  - name: 亚伯拉罕重装锚弩
    summary: 野矮人与白银矮人的结晶杰作，足以屠杀上古巨兽的单发重火力，弩箭用柳相铁打造又灌冲了黑索银并篆刻心灵指引法阵，每一枚都贵重到无法现场验证
  - name: 摩云磁暴灯塔
    summary: 刘震撼盗用别人的发明并大型化的能量武器，底座如睡莲花瓣，堤丰巨人戴上磁合金手套摩擦塔身便蹿出七色闪电，能把金属球里的鬣狗彻底蒸发
  - name: 潜沙螺舟
    summary: 沙漠矮人用上古魔螺躯壳制成的器械，钻进去对准魔晶输入魔力就能启动高速螺壳尖辟沙钻地，被翡冷翠工匠改造成了自转音波武器
  - name: 通灵之歌副本
    summary: 雷克萨发明的两首副本战歌，加上通灵之歌这一曲歌引便能召唤出语宠与弑宠两种全新的战宠
  - name: 比扬德乐队
    summary: 杜宾兽王以导师和学徒结成的乐队，不用七星合唱地毯也能联奏召唤战歌，每多一个直系学徒就增幅光环范围一成
  - name: 娲颜青蟒
    summary: 早在八千年前冰川时代就已灭绝的上古超阶魔兽，半人半蛇、无论雌雄皆容貌美艳，能用瞳光迷惑心神并极擅长操纵灵魂，是雷克萨当年最珍爱的语宠
  - name: 快慢暴熊
    summary: 爱琴早已绝迹的高阶加持类魔熊，能用「风之束缚」让目标慢如鼻涕虫，也能用「风之迅捷」把目标或自己加持得快如闪电，是特里阁下的魔宠
  - name: 疾电锦斓蝮蛇
    summary: 特里阁下的珍宝魔宠，既有五步倒的毒牙，又能喷出攻击力强悍的闪电法术，还能长期处于隐身状态
  - name: 隐宠
    summary: 美杜莎科科大祭司在一千年前发明的副本通灵之歌所召唤的隐形战宠，对人有大范围加持「真视之眼」的光环效果
  - name: 三元空间之歌
    summary: 雷克萨毕生自创的三首新型战歌之一，用巨魔语言吟唱，猎鹰徽章的三元空间可以储藏语、弑、魔三大战宠
  - name: 可燃冰井矿
    summary: 庞贝帝国所有的两座上好航弹原料产地，人类为请比蒙出兵而开出的条件之一，被刘震撼当场推掉
  - name: 圣甲虫弩箭
    summary: 圣荷西帝国的人类军工文明代表性作品，制作流程不如精灵弩箭烦琐，但威力更强、射速更快，攮穿力更符合空气动力学和力学原理
  - name: 风车三号
    summary: 人类开出的弩簧合金配方，与其两座可燃冰井矿所有权一同被刘震撼回绝
  - name: 炭精
    summary: 一百磅煤炭才能提炼一磅的航弹原料，隆美尔掌握提炼技术，打算带着它去人类世界自立门户并与各国贸易
  - name: 百倍重压爆裂箭
    summary: 取自蓝眼高棉巨蚁的爆裂箭，把班尼路鲸鱼武士直接压成烧饼
