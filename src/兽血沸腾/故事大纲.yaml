    description: 距红土高坡六十几里外的双头食人魔强盗部落，拥有二十几个家庭与三百号食人魔，营帐藏在巨石阵中间
  - name: 巨石阵
    description: 岩石强森食人魔部落营地所在的巨型人脸石柱群，几十根小山般粗大的石柱让四百多号食人魔的战线施展不开，阵中埋着一座举着花蕊托盘的石头女神像
