  - name: 地底罡风
    summary: 上古魔法阵不停循环制造出来的飓风与巨型镰刀风刃，能轻松卷走钉在石板上的精钢匕首，并在匕首柄上留下四条斩痕
  - name: 梯井
    summary: 地底时不时冒出一团冲天火焰的地下阶梯通道，有的通往第二层黑域大陆，有的通往熔岩河流、魔兽巢穴或迷宫洞穴，刘震撼给它起名火井
  - name: 钢铗魔偶剪刀手爱德华
