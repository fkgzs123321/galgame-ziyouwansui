  - 记忆魔法水晶能记录人物的影像，人类世界中能拥有魔法物品的大概只有豪门和权贵，这种水晶球往往出现在人类奴隶贩子手中，用来记录货物的姿色
  - 人类名门世家都有纹章，夏尔家族的纹章是一条美人鱼托着天秤和砝码，美人鱼的意思是指他们家族娶了一位公主
  - 比蒙王国和人类商人有协定，开放武器店必须让比蒙中的兽人来做学徒
