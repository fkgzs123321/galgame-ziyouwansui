        text: 我现在考虑的不是要不要和波拿巴美杜莎合作的问题，而是要不要将炭精配方卖给海族和魔族的问题！
      - chapter: 第六百七十二章 两个打一个【下】
        context: 刘震撼解释大撤退的动机
        text: 我的想法很简单——老子就是不想做隆美尔的棋子！
