  - 镶嵌着晶核和宝石、能储存歌力的歌力乐器是神庙自行制作的，人类商行只能为歌武双修者订制带魔晶的魔法武器
  - 狈族和狼族有着直接的血缘关系，是沃尔夫一族不可或缺的一员，一出生就带有残疾，双手萎缩
