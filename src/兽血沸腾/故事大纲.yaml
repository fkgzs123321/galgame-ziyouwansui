  - name: 死亡领主护盾
    summary: 龙骑士加茜娅佩带的极品魔法装备，六面笼罩黑色雾气、凸着昙花纹与骷髅头的黑色晶盾，能抵挡好几十个高阶魔法，是教廷收藏的两件死亡领主遗物之一
  - name: 七度金空间戒指
    summary: 用比精金还要珍贵的七度金制成的空间戒指，每一枚能开启七个次元空间，刘震撼摘下一枚送给了普斯卡什大师
  - name: 星辰精钢狼牙棒
    summary: 重达一千多磅的巨型狼牙棒，由壹条用翅拐从背鞍上抽出，搂头一棒就把风龙砸得脑震荡
  - name: 茉儿的极品魔晶
    summary: 分别镶在护腕、腕铃、法杖与项链上的四块元素波动强烈的极品魔晶，保命时能释放献祭之火与九叠飓浪斩
  - name: 火合围
    summary: 普斯卡什大师用气障包裹一簇火苗制成的气球，火苗随掌声震动而涨大，用来测量歌德大剧院里两边观众的掌声高低
  - name: 软骨功
    summary: 海族章鱼武士的武技，能让体重五百磅的章鱼武士穿过一个金币大小的洞，菲高练不到家只能短时间把身体缩掉一半
  - name: 神圣净化
    summary: 教廷的高阶神术，贞德借此为刘震撼和黛丝净化凝血酶剧毒，净化几率在百分之九十到九十九之间
  - name: 神圣还原
    summary: 能把一个女孩的灵魂转移到她自己身体里的高阶神术，多洛特公国的红衣主教未必能够施展，是刘震撼此行真正的目的
  - name: 神圣庇佑
    summary: 教廷的神圣辅助术，可以保证受术者和追随者们不受七彩龙龙威的伤害
