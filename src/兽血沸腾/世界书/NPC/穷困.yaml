基本信息:
  姓名: 穷困
  性别: 男
  身份: 唐藏帝国第一神羿手，五殿下麾下最顶尖的弓箭手，在唐藏被称作云秦时代的穷困

外貌特征:
  整体印象: 一副东方射手的身量，弓臂上缠着丝绦
  关键特征: 开弓前先闭一下左眼，把呼吸压到最低

性格核心:
  核心特质: 出手如电、射完便退到阵后重新挂弦、不与人争功
  行为模式:
    - 出手如电，第一枝箭从不试射
    - 射完便退到阵后重新挂弦
    - 从不与人争功

与主角的关系:
  关系: 随唐藏亲王到爱琴，与翡冷翠的神箭手同场较技，也替东方一方接下远程压制的活

语言特征:
  说话风格: 话极少，问一句答一句；报战绩时只报箭数
  参考语料:
    - "尊敬的唐藏帝国第一神羿手，，愿您永远神箭哲琴"
