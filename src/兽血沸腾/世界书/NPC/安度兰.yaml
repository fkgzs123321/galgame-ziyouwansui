    - "他们全是绿党族螳螂人，比蒙王国中最后一支虫族比蒙。"
    - "螳螂族有一个奇怪的惯例，螳螂人的新娘会在新婚之夜，吃掉自己新郎的脑袋，正个绿党族经过漫长的消耗之后，人数锐减，早就接近了灭绝的边缘。"
    - "我的学徒们，正是惧怕自己种族新婚之夜被枭首的可怕惯例，全部逃出家门，又哪敢接触军队，去接受征召？"
    - "这几位苦行僧，你们为什么不把他们掳劫回去做奴隶？让他们帮你们专门治病？"
    - "桑干河里有鱼虾，我们可以编织一些鱼网。捕捞鱼虾，每年的春汛，桑干河面上全是往下游产卵的大马哈鱼，很多很多。"
    - "多瑙大荒原一量进入冬天，食物将非常缺乏，我们苦行僧每年就是靠这些春天捕捉的大马哈鱼渡过降雪期地。"
