语言特征:
  说话风格: 对美帅自称忠实的仆人，激动时单膝跪下；探到敌情便抢着请战
  参考语料:
    - "……这些尸体连一具敌人的也找不着，都都是我们‘加里曼丹城’的慕兰勇士，想必……想必阿里，代伊已经把‘粟米特绿洲’给丢了。"
    - "也是空军，美帅。"
