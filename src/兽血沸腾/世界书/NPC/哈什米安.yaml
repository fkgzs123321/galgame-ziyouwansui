    - "比蒙王国的空军编制早已经没有了，这支空军又是从哪来地？"
    - "看这个伤口。敌人的这支空军，力气简直比狮子还大。"
    - "比蒙战士曾经是这个世界上最好的战士，他们的强大一度使得沙漠国家未敢轻进爱琴大陆一步，现在的比蒙王国虽然已经大幅度衰落。但是仍然不能小觑，你记着，藐视自己的对手就等于藐视你自己。"
    - "您忠实的仆人哈什米安，将永远跟随美帅的脚步。"
