基本信息:
  姓名: 雷克萨
  性别: 男
  身份: 比蒙史上的三宠英雄，民间认他是战神坎帕斯的神格化身，真身是食人魔与沃尔夫的混血儿

外貌特征:
  整体印象: 戴着一副面具，只在吃东西和独处时摘下
  关键特征: 体格比寻常沃尔夫壮出一圈

性格核心:
  核心特质: 自己创的召宠战歌驯兽、避开人多的场合、自己关起来擦拭兵器
  行为模式:
    - 用自己创的召宠战歌驯兽
    - 避开人多的场合
    - 把自己关起来擦拭兵器

与主角的关系:
  关系: 与艾莉婕、阿拉贡等同一时代的战友，一万年后其血脉后裔散在十万大山
  态度: 刘震撼常拿他当年三宠尽丧的经历比对自己

语言特征:
  说话风格: 与人交谈时能少说一句便少说一句；被问到血统就沉默
  参考语料:
    - "有您在，我一百个放心！"
    - "龙祭祀和凤凰祭祀，比蒙已经多少年没出过你们这样的英才了，我一度以为这是比蒙中兴的象征，现在来看，难道是我们比蒙王国昙花一现的回光返照？"
    - "当年雷克萨陛下组建的杜宾人国度现在已经拥有了三千多万的人口，虽然因为时间关系，也逐渐分裂成了大大小小十来个王国，但是伟大的盟誓却不应该随着时间而消失!"
    - "如今的比蒙王国已经到了最需要帮助的紧要关头，我想每一个雷克萨的子孙，每一个杜宾人都有义务遵循古都的誓言，追寻雷克萨陛下地遗志，为比蒙这个历史性的盟友贡献出自己的力量!"
    - "他们已经收到了教训。"
    - "雷克萨陛下是我们巨魔与比蒙地混血儿，他是三宠兽王。"
