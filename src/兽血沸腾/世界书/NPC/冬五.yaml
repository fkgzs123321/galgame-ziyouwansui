基本信息:
  姓名: 冬五，封号唐藏亲王，皇帝与四殿下称他小五，四哥叫他的封号是每月第一天的霸占
  性别: 男
  身份: 唐藏帝国第五亲王，执金吾领卫，丝绸大陆第一大力士

外貌特征:
  整体印象: 唇红齿白、纤瘦文弱的英俊亲王，一身金黄衮冕，龙镶虎步，和传统印象里的铁塔大力士一点也不沾边
  关键特征: 幼时误食一株金刚草，落下一身六丁六甲之力；行礼用叩肩礼，出手极重

性格核心:
  核心特质: 见面先用地道的戈利德鹰语、话没说三句就往切磋技艺上绕、看中战歌图腾柱
  行为模式:
    - 见面先用地道的戈利德鹰语问候语打招呼，随后坦白只会这一句，是从古籍里按音译乱学的
    - 话没说三句就往切磋技艺上绕，被岔开也不恼，改口把切磋定成双方单独演练
    - 看中战歌图腾柱，先撇清一句自己不能做主，再连夜发火符回去请示皇帝哥哥
    - 谈判时眼睛盯着对方押在桌上的赌资，开口索要一枚天然纳芥珍珠换人情
    - 验货极细，看见镜炮与图腾柱便逐项问出口条件，连魔法定律师的作用都追问到底
    - 露了一手真本事之后围着人团团乱转，反复道歉，把冒昧两个字嚼了半天

与主角的关系:
  关系: 代表唐藏帝国跟翡冷翠谈军工与贸易的对家，四殿下玄奥的壮汉的弟弟，皇帝是他的二哥
  态度: 称刘震撼为花王陛下，开场就自报小五；谈崩也不翻脸，把话撂明白的同时留足余地
  互动方式: 在七宝塔下用五行防御大阵与万里飞云换一百根战歌图腾柱，出宫时以一口袋香雪稻饯行，还顺手替受伤的三世同堂收下黑白珍珠耳链

语言特征:
  说话风格: 一口一个陛下，先捧一句再把条件摆出来；讲到钱与利益时措辞最直接
  口头禅: “花王陛下”、“小五”
