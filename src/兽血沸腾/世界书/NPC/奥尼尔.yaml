基本信息:
  姓名: 奥尼尔，全名沙奎尔·奥尼尔，绰号奥胖
  性别: 男
  身份: 豪斯族河马诗人，自号爱琴大陆第一吟游诗人

外貌特征:
  整体印象: 河马诗人，一张咧到耳根的大嘴，铡刀状的门齿，浑身一层层脂肪褶子，常年只穿一条皮短裤
  关键特征: 手不离古尔冬琴；出阵时换上皇冠荆棘战甲，配巨斧与破甲战锤

性格核心:
  核心特质: 带族人在桑干河边流浪、老板让他戒红土或者跟着混、古尔冬琴当吟游诗人唱
  行为模式:
    - 带族人在桑干河边流浪，开口先报族名和三百来口人的数目，只为讨一点红土
    - 老板让他戒红土或者跟着混，他先喊强迫，转头答应得痛快
    - 拿古尔冬琴当吟游诗人唱，招呼全族河马一块儿和声
    - 用密集阵电棒逼供绿魔萨满，提议拿土蝮蛇当鞭子
    - 逢上战事主张智取，被堵在矮檐下就先低头
    - 改行做箭手做到殿帅级，能控五弓，把那张战弓当成命根子
    - 替老板出面争名分，落款一律署上爱琴大陆第一吟游诗人的名号
    - 需要换装备时，拿戒指去换蝎龙与朗星护腕

与主角的关系:
  关系: 刘震撼收下的附庸族头面人物，从流浪的河马诗人做起
  态度: 嘴上讨价还价，真到事上把老板的旗子举得比谁都高
  互动方式: 替刘震撼带河马与獒人的射手队伍、出使别族、给凝玉当挡箭的靠山；老板一使劲拉那张战弓，他就心疼地抢回去

语言特征:
  说话风格: 唱腔式的抑扬顿挫，句尾常带一声长叹，谈条件时先诉苦
  口头禅: “契得玛利亚～”
  参考语料:
    - "潘帅，去，给我拿把笤帚过来。"
    - "我们河马一族是天生的吟游诗人，希望大人您不要剥夺我们这个爱好！"
    - "如果对方真有古力火铳，我们该怎么办？"
    - "我去帮老板娘打下手。"
    - "老板，要不要砸了这个魔法阵？"
    - "契~大丈夫流血不流泪，真没出息，亏它是个超阶魔兽呢！"
    - "老板，老板娘！你们不是在怀疑我们河马吧？"
    - "战神在上！我们河马可不是华伦泊儿那种叛徒！"
    - "法典没有记载，这段历史始终很模糊。"
    - "老析现在说话越来越象我了，象一个完美的诗人。"
