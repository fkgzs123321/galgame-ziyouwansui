  参考语料:
    - "你修炼的应该是植物系魔法，听若尔娜说你的武技也很是了得，这块魔芯是植物系的，延伸弹性高达二十米，可以变幻成任何武器，对魔法释放也有不错的很强大地储魔和增幅效果。"
