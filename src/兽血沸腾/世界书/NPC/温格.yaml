  行为模式:
    - 把晚辈的修行境界一条条摆出来度量
    - 出席龙城的颁封礼作见证
    - 一开口就把场面压住

与主角的关系:
  关系: 以李察外祖的身份出席龙城的领主颁封仪式，替他撑住场子
  态度: 若尔娜身上也有他八分之一的血脉

语言特征:
