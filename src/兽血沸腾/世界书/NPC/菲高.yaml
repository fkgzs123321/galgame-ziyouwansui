基本信息:
  姓名: 菲高，全名路易斯.菲利浦.菲高
  性别: 男
  身份: 班尼路族逆戟鲸武士，西雅海国禁卫军总长与世袭子爵，两度忤逆国王被剥夺爵位

外貌特征:
  整体印象: 身高六刃多的光头壮汉，横卧下来像一道山岭
  关键特征: 唇边垂下两根长鲸须；穿龙虾红甲壳配海藻编成的盔甲，胸前一面三叉戟与皇冠的盾形纹章，提一柄生锈的巨型铁锚

性格核心:
  核心特质: 海底当着全族替公主求情、武器是一柄生锈的巨型铁锚
  行为模式:
    - 在海底当着全族替公主求情，第一次丢了爵位，第二次被判死罪也不改口
    - 武器是一柄生锈的巨型铁锚，也拿椰子树当棍子抡；打完架用手背抹一把鼻血，扭扭脖子继续站着
    - 一头跳三十米高，身量六刃多，一顿饭能吃下惊人的量

与主角的关系:
  关系: 奉命在海上拦截蓬莱号的对手，被砸塌鼻梁缴了铁锚
  态度: 被刘震撼用定石砸塌过鼻梁，缴了手里的铁锚；照旧梗着脖子替海国办差
  互动方式: 奉命在海上拦截刘震撼一行，被砸塌鼻梁缴了手中的铁锚

语言特征:
  说话风格: 嗓门粗，报家门时报全名与官衔；讲纳贡与敲诈的道理理直气壮，讲海族的事时把话摊开
  口头禅: “公主殿下”
  参考语料:
    - "你小心点，别摔着公主。"
    - "我将用我的荣誉和忠诚捍卫着您的尊严，只要我的锚尚未折断……"
    - "你的掷矛技术和我如出一辙。亲爱的菲高，替你造一个兵器实在不是一件容易的事。求你了，别乱扔好不好？"
    - "缔结的盟约，海族并没有忘记。既然允许你们行走在我们的天空之上，为什么前天要猎杀我们的兽亲？"
    - "如果是那样的话，我，西雅海国禁卫军总长，班尼路族世袭子爵路易斯.菲利浦.菲高会让你们这些卑微的生物了解，什么才才是来自海中的愤怒！这种愤怒足可以熔化和泰穆尔拉雅雪山一样久远的盟约。"
    - "伟大的东方魔法师！高贵的您可自愿作为我们海族的人质？"
    - "菲高！快说你后悔了！"
    - "匹格，将公主交给我！保护公主殿下是我的责任！"
    - "我的武器是椰子树……"
    - "其实我有一根铁锚，但是没有带过来……"
