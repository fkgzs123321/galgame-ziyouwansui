基本信息:
  姓名: 四殿下，通称玄奥的壮汉殿下
  性别: 男
  身份: 唐藏帝国四殿下，唐藏国王的弟弟，半路出家的苦行僧侣，以托钵与金环杖行游大陆，在墨晶峡谷被刘震撼与维埃里从黑暗精灵手中救出

外貌特征:
  整体印象: 光头上一道圆形伤疤，戴雪白色斗笠，着一身华贵却陈旧的丝袍，一手托钵一手持金环杖

性格核心:
  核心特质: 斗笠与九环锡杖交给身后的学徒、盘腿坐在玉蒲团上谈佛理、临阵旋身抛出一圈金色光罩
  行为模式:
    - 把斗笠与九环锡杖交给身后的学徒
    - 盘腿坐在玉蒲团上谈佛理
    - 临阵旋身抛出一圈金色光罩把身边的人罩住

与主角的关系:
  关系: 唐藏帝国派到爱琴的皇室代表，小空与小净的师父，五殿下冬五的四哥
  态度: 认定刘震撼修成金刚琉璃身，见面便要下拜；也当面点破小空与刘震撼花王花将一体共生的缘分
  互动方式: 为小空与刘震撼认下花王花将的缘分

语言特征:
  说话风格: 把佛门偈语掺进家常话里；教训弟子时嗓门不高，喝断就一句；认定刘震撼是金刚琉璃身，非要拜上一拜
  参考语料:
    - "五弟，胜负心太炽不是什么好事，你需要保持一颗平常心。"
    - "早安，尊敬的四殿下。"
