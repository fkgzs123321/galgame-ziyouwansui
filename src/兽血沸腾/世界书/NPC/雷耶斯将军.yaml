基本信息:
  姓名: 雷耶斯将军
  性别: 男
  身份: 威瑟斯庞城军事主帅，福克斯族将军，东北行省土伦军团前锋兵团最高军事主官，王立军事学院高才生

外貌特征:
  整体印象: 福克斯狐族，一条红色狐尾
  关键特征: 在沙漠里走久了，尾巴上挂满盐霜像一根狼牙棒；得胜之后尾巴与脸色一个颜色

性格核心:
  核心特质: 入沙漠前备下五块精美手绢、发现全军饮水量超出军部标准、守城前把预备队
  行为模式:
    - 入沙漠前备下五块精美手绢，边吐边擦
    - 发现全军饮水量超出军部标准，写成质疑报告上呈
    - 守城前把预备队、弹药、火力的批次写满一张纸

与主角的关系:
  关系: 与刘震撼在守城方略上激烈争执并两度晕厥，仍被国王要求挑起守城重担
  态度: 从刘震撼手里接过丹药箱与火力调度的安排，把夏宫卫队当成自成体系的友军

语言特征:
  说话风格: 报战果时把敌军的实际人数报得比侦察结果更高；请示军务用敬称「冕下」，一句话带三处客气；讲到用兵之道就搬出骑士精神的说法
  参考语料:
    - "怎么会不够地？离开牛津绿洲才八天！才八天啊！"
    - "请说，我的冕下。"
    - "冕下的话太言重了。"
    - "冕下，其实这个念头我早就有了，不过本部所属的空骑士全部在您的麾下，没有您的指示，我不敢越权调拨。"
    - "其实沙漠人类强盗，倒和我们比蒙骑兵非常相象，他们不擅长使用弓弩，也不喜欢使用长度惊人的骑枪，而是喜欢用战刀肉搏，近距离投掷标枪，对付步兵，实在是占足了便宜。"
    - "如果硬拼重装骑兵的话，他们这种轻骑兵的确是死定了。"
    - "如您所说，这些家伙都非常狡猾，如果逃跑的话，重骑兵拿他们没辙。我感觉在沙漠里作战，和我们在多瑙大荒原上有着太大的不同。"
    - "冕下，是不是准备开战了？"
