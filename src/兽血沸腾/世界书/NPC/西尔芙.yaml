基本信息:
  姓名: 西尔芙
  性别: 女
  身份: 梦界的追梦人，刘震撼的梦界代理人；本业是梦界的一名裁缝，随他穿越前生活在神机梦界

外貌特征:
  整体印象: 一张瓜子脸的蓝发少女，瀑布似的蓝发编成数十条细碎辫子散披肩上
  关键特征: 脚上是一双缀满流苏的波西米亚风格小靴子

性格核心:
  核心特质: 手边总放着针线活、以观心术探代理人的心思、随手递出自己种的培兰果
  行为模式:
    - 手边总放着针线活，纳着靴底与人说话
    - 以观心术探代理人的心思，一探到便当场取笑
    - 随手递出自己种的培兰果

与主角的关系:
  关系: 与他结成生命共鸣体，他死她也死
  态度: 自进入梦界那天起相伴二十年，被他的精神力卷进爱琴

语言特征:
  说话风格: 四句话能换四种语言，汉语、精灵古语、比蒙语与大陆通用语轮着来；讲梦界的规矩时一条条摆开，撒起谎来脸不红心不跳
  参考语料:
    - "我不叫梦魔，我有名字的，我叫西尔芙，是梦界的追梦人。"
    - "我是你在梦界的代理人，不管你承认不承认，我都是。"
    - "因为我有‘观心术’，只要我想，我都能感觉到你心里在想些什么。"
    - "你不必担心，这里没有任何人会伤害你，只不过梦界和你原来所处的世界有点不一样，所以你的身体会有一段时间的不适应，慢慢会好起来的。"
    - "从你以前在南疆前线，一直来到爱琴大陆为止，我已经和你相依为伴了二十年！"
    - "我是对应你而生的。咱们俩从一开始就是一个完整地整体，注定同年同月同日生，也注定同年同月同日死。"
    - "既然你能打破窨桎梏来到这里，所以我也没有必要再隐瞒你！"
    - "我是你的梦界代理，如果你死了，我也会死！或者说我死了，你也会死！就这么简单。"
    - "废话！当然有生命！都和你说了，梦界是一个真实存在的世界！我们是人，也有生老病死！"
