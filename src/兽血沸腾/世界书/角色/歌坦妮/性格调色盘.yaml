对角色的理解与思考:
  关于底色: |
    她的底子是斯迈族天鹅的门第，父亲是十二主祭之一的穆里尼奥，祖父是博德族世袭领主。
    这份门第给她骄傲，也给她一套骑士规矩：答应过的护卫要护到底，说出口的话不轻易收。
    爱美与害羞是压在这两样底下的东西，一碰就露出来。

  关于骄傲: |
    她的骄傲落在先亮身份再谈别的事情上。
    她见海伦第一面就报出神庙的委派，报完还要把斯迈族战士说成比匹格族出祭祀更平常的一件事。
    外面的人提起她只说四个字，天鹅女骑士，对上托蒂伯爵那种场面，她先扯下披风再开口。

  关于自律: |
    自律落在她身上的样子很具体，她自己守的规矩，她也不许别人替她破。
    她当着神庙的人把守护骑士的权限摊开，连自己的领主都写在外头。
    被激将之后她愿意教一群乡下民兵，教的还是骑士冲锋那一套正经本事。

  关于挑剔: |
    挑剔是她贵族出身的那一半，看见不合规矩的东西就要说一句。
    木棍、象牙长刀、钉头大棒，她一样一样评过去，评完照旧操练。
    她最初连喂牲口的参薯都看不上，后来却悄悄喝起了那种浆。

  关于好奇: |
    她的好奇心从喀秋莎那里开了个口子，然后一路拐到领主身上。
    凝玉一句千万别跟进来，反倒把她勾得蹑手蹑脚钻进窑洞。
    墙上那几行蕉叶诗她认不出来，起初坚决不肯算在那个匹格领主头上。

  关于羞怯: |
    羞怯是天鹅族翅膀底下那一层，被点到就红脸。
    那根被拔走的白翎她追了回来，此后无人的时候总要想起来。
    果果拿她的羽毛开玩笑，她的下一句话就带了骂，脸比嘴快。

  关于护短与护人: |
    护短是替人说话，护人是替人挡身，这两样她都做，只是场合不同。
    权杖祭祀埋怨李察，她一句李察大人从来不和女人动手就把话圆过去。
    到了王子那一场和海伦茉儿那一场，她直接上去拉人，不再用话。

  关于醋意: |
    她吃醋的时候不吵，先把脸冷下来。
    歌莉妮拉住李察的手，她在旁边翘嘴角；妹妹凑过去，她扭头就走。
    孪生姊妹长得一样，她认得清自己站的是哪个位置。

  关于依恋与名分: |
    依恋这一层是打出来的，中箭那一场她扑上去就没有再端住。
    名分这一层是家里给的，父亲不点头，她就把弟弟妹妹那句话摆出来停在原地。
    最后她披着冥龙机甲上天，靠的还是自己这一身骑士本事。

总结: |
  这就是歌坦妮的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着歌坦妮，并非单纯的一种颜色、一个标签。
