私密档案: 歌坦妮的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 歌坦妮
种族形体: 斯迈族天鹅女。人身，背上一对洁白羽翅从肩胛后长出，翼骨与脊椎连成一体，展开宽过一人。翅膀等同于尊严，比蒙里没有谁敢亵渎，摸她的翼根比剥光她更重。族中示爱是交换翅膀上的翎毛，一位天鹅少女一生只拔一根，交给丈夫。为护羽翅，她睡觉一律趴着
朱颜血: 丹红砂痣，长在手臂上，是斯迈族天鹅女子的贞洁标记，一生只嫁一人，作不得假。破了就褪，褪出来的那根血翎鲜红，长在洁白的翅膀上

外观:
  身量: 高挑，骨架长，站直了肩背挺成一条线，动起来是骑士的步幅。银甲包不住的那点曲线全落在腰和腿上
  奶子: 一对挺翘的奶子，底盘不大，乳肉压手，一手兜得住，指缝里挤得出一点。皮薄，底下透出淡青的血管。隔着亵衣托一把，份量比看着沉
  奶头: 小，淡粉色，平常是平的，缩在乳晕里。受冷或者动情才立起来，立起来高出乳晕小半个指节。被隔着甲胄含住吮的那一次她记得，麻劲从乳根一路上了头皮
  乳晕: 小，颜色浅，边上没有界线，往外一圈一圈淡下去。上面一层极细的颗粒，指腹抚过去发麻
  逼: 毛稀，颜色跟头发一个色系。里头窄而紧，只被鸡巴插进去过一回，捅到底有一块软肉挡着。水来得快，一沾就顺着会阴往下淌，淌得到屁眼口
  阴唇: 两片阴唇薄，合得严，是没怎么见过日头的浅粉，掰开带一点黏的阻力。大阴唇只浅浅鼓起一道，小阴唇更薄，两片贴得齐整，合起来只剩一条细缝，边沿压一线比周围更浅的白，是常年束在亵裤和甲胄里没见过日头的颜色。皮面干爽细滑，没有皱褶，指腹按上去先觉出薄，再觉出底下那层软。动情来得快，先渗出来的水积在缝里，两片才慢慢往外松开一道湿亮的缝，一沾就顺着会阴往下淌，淌得到屁眼口
  阴蒂: 小，藏在两片阴唇上端的褶子里，拨开才看得见。指腹沾水揉上去，她整条腰往上弹
  屁眼: 颜色浅，褶皱细密，一圈一圈收得紧。没人动过。手指干着抵上去，括约肌猛缩一下，得揉很久才松
  腰腹: 腰细，两只手圈得住。小腹平，肚脐浅。腰上没赘肉，皮下是薄而韧的肌，按下去先硬一下再软
  臀部: 圆，翘，靠腰托着。常年骑铁十字兽，臀肉紧实，一巴掌拍上去回弹，不晃
  腿: 腿长，比例是照骑士的尺子长的。大腿根白，内侧的肉嫩，掐一把留印。膝盖上有一点骑甲磨出来的硬皮，小腿线条直
  足: 脚窄而长，脚背高，脚趾齐，指甲剪得极短。天鹅族爱水，她的脚一泡进湖里就不肯出来。脚心被含住会往回缩
  手: 指节细长，手背白得见青。虎口和指腹有常年握剑磨出的硬皮，摸上去一半滑一半粗。她惯常戴一副银线手套，脱下来才露这双手
  口舌: 嘴唇薄，唇色淡，咬过才红。舌头软，用起来往里收不往外推。她给人含过，含完很长一段日子不敢抬眼看人
  腋下: 干净，没有毛，皮薄。手臂一抬，被碰到就夹紧
  发肤: 白金色的长发，长度过腰，垂下来是直的。皮白得过分，通身滑，是滑若凝脂的那种滑。贴身凑近是一股处子的幽香，凑到发上另有发香
  羽翅: 一对洁白的羽翅，展开宽过人，羽片一层压一层，最外一圈长翎，里头全是绒。翼根在肩胛骨底下，肉厚，是全身最要命的一处，手指扣上去她整个人就软。收起来贴在背上，睡觉压着会麻，所以趴着睡。破瓜以后翅膀上多出一根血翎
  标志: 嘴唇下角那颗黑色美人痣、白金色的长发、背上那根血翎、惯戴的银线手套

气味:
  体味: 处子的幽香。近身才闻得到，不甜不腻，是冷的那种香，混着发香。她本人极干净，衣裳一日一换
  逼味: 干净。凑近了只有一点温热的皮肉气，不腥不酸
  动情味: 动情以后腿上那股味道变沉，发闷，隔着裙子也压不住，跟她平时那股冷香是两路
  汗: 出汗少，汗是凉的。练武拆甲以后里头一股铁腥气，是甲胄焐出来的，洗了就没了
  经水: 量少，颜色淡，气味轻。她照旧骑铁十字兽操练，从不为此改日程

分泌物:
  爱液: 来得快。贴着耳朵说几句话，大腿间就先渗出一点，色清，拉得开丝，量不小，淌下来是温的
  初夜: 落红不多。朱颜血当晚褪去，褪成翅膀上一根鲜红的血翎
  奶水: 没生育时没有。怀孕后期到哺乳期才有，涨得硬，会拉人的手过去按
  眼泪: 来得急，量多。她哭起来咬着不出声，一串一串往下砸，睫毛上挂得住

敏感带:
  翼根: 最要紧的一处。手指从翅根底下扣进去，她腰立刻塌，站不住，得扶东西
  翅尖与翎管: 翎管被指腹顺着捋，从翅尖一路麻到后颈，她会把翅膀抽回去再伸出来
  翅内绒羽: 绒羽被鼻息吹到，整条翅膀抖，抖完自己用翅尖把脸盖住
  后颈与发根: 长发被撩起来，后颈一露在空气里，她就缩肩。含住后颈她抬不起头
  耳畔: 贴着耳朵说话、含耳垂，她半边身子发软，会去推人
  奶头: 捻、含、咬都吃得下。含住吸的时候腰会一下一下地拱
  阴蒂: 碰一下腰往上弹，再碰就伸手去抓人手腕
  逼口: 舌尖绕圈舔的时候她按人后脑。头一回进去，两片阴唇咬住不肯松
  腰侧: 被手掌箍住就使不上力，往前推也推不动
  手心与指根: 手指被含住、被一根根舔过去，她会攥紧，把人的手拉到自己脸上

名器:
  名目: 雪翎敛翼
  由来: 斯迈族天鹅的翅膀合起来的时候连风都穿不过，她这一身把合翼的劲道长在了逼里，一层一层往内收
  表现: 鸡巴插进去以后逼肉像羽片一样一层压一层，每进一分多收一分，收到最深有一道横箍，箍住龟头不放。肏得越急收得越紧，射得快的人撑不过几下
  代价: 合翼这门劲道吃她的腰力和斗气。用狠了第二天上不了铁十字兽，腿根发抖，得打坐吐纳半天
  名声: 王都的酒馆里传，天鹅女骑士那张脸看一眼都算亵渎，别处更别想。穆里尼奥把这道门守得死，求娶的人连面都见不上。她本人听见这话就把脸冷下来

性癖:
  翼根被握: 从背后做的时候要人一只手掌住翼根。握住了她整个人往人身上倒，再怎么骄傲也端不住
  被夸: 吃夸。夸她美、夸她腿长，她嘴上说无聊，水却多一层。她自己也会数着说自己不比妹妹差
  用嘴: 她给人含过，含的时候往里收。这件事她认得最死
  干净: 事前事后都要热水和一方白手帕。做完不洗就穿衣裳，她一整夜睡不着
  侧身与跪伏: 仰面躺着翅膀压在身下会麻，她最常用侧身和跪伏，把翅膀整条留给对方的手
  认名字: 动手之前一定要人先叫她的名字。孪生妹妹跟她长得一模一样，她被认错过一次，从此不许人在床上认错人
