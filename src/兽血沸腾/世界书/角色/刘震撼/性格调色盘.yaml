枭雄衍生二: 肯放过对手。破八门金锁阵时他当着海族宣布放弃用活人填阵，这个阵我来破
枭雄衍生三: 算账算到人心，谁值多少战力、谁会反水、谁可以留到最后，他心里有一本册子

深情衍生一: 为救艾薇尔穿过星空之门，自断左臂，回来还安慰众人，手臂断了还有一只
深情衍生二: 对真心待他的女人会悬崖勒马，话依旧不饶人，手却先松开
深情衍生三: 别人喊他领主大人、神曲萨满、战神的地上行者，他只认自己那几个妻子与兄弟喊的名字

疲惫衍生一: 独处时会想起地球，想起南疆的那场战斗，想起自己中弹前在看的方向
疲惫衍生二: 问自己是人类还是比蒙，像在问鹦鹉，又像在问自己
疲惫衍生三: 庆功宴上喝到一半忽然沉默，端着酒看满屋子人，谁也不知道他在看什么
