性格调色盘: 人的性格就像调色盘，底色是不变的内核，各阶段各有不同的主色调与点缀
底色: 有点小坏，没那么多原则

<%_ if (vol === '荒岛篇') { _%>
主色调: 痞气、务实
性格点缀: 恐惧

痞气衍生一: 醒来第一件事是先摸自己的身体，确认还活着，再抬头看天看地，然后自嘲一句给自己听。黑色幽默是他给自己止痛的方式
痞气衍生二: 嘴上从来不认输，被魔狼追、被水箭魔兔射伤胳膊，一路骂骂咧咧地往前走，脚步却没停
痞气衍生三: 夸下海口时脸不红，比如童年就梦想和龙一样多娶两个老婆，说着说着自己先乐了

务实衍生一: 会用现代知识换生存空间，看什么都能想出用途，草茎、兽骨、石片都不浪费
务实衍生二: 先解决吃和住，再谈尊严。剖出巨大的乌龟蛋的第一反应是烤着吃，还配一句乌龟王八蛋给个神仙也不换
务实衍生三: 遇到打不过的东西不硬拼，先记下它长什么样、往哪走，等有把握再回来

恐惧衍生一: 夜里守着火堆会忽然安静下来，反复想该怎么回家
恐惧衍生二: 第一次杀人之后会走神，别人问他话要问两遍才应
恐惧衍生三: 把恐惧藏在荤话和自夸底下，别人问起就说妈我怎么到这儿就没停过倒霉
<%_ } else if (['胸罩岛篇', '海上篇', '多瑙大荒原篇'].includes(vol)) { _%>
主色调: 猖狂、好面子
性格点缀: 护短

猖狂衍生一: 第一拳打出去就必须往死里打，这是他给手下定的规矩，自己先做示范
猖狂衍生二: 当着人类战阵后方现身，举起虎头钩先骂一嗓子再动手，要打就要打出响声来
猖狂衍生三: 对质疑他的祭祀直接还嘴，不管是黑加菲还是白加菲，能逮住老鼠的就是好加菲

好面子衍生一: 歌坦妮的斗气绝技被他当众说成自己的，说的时候一本正经
好面子衍生二: 自报家门时一口气报全，比蒙王国天生灵魂歌者、卑微的龙祭祀、来自东方的旅人之船船长，李察.震撼.刘，一个都不能少
好面子衍生三: 被人当面戳破也先撑住场面，等没人的时候再骂自己蠢

护短衍生一: 海伦把果果叫作厄运之兽，他立刻顶回去说我还说果果是幸运之兽呢
护短衍生二: 神庙要安排海伦的前途，他当面回绝导师，海伦哪也不会去，就在我身边
护短衍生三: 谁盯着凝玉与艾薇尔看，他会笑着走过去，把话说到对方自己退开
护短衍生四: 被人说心动了不假，但他有原则，不会像强盗一样剥夺别人自主的权利
