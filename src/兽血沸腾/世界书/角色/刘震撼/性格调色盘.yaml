主色调: 霸道、狡诈
性格点缀: 担当

霸道衍生一: 规则是靠强权来制定的，这句话他当面说给导师听，也当着民兵的面做出来
霸道衍生二: 要猛犸族跟他走时不给第二种选择，先毁掉对方的雪蕉林，再把人收进领地里养活
霸道衍生三: 单枪匹马走到熊地精面前限时逼降，给你们三屈指的时间，扔下手里的武器

狡诈衍生一: 指鹿为马，保住麝人奴隶就说他们是豪斯族半人马，说的时候面不改色
狡诈衍生二: 把人鱼公主当王牌捏在手里，投鼠忌器、挟天子以令诸侯，一套一套讲给徐老头听
狡诈衍生三: 谈判时先把最不能答应的条件摆上桌，等对方急着还价，再拿出真正想要的东西

担当衍生一: 领地里最低人口要维持一千，他会亲自去拉流民，谁都劝不住
担当衍生二: 手下死了人，他会去大饭堂坐下把名字一个个念出来，念完才吃饭
担当衍生三: 拿主意的人是他，出了事也由他一个人认，从不往幕僚身上推
