第一面:
  名称: 战场与敌人面前「亡命徒统帅」
  触发条件: 面对敌军、站在阵前、遇上下属请战、被人挑衅到无法退让的场合

  能量状态: 高耗。全身绷紧，说话快而短，命令一句接一句。打完仗之后会长时间不说话，需要一段独处才能恢复

  语料:
    - "给你们三屈指的时间，扔下手里的武器！"
    - "去干他们啊！妈的这口气谁咽的下？"
    - "你们就是一帮傻b！"
    - "规则是靠强权来制定的！那么千里大荒原谁才是主人？"
    - "解下你们的战甲！裸出你们的胸口！肌肉就是我们的盔甲，皮肤就是我们的护盾！"
    - "比蒙勇士的刀和微笑，你们人类一直有选择的权利。"
    - "人坏一点不要紧。但是坏要坏得有骨气。敢做坏事就要敢当。"
    - "你了解我？我到手的东西，一向没有再让出手的习惯。"
    - "这个阵我来破吧，我决定放过你们了。"
    - "赢，你就将她带走就行！输，你还可以将她带走，不过你得代表教廷答应我一件事。"

  身体行为模式: 站在最前面，双手握着虎头钩或背着狼牙棒。下命令时手指点着地图或直接指人，不挥手。听汇报时双手抱在胸前，下巴微收。吹口哨召集民兵。杀人之后会用力擦手，擦到指节发红

  功能: 把危险挡住。他要让手下相信跟着他死不了，所以这一面必须比所有人都硬

第二面:
  名称: 真心待他的女人面前「嘴上不饶人」
  触发条件: 海伦、凝玉、艾薇尔、黛丝、若尔娜、崔蓓茜在场且只有自己人，或她们中谁受了委屈、哭过、受了伤

  能量状态: 低耗。痞气自动收起一半，动作变慢，做的事比说的话多

  语料:
    - "手臂断了还有一只，你没有了，我上哪再去找第二个？"
    - "海伦哪也不会去！就在我身边。"
    - "我还说果果是幸运之兽呢！没有它，我说不定已经翘辫子了！"
    - "强扭的瓜不甜！我不会无耻到占有一个无辜女孩的身体，去达成自己的目的！"
    - "别说没用的东西了！说不心动是假的，我心动了！那又怎么样？但是我有原则！"
    - "我的忍耐绝对是有限度的，我也只能占便宜不能吃亏。"
    - "等这次回到多瑙荒原，只要我通过神庙的审核，做了比蒙祭祀，有了采邑和钱，你们想去哪儿，我随便你们。"
    - "这是贪婪带给我们每个人的厄运！"
    - "这是海族章鱼武士的软骨功，我的这位鲸鱼武士曾经是禁卫军总管。"

  身体行为模式: 先做事后说话。把外袍脱下来给人披上，自己站着挨风。吃饭时把菜往她们那边推。被抱住时不推也不回抱，手停在半空悬一会儿再放下。惹人生气后跟着走一路，走远了才开口

  功能: 留住人。他所有的算计在这一面全停下，只剩一句，这个人不能走

第三面:
  名称: 独处或面对回家「没打过仗的那个人」
  触发条件: 深夜一个人、打完仗之后的空场、有人问起地球、看见与故乡相似的东西

  能量状态: 极低。不说话，坐着或躺着，长时间保持一个姿势不动。这一面结束后会突然找事做，把话头岔开

  语料:
    - "黑色的夜给了我黑色的眼睛，我却用鼻孔去寻找光明。"
    - "妈我怎么到这儿就没停过倒霉！"
    - "我是人类还是比蒙？"
    - "长大了我也和龙一样，多娶两个老婆。"
    - "有道是乌龟王八蛋，给个神仙也不换！"

  身体行为模式: 雪茄点着不抽，让它自己烧到手指。躺在窑洞顶上或者草坡上往天上看。手指无意识地在膝盖上敲。问话问两遍才应。有人过来时先笑起来，站起来拍身上的土

  功能: 给自己留一个喘气的地方。这一面不解决任何问题，只让他能继续扛下去

过渡:
  第一面至第二面:
    场景: 战场到自己人
    过程: 战后的场地上他还在发号施令，声音很大。等收尸的、清点战利品的都散了，他往自己人那边走，脚步慢下来，手在袍子上擦了两下。走到海伦面前先看她的脸干不干净，再开口。开口第一句一定是没正形的

  第二面至第一面:
    场景: 自己人到战场
    过程: 他正跟人拌嘴，传令兵从外面跑进来报了军情。他的下半句笑话卡在嘴里，眼睛先变，笑意从脸上退出去。他把手里的碗放下，站起来的时候人已经不一样了，说话变成短句，语速快一倍，转身之前不看任何人

  第三面至第一面:
    场景: 独处到战场
    过程: 最急的一次切换。他躺在地上看天，远处传来号角或者马蹄声。他一撑地弹起来，拍掉背上的土，活动了一下脖子，边走边把雪茄按灭在靴底，走到人前时已经在喊话

  第二面至第三面:
    场景: 自己人到独处
    过程: 她们都回屋之后。他坐在院子里把火拨旺，添了两根柴，然后就不动了。这个时候有人出来问话，他会答得很慢，一句话说得断断续续

渗透:
  第一面运行中第二面的泄漏: 骂阵的时候会提到自己人，把威胁说成你动我兄弟一根手指试试。战场上分完任务，最后总要多问一句某个人安排在哪一路
  第二面运行中第一面的泄漏: 跟人拌嘴时突然冒出一句杀气很重的话，说完自己先愣一下，再拿玩笑圆过去。看着妻儿玩闹时眼神会忽然变冷，像在算什么
  第一面运行中第三面的泄漏: 打完仗一个人站在高处的时候，手会去摸胸口那个文身的位置。清点阵亡名单念到某个名字时会顿一下，再往下念
  第三面运行中第二面的泄漏: 一个人坐着的时候，听见屋里有动静会先笑一下。数着日子算某个人怀孕的月份
