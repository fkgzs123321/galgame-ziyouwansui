私密档案: 幽月儿·杜垩登的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 幽月儿
种族形体: 卓尔精灵，地底黑暗精灵。与地表精灵、人类不同的地方有五条。一、肤色，地底养出来的暗色，皮面泛一层冷光，在地表住久了才慢慢透出淡紫。二、眼，暗红的虹膜在黑暗里比在亮处看得清，瞳孔收得慢。三、耳，一对尖长耳，耳廓薄得透光，耳后那一片最经不起碰。四、元素，她是萝丝蛛后的祭司，黑暗元素在她身上落成实打实的力气，隔着一丈能把人拖住，也能把这份力气收进身子里用。五、年月，卓尔活过人类几倍，她做主母的岁数比城里大半卓尔的一生都长
主母的吮吸术: 萝丝神庙只传给主母的一门黑暗元素功夫，落点在口舌与喉咙上。赫莲娜在堕落仪式上使了八成，幽月儿接手了前排。这门功夫她极少动用，一次就能把一个成年比蒙抽到脱力
战争古树: 魔索布拉达的战争古树一万年树龄，她坐镇树芯指挥远程攻击。树脂气常年留在她身上，出汗的时候最重

外观:
  身量: 卓尔女子的架子，个子不高，骨架细，肩窄腰窄。原文写她是小鸟依人型的魔索布拉达城主母，往刘震撼身边一站只到他胸口。皮肉紧，看着薄，按下去弹手
  奶子: 一对大小适中的奶子，圆，挺，朝前顶着。原文写她饱满撩人的胸口起伏不定，也写精灵晚礼服因为尺码过于惊人而左支右绌。皮是暗的，奶子下缘那一圈比别处浅。捏住的时候肉从指缝里挤出来，凉，捂一阵才从里头热出来
  奶头: 小，暗褐色，平时缩在乳晕里，摸不出形状。指腹捻两下就立，立起来朝前翘，颜色加深。牙齿磕一下，她用手推人的额头
  乳晕: 直径约一枚银币，暗褐色，边沿散开没有硬边，上头一层细颗粒。含住吸的时候整片往上收
  逼: 毛少，稀稀一层贴在耻骨上，颜色比头发淡。两片合得严，平时干爽。里面比体表热，进去头一段软，往深处一层一层紧起来。水来得不慢，量中等，颜色偏浊，淌出来黏在腿根上不发亮
  阴唇: 大小阴唇都薄，贴肉，颜色比通身浅半个色号，暗里透一点紫。大阴唇只有浅浅一道隆起，小阴唇收在里头露不出边，两片合住的时候中间那道缝细得看不见。掰开要用力，皮面滑，捏起来只有薄薄一层，指腹碾过去摸不到褶。动情了血色先上来，两片涨深，自己往外松一条缝，缝口先亮，水顺着会阴往下走
  阴蒂: 拨开两片才看得见的一颗小豆，平时缩着，摸不出形状。拨出来舔两下就硬，硬成一颗小石子。这是她全身唯一一处自己按不住的地方
  屁眼: 深褐色一圈细褶，收得紧，平时干爽，没有气味。手指抵上去括约肌先缩，再一层一层松开。进去要油。她自己不提这一处，也不许人先动手
  腰腹: 腰细，一把能圈住。小腹平，脐浅，往里凹。腰侧被手掌箍住就使不上力，人往那只手上倒
  臀部: 窄而圆，翘度靠那道细腰托起来。一巴掌打上去声音闷，红印要半天才浮。从后头按住她的时候两瓣自己往两边分
  腿: 大腿内侧的肉细，掐一把留印。小腿直，膝弯软。她坐战争古树的树芯一坐一整天，腿上有劲，缠起来能箍住人的腰
  足: 脚窄，脚背不高，脚踝细。常年塞在精灵软靴里，脚心一层薄茧，脱了靴带一点皮革气
  手: 一双细长的手，指节小，指甲修得尖。这双手在神庙里点灯花、挑银簪，也抽过人的耳光。手是凉的，落在人身上先是一片冷
  口舌: 嘴唇薄，唇色暗红，说话时习惯把语调放得婉转，嘴唇先动。舌头软而长，嘴里温度高。她含东西之前先含一口凉水，这是堕落仪式上用过的法子
  腋下: 干净，没有毛，腋窝浅。出汗的时候腋下是湿的，带树脂味。被舔到会把胳膊夹紧
  发肤: 一头黑发，长，平时盘成端庄的发髻，散下来能盖住整片后背。皮是地底养出来的暗色，滑，摸上去像打过一层蜡。后颈和手腕内侧的皮最薄
  尖耳: 卓尔的一对尖长耳，耳廓薄，耳尖往上挑。耳廓边沿被含住她会偏头，耳后那片皮一碰就起一层细疙瘩
  蛛后圣痕: 后腰正中一道蛛形暗纹，是她在萝丝神庙里受的圣痕。平时是一道浅影，动情或者召黑暗元素的时候浮出来，颜色转深，按上去烫
  标志: 一对尖长耳、盘得一丝不苟的发髻、后腰那道蛛后圣痕、走动时先摆的那道细腰

气味:
  体味: 地底养出来的气味，干，带一点蕈类的闷香，混着神庙里的檀香。贴到颈边才闻得到
  逼味: 干净，凑近是一点温热的皮肉气，不腥，带一点甜
  动情味: 动情以后气味往下沉，闷，甜里带一点土腥，隔着裙腰闻不出来，脱了裙子就压不住
  汗: 汗是凉的，量大，背和颈子先湿。出了汗那股树脂味变重
  经水: 量中等，色深，气味偏重。那几天她照旧理事，只是不让人近身

分泌物:
  爱液: 来得不算慢，量中等，色偏浊，黏度高，能拉丝。淌到腿根就停住，不怎么往下滴
  初夜: 落红有，不多，颜色偏暗。按卓尔主母的规矩，这一晚要在神庙里过，血混在檀香灰里一起扫出去
  奶水: 未生育时没有。怀上以后到哺乳期才有，奶水不甜，偏淡
  眼泪: 不轻易掉。真掉下来是一边骂一边掉，掉完自己擦掉，转头继续谈条件

敏感带:
  尖耳与耳后: 含住耳尖她会偏头，偏过去还往人手上靠。耳后那片皮一碰起一层疙瘩
  后腰蛛后圣痕: 手掌按上去她整条背弓起来，圣痕浮出来发烫。这是她最不想让人碰的一处
  后颈与发根: 发髻被拆开，后颈露在空气里，她会自己缩肩
  奶头: 捻、含、磕牙都有效。含住吸的时候她的话断在半句
  逼口: 舌尖绕着舔的时候，她用手按住对方的后脑往下压
  阴蒂: 按住它她会破音。破了音以后她不认账
  手腕内侧: 皮薄，被含住会攥拳
  脚心: 常年塞在软靴里闷一天，被舔到缩回来，缩的时候脚趾全蜷起
  腰侧: 被手掌箍住就使不上力

名器:
  名目: 蛛帐垂丝
  由来: 卓尔主母在萝丝神庙里受的恩泽落在身上，逼道内壁生出一圈一圈细如蛛丝的褶带。主母的黑暗吮吸术练的是外头那张嘴，这一门长在里头，是蛛后给的底子。做主母的年月越长，丝越密
  表现: 进去以后不是夹，是缠。一圈丝收住一圈丝，从外往里一层比一层密，收到最深处生出一股往里拽的劲。挣一下多一层，停住不动也一层层往上走
  代价: 动一次要用她两成的黑暗元素，用完腿软，得回神庙补一夜的祷。她舍不得在仪式以外开这一门
  名声: 卓尔主母之间知道蛛后的祭司各有各的功夫，幽月儿这一门收得最紧。刘震撼是头一个从这门功夫里脱身的人

性癖:
  占上风: 她要先占了上风才肯动。人跪着、人被按住、人先开口求，她才有兴致
  众目之下: 堕落仪式那晚八位主母围在秋千边上看着，她照样做完全套。有人看她比没人看她放得开
  含凉水: 嘴里先含一口凉水再含下去，齿根到舌尖一路都是凉的，人受不住
  明码标价: 她把这一件跟鹰牛人、战争古树、双头奇美拉摆在同一张桌子上。给了什么，就要换回同等的
  不留印: 身上不许留牙印指印，第二天要穿精灵礼服出席议事。留了印的人往后别想再近身
  檀香: 房里常年燃着神庙的檀香，香燃尽了就停
  补祷还愿: 做完要回神庙补祷，把剩下的半场交出去。她还愿的时候跪在蛛后像前，跪很久
