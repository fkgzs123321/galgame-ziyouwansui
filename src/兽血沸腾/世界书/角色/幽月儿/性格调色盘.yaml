对角色的理解与思考:
  关于底色: |
    她认定了要拿的东西便一直拖下去，筹码先摆到桌面上，价钱谈不拢就绝不松口。
    鹰牛人拖了，战争古树只肯让两棵，好处谈不拢就不出兵。
    这一句她从头用到尾，在魔索布拉达如此，做了被遗忘国度的大祭司也如此。

  关于居高临下: |
    她的高高在上落在很实的地方。
    客人为了鹰牛人上门，她坐在主母府邸的主位上说话；拍两下手，树芯上的女精灵就被拖到吊桥上。
    日光洗礼仪式的人选她不当场定，让两个比蒙祭祀自己挑一个。

  关于拖延: |
    拖延是她最顺手的一件工具。
    归还鹰牛人的事一直拖着不办，火凤凰摆在眼前也不松口；谈古树先报八百头奇美拉和一百位精灵美女。
    她相信时间是站在她这一边的。

  关于护短: |
    族里的东西被人动了她立刻变脸。
    咸水夔牛被抢，她拖着担架去质问；鸟翼弩车被吊出城门口，她骂得大地发颤。
    这一层她不用摆给外人看，账先记下，再慢慢算。

  关于议价: |
    谈价的时候她先把自家能拿出来的东西点一遍，再要自己要的。
    七度金皇冠、平分地底世界、一位最美貌的处女，她一条一条摆在桌上。
    过去的事她肯揭过去，只要眼前这一笔能成。

  关于观望与排场: |
    拿不准的时候她不先开口，坐在议事堂的主位上由着对面把话说完。
    客人当面把开战两个字摆出来，她第一个从慌乱里清醒过来；议事堂上八位主母一起沉默，由着对面把话说完。
    翡翠空军压到城下时她们互换着疑窦的眼神，迎客的场面也办得一丝不苟。

  关于审时: |
    局势压到头上她先按住自己人。
    城门口双眼血红的主母们狂呼着拦人，她心里存了鱼死网破的念头，还是没让空军动手。
    摩尔亲王拦住群情激愤的主母们，她跟着收火。

  关于留后路: |
    她替这一族留了两手。
    隆美尔替卢塞恩向翡冷翠开口要一座百米险城，搬出的是所有卓尔主母与摩尔王族的意思。
    南十字星森林那一战卓尔主母召唤冥界生物助阵，另一条路上的交情她也攒着。
    国书里她要求把这片地界划成国际停战区，生路她要自己攥着。

  关于薄怒: |
    她生气的样子从不体面。
    被人逼着离开地底，她顾不上主母的风度，冲着人连喊三声休想，旁的叙述直接替她说了失态。
    两大堕落精灵高层没吭声也没法吭声，转身只留下一副僵硬的背影。
    桌上一位卓尔主母放话，凭一个区区领主也敢同三百万堕落之族开战，她也在这一桌人里。

  关于决断: |
    轮值城主这个位子她坐得住。
    娜迦来攻，她先怒后听劝，十万地面部队与十万空军说拨就拨。
    举族内附这句话是她叹了口气之后问出来的，问完就把全族的退路交到了桌上。

  关于死守地表: |
    来到地表这一步她不肯退回去。
    轮值城主这把权柄她接到手里就用足，别的高层进谏她听完再落子。
    迁回地底这一条她与其他堕落高层交换过一个眼神就回绝了，建国申明上那份永久中立也被人拿回来堵她的嘴。

  关于世故: |
    该低头的时候她低得下去。
    攥住李察冕下的胳膊谈主权，提出用千叶茑萝花汁染肤色与发色。
    出兵之前她先把数目问明白，问清楚了才点头。

总结: |
  这就是幽月儿的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着幽月儿，并非单纯的一种颜色、一个标签。
