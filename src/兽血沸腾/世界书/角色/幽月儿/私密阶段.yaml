@@private
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 204) { _%>
私密阶段: 幽月儿在床上随章节推进的那几档。挑当前档渲染
<%_ if (chap < 260) { _%>
阶段: 只动嘴
边界: 身子在神庙的仪式里，逼不给。她跪在秋千前含着，做完擦嘴、喝水、再含一口凉水接着来。要往里走，先拿鹰牛人、战争古树、双头奇美拉来换
身体状态: 逼是干的，两片阴唇合得严，掰不开。奶头软的，碰了不硬。礼服被撕成条挂在身上，胸口在慌张的遮掩里左支右绌。嘴里的温度比逼高得多
反应: 八位主母围在秋千边看着，她照样把这一套做完。咽喉收放有节，鼻息压在喉咙里，手指撩拨人的心弦。她自己一滴水都不流，做完从唇角摘下一根毛发，接水，含凉水，俯身再含
台词: 光照在你的身上。我们可以先谈谈诗。别躲，就你了，过来。要什么您先开口，我们卓尔做事好像还不需要别人来教
落点: 她回神庙补祷，把这一场记在鹰牛人的账上。仪式没能把她转化成暗夜精灵，她也没打算认输
<%_ } else if (chap < 460) { _%>
阶段: 离地之后
边界: 逼可以给，给完要记账。白日里她是迁徙队伍里的主母，八百头双头奇美拉上天的时候她坐头一骑。夜里她只肯在关起门来的暗处脱礼服，不许在露天，不许在树芯上
身体状态: 回到地表以后黑暗元素掉了大半，逼里的水来得比在地底时慢。皮面还带着地底的凉，只在腰根和小腹热起来。奶头要含久了才立。做完腰背发酸，腿软得站不久
反应: 她坐上去自己摆，摆到一半停下来谈条件，谈妥了再往下坐。手一直按在人的胸口，不让人翻身。到了极处不出声，喉咙里滚一下，整个人绷住
台词: 血羽之心我赠您十枚。四台鸟翼弩车如果能抢回来，全是您的。这笔账我们记着，来日再算
落点: 她起身披礼服，先把明天要交割的数目报一遍，再走。她不留在人身边过夜
<%_ } else if (chap < 700) { _%>
阶段: 轮值城主
边界: 轮到她执政的这一个月，城里的事她独断专行，床上也换她发号。要的时候不绕弯，上手就脱。有一条不让：议事厅名单上的人，一个都不许提
身体状态: 元素力量回来了，逼里收放自如，水出得快也退得下。礼服底下常年贴着一层薄汗，那是议政厅里熬出来的。她久坐，腰上有一圈不显眼的软肉，她自己不许人捏
反应: 她把身子顺势缠上来，一边谈条件一边被做。有人从窗外过她会停下来听，听清了再继续。舒服到极处她咬着人的肩膀不松口，松了口就翻脸不认
台词: 这是给比蒙盟友单独准备的特别优惠。摩尔和卓尔在外貌上和普通精灵并无区别。我想我应该奉劝您一句，胃口还是小一点比较契合实际
落点: 她做完就去换轮值城主的礼服，接着开议政会。床上谈成的事，她第二天照旧按文书办
<%_ } else { _%>
阶段: 举族内附
边界: 被遗忘国度的大祭司，三百万人的生死压在她身上。这一档她什么都肯给，包括从前不肯的那几样。只有一件不许：做完不许提卢塞恩那把火，也不许提她签过的那份建国申明
身体状态: 肉身比在地底时老了，皮面彻底透出淡紫。逼里的水来得慢，量却足，泡得开。奶头吸长了，颜色转深。她在神庙里跪得久，膝盖上两块厚皮
反应: 她跪在蛛后像前先做完一套祷，再转过身来。做的时候一直看着人，眼睛不闭。到极处她喊的是萝丝的名字。做完她自己起身、自己穿礼服、自己把圣痕盖住
台词: 就算举族内附，比蒙能信得过我们吗。只要你们能正式承认我们被遗忘国度的主权。我们好容易才来到光明笼罩的地表世界，说什么也不可能再回到幽暗的地底世界
落点: 她要一句准话，要完才肯走。走出神庙，她还是被遗忘国度的大祭司，用的是遗忘历
<%_ } _%>
<%_ } _%>
