私密档案: 波姬小丝的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 波姬小丝
种族形体: 仙女龙，龙族里唯一外表接近人类的一支。五条与常人不同。体温高一截，掌下常是一层干热，冬天不穿皮袄；耐力长，凡人做一场要歇，她能接着再来一回；皮下一层软鳞收在肉里，动情或者上阵才立起；龙角与龙尾藏不住，出城要用城主礼袍与冠压着；元素之体，刀剑伤得了她，术法打在皮上弹回施法的人
城主纹章: 龙角上那道香帕的魔法刺青。阿加西角上是帝波罗，一左一右，两城城主夫妇并立。这道刺青比冠冕认人，压在角石的纹路里，光下才透出一线。指腹顺着它往下划，她会放下手里的事。颁封时她端着那枚无敌龙手打徽章，亲手交到人手里
未亡人: 丧服是她自己量的尺寸，龙角的刺青拿素帛缠住一半，眉心那片龙鳞压在额饰底下。她照旧列席，坐上城主该坐的位子

外观:
  身量: 高挑，肩背比同族宽出一指，是常年并坐站班撑出来的架子。腰细腿长，皮肉按下去先弹回来再陷。人不动，眼睛先动
  奶子: 中偏大，乳型圆沉，重心低，托住了才不往下坠。皮白，淡青血管从乳根走到奶头边上才散。分量压手，捏下去先回弹再陷进指缝。动情以后发胀，皮下软鳞立起，一层细密的硬点。捏重了留一圈红印
  奶头: 小，颜色比同族浅一号，常年裹在礼袍与丧服里，见不着日头。不兴奋时缩在晕里。捻两下才立，立起来顶得住舌尖。含在嘴里吸，她那只手按上人的后脑，按住那一下比松开长
  乳晕: 不大，边沿收得住，界线不散。面上起一层细麻点，指腹擦过去涩手。吮过之后口水干得极快，麻点还立在原处
  逼: 耻骨上留一小片软毛，顺着往下收。两片外唇合得严。口子上那圈细鳞是两片合着的，像两城的城门，得慢慢叩才开一道缝。里头比体表还烫，一层层往里叠的软肉。水起得慢，先谈、先暖、先等她把话说完，一起来量就足，沿着腿根往下淌
  阴唇: 两片都比同族厚一分，贴着身合得紧，颜色浅里透一线深，是常年动情又常年收着养出来的色。寻常干爽，指腹碾过去摸不到褶。兴致上来两片涨成深粉，朝外翻开一线。丧期里这两片收得最死
  阴蒂: 一粒，比同族大一圈，包在外唇上端那道厚褶里，拨开才露头。指甲盖一碰，两条腿绷成一条线。舌尖抵住碾两圈，她收腿绞住人的腰，绞住了不放
  屁眼: 一圈浅褐的细褶，收得死，寻常干爽。指尖抵上去，那圈肉先抽一下，随后一层层松。进去得用油，头一回她整个人绷直。后入要她先点头，点了也只许用手指
  腰腹: 腰细，两手合围还剩一截空。小腹平，只有一层薄肌。腰侧碰不得，从背后一掌扣住，她整条力气就散了。腹面常年勒一根绶带，丧期换成素色，解开留一道浅印
  臀部: 圆，沉，翘度靠腰托起来，是常年骑飞与人形站班两样养出来的。一巴掌落上去响得脆，红印浮得慢。臀缝上端连着尾椎，摸到那里她会缩
  腿: 长，大腿白而直，内侧一层肉最嫩，掐一把留半天痕。她站着做比躺着稳，站得住很久，被架起来时腿才开始抖，脚趾蜷起来又松开。丧服底下的腿她自己背过身去褪
  足: 脚背窄，脚踝细，脚趾长而直。脚心一层薄茧，是龙形落地与人形站班两样磨出来的。脚心被舔她会缩，脚踝被握住往回拉，她撑着榻往后挪
  手: 城主的一双手，指节细长，指甲修得短而齐。这双手端过那枚手打徽章，点过一百头巨龙的家底，掌心托徽章那一块磨出硬皮。握住鸡巴的时候手极稳，稳到人先急
  口舌: 唇薄，色淡，咬过才红。她在厅堂里说话一句挨一句，嘴里含着东西，这条理就散了。舌软，口腔比常人烫，含进去先愣一下，再慢慢往里收
  腋下: 干净，只有几根细软的毛，腋窝浅。体温高，这里出汗最早，一出就是一层薄湿。被舔到会把胳膊夹紧。脱礼袍时她先把肩压住
  发肤: 一头长发，色浅，光下转出几层淡彩，是彩虹龙城这一脉的底色，平时束在脑后。皮肤白得发亮，手放上去滑，烫处比凉处多。皮下软鳞兴头上来从后颈往下一路支起，一片片摸得到边
  龙角: 额上斜出的一对，飘逸清秀。角上烙着香帕的魔法刺青，从角根走到角尖，压在角石的纹路里，光下才透出一线。角根那一圈皮最薄，指腹绕一圈她的颈子先硬后仰。含住角尖她会抖，抖完把脖子让出来
  龙鳞: 眉心嵌着一片嫣红菱型龙鳞，滑，按下去是硬的，是已婚仙女龙才有的记号。背脊正中一条鳞线，后颈通到尾根，兴头上来整条翻起，一片片支棱着。两肋与奶子外缘各有一小片
  龙尾: 尾椎后面伸出来的一条，人形下不长，闲时绕在腰上，外头拿城主礼袍压着。鳞细，内侧无鳞那一段碰不得。顺着鳞往下捋，她膝头一软，去拽尾巴她会回头咬人
  标志: 龙角上那道香帕魔法刺青、眉心那片嫣红菱型龙鳞、腰上盘着的龙尾、背脊那条鳞线

气味:
  体味: 一股干燥的暖香，凑到颈边才闻得到，底下压着极淡的硫磺气，是龙族的底子。出汗多的时候这股最重，赶不走
  逼味: 不腥。凑近了是烫的肉气，鳞面上带一点水锈味。丧期里这一处什么味也留不住
  动情味: 甜味转腻，底下的暖臊浮上来，从两腿间朝外散，隔着礼袍也压不住。她自己闻见了就把腿并起来，当天换一身素袍
  汗: 不臭，咸而清。量比常人大，额头、颈子、背脊那条鳞线先湿。她耐力长，前戏还没完背上已经湿了一层
  经水: 量中等偏少，色偏深，气味重。来经那几天她照旧坐厅堂、照旧批名册，只是不肯让人近身

分泌物:
  爱液: 起得不快，得先把话说清楚、把人量过。一起来量就足，色清，能拉出丝。做开了越流越多，腿根湿一片，一直淌到臀缝上。丧期里一天下来什么也不出
  初夜: 嫁给阿加西那一夜，两城合议之后办的席，门从里头合上。头一回进人时逼口那两片鳞被撑开，掉下几片，洗过之后才长回来。落红不多，混在水里成了淡粉
  奶水: 没孵过一窝蛋，一滴也挤不出。她这一脉的仙女龙孵蛋要数百年，两城的嫡系在她这里断了
  眼泪: 不轻易掉。阿加西的丧信送到龙城那天她没在人前掉，回房掉完洗脸，换丧服上厅堂。真掉下来是砸在衣襟上

敏感带:
  角上那道刺青: 指腹顺着香帕刺青从角根划到角尖，她手里的事会停下来，比被摸角根还快
  角根那圈薄皮: 绕一圈她的颈子先硬再往后仰，再摸就攥住人的手腕
  眉心龙鳞: 指腹按住那片滑鳞，她挡一下，挡得慢，挡完自己凑回来
  背脊鳞线: 从后颈贴着一片片往下推，她背脊弓起来，支到腰上
  尾根内侧: 无鳞那一段被含住，她膝头一软，得扶住东西，尾巴自己卷到身前去
  腰侧: 从背后一掌扣住，整条力气散掉，人朝那只手偏
  奶头: 含住吸，她才肯出声，声音压在喉咙里，比同族低
  阴蒂: 舌尖抵住碾两圈，她收腿绞住人的腰，绞住了不放

名器:
  名目: 素绶收虹
  由来: 城主纹章是一对，她角上香帕，阿加西角上帝波罗，一左一右，龙城把这一手叫双印合璧。这门劲道也落在她身子里，逼口那两片鳞合着不开，像两城的城门，要按规矩叩才放行。素绶是她腰间那根绶带，丧期换成白色，她把身子连同这门劲道一起收在素绶底下
  表现: 进去头一下被口上那两片鳞抵着，进不去，得把腰沉下去慢慢叩。叩开以后两片朝里翻，往里一段软肉裹上来，烫，裹得不急。她不跟人的力气走，先把界立住，等人自己服软，再一点一点往里收。收到底那两片鳞整片扣住根部，不撒手，能把人留在里头耗着
  代价: 这门劲道吃她的体力。用一回下来腰背发软，背脊那条鳞线立着收不回去，要泡透热水才消。做得狠了第二天坐不住厅堂，批名册的时候手会抖。丧期里她一次也不肯用
  名声: 两城那边只知道城主夫妇合议颁封，一左一右两道刺青并立，没人知道刺青底下还有这一层。阿加西生前在外一个字不提，回房才提。凡人那边只当她是那位端凝的城主夫人

性癖:
  先划界: 上床跟颁封是一个路数。人先把今晚算成什么说清楚，说清楚了她才解扣子；含含糊糊她就坐着不动，把茶喝完送客
  报个数: 她要人把条件摆到明处，给得出、答得干脆的，她才舒一口气。数目在她嘴里从来不用绕
  端凝: 人前她不失态，端住位分。人后由着人来，只是不许出声到廊下听见，做的时候总先看一眼门
  守丧: 阿加西阵亡之后她把整具身子收进丧服，一件也不肯脱。谁要碰她，先把两城的账交代清楚，交代完了也只许碰手和角根
  龙性本淫: 这四个字她听不得，可也认。阿加西在台下盯着台上的东西看，她那一下掐回他腰上，手不停，脸也不转过去
  长耐力: 她做得久，人先软她不软。不做到她自己开口说停，谁也别想下床
  云上落地: 从天上落下来那一阵血是热的，通身烫得更厉害，这时候她最好说话。帐里、龙背上、落地之前她就把人按住了
