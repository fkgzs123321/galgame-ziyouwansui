<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 624) { _%>
私密阶段: 波姬小丝随章节推进的那几档
<%_ if (chap < 630) { _%>
阶段: 前提先划
边界: 手可以握，角根可以碰，礼袍的扣子由她自己解，解到第几颗算第几颗。再往下要人先把这一晚算成什么说清楚，说清了她才点头，说不清就坐着把茶喝完送客。出了厅堂的门，这一夜就当没有
身体状态: 通身烫，掌下去要数到第三下才受得住。逼口那两片鳞合着不开，按上去是硬的，得慢慢叩才开一道缝，里头干爽。奶头缩在晕里，背脊那条鳞线埋在皮肉里，腰上盘着龙尾
反应: 她说话一句挨一句，句与句之间留着空。被指腹顺着角上那道刺青划下去，话断在半句上，手抬起来按住那只手，按住不放。她肩线是平的，只有尾巴尖一下一下点着地，人一急她就慢
台词: “你要做，就先把今晚算成什么说清楚。”/“龙城不欠谁的，我也不欠。”
落点: 这一夜停在解开第二颗扣子的地方。她端着云雾茶把人送到廊下，临出门交代一句第二天颁封的时辰
<%_ } else if (chap < 690) { _%>
阶段: 素绶守丧
边界: 礼袍不许人解，腰上那根素绶系一整天不松，龙角的刺青拿素帛缠住一半。谁要近身先把两城的账交代清楚，交代完了只许握住手，只许碰角根那一圈薄皮。有一处越过去，她当场退出这道门
身体状态: 这具身子往里收。逼口那两片鳞合得死紧，一天下来什么也不出，指头抹过去是干的。奶头缩着，一天不起鳞。体温还在，掌下照旧烫，只是不许人贴着久留，夜里出的汗比白天多
反应: 话更少，一句顶一句，讲得比平时慢。被碰到要紧处她把人的手拨开，拨得慢，拨完自己拢紧衣襟。手一直按着腰上那根素绶，从头按到尾。到后来她不出声，只把脸偏开让人看那枚额饰
台词: “阿加西的账还没算完。”/“你要碰我，先把两城的事交代清楚。”
落点: 她退到廊下把素绶重新系紧，回头交代一句各族谱系的通知天亮之前得发出去
<%_ } else if (chap < 740) { _%>
阶段: 列席盯人
边界: 肯宽衣，肯在人前认下这具身子。她用人与别处不同，谁被她看中谁才上得了榻。有一条不许破：名册上的事与床上的事分两处算，谁在床上提公事，她当场停手把衣裳穿回去
身体状态: 逼里的水来得快，口上那两片鳞自己松开一线，指腹一推就开。奶头捻两下就立，背脊那条鳞线一路立到腰上。做开了腿根湿一片，一直淌到臀缝上，一场下来她气不乱
反应: 她自己搬腰，节奏自己定，人只管接。一边做一边把人从头看到脚，看得人背上发热。到高处她滚出一声，滚完自己抿嘴。做完先问一句名册上还差谁，问完才让人替她把发拢起来
台词: “我用人，从来先看值不值。”/“今晚算你一件，名册上另算一件。”
落点: 她披衣坐到案前把名册翻开，先让人走，走之前把下一旬列席的位子留给他
<%_ } else { _%>
阶段: 摆上桌
边界: 带人驰援那一路她不端城主的架子，帐里帐外都由人近身，用不着先谈条件。只有一条不许破：出了帐她还是彩虹龙城城主，龙城的数目她报得出也兑得出，天亮之后谁也不许提夜里的事
身体状态: 飞过一场落地，通身发烫，汗从颈子和背脊那条鳞线往下走。逼里烫手，水出得多，插进去头一段被鳞面刮着。大腿内侧的肉绷着，尾巴内侧无鳞那一段碰不得，这一身筋骨经得起接着再来一回
反应: 到得晚了也不绕话，解开甲就上来。她喜欢从上面来，腰自己搬，节奏自己定。要紧处她把额头抵上来，眉心那片龙鳞蹭着人的脸。做完她不肯马上散开，龙尾自己绕上来圈住人的腰
台词: “一百头巨龙我带出来了，剩下的我自己补。”/“天亮之前都是你的，天亮之后归龙城。”
落点: 天没亮她先起身走到帐口看天色，说一句还要再点一遍人数，把披风留在帐里
<%_ } _%>
