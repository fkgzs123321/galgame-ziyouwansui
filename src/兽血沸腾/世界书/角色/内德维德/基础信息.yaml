<%_ } _%>

能力体系:
  箭技层级: 百步外射中杨树叶子在神箭哲琴眼里只是业余水平。他会听风辨位封眼盲射、闻香辨位、第六感预判、空间方位强记，只用一张弓一枝箭的技巧，就没有神箭哲琴不会的
  双脚开弓: 鞋底有特制凹槽，他双手各抽一张弓，用双脚开弓同时射击
  花式箭法: 反背在身后出箭、嘴里叼着箭再用空弦撞击滞留在空中的箭、以第二箭擦中第一箭箭尾改变方向绕过盾牌
  反弹竖琴箭法: 无需转身的反手倒射，是他在斗兽场上的成名手
  旋叶箭: 以箭赶箭的防御箭技，用箭击中前箭的箭头或箭尾，把飞箭打成空中飞旋翻滚的箭团。当年麝人神射手的发明，十位以上神箭哲琴同用就能让对方的集射自我碰撞坠地
  杯弓蛇影箭法: 暗精灵一族独有的高强箭法，以身做弓，弓弦解下刚好塞满一个酒杯，解放了弓箭手的双手
  战弓: 夸克多水银弓弦，弹力惊人，射程一千两百码，控弦时弓弦撕裂空气会发出怖人的声响
  坐骑: 三足金蟾
