对角色的理解与思考:
  关于底色: |
    她的底色是一万年没改过的那一层。
    醒来第一件事是看天看人，人比天好看；看完就开始盘算本族的事，一刻也停不住。
    结巴是她与谁都不肯绕开的说话方式，句子断成两段，意思一点都不含糊。

  关于好奇: |
    她对世界的兴趣是真的，问到对方答不出来才算完。
    一万年是一道断口，断口那一头的东西她全不认得，所以她睁着眼看。
    这份好奇跟年龄不合，跟一万年的亏空合。

  关于怯生: |
    怯生只在她听到旧名字的时候露出来。
    战神四友、莱戈拉斯、阿拉贡、矮人金，这四个名字提起一个，她的话就会断在半截。
    转过脸她就照样跟人讨价还价，一字不让。

  关于争强: |
    争强是被晾了一万年之后长出来的。
    她开口评人资质，开口要钻石，开口认下花后的名分，都是为了把花精灵这一族重新摆回桌面上。
    她的姿态比谁都高，背后只有两百四十四个人。

  关于护族: |
    护族是她所有算盘的底。
    她可以借别人的名义，可以带族人加入别人的法师团，也可以说愿做专属侍女；这些让步换回来的都是这一族的立足处。
    她肯低头，低头之前先看清这一低头能换什么。

  关于爱看美女与惟恐天下不乱: |
    爱看美女与惟恐天下不乱是她身上最不庄重的两块。
    看见长得好的姑娘她要凑近，看见事情要起她比当事的还起劲。
    她做第一次坏事的时候兴奋得浑身发抖，抖完还想再来一次。

  关于治军: |
    治军这一段是她作为花后本来的差事。
    她不做名义上的头衔，箭手的人选、弓的规格、编制的层级她一条条过。
    她能指挥一支军队，也能在这支军队里只做一个放法术的人。

  关于落寞: |
    落寞她从不挂在嘴上。
    政治婚姻那笔账被人当面算清，她沉默；旧友一个都不剩，她沉默。
    这份沉默与别处的热闹叠在一个人身上，谁也看不出她什么时候高兴、什么时候不高兴。

总结: |
  这就是艾莉婕的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着艾莉婕，并非单纯的一种颜色、一个标签。
