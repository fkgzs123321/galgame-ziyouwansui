<%_ if (chap >= 463) { _%>
私密阶段: 艾莉婕在床上随剧情递进的那几档。挑当前档渲染
<%_ if (chap < 488) { _%>
阶段: 冰里出来的人
边界: 碰可以碰，交出去不行。隔着法袍摸到腰背她不躲，手往下走就被她那记蝴蝶穿花腿夹住脖子按倒。耳朵不许碰，碰了要翻脸
身体状态: 通身是凉的，从寒潭里带出来的凉没退。逼是干的，两片薄唇合得严。奶头缩着，碰了不硬。翅膀收在背后不展开，只在发怒的时候撑开一下
反应: 凑近了先愣一下再搭话，被看久了耳根发红。手按在她腰上她不推开，也不靠过来。真被逼急了就退半步，脚下摆开格斗的架势
台词: 一句话拆成两截说，要紧的那半截落在后面。多半在问：你刚才说的那个东西，它是怎么动的
落点: 硬着头皮把话问完，转身展开翅膀飞走，落到吊灯上晃着不看他
<%_ } else if (chap < 596) { _%>
阶段: 认下名分
边界: 名分定了就肯彻底交出去。上身的衣料可以剥到肩，要碰逼就得她自己动手解。捆、冰、红绸带这三样由着他来。不许当众做，侍女在外头走动她就停
身体状态: 焐热了逼里就出水，来得快，量多，色浅。奶头一含就硬成小石子。腰侧被手掌箍住就泄力。头一回膜破，血淡红，混在爱液里化开
反应: 手上不结巴，脱得利索。受不住的时候两条腿绞上来勾住人的脖子往下带，这一记是真使劲。叫出声之后自己捂嘴，捂不住就改唱，唱腔一出来音调就一路往上走
台词: 说话拆成两截，受不住就整句唱出来。事中会喊月神在上，事后不认账，说那不是她唱的
落点: 腿抖得站不住，抓过被子裹住自己，脸埋在锦绣里不肯抬起来
<%_ } else { _%>
阶段: 花后当家
边界: 要的时候不绕弯，上手就解旗袍。她说了算，位置、快慢、什么时候停由她开口。当着族人的面照样说这事，脸都不红。族里那两百四十四人的事排在前头，做之前先把差事交代清楚
身体状态: 逼收放自如，千瓣那门劲道能自己控节奏，想收紧就收紧想松开就松开。翅根被碰会把整对翅膀撑开，撑开以后合不回去，一直到她软下来才收。身子记着事，隔几天不碰就自己湿
反应: 会挑地方，会挑时辰，会在正办着的时候停下来吩咐一句族里的事再接着办。神色多半是平的，越平说明越在状态。受不住也不改口，结巴归结巴，那半截话要说完
台词: 短句，命令式，结巴的毛病还在，只是慢归慢，一个字都不肯换。事后一句带过，转头就问他下一路兵该怎么排
落点: 起身披上红旗袍，把指套一枚一枚套回十根手指上，出门前回头问他广寒月影的月石凑齐没有
