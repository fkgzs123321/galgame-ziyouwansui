私密档案: 费雯丽的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 费雯丽
种族形体: 美杜莎族蛇人，比蒙境内剩下的最后一支，世代住在采玉城。腰以上是女人，腰以下一条蛇尾，走动靠游。四条与常人不同：血是凉的，通身比人低一截，得借人身上的热才暖得起来；子嗣是蛋，生下来才孵；每年自然蜕一回皮，新皮早就在旧皮底下长好了，蜕的时候不疼，只发痒；上颚后侧藏着一对毒囊，采玉城往外供的毒药就从这一对里出。族里把贞洁看得比命重，特雷泽盖家是战神爱宠的后裔，她本人是这一届奥林匹克祭祀大会的青年祭祀桂冠得主
毒囊: 上颚后侧那一对，藏在肉里，从外头摸不着。受惊或者到了极处会自己渗出一口，麻，微苦。她当着人从不动用，回采玉城才交给族里入药
蛇蜕: 一年一张，从额顶蜕到尾尖，蜕下来的整张她自己卷起来收着，不给旁人看。蜕的那几天通身是新肉，薄，碰一下就红

外观:
  身量: 十七八的年纪，个子不高，站在刘震撼跟前只到他下巴。原文写她是纤腰仅有一握的美杜莎小美女，黑发如云，容貌秀丽雅致。肩薄，人显轻，蛇尾撑地的时候重心压得很低
  奶子: 一对不大，圆，挺，躺下去也不往两边散。奶子外缘的血管是淡青的，皮肤雪白晶莹，这是原文里的话。掌心贴上去先是凉的，焐一阵才暖。揉重了留一圈红印，动情以后整只发烫
  奶头: 小，颜色浅，平时平贴着，摸不出形状。她冷血怕冷，受一点凉就第一个硬起来，硬了朝前翘。指腹碾两下会再挺一分，吸住的时候她把腰弓起来，弓完按住人的后脑不放
  乳晕: 浅，边界不分明，越往外颜色越淡，看不出收在哪儿。晕面上一层细颗粒，舔过去她缩肩。含湿了那些颗粒自己立起来，一颗一颗摸得清
  逼: 盖在人蛇交接的那一处腹面，平常压着一块逆着长的软鳞，合起来看不出一丝缝。采玉城的老话是这里给出去就收不回，族里把这一处看得比脸面还紧。掰开软鳞才见口子，里面比外面暖。水要靠前戏慢慢焐，急不来，焐出来了量也不大，色清，挂在鳞边能拉丝。含进去的时候四壁一片片贴上来，不松手
  阴唇: 两片都不厚，收在软鳞底下，一辈子不见日头，透出来的是白里一线的浅粉。平常合得没有缝，得先把软鳞翻开才看得见两片。外头那层皮面滑，不带一道褶，手摸上去先碰到鳞的凉，再往里才是活人的温。平日里那一片总有点润，不干也不淌。动情了尾根那圈鳞先立，软鳞跟着往两边翻开，两片自己张出一道口子，水当时就渗出来。做到后来这里比别处烫
  阴蒂: 只有一粒，藏在两片的上端，外头那一小块软鳞把它遮住，翻开来才露头。手指刚碰上去，整条尾巴就绷成一条直线；再碰一次，她伸手把自己的脸捂住，捂住了就不再出声
  屁眼: 长在尾巴的背面，靠尾根那一截，颜色比四周浅，一层压着一层的细褶。平日里干，不带气味。指头刚顶上去，那圈肉先收一下，然后一层一层松开
  腰腹: 细腰，一掌合得拢，是采玉城养出来的身段。小腹平，肚脐浅，往里凹。按下去软，温。从身后被人一把扣住腰侧，她当场使不出力，人往那边倒。缠绕的时候这里绷起两道线
  臀部: 胯不宽。尾巴生出来的两侧各鼓起一小块，是蛇尾往后发力时撑起来的，比别处烫，拍一下肉会晃
  腿: 这一族没有腿。从腰间往下就是一整条尾巴，坐下来先盘三圈。采玉城的说法是她的腿长在尾巴上，游得比走还快
  足: 尾巴尖又细又活，能点地，也能卷住东西。她坐着的时候尾尖一直在地上敲，一下一下。有人去捏，她当场把尾巴抽走
  手: 祭司的手，指节细，指甲修得齐整。这一双手在采玉城练的是结印和画符文，举起来能带出战歌的光。掌心有一层薄茧，是长年握祭祀杖磨出来的
  口舌: 唇厚，红。平日里是凉的，含住以后才烫。她咬唇咬得凶，急了能咬出血来。舌是软的，头一回接吻手忙脚乱，牙齿磕了人，她停一下再来
  腋下: 干净，一根毛也没有。皮薄，被舔到就缩肩，缩完拿手肘把人顶回去
  发肤: 黑发如云，一直垂到腰下，发丝摸起来比人的凉。雪白的皮，通身一片光净，没有瘢也没有痣。念一回战歌下来，汗先从额头和颈子出来
  蛇尾: 美杜莎的标志。鳞面凉，色彩斑斓，腹面那块软鳞底下就是逼口。醉话里有人当着满屋子的面拿她这条尾巴作过评价，这件事她知道。兴致上来尾根那圈鳞先立，一路立到尾巴中段。缠人的时候她自己也说不清收了几分力
  蛇鳞: 从人蛇交接处开始铺，越往尾尖越细密。逆着摸她把尾巴缩回去，顺着摸她坐着不动。尾根那一段颜色最深，尾尖那一段最浅
  蛇信: 生了分叉的一条，收在口腔里，探出来的时候在空中一吞一吐。她靠这一条认气味，凑近人的颈子先探两下再开口。含着东西的时候蛇信压在里头，吞吐都慢了
  标志: 一头如云的黑发、腰以下那条色彩斑斓的蛇尾、采玉城的白色战争祭祀袍

气味:
  体味: 一股冷香，不带脂粉，要凑近才闻得出来，是洗过晒过的干净味
  逼味: 没有杂味。平常压在软鳞下头，什么也闻不到。翻开以后才有一点暖的肉气，不腥不酸，末了坠着极淡的一点甜
  动情味: 那点甜变浓，往下沉到尾根一带，闷在鳞片底下出不来。她自己盘着尾巴就闻见了，闻见就把尾巴收紧，把裙摆往下压
  汗: 量中等，清，不带臊。念战歌的时候先从额角沁出来，再顺颈子往下。汗是凉的，滑到胸口她打个激灵
  经水: 这一族是卵生，经水极淡，量少，气味也淡

分泌物:
  爱液: 冷血的身子，来得慢。前戏短了不会有，得先暖、先摸、先听她说话。出来量不大，色清，挂在鳞上能拉丝
  初夜: 在翡冷翠的城主大厅里，门从外头合上，厅外一堆长老和夫人等着。她那会儿还是个未经风月的，哭到眼睛肿成桃子，落红不多，混着水成了淡粉色，沾在裙上是几点。出来的时候把头埋得很低，从头到尾没有喊过人
  奶水: 没生养过就没有。哺乳那阵子才下来，偏甜，量足。喂奶避着人，连契姐也不让看
  眼泪: 来得多，来得快。族里的脸面上一出事，两个姐姐怀里就能哭湿一片衣襟。哭的时候不出声

敏感带:
  蛇信: 探出去的时候被舌尖勾住，她退半步，退完自己又凑回来
  尾根那一圈鳞: 一动情就立起来。顺着摸她把尾巴缩回去，逆着摸她把腰塌下来
  尾尖: 捏住有用，含住更有用。含住的时候尾巴抽不回去，只能左右扫
  后颈七寸: 蛇的七寸在颈上。手掌往上一按，她整个人软下去，战歌也唱不成句
  阴蒂: 翻开软鳞碰一下，整条尾巴绷直；再碰她抬手把脸挡住
  奶头: 捻、含、咬都有效，吸的时候她出声，声音压在喉咙里
  纤腰: 被人从身后扣住就使不出力，人往那只手上倒
  耳后与发根: 黑发被撩起来，后颈晾在空气里，她自己把肩缩起来
  上颚后的毒囊: 到了极处那一对会自己渗出一口，麻，微苦。她得咬着东西才不漏出来

名器:
  名目: 蜕玉沁凉
  由来: 美杜莎通身是凉的，比人低一截，交合时得借人身上的热慢慢烧起来。她这条道盖在人蛇交接那块逆鳞下头，鳞合上是一层壳，张开是一道口。族里年年蜕一回皮，蜕完那几天通身换的是新肉，薄得泛红，收得也最死，采玉城管这个叫新蜕
  表现: 进去先被那块逆鳞刮一下，往里是一层一层贴上来的软肉。开头凉，抽送十几下才返热，越做越烫。她的收束不跟人的力气走，跟着尾巴缠上来的圈数走，尾巴收紧一寸，里头跟着扣紧一寸。冷热交替着来，撑得住的少
  代价: 凉血的身子经不起折腾，做一场要缓很久才回得过温。做完她抖得咬不住牙，得拿厚被子裹严、要人抱着才暖回来。赶上蜕皮那几天更虚，做完第二天起不来床
  名声: 采玉城族里的老规矩，美杜莎的女儿认了谁就跟谁一辈子，身子给出去之前不许有第二回。比蒙那边传的是她奥林匹克冠军祭祀的名头，没人知道软鳞底下还藏着这一层

性癖:
  先遮脸: 脸皮薄得像纸，做的时候不肯露脸，要拿手、拿头发、拿被子挡着。挡着才肯出声，一放开手她就闭嘴
  蛇信试味: 上手之前先用蛇信探人的颈子和胸口，探到了才肯往里走。她自己不觉得这算勾人，说是族里认气味的法子
  尾尖勾人: 到了受不住的时候，尾尖自己勾住人的脚踝缠一圈，缠住了就不放。她本人不承认这件事，事后只说尾巴不听话
  认了不改: 族里谁要了她的身子谁就是她一辈子的人。这一条她认得很死，认下之后不再看第二个人，也不许人拿她跟旁人比
  背人: 采玉城、穆里尼奥、冰凰唐蓓尔金娜，这三处她都不肯让知道。做的时候只要外头有脚步声，她当场停住，停住之后要缓半天才回得来
  口里的麻: 到了要紧处上颚后侧那一对毒囊会自己渗出一口，麻，微苦。她咬着人的肩或者咬着自己的手背，咬住就不漏
