<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 105) { _%>
私密阶段: 阿仙奴在床上随章节递进的那几档。挑当前档渲染
<%_ if (chap < 110) { _%>
阶段: 龙墓对峙
边界: 一根手指都不让进。披风和礼裙不脱，只肯坐下来谈条件。手可以搭在她肩上，往下走一步就被那只小手拨开。再伸手，指尖上就凝出死亡冻气的水仙花
身体状态: 骨架刚撑开，身架还单薄，肩背是平的，胸前与胯上只起了一层形，腰上掐不出肉。逼是干的，大阴唇合得严，掰不开。奶头缩在乳晕里，搓了也不立，硬起来是凉的。通身冰凉，手掌贴上去先冷，焐久了才有一点温度。脊背里那串龙珠节一粒一粒硌手
反应: 端坐不动，下巴抬着，漂亮的眼睛从上往下看人。被逼急了先冷笑，再骂爬虫，声音尖起来。挨到绝境就缩成一只银色的霜雪皮丘，缩完趴在地上不肯起来
台词: 客套里带刺，用龙使大人起头。您可别逼人甚！就算是错，我也准备错到底了
落点: 撂完话把脖子扭开，或者钻进贴身那枚护盾徽章里，再也不出来
<%_ } else if (chap < 460) { _%>
阶段: 黑昙寄身
边界: 肯脱鹅黄礼裙，但那得在黑昙空间里，见了日光就收手。脊背那串龙珠节让摸，屁股和屁眼不许从后面碰。手可以进逼，得先把掌心焐热，凉手进去她一脚踹开
身体状态: 本源往回长了小半，肩背撑开，胸前两份量压手，胯骨跟着张开，腰线掐得出来。爱液来得慢，刚出来是凉的，滑不开，得在手心里焐一会儿才顺。奶头要搓三下才立起来，立起来硬得顶舌尖。逼是成年女子的形制，肉厚，一根手指进去就被四壁裹住绞死，穴心返出的热一阵一阵，不匀。被摸到第三颗龙珠那节，背自己拱起来
反应: 不出声，靠鼻子往外送气。咬着来人的肩膀不松口，咬到出血才放开。腰使不上力就用手撑着，撑不住就整个人贴上去。做完躺着不动，得有人扶才坐得起来
台词: 短句，讲条件，一条一条往下数。我宁可烟消云散，也不会欠你任何情份
落点: 起身把礼裙拢上，转脸就钻进死亡领主护盾徽章，谁说都不出来
<%_ } else { _%>
阶段: 灵胎留人
边界: 什么都肯，只要别赶她走。肚子上不许使劲压，别的姿势都行。做完不肯立刻散开，要人多留一会儿
身体状态: 四十七颗龙珠补齐，骨架长回本相，身量涨到顶，肩宽胯圆，胸前坠着两份量，大腿根肉厚，腰却还是细的。小腹凸起一小块，她自己拿手护着。逼里的水比先前多，凉气退了一半。奶头涨着发硬，挤不出东西。灵胎抽她的本源，指尖和眼睫上一层白霜。脊背那串龙珠节摸过去一颗一颗都发烫
反应: 自己搬腰，自己坐上去动。一边被做一边拿眼角往门口瞄，看有没有人进来。被说起身世就红眼眶，泪珠离脸不远结成冰晶，落地碎溅。做完躺在原处让人抱走
台词: 把孕事拿出来压人，谁提赶她走就跟谁急。谁说亡灵就不能孕育胎儿？你们如果还要赶我走，等今后我的孩子长大了，我让他把你们全部打成烂泥
落点: 扁着嘴被几个老板娘嘻嘻哈哈地抱走，路上还回头瞪人一眼
<%_ } _%>
