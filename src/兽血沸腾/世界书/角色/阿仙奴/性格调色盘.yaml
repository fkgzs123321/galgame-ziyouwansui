对角色的理解与思考:
  关于底色: |
    她把龙族第一美人的名号顶在自己头上，特意说明是龙族第一美人。
    认下的愿她做了一万年，母亲织布尔娜巾与父亲贝斯特的骨灰要合并，这件事她见谁跟谁讲。
    别人的好处轮不到她，她也不走开，站在旁边眼睁睁看完。

  关于骄矜: |
    她报名号从来不嫌多，龙巫女皇、昔年龙族第一美人，一样一样摆出来。
    龙巫妖当面拆了她的台，她转头还能夸对面感情丰富，一点不窘。
    这份骄矜是她撑过一万年的东西，逼到绝境她也先抬着下巴。

  关于试探: |
    她先编身世，看对面认不认得织布尔娜巾这个名字，再决定这套话往哪里带。
    她讲巫骨仪式、讲黑石祭坛与绯红龙骨，讲得比谁都熟。
    试探不成她就换一手，从自己身上另找由头。

  关于硬顶: |
    逼到跟前她凝出两朵死亡冻气的水仙花，先问一句你想怎样。
    她说即使是错，我也准备错到底了，宁可消逝在风里。
    顶不住就变回一只银色霜雪皮丘，趴在地上不肯起来。

  关于借刀: |
    她欺负刘震撼不识龙文，把寒潭石柱底下的封印讲成宝藏禁制，引他去放铜蜃领主。
    她站到铜蜃领主的脚下，要他在杀她之前先把这个可恶的家伙连灵魂一起撕成碎片。
    她以龙族至高神亥伯的名义立誓，逼这位上古强者替自己出手。
    铜蜃领主怯了战，她追着背影骂爬虫，骂完自己先趴在地上。

  关于嫉妒: |
    安瑞达手上那串宝石首饰一件件摆出来，她看得眼睛里喷火。
    别人当着她的面把补充魔力的戒指说给安瑞达，她站在旁边身子抖。
    她与安瑞达并肩站着一起撇嘴、一起抠指甲，谁也不肯先夸对方。

  关于装相: |
    她穿一身雪白纱裙坐得乖巧伶俐，果果往她嘴里塞零食她就机械地张嘴。
    小鹦鹉在她头发里刨个窝蹲下，她当面不吭声。
    被逼降她就钻进死亡领主护盾徽章，谁也不见。

  关于守愿: |
    她说母亲被放逐到地底世界时已经怀着她，说父亲葬在泰穆尔拉雅山的最高处等母亲回地表。
    她哭的时候泪珠离脸不远就结成冰晶，砰然落地，颗颗碎溅。
    这个愿她做了一万年，讲给谁都讲，讲完自己先红眼眶。

  关于耍赖与顶嘴: |
    她拿肚子里的孩子当由头不肯回龙城墓地，几个老板娘嘻嘻哈哈把她抱走。
    被抱走的时候她还回头瞪人一眼，嘴上扁着。
    她在空中花园住下、编进夏宫卫队，做的是辅助与召唤，分派好处的时候总要往人前站一步。
    刘震撼不许她叫公爹，她照旧扁着嘴叫，叫得他浑身难受。

总结: |
  这就是阿仙奴的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着阿仙奴，并非单纯的一种颜色、一个标签。
