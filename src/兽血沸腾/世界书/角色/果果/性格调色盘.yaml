共有的色彩一: 它喷的霜冻气团是瞬发魔法，一发打出去就整个委顿下来
共有的色彩二: 它从巨鹤的翎毛里翻出杏仁一般大的虱子，捏死了丢掉，捏完还想往嘴里塞
