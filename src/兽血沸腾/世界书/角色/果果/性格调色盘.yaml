共有的色彩四: 它是冰霜系的低阶魔兽，魔法练到人类圣齐奥的水准，也换不来一副人形，刘震撼为此才盯上了泥足巨人的改造
共有的色彩五: 它和喀秋莎嘴里叼着半截没点燃的雪茄，从凝玉和艾薇尔的腿边挤出来，大摇大摆站到阵前

对角色的理解与思考:
  关于底色: |
    霜雪皮丘兽在南十字星森林里只是很普通的一种杂食性魔兽，草根到连幻化人形都做不到。
    它这个外号来路不好，被它亲近的生物无一例外都会变得很倒霉。
    它的吃食和活路都挂在刘震撼一个人身上，它就把这条命押上去。

  关于贪吃: |
    它的贪吃当场兑现，能吃的东西绝不留到下一顿。
    别人手里有吃的它先凑上去，桌上有的它先伸爪子。
    一个拖在地上的大皮口袋和一只塞满的豹皮肚兜，是它随时备着的家当。

  关于装弱: |
    装弱是它的护身法，碰上比自己强的、碰上眼看要挨罚的，它先把大耳朵垂下去。
    它把肚皮一翻、嘴一砸，做出可怜相，等人心软。
    这套做完它掉头就得意，小爪子挠人胸毛，挤眉弄眼。

  关于脾气: |
    它脾气坏得直接，搅和别人的好事从不看场合。
    它下手挑没有护甲的地方招呼，攥长嘴、捏鼻子、封眼睛。
    这一面只在它认准的窝里发作，对外它先装弱。

  关于护主: |
    它护刘震撼不讲章法，也不先问有没有把握，见着就往上扑。
    刘震撼下水，被丢在岸上的它也要跳回他脑门上。
    它对上的是比自己高好几阶的魔兽，靠的是封眼捶和两面大锤。

  关于凶悍: |
    它抡大锤从来挑没有魔法护甲的地方下手，鼻子、眼睛、嘴唇，砸到哪里算哪里。
    它能举起两千多斤的大石块，也能把比它重得多的雕齿兽原地甩出去。
    这些力气平时都藏在毛茸茸的小身板里。

  关于憨态: |
    憨态是它平时挂在脸上的一层皮。
    叼着雪茄、挺着大肚皮、露着牙齿做鬼脸，谁看了都把它当活宝。
    这层皮底下那点凶劲，只有站到阵前才露出来。

  关于狡猾: |
    它的狡猾落在小爪子上，点头、摸肚兜、咬一口无花果，一套做完，解约的事就被拖到了后头。
    它摸进亲王兜里的时候，脸上还挂着笑。
    它数数只数到三，一只小手上就只有三根小爪子。

  关于当家: |
    皮丘法师团穿黑风衣、戴馒头线帽、手捧绿萝，带队的是它。
    它身上挂着连弩、卷轴和钢针，有仗打就掏出来用。
    它带的是一帮跟它一样的小东西。

  关于爱显摆: |
    它爱显摆的方式是把得到的每一样东西都亮给人看。
    脖子上的布条、手里的八棱铜锤、身上的豹皮肚兜，它一件一件拨弄过去。
    它摆造型的时候站得笔直，大肚皮挺得比平时还高。

总结: |
  这就是果果的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着果果，并非单纯的一种颜色、一个标签。
