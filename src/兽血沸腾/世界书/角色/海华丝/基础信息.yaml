<%_ } _%>
    小空: 在红土广场上点化三千花之国士的那位九郎，与她一道办成花官与花士这两件事
    十一位彩凤圣女: 文莱主神庙的花衔中人，都是爱花之人
    艾薇尔: 与艾莉婕一同自星空之门赶到墨文若克海岛的那位美人鱼公主
    提香大师: 人类画家，受教皇之托绘制圣徒，想以貂蝉美人为蓝本
