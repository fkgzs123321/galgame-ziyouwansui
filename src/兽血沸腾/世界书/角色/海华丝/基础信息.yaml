角色档案:
  基本信息:
    姓名: 海华丝
    花衔名: 丽塔.海华丝
    称谓: 貂蝉美人、貂蝉神使、小貂蝉、花相海华丝、笼烟芍药的主人
    种族: 貂蝉美人。魔界快绝种的一族
    性别: 她自陈是女子。嘉宝当着李察的面点破过一句：海华丝大人是个男人，碧落之黄泉只有很小的几率会诞生出女孩。历史上历朝历代的貂蝉神使都是男人
    花衔: 花中宰相。花衔分花王、花中皇后、花中宰相与花爵中人，花王统帅天下群芳
    职位: 文莱主神庙的魔梦神使、魔梦女神的圣女使
    前世: 一万年前她是比蒙神庙看守祭坛之火的专职圣女，号称比蒙第一美女
    归属: 文莱主神庙，魔界加拉塔萨雷城。魔界奉神权，这座神庙供奉魔梦女神
    部属: 文莱主神庙的十一位彩凤圣女与二十来名孔雀圣女中，有十一位孔雀美人已被她列为花官
    后续: 她与大批美人一道回翡冷翠，被太后凝玉说服，连同一众孔雀美人转化为夏宫的专职圣女
    结局: 她在翡冷翠替李察颁封花官、点化花之国士，也在领主大厅给隆美尔奉过茶

  外貌特征:
    花相形态: 紫色长发斜插一朵雪白落英，鲜花织就的长袍与周身轻烟。咖啡色美目，娉婷袅娜而被轻烟笼罩
    含烟: 花相海华丝浑身似被烟雾笼罩，含烟美人，身上有怡人的脂粉香气
    貂蝉形态: 锁住秀美双肩嘤嘤抽泣的娇柔身姿，完美得不应存在于人世间的少女身形。丽品凝仙
    声线: 语音嗲软动人。她的声音甜美的堪比最娇艳的花朵，很奇特也很清晰地在每个人的耳畔扩散回响
    鬓边花: 鬓边那一株香水风信子，一根细细的绿藤烟碧如玉，入手滑腻如脂，金蕊白花

  背景设定:
    秘辛: 李察经水晶传送阵抵达达坂镇一家简陋的丰沃之田商号，老板是肥硕的地穴恶魔约克。约克透露文莱主神庙的魔梦圣女使是快绝种的貂蝉美人，还道出貂蝉美人靠碧落之黄泉繁衍
    花相出世: 李察以拈花指弹射后庭花，薇芝念动命运的双生子诅咒失手；四位飞行骑士突袭，他用巫师变形咒和水晶剑斩杀对手。花相丽塔.海华丝以花枪拦下他，自称笼烟芍药主人与文莱神庙魔梦神使
    认王: 文莱主神庙前的死寂里，她当众称李察是当代花王与自己的主宰，说她作为花相操控花朵飞旋环绕只是异能的控制力，并不是神迹
    花系摊牌: 李察摘走她鬓边的香水风信子，她自陈掌握名花有主、耍花枪、落花流水三大花系奥术，自称神恩眷顾者并兼有光影霓虹与控花两大异能
    颁封: 李察问她为何有如此之多的花衔中人集中在文莱主神庙，她答提拔百官本来就属于花中宰相的权限。她能提拔一百个爱花之人拥有花衔与花系奥术
    被迫自证: 三位巫妖王只承认李察是银瞳并新封魔翼天王，她方知中计；她坚称女神未抛弃银瞳，提出以薛南兰杜尔汲取召唤术作证，李察被迫跟念咒文，空间传送门与梦魇马车当众显现
    无赖局: 阿泰斯特受盖博指使揭出文莱主神庙圣火熄灭、她与女神失联一事。盖博与阿泰斯特当众反问什么时候问她要过证明，她按捺住怒火，带着几分赌气和骄傲挑了挑雪白的下巴
    身份自曝: 她向命运发出不甘的呐喊，说碧落之黄泉毕竟也有几率诞生女婴，历朝历代的貂蝉神使都是男人，众人凭什么一个个都这么固执地认定。她趴倒在地嘶哑着嗓子哭喊
    酒局: 李察神智失控那一段之后，嘉宝告诉他，昨晚的事她记不清楚。这一句把海华丝的身份彻底翻到台面上
    追随: 李察的魔界间谍之旅彻底失败，清醒后得知自己选了嘉宝提议的试练，去海岛击毙比目魔鲛取奥晶。她率全部魔梦圣女追随他回海岸贡献大陆
    夏宫: 孔雀美人与海华丝被转为夏宫专职圣女。李察在红土广场上让小空点化三千花之国士，让她颁封百位花官
    授封: 貂蝉大美人海华丝一个挨着一个赐名，飞花乱舞。她已指定十二种魔界名卉作为十二品花爵所对应的花朵，还剩八十八位名额；艾莉婕从鸳弗瑞族蝴蝶比蒙中挑出八十八位年轻漂亮的小女孩专门培养花官
    广寒月影: 五位人类大魔导师应邀观礼广寒月影仪式，李察与祭祀们一身清朝官服，两人在月石法阵铜镜前昭告英雄归来，号召爱琴人前来多瑙荒原迎战入侵者
    奉茶: 烟雾笼罩的美人替隆美尔奉上茶水，这位血精灵武士的目光接触到这位含烟美人时眼神突然变的怪怪的

  能力体系:
    花系无护甲: 花系魔法中带有护盾类别的法术，已知的只有李察用花甲之黏组合起来的鲜花盔甲。花衔中人本体抗魔低，以艾莉婕一代花后之尊也不曾拥有花系护甲
    名花有主: 三大花系奥术异能之一，就是颁封百官的那一门
    耍花枪: 三大花系奥术之一，用梨花最好，攻击力能有上升。她就是以此拦下李察的
    落花流水: 三大花系奥术之一，可以借助水源施展攻击的介质法术。李察称这一门为介质法术
    光影霓虹: 花系之外的另一大异能，她自称兼有
    控花: 操控花朵飞旋环绕，只是她异能的控制力，不是神迹。她靠这一手让花瓣飞到唇边替自己扩音
    颁封花官: 花中宰相的权限，能提拔惜花爱花之人拥有花爵与花系奥术。花爵中人只以本系花卉为魔法媒介，出了远门又遇不上本系花卉，一身花系魔法便形同虚设
    薛南兰杜尔汲取召唤术: 银瞳一族的古老召唤咒式。她在三位巫妖王面前以此术自证，李察跟念之后空间传送门与梦魇马车当众显现
    魔宠: 无

  随身物品:
    香水风信子: 海华丝鬓边的魔法花卉，金蕊白花、细藤翠绿，可将声音通过花瓣震荡传播到一千码范围，每增一千年花龄增加一倍扩音能力。李察曾经把它摘走过
    镜花: 貂蝉海华丝带来的特殊植物种子之一，可代替火炬照明，有望用于远程通讯
    十二种魔界名卉: 她指定为十二品花爵所对应的花朵，其中香水风信子是魔法花卉，太过罕见
    鲜花长袍: 鲜花织就的长袍，与她周身的轻烟连成一体

