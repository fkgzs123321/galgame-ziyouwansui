<%_ } _%>
    艾莉婕: 花中皇后、慕罗丹花的主人。她听不懂魔族通用语，海华丝第一次自报花衔时两人对不上话
    凝玉: 太后。她把孔雀美人连同海华丝一起转化身份，变成夏宫的专职圣女，理由是李察坚决不承认她们是比蒙的做法太缺德
    克拉克·盖博: 宝莱坞巫妖王，当众与她耍无赖泼皮，指使阿泰斯特揭出文莱主神庙圣火熄灭与她失联的内幕
    保罗纽曼: 荷里活巫妖王，被她的自证折腾得心都碎了
    嘉宝: 海岸贡献大陆的巫妖女王。她把海华丝的真实身份当面点破
    阿泰斯特: 六翼天王，当众抢过她的话头，坚持要她给出证明
    约克: 达坂镇丰沃之田商号的老板，一个肥硕的地穴恶魔。他向李察透露文莱主神庙与貂蝉美人的秘辛
    薇芝: 与海华丝同在魔界那一段路上的人。她念动命运的双生子诅咒失手，试衣时让约克惊艳
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 698) { _%>
