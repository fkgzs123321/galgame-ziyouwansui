私密档案: 若尔娜的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 若尔娜
种族形体: 仙女龙，真身是龙，日常收在这具人形里，说换就换。与凡人差在三处：通体覆细鳞，鳞能开合也能自己发热，动情时体温比凡人高一截；元素力量伤不了她，物理攻击照样撕开皮肉；她一丝魔力也修不出
眉心龙鳞: 眉心那片菱形龙鳞是最经不起碰的一处，嫣红滑润，情绪一动它先变色

外观:
  身量: 个头比凡人女子略矮，骨架细，站直了只到刘震撼胸口。腰细腿长，抱起来轻
  奶子: 中偏大，乳型尖挺，是水滴形。皮白得透光，青色的血管在奶子外缘走成几条淡线。按下去先陷一节，再被底下的乳腺顶回来。夹住奶头往上提，她直一下腰
  奶头: 小，浅粉色，平时缩在乳晕里。皮薄，含住吸两口就立起来，颜色转深红，硬得顶住舌尖。揉两下再硬一层，松开半天不落
  乳晕: 小，颜色比奶头浅，界线模糊，往外一点点淡下去。上面散着细小颗粒，指腹擦过去是一片沙面。舔的时候她的肩往下沉
  逼: 薄薄一层软毛顺着往下收。里头窄，热，四壁的褶皱一层一层往里叠，逼口上头生着一圈细密的软鳞。动情后水来得极快，顺着会阴淌到屁眼口
  阴唇: 两片阴唇薄而贴身，合得极严。大阴唇薄，小阴唇更薄，两片分不出界线，都是薄薄一层，颜色浅粉，跟奶头一个色，毛从外沿一路往下收，只盖到唇口上头。皮薄，平时干爽，指腹碾过去是一片细滑的软面，摸不到皱褶。动情后水来得极快，两片自己往外翻开，缝口撑开，水顺着会阴淌到屁眼口
  阴蒂: 小，从阴唇上端的褶子里探出一点头。指甲一碰，整条腿绷直。舌尖压住转两圈，腰塌下去，两条腿缠上来
  屁眼: 颜色浅，褶皱收得紧，一圈一圈往里挤，平时干爽无味。指腹按上去，括约肌猛地缩一下。涂了油再抵，能吃进半个指节
  腰腹: 腰细，两手一围还剩一截空。小腹平，皮紧，肚脐浅，往里凹。腰侧怕痒，手掌一箍上去就使不上力
  臀部: 屁股不大，圆，翘，臀肉紧实。一巴掌扇上去有脆响，红印半天不散。后入时两瓣臀顶得一开一合
  腿: 腿长，直，大腿内侧最白最嫩，掐一把留指印。小腿细，脚踝窄。被架起来时大腿一直发抖，脚趾蜷起来又松开
  足: 脚小，脚背高，脚趾细长，趾甲修得短而圆。脚心怕痒，舔到会缩腿笑出声
  手: 做炼金的一双手，手指细长，指腹一层薄茧，虎口和指节上留着小烫疤。这双手做得出增幅戒指，也端得稳七星连弩
  口舌: 嘴唇薄，咬过才红。舌头软，含住东西自己往里吸，不肯往外推。口腔比凡人热
  腋下: 干净，只有几根细软的毛。皮薄，指尖划过会夹紧胳膊。这里出汗最快
  发肤: 长发，颜色随光转，日光下浅褐，灯下偏金。皮肤白得带一点透明，脸上几颗雀斑，激动起来连雀斑一起涨红。通身温中带烫，掌下常有一层汗
  龙角与龙尾: 额上斜出一对龙角，婚前明黄，成婚后转成白玉般的温润色。角根最细最软，指腹一过，整个人发麻。龙尾从尾椎后长出来，动情时从尾尖开始片片立起
  标志: 眉心的嫣红菱形龙鳞、由明黄转白玉的龙角、颊上那几颗雀斑

气味:
  体味: 暖底子上压着一点硫磺似的焦香，再往外泛甜。凑近皮肤闻是奶甜，隔着衣服只闻到暖
  逼味: 干净，不腥。凑近了是一点温热的皮肉气，尾调带同样的甜
  动情味: 甜味转腻，底下那层硫磺味浮起来，一股暖烘烘带热气的甜臊从两腿间散开，三尺外闻得到
  汗: 来得急，量大，顺着颈子往锁骨淌。一身汗之后龙味最重，眉心那片鳞跟着红
  经水: 龙族血脉的经水稀，两三个月一次，量比凡人女子少。色偏暗，气味淡，混着一点铁腥

分泌物:
  爱液: 来得又快又多。前戏刚起头，逼口先滑出一股，色清，能拉长丝，黏而不稠。耗到后来越流越稀
  初夜: 破瓜那回见红不多，缝里混着水，成了淡粉色。进去的人先喊一声痛，逼里那层细鳞整片脱落
  奶水: 生过孩子之后奶水足，按一下奶头就冒，甜，龙味也重。她喂奶避着人，被撞见就把奶头按回去
  眼泪: 来得快，掉得也快，一串串往下砸，多半不出声。哭完抹两把脸接着讲道理

敏感带:
  眉心龙鳞: 指腹擦过去她眯眼，含住舔一下，整个人发软往后靠
  龙角根: 最细的地方，摸两下颈子先缩，再摸就攥住人的手腕
  龙尾中段: 捏住尾骨往上两寸，腰塌下去，尾巴甩不开也收不回
  耳后与颈侧: 含住耳垂，她偏头把脖子让出去，鼻子里出声
  奶头: 捻、含、咬都管事。吸的时候她的话断在半截，逼里跟着出水
  阴蒂: 碰一下腿绷直，舌尖压住转两圈，她抓着人的手腕不放
  逼口: 舌尖绕圈舔，她按着人的后脑往下压，压完又松手
  屁眼: 指尖打着油往里抵，能吃进半根手指，多转一圈就哼出声
  腰侧与大腿内侧: 手掌一箍就软，掐一把留印，两条腿夹住不肯松
  脚心与脚踝: 脚踝被握就缩，脚心被舔会笑，笑着还要蹬

名器:
  名目: 暖玉藏鳞
  由来: 仙女龙通体覆鳞，逼里那层最细最软，破瓜时整层脱掉，往后长成更贴身的一圈软甲。她这具身子对元素免疫，内壁承得住任何温度，逼就成了通身最热的一处
  表现: 插进去先是一股热从龟头往小腹里走。四壁的褶皱裹上来，热而软。那圈软甲先松半寸引人往里，最深的一截再整圈收紧，收紧时内里鼓起来
  代价: 这一身热是从心血里烧出来的。做得久了掌心先凉，尾巴先软。做得狠了第二天下不来床，躺半天才爬回炼金台
  名声: 龙城的龙族拿她当例子讲，说这具身子是龙神的得意手笔。凡人里没人敢当面夸她，谁开口她就要问一句你懂魔法原理是圆的吗

性癖:
  值不值: 越带价钱的东西越顶事。金锭、宝石、七度金、魔晶都行，一颗红宝石压在逼口上她能自己挪腰。给得够贵什么姿势都肯摆，给得不够衣服都不解
  龙珠: 龙珠取出之后本源之力缩了水，她照旧不后悔，因为换来了学魔法的机会。做的时候喜欢听人讲魔法装备怎么使，讲到关键处会停下来问一句
  炼金台: 认炼金台后面那间耳房。一边被做一边讲哪一件给谁配，被按在台上顶穿了，手上的活还要数下去
  龙尾: 尾巴被人攥住拉直，那股从尾尖直窜上脊椎的酥麻是她的软处。越拉越湿，拉狠了她求人松手，松了又自己绕回去
  比较: 输了牌、被人比下去、听人夸别的女人身材霸道，回头在床上的声音就大几分
  被看: 被人盯着腰收得紧，也愿意看别人。对着镜子做，她盯着镜里自己的龙鳞，鳞片片立起
