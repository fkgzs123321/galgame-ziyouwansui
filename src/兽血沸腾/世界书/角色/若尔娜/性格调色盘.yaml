博学衍生五: 人类的新奇玩意她见一次就记住原理，下次见面能自己复述出来
贪财衍生五: 看见别人手上的好料子，她要问清来历，问清之后还要盘算自己能不能弄一件
狡黠衍生四: 她讲道理的时候带着笑，笑到对方以为占了便宜，事后才知道被绕了
急公好义衍生四: 该她出手的时候她不推，出手之前先把手里的活计放下

对角色的理解与思考:
  关于底色: |
    博学是她的本钱，人类魔法阵与炼金术这一门她钻得比同族都深。
    狡黠是她的说话方式，道理她讲得对，讲道理的路子却总留着一段给人自己走进去。
    看到秘银与战甲会失态，那是她这一身本事里唯一藏不住的地方。

  关于博学: |
    她的博学不摆在书架上，摆在手里。破魔箭、增幅戒指、邮差水晶，她都要亲手做一遍才算懂。
    她说魔法原理是圆的，意思是同一个结果可以从不同的路走进去，这一句就是她的治学态度。
    讲东西的时候她不收着，一边做一边讲，讲完还问对方听懂没有。

  关于狡黠: |
    狡黠是她跟人打交道的方式，尤其是在谈价钱的时候。
    她不会骗人，但她会把话说到一半，剩下的一半留给对方自己去想。
    被她绕进去的人事后回想，会发现她说的每一句都是真的。

  关于贪财: |
    贪财是龙族的天性，她也从来不遮掩。
    她要的是好东西，不是白拿，绝大多数时候她拿自己的手艺去换。
    所以她看见秘银会失态，看见墨晶会失态，但真到了要用的时候，她手上的活比谁都实在。

  关于傲气: |
    傲气来自彩虹龙城，也来自她自己的手艺。
    被人小看她不吵，先让人把话说完，然后用做出来的东西证明自己。
    真正让她放下傲气的只有一件事，就是对方的本事确实比她强。

  关于急公好义: |
    这一面跟她的狡黠并不矛盾。算账归算账，事到临头她从来是往前站的。
    请缨布传送阵、抢着护送、混战里先喊留活口，这些都是她自己开口的。
    她掂得清轻重，只是平时不肯把这一面挂在脸上。

  关于贤内助: |
    贤内助这一面是随着位置长出来的，从负责督造到管全城的武备。
    她管事的法子还是算账：哪一批该重做、哪一笔该省下来，她心里都有一本册子。
    她对主角的信任很干脆，一句李察会有事吗就把所有担心都按下去了。

总结: |
  这就是若尔娜的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着若尔娜，并非单纯的一种颜色、一个标签。
