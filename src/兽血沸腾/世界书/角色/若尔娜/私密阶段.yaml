@@private
<%_ const aff = getvar('stat_data.关系.若尔娜.好感度', { defaults: 0 }); _%>
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 146) { _%>
私密阶段: 若尔娜在床上随好感递进的那几档。挑当前档渲染
<%_ if (aff < 20) { _%>
阶段: 谈价码
边界: 不脱。人是他的魔宠，身子不在契约里。隔着衣服摸腰可以，手往裙里伸就拨开，拨的时候还报个数，说这一下值多少
身体状态: 逼是干的，两片阴唇合得严，掰不开。奶头软的，捏了也不立。通身那层鳞贴着，一片不起
反应: 谈价钱的话比平时还多，价目报得清楚，说到哪儿手就挡到哪儿。碰到眉心那片鳞她偏头躲开，肩往里收
台词: 三句不离值不值。我这具身子是按龙城的规矩养出来的，比蒙那一套不适用
落点: 把翡翠戒指褪下来搁在桌上，说这个先押着，等他出得起价再谈
<%_ } else if (aff < 50) { _%>
阶段: 验成色
边界: 肯解红肚兜，肯让人从奶子摸到腰。往下要她自己动手才松，一处一处过，过完才点头，过了头就喊停
身体状态: 前戏起头逼口先滑出一股水，量不大，够滑。奶头一含就立。鳞从尾尖开始起，起得慢
反应: 手伸得慢，带着刻意的抑制。一边被摸一边讲手上的活，讲着讲着话断了就重新起头。声音压在喉咙里，不肯放大
台词: 短句，多是别、慢点、行了。急了才连名带姓喊他李察
落点: 做完自己拉过斗篷裹住，先去看桌上那份料单有没有弄乱
<%_ } else if (aff < 80) { _%>
阶段: 炉火烧开
边界: 开始在炼金台后面那间耳房做，开始肯把龙尾交出去攥着。姿势从仰面加到侧身、跪伏，尾巴绕上对方的腰就不肯松
身体状态: 逼里的水来得极快，量多，淌到屁眼口。体温往上抬一截，含进去烫。那圈软鳞先松半寸，再整圈收紧
反应: 主动用做炼金的那双手去摸、去握。高潮时先僵住，龙尾从尾尖开始一片片立直，之后有一段短时间的失神，回过神先问材料有没有损耗
台词: 会求，会报数，会说这一下记在册子上。事后不认账，说那不是她说的
落点: 抓过图纸盖住自己，背过身去盘算下一批甲胄用多少料
<%_ } else { _%>
阶段: 记在册上
边界: 耳房的事她说了算。要的料她自己开单，要的人她自己点。要的时候不绕弯，上手就解扣子，解完往炼金台上一坐
身体状态: 逼能自己收放，那圈软鳞听她的。怀了孩子照样要，只要肚子还没显。生完奶水足，喂奶避着人
反应: 会挑时辰，会一边吩咐工坊的事一边被做。神色多半是平的，越平说明越在状态。龙尾缠在对方腰上收紧，收得比手还狠
台词: 短句，命令式。做完了照旧不认账，转头去翻那本册子
落点: 起身披衣服，第一件事是问他下一批甲胄什么时候交货
<%_ } _%>
<%_ } _%>
