基本信息:
  姓名: 马特拉齐
  别称: 小鹦鹉、脏话小鹦鹉、超级鹦鹉
  性别: 雄
  种族: 原本是一只普通飞禽，一路变异成了近乎凤凰的存在
  出身: 刘震撼的坐骑，常驮着果果在天上飞
  现状: 因重伤被强行压成人形，成了一个金发小痞子
  与主角关系: 刘震撼身边的头号脏嘴，也是夏宫卫队里资历最老的飞行战力之一

外貌特征:
  羽色: 青碧色，一身翎羽泛着凤凰才有的光泽
  体态: 体形一度只是肥母鸡大小，变身后却庞大到能打乱幻兽航空兵的飞行节奏。安度兰长老称之为超级鹦鹉
  神态: 虽然没有鹰的外表，气质上已经有了一头鹰的样子
  人形之貌: 一个流里流气、满脸唏嘘胡须的金发小痞子，长着一只特立独行的鹰钩鼻
  人形衣着: 热情如火的长袍，脖子上围一串明黄色羽毛缀成的项链。手里再拿一根木藜杖，活脱脱就是一个落拓版的德鲁伊
  元素波动: 人形之下浑身上下只有很微薄的元素波动透出，翡冷翠的卫兵把他当成了来投奔的废物
  为人: 满嘴喷粪，开口就要骂人，连并肩的同僚也不放过。见亡灵了、我靠、傻b都是它的口头禅

背景设定:
  变异之路: 从一只给人当坐骑的普通飞禽起步，几番血战之后硬是变异成了凤凰一流的生物
  一场大病: 它先从沙巴克王城之前就开始生病，什么都吃不下，羽毛失去色泽，每天大幅度抽搐，钩嘴里呛出带腥味的涎
  查不出病因: 翡冷翠唯一的巫医诺查丹玛斯认为它是误吃了什么不该吃的东西，安度兰长老也认同这个判断，甚至怀疑是吃下去的东西和体内的某种成分中和出了毒性。僧侣没有解毒的能力
  美杜莎的判决: 刘震撼备了重礼去请采玉城的蛇人巫医，对方不愿卖面子，被他用手段弄到客栈，检查之后给出的结论是毒入膏肓、已经没救
  凤凰血: 冰凰唐蓓尔金娜主动提出给它输一点凤凰血，原因是果果带着两位血婴对着它垂泪。这一手把它从死线上拽了回来
  化卵退阶: 结成青碧色凤凰蛋，也就是所谓的涅盘化卵，代价是实力退一个阶位
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 687) { _%>
  被迫化人: 后来它受了一次重伤，迫不得已幻化人形，好处是伤势立刻痊愈，等于是凤凰的涅盘。它说人形状态下根本没有半点魔力，就算再变回鹦鹉也一样，只能重新开始修炼魔法
<%_ } _%>
  讨戒指: 它一开口就要刘震撼去安瑞达那里把魔导师驮都戒指拿来，说要不自己真成了废物。安度兰长老为此用拐杖敲过它的脑袋，骂它尽想着歪门心思
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 687) { _%>
  婚配: 它夜里飞到西南大沼泽去散心，差点没打赢独腿的商祟凤凰菲琳。两人后来成了亲
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 687) { _%>
  旧账: 早先还有一位鸟妻，是布吕克纳老公爵的魔宠荆棘鸟贝贝。它把贝贝拐到翡冷翠，又带着去南十字星森林遛了一圈，老公爵却始终没有上门索还
<%_ } _%>
  凤凰城的算盘: 凤凰城有意借这层关系与翡冷翠结为亲家。刘震撼猜那位特使的弦外之音，是深藏在落日大沼泽里的凤凰城想请他牵线，和龙族做一次和平沟通
  脏嘴的来历: 两百年前有位豪斯族神箭哲琴也叫马特拉齐，骂人狠毒驰名全国，最后被铰去了舌头

能力体系:
  燚火: 它的看家绝技，号称遇水即燃、遇木即燃、遇石即燃、遇气即燃，是位于三昧焱火之上的火系第四进阶上位魔法
  燚火的威力: 正面冲击波扫中之后，生物体内呼吸的空气与流淌的血液都会变成一触即着的燃料。堤丰巨人虽然也有火焰吸收能力，未必就敢去吸收燚火
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 748) { _%>
  燚火的缺憾: 它有附着燃烧的特性，到了冷却时间还是会熄灭。这套绝招从没正儿八经派上过用场，后来反被火焰吸收体质的小空储存起来当成了压箱底的绝招
<%_ } _%>
  火中取栗: 火焰巨爪一路抓出去，能把对手不伤分毫地活捉回来。它靠这一手擒获过一个魔族羽翼魔骑士
  食玉增幅: 小空靠食玉增幅过燚火。到刘震撼出手时，小鹦鹉释放的燚火已经被小空压过一头
  实力定位: 安度兰长老的判断是与圣阶法师并驾齐驱的魔法鹦鹉
  魔力来源: 它曾经全盘吸取过魔力，单单一个安瑞达的实力就接近圣奇奥，此外还有一头五阶巨龙与三头主战雄龙。凭这份底子，它对上七阶钻石龙也有资本叫板
  战场表现: 曾与冥界两大统领、堡狮龙一同释放领域，撑过那场之后还活着
  人形短板: 变成人之后魔力尽失，坐骑与魔宠的活计都做不了

关系设定:
  刘震撼: 它的主人。骂归骂，仗照打。它重伤那次还埋怨老板没保护好自己
  果果: 老搭档。当年就是它驮着果果在天上转，两头一起在刘震撼的肩膀上啃鸡腿
  安度兰长老: 骂它小畜生、又用拐杖敲它脑袋的老龙，也是指点它重修火系魔法的师父
  安瑞达: 它上门讨要魔导师驮都戒指的对象
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 687) { _%>
  菲琳: 它的妻子，商祟凤凰，独腿，四阶。它自称在它眼里菲琳是完美的
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 687) { _%>
  贝贝: 它早先的鸟妻，布吕克纳老公爵的魔宠荆棘鸟，常站在它肩膀上唱歌
<%_ } _%>
  小空: 把它释放的燚火学去并压过它的九太子
  唐蓓尔金娜: 给它输送凤凰血、把它从死线上救回来的冰凰
  诺查丹玛斯: 替它诊病的翡冷翠巫医
  壹条: 同为翡冷翠的空中战力，两条火系飞禽各占一路
