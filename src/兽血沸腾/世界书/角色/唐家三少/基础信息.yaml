角色档案:
  基本信息:
    姓名: 唐家三少
    性别: 男
    种族: 血婴，凤凰血裔。生身父亲是穆里尼奥，生母是他的冰凰魔宠唐蓓尔金娜
    出生: 冰凰早产下一枚无法孵化的凰蛋，被冻结成冰雕立在雪山之巅。李察用秘银手臂砸开冰晶，以自身鲜血血饲，蛋里出来两个血婴，他是霜雪皮丘兽的那一个
    排行: 双胞胎里的弟弟。哥哥唐家二少是那张小穆里尼奥的脸
    形态: 兽形时是一只霜雪皮丘兽，白金色皮毛，肥头大耳，半米高，比果果大出几圈
    鹣鲽: 凤凰一族给这种孪生子起的名字。受诅咒，永生永世不能分开、永生永世必须在一起。只有最不适合配对的夫妻才会有这样的后代
    教父教母: 李察要壹条做他的教父，又把教母的名分给了唐蓓尔金娜，每年允许这对母子相伴半年
    名分: 李察为他取名唐家三少。李察认他和二少是自己的孩子，穆里尼奥也认，两家的血脉与名分从此扯不开
    称谓: 李察是他嘴里的爹爹，果果是小爹爹，冰凰与凝玉、黛丝、若尔娜都被他叫妈妈，歌莉妮与歌坦妮是姐姐
    口齿: 他先开口问出他们该叫什么名字，捧回了二少与三少这两个称呼。落地第一句喊的是爹爹，随后贴着李察的大脸说他们的前半生太不幸了

  外貌特征:
    兽形: 霜雪皮丘兽的模样，白金色皮毛，肥头大耳，与果果长得一模一样
    翅膀: 左肋生着一只白色羽翅。二少那只长在右肋，兄弟俩各只有一只翅膀，凑在一处才飞得起来
    声口: 喊爹爹是一声嗲嗲的童音。这一副会说话的皮丘兽模样让果果当场哑了火
    变身: 与二少牵手之后白光一闪，化作一对翎翅舒展、浑身雪羽的鸢尾大鸟，各只有一只翅膀，身子挨在一处上下翻飞

  背景设定:
    破冰: 母亲把那枚孵不出的凰蛋封在雪山之巅的冰雕里。李察砸开冰晶以自身鲜血血饲，血雾散去之后地上站着两个血婴，一个是霜雪皮丘兽，一个是小穆里尼奥。他就是那只霜雪皮丘兽
    第一声: 他落地第一句就是爹爹，嗲嗲地喊出来；随后贴着李察的大脸说他们的前半生太不幸了
    认亲: 李察把他抱到众人面前，兄弟俩叫了海伦一声海伦妈妈，海伦当场晕过去；还没轮到凝玉，凝玉已经脸色煞白瘫在椅子上。果果戴着熊皮高帽的墨镜从鼻子拉到嘴唇，两个小眼珠傻傻地瞪着这只和它长得一模一样却会说话的霜雪皮丘兽，脏话鹦鹉连个屁都放不出来
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 311) { _%>
    改名换姓的代价: 穆里尼奥当众揭穿换蛋旧事，李察承认用一枚奇美拉卵换走凤凰卵，随即拔剑自刺腹部两剑还清旧怨，宣布此后只认唐蓓尔金娜与孩子的血缘关系。穆里尼奥转身离去，他与二少朝那个背影挥手喊坏人
<%_ } _%>
    三栖变身: 他与二少化成过佛肚竹，在桑干河化作各持一翼的鸢尾大鸟合体飞行，还变过一枝一红一白的并蒂莲。安度兰长老看破这三种形态就是鹣鲽的主要特征
    诅咒: 鹣鲽能变成任何植物或动物，涵盖空栖、水栖与陆栖，变身之后身上一丝元素力量也没有。变身之后各持一翼，凑在一处才飞得起来
    先天风寒: 安度兰长老指出他的咳嗽是先天风寒。摩尔亲王警告孪生血婴会抽干全部元素力量
    托付: 小鹦鹉与壹条经食毒蛊解毒成功那一年，李察宣布把他与二少交给教母唐蓓尔金娜照看几个月，每年相伴半年，要壹条做教父，另派彪人武士护卫
    顺手牵羊: 他继承了无良父亲顺手牵羊的个性，偷来穆里尼奥的宝石戒指孝敬安度兰长老，又吐出一支凤尾钗塞给三位妈妈
    打王子: 李察以迟钝光环和两道固态蛛网术把狂化的李察王子裹成蛛网茧，果果率孪生血婴变身连体牧树人，把王子的剑甲龙打得满地找牙。他与二少一同变身，一拳能把剑甲龙打一个跟斗
    被掳: 茵格里切宝以战剑穿穆里尼奥心口，他与二少被掳走。李察用果果的血婴小瘌痢格飞炼狱界名剑提尔锋，又召月光之陨竖琴齐射，两个孩儿才得保
    介丘: 海加尔山介丘仪式上，他与二少以网状雷电宰牲并当众汲取魔兽灵魂，修习堕落魔法的痕迹暴露在人前。穆里尼奥与唐蓓尔金娜当场带走孩子退场

  能力体系:
    血婴本源: 血系法师以自身血液孵化魔兽卵造出的魔宠分身。血婴与本体法师长得一模一样，只有这两个是例外，一个像果果，一个像穆里尼奥
    双系混合: 血婴残留宿卵魔兽胚胎的天赋魔法本能，与后天血系潜力融合成双系混合溅射魔攻。他天生带鸡尾酒魔力，智慧高超，魔法上却卡着一道巨大的瓶颈
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 318) { _%>
    变身: 鹣鲽体质的三栖变身，已见的是鸢尾大鸟、连理枝与并蒂莲，后来陆栖形态固定在恩特牧树人，空栖形态可化作博德族比蒙
<%_ } else { _%>
    变身: 鹣鲽体质的三栖变身，已见的是鸢尾大鸟、连理枝与并蒂莲
<%_ } _%>
    变身代价: 变身之后屏蔽身上所有元素力量。牵手那一下爆发的元素波动又强得异常，一分开就散
    连体牧树人: 他与二少一同变身成连体恩特牧树人，两人一起出手的力气能把剑甲龙掀翻
    雷法: 介丘仪式上他用网状雷电宰牲并汲取魔兽灵魂，这一手来自堕落魔法
    驮都: 他脑袋里也有一枚驮都。血婴寿终焚化会留下这种魔法结晶，是血精灵语里的血滴子、血珍珠
    魔宠: 无

  随身物品:
    凤尾钗: 他吐出来塞给三位妈妈的那一支
    宝石戒指: 从穆里尼奥那儿顺来的戒指，他拿去孝敬安度兰长老
    鹣鲽驮都: 取自他与二少脑袋的两枚驮都。贴身佩戴可变成他人外表，同时屏蔽佩戴者全部元素力量

  关系设定:
    唐家二少: 孪生哥哥，那张小穆里尼奥的脸。翅膀长在右肋，他那只长在左肋，牵手才有力量，分开就只剩一副没用的躯壳
    唐蓓尔金娜: 生母，也是他的教母。他被托付给她照看，每年可相伴半年
    穆里尼奥: 生身父亲。穆里尼奥转身离去时，他和二少挥手喊了一声坏人
    李察: 把他从冰里孵出来、给他取名的人，也是他认下的爹爹
    果果: 他叫小爹爹。他这只霜雪皮丘兽与果果长得一模一样，把那只脏话鹦鹉都惊得说不出话
    海伦.列娜与凝玉: 兄弟俩叫了海伦一声海伦妈妈，海伦当场晕过去；还没轮到凝玉，凝玉已经脸色煞白瘫在椅子上
    壹条: 李察指派给他的教父，另带彪人武士护卫
    黛丝与若尔娜: 他甜甜地叫妈妈的那两位仙女龙
    歌坦妮与歌莉妮: 他叫姐姐的那对天鹅姐妹，采玉城那几天他一身光鲜回来
    安度兰长老: 抱着照看他们兄弟的那位长老，也是点破鹣鲽与先天风寒、收下他孝敬戒指的人
    喀秋莎: 他啃着蛋壳就提起的小姐姐
    李察王子: 被他和二少化成的连体牧树人打得满地找牙的那位，坐骑是剑甲龙
    茵格里切宝: 冥界大统领，把穆里尼奥一剑穿心，把兄弟俩一并掳走
    小瘌痢: 果果的血婴，李察拿他格飞炼狱界名剑提尔锋，才保住三少和二少的性命
