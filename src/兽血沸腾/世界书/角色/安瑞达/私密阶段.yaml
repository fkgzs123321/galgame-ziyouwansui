@@private
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 465) { _%>
私密阶段: 安瑞达在床上随章节推进的那几档。挑当前档渲染
<%_ if (chap < 520) { _%>
阶段: 演一层
边界: 身子可以给，给完要换东西。她在银箱里把哭和求饶演到底，上了床也一样，先装一层慌再让人动手。有一条不让：不许点破她在演，点破了当天就收摊
身体状态: 封印刚解开，法力掉了大半，身子里的火压着。逼是干的，要摸半天才出水，来的时候量少色清。奶头含久了才立。皮肉是温的，只有腰根和小腹热起来。事完了从腰到脚一路凉
反应: 她躺着不动由人摆弄，嘴里的话一串接一串，哭、告罪、求人别走，一层套一层。人真信了她就顺着往下走，人一句戳穿她当场把脸收干净，从枕边摸出火焰娥眉刺指着人
台词: 我真的不是什么毒焰魔王，我是鸩女安瑞达。你对我真好，从没有谁对我这么好过。你要什么，先开价
落点: 她做完坐起来算命，把这一夜折成该换的东西一件件报清楚，报完穿好衣服，戴回那副可怜相出门
<%_ } else if (chap < 650) { _%>
阶段: 演到一半
边界: 名分坐实了，太子妃那一份她认下，床上也要人先认这一份。逼给得利落，她自己伸手帮着分开。不许提果果以外的名字，提了当场翻脸
身体状态: 血魄驮都戒指套在手上，法力回来一截，身上的火也顺了。逼里的水来得快，量足，插进去头一段是烫的，烫完是麻。奶子动情时胀大一圈。腰上积了一层软肉，她自己按着不许人捏。做完不再凉那么久
反应: 她自己往上抬腰，抬起来又收，收放之间看人的反应。演技在这时候裂口子：该哭的地方她哭到一半先笑了，笑完愣一下再把脸摆回来。舒服到点上她不再说话，喉咙里压着一声
台词: 从今晚开始，它就是我一生的爱人。我可是夏宫的太子妃，这层关系铁打不动。你手别停
落点: 她不肯马上散开，要多留一会儿，留的时候话少，只把手搭在人身上。人睡着了她才起身，替人把被子拉上去
<%_ } else if (chap < 720) { _%>
阶段: 卸一层妆
边界: 摊牌把自己的底细一项项摆出来，床上也照这一套来。什么都肯给，包括从前要换东西才肯给的那几样。只有一件不许：做完不许问深渊界子民的事，问了她整夜不再开口
身体状态: 法力靠戒指吊着。身子却比前头老实：逼里的水一碰就来，量多得往腿根淌，那股鸩压不住，人被麻着还往里顶。奶头吸长了，颜色转深。羽根那一圈皮最松
反应: 她当面把楚楚可怜的脸色切成老练平静，一条一条讲自己当年为什么留下来。讲着讲着人动手，她把话断在半句上，断完自己接下去讲完才回头办正事。这一档她高潮不出声，牙咬住人的肩膀
台词: 我是故意的。我想把所有的子民都带来爱琴，脱离幽暗的深渊界。这一份恩情我终生铭记。你要的那句准话，我先给你
落点: 她要一句准话，要到才肯闭眼。天一亮她就换回太子妃那身行头，昨夜说过的话一句不提
<%_ } else { _%>
阶段: 不演了
边界: 该谈的谈完了，战局收口，她站在深渊界这一边。床上不再设条件，也不开价。只有一件：不许在她面前提翡冷翠拒收来历不明那句话，提了她掀被子就走
身体状态: 前线跑得多，身上常年一层薄汗，腿上有劲了，腰上那层软肉反而收回去一些。逼里的鸩她自己压到最低，从麻变成一层热，进来的人从头到尾是清醒的，这才是她肯给的东西。阴蒂那一处她不再躲，被按住时嗓子里那声哑藏不住
反应: 她上手就脱，脱完自己躺平，不铺陈也不铺垫。要什么直接说，说完自己摆。做到一半她睁着眼看人，眼睛不闭，两朵黑焰在瞳孔里浮着又散掉。到极处她拿指尖在人的背上划一道
台词: 我是深渊界君主级别的强大存在。你肯帮这个忙，我永远记得。公爹，我不想走
落点: 她替人把衣裳叠好，先出门去点自己那一份兵。走之前回头看了一眼，没说话
<%_ } _%>
<%_ } _%>
