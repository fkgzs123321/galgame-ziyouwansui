角色档案:
  基本信息:
    姓名: 安瑞达
    性别: 女
    种族: 艾瑞达焰魔，从混沌世界来的领主级别魔兽。又名毒焰魔王，自称鸩女
    血裔: 鸩是凤凰中的一属，也就是毒凤凰。她这一支在爱琴大陆无人见过
    阶位: 深渊界君主级别的强大存在。当年被召唤到爱琴大陆之后，她是故意留下来的
    封印: 被月神爱露尼封印后，深埋在十星连珠寒潭附近的冻土之中，挖到天黑才从一个套着六层箱子的银箱里取出来，身上缠着风之符文傀儡锁链
    体质: 返老还童，每两千年一个轮回，由老变小再由小变老，靠固有生命力做循环满足自身需要，不需要外界任何养分。十个轮回之后才不再是活体
    形态: 轮回走到盛年那一段时的形貌，一米六上下，身量丰腴。她的返老还童每两千年走完一轮，由老变小再由小变老，落在外人眼里的时段并不固定
    名分: 名义上的夏宫太子妃，果果的媳妇。她自称这层关系是铁打不动的
    归属: 归入翡冷翠，编在盖世魔法太保团那一支
    结局: 魔族入侵爱琴时她一万多年没有回深渊界，光统合原先的下属、重整部族就要好一段时间，来不及帮上大忙

  外貌特征:
    身体: 一米六上下的成年女子身量，骨架细，身上有肉，丰腴而不过分。她是深渊界君主一级的存在，一万多年养出来的这副身体与她的位格相称
    做派: 怯生生地哭泣辩解，绝望中仍不断呼救。这副姿态是她的一层皮，被当众取笑演技好也不改口
    眼神: 天生雌灵之眼
    怪兽形态: 她的本体是浓浓黑烟，兽形张开时能化作一头遮住半边天的飞行巨兽，獠牙如火，红睛夺目，飞过时拖出长长的尾烟

  背景设定:
    现形: 月石法阵挖到天黑才取出套着六层箱子的银箱，里面是被风之符文傀儡锁链缠住的人。她躺在箱子里反复声明自己的名字是鸩女安瑞达，毒焰魔王这个称呼与她无关，众人竟一致认为这个艾瑞达演技不错。丽芙以月石布阵，射手取她的血制成毒箭对付地狱黑龙
    迷倒: 穆里尼奥清场，非精灵血统者全撤回翡冷翠，自己戴艺人面罩扮作普通精灵法师；李察不会收敛元素波动，被风之符文傀儡锁链捆住封住气息，果果也一同被锁。穆里尼奥连喷四道七日醉迷倒她，把锁链改绑到李察身上，果果却与她亲昵同食
    破箱: 她破箱而出，以黑翎偷袭重创穆里尼奥并杀死德鲁伊与大批月精灵战士。她自陈天生雌灵之眼，宣布果果是一生的爱人，要众人推选一个先死的勇敢者。剑圣亨利拼死护主
    被擒: 李察借雪佛兰战斧在月圆之夜催发二度狂化，挣脱风之符文傀儡锁链一记正踹重创她；穆里尼奥以密袈大手印补击，两人合力把她打晕卸开关节
    解封: 李察从血婴西罗的尸体上取下嵌着血魄驮都的戒指，因穆里尼奥要死先死那句话把驮都转赠给他，穆里尼奥又转赠花精灵长老切赫。切赫讲解元素连枷与魔法嫁接术，李察把戒指套到她的手上准备解封
    偷袭: 她睁眼以黑焰之火偷袭穆里尼奥，本应打入艾莉婕的受体光波误射切赫长老；李察弹出苜蓿花施移花接木，花瓣却打在小鹦鹉身上，魔法被嫁接过去。小鹦鹉化为神圣凤凰用龙语大骂，果果元素被抽空昏迷
    巨蚌: 十星连珠寒潭下钻出高逾二十米的巨蚌，她自述每两千年一轮回的返老还童体质却不肯说出封印者。蚌壳开启，双头铜蜃领主席尔维斯特现身
    拜见: 李察借骑士小说《精灵岂非池中物》戏弄艾莉婕，许诺下月十五为她举行广寒月影仪式。她正式拜见家人唤婆婆
    猎龙: 铜蜃领主的无序空间领域能克隆对手表现出的每一项能力并暂时屏蔽，她当场警告李察这一手；安度兰随后解说铜蜃珍珠的冰霜力量源自精神力克隆
    点破: 切赫说出慕罗丹花下死、做亡灵也风流的典故，她补充一句花后皆是万里挑一的美女
    摊牌: 她交代自己留在爱琴的真实目的，并自陈如今的深渊界和一万多年以前大不一样了，每块地盘都有了新的主人，她的魔法能力已大幅度衰退
    黎山门: 大型护盾结界被黄金矮人法师集群击溃，温格以龙语大召唤术唤出六头元素龙。她对外宣称是毒液系不死鸟的太子妃，当场用出烟系魔法，化作黑烟巨兽把天空清理干净
    迁徙: 李察准许她用马龙水晶传送阵迁徙子民，选西南行省附近的时空大裂缝上岸，那里是娜迦的地盘，起步发展不会有太大阻碍；她留下一批芫毒蓝蜘蛛给风语祭祀征召
    备战: 李察提议把炭精配方也卖给海族与魔族，另以两万份瑙白金诱她搅乱西海两国
    前线: 她被编入盖世魔法太保团，与神姬艾莉婕、老板娘艾薇尔和薇芝的胡克火控小组协同
    暗令: 李察信奉小心驶得万年船，毒焰魔王的凶名太盛。贝克汉姆与两位老板娘接到的暗地指令是任何时候她都必须被安排在最前线，一旦有小动作就由贝克汉姆的冷焰刀近距离格杀

  能力体系:
    焰魔: 艾瑞达焰魔出身的领主级魔兽，极度崇尚混乱，极度鄙视秩序。被封印之前是深渊界君主一级的强者，封印万年之后魔法能力已大幅度衰退
    烟系魔法: 火系魔法的变异形态，属于魔兽独有的进阶法门。她化作黑烟巨兽，以黑烟喷中的对手会像一百年没洗澡的烟囱工人一样拽着黑烟倒栽葱坠地，被她撕咬一口也是同样的下场
    借火烧天: 她所用的火系魔法，借用对手的魔法烧破他自己的天，可远程使用
    黑翎与黑焰之火: 破箱时以黑翎偷袭重创穆里尼奥，睁眼时以黑焰之火再袭一次
    雌灵之眼: 天生的一双眼睛，她把果果认作一生的爱人就是凭这一双眼睛看出来的
    鸩毒: 切赫长老提醒搬运箱子的人小心，她身上有毒
    返老还童: 靠固有生命力做循环，不需要外界任何养分。也正因如此，封印在她身上拖了一万年
    深渊君主: 与蓝眼高棉巨蚁、邪眼暴君、铜蜃领主同属深渊界诸君主
    魔宠: 无

  随身物品:
    风之符文傀儡锁链: 封印她一万年的那条锁链，能封住气息
    驮都戒指: 李察送给儿媳的戒指，原是公爹的遗物与深渊界君主的身份象征，足以保证魔导师级别的法力
    血魔导驮都戒指: 可为佩戴者补充魔力的戒指，能大幅增加千年魔芋美人的精神力
    芫毒蓝蜘蛛: 深渊界水陆两栖的小型魔兽，有鞘翅可供滑翔，跟随蛛后集体猎食，被她留给风语祭祀征召
    马龙水晶传送阵: 她用来把子民迁到西南行省附近海域的通道

  关系设定:
    果果: 她在箱中睁眼之后宣布的一生爱人，也是她的丈夫。她深情地握着还在啃参薯的果果的小爪子，果果捧起她的脸猛亲两大口
    李察: 她的公爹。他把她挖出来、放她出来、给她戒指、许她迁徙子民，同时也在暗地里防着她
    穆里尼奥: 连喷四道七日醉迷倒她、又用密袈大手印把她打晕卸开关节的天鹅主祭。她睁眼之后第一记黑焰之火打的就是他
    丽芙: 以月石布阵、取她的血制成毒箭对付地狱黑龙的月精灵女王
    切赫: 花精灵长老，讲解元素连枷与魔法嫁接术，由李察把驮都戒指先转赠给他，再套到她的手上
    贝克汉姆: 盖世魔法太保团团长，兜着格杀她的暗地指令，也是与她同在一个单位的人
    艾莉婕: 神姬，与她同在胡克火控小组；她那一记误射的受体光波原本是打向艾莉婕的
    艾薇尔与薇芝: 与她同在胡克火控小组的两位
    席尔维斯特: 双头铜蜃领主，从巨蚌里现身；他那种克隆对手能力的领域由她当场点破
    穆里尼奥手下: 她破箱而出时杀死的大批月精灵战士与德鲁伊
    亨利: 剑圣，拼死护主的那一位
    温格: 以龙语大召唤术唤出六头元素龙的法师，与她同在黎山门那一战
    隆美尔: 与她公爹交底的那位炼金之王
    文泰克莱尔与阿仙奴: 与她一道被李察摊牌的两位
    若尔娜: 与她一道带回红十字法香水豚和水晶六首王蛇的那位
