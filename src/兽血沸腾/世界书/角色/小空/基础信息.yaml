角色档案:
  基本信息:
    姓名: 小空
    性别: 男
    本相: 大力怪猿修炼出人形。丝绸大陆把这类修成人形的神兽叫山精水怪，大力怪猿在丝绸大陆以天生神力闻名，单拼力量时超阶神兽在它面前并无优势
    名号: 丝绸名号冬空，丝绸语意为意念中的空气。李察认他做九郎之后，众人叫他九郎小空
    身份: 唐藏亲王玄奥的壮汉殿下的首席学徒，也是一群学徒里的大师兄。李察认下这段父子缘分后，翡冷翠上下称他九太子
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 595) { _%>
    花衔: 花爵中人里的花将。花王、花后与花将三位一体共生，彼此之间横着一条无法背叛的伦理关系
<%_ } _%>
    金枝玉叶: 他是帝女花，天生的金枝玉叶。爱琴的算法里，这是天生的控金者与品玉者，其他金属和石头他一概无能为力
    容貌之变: 卡卡用大变相毒气把他从一个猩猩般的大块头改成星眸剑眉、唇红齿白的英俊僧侣，乱蓬蓬的头发照旧
    兵器: 纯精金打造的长棍，茶杯口粗细，换算成爱琴制重达十万八千磅，也就是五十四吨。他另有一根能无限延伸的黑昙金棍

  外貌特征:
    原形: 鬓角斑白的猩猩般巨汉，比金刚猩猩还要孔武有力，手持一根脏污的金属棍，腰里围着虎皮
    改貌后: 星眸剑眉、唇红齿白，身高没变，一头乱蓬蓬的头发没有跟着变。李察认得他手里的棍子，却认不出这张脸
    人形装扮: 一身华丽锦袍，手摇金属折扇，谈吐风雅；脚踩金丝步云履，身着紫金鱼鳞甲，头顶金冠斜飘两根长长的七彩雉翎
    作风: 谨慎知进退，说话爽利务实，看不惯爱琴人死心眼
    举止: 夹在导师与便宜老子之间左右为难，跪下来那一声参见父王喊得艰难。在街头遇上紫色霞云时握着扇子失神，被李察一眼看破

  背景设定:
    桑日岛重逢: 三位唐藏僧侣与一匹鳞甲白马在雨中现身，他当头一棒打在壹条脑门上。他以焱系法术与壹条对拼，变身为博浪沙火鹤，暴露了水火风三系豁免之力
    对拼: 他以纯精金长棍与李察徒手对拼，被老刘揪住头发按倒。亲王改用爱琴通用语盘问，李察自报是李察、小猪崽喀秋莎的养父，亲王才知打的是恩人
    拜父: 他嗫嚅着跪下，参拜李察为父王。李察当众推艾莉婕认下花后名分，又接受这段缘分认他为九郎，他依次拜见母后、三位母妃与叔叔壹条，并请教花衔的奥秘
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 596) { _%>
    三位一体: 唐藏亲王讲明花王、花后与花将三位一体共生，蕴含无法背叛的伦理关系。他的花系异能只在伤到花王与花后这两个人时才会反弹到自身，这是弑亲逆伦之罪。佛巨人明姚凭姬丝凯碧看穿人心，当众指出李察与艾莉婕有夫妻之实
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 599) { _%>
    花廷源流: 唐藏名山中的花廷，前身是门派怡花宫，靠收拢花爵中人壮大，改宗之后供奉水仙凌波仙子、荷花冰肌仙子、桂花含香仙子与梅花罗浮仙子四大花仙。壹条当年被怡花宫的领头围攻，靠父亲相救。四大花仙后来傍上玉系神恩眷顾者玉皇
<%_ } _%>
    翻脸之由: 花廷招揽过他，翻脸的关键是他偷吃了花廷高层用无数玉石培养出来的物华天宝温良如玉蓖麻。玉廷本打算用这种药草招揽超阶神兽虎纹鹿蜀守山门，多年心血被他一口吃光
    招降龙马: 吃过温良如玉蓖麻之后，他对任何马类都有勾引力和亲和力，体液与气味还能为马类祛除瘟病。导师胯下那匹水晶龙马，就是他从一条凶险湖流里无条件招降来的
    控金: 艾薇尔设想用他的控金术搬起地底直布罗陀河底的精金山砸敌。他说明控金受空间面积与掌心半寸的限制，也由原始形态决定能力，变成火鹤或基头座龙都改变不了这一条
    点化国士: 他能点化三千花之国士，赐下矢车箭技与大丽膂力。花之国士的盔甲武器至少要细金打造，否则开了金蕊异能也算不上花之国士，成不了金相玉质。花之国士分殿帅、旅帅与普通花士三级
    矢车花士: 矢车箭手按殿帅五弓、旅帅四弓、花士三弓编成，配夸克多水银弦战弓，能分取目标，误差不超过一花之距。他自认不会矢车箭技，那是花士的战技
    东方法术: 他向爱琴诸强介绍丝绸大陆的云系法术与制药技术，丹药可疗伤、增长法力，罕见的灵草丹药更能无害提升一阶修为并延年益寿，五位大魔导师争相求购
    阵法: 黎山门的护盾实为唐藏皇室独有、一城仅配一套的军用机密五行防御大阵，被他揭穿，需堪典罗盘师重布为四象、三才、两仪防御大阵。七宝塔塔底的地宫是云秦方士留下的禁锢法阵，他指认那是九宫数独阵，连声音与瞬移都被圈禁
    黎山门: 攻打黎山门时他佩着香水风信子踏夜雾腾空，替荷露城官府喊话，被城楼上的秃头壮汉骂作娘娘腔小子。夏宫仆射射断吊桥铁链，百多位祭祀的战歌光环刷新全军，航空兵与镜炮覆盖城墙

  能力体系:
    神恩眷顾: 受金与玉两系神恩眷顾。神恩眷顾者在某一种物质中享有绝对的权威与操控力。他着重于金枝，控玉方面只有品玉，这一手连玉皇也没有
    控金术: 凭此挥动十万八千磅的纯精金长棍，如挥空气。限制是可控的空间面积与掌心半寸的范围，还由原始形态决定能力上限。他还能让适量金子自动凝合成盔甲一类形态，这一步极耗火焰之力，制约了他大批量这么做
    品玉: 通过食用美玉增加元素力量，是他玉系能力的全部用途
    燚火: 东方称为四嘉真火，爱琴称为燚火，火系第四进阶上位魔法，位在三昧焱火之上。效力是遇水即燃、遇木即燃、遇石即燃、遇气即燃，遇气这一条尤其可怕，已知世界里没被气体包裹的东西并不多
    火焰吸收: 他不能自己修炼火焰法术，只能先吸收火焰，再靠食用美玉去壮大和储存这种火。战斗中动用只能近身，做不了主打手段
    一气化三清: 一式贯杀哈迪斯三头冥狼的身法
    云系: 云系法术借金丝步云履施展，能脚踏云雾在空中腾挪如履平地
    变身: 凭软玉之体幻化成任何形态，从博浪沙火鹤到大块头班尼路武士都行。金玉两大元素融合、拉长、扩展就成，兼有水、火、风三系豁免之力。这一手在导师眼里毫无用处，只是好玩
    棍术: 力大无穷的高超棍术，与李察徒手能拼上许多回合
    魔力共鸣: 吃过温良如玉蓖麻之后的另类体质，能与大自然时时刻刻保持同步共鸣。只要空间里还有元素力量存在，本体就能源源不断地分享和获取魔力
    亲和: 因这层体质，他对马类有亲和力
    花将: 控花能力上有别于其他花衔。他这一身焱火、变身、云系与棍术，半点和鲜花沾不上边，这是花将身上最说不通的一处
    魔宠: 无

  随身物品:
    精金长棍: 纯精金打造，茶杯口粗细，十万八千磅重
    黑昙金棍: 黑昙金这种魔界金属可以无限延伸，搏斗时他能在刹那间把金棍暴长数尺，像长枪一样贯通对手身体
    金丝步云履: 脚上那双满沾泥泞草屑的破靴子。云雾系法术实为这双魔法道具带来的，能脚踏云雾在空中腾挪如履平地
    金属折扇: 人形装扮里手摇的那一把，黛丝锻造的第二代武器，既能充门面扮高雅，又能杀人越货
    香水风信子: 攻打黎山门时佩在身上的扩音名卉
    荼蘼果: 原产地是卓尔精灵萝丝神庙的水果，入口清甜略涩，胜在籽实繁多，破开便会在狭小空间里来回爆弹
    温良如玉蓖麻: 他偷吃的那种，落下了魔力共鸣体质与对马类的亲和力

  关系设定:
    李察: 认下的父王。他与李察先以棍对拼，再跪地参拜，之后夹在导师与便宜老子之间左右为难的时候最多。李察给他的排序是九郎，他才有了九太子这个称呼
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 645) { _%>
    唐藏亲王: 导师，即五殿下冬五、玄奥的壮汉殿下。他一路跟着这位亲王，也由这位亲王讲出花王花后花将三位一体的来历
<%_ } else if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 595) { _%>
    唐藏亲王: 导师，玄奥的壮汉殿下。他一路跟着这位亲王，也由这位亲王讲出花王花后花将三位一体的来历
<%_ } else if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 70) { _%>
    唐藏亲王: 导师，唐藏来的亲王，他一路跟着这位亲王
<%_ } _%>
    艾莉婕: 母后。他依次拜见母后时，花后的名分是李察当众推她认下的。这位花后年岁比他小得多，他暗自叫苦
    凝玉与黛丝: 他拜见的三位母妃里的两位，另一位是海伦
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 633) { _%>
    壹条: 他叫叔叔的那一位。两人头一回照面是他一棒打在壹条脑门上，此后并肩在桑日与黎山门作战。壹条冲进七宝塔地宫时是他从背后抱住的
<%_ } else if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 596) { _%>
    壹条: 他叫叔叔的那一位。两人头一回照面是他一棒打在壹条脑门上
<%_ } _%>
    小净: 导师的另一位学徒，名号意念中的洁净，海族壮汉。他排在前面，小净叫他大师兄
    喀秋莎: 李察的养女小猪崽，唐藏亲王当年交到李察手里的小生命。同席时亲王把她抱得比谁都紧
    紫色霞云: 他在街头一见倾心的那个小妞，当时握着扇子看得失神，被李察当场点破
    卡卡: 用大变相毒气把他改造成英俊僧侣的那位德鲁伊。改造之后他甩掉了接近裸奔的野性打扮
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 596) { _%>
    明姚: 佛巨人，当众指出李察与艾莉婕有夫妻之实的那位
<%_ } _%>
    达历桑德罗: 号香君，与李察约定打一场最差劲法术友谊赛的那位星界之王
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 763) { _%>
    嘉宝: 大结局登门邀战三对三的那位巫妖女王
<%_ } _%>
    文泰克莱尔: 十太子，若尔娜的儿子。九郎与十郎的排序就此分开
    卡尼吉亚: 八歧巨蛇，在桑日岛被他与壹条合力逼出洞来
    奥尼尔与内德维德: 矢车箭手就位时，奥尼尔当场试射一箭双发，被内德维德评为花哨有余、战力不足
