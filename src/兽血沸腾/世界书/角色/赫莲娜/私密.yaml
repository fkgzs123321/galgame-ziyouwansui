  逼: 毛少，只在耻骨上留一小片，黑，硬，修得齐。外面合得严，中间那道缝细得看不见，掰开要用力。里头比体表烫，往里一层一层收，最深那一寸是她的本钱。水来得慢，量少，出来清亮一层，抹在指头上干得快
  阴唇: 大小阴唇都窄，贴肉，颜色比通身浅半号，暗里透紫。大阴唇只有浅浅一道隆起。小阴唇收在里头露不出边，左边那片比右边长出半分，边沿留一道旧裂口长合后的白痕。两片合住时指腹碾过去摸不到褶。动情时血色先上来，两片涨深，自己往外松开一条缝，水顺着会阴往屁眼口走
  阴蒂: 藏在两片上端交汇处，盖着一层薄皮，拨开才找得到。平时缩着，指腹压住揉两下就硬成一颗石子。碰它她两条腿往内并，并完又自己分开。这一粒不讲价，破了功她不认账
  屁眼: 深褐色一圈细褶，收得紧，平时干爽，没有气味。手指抵上去括约肌先缩一下，再一层一层松开。进去要油，头一回进去她整个人绷成一条
  腰腹: 细腰是她的招牌，肋骨下缘到胯这一段薄，摸不到什么肉。小腹平，脐浅，往里凹。腰侧被手掌从背后箍住，上半身的力气当场散掉，人往那只手上倒。平时腰上束一道蛛纹银带，夜里解开留一圈带痕
  臀部: 大，圆，肉厚，从后头看是两座坡，两瓣分得开。一巴掌打上去声音沉，红印要半天才浮出来。从后头按住时两瓣自己往两边让。仪式那一晚这一处洇出过鲜红，那以后她不许人从后头先动手
  腿: 大腿粗圆，内侧的肉细，掐一把留印。小腿直，膝弯软。她做主母，走路慢，一步是一步，劲全收在里头。缠上人的腰能箍住不放
  足: 脚不宽，脚背不高，脚踝细。常年塞在暗色软靴里，脚心一层薄茧，脱了靴带一点皮革气。脚是凉的，捂半天只热到脚背。脚心被舔会缩，缩的时候脚趾全蜷起来
  手: 一双细长的手，指节小，指甲修得尖而短，甲面涂一层暗色。白天拿神庙的仪杖、翻本城的账册，也抽过人的耳光。手腕内侧的皮最薄，按下去看得见青
  口舌: 嘴唇薄，唇色暗红，说话慢，尾音往下压，一句一句交代清楚。嘴里的温度比别处高，舌尖软，舌根深处就是黑暗吮吸术的落点。她含东西之前先报一句自己用几成力
  腋下: 干净，毛很少，腋窝浅。地底不出汗，上了地表才出，一出就是湿的一层，带一点土闷味。被舔到把胳膊夹紧，夹住不放
  发肤: 一头黑发，长，垂到腰下，平时编成主母的发式，用蛛纹银饰压住。皮是地底养出来的暗，肩背与锁骨那一圈比别处浅。摸上去滑，凉。后颈和手腕内侧的皮最薄，后颈那片一碰起一层细疙瘩
  尖耳: 卓尔的一对尖长耳，耳廓薄，耳尖往上挑，耳垂小。额上蛛纹饰物两端的链子挂在耳后，链子一荡她偏头。耳廓边沿被含住她的话断在半句上
  暗肤: 地底养出来的肤色，通身一层哑光，亮处透一线淡紫。到了地表被日头晒过，露在外面的那几处发红起皮，日落才褪
  蛛纹: 额心那处蛛形暗纹，是萝丝神庙里受下的印记，平时被饰物压住，剥下来才看得见。八条足从额心往外散到发际。平时是一道浅影，动情或者召黑暗元素的时候浮出来，颜色转深，按上去烫手
  标志: 一对尖长耳、额心那颗主母蛛纹、暗色主母长袍与腰上那道蛛纹银带、胸口那五道没褪干净的旧指痕

气味:
  体味: 地底养出来的干闷气，底下压一层神庙里熏过的香料味。贴到颈边才闻得到
  逼味: 干净，不冲。凑近是温热的皮肉气，底下压一点极淡的土腥，放到深处才透出一丝甜
  动情味: 甜味往下沉，从两腿之间散出来，隔着一层暗色长袍压不住。她自己闻到了会把袍子拉紧
  汗: 地底不出汗，上了地表才出，量大，后颈和腋下先湿。汗滑，落在皮上发亮，凉下来是土闷味
  经水: 量中等，颜色偏深，气味偏重。那几天她照旧理事议事，只是不让人近身

分泌物:
  爱液: 来得慢，量少，出来清亮一层，抹在指头上干得快。越往深处越稠，到最深那一寸是黏的，带一层暗元素的涩
  初夜: 落红有，颜色暗。她的初夜是主母受封那一夜的事，褥子按神庙的规矩当场烧了。仪式那一晚流的血是别处的血
  奶水: 没有。挤不出东西，只有奶头吸久了尖上渗的那一点白
  眼泪: 掉得出来。仪式上她口吐白沫、半休克，眼睛是干的。场面要哭的时候她哭得成串，掉完自己擦掉，转头接着报数

敏感带:
  阴蒂: 指腹压住揉两下，她把腿并起来，并完自己分开。这一处一碰，那层主母的做派就散了
  耳后尖耳: 链子一荡她偏头，含住耳尖她的话断在半句上。耳后那片皮一碰起一层细疙瘩，是全身最不经碰的一处
  额心蛛纹: 指腹顺着八条足从额心往发际捋，蛛纹浮出来发烫，她眼皮垂下去，脖子先让出去
  逼道深处那一寸: 名器结账的地方。人咬在最深那一寸上，她自己也要跟着抖一下，两条腿夹不住，腰往下塌，逼水会突然多出一层
  奶头: 捻、含、磕牙都有效。吸住不放的时候她报数目报得断断续续
  腰侧: 从背后一掌箍住就使不上力，人往那只手上倒，倒过去不急着起来
  后颈与发根: 发式被拆开，后颈露在空气里，她自己缩肩，缩完把脖子递回来
  脚心: 常年塞在软靴里闷一天，被舔到缩回来，缩的时候脚趾全蜷

名器:
  名目: 光阴难买一寸金
  由来: 卓尔主母受封那一夜要在萝丝神庙里过，蛛后的恩泽落在身子里，逼道内壁一寸一寸生出各自的脾气，寸金是其中一味。别的卓尔女子是内壁一圈肉，她这里是一道价目，进一寸收一寸，进得越深收得越贵
  表现: 进去头一段软，给得大方，谁都能撑过去。到第二段内壁开始换手，一层往里收，一层往外推。再往里走，整条肉道拧成一股往内卷的劲，把鸡巴咬在最深那一寸上转着绞。逼水里的暗元素渗出来，不麻人，只把人的腰酸掉半截，酸到人自己往前顶，人越顶她收得越紧
  代价: 这一门吃她自己的力气。术是外头那张嘴，器是里头这条道，两样同时开她就撑不住。术她敢只使八成，名器收不住八成，这是她的死穴。开完一回要拿黑暗元素往里填一夜，第二天手脚发软
  名声: 卓尔主母们正是拿这件名器判断男人是否身怀异禀。堕落仪式上一位主母当场认了名目，另一位嘀咕一句，说他把赫莲娜弄的好惨。刘震撼从这门名器底下走脱出去，主母们之后称他守望者阁下

性癖:
  按仪礼走: 上床也按主母的仪礼走。先按位分站定，再开口报自己用几成力，数目报小了是看不起她，报大了是把她当外人，报完才动手
  一寸一寸的价: 她喜欢听人报走到第几寸。走到深的人，她要人把身上最要紧的东西押在桌上，押完才肯让人再往里进一寸
  八个方向: 蛛纹的八条足朝外散，她喜欢人从耳后一路舔到额心。她数得清，少一下就要补回来
  在上头才算数: 人躺平了，她按着人的肩自己坐下去，坐到底停住不动，等人先开口求
  众目之下: 堕落仪式那晚八位主母围在荼靡架边看着，她照旧做完全套，笑声放得很开，荡在大殿上空
  账当场结: 做完要结账，她给了多少就得收回多少。收不回来的人，往后连她的神庙门槛都进不去
  哭给人看: 场面要的时候她哭得成串，哭完擦掉，转头接着报数。能把这两副样子接住的人，她才肯在议事的席上替他说一句话
