私密档案: 赫莲娜的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 赫莲娜
种族形体: 卓尔精灵，地底黑暗精灵，魔索亚细亚城主母，八位卓尔主母之一。骨架细，肩窄腰细，一对惊人的胸脯配一副惊人的细腰。皮是地底养出来的凉，通身一层哑光的暗，亮处透一线淡紫
名器寸金: 全称「光阴难买一寸金」，主母们口里叫它寸金。卓尔八城没有女王，主母之间比位分也比这一件
黑暗吮吸术: 卓尔主母独有的秘术，走的是口舌与喉咙深处。术开到底时喉内壁一层层往里收，收得她眼眶发红，开完一回喉咙哑上半夜，喝水都涩
主母仪礼: 一身暗色主母长袍，额上束蛛纹饰物。开口先报数目，站位先看位分，位分不到她不动

外观:
