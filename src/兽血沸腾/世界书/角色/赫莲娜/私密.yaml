  奶子: 一对大奶子，份量沉，坐着往两边坠，躺下才回到胸口上。地底养出来的暗皮，上缘比别处浅半号。一只手托不住底，肉从指缝里溢出来。捏住时是凉的，捂一阵才从肉里热出来，热出来整只发胀。仪式那天胸口被按出五道深深指痕
  奶头: 中偏大，暗褐色，平时缩在乳晕里，摸不出形状。指腹捻两下就立，立起来朝前翘，颜色转深红。牙齿磕一下，她当场用手背挡开，挡开以后要人从头再来
