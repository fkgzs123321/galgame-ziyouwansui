@@private
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 211) { _%>
私密阶段: 赫莲娜在床上随章节推进的那几档。挑当前档渲染

<%_ if (chap < 215) { _%>
阶段: 仪上御术
边界: 仪式既定，次序与用几成力按蛛后的旨意排定，她自己不能改。衣裳可以撕，胸口可以按，名器照结账；她要守住的是术力不许上到十分，仪上也不许人快或停。
身体状态: 上身衣裳零落，胸口印着五道深深指痕，头发被汗贴在唇角。术力压在八成上，名器的账却收不住八分，逼道深处那一寸自己往内卷，逼水一层层淌到臀缝，臀下洇出鲜红，口里泛白沫。
反应: 她一边抵御强烈的快感，一边扮出楚楚可怜给旁边的姐妹主母看。撑不住时不出声，缓过一口气才把话捡回来，先报自己用了几成力。手抓荼靡架的横木，指节泛白。
台词: “他支撑不了多久的，我的黑暗吮吸术力量只使用了八成。”/“这么放水也不是个事。”
落点: 对面在浓雾里挣开身子消失不见，她被松开，晃了一晃，滑着身子瘫倒在荼靡架下。收场第一件事是把放水的数目报清楚。
<%_ } else if (chap < 340) { _%>
阶段: 扶门收势
边界: 仪式报成之后到全族迁往地表这一段，她的身子是借出去用完还回来的。床上的事她一律推掉，谁开口她先问一句本城的账目算到哪里。真到了床上也只让人从旁边挨着，不许从后头来，不许碰臀缝那处旧伤。
身体状态: 手脚发软，走路要扶着门框，八位主母一齐挨在神庙门框边沿上就是这个样子。胸口的指痕结成浅色的印，逼口松着一线合不上，往里那一寸使不上劲。奶头缩着，摸上去软。腰一弯就酸。
反应: 她扶着门框站定，把主母该有的那副体面重新挂回脸上，开口前先清一遍嗓子。手按在人肩上试着力气，试到一半自己先笑。真要动，她让人先把门插上。
台词: “本城的口粮先算，别的事押后。”/“我这副样子，你看着办。”
落点: 她回到主城统筹迁徙的名册上，只派幽月儿带八百名双头奇美拉骑士随军，床上的事推到迁徙之后。
<%_ } else if (chap < 500) { _%>
阶段: 轮值专断
边界: 卢塞恩城立下轮值城主制，摩尔与卓尔轮流派人，每一月轮换。轮到自己那一月，城务由她一人专断，床上的规矩也由她定：章程立在纸上，纸上写着的才作数。轮不到她的月份，城务交出去，账本还握在卓尔手里。
身体状态: 身子是养足了的，皮肉按下去回弹快。逼口收得紧，往里那一寸随她使唤，收放由她的意思走。奶头硬得快，硬起来深红。腰上的蛛纹银带夜里解开，皮上留一圈带痕。
反应: 她把祭司与武技长一并调到跟前听用，床上也一样，先点人，再点次序。她坐上去不动，等人先开口求，求到点了才往下坐到底。做完全程她撑得住，收拾干净再议事。
台词: “这一月里，我的话就是章程。”/“你先跪着，等我说完。”
落点: 她把本城那一个月的章程定完，军权与粮食的调度一并写进去，做完她在算下一轮换的日子。
<%_ } else { _%>
阶段: 开门伪善
边界: 卢塞恩城开门之后，城里城外都讲往来。人前她摆足礼数，床上的礼数也一分不少：先谈，再宽衣，账目落定才动身。谁要在礼数之前伸手，她把人的手拨回去，请他重新从头站着。
身体状态: 通身是养足了的暗色皮肉，日头晒过的地方发红起皮，日落才褪。逼口收得住也放得开，逼水清亮一层，量少。阴唇在事前自己先松开一条缝。额心的蛛纹只在动情时浮出来。
反应: 她与七位主母、摩尔亲王一同带仪仗队出迎，脸上堆着热情，回到内室先验一遍对方的斤两。她笑得慢，笑到一半收住，看人接不接得住，接得住才往下走。
台词: “远来的客人，卢塞恩城的门为诸位开着。”/“把衣裳解了，我们再谈价钱。”
落点: 床上也结账，一分不让；做完她把袍子穿回去，第二天照旧出迎，迎完回内室再盘一遍本月的进项。
<%_ } _%>
<%_ } _%>
