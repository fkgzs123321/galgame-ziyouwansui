角色档案:
  基本信息:
    姓名: 唐蓓尔金娜
    性别: 女
    种族: 凤凰族，冰凰。凤凰族是不死鸟与凤凰附庸魔兽组成的族群，全员协防忘忧谷
    形态: 冰凰。她的领域与冰相关，在雪山之巅能借主场把冻魔领域推到极处
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 737) { _%>
    身份: 凤凰一族的冰凰，素鸾长老费迪南德的同族；采玉城一系，天鹅主祭穆里尼奥身边的人
<%_ } else { _%>
    身份: 穆里尼奥的冰凰魔宠，随他住在采玉城
<%_ } _%>
    孩子: 唐家二少与唐家三少，一对孪生血婴。二少是一头霜雪皮丘兽的模样，三少酷似穆里尼奥
    生母名分: 那枚早产的凰蛋出自她身，两个孩子由这枚蛋孵化，血缘上的母亲就是她
    教母名分: 李察当众把两个孩子的教养托付给她，每年可以相伴半年，教父是壹条
    身世之痛: 她被命运一再捉弄。血腥玛莉下毒那一回，穆里尼奥当众认定是李察一再伤害他的冰凰

  外貌特征:
    形貌: 冰凰的真身，与火凤相对的一支，雪白翎毛
    人形: 白光一滚化成的白衣女子，一头青丝如雪。她跟人说话时甜润动人，冷美人一笑要人半条老命
    气息: 冰雪聪明，通情达理，站在人前从不失态
    性情外露: 她抱住那座冰雕，伸开颤抖的手臂像拥抱世界一样抱住那团冰冷，不停亲吻，泪水滴落又化作冰。午夜梦回常为两个孩子哭醒
    做派: 为孩子能牺牲一切，也能一再冒险去帮李察的忙。刚小产过就登门向李察道谢，被问到孩子的事脸色会一片苍白

  背景设定:
    早产: 李察把巴掌大的咸水夔牛牛黄碾成粉末强塞给她服下，反倒催动了早产。她提前产下一枚无法孵化的凰蛋
    冰雕: 她把那枚凰蛋冻结成一座冰雕，留在雪山之巅，说让尘封千万年的冰雪写下永不消失的爱
    血饲: 穆里尼奥扬言要杀李察，李察砸开冰雕，以血喂饲，从蛋里孵出一个霜雪皮丘兽模样的血婴，与一个酷似穆里尼奥的男婴
    换蛋旧事: 穆里尼奥当众揭穿李察曾用一枚奇美拉卵换走她的凤凰卵。李察承认，并说愿与穆里尼奥分享儿子，绝不允许儿子被夺走
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 311) { _%>
    自刺: 李察用三棱剑朝自己腹部连捅两剑还清旧怨，宣布此后只认她与孩子的血缘关系，穆里尼奥转身离去
<%_ } _%>
    登门: 她登门向李察道谢，又被那座冰雕所惑，请求带两个孩子回采玉城小住。李察答应，还赌她不敢砸碎一枚假蛋
    输血: 小鹦鹉病重，她为两位血婴给鹦鹉输血，穆里尼奥默默离去，两边关系就此搞僵
    托付: 壹条与小鹦鹉经食毒蛊解毒成功，李察宣布把二少三少托付给她照看几个月，每年相伴半年，派彪人武士护卫
    释嫌: 她带二少三少到翡冷翠，转告穆里尼奥已释前嫌
    介丘: 海加尔山介丘仪式上，二少与三少以网状雷电宰牲并当众汲取魔兽灵魂，暴露了修习堕落魔法的痕迹。她与穆里尼奥当场带走孩子退场

  能力体系:
    霜岚领域: 她借泰穆尔拉雅雪山冰雪主场大幅增强的冻魔领域。天幕之内的高手会大幅魔力梗塞，这是她最硬的一手
    冰系: 冰凰本命的力量，能冻结一座冰雕封住一枚凰蛋
    血婴一脉: 血婴抽取宿卵一半的元素力量，还能延续法师的寿命。两个孩子身上没有一丝元素波动，这是全书最大的伦理错乱的起点
    魔宠: 无

  随身物品:
    凰蛋: 她早产下来的那一枚，起初孵不出任何东西，被她冻结成冰雕
    黄金美杜莎徽章: 祭祀签定魔宠用的徽章，铸造时搀杂星辰金原矿。穆里尼奥用它洒出金色光环，召唤出孪生火凤与冰凰
    咸水夔牛牛黄: 巴掌大小，被李察碾成粉末强塞给她，反倒催动了早产

  关系设定:
    唐家二少: 霜雪皮丘兽模样的那个孩子。她把他和二少三少一并养在身边，每年可相伴半年
    唐家三少: 酷似穆里尼奥的那个孩子。介丘仪式上他以网状雷电宰牲，她当场把他带走
    穆里尼奥: 天鹅主祭。他为她与李察翻脸，当众揭穿换蛋旧事；两人此后一同照看孩子，也一同在仪式上退场
    李察: 把孩子从冰里砸出来的那个人。他用牛黄催动她的早产，又用血饲孵出两个孩子；此后他认下她与孩子的血缘，把教养托付给她。她为报恩一再替他奔走
    壹条: 两个孩子的教父，由李察派定
    小鹦鹉马特拉齐: 病重时她为两个孩子给它输血，穆里尼奥在那一次默默离去
    诺查丹玛斯与安度兰: 验不出小鹦鹉病因的两位，那场风波把她也卷了进去
    费迪南德: 凤凰族的素鸾长老，与她同族
    丽芙: 月精灵女王，同在采玉城一系的圈子里
    歌坦妮与歌莉妮: 斯迈族天鹅家的姐妹，与她同属穆里尼奥的势力
    普斯卡什: 提出小鹦鹉与壹条中了血腥玛莉之毒的那一位，穆里尼奥为这一句当场暴怒
