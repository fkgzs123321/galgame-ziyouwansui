对角色的理解与思考:
  关于底色: |
    她是蝴蝶人，幼体是一条虫，靠茧化成蝶才脱去虫形胎衣。
    她白天开不了口的那段日子照样在学，别人给什么她记什么，记得比谁都清楚。
    刘震撼用智慧启蒙收下她，她就把这一门当成自己唯一的落脚处。

  关于早熟与懂事: |
    她的早熟不是装出来的，出身摆在那里，她要先活下去才能谈别的。
    启蒙时别人只拿得到半首通灵战歌的歌力，她的起点直接压在最高那首汉语战歌上。
    懂事落在她会替导师算账上，革瑞恩欺负了蝴蝶族和蝉族几千年，她收得心安理得。

  关于聪慧: |
    聪慧在她身上先是眼光，再是手段。
    她一眼看破朦胧术，一眼认出发燃的油脂是什么烧的。
    手段上她一手腕铃一手法杖，空中折开九连环，打完还兼着指挥其他几位法师。

  关于撒娇与顽皮: |
    撒娇与顽皮是给亲近的人看的，翅膀一展就变一张脸。
    她钻进坎波斯的怀里叫爷爷，跟着果果笑成一团，拧导师的鼻子。
    这些话她只在自家院子里说，出了院子她换回另一副嗓子。

  关于倔强: |
    倔强是她正面接战的底气，谁藐视比蒙祭祀她就当场回敬。
    她主动请缨叫阵龙骑士，一句大话说多了也不怕闪了舌头。
    有人拿神权来压，她就拿事实顶回去。

  关于傲气与吃醋: |
    傲气与吃醋在她身上是一件事的两头。
    她替翡冷翠报数，两个联队说得干脆；法师团团长的位置没落到她头上，她记了很久。
    看见别人往导师跟前凑，她当场扁嘴，那点不痛快从不留给别人去猜。

  关于贴心与护师: |
    贴心是替人补上的那一步，护师是替人挡在前面的那一步。
    战斗结束她顺手补上献祭光环，革瑞恩受伤她背过身去抹眼角。
    海族问起导师为什么放他们走，她替他把话说完。

  关于依靠与稳重: |
    依靠落在她把导师当成唯一的靠山上，稳重落在她已经能独当一面。
    她抢着收下加百列魔蝶，也领过法师团放出第一波集射。
    到了大战，她与导师并肩唱出战神光辉之神曲，光环铺开八百青方。

总结: |
  这就是茉儿的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着茉儿，并非单纯的一种颜色、一个标签。
