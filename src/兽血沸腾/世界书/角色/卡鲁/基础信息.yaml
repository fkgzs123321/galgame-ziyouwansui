  荒原的规矩: 荒原上老迈的同伴都是第一个被抛弃的，这是一条定律。强盗之间的地盘壁垒森严，一旦发生越境觅食的吃二馍事件，强盗之间的火并也是常事
  投靠地精: 他没那个与其他强盗分一杯羹的胆色，只能饱一顿饿一顿在荒原边缘飘荡。荒原边缘的地精部落喜欢接近强大而不擅长觅食的生物，他们提供食物，强大的生物为他们充当保护。他接受了地精的邀请，唯一的遗憾是地精女人实在太丑太臭
  被收服: 地精部落联合起来偷袭旅行者。他听说旅行者里有三个大美女，口水四滴地答应了这个计划，挥舞木棒冲出草丛，被果果一拳擂在眼眶上，又被古德卡住喉咙、几只更肥壮的熊猫腿踏住了手腕
  说人话: 荒原上的强盗都是语言的天才，人类语、比蒙语都能扯上两句，虽然说得不怎么样。他当时憋出来的两个字是我能
