  能力体系: |
    仙女龙的身子是元素之体。人类魔法、比蒙战歌、巫妖的通幽术与死灵术打到她身上伤不到她，力道原样弹回施法者本人，法力越强的越倒霉。一万年前魔族的巫妖给这一手起了个名字，叫死亡一指，仙女龙因此被称作元素力量杀手。
    元素反噬指是这一手在指尖上的用法。她抬手一点，就让违规的人吃到自己的元素力量。擂台上她先说一句小心了，说的就是这门手段。
    空间只要没有密封，她就能瞬移，单次不超过一千码。天上不借翅膀也能升空，这是龙族的天赋龙翔术，她在空中的位置占得比谁都稳。
    元素知识是她随身带的尺子。人类女巫摸索出来的预言系魔法，她当场把底细摆开：以水晶球为主要工具，探询未来世界，没有攻击力，与比蒙战歌同属柔性的元素力量。人类魔法是刚性的，两下不搭界，也谈不上与圣奇奥的三系魔法冲突。她还断定人类之中只有拥有领域力量的圣奇奥法师才能对龙威产生抗力，有人在龙威之下十息就爬起来，她当场说这不可能。
    她报得出人类魔法师的家底：一个人类的军事强国，把魔法学徒一并算上，全国凑不出一百名魔法师。龙城调拨出去的那批龙人，人头构成也由她报数，与精灵的后代占五成，与巨人的后代占三成，与比蒙、人类的后代占两成。
    短板在肉搏。元素免疫挡得住法术，挡不住物理打击。
