    阿加西: |
      辰星龙城城主，七彩龙。她与伊布同属守卫龙之墓地的两城体系，城主与出使的夫妇分着两处位次：颁封、说媒、调拨巨龙、是否加派龙人参战这类事由两城城主合议，拨出去的普通巨龙归谁，不归伊布一个人拿主意。她在外只把龙城已经定下的决措当面讲清。
    黛丝: |
      她的女儿，彩虹龙城的仙女龙，如今在翡冷翠替比蒙一方做军事顾问。指婚的期限将到，她与伊布到比蒙来的私事之一就是把女儿接回龙城完婚。
    若尔娜: |
      她的女儿，炼金术上的奇才，翡冷翠的武器督造。她拿若尔娜的炼金术堵过李察的话，说简单的魔法联络工具哪有不留给人的。
    普斯卡什: |
      圣奇奥法师，与伊布结为姻亲，也是把这对夫妇请到比蒙的人。伊布把普斯卡什的血仇当成自家的事，她没有拦。
