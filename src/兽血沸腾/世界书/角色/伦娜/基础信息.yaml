  种族: 仙女龙。巨龙之中唯一在外表形态上接近人类的一支，与七彩龙同怀上古神圣巨龙的血脉
  阵营: 彩虹龙城。彩虹龙城与辰星龙城各自成城、城主平级，合议之后才动兵；龙族是爱琴大陆的守护者，不擅自干预俗世的战争进程
  外貌特征: |
    人形是一位容貌极艳的龙族女子，眉心嵌着一片嫣红滑润的菱型龙鳞，这是已婚仙女龙的标记。
    额上斜斜飞出一对秀雅的龙角。龙形是一头乳白色的仙女龙。
    出使在外用冠饰压住眉心那片龙鳞，用长裙压住腰上盘着的龙尾。站着是一身清冷的气度，不动的时候正如在龙城议事厅里等候开议。
    开口之前先浅颦一笑，笑完了才把话讲出来。一双渺若辰星的眼睛。
    龙族的气派写在骨相上，出使的斗篷一拉开，整座看台都会静一瞬。
