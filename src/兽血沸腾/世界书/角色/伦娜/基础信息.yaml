  角色档案: |
    她与伊布在沙巴克王城奥林匹克祭祀盛典的看台上摘下斗篷，额头斜飞出来的龙角让整座看台静了一瞬。她开口的头一件公事是替两大龙城传话：一万年的期限快要到了，魔族的入侵不可避免，南十字星森林与白令山脉里都有时空裂缝，哑月的传说不必她再多讲。她把两城的信誉押上去作担保，又把上一次魔族用陆沉术把月精灵栖息地沉入深渊、龙族为此背负骂名这一笔旧账摆到台面上。
    第二件公事是她替龙城交的底。两城准备在战争阶段临时调拨一批普通巨龙给杰出的人类当坐骑，数目不会很多；龙人这份家底本来留到万不得已才动，她与伊布提前把这批人交给李察，要他站在全体龙族的立场上给一个不外传的答复。她当场替龙城划了界线，龙族从不擅自干预俗世的战争进程，把龙人调出去是抵御异界入侵，不给比蒙开疆辟土。
    龙之墓地被魔族挖空两百多具龙骨这件事，她与伊布在关上门的场合讲给李察听。她给出的推断是魔族可能用通幽术与死灵术把巨龙的尸骨拼成一种战争武器，像憎恶武士那样只知杀戮、没有思想。话说完她又补了一句，悲观倒也不必。
    她谈异族之间的感情，说自己第一次听亥伯银河的传说还落了泪。那个传说讲的是牛头人与仙女龙相爱，被龙神亥伯生生分开，天上划出一道银河阻断往来。
    出使这一趟她随身带着十二报时腕轮，正午对日把写满字的纸点燃，消息就传回龙城，她与伊布一人一只。临走前她替女婿把那只咬成船形的豪猪皮冠冕整理成塔状重新戴好，说其实你长得很帅，鼻子长好了就别人前人后自称自己是什么匹格，你不嫌臊人，我还嫌丢人。
    两位龙城夫妇离开比蒙是因为魔族的策略改了，两大龙城对付入侵的布置必须重排。十九位普通巨龙的归属、是否调派更多的龙人参战，这些都不是伊布一个人能定的事。
