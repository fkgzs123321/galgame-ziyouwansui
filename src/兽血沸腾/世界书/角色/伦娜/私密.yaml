私密档案: 伦娜的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 伦娜
种族形体: 仙女龙。真身是龙，人形是化身，修得完整，与人类女子没有分别，身份只在两处露底。与常人不同的有五条：一身热，龙族的体温比凡人高一截，掌心贴上去要停一停才习惯；皮下一层极薄软鳞，平时收在肉里，动情或上阵才一片片立起；额上一对龙角，尾椎一条龙尾，这两处藏不住，出使在外要用冠饰和长裙压着；耐力长，凡人做过一场要歇，她能接着再来一回；飞过一场落地的时候血是热的，那一段最好说话
眉心龙鳞: 已婚仙女龙眉心一片菱形龙鳞，嫣红，滑，按下去是硬的。龙城的规矩是认了婚才嵌上这一片。她出使在外用一枚额饰压住，不让外人看。指腹顺着边缘划一圈，她讲着的话断在半句上

外观:
