名器:
  名目: 澄渊回焰
  由来: 仙女龙对元素免疫，法术打在身上原样弹回施法者，龙城把这一手叫死亡一指。这道本事落在她身子里，就成了逼里那一层会吃也会还的软肉。她办任何事都先看、再量、最后才下判断，床上的节奏也是这么来的
  表现: 进去先被逼口那圈细鳞刮一下，往里一层软肉裹上来，热，软，裹得不紧。她不跟着人的力气走，人快她慢，人慢她收，收到底那圈再整片收紧，把吃进去的热原样推回来，推得人心里发慌。撑得久的人少
  代价: 这门劲道吃她的精神。用一回下来得歇半天，腰背发软，背脊那条鳞线一路立着收不回去，要拿热水泡透才消
  名声: 龙城那边只知道仙女龙与七彩龙配了对就是认死一个，谁也没见过她这一面。伊布在外从不提，回房关上门才提。凡人那边更没人知道

性癖:
  认死一个: 高等龙族的规矩是一次只认一个。她跟了伊布之后，别的人再好看也不看第二眼。真被人动手动脚，指尖先凝出元素反噬指
  先看后判: 上床也按她出使那一套来，先看，再问，弄明白了才肯让人动手。人急着上，她把被子拉到肩上不动
  飞后: 廊下、龙背、云上，落地之前就把人按住了
  居高临下: 她喜欢从上面来，腰自己搬，节奏自己定。被人压在下头她不习惯，除非那人是伊布。做完不肯马上散开，要人多留一会儿
  讲理: 床上听不进胡话。人说错了什么，她会停下来把话说明白，说明白了再继续
  被灯照着: 出使在外住驿馆，她不肯熄灯。灯亮着看得清，谁进了这道门她心里有数
  龙性: 龙性本淫这句话在龙城是忌讳，她提起来就翻脸。越是不认，身上越诚实。做完她自己先红脸，红完补一句这是夫妻之间该做的事
