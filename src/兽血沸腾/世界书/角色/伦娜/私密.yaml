  奶子: 中偏大，乳型尖挺，一只手掌兜不住底，分量压手，躺下也不朝两边散。皮白，淡青的血管在奶子外缘走成几条细线。掌心贴上去是烫的，得停一停才受得住。使力捏了会留一圈红印，半天不退。动情时整只发胀，皮下那片软鳞立起来，摸过去一层细密的硬点
  奶头: 小，浅粉，不兴奋的时候平贴着，缩在晕里摸不出形状。指腹捻两下才立，立起来顶得住舌尖，颜色跟着由浅粉转深。吸住的时候她一只手按在人的后脑，按一下又松开
  乳晕: 不大，颜色比奶头浅，外沿散着没有硬边，越往外越淡。晕面上有一层细颗粒，舔过去是一片细麻。龙族的体温把这一处烘得发热，吮过之后口水干得极快
  逼: 绒毛顺着往下收，只在耻骨上留一小片，色比头发浅。外头看着合得严，要掰才开。里头比体表还烫，一层一层往里叠的软肉，口子上生着一圈细鳞。水起得不快，得先把她摸出兴致，一起来就滑，顺会阴往下走。含进去头一段被鳞面刮着
  阴唇: 两片都薄，贴着身，合得紧，颜色浅，和奶头是一路。外头那片薄薄一层，里头那片更薄，两片的界线看得清，边沿压着一线比肤色深的粉。寻常干爽，皮面滑，指腹碾过去摸不到褶。血气上来时两片先涨成深粉，自己朝外翻开一线，口子亮起来，水顺会阴淌到屁眼口
  阴蒂: 一粒，缩在阴唇上端的那道褶里，外头有细鳞护着，拨开才找得到。指腹按下去她的腰就塌，舌尖压住转两圈，两条腿收起来绞住人的腰
  屁眼: 一圈浅褐的细褶，收得死，寻常干爽，没有味。指头抵上去，那圈肉先抽一下，再一层层松开。进去得用油，头一回进去她整个人绷直，肩背的鳞全翻起来
  腰腹: 腰细，两手合围还剩一截空。小腹平，只有一层薄肌，肚脐浅，往里凹。腰侧是她的死穴，从背后一掌扣住就使不上力。肚皮薄，按下去摸得到底下绷着的腹肌
  臀部: 窄，翘，肉结实，是常年骑飞练出来的。一掌扇上去声响脆，红印慢慢浮。从背后进去时两瓣自己朝两边分。臀缝上端连着尾椎，摸到那里她会缩
  腿: 长，大腿白而直，内侧一层肉嫩，掐一下留半天印子。小腿一层薄肌，脚踝窄。她在地上站得比谁都稳，被架起来做的时候腿会抖，脚趾蜷起来又松开
  足: 脚背窄，脚踝细，脚趾长而直。脚心一层薄茧，是龙形落地时磨出来的。舔到脚心她会缩，缩完拿脚背蹭人
  手: 一双学者的手，指节细长，指甲修得短而圆。卷轴翻过，星图指过，元素反噬指也从这十指上掐得出来。指腹是热的，碰到人身上不会让人打激灵。握住鸡巴的时候手极稳，稳得让人心里发慌
  口舌: 唇薄，色淡，咬过才红。她说话条理清楚，含东西的时候这条理就散了。舌软，口腔比常人烫，含进去先愣一下，再慢慢往里收。牙齿磕到人，她抿一下嘴，重新来过
  腋下: 干净，只有几根细软的毛，腋窝浅。体温高，这里出汗最早，一出就是一层薄湿。被舔到会把胳膊夹紧，夹住人的头不放
  发肤: 一头长发，色浅，日光下泛白，灯下偏银，平时束在脑后。皮肤白得发亮，手放上去滑，烫处比凉处多。皮下那层软鳞寻常收着，动了情从背脊一路往下翻起，一片片摸得到边
  龙角: 额上斜飞出来的一对，婚前是明黄色，成婚后转成白玉一样的温润色。指腹从角根划到角尖，起手是软的，越往上越硬。角根裹着的那圈皮最薄，含住角尖她会抖，抖完把脖子让出去
  龙尾: 尾椎后头生出来的一条，人形下不长，闲时绕在腰上，外头拿长裙压着。鳞细，内侧无鳞那一段最经不起碰。手顺着鳞往下推她站不住，去拽尾巴她会回头咬人。飞过一场之后尾巴是热的
  龙鳞: 背脊正中一条鳞线，后颈一直通到尾根，寻常埋在皮肉里。动了情整条翻起来，一片一片支棱着，摸过去是硬的。两肋和奶子外缘各有一小片，颜色比背脊那一条浅
  标志: 眉心的嫣红菱形龙鳞、额上一对白玉色的龙角、腰上盘着的龙尾、背脊那条鳞线

气味:
  体味: 一股干燥的暖香，凑到颈边才闻得到，底下压着极淡的硫磺气，是龙族的底子。汗出得多的时候这股最重
  逼味: 不腥。凑近了是烫的肉气，鳞面上带一点水锈味。指头抹过之后留在手上的味淡，洗一下就没了
  动情味: 甜味转腻，底下的暖臊浮上来，从两腿间朝外散，隔着长裙也压不住。她自己闻到了就把腿并起来
  汗: 不臭，咸而清。量比常人大，额头、颈子、背脊那条鳞线先湿。行过一场之后腋下和腿根都湿透，擦干净了才算完
  经水: 量中等，色偏深，味也重。来经那几天她照样出使，只是不肯让人近身

分泌物:
  爱液: 起得不快，得先把她摸出兴致。一起来量就足，色清，滑，能拉出丝。做开了越流越多，腿根湿一片
  初夜: 嫁进龙城那一夜。头一回进人时逼口那圈细鳞被撑开，掉下几片，洗过之后才长回来。落红不多，混在水里成了淡粉
  奶水: 未孕时一滴也挤不出。到了孕后期奶头先胀，产后才通畅，量足，味偏淡。喂奶避着人
  眼泪: 不轻易掉。真掉下来是一滴一滴往下砸，砸完自己抹脸，把该说的话说完

敏感带:
