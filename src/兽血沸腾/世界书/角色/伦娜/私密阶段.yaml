<%_ if (chap < 300) { _%>
阶段: 礼服没换
边界: 外袍和冠饰一件都不许卸，眉心那片龙鳞用额饰压着，不许人碰。她肯让人握住手，肯让人贴近了闻她颈边那股暖香，再往里一步她就退开半步，裙摆扫过地面。出使在外住的是龙城使馆，走廊上随时有人经过
身体状态: 通身是热的，比常人高一截，手掌贴上去要停一停才习惯。逼口那圈细鳞收着，掰开要用一点力，里面干爽。奶头缩在乳晕里，捏了不立。背脊那条鳞线埋在皮肉里，一片不起。腰上盘着的龙尾打了一个结，是使节出访压裙摆的打法
反应: 说话还是议事厅里那套条理，一句接一句，句与句之间留着空。被碰到角根那圈薄皮，话断在半句上，手抬起来按住那只手，按住了不动。她肩线是平的，站姿不晃，只有尾巴尖一下一下点着地
台词: “我是伊布的妻子，你认清楚这一点。”/“你先把我的手放开，我们把这件事讲明白。”
落点: 她把话头带回龙城与比蒙的盟约上，退到窗边站定，裙摆下面那条尾巴还盘着那个结
<%_ } else if (chap < 420) { _%>
阶段: 量过再判
