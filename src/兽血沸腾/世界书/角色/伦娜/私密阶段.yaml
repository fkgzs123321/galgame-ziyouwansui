身体状态: 逼里的水来得慢，要先暖、先摸、先听她把话说完。一来量足，色清，顺着会阴淌到屁眼口，能拉出丝。逼口那圈细鳞被撑开又合上。奶头含住才立，立起来硬得顶舌尖。背脊那条鳞线一路立起，摸得到边
反应: 手放上去先量，指腹从锁骨往下走，走到哪里算到哪里，跟她在龙城里给人量东西一个路数。被压到要紧处她咬住自己的手背，咬完把手背翻过来看牙印。廊下咳一声，她当场停住
台词: “你要做，就先把话说清楚。”/“我这个人办事，先看，再量，最后才下判断。”
落点: 她拉过毯子盖住自己，先问一句隔壁的人走了没有，问了才肯把肩放下来
