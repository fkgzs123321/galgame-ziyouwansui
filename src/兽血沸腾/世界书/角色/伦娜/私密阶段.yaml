身体状态: 刚飞过一场，通身发烫，汗从颈子和背脊那条鳞线往下走。逼里烫手，水出得多，插进去头一段被鳞面刮着。大腿内侧的肉绷着，是骑飞练出来的。尾巴内侧无鳞那一段最经不起碰
反应: 她自己搬腰，节奏自己定，人在下头只管接。到高处她喉咙里滚出一声，滚完自己抿嘴。做完她不肯马上散开，要人多留一会儿，龙尾自己绕上来圈住人的腰
台词: “你从龙城过来这一趟，路上用了几天？”/“今天的事到这里，出了这道门你别提。”
落点: 她起身披衣，第一件事是去看窗外的天色，看完说一句明天还要飞一趟
