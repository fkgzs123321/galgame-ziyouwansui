记录对象: 艾薇尔
种族形体: 西雅海国美人鱼。腰以下是鱼尾，上半身是人。处子身没有腿，只有一条金红色的大鱼尾；婚后尾皮蜕去，露出两条人腿，只在脚踝跟部留一条红色鳞线。她的性器官不长在两腿之间，开在鱼尾腹面那道脐门里，外头层层鳞片合着，受刺激才从背鳍一侧绽开一道缝。肏她要整条尾先张开才进得去
鱼尾与鳞线: 鱼尾是她的本相，也是她的羞处。尾鳞金红，顺光浮着一层金色。动情时尾鳍自己扇动，鳞片一片片立起来。鳞线是海族认亲的凭据，她留到老也不肯褪

外观:
