  腿: 处子时没有腿。婚后蜕皮长出来的两条腿雪白，大腿根肉厚，掐一把留指印，小腿直，膝盖上有一点软肉。腿肚一酸她就站不住
  足: 脚小，脚背高，脚踝窄。脚踝跟部有一条连成线的红色鱼鳞，从跟骨一直排到脚背。手指顺这条线往上摸，她会踹人
  手: 一双养尊处优的手，指节细，指甲留得极长，染着茑萝蔻丹。指甲刮过后背是一道白痕。这双手拧人耳朵的时候最利索
  口舌: 嘴唇天生猩红，不用抿就有颜色，咬过之后更红。舌头软，往里收，不往外推。含鸡巴的时候眼睛盯着对方看
  腋下: 干净，没有毛，皮薄。被舔到会缩肩，回头骂一句
  发肤: 皮肤白，细，见光有反光。头发金色，又长又厚，湿的时候顺在肩头。甩一次头发带出一股甜香
  鱼尾鳞: 整条尾金红，从腰往下越到尾梢越窄，尾鳍薄而分叉，扇起来是一片金色。鳞片巴掌大，一片压一片，顺摸滑，逆摸会碰着硬边。鳞下的肉是热的、软的
  标志: 金红的鱼尾与脚踝红鳞线、金色长发、水晶皇冠、胸口那对扇贝壳、落地成珠的眼泪

气味:
  体味: 甜香，头发甩一下带出一股。凑近了闻，甜里压着一层海水的咸气，跟凝玉那种奶糖味的甜不搭界
  逼味: 干净，凑近了是一股海腥带咸的气，不酸不臭。鳞缝张开以后气味往外散
  动情味: 甜味变沉，咸腥跟着上来，两样混在一处是海边的味道。隔一条裙子也闻得到
  汗: 汗少，是咸的。施过一次大型水系魔法，从额头和颈子往下淌，粘津津地挂在鳞面上
  经水: 人鱼经水淡，量少，颜色偏浅。离水久了更淡更稀，跟着容颜一起败

分泌物:
  爱液: 来得快，量比别人多，色清亮，能拉丝，滑得留不住手。一泡进水里就分不清是海水还是别的
  初夜: 落红不多，混在海水和木盒子里化成一片淡粉。她是被一阵刺痛激醒的，过后尾鳞白了两天
  奶水: 美人鱼不容易怀孕。生完孩子才有奶，奶水带一点甜咸，喂的时候不让人看
  眼泪: 落地成珍珠。一颗一颗砸在地板上，咯崩咯崩地响。受了委屈掉，疼的时候也掉，掉完自己捡起来串首饰

