  尾根: 腰和尾接上的那一圈，捏住就软。肏的时候要从这里掐着才使得上劲
  尾梢与尾鳍: 尾鳍被含住会全身发麻，尾梢会自己缠上对方的小腿
  奶头: 捻、含、吸都有效。奶头怕凉，凉水一激就硬
  阴蒂: 鳞缝不开就摸不到，摸到了就没法忍，腰一直往上顶
  脚踝鳞线: 顺着红鳞线往上摸，她会踹人，踹完又把脚收回去
  耳后与鬓角: 金发被撩起来，耳后露在空气里，她会缩脖子。对着耳后说话她就软
  腰侧: 手掌箍住腰侧她就没法动，只剩骂人
  长指甲与手心: 指根被含住的时候，长指甲会往对方肉里抠

名器:
  名目: 海魁衔珠
