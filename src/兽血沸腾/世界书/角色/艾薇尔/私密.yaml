  奶子: 一对丰满欲滴的酥胸，形状挺拔，份量沉，走动时在贝壳里晃。皮薄，摸上去凉滑，捏下去先陷一指再弹回来。比海伦的小一圈，为这个气过很久
  奶头: 小，浅粉色，平时缩在乳晕里。碰上冷水或动情就硬，硬了颜色往深红走。含住吸的时候她拿尾巴拍水
  乳晕: 不大，粉里带一点金，边线糊，从中心往外慢慢淡下去。上面一层极细的粒，指腹擦过去是细密的麻点
  逼: 处子时藏在鱼尾腹面那道脐门里，外面鳞片层层合着，只在动情时从背鳍一侧绽开一道缝。婚后尾皮蜕尽，脐门里那截肉翻出来，长成人族女子这样的逼，毛稀而软，颜色是没见多少日头的浅粉，两片合得严。鸡巴进去以后紧、热、滑，鳞缝在两边一寸寸往里钳
  阴唇: 处子期藏在脐门里壁，是一圈金红色的软肉褶，外头鳞片层层合着，隔鳞摸不出形状，鳞缝不开就看不见逼口。婚后尾皮蜕尽，脐门里那截肉翻出来，长成两片薄阴唇包住逼口，浅粉，是没见多少日头的那种浅，大阴唇薄，小阴唇更薄，边沿压一条淡金，合得严，掰开有一点黏的阻力。动情时鳞缝先从背鳍一侧裂开，这两片跟着往外翻，缝里涌出清亮的骚水，一沾海水就分不出来
  阴蒂: 藏在脐门上端那截肉里，鳞缝不开就摸不到。拨开鳞缝碰一下，整条尾从尾根抖到尾梢，骚水跟着往外涌
  屁眼: 在脐门后头，平时压在尾鳞底下，处子时只是鳞间一个小孔。婚后蜕鳞才露出来，颜色浅，褶皱细密，一圈一圈收得紧
  腰腹: 腰细，一把能圈住，肚脐眼浅，往里凹。腰上没有硬肉，是软的、温的。双手掐住腰侧她就使不上力
