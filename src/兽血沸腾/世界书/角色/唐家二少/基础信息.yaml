角色档案:
  基本信息:
    姓名: 唐家二少
    性别: 男
    种族: 血婴，凤凰血裔。生身父母是穆里尼奥与他的冰凰魔宠唐蓓尔金娜
    出生: 冰凰早产下一枚无法孵化的凰蛋，被冻结成冰雕立在雪山之巅。李察用秘银手臂砸开冰晶，以自身鲜血血饲，蛋里出来两个血婴，他是人形的那一个
    排行: 双胞胎里的哥哥。李察问谁是哥哥，他自己拧着弟弟的大脸应下这一声
    形态: 人形时是个小穆里尼奥，脸蛋与穆里尼奥一个模子里刻出来，一头罕见的白金色头发
    鹣鲽: 凤凰一族给这种孪生子起的名字，受诅咒而永生永世不能分开。只有最不适合配对的夫妻才会有这样的后代
    教父教母: 教父是壹条，教母是唐蓓尔金娜。李察当众把两个孩子托给她照看，每年可相伴半年
    名分: 李察为他取名唐家二少。李察认他和三少是自己的孩子，穆里尼奥也认，两家的血脉与名分从此扯不开
    称谓: 他管李察叫爹爹，管果果叫小爹爹，管冰凰与凝玉、黛丝、若尔娜叫妈妈，管歌莉妮与歌坦妮叫姐姐
    口齿: 他抢在弟弟前头答话，那一声我是哥哥，他是弟弟拧着三少的大脸说出来。落地第一句则是爹爹，随后贴着李察的大脸说他们的前半生太不幸了

  外貌特征:
    人形: 小穆里尼奥的模样，一张英俊的小脸，白金色头发
    翅膀: 右肋生着一只白色羽翅。三少那只长在左肋，兄弟俩各只有一只翅膀，凑在一处才飞得起来
    气质: 模样俊俏机灵，李察头一回见他，把他当成了精灵男子
    变身: 与三少牵手之后白光一闪，化作一对翎翅舒展、浑身雪羽的鸢尾大鸟，各只有一只翅膀，身子挨在一处上下翻飞

  背景设定:
    破冰: 母亲把那枚孵不出的凰蛋封在雪山之巅的冰雕里，说让尘封千万年的冰雪写下永不消失的爱。穆里尼奥扬言要杀李察，李察砸开冰晶，以自身鲜血血饲十个月的活计在一瞬间做完，差点被吸成人干。蛋壳爆开一道血雾，他与三少就是这么出来的
    第一声: 他落地就会喊爹爹，随后贴着李察的大脸说他们的前半生太不幸了
    命名: 李察问谁是哥哥，他拧着弟弟的大脸应下这一声，于是得名唐家二少，弟弟得名唐家三少
    认亲: 李察把他抱到众人面前，他叫了海伦一声海伦妈妈，海伦当场晕过去；还没轮到凝玉，凝玉已经脸色煞白瘫在椅子上。两个孩子又甜甜地叫了果果一声小爹爹，那只和果果长得一模一样的霜雪皮丘兽把在场的人都看傻了
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 311) { _%>
    改名换姓的代价: 李察当众承认曾用一枚奇美拉卵换走凤凰卵，说愿与穆里尼奥分享儿子，绝不允许儿子被夺走。他随即拔剑自刺腹部两剑还清旧怨，宣布此后只认唐蓓尔金娜与孩子的血缘关系。穆里尼奥转身离去，他与三少朝那个背影挥手喊坏人
<%_ } _%>
    三栖变身: 他与三少化成过佛肚竹，在桑干河化作各持一翼的鸢尾大鸟合体飞行，还变过一枝一红一白的并蒂莲。安度兰长老看破这三种形态就是鹣鲽的主要特征
    诅咒: 鹣鲽能变成任何植物或动物，涵盖空栖、水栖与陆栖，变身之后身上一丝元素力量也没有。穆里尼奥一门凭外籍精灵身份赢得神圣凤凰滴血认亲，血脉到了他与三少身上反倒成了亏空
    先天风寒: 安度兰长老指出他的咳嗽是先天风寒，摩尔亲王则警告孪生血婴会抽干血法师全部的元素力量
    托付: 小鹦鹉与壹条经食毒蛊解毒成功那一年，李察把他与三少交给教母唐蓓尔金娜照看几个月，每年相伴半年，另派彪人武士护卫
    闲居: 他藏在竹林里不告诉爹爹，理由是他和小爹爹没抓到他和唐家三少。无肉不欢，爱听故事又爱告状，会用告发爹爹风流事换秋刀鱼
    打王子: 李察以迟钝光环和两道固态蛛网术把狂化的李察王子裹成蛛网茧，果果率孪生血婴变身连体牧树人，把王子的剑甲龙打得满地找牙。他一拳能把剑甲龙打一个跟斗
    被掳: 茵格里切宝以战剑穿穆里尼奥心口，他与三少被掳走。李察用果果的血婴小瘌痢格飞炼狱界名剑提尔锋，又召月光之陨竖琴齐射，两个孩儿才得保
    介丘: 海加尔山介丘仪式上，他用网状雷电宰牲并当众汲取魔兽灵魂，修习堕落魔法的痕迹暴露在人前。穆里尼奥与唐蓓尔金娜当场带走孩子退场

  能力体系:
    血婴本源: 血系法师以自身血液孵化魔兽卵造出的魔宠分身。宿卵的元素力量被抽走一半，孪生的两个抽干的是血法师全部的元素力量
    双系混合: 血婴残留宿卵魔兽胚胎的天赋魔法本能，与后天血系潜力融合成双系混合溅射魔攻。他天生带鸡尾酒魔力，智慧高超，魔法上却卡着一道瓶颈
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 318) { _%>
    变身: 鹣鲽体质的三栖变身，已见的是佛肚竹、鸢尾大鸟与并蒂莲，后来陆栖形态固定在恩特牧树人，空栖形态可化作博德族比蒙
<%_ } else { _%>
    变身: 鹣鲽体质的三栖变身，已见的是佛肚竹、鸢尾大鸟与并蒂莲
<%_ } _%>
    变身代价: 变身之后屏蔽身上所有元素力量；牵手那一下爆发的元素波动强得异常，一分开就散
    连体牧树人: 他与三少一同变身成连体恩特牧树人，两人一起出手的力气能把剑甲龙掀翻
    雷法: 介丘仪式上他以网状雷电宰牲，这一手来自堕落魔法
    驮都: 他脑中有一枚驮都。血婴寿终焚化会留下这种魔法结晶，是血精灵语里的血滴子、血珍珠
    魔宠: 无

  随身物品:
    凰蛋壳: 他孵出来之后仍抱着凰蛋壳啃
    鹣鲽驮都: 取自他与三少脑袋的两枚驮都。贴身佩戴可变成他人外表，同时屏蔽佩戴者全部元素力量
    秋刀鱼: 他用来换情报的筹码，告发爹爹风流事一次换一条

  关系设定:
    唐家三少: 孪生弟弟。三少是霜雪皮丘兽的模样，翅膀长在左肋，他的长在右肋，牵手才有力量，分开就只剩一副没用的躯壳
    唐蓓尔金娜: 生母，也是他的教母。李察把他托付给她照看，每年可相伴半年
    穆里尼奥: 生身父亲。穆里尼奥转身离去时，他和三少挥手喊了一声坏人
    李察: 把他从冰里孵出来、给他取名的人。他管李察叫爹爹，也会把爹爹的风流事卖出去
    果果: 他叫小爹爹。那只霜雪皮丘兽见了他和三少就彻底哑了火，三少和它长得一模一样
    海伦.列娜与凝玉: 他一声海伦妈妈把海伦叫晕过去，凝玉还没轮上就已经瘫在椅子上
    壹条: 他的教父，由李察指派，另带彪人武士护卫
    黛丝与若尔娜: 他叫妈妈的那两位仙女龙
    歌坦妮与歌莉妮: 他叫姐姐的那对天鹅姐妹
    安度兰长老: 抱着照看他们兄弟的那位长老，也是点破鹣鲽与先天风寒的人
    喀秋莎: 他啃着蛋壳就提起的小姐姐
    李察王子: 被他和三少化成的连体牧树人打得满地找牙的那位，坐骑是剑甲龙
    茵格里切宝: 冥界大统领，把穆里尼奥一剑穿心又把两个孩子掳走的那位
    小瘌痢: 果果的血婴，李察拿他格飞炼狱界名剑提尔锋，才保住二少三少的性命
