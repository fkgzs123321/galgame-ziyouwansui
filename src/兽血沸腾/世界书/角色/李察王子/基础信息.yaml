角色档案:
  基本信息:
    姓名: 李察.萨尔
    性别: 男
    年龄: 二十五岁
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 74) { _%>
    种族: 狮虎人。父亲格雷克.萨尔是莱茵族狮人，母亲安琪尔是泰戈族虎人皇后
<%_ } else { _%>
    种族: 父亲格雷克.萨尔是莱茵族狮人，母亲安琪尔是泰戈族虎人皇后
<%_ } _%>
    血脉: 血管里流着莱茵狮子的血脉，战甲里面掖着一条虎尾
    身份: 比蒙王国王子，神庙圣殿最高守护骑士，拿过金冠角斗士称号
    纹章: 三只人立而起的狮子围握一根皇冠权杖
    坐骑: 一头浑身长满剑刃状骨甲的亚龙兽，也就是剑甲龙
    兵器: 十字巨剑
    家世: 父亲格雷克.萨尔，比蒙国王。叔叔是狮心亲王卡恩，比蒙远征军团统帅，「战神之鞭」的两位军团长之一
    兄弟: 格雷克.萨尔膝下一共二十五位王子与公主。萨尔陛下在一年之内失去过九个儿子
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 705) { _%>
    结局: 战死在滹夜古城
<%_ } _%>

  外貌特征:
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 256) { _%>
    头发: 金色卷发，后来留成金色长发
<%_ } else { _%>
    头发: 金色卷发
<%_ } _%>
    眉心: 一道黑色的「王」字纹。不耐的时候这道纹会蹙成一个「田」字
    尾巴: 一条虎尾掖在战甲里面
    铠甲: 金色米索莉铠甲
    披风: 墨绿色披风
    坐骑: 骑着剑甲龙在城内大道上穿行，目不斜视
    武技: 圣凯路组合拳。拉开拳架之后，连环重拳封死对手所有的抵抗线路

  背景设定:
    求爱: 海伦第一次露面他就停住了脚，把美丽、漂亮这些词一连串砸过去。他张口要一只海伦的手套，说要珍藏在自己的头盔里
    监护: 他向神庙申请做海伦的监护骑士，理由是这样年纪幼小的祭祀是王国难得的珍宝
    提拔: 他替海伦做了决定，把她的外公沃勒尔子爵一家从主神庙调进军部，换来一枚终生服务勋章和一个伯爵头衔。沃勒尔当上了训兽总长
    晚宴: 他扛着国王的名义派皇家马车接走海伦和茉儿入宫赴宴，把刘震撼挡在请柬之外
    结怨: 他唆使军部把最难的任务派给刘震撼，又在战神广场上讥讽翡冷翠的民兵是杂牌
    蛛网茧: 他被刘震撼用蛛网术裹成茧，剥了衣服，脸上还留下果果一记飞踹的四爪印
    决斗: 他掷下手套提出决斗，最后被穆里尼奥和卡恩亲王压了下去，被迫退走
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 705) { _%>
    战死: 战死在滹夜古城。萨尔陛下为这个儿子哭到握不住手里的战剑
<%_ } _%>

  能力体系:
    武技: 圣凯路组合拳，金冠角斗士的底子
    坐骑: 剑甲龙，亚龙兽，浑身的骨甲沿脊背排成一把把剑刃
    兵刃: 十字巨剑
    权柄: 圣殿最高守护骑士的金色米索莉铠甲，王族与神庙两条线的通行权
    部属: 「战神之鞭」军团的牦牛重骑兵随他出入王都

  关系设定:
    刘震撼: 他的情敌和死敌。他放话要把刘震撼的头颅做成一个盛酒器
    海伦.列娜: 他追求的对象。他替她安排外公的前程，也替她定下赴宴的名单，她当面回绝了他的监护骑士申请
    沃勒尔: 海伦的外公。他一句话把这位福克斯子爵从主神庙调进军部，做上了训兽总长
    格雷克.萨尔: 父亲，比蒙国王。他死在滹夜古城之后，这位国王抚着残缺的雉堞背对所有人哭
    卡恩: 叔叔，狮心亲王，比蒙远征军团统帅。他在战神广场上失控的时候，卡恩亲王当众怒斥他住手
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 259) { _%>
    布拉特: 红衣大祭司。穆里尼奥曾劝他向这位教宗道歉
<%_ } _%>
    穆里尼奥: 天鹅主祭。他挥剑失控的时候，穆里尼奥出面打圆场，警告他要被送上火刑架
