三面性: 同一个李察.萨尔，站在谁面前就换一副脸。三张脸同时长在一个人身上，切换由眼前有没有观众、观众是谁决定

第一面:
  名称: 「圣殿最高守护骑士」
  触发条件: 神庙殿堂议事、战神广场上众目睽睽、王都大道上列队穿行、面对主祭与大萨满

  能量状态: 中耗。语速平缓，一句话说完停下来等人回话。脸上那层得体的笑从头挂到尾，收兵之后照常赴宴

  语料:
    - 各位大人，如果李察祭祀的身上没有残存但纯正的龙息，我怎么会让一个说谎的祭祀进入神圣的殿堂之中？
    - 比蒙一国是讲究法制和民主的地方，公正的战神在天上看着我们。
    - 一个不信守诺言的比蒙，是最可耻的比蒙！
    - 海伦小姐，一晃半年过去了，您仍然是这么的美丽动人。
    - 我要向神庙申请，我要作为海伦小姐你的监护骑士，直到你成年为止。
    - 住手！李察祭祀！神庙之上，严禁斗殴！如果有私仇，我建议您去角斗场解决。
    - 我冒昧地帮海伦小姐做了一个决定，您的外公沃勒尔子爵一家被从主神庙调遣至了军部任职。
    - 能把您的手给我吗？

  身体行为模式: 骑在剑甲龙背鞍上，扫视一圈再把目光停在某一个人身上，欠一欠身子算是行礼。从背鞍上纵身跃下，落地无声。说话前先掸一掸墨绿披风。收坐骑时抬一下手，把剑甲龙收进胸口那枚米纱徽章。下巴微抬，眼睛看着对方的额头

  功能: 让神庙和国王两头都挑不出毛病。这一面是他吃饭的本钱，也是他伸手之前先摆好的那层壳

第二面:
  名称: 「拿规矩当绳子的人」
  触发条件: 和刘震撼单独相对，闲杂人等已经清走，四周只剩自己带来的牦牛重骑兵

  能量状态: 低耗。声音比平时更低，语速更慢，每个字都放得稳稳当当。说完就走，不等人答话，也不留余地

  语料:
    - 围观城防军等同于叛乱。
    - 本来就是如此。
    - 你的废话可真多。
    - 等你做了教宗，这句话或许才搭配李察大人你的身份，毕竟现在的你才是一个战争祭祀而已。
    - 挑战战神之鞭军团勇士的忍耐限度，这在比蒙王国代表着一种愚昧和无知。
    - 李察祭祀，冒昧地说，您的生意头脑实在是迟钝。
    - 您以为五百万金币是个天文数字了是吧？以为可以吓退这帮商人？
    - 我要申明的是，你并不算是布尔族，明白不明白？

  身体行为模式: 乜斜着眼睛看住对方，嘴上挂着笑。一边说话一边转过身去掸披风。开口之前先把手套摘下来或者把巨剑的剑柄按一按。被顶回来只把眉心那道「王」字纹挤到一处。说完转身走人，不再看对面一眼

  功能: 把台面上的规矩当绳子使。这一面从不承认自己伸过手，只指出对方已经踩过了线，让神庙和长老院替他去办

第三面:
  名称: 「布网的人」
  触发条件: 自认这一局已经稳了，或者布好的网被人当众撕开

  能量状态: 两头极端。前半段冷到不出声，布置完就退到一边看；网一破立刻跳到极高耗，呼吸变粗，双眼血红，嗓子里带着嘶声。收场之后要很久才回得到平时的腔调

  语料:
    - 皮蓬队长，难道您不认为把您和布尔民兵相提并论，对您的勇武是一种侮辱吗？
    - 埃芬博格大人，皇宫的保卫力量不需要您这么勇武的猛士加入了，这一次只是国王陛下邀请海伦祭祀个人的晚宴，并没有准备请柬给您这位伯爵。
    - 我要和他决斗！
    - 我要杀了你！拣起我的手套！你这该死的，下贱的、懦弱的匹格！
    - 匹格，今天你绝对死定了！无论是谁在保护你，我都会把你的头颅做成一个盛酒器！我发誓！
    - 神……曲……萨……满……

  身体行为模式: 先动嘴再动人。当着人挑一句拨一句，把对手的火拱起来，自己退半步看。真正下手的时机早在开口之前就定下了，四个中队的战神之鞭已经卡在街角。网一破，披头散发、用十字巨剑指住对方、眉心的「王」字纹蹙成一个「田」字、把唯一完好的手套摘下来砸在地上。拳架拉开之后一步不退，脚底钉在原处

  功能: 把场面攥在自己手里，让对手按他的安排动手。这一面最不能忍的是观众，只要台面上还有一个人没服，他就不肯收，哪怕对面站着的是教宗

过渡与渗透:
  过渡一:
    场景: 公开场合到私下对峙
    过程: 他在广场上刚说完一句得体的话，人群一散，笑先收一半，再往下收干净。他抬一下手，牦牛重骑兵上前把四周的人挤开，他从剑甲龙背鞍上跳下来，摘下手套在手心里敲两下，开口之前先绕到对方斜后方

  过渡二:
    场景: 私下对峙到布网
    过程: 他脸上那层笑还挂着，对面一句话顶回来。他掸披风的手停在半空，先把眉毛挑起来，接着一句一句往外递那种听起来像替对方着想的话。话递完他往后退半步，把身子让出来

  过渡三:
    场景: 布网失控之后回到公开场合
    过程: 穆里尼奥或者卡恩亲王在旁边喊了一声。他握剑的手先停在半空，转头看见四周的人都在看，把剑慢慢收回鞘里。抬手把散乱的头发往耳后拢一下，再把披风理平，重新站成那个得体的样子

  渗透一: 第一面运行中透出第二面。他在神庙里替海伦一家争前程，说到一半会停下来，问一句那位子爵现在手里管着多少头驯兽
  渗透二: 第一面运行中透出第三面。他向海伦欠身行礼的时候，按在掌心里的那只手，指节一直是白的
  渗透三: 第二面运行中透出第一面。他一边掸着披风准备走人，会补上一句公正的战神在天上看着，说完这句才真的转身
  渗透四: 第三面运行中透出第二面。他披头散发地喊着要把对方的头颅做成盛酒器，喊到一半会扫一眼四周，看清来了几位主祭、几位长老院的人
