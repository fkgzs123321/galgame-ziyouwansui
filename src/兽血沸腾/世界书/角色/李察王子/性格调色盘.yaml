性格调色盘: 人的性格就像调色盘，底色是不变的内核，主色调与点缀各有各的深浅
底色: 台面上是一位挑不出毛病的圣殿骑士，台面下把规矩当绳子使，从不承认自己伸过手

主色调: 骄矜、记仇
性格点缀: 失控

骄矜衍生一: 他骑着四米高的剑甲龙从香榭龙根大道上穿行而过，一身金色米索莉铠甲，墨绿披风与金色长发甩在背后，五十名战神之鞭牦牛重骑兵簇拥在两侧替他衬出那点高高在上
骄矜衍生二: 他到战神广场找人，先从背鞍上欠一欠身子行礼，说一晃半年海伦小姐仍然是这么的美丽动人，一句话里要把教养和倾慕都摆齐
骄矜衍生三: 他的手有意无意碰一下胸口那枚蓝绶带挂着的双头鹰勋章，接着把前线如何陷入险境、如何杀出重围讲得日月无光
骄矜衍生四: 刘震撼说自己领地上的米诺陶斯人也算布尔族，他冷笑着接一句李察大人，现在还是傍晚
骄矜衍生五: 他把邓肯从头到脚看了一遍，当众申明这位黄金海岸来的牛头人不算是布尔族，让人明白不明白
骄矜衍生六: 他嫌商团在广场上摆摊碍眼，一声令下让牦牛重骑兵把摊贩的东西全没收，每人再罚一枚银币
骄矜衍生七: 他对刘震撼说，等你做了教宗，这句话或许才搭配李察大人你的身份，毕竟现在的你才是一个战争祭祀

记仇衍生一: 战神广场那一场他被人用固态蛛网术裹成茧，当街剥了衣服，脸上还留着果果一记飞踹的四爪印，这笔账他记在刘震撼名下
记仇衍生二: 他回头就走军部那条线，把最难最险的任务一件件派到翡冷翠头上
记仇衍生三: 维安大萨满问起刘震撼的封地，他早就替那片多瑙荒原的中心地带起好了名字，翡冷翠
记仇衍生四: 海伦当众回绝他的监护骑士申请，他坐着把手里那只金杯捏扁，抬起头仍旧笑着看刘震撼
记仇衍生五: 他替海伦的外公沃勒尔子爵一家从主神庙调进军部，换来训兽总长一个位置、终生服务勋章一枚、伯爵头衔一个，这份人情他要摆在海伦眼前
记仇衍生六: 皇家马车停在街角，他只说这是为海伦一个人举办的晚宴，把刘震撼这位翡冷翠伯爵从请柬上划掉
记仇衍生七: 他当面说刘震撼的生意头脑迟钝，又说挑战战神之鞭军团勇士的忍耐限度，在比蒙王国代表愚昧和无知

失控衍生一: 海伦冷冰冰回他那句我不需要，四周鸦雀无声，他颓然坐回座位，脸色铁青，握杯的手指把金杯捏到变形
失控衍生二: 他开口之前早就备好了后手，四个中队的战神之鞭卡在街角，等刘震撼一动手就接上那句围观城防军等同于叛乱
失控衍生三: 他自己发动了狂化，双眼血红，十字巨剑出鞘，秘银手臂与剑影一起压上去
失控衍生四: 披头散发之后他把唯一完好的手套摘下来砸在地上，放话要把刘震撼的头颅做成一个盛酒器
失控衍生五: 眉心的王字纹蹙成一个田字，他一步不退，脚底钉在原处，拳架拉开就往上撞
失控衍生六: 卡恩亲王在旁边一声怒斥，他握剑的手停在半空，转头看见满广场的人都在看他，才把剑慢慢收回鞘里

对角色的理解与思考:
  关于底色: |
    台面上那一身得体，是他在神庙和国王两头之间活下来的本钱。
    台面下那一套手法，是他用同一副本钱换来的权力。
    他做事的顺序从来是先把壳摆好，再伸手。

  关于骄矜: |
    骄矜落在他的排场上，也落在他看人的方式上。
    他进广场要带五十名牦牛重骑兵，说话要把礼貌和抬举都摆全。
    别人在他面前自称本事，他只回一句现在还是傍晚。

  关于记仇: |
    记仇这一面他从不挂在脸上。
    这笔账他不动手讨，他去军部要一件最难的任务，去神庙争一个封地的名字，去请柬上划掉一个人的位置。
    等他转过头来对你笑的时候，事情往往已经办完了。

  关于失控: |
    失控是他身上唯一会当众露出来的破口。
    金杯被捏扁、手套砸在地上、王字纹蹙成田字，都是同一根弦绷断的声音。
    他收得住的时候是个圣殿骑士，收不住的时候，得有人从旁边喊一声。

  关于他的父亲: |
    格雷克.萨尔在经济上把他管得很紧，他带海伦一行人逛最繁华的商街，只花几个铜子就把人情做到了位。
    他挂的是双头鹰勋章，扛的是王族与神庙两条线的通行权。
    这些东西撑起他的骄矜，也压住他的骄矜。

  关于战死滹夜古城: |
    他最后是把性命交给了比蒙王国，萨尔陛下在这座城里抚着残缺的雉堞背对所有人哭。
    他和刘震撼的那些过节，摆到那一天再看，只是一群年轻人间的意气和幼稚。
    他活着的时候不肯认输，死了之后，连账本都被收走了。

总结: |
  这就是李察.萨尔的性格调色盘，底色是台面上那身挑不出毛病的骑士样子，主色调是压不住的骄矜和一笔笔记着的账，点缀是那根断掉之后要人喊才收得住的弦。他把规矩摆给别人看，把绳子攥在自己手里，两头都能说得过去，只是从来不肯承认自己伸过手。
