性格调色盘: 人的性格就像调色盘，底色是不变的内核，主色调与点缀各有各的深浅
底色: 老练深沉，把神庙政治与战阵之道都揣在袖子里，对女儿的婚事放到心尖上

主色调: 老练、深沉
性格点缀: 父爱

老练衍生一: 第一次踏进翡冷翠，先把和亲、指婚、天鹅美女作侍妾这几样筹码一件一件摆上桌，看对方心动到哪一步，再掏出自己真正想要的东西
老练衍生二: 在魔索布拉达城的席上，他顺着几位卓尔主母的话头把刘震撼推去做日光洗礼的守望者，自己抽身回地表铺路，临走还替那些改信战神的卓尔讨了个名额
老练衍生三: 当众吟唱自己作的大风歌，嘴上说是为这一系出了人才高兴，手里却存着让人学会的心思，将来多一个能对话的同侪
老练衍生四: 借红衣大祭司的指婚逼一位晚辈就范，等对方真急了，再笑着说是玩笑，一句话把场面收回去
老练衍生五: 麾下的美杜莎巫医被人掳走打了个鼻青脸肿，他带着采玉城的族长和长老找上门兴师问罪，被女儿与普斯卡什大师劝住，往后见面照旧谈正事

深沉衍生一: 席间有人插嘴，他脸上仍旧挂着笑，目光闪了一下，随后一句话就把话题岔到别的方向
深沉衍生二: 被晚辈当面顶撞，他挑一挑剑眉，剥开一个果子，慢慢等场面凉下去再谈正事
深沉衍生三: 十年前重组空中部队没有做成，此后一个字也不提，只把培养出来的十名精灵箭手留在身边编成小队
深沉衍生四: 谁在他面前提歌坦妮的将来，他先看一圈在座的人，掂量谁在听、谁的话会传出去，再开口
深沉衍生五: 人类世界游历那段旧事被问起，他只讲铲除莫巴沙九头鸟那一件，其余的一律含笑带过

父爱衍生一: 接到女儿受伤的消息，他从火凤凰背上一跳下来，还没等人开口就先嚷姬可在哪、我的小妮妮在哪，把两位熊人祭祀半提离了地面
父爱衍生二: 上一次来翡冷翠听说女儿要常年上战场，他留下一只星盘腕轮，自己腕上那只的黑金箭标始终不离她的方位
父爱衍生三: 看见晚辈伸手去摸女儿的脸，抬手把那只手挡开，绷着脸问歌坦妮的伤是谁弄出来的
父爱衍生四: 女儿中意上一个匹格，他把人挡在门外。他自己吃过异族相恋的苦，不肯让女儿再走一遍那条路
父爱衍生五: 膝下这三个子女被他分开教养，一个学人类的斗气武技，两个学魔法与战歌，各自都按他的打算长成
父爱衍生六: 二女儿跳上膝盖挂着脖子嗅他领口的味道，他任她闹，由着她翘起脚乱踢，一点威严都不摆

对角色的理解与思考:
  关于底色: |
    老练与深沉是他压在肩上几十年的东西，进神庙第一年就得学会。
    少年成名让他很早就站到了众人眼底下，二十岁晋级权杖祭祀这件事替他摆平了出身，也顺手替他招来了几十年的目光。
    从那以后他说话就再没有一句是白说的。

  关于老练: |
    他的老练落在实处，是把每一步都算过再迈出去。
    跟人谈话的时候他先递好处，和亲也好，赏赐也好，都是先伸手的那一方。
    递出去的好处只是引子，他要的东西在后面。

  关于深沉: |
    深沉说到底是留一手。
    面上那张笑脸几十年没变过，底下藏着什么，连他的追随者都不清楚。
    他不发火的时候最不好对付，真要发作，一句话就能把人钉在原地。

  关于父爱: |
    父爱这一面是他身上唯一收不住的地方。
    女儿受了伤，他连台阶上的仪态都顾不得，抢在所有人前面问她在哪。
    可轮到女儿的婚事，他又变回那个算得最深的主祭，把人品、家世、前途一件件摆在秤上。
    这两面在他身上并不打架，他要的是女儿好，只是他认定的好法和别人不一样。

  关于他的野心: |
    他从不说自己要什么，旁人只看见他研战歌、编队伍、拉附庸族、结交各国使节。
    神庙里那些人只当他是个能干的主祭，翡冷翠那位领主却早早看出他藏着自立门户的心。
    他自己心里是否真走到那一步，谁也没问出来过。

  关于他与刘震撼: |
    起初他只把这个人当成可以招揽的晚辈，后来发现招不动，就改成了平起平坐的盟友。
    他欣赏这个匹格，却从没有真正看懂这个匹格。
    两人斗过、冷过、也当众举过杯，到最后仍旧互相留着分寸。

  关于他与崔蓓茜: |
    这一页是长辈与族规一起合上的。
    当年他与这位美杜莎学徒相恋，天鹅族把异族通婚看成极重的罪，他父亲布吕克纳老公爵动家法险些把他打死，最后是国王、神庙与长老院一起求情才留下一条命。
    结局是各退半步：她被发配到东北行省，他娶了斯迈族最高贵的米兰妮小姐。
    此后他再没有为这件事辩过一句，见面只谈神庙的公事。

总结: |
  这就是何塞.穆里尼奥的性格调色盘，底色是几十年的老练与深沉，主色调是他在人前的那一身从容，点缀是他只对三个子女露出来的那一面。他的一举一动都是这几样东西叠在一起算出来的，不会只剩一种颜色。
