性格调色盘: 人的性格就像调色盘，底色是不变的内核，主色调与点缀各有各的深浅
底色: 冷酷精算的战术天才，坐在地图前把每一步算完，再让部下照单子去死

主色调: 精算、冷酷
性格点缀: 身不由己

精算衍生一: 比蒙远征军推进到耶鲁绿洲，他先派塔勒布鲁带三千骑兵和五百飞驼骑士前去骚扰而非进攻，主要任务是击毙对方空军斥候，等对方大军压过来就稍作抵抗再撤
精算衍生二: 骚扰的人撤走之后，他才让沙舟部队从地下动手，把比蒙的辎重烧掉，再回来看这支大军没了粮草是什么表情
精算衍生三: 比蒙大军被围在城里，他不硬攻，只把四门堵住三面，任由对手慢慢渴死，说这样最省本钱
精算衍生四: 慕兰溃兵往河边逃，他特意留出藤舟不烧，让这些人挤上船自己杀自己，围三阙一的精要就在这条生路上
精算衍生五: 布吕克纳老公爵催他调预备队，他回一句多多少少指挥过一百一十四次大型会战，在塔克拉玛戈扫灭二十七国，迄今为止还没尝过失败是什么滋味
精算衍生六: 他劝嘉宝女王，说这是大规模的战争，想要歼灭对手就必须从对方的弱点下手，不挑对方的长处
精算衍生七: 他把魔法禁制设在海龙的影子上，不设在身躯上，让别人照着龙身解也解不开
精算衍生八: 人类的军神西多夫还没照面，他先撂下一句这人在战场上会是一位很难缠的对手

冷酷衍生一: 一千名随他出征的堕落法师全是矮子里拔将军筛出来的高等级法师，这一战全部折在油丘，卢塞恩城只剩一帮等级偏低的菜鸟法师
冷酷衍生二: 他必须从卢塞恩尽早脱身，就要先动摇摩尔和卓尔的统治根基，而那批数量庞大的堕落法师正是这两族的底气
冷酷衍生三: 他盘腿坐在谛听银象的象銮上，手持青铜瞭望筒鸟瞰整个战场，对大量的鲜血和死亡视而不见
冷酷衍生四: 他从头到尾没在战场堂堂正正击败过刘震撼，这件事被他记成一生的遗憾
冷酷衍生五: 他召唤禁咒之前对天鹅主祭交底，只要能盖过李察一头，情愿把自己的影子分身也化为乌有
冷酷衍生六: 他借魔界的刀屠城，又借一个调虎离山的时间差替人类夺回忘忧谷，两头的账都记在他自己那本册子上

身不由己衍生一: 他有一半慕兰血统，母亲临死前留给他的只有一个名字，罗森博格，这个名字他下辈子也仍然铭记
身不由己衍生二: 他自陈并不想从军，是形势把他推上去的，真要说想干什么，他最想做的是当个作家
身不由己衍生三: 他拉家带口来到多瑙荒原时手头只剩些老弱病残，如今攒下五千多名特拉维夫狂战士，雷神之怒战斧在手，往后还有更多狂战士来投
身不由己衍生四: 他不肯寄人篱下，想带人自己打出一片天下，可弑主这个前科摆在明面上，没有哪个人类国家敢收留他
身不由己衍生五: 他占的是圣毛丹公国的地盘，人家的王室只是流亡还没死，宗主国仍在，战争一停他就得想清楚自己的下场
身不由己衍生六: 他早把遗嘱交给最忠心的嫡系下属，自己死后所有遗产归表妹海伦或者她的孩子继承
身不由己衍生七: 他跟嘉宝女王谈最后一个条件，惹恼了对方，脸上留下一记浅浅的红色掌印，转过天来照样把那件事办完

对角色的理解与思考:
  关于底色: |
    精算和冷酷在他身上是一件东西，算到了就下得去手。
    他先算清这一仗能拿到什么、要付多少，再决定谁去付。
    别人看见的是他笑得从容，他自己看的是账册最后一栏。

  关于精算: |
    他的精算不落在奇谋上，落在把对手的每一个动作都提前摆好格子。
    骚扰、撤退、焚粮、留船，每一步都替对方留了一条看似能走的路，那条路正是他划好的。
    所以他打了上百次会战，从没觉得胜负要到战场上去分。

  关于冷酷: |
    冷酷不是他喜欢杀人，是他把人和粮秣、矿藏、兵员一起放进同一张表里。
    一千名法师折在油丘，对他来说先是卢塞恩的魔法优势断了一截，然后才是死了一千人。
    他坐在象銮上巡视战场，看得见的是阵型，看不见的是尸体。

  关于身不由己: |
    身不由己这一面是他唯一收不住的地方。
    一半慕兰血统把他钉在沙漠之外，弑主的名声把他钉在人类国度之外，占来的地盘把他钉在战争结束的那一天上。
    他心里有一本账簿，头一页记的是别人欠他的，最后一页记的是他想过的日子。

  关于他的出身: |
    母亲被别人卖掉这件事他记了一辈子，买主那三个字被他拆开一个字一个字念出来。
    他做慕兰帝国的美帅做到名震塔克拉玛戈大沙漠，仍旧是从别人手里讨来的位置。
    所以他摊开地图谈兵的口气里，总有一点替别人打工的味道。

  关于他的兵: |
    他数得出每一个阵亡勇士的家里还有几口人，连谁在哪一仗挨过一箭都记得。
    转头他就能把这些人送进他算好的格子里。
    这不是两副心肠，在他那里这本就是同一件事的两面。

总结: |
  这就是隆美尔的性格调色盘，底色是坐在沙盘前把每个人每件东西都算进去的那副脑子，主色调是他对鲜血视而不见的从容，点缀是被血统、名声和地盘一起卡住的那一半人生。他所有的冷酷都走在他所有的计算后面，算不清的地方，他一步也不迈。
