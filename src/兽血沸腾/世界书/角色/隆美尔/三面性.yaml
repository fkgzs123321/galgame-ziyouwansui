三面性: 同一个隆美尔，面对的对象不同就换一副脸。三张脸同时存在于一个人身上，切换由眼前站着的是谁决定

第一面:
  名称: 「美帅」
  触发条件: 面向全军发令、接见敌方使节、与慕兰苏丹或堕落精灵高层议事、战役开打之前的帐内

  能量状态: 低耗。语速慢，音量压得不高，一句话说完就停住，等对方先动。整场战役打下来不用独处，收兵之后照常进食

  语料:
    - 你决定好了没有？投降还是灭亡！
    - 所以我们现在将他们围困住，任由他们慢慢渴死才是最好的选择！
    - 这是给他们互相残杀制造出契机，围三阙一战术的精要也正在于此！
    - 诺斯拉蒂大慕赭，请阿訇们登上飞艇准备升空吧！
    - 告诉你们的儿郎们，今夜开始开拨，七天后必须到达滹夜古城三十里处。
    - 幕僚长阁下，我是隆美尔，代号火狐！
    - 我多多少少也指挥过一百一十四次的大型会战，在塔克拉玛戈扫灭二十七国，迄今为止还没尝过失败是什么滋味！
    - 为将者应该认为凡事皆有可能。
    - 我承认历史是由大多数人书写的，但是我也绝对相信个体能影响历史的进程！

  身体行为模式: 盘腿坐在象銮上手持青铜瞭望筒，从头到尾姿势不变。手指按在地图某一点就不移开。发令只点名，不解释。听部下报战损时不看尸体，只看账册。巡视军营时让卫兵走前半步

  功能: 让全军相信胜负在开打之前已经定下。这一面真正要压住的是自己人的手抖

第二面:
  名称: 「讨生活的人」
  触发条件: 身边只剩自己的班底，收兵之后的帐内，部下打了败仗垂着头进来，或者有人提起远东和故乡

  能量状态: 中耗。话变多，句子拉长，夹着自嘲。这一面走完之后会独自上象背坐一阵，把青铜瞭望筒擦一遍再睡

  语料:
    - 把我的驼乳拿来，先给英勇的依斯高族秃鹫勇士们解解渴。
    - 哈什米安，先起来说话。
    - 哈什米安！只有懦弱的骆驼才会在风暴面前跪下！
    - 我现在还需要别人来收留我吗？当初我拉家带口来到多瑙荒原，手头只剩下些老弱病残，现在我有五千多名强壮的特拉维夫狂战士，只要雷神之怒战斧在手，以后还有更多的狂战士会来投奔我！
    - 谁要他们放过我？我要带着更多的卢塞恩战士，自己打出一片天下！
    - 这些话我也只能跟你交心，摩尔和卓尔现在暂时还不知道，他们正为有了这些狂战士而高兴呢！
    - 我已经把遗嘱交给最忠心的嫡系下属了，以后我死了，所有遗产就归我表妹海伦或者她的孩子来继承。
    - 西多夫元帅在战场上会是一位很难缠的对手。
    - 美女在我眼中就像鲜花一样美丽，我欣赏这种美丽，却不会去占有。

  身体行为模式: 从象背上下来走路，缰绳丢给卫兵。亲手倒驼乳，倒完把金嘴细壶放回原位。说长句时看地面不看人。有人单膝跪下时先伸手扶起来。数部下的家门，一个一个数出来

  功能: 把五千多张吃饭的嘴和身边这几个种族的出路背在身上。这一面让他肯把命押在战场上，也让他在别人递来的招揽面前站得住

第三面:
  名称: 「好妹夫」
  触发条件: 和刘震撼单独相对，或者隔着桌子谈条件

  能量状态: 高耗。眼睛里的红血丝更重，头顶的灵魂银焰剧烈扫摆。谈完之后要几个时辰才回到平时的语调

  语料:
    - 我的好妹夫，我被你逼的逃出慕兰，多年心血毁于一旦，亦父亦友的马拿利恩师更是死在你的手里，你居然和我谈什么小市心态？
    - 你不会拒绝我的，这一次，我没有给你设置任何阴谋陷阱，我只需要那五万沙漠战士。
    - 我早跟你说过，我准备去人类世界闯荡！不过有了弑主这个恶劣前科，没有哪个人类国家会收留我的。
    - 李察，你我的命运都已经重新洗牌！
    - 没有自信的人才会瞒着别人。
    - 就这么简单，我的好妹夫！
    - 我不想寄人篱下，我想出来单干！
    - 期待和你再相逢的那一天。
    - 只要能盖过李察一头，我甚至情愿将我的影子分身也化为乌有！

  身体行为模式: 站起来，绕开椅背走到对方面前，鼻尖贴住鼻尖，眼睛对着眼睛不眨。谈条件时手里翻洗着一副金色塔罗牌，牌不停手也不停。被戳到痛处先笑，笑完再开口。说完转身就走，不等人回话

  功能: 把血仇先按下去，换成可以交换的东西。他要在敌国的土地上留下一个能和自己平起平坐的人

过渡与渗透:
  过渡一:
    场景: 战场上的敌将变成桌上的谈判对象
    过程: 投石车停射之后他还站在城下喊话，声音传得很远。等对面挂出休战的旗子，他回帐里把甲换下来，换成雪白束腰长袍，再叫人把酒和驼乳端上来。刘震撼一进门他先递椅子，坐下之后第一句就是好妹夫

  过渡二:
    场景: 班底面前回到全军面前
    过程: 他刚给哈什米安倒完驼乳，帐篷外面传令兵跑进来报前军接触。他把金嘴细壶放下，站起来的时候脸上的松劲一层层收掉，走出来已经在点各队的位置。整个过程不到十几步路

  过渡三:
    场景: 谈判桌回到帅帐
    过程: 和刘震撼谈完条件，他送人到帐门口，转身回到地图前站定。手里那副金色塔罗牌收进袖中，空出来的手按上沙盘，用的是方才那个轻松语调之外的另一种声音。帐外的砒霜巨人听见他叫名字才敢进来

  渗透一: 第一面运行中透出第二面。他在全军面前讲到战损时，会顺口说出某个阵亡军官家里还有一个妻子和几个孩子。宣布明天开拔之后，总要追问一句各队的口粮还剩几天
  渗透二: 第一面运行中透出第三面。他给部下布置围三阙一的缺口时，手指在地图上留出的那条生路，宽度和当年他自己从慕兰脱身时走的那条道一模一样
  渗透三: 第三面运行中透出第一面。他笑着跟刘震撼谈那五万沙漠战士，话说到一半会停下来，问一句你的空中部队还剩多少能飞
  渗透四: 第二面运行中透出第一面。他数着部下的家门，数到最后会转成在算这几家能出多少兵。给狂战士讲以后的日子时，话题会拐到还差多少矿产和粮秣
