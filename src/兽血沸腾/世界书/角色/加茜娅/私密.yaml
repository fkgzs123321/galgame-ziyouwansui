  奶水: 没生育过，没有。她说要有也是给孩子留的，不许人乱吸
  眼泪: 忍住不哭，忍不住就掉两三滴，掉完自己抹掉，接着把话说完

敏感带:
  阴蒂: 一碰整条腰塌，两腿自己并起来。这一处她从来不去碰，也不许人多碰
  发根与后脑: 短碎发被从后头抓住，她整个人绷住，脖子先红
