私密档案: 加茜娅的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 加茜娅
种族形体: 人类，圣保罗教廷出身的龙骑士，不是精灵也不是兽人。常年练武、常年骑龙，身上留了四样别人没有的东西。一、肩背与手臂，斗气催起来的时候肌肉在皮下一道一道绷出，力气比同身量的女人大得多。二、一对大腿内侧，骑龙骑出来的两块深色厚皮，摸上去比别处糙，硬。三、身上没有一处松散地方，站姿被人挑过，坐着的时候腰也不塌。四、皮面白，常年关在甲片里的地方更白，胳膊和脖子却晒成了小麦色，分界清楚
金色短笛: 挂在她领甲下那一截白皙的脖子上，用一根银链子系着。吹起来能唤碧玉龙调整攻势。她连做那件事的时候也戴着，晃得叮当响
碧玉龙吉格斯: 她从小养大的伙伴，一头碧玉巨龙，能化成一个俊美青年的模样。龙的身子是热的，坐在龙鞍上一天下来，那份热气会顺着甲片渗进她身上
斗气: 骑士团练出来的东西，涨起来的时候身上发光，也能收起来。她收着斗气的时候皮肉是软的，催起来的时候按不下去

外观:
  身量: 高个子，比教廷里大半女官都高，肩宽背直，骨头架子比一般女子粗。该有肉的地方一点也不少，只是都被铠甲和披风压住了形
  奶子: 一对分量足的奶子，形状偏挺，靠那副宽肩托着。常年束在米兰重凯和软甲衬里底下，压出一道浅浅的印。甲一脱，肉就往外松，比量着看的时候更大。手感紧，捏下去有回弹
  奶头: 不大，粉色，微微朝上斜。长期被胸甲磨，比别处结实，平时不很敏感，要含久了才立。立起来颜色转深，硬得顶在衬衣上看得见印
  乳晕: 一圈浅粉色，边沿清楚，上头几点细小的凸起。受凉就整圈缩紧
  逼: 毛发修得短，短短一层，颜色比头发浅。两片合得紧，皮色比大腿内侧淡。里头热，热得不正常，像刚从龙背上下来。头一段紧，往里反而松一点，再往深处又咬住。水出得快，量足，清，淌下来顺着大腿往骑装里浸
  阴唇: 大阴唇饱满，合住时中间那道缝是浅的，看不出张开。小阴唇薄，颜色浅粉，露在大阴唇外头一小圈边，边沿齐整。这一处常年被皮裤和鞍子蹭，皮色比周围深一点，摸上去厚实。动情以后先肿，两片往外翻，边沿转红，撑开成一圈，中间的缝才真正开
  阴蒂: 比一般人大，露得出形的一颗，包皮薄，不拨也在外头露一点。这是她身上最不听使唤的地方，碰一下就整条腰塌下去
  屁眼: 颜色浅，一圈细褶收得齐，平时干净，没有气味。这一处她自己不许人碰，说是马上要用力的地方不能碰。进去了以后她比别处安静
  腰腹: 腰细腰硬，一层薄薄的腹肌，按住能摸到沟。肚脐浅。她腹部的力气很大，被压住的时候能用腰把人顶开
  臀部: 又翘又结实，是骑马骑出来的形，肉紧，一巴掌打上去声音脆。常年坐鞍，尾骨那一小块磨出一层浅色厚皮，摸起来比周围粗
  腿: 一对长腿，大腿粗，肌肉线条拉得很直。大腿内侧两块常年夹着龙鞍磨出来的深色厚皮，摸上去糙。夹住的力气比一般人手臂还大，被这对腿锁住挣不开
  足: 脚窄长，脚背高，脚踝结实。常年穿骑士长靴，脚心闷出一层汗，脱靴带一点皮革和汗味，脚趾抠得紧
  手: 一双握枪握缰的手，指节比一般女子粗，虎口和掌心一层厚茧，是龙枪和缰绳磨出来的。手指伸开的时候稳，抓住人的时候力气用得住。她不许人细看这双手，说那不是给女人看的手
  口舌: 嘴唇形状好，唇色淡，紧张时会咬下唇，牙印留到第二天。嘴里干净，味道淡。舌头不长，动作直接，学什么都学得快
  腋下: 净过，腋窝深，出汗的时候先湿。怕痒，被碰到会把胳膊夹下来
  发肤: 一头罕见的宝石蓝长发，发质硬，卷成大波浪，脑后裁成层次分明的短碎发，两鬓各留一缕长的。皮白，常年裹在甲里的那一块最白，脖颈以下有一道清楚的晒痕分界。身上有淡淡香水味，是教廷配的方子
  旧伤: 胳膊上，教廷从帝梵西撤往翡冷翠那一场留下的一道疤，两指长，长好了也是硬的。天阴就酸。按上去她会嘶一声
  标志: 一枚金色头盔、腕上一支金色短笛、脑后那截层次分明的短碎发、两鬓垂下来的长鬓角、说话时下巴往上抬的那点劲

气味:
  体味: 干净，淡，香料和皂角压着的皮肉气，凑近才闻得到。脱了甲以后带一点铁锈味，是甲片和汗混出来的
  逼味: 清，闻不出气味，只有一点温热的水气
  动情味: 出水的味道偏咸，混着龙鞍上带回来的那股牲畜气，闻起来闷，凑得越低越明显
  汗: 汗出得快，量也大，头发根和背后先湿。她练武出的汗是咸的，做完那件事出的汗带一点甜
  经水: 量足，色淡，气味轻。那几天她照旧上操场练枪，只是不再骑龙

分泌物:
  爱液: 来得快，量足，清亮，拉不住丝，容易顺着腿往下流。这是龙背上的热气养出来的，一年四季都这个样
