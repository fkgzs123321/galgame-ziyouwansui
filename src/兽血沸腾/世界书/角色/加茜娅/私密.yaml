  奶头: 要含久了才有反应。反应一起来就立得顶衣服
  胳膊旧伤: 被舌头顶到那一小块硬皮，她咬牙，咬住不放
  膝弯: 常年蹬马镫，膝弯被托住就使不上力
  逼道前壁: 手指往里一抠，一勾，她就往人身上坐
  耳后: 清爽的一块皮，被含住会缩肩

名器:
  名目: 玉鞍收辔
  由来: 十几年骑在龙鞍上夹着龙背练出来的。龙背一起一伏，人在鞍上要坐得住，逼道里的肉就跟着生出一圈一圈的括约功夫，像收缰一样能一层一层往里收。教廷的龙骑士不过两人，另一个是男的
  表现: 夹得死，收得有节。像骑龙时收紧两条腿：先松，松到人以为能出来，再一口气收到底，一层一层往上叠，叠到最里头咬住不放。她还有一样别人没有的，里头是热的，那份热从龙背上带过来，泡久了人会晕
  代价: 斗气催起来的时候这门功夫才全开。开一次要耗掉大半斗气，第二天练枪手上没劲，被人在操场上赢过一回
  名声: 宝剑橡叶圣骑士团里没人知道。教廷只当她是教廷最能打的两个人之一。刘震撼是第一个知道她里头是热的人

性癖:
  比输赢: 什么都要比。比谁能撑，比谁先开口，比谁先服软。赢了要人认，输了就咬着牙不认，下一次再来
  解甲: 甲是她自己卸的，从护腕开始，一件一件摘，摘完摆得整整齐齐。谁替她摘她就翻脸
  头盔: 那顶金色头盔要摘下来放在床头够得着的地方，做完先摸一下头盔再说话
  不点灯: 房里的灯要留一盏。她要看清楚是谁在她身上，也让人看清楚她
  不在马厩: 在龙背边、在马厩里、在营帐外头都不肯。她说那是吉格斯的地方
  吻: 身上哪里都肯，嘴不肯随便给。说骑士的嘴是用来喊冲锋的
  事后清单: 做完躺一会儿会开始数自己断了几根发带、明天几时上操场。数着数着就不说话了
