对角色的理解与思考:
  关于底色: |
    她把龙骑士的荣誉摆在最前面，认下的规矩一条条守到底，输了的账不认它算清。
    斗兽场那一场她输在赌约上，账却一直挂着，转脸就问人一个输了自尊的龙祭祀还配不配挑战。
    这一条她从头用到尾，在瓦伦西亚如此，在沙巴克收下戒指的时候也如此。

  关于骄矜: |
    她的骄矜先落在出场的动作上。
    夹着头盔从大门外踱进来，自报宝剑橡叶圣骑士团副团长；戴好头盔，甩了甩长发，一个垫步跃上看台栏杆。
    别人拿话激她，她一句该不是害怕了吧丢回去，语气里连火气都不肯露。

  关于护教: |
    教廷是她所有话头的起点。
    她替贞德要人、留人，说会尽最大的努力去度化那个罪恶的比蒙；不肯替他转达请求时，一句请原谅我无法帮你转达就把他挡在门外。
    高阶神术多洛特的红衣主教未必施展得出来，这句话她摆得很实。

  关于好胜: |
    她挑地方、挑规矩，也挑对手的破绽。
    嫌酒吧不够空旷，她把对手带到斗兽场，还要先声明决斗秉承公平的原则。
    大师出面叫停那一场，她脸色铁青地站在看台上一声不吭，输得不服气。

  关于争胜: |
    多洛特那一场败绩她一直挂着。
    消息在沙巴克闭塞了一个月，被人当面说出来的时候，她脸涨得通红，蓝眸一眨不眨地瞪住对面。
    听到对方也有植物系巨龙魔宠、阶位比吉格斯还高，她与兰帕德一起失声喊了出来。

  关于慕强: |
    她认得清谁比自己强。
    对面亮出两位仙女龙魔宠，她真心实意地羡慕；翡翠巨龙摆到眼前，她喊一声神啊，兴奋与颤抖压不住。
    一条巨龙给美人摸下脸，她想也没想就同意，脑子里连警惕都没有起。

  关于骑士规矩: |
    谈崩了教廷的筹划，她先把话头转回正事，催着尽早赶到庞贝。
    她恭维圣奇奥大师的话说得体面，长辈当面点她的缺点她也受着。
    规矩在她这里不是装出来的，该守的一条都不含糊。

  关于守名: |
    圣女怀孕这一套她与兰帕德一起对外说。
    圣子、圣母、养父三个名分她一条条摆清楚，教廷要在出生地建圣母院、派守护骑士。
    她把话说绝，圣子的养父是谁并不介意，哪怕是个食人魔。

  关于护驾: |
    魔族围上来的时候，她手心里的汗水浸润了七米龙枪的枪柄。
    普斯卡什大师指挥她和所有空骑圣堂携带教皇与十二枢机突围，其余人留下来阻击掩护。
    一路断后拼命，安全到达翡冷翠的空骑圣堂只剩十八人，她也受了伤。

  关于体面: |
    她的体面一半是给教廷的，一半是给自己的。
    传闻把她编进与刘震撼有牵连的那一串名字里，她不接这个话头。
    她与所有空骑圣堂护着教皇撤回翡冷翠，贞德当面问她胳膊上的伤，她照旧把身子站得笔直。

  关于倚仗座骑与名号: |
    她的本钱一大半在座骑与名号上，这两样都来自教廷。
    人类世界的三大龙骑士里，兰帕德在翡冷翠，她在教廷，两边各占一个名号。
    到了终盘，数人类这一边的空中战力，龙骑士与圣堂骑士仍旧摆在前头，她那一份没有换过地方。

  关于排场: |
    她的排场是教廷给的规格。
    金色头盔、龙枪、宝石蓝披风与领甲里那枚金色短笛，她一样都不肯将就。
    到终盘她出场仍旧走骑士的正门，头盔夹在臂弯里，站定了才报家门。

总结: |
  这就是加茜娅的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着加茜娅，并非单纯的一种颜色、一个标签。
