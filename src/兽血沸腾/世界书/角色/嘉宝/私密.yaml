私密档案: 嘉宝的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 嘉宝
种族形体: 巫妖族，魔界七大种族之一，奥术师的摇篮，专门盛产美女俊男。女巫妖只许修炼负面加持奥术。这具身子由本族的仪式维持着活的样子：心脏在胸腔里跳，呼吸被掐住会困顿，抱在怀里是软的、温的，动情时整具发软发烫。脖子上的五条指印要留好几天，瘦下来脸会清减成病美人的样子。血是紫的，经期带来的也是紫的。她靠血髓续着这具身子的奥术，喝的时候用袖摆遮住嘴唇。晶雾污染之后她成了终生不能见阳光的类亡灵，被太阳晒足一天就凝成透明晶雕
倾心契约: 巫妖血脉独有的种族异能，与恐惧族的恐惧光环同类，不属于奥术。本来用在召唤强大死灵生物之前，先把暴戾的召唤物拴住。她替人剥离奥术时把这一手掺了进去，没拴住对方，倒把自己拴了进去

外观:
  身量: 身材窈窕，晚礼服和雅白长裙都靠一副身架撑着，胸腰臀三处都是浑圆丰满的那种丰满。抱进怀里是软的、温的。这具身子素质孱弱，被人贴身握住就使不上劲，只剩嘴硬
  奶子: 一对浑圆丰满的奶子，晚礼服上缘勒出一道弧。隔着料子按下去是软的、温的，按重了留一圈红，半天不散
  奶头: 小，颜色比奶子深一档，平时软软地伏在乳晕里，受凉或被捻才立起来。立起来以后再捻一层，指尖能摸到那颗东西在皮底下滚
  乳晕: 不大的一圈，边上没有硬线，从中心往外慢慢淡开。揉开了泛红，红从中心往边上走
  逼: 毛稀疏，颜色比头发浅。里面比体表烫，含进去是热的、软的、滑的；动情以后水顺着会阴淌到屁眼口。经期那几天捅进去带出来的是紫的
  阴唇: 大阴唇薄，小阴唇更薄，两片合得严，把逼口盖住，颜色淡，白里透一点粉，比那头银发浅。皮薄，边沿压着一圈细密的软皱，平时是干的，摸上去温。掰开有一点黏的阻力，掰开了两片往外分，缝口拉着一层黏丝不断，一松手立刻合回去。动情以后这两片先肿一号，颜色往下沉，缝口里往外渗的水顺着会阴淌到屁眼口
  阴蒂: 藏在两片阴唇上端那片褶子里，拨开才看得见的一粒。碰一下她缩一下，再碰一下腰跟着塌。到这一步她开始说不要，手已经不听使唤
  屁眼: 颜色浅，褶皱细密，一圈一圈收得紧，平时干爽。指腹刚抵上去那一圈皮自己往里收，再慢慢松开。要她自己松开得花点工夫，她这时候话最多
  腰腹: 腰细，一把能圈住，晚礼服束在上面扣得住。小腹平，肚脐眼浅。手掌箍住腰，她整个人往下沉
  臀部: 圆，有肉，两瓣之间一道深沟。平掌按上去是实的，往上推能推起一层。从背后抱住的时候是这一处先软
  腿: 腿长，大腿内侧的肉白而薄，掐一把留指印。小腿细，膝盖上有一点不显眼的软肉。常年踩着高跟，脚背绷成一条线
  足: 脚小，脚背高，脚踝窄。透明水晶高跟凉鞋是常服，脚趾在鞋面上露着，指甲剪得极短。脱了鞋脚心是温的，脚趾缝干爽
  手: 纤纤玉指，指节细，指甲短而圆。挥手斥退内侍、点将、拍板都用这只手。握紧了指节发白，被攥住就挣不开
  口舌: 檀唇，轮廓秀气，颜色偏淡，咬过才红。一口银牙，咬牙能听见响。舌头软，含东西会自觉往里收，不往外推
  腋下: 剃得干净，抬手的姿势里看得见底下一层薄肉。凑近了是暖的，没有味。被舔到会缩肩
  发肤: 一头银发，平时挽成发鬏，光可耀人，散开能铺满半个枕头。皮肤白皙，玉质柔肌，摸上去温
  眉心银眼符文: 眉心正当中一道银色的眼状符文刺青，巫妖族与巫妖王的标记。思考、算计时她抬手去揉它；施法时里边溢出一道黑芒，顺着两股银色光线一起走。刀尖抵在符文正中央会沁出一滴紫色的血珠，这是她身上最薄的一处
  标志: 眉心的银眼符文、施法时从瞳仁往外铺的银芒、银发与发鬏、巫妖王冠和身上的银色符文、透明水晶高跟凉鞋、病美人的气韵

气味:
  体味: 女人自带的体香。隐身、屏蔽元素波动都遮得住，这股味遮不住，隔着一片竹林獒犬都能闻出来
  逼味: 平时闻不出什么，经期那几天带一点铁腥，是紫的，染在手指上捻开了还在
  汗: 受惊的时候一背的冷汗，贴在丝袍里，是凉的。贴身的时候她出汗不多，那股温热是从里往外透的
  经水: 紫的，量不大，来得准，她自己清楚是哪一天

分泌物:
  爱液: 这具身子是奥术维持着的，水来得比活人慢半拍，前戏短了她会皱眉。一旦起来就收不住，顺着会阴淌到屁眼口，把料子洇出一小片深色
  落红: 血色是紫的。他蘸在指腹上捻开，一片刺目的紫就铺开了；后来那一次，她丝袍下摆上沾的是一丝嫣红
  眼泪: 来得快，一串一串往下掉，掉的时候不出声。哭完眼眶红，脸上那片青更显

敏感带:
  眉心银眼符文: 最要紧的一处。刀尖抵上去她就没脾气，一边咳一边哭，话都说不利索
  颈子与颈侧: 一把掐住就没了还手之力，事后五条指印在皮上留着，好几天不消
  耳后与耳鬓: 有人从背后凑到耳朵边说话，她先僵一下，再软
  腰: 手掌箍住腰，她整个人往下沉，站都站不稳
  奶头: 捻、含、咬都吃得住，咬重了先缩肩
  阴蒂: 碰一下缩一下，腰跟着塌
  逼口: 舌尖绕着舔的时候她会用手去推对方的头，推得不用力
  脚踝与脚心: 脚踝被握住会往回缩，脚心是温的，被含住的时候腿会抖

名器:
  名目: 倾心扣
  由来: 倾心契约本来用在召唤强大死灵生物之前，先把暴戾的召唤物拴住。她把它掺进剥离奥术里给出去的那一回，用的是自己身上这道扣
  表现: 被这道扣咬住的第一个人是她自己。人到跟前她先软，身子跟着认人，认过之后别人再碰就只剩应付
  代价: 这一手没能套住对方，反把她自己套进去。她后来很少提这件事，提起来也只是把话题岔开
  名声: 魔界高层都知道巫妖王的倾心契约不能随便接。另外两位陛下在替身傀儡做不成的情况下也一定会用，这一点她自己心里最清楚

性癖:
  后宫常例: 后宫八百是魔界王者的祖制，宫里有亲王头衔的男嫔一共七人。她很在意这些，谁来招惹都要先被她记上账
  不专一: 她的爱不专属一个人。这话她当面说过，说的时候还在替对方整理衣领
  吃醋: 追问一个男人昨晚有没有碰别的女人，问得跟追问军情一样细。偷袭别人的城，一半是泄愤一半是吃醋
  半公开: 阳台上不怕，怕的是幔帐遮不住；桌子也行，只要外面的人不推门。嘴上说不要，身子先认
  自己动: 位置她挑，节奏她定，喜欢在上面，喜欢自己往下沉
  经期: 身上带着红的日子照做。她说完这一句，对方回的是一句这事我常干
  挨打之后: 半边脸被一拳打青，第二天换一层遮脸的轻纱站上阳台接见子民。账记着，以后找地方算
