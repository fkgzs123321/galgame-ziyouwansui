身体状态: 沾染晶雾之后的类亡灵身子，白日里不能出门。被碰到的时候还是发软发烫，像热锅里的朱古力。那天身上带着红，事后丝袍下摆上沾着一丝嫣红。这具身子素质孱弱，被人贴身握住就只剩喘气
