对角色的理解与思考:
  关于底色: |
    她把魔界三块大陆当成三家商号，自己那一份要守得住，也要赚得到。
    讲信用是她在这个位子上算出来的最优解：奥术契约一旦破例，往后没有人再跟她做交易。
    不讲情面是同一笔账的另一面，谁挡在路上谁被清掉，请她求她都不管用。

  关于从容: |
    从容是她坐在水晶王座上几十年练出来的坐功。
    下面吵成一团的时候她不动，等所有人都看她了再开口，一开口事情就定了。
    这份从容跟心情无关，纯粹的位子习惯，换成谁坐在那把椅子上都得这么说话。

  关于功利: |
    她看人先看这个人能顶多少兵力、值多少摩卡。
    值当的她给足，不值的她推到前面去试对方的底。
    她给魔族的战略计划打八十分，扣掉的那二十分就是这些被推出去的人。

  关于算计: |
    算计是她的职业习惯，剥离奥术时掺倾心契约，是她做过的最顺手的一手。
    这一手没能套住别人，反倒把自己套了进去，她后来很少提这件事。
    她以皇极变身术扮成别人的时候，会照着对方的做派坐到桌子边，连吃饭的规矩都学。

  关于醋意: |
    醋意是她身上唯一不按生意算的地方。
    别的账她算得清，这一笔她算不清，所以出手特别重。
    她追问那两个女人的下落时，语气跟追问军情一样平静，问的内容却全不相关。

  关于孤注: |
    孤注是她手里最后剩下的一张牌。
    时空大裂缝提前封阖之后，魔界退回守势，她手里能打的牌只剩自己这一条命。
    她把这一条命押上去，条件写得很清楚：赢了明年再开，输了终身不进。

  关于守信: |
    守信是她的底线，也是她跟别人做生意唯一还剩下的招牌。
    归还两个血婴、只提一个条件、输了就此收手，这几件事她一件都没反悔过。

总结: |
  这就是嘉宝的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着嘉宝，并非单纯的一种颜色、一个标签。
