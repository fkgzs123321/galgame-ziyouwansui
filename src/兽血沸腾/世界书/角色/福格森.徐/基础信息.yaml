基本信息:
  姓名: 福格森.徐。他自称徐先生，另有福格森徐与福格森.徐两种写法
  性别: 男
  种族: 人类
  出身: 丝绸大陆云秦帝国。他的族人是千年前东方旅行者的后人，宝船船首以卡帝乐徽章与撞角为标记
  身份: 云秦方士后裔，身负云秦帝国皇帝陛下的至高使命，出海寻找长生不老的仙药。他也是蓬莱号航船的前任船长
  居所: 澈桑大陆。祖先在澈桑停泊扎根，繁衍生息至今，每逢五十年再派出一批寻找仙药的船只和使者
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 161) { _%>
  与主角关系: 从人质变成了海族的合作者。他靠避水玉佩在海里活了下来，替海族研制安尔乐离水保湿法阵，使海族得以登陆爱琴
<%_ } else if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 37) { _%>
  与主角关系: 把他从船上扔下海的人。他被卸掉下巴、夺走扳指，扔给了海族当人质
<%_ } else { _%>
  与主角关系: 在海上跟他谈霸下龟壳生意的匹格祭祀，开出血玉扳指加整条蓬莱号的价码
<%_ } _%>

外貌特征:
  面貌: 清癯，下颌三缕长须，峨顶高冠下露着花白鬓角
  着装: 白色丝质长袍
  随身: 双手拇指各戴一只血玉扳指，也叫芥子扳指。殷红中透出一点雪白，组成了奇妙的图纹
  气度: 站姿端正，一副仙风道骨的方士做派。他自称最拿手的就是摆出仙人造型
  变脸: 一旦谈不拢，仙风道骨的面孔顷刻间就会扭曲，三缕长须无风自动，风度荡然无存
  谈吐: 说话带着丝绸大陆的腔调，喜欢拿云秦帝国与始皇帝说事。他劝人时语气里有一股能勾出心底最深处诱惑的媚惑力

背景设定:
  方士传承: 他的祖先为云秦帝国最优秀的方士。云秦方士不以研究伤害人的魔法为目的，最擅长的是奇妙的阵法和延年益寿的方术
  东方的龙: 东方的龙是最神秘的所在，从不显现容貌，也不参与人世纷争，至今只是一种传说。云秦方士仿造的十二金人，身上的奇门阵法就是从神龟背上的矩阵洛书里领悟的
  皇帝的任务: 云秦皇帝派他出海，为的是寻找长生不老的仙药，并降旨找不到就永远不要回来。他认定龙是东方传说中最长寿的神兽
  龙丹之说: 东方的传说里，龙子活满一万岁就能脱壳化龙，壳上生出五截肋纹，每截破开都含一颗岁月精华凝练的龙丹，服下能与日月同老
  龙肉的分量: 他认定刘震撼手里那幅龟壳是霸下遗骸、上面挂的腌肉干是龙肉，为了换到手，他连族人几千年的誓言与使命都搬了出来
  搭船的目的: 他要拿血玉扳指、再搭上整条宝船，换刘震撼手里那幅龟壳
  祭海的童男女: 他亲口说出祖先出海时带着那么多童男童女，本来的用途就是祭海。这件事只有族中高位者才知道
  出价: 他先后拿丹药、金人、甚至把蚌女凝玉也放上牌桌，提出让刘震撼收凝玉做侍妾，说云秦始皇帝也没有这种艳福
  杀心: 谈崩之后他在船舱里安排了后手，给商队的人下云秦宫廷用的催情药红铅，掺在燕麦糊里，还提议把潘塔武士送去角斗场、童女卖入妓寨
  红铅: 云秦帝国皇室专用的宫廷催情药，是云秦方士自幼炼铅化汞、奉献取悦君王的房中秘药。他平时靠人鱼公主的巨型海马才提炼出了三颗
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 37) { _%>
  人质的下场: 他先被刘震撼按着龟壳谈生意，随后被卸掉下巴、夺去扳指，划着一道抛物线扔进了海中。刘震撼当时对他说的是彻底的鄙视
  转手: 是刘震撼把他扔给海族的。西米里安王子认下他当人质，还让打着绷带的班尼路武士菲高出面指认
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 733) { _%>
  离水法阵: 为海族制作安尔乐离水保湿法阵的人就是他。两个巫妖王用两部该法阵收买魔界三大海族
<%_ } else if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 161) { _%>
  离水法阵: 为海族研究安尔乐离水保湿法阵的人就是他
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 161) { _%>
  法阵的分量: 这种法阵与翡冷翠的便携式空间传送阵差不多大小，足足上百个平方，重达数吨。海族大军中专门有卫队负责看管、隐藏与转移
  结界的范围: 丝绸方士制作的法术装备，结界范围之大甚至能笼罩一座城市。上一届海陆大战海族用的是人手一只的离水徽章，这一届换成了他的法阵
<%_ } _%>
  避水玉佩: 凝玉身上的避水玉佩也是方士所制
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 634) { _%>
  身后的名声: 族人曼尼奇.东方长老提起他时，只知道他牺牲在了寻药途中，还惦记着他那本只传长房的寻药笔记。他本人仍旧健在，只是落到了海族手里
<%_ } _%>

能力体系:
  奇门遁甲: 他靠方士的奇门遁甲阵法驱动金人。斋殆金人是云秦始皇帝收集丝绸大陆六国青铜兵器熔化后铸成的
  斋殆金人: 念咒可以召出两个十米高的斋殆金人，也就是十刃的高度。爱琴的魔偶无论是木偶、土偶、石偶还是骨偶，站在金人面前都象荧火虫面对皓月
  每日一次: 一天只能召唤一次，每次不超过四盎司沙漏，超时阵法供不上动力，金人自动回到芥子扳指
  金人的短板: 无法立于水面，不会飞，也不能下水
  殆宇束缚咒语: 束缚咒，一次可以束缚两个金人整整两个时辰。这是他留的一手后招
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 36) { _%>
  斋字驱使咒语: 驱使金人的咒语。他把这套咒语教给过刘震撼
<%_ } else { _%>
  斋字驱使咒语: 驱使金人的咒语
<%_ } _%>
  血玉扳指: 芥子扳指，金人的居所，也是他能驱使金人的根本。没有它，他就是个无缚鸡之力的老者
  丹药: 他随身带着珍珠般大小的朱红色药丸，说是能补充元气的丹药。他给海伦下过药，药效长达两天，醒来只会更加精神百倍
  避水装备: 薄薄的水障与避水玉佩，能让他和海族在水里通行
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 161) { _%>
  法阵工艺: 安尔乐离水保湿法阵是他的手笔。海族能够登陆爱琴大陆，全赖这门手艺
<%_ } _%>
  谈判的手腕: 他能屈能伸，见硬的不行就用软刀子，用女人、用钱财、用虚无缥缈的长生来撬动对方
  短板: 本人是无缚鸡之力的人类老者，全靠金人与法宝撑场面。金人一天只能出手一次，胳膊被毁也无法自行修复

