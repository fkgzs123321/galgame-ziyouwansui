共有的色彩一: 羽毛脱光的时候它流氓气十足，羽毛一旦长满，它立刻变得温文尔雅、姿态高贵
共有的色彩二: 它光着身子用翅膀撑住修长的脑袋，侧躺在茅草堆上，一只爪子跷着乱颤
共有的色彩三: 它的抗毒能力疯狂，对毒素有极强的抗性
共有的色彩四: 它可能是整个爱琴大陆唯一一个使用武器的魔宠，从早时的密集阵狼牙棒换到今天的雁翎双刀
共有的色彩五: 它是从茶山出来的超阶火鹤，法术番数按茶叶命名

对角色的理解与思考:
  关于底色: |
    它在丝绸大陆的茶山破壳，破壳第一次睁眼看见的是一只松鼠，就把这只松鼠当成了妈妈。
    它用三千年把自己修成超阶神兽，修到蒙顶甘露之后静极思动，出山游历红尘。
    果果用通灵战歌卷轴把它召到爱琴大陆，它随果果认了刘震撼这个老板。

  关于好色: |
    它盯美女的动作没有遮掩，坐在席上直着眼看，被踢一脚才回神。
    它爱在人前摆人形，峨冠束顶，一簇火红发鬏，先找漂亮女子身边站。
    好在它没有为这件事误过仗，看归看，动手的时候眼睛里只有对手。

  关于抢食: |
    它抢战利品抢得理直气壮，被质问时先把东西亮出来当功劳。
    它极喜欢吃蛇，战场上专拣羽焰火蛇的尸体，谁拦路先递狼牙棒。
    背着果果和喀秋莎的时候它连手都不动，绕着战场飞。

  关于油嘴滑舌: |
    它的嘴比翅膀快，管老板叫老板，行礼欠身，敬语和荤话掺在一起说。
    它骂人不挑场合，损人那几句说得比打仗还顺。
    放狠话它张口就来，灭人满门这句它说得比谁都利索。

  关于凶悍: |
    它真打起来不留退路，先挨打再找机会，羽毛脱光反倒更凶。
    它替背上的果果挡浓浆用的是头颈，护的是别人的命，自己的皮肉先不要了。
    革瑞恩挨的那一顿耳光，是它替老板出的头。

  关于好战: |
    它是超阶魔兽，却偏要用身体和武技，说魔力终究有限。
    它卷着大铡刀贴身近战，一铡刀削掉革瑞恩半只前爪。
    追杀被叫停它不高兴，站在看台上掂着狼牙棒，脸上写着还没打够。

  关于狡诈: |
    它耍心眼多半用在调兵和劝进上，正面硬撼之外它总能找到绕过去的路。
    它劝老板蓄养姬丝凯碧，凑近了压低声音说的那一套，比谁都像人。
    碰上穆里尼奥这种真正的老手，它的心眼不够用，它当场就认。

  关于谄媚: |
    它的谄媚冲着老板一个人去，敬语、欠身、报出永夜的极光这个名号。
    这份谄媚不耽误正事，老板指哪它打哪，打完照旧要分战利品。
    它磕头也要挑对象，向果果磕得，向黛丝磕不得，理由是平级。

  关于重情: |
    它嘴上最油，碰上真的离散事反倒安静下来。
    潮汐领主与许德拉生离死别那一次，它偏过头去，对这两位的评价很高。
    它对松鼠妈妈那一段旧情，落到果果身上就是一个捉虱子的动作。

  关于服气: |
    它只服在真本事上，败了认败，认完照样接着打。
    老板几天压下心魔这一条它记了很久，说东方高手多是栽在这上面。
    它讲信义，答应下来的话就守着，谁要反悔它第一个不干。

总结: |
  这就是壹条的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着壹条，并非单纯的一种颜色、一个标签。
