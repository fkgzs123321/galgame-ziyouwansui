基本信息:
  姓名: 壹条
  性别: 公
  种族: 博浪沙火鹤
  出身地: 远东丝绸大陆的茶山
  美名: 永夜的极光
  身份: 果果用通灵战歌卷轴召唤出来的魔宠；刘震撼的魔宠兼坐骑，被戏称为流氓鹤
  外号: 雀斑仔
  契约状况: 与果果签下心灵契约，随果果认了刘震撼这个老板
  与主角关系: 嘴上骂骂咧咧、办事最为卖力的一位，翡冷翠的空中战力与远程打击支柱

外貌特征:
  鹤形: 火鹤本体通体赤红，黑衾雪翎，脑袋上甩着一簇火红的皇冠翎，翎毛根根龇开
