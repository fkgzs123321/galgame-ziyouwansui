  人形: 峨冠束顶的清癯英俊少年，一簇火红发鬏
<%_ } _%>
  面部: 人形脸上残留着火焰帝君留下的麻瘢与雀斑，刘震撼拿这个叫他雀斑仔
  常服: 人形时身披大红袍，平时也常披着这件袍子
  武器: 人形持雁翎双刀与鹤喙剑；鹤形则从翅拐里抽出一千多磅的星辰精钢狼牙棒
  随身: 脖子上挂着燃灵之链，变回鹤形前必先摘下，免得撑裂
  体态: 在人形与鹤形之间来去自如，鹤形时被人类当成一只瘌痢巨鸟

背景设定:
  破壳: 他在茶山破壳，第一眼看见的是一只松鼠，便把这只松鼠当成了妈妈；松鼠妈妈替他摘榛子、捉虱子，也让他懂事之后没有变得孤僻怪戾
  修炼: 他用三千年在茶山把自己修成超阶神兽，法术番数按茶叶命名；普通博浪沙火鹤要四千年才能练成蒙顶甘露境界，他提前了一千年
  出山: 修到蒙顶甘露之后，更高层次已非五六千年可期，他静极思动，出山游历红尘
  游侠: 他在丝绸大陆行侠仗义，人形鹤形都闯下大名；各方势力拉拢不成便合谋剿杀，仇家越结越多
  召唤: 果果用通灵战歌卷轴把他召唤到了爱琴大陆，黛丝的翡翠之梦又赶上了那一刻，三方签成了心灵契约
  远东路上: 他随刘震撼回丝绸大陆，卷进黎山门等神兽门派的厮杀，也在那里把鹤喙剑上的功夫亮了个够
  沙场: 多瑙大荒原上一战，他顶着四大魔免横冲直撞，把海慕法师逼得偃旗息鼓
  冰凰与凤凰: 他和小鹦鹉一起度血时与冰凰唐蓓尔金娜结了交情，穆里尼奥那对孪生火凤凰则认了唐蓓尔金娜做教母、认他做教父；他一身火红只是没有皮肤的嫩肉，跟真正的凤凰摆在一起，丰神俊朗不输，卖相却差了一大截
  日常: 他好色贪吃，爱抢战利品，见蛇就吃，谁挡路就先递一狼牙棒

能力体系:
  种族天赋: 博浪沙火鹤的超阶体质，理论上可活九千九百九十九年
  魔法系别: 火系为本命，虹吸火练、火焰之柱、火焰刀刃都是他的看家手段
  三系免疫: 水、火、电三系魔法对他完全无效。海慕法师的水系法术在他身边化为乌有，慕兰阿訇的火系魔法同样落空，亚力士海国的电鳗术士放出的闪电攻击波也伤不到他，四大魔免怪鸟的名头是这么来的
  人形变化: 蒙顶甘露境界让他能从鹤形幻化成人形，人形比鹤形更为敏捷
  战斗方式: 超阶魔兽却偏好用它口中所说的真正利器，身体和武技；无论人形鹤形都要近身肉搏，挥翅扇人耳光，抽狼牙棒砸阵
  拼杀经验: 对毒素有极强的抗性；懂得怎么对付蛇类神兽，也懂得怎么用头颈圈住灼热浓浆替背上的果果挡灾
  战歌: 会插下战歌图腾柱叫阵，也会讲丝绸大陆渡厄的典故，抗住九道闪电便可飞升

关系设定:
  刘震撼: 他的老板。他嘴上不服气，说「俺只能踢两脚，老板却能踢三脚」，转头又替老板把敌人往死里打
  果果: 一见投缘的伙伴。他从果果脸上看到松鼠妈妈的影子，第一次见面就替它捉虱子，也是它把他签走的
  黛丝: 翡翠之梦的启用者之一，因为那场巧合与他和果果结成了契约
  安度兰长老: 他的长辈与旧识。当年安度兰用冰雪封印封住自己，他才应了远东智者那句大利西方的谶言来到爱琴
  火焰帝君: 被他用大印象火焰塑形把形态永久定在人形状态的对手，他脸上的麻瘢是这一战留下的
  穆里尼奥: 用植物系魔法戏弄过他的天鹅主祭，他事后承认论耍心眼自己不是对手
  喀秋莎: 常常同骑同行的伙伴
