  九头蛇身: 九颗三角脑袋各长一条脖子，中间那颗最巨大恐怖，是命门，不砍下它她就死不了。其余八颗会互相啮、互相舔伤，也会一齐扭头盯住同一个人。脖子跟壁虎尾巴一样，挨重击就整根脱落，掉下的蛇首能长成分裂体。蛇身贴地蜿蜒时肌肉从尾往前送
