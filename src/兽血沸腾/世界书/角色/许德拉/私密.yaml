  蓝色尖刺的根: 刺是硬的，刺根底下是软的。顺着刺根往下按，那一片的刺一根根倒下去

名器:
  名目: 九曲衔珠
  由来: 龙蛇龟蚌皆产珍珠，九头蛇怪的珠子取在下颌。珠带九连环闪击，她是风暴许德拉，珠里另有水系加成，就是若尔娜说的水玲珑九连环
