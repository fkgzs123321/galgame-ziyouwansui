气味:
  体味: 海腥压着沼泽的泥气。泡在海里是海腥，上岸是水洼的淤气。凑到脖子根闻，腥里压一层凉，像井底石头
  逼味: 缝口合着闻不到。掰开纵沟，里头的味是凉的腥，像剖开的深海鱼，不酸不臭
  动情味: 腥味往下沉，从腹面那一线往外散，是海边的潮气带一点铁味。隔着一条尾巴也闻得到
  汗: 蛇身不出汗。皮离水久了发白起皱，得回水里泡透才复原
  经水: 没有经水。她一年只进一次食，吃灵魂和脑浆

分泌物:
  爱液: 来得慢，量少，色清，黏得能挂住，是凉的。头一回要摸很久才出水，出了水顺腹面那条沟淌到尾根
