  屁眼: 在腹面尾段，跟泄殖的出口并在一处。本体时收成一圈疙瘩皮。缩小后是一圈水蓝细褶，一缩一缩，手指抵上去猛地缩紧
  腰腹: 躯干粗得像橡木酒桶，没有腰。缩小之后是个圆墩墩的肚子，一捏就陷，像橡皮泥，肚皮里裹着那颗菱形发光物
  臀部: 两条石墩粗腿根上那两团肉。本体时硬，是撑住十刃身子的底盘。缩小之后是软的，拍一下弹一下
  腿: 两条石墩一样的蓝色粗后腿，像并排的两只大象脚，粗到两只手才圈得住一条。腿只用来撑住身子和发动战争践踏
  足: 腿底是一整片厚掌，没有脚趾。落地就是一记下顿，十码内被她踩得站不住
  手: 没有手。九条脖子就是她的手，要拿什么用蛇吻叼，要缠什么用脖子卷。幽魂态能把九条脖子绕在一起打蝴蝶结
  口舌: 九张嘴，每张一副獠牙，九条火红的开叉蛇信。蛇信一吞一吐，嘶拉嘶拉地响，九条信会互相舔创口。唾液剧毒，能毒死巨龙
  腋下: 没有腋窝。九条脖子根跟躯干接上的那圈褶缝就是她的腋下，皮薄，比别处凉。手指插进去，那颗头缩回去
