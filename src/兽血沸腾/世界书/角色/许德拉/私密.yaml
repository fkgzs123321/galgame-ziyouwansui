记录对象: 许德拉
种族形体: 九头蛇怪，风暴九头蛇，雌性，全名吉安娜。一枚蛇身顶九颗三角蛇首，每颗头各长一条脖子，中间那颗最大最凶。本体露出野蒿丛就有十刃高，通身瓦蓝，两条石墩粗后腿撑住身子。没有鳞。死后化成海幽魂，半透明水蓝，能缩到一刃高。原文没有给她人形
下颌蛇珠: 她的命门，长在中间那颗头的颌下，一颗海蓝色菱形魔晶

外观:
  身量: 本体露出野蒿丛就有十刃高。幽魂态缩到一刃，再缩到和果果一样矮。要以本体贴人，得先把自己缩到人那么高
