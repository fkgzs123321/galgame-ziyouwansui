角色档案:
  基本信息:
    姓名: 许德拉
    性别: 女。九头蛇怪是雌性
    种族: 九头蛇怪，风暴九头蛇。据传拥有神族血脉
    阶位: 深渊强者，与潮汐领主革瑞恩同属深渊界诸君主那一档
    觉醒: 秋季觉醒。革瑞恩是春季觉醒，两条一起被海族用鹦鹉螺声唤醒
    属地: 西雅海域的禁锢海岛。海中有被云泰方士以八门金锁阵封住的孤岛
    囚徒: 一千五百余年前与革瑞恩一同被云泰方士用八门金锁阵禁锢，两条相依为命
    供奉: 海族把它和革瑞恩称作神使，每年用金属囚笼结界把难对付的善良强者送到岛上供它们吞食。海族每年要给它们献上一百个虫人，按年龄顺序安排，年纪偏大的优先
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 166) { _%>
    结局: 被喀秋莎的水箭射成筛子，随后被壹条与戒灵骑士围杀。死后成为幽灵九头蛇，也就是幽魂许德拉吉安娜
<%_ } else { _%>
    结局: 被革瑞恩与海族的召唤束缚在这座禁锢海岛上，两条一同守着云泰方士留下的八门金锁阵
<%_ } _%>
    性情: 沉默寡言

  外貌特征:
    形貌: 九头蛇怪，一枚蛇身顶九颗蛇首
    皮肤: 风暴九头蛇的皮肤是蓝色的
    蛇珠: 蛇珠长在下颌，中间那颗头的颌下
    幽灵形态: 成为幽魂之后是幽灵九头蛇的模样

  背景设定:
    献祭: 海族押着金属囚笼经海神庙传送至海面小岛沼泽，准备献祭两位神使。塞壬女公爵戴安娜以控灵之歌与灵魂转移把艾薇尔的灵魂移入巨虫。李察临场爆发自创战歌，用二段力量汲取战歌狂踹囚笼，笼破之后它以九头蛇怪之身现身
    首战: 革瑞恩与它同时觉醒现身，人面蛇怪自称欺诈者化身，与李察谈笑并互相提防。李察以二段力量汲取战歌汲取十位鲸鱼武士三分之二的力量，配狂化与龙力抡起石碑，一击打飞它六颗蛇首
    断首: 它的蛇首和脖子类似壁虎尾巴，遭重击时会完整脱落以减轻连带伤害，脱落的断首能长成分裂体。只要分裂体存在，它的灵魂就依然存在，沉睡数千年后仍能重新长出九颗脑袋。它断首化成分裂体逃回老巢，仅剩三首时升空以风系魔法猛攻
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 163) { _%>
    伏击: 革瑞恩用日朦胧术隐身暗算，被转移到巨虫身上的艾薇尔以网状闪电破解，菲高抱着艾薇尔与虫子挡在李察身前。革瑞恩自称已册封它为潮汐骑士
<%_ } else { _%>
    伏击: 革瑞恩用日朦胧术隐身暗算，被转移到巨虫身上的艾薇尔以网状闪电破解，菲高抱着艾薇尔与虫子挡在李察身前
<%_ } _%>
    伏诛: 革瑞恩与它强求当魔宠被拒，果果撒出战歌卷轴，壹条提铡刀重创革瑞恩。它被喀秋莎的水箭射成筛子，随后被壹条与戒灵骑士围杀
    幽灵现身: 海底三大王族突袭海岛，混战中茉儿以九头蛇珠施水玲珑九连环，幽灵九头蛇现身救人
    证实: 蛛后萝丝疑似亲自降临堕落仪式现场，幽魂九头蛇怪吉安娜点头证实珊瑚美人活过
    壮大: 革瑞恩与它吞噬冥火骷髅暴君、黑龙族长、铜蜃领主之后壮大
    升阶: 它与人形后的吉安娜与革瑞恩一道吞噬魔族菁英、两位恐惧魔王和四翼骑士，连升一阶
    遣返: 西雅大洋是海族所在的大洋。李察把革瑞恩与它两大戒灵遣返此处兴风作浪，伺机摧毁慕兰运兵舰队

  能力体系:
    神族血脉: 据传拥有神族血脉，不砍下它中间的脑袋就永远杀不死
    风暴九头蛇: 能召唤海啸
    风系魔法: 仅剩三首时靠风系魔法升空猛攻
    分裂体: 蛇首和脖子如壁虎尾巴，遭重击完整脱落以减轻连带伤害；脱落的断首能长成分裂体，只要分裂体还在，灵魂就依然存在
    九连环闪击: 连环闪击天赋只有自然界的魔兽才能拥有，迅猛龙是三连环，深渊领主是五连环。它的风暴蛇珠可形成水系魔法加成的混合溅射，也就是水玲珑九连环
    许德拉九曲珠: 它下颌的珠子能加持九连环闪击，是茉儿法杖上的核心
    亡灵魔法: 成为幽魂之后，它能用爆骨萤磷燃烧骨质中的磷质彻底摧毁生命，歹毒无比
    冰冻气团: 亡灵九头蛇能喷吐带冰冻与死亡气息的气团。元素攻击对影子武士这类怪东西最有效果，物理攻击则会被自动过滤
    魔宠: 无

  随身物品:
    九头蛇珠: 下颌取出的海蓝色菱形魔晶与蛇珠。携佩者能加持九连环闪击，还带水系魔法加成的混合溅射，即水玲珑九连环
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 461) { _%>
    许德拉九曲珠: 嵌在茉儿的许德拉蛇珠水晶项链上，是她的法杖；后来被李察转赠给新任法师团团长贝克汉姆
<%_ } else { _%>
    许德拉九曲珠: 从它下颌取出的九曲珠，嵌在茉儿的许德拉蛇珠水晶项链上，是她的法杖
<%_ } _%>
    许德拉蛇珠水晶项链: 茉儿的水晶项链，以它的蛇珠作核心
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 300) { _%>
    斐雯丽蟒珠: 能保存尸体万年如新的蟒珠，被塞进艾薇尔口中，后来送与幽灵九头蛇换半小时阳光下的现身
<%_ } else { _%>
    斐雯丽蟒珠: 能保存尸体万年如新的蟒珠，取自斐雯丽毒蟒，被李察塞进艾薇尔口中
<%_ } _%>
    黑昙光环: 李察三枚戒指泅出的战歌光环，可召出幽魂许德拉骑着潮汐领主革瑞恩
    老房子腰带: 斯蒂法诺大师临时借用的无名腰带，镶着它的九曲珠

