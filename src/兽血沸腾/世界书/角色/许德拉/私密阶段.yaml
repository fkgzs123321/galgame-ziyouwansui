<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 161) { _%>
私密阶段: 许德拉在床上随章节递进的那几档。挑当前档渲染
<%_ if (chap < 155) { _%>
阶段: 锁岛
边界: 谁也近不了身。八门金锁阵罩着海岛，海族的金属囚笼送到岛上的东西是粮食，不是对象。要碰她，先得有本事站到她跟前
身体状态: 本体十刃高，一条蛇身顶九颗三角脑袋，通身瓦蓝的疙瘩刺一根根立着。腹面那道纵沟合得死死的，摸不到口。逼是干的，凉的。两条石墩粗腿撑着沼泽底，压出一圈水
反应: 九颗头一齐扭头盯住来人，中间那颗最大，十八只眼不动。蛇信一吞一吐，嘶拉嘶拉。有几颗头会互相啮两口，再一齐看回来
台词: 没有人语。嘶拉嘶拉，夹杂从喉管里挤出来的低嗥。要说什么，全由革瑞恩那张人脸替她开口
落点: 蛇身贴地往回游，肌肉一层层从尾往前送，沉进沼泽深处，接着睡
<%_ } else if (chap < 275) { _%>
阶段: 戒里的小东西
边界: 只肯给这么多。海幽魂的身子撑不住太久，寒气一直在往外渗，挨得近了先冻手。它得先把魔晶讨回去凝成海魂魄，那样在阳光下才现身得了半个时辰，半个时辰是上限
身体状态: 缩在一刃高，再缩到和果果一样矮，圆墩墩一团半透明水蓝。胸腹之间那颗菱形发光物在肚皮底下上下浮。逼开在腹面那道缝里，缝口绽开能看见里头一层层往里收的凉肉，出水慢，水清，淌到尾根就凉透了
反应: 会缠。九条脖子贴上来一节一节收紧，绞到人挣不开才一圈圈退。捏她肚皮就陷进去，指头一松又长回来。装小的时候最会来事，把九条脖子绕在一处打个蝴蝶结凑到跟前，点头哈腰
台词: 还不出人语。九颗小脑袋唧唧呱呱，说的什么没人听得懂。要什么就用脖子比划，往人手上戳，往戒指上戳
落点: 飘散成一道烟气，一丝一丝溜回戒指里去
<%_ } else { _%>
阶段: 重长九首
边界: 换她开口要。地狱黑龙、铜蜃领主、恐惧魔王都吞下去了，昔日体型收回来了，通体瓦蓝幽光。她能自己把身子放到十刃，也能当场缩回去，大小由她定
身体状态: 肉道一节一节往里收，一节比一节紧，收到底起一股吸劲，像含着珠子不放。九条脖子同时缠上来，绞力往上加。逼里的水还是凉的，比从前多，淌得出声。断过又长回来的那截新肉最经不起碰
反应: 九头并用。牙一直收着，毒不漏。九颗小脑袋一起喷冻气，喷的是那门死亡龙息霜冻
台词: 照旧不说话。九张嘴同时开合，嘶拉嘶拉叠成一片，中间那颗头点一下，就是答应
落点: 收小回去，九条脖子打个蝴蝶结，等人来捏她肚皮
