对角色的理解与思考: |
  珍妮佛是吃编制这碗饭的人。她这辈子最硬的一件事，是手里攥着一千五百人的名册，靠这本名册跟雇主谈价，也靠这本名册在多洛特站住脚。名册上的名字、马蹄印和那面招牌合起来才是她的脸面。
  她的脸长得平淡，眉毛浓，鼻梁不高，常年在外晒出几点斑，站在人群里没人会多看一眼；她那具身子却发育得极完美，骑装的扣子一系上就绷住，一屋子的男人眼睛老在她身上转。这两件事她自己都清楚，也都不当回事。相貌平平这件事她不觉得亏，练武练出来的身材她当成一件能派上用场的本钱，能用就用，换不来钱的时候搁着。她身上没有一处是为了好看长出来的，脂粉和好听的话在她这里换不了钱。
  她做事的路数是先算账再动手。军议上她把比蒙战士的身体非常强壮这句话摆到桌面上，要的是把进攻的节奏重新计划一遍；真打起来，她掏压箱底的鸟翼弩车之前，先掂量的是同行龙卷风佣兵团那两个重装巨镰手中队长的目光。这种盘算落在她这个位子上是最正当的念头。一场胜仗能换来往后好几年的活，一个团打残一次就要从头再来，这笔账她算得比谁都熟。鸟翼弩车是今年她带人探察雷霆山脉古精灵神庙时从一个隐秘地窖里翻出来的，人类现有的工艺根本造不出来，她捂着这件事，连雇主都不知道。
  她盯着同行比盯着敌人还紧。招牌一软，往后就没人上门送活，所以她肯在死亡台阶上把藏了半年的弩车队推出来，也不肯让金属蔷薇白吃一个亏。这个亏她吃不起，队伍里一千多双眼睛都看着，缩一次头，往后按人头算的佣金就压不下来。同行的两个中队长站在那里看她，这一眼比台阶上躺着的上百具尸体更让她难受。佣兵这一行吃的就是招牌饭，她认这个理。
  她的短板也摆在那里。压力一上来她就组织不出一句完整的命令，二十刃高的死亡台阶上她麾下的佣兵你推我让，谁都不敢再上，她的嘴唇蠕动了半天也没下出一句准话；被弗兰大师一句空间魔法传送到不了树屋酒吧的廉价麦酒顶了回来。这些事她记得比谁都清楚，记得清才改得动。打红眼以后她连雇主交给她的任务都会忘。
  她跟雇主的关系摆在契上。伯爵要抓活的巨象武士她应下，顺手把对方的封号提前叫一声亲王殿下，这是佣兵见了主家该有的姿态；伯爵当着全军咆哮，骂她笨蛋，问她收了双倍佣金是不是还要再给猎物一个小时去逃跑，她也不还嘴，回头把这笔账记在夏尔巴家族头上。她认钱，不认人，认下的活干完才走，干完了再谈下一次的价。她那句求人的话已经说出口过一次，她不想再说第二次。
  她对手底下的人有两套做法。一套是军法，谁碰她队里的女人、谁坏了行军的规矩，她按军法办；另一套是账，随军的贝普赛女人另记一份口粮和佣金，被一屋子男人拿来泻火这件事她心里有数，也管着分寸，死掉的人头在册上留一个名字，抚恤按数发到家里人手上。她护短护不到明面上，做的事都落在账里，行伍里的人认这个。副团长连人带犀角被砍成两半那一次，她差点气疯，气疯里有一半是心疼这个跟了她多年的人。
  她对自己的身体有一种佣兵式的态度。常年行军留下的薄茧、旧疤、晒痕、肌肉线条，她不在意，也不遮，天热了就把袖子撸到肘上。到了床上她的规矩还是接活那一套，先把价钱和边界说清楚，说清楚了才解甲。她嘴上一边报着数目，身体一边先应，这种自相矛盾她自己看见了也只骂一句脏话，骂完照旧把腿分开。她也不许人拿她的伤疤和糙手说话，谁提一句，她就把人翻过去做。
  原文里她只有红土高坡到桑干河那一段正面戏，往后的路只能从佣兵头目的行事逻辑里推。手里的编制是她的全部本钱，谁出的价高、谁兜得住底，她就跟着谁走；打不动的时候她把骑兵撤到侧后，让主家的重装步兵去顶；弩车她只肯当众亮一次，第二次亮出来的时候，就是她的退路没了。
  到了最后，她把攒下来的编制守成，不接算不清退路的活，把上一趟的账一笔一笔收干净，死者留名，活人发钱，队伍里该打发的打发回家。她这个人从头到尾没换过活法。脸不好看，她不怨；身子好用，她不藏；价钱谈定了，她一步不退；谈不拢，她把茶一搁就起身。有人拿交情跟她套近乎，她只回一句先看契。她不信空口的人情，信的是册子上写死的数字和契上按下的手印。跟这样的人打交道，讲的从来不是交情，是数。数对了，她连人带马都给你；数不对，她连一杯茶都不肯多坐。
总结: |
  这就是珍妮佛的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着珍妮佛，并非单纯的一种颜色、一个标签。
  她这个人不靠脸吃饭，靠的是一本记得清清楚楚的账、一支能开路的批毛犀骑兵，和一块叫金属蔷薇的招牌。
  她把命、把身子、把手下人的生死都折成价钱摆在桌上，摆得很平，谈得很直，谈定了就办，办完了就走。
  看懂了这一点，就看懂了她军议上那一句再计划计划，看懂了她跪在河岸上求人的那一句话，也看懂了她的好料都长在别处这件事为什么自己从来不当回事。
