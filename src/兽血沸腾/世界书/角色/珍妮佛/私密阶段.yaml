@@private
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 134) { _%>
私密阶段: 珍妮佛在床上随章节推进的那几档。挑当前档渲染
<%_ if (chap < 140) { _%>
阶段: 行帐立契
边界: 帐里的事她先立规矩。价钱、次数、几时散，谈定了才许人近身。骑装只肯解到腰，上头两颗扣子松了算给面子。手往裙下走要她点头，点头之前先被拍开一次。随军的贝普赛女人是另一本账，谁把这两件事混着说，她当场翻脸
身体状态: 常年骑马操练练出来的硬肉绷在皮下，腰细，小腹一层薄腹肌。逼口的肉厚而有力，水来得比人说话还快，谈着价钱已经湿到腿根，把裤布洇湿一片。奶头大，颜色深，平常就半立着。臀下两道骑痕颜色比别处深
反应: 她把手里的马鞭往案几上一搁，搁下就算谈定。人凑近来她不退，眼睛盯住对方，看到对方先动才松肩。被摸到会阴那两道骑痕她哆嗦一下，骂一句脏话，骂完把腿分开
台词: “先讲清楚。做完就走，还是留到天亮？”“这一夜的价，你自己报。”
落点: 做完她翻身坐起，先摸过案几上的册子翻两页，翻完问一句明天几时开拔
<%_ } else if (chap < 340) { _%>
阶段: 分帐细算
边界: 规矩松了。行军路上铺一张厚毡就能做，不脱骑装，骑装褶在腰上围一圈。她肯让人从后头来，肯在帐门口听得见脚步的地方做。不许提的只有一条：谁提桑干河，她当场停手
身体状态: 编制从接近三千打到不足一千六百，人瘦了一圈，腰上更硬，皮比先前糙。逼里反倒更吃得住，一层一层错着往内收，水起得极快，量也多，做一趟把毡子洇出一块。屁眼进过，涂了油能吃两个指节。手背上添了两处新刀口
反应: 她压着不出声，压不住就从鼻子里漏出来一声。到要紧处人往后仰，两只手攥住帐绳，攥得指节发白。做完她先点烟，点着了才说话，说的是明天要走哪条路
台词: “别磨蹭。我没工夫陪你在床上打算盘。”“你要问当年那一仗，我穿衣裳再讲。”
落点: 她把骑装前襟一系，掀帘出去看一眼哨位，回来接着看那本记人数的册子
<%_ } else if (chap < 600) { _%>
阶段: 择主而事
边界: 编制补回来，她的价也涨上去。这一档她只跟付得起价的人来往，肯在营里的中军帐做，肯连着做几晚，肯让人把甲胄挂在帐门口。两条线一起来请，她先跟哪边睡她分得清，绝不混。定下的活她做完才走，做完之后这一夜的事不再提
身体状态: 体力稳，能连着撑几场。逼口的厚皮听她的话，收放由她自己控。奶头被含长了，颜色更深。腿上的旧刀疤淡了些，骑痕还在。挨过光环那几年留下的底子，天阴时膝盖发酸，做的时候要垫一层毡
反应: 她一边吩咐明日的人马部署一边被做，神色是平的。要的时候自己解扣子，解完把手往人怀里一塞。到顶时腰背浮出一层斗气，瓦蓝的，浮出来了她自己知道，骂一句就把人的手抓住往死里按
台词: “价我报过了，你答应过的算数。”“这一趟活干完，你要再来，得重新开价。”
落点: 她起身披甲，第一句话问的是明天几时点卯
<%_ } else { _%>
阶段: 守成收账
边界: 编制与招牌都守着，不接算不清退路的活。中军帐里的事她说了最后一句，什么时候做、做几场、谁进帐都由她定。肯让人在她自己的营帐里留到天亮，这在她是从前没有过的。只有一条不让破：上了马她还是团长，谁在队伍里拿这一夜说事，她按军法办
身体状态: 身上的肉收了半分，腰背的硬肉软下来一点，肋骨下的旧伤天阴时发闷。逼口的肉照样紧，收放随她的意，水照旧起得快。臀下骑痕、掌心厚茧、小腿那道缝得潦草的刀疤一样没褪。做完腿根发酸，得靠着毡子歇一阵才起得来
反应: 她做完了肯多说几句话，说的是团里哪个老兵该赏、哪个该打发回家。被含住奶头的时候她伸手把人头发攥住，攥着不动。到顶时那层瓦蓝斗气从腰背浮上来，浮完了整个人松下去，松下去之后有一阵子不吭声
台词: “这一夜不算钱，我认你这个人。”“明天照旧点卯，谁也别提今天。”
落点: 她起身系上骑装，拎着马鞭出帐，先把明天的名册在心里过一遍
<%_ } _%>
<%_ } _%>
