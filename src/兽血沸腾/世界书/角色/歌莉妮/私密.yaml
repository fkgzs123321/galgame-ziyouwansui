私密档案: 歌莉妮的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 歌莉妮
种族形体: 斯迈族天鹅女，与大姐歌坦妮同胎同卵，母亲米兰妮一胎生下三黄蛋。背上长着一对洁白羽翅，翼骨从肩胛底下生根，与脊椎连成一体，展开宽过一个成年男子。斯迈族被战神收走飞行能力，翅长在身上却飞不起来。族中示爱是拔翅膀上的翎毛，一位一生只拔一根
未褪的朱颜血: 手臂上一点天生的丹红砂痣，天鹅女子的贞洁标记，一生只嫁一人，破了就褪。这一颗到磁城之后还长在胳膊上，颜色鲜亮。她自己把这颗看得比命还紧，为着保住它，逼谁都不给进

外观:
  身量: 与歌坦妮一样高挑纤细，穿祭祀袍比穿甲更显单薄。她不做骑士的操练，通身是养出来的，肩背软。皮滑得过分，指头滑过去像扑了一层痱子粉
  奶子: 一对娇挺的奶子，形状与歌坦妮一个模子，份量却更软。裹在丝质华袍里，托在手里会淌一点。皮薄，白到透青，搓狠了留红印
  奶头: 小，淡粉，平常缩在乳晕里是平的。特别怕碰，指腹擦一下就叫出声，捻两下就立起来，被含住吸的时候她两只手去抓人的头发往回拽
  乳晕: 小，色浅，边上没有界线，往外一圈一圈淡下去。上面一层很细的颗粒，舌尖扫过去她整个人缩起来
  逼: 稀疏的软毛，颜色比发浅。没被鸡巴捅进去过，窄得只容得下一根手指。水来得急，一沾就顺着大腿根往下淌，量一大她自己先晕过去
  阴唇: 大阴唇薄，小阴唇更薄，两片合得严，只留一道细缝，把处子逼口盖住，颜色淡，比那头白金色的长发更浅，皮薄，白里透一点青，外沿没有硬线，往外一圈一圈淡下去。平时是干的，摸上去细滑，掰开要用一点力，掰开了才看得见上端褶子里缩着的那颗阴蒂。水来得急，一沾就先把缝口洇湿，两片跟着往外翻，翻开了里头的肉色比外沿深一号，一松手立刻合回去
  阴蒂: 藏在两片阴唇上端的褶子里，要拨开才露出来。指腹沾水揉上去，她整条腰往上弹一下，再揉就抓人手腕
  屁眼: 颜色浅，褶皱细，一圈一圈收得紧。这一处被开过，只有一回，是被人从背后翻过去的那一次。开得不透，还紧，已经认得人，指头抵上去不再死缩，比逼先湿
  腰腹: 腰细，一只手掌圈得住，人称小蛮腰。腰上怕痒，被挠一下就笑着拧开那只手。小腹平，肚脐浅
  臀部: 小而翘，靠腰托起来。不骑马，臀肉比歌坦妮的松，一巴掌拍上去晃两下才停
  腿: 两条修长匀称的腿，从腿根到脚踝一条顺下去的曲线，皮是滑若凝脂的滑。她身上最得意的一处
  足: 脚窄，脚背高，脚趾齐。穿麂皮靴，脱了以后脚上一层薄汗。脚心被舔到会笑得踢人
  手: 指节细长，指甲修得圆，手背白得见青。会捶腿捏肩，也做细活。它同时惯于拧和掐，掐到人叫疼才松开
  口舌: 嘴唇薄，唇色娇艳，笑起来先撅一下。亲人亲得响，一记吧唧，落在脸上湿一小块。舌头是丁香粉舌，可这张嘴不肯含鸡巴
  腋下: 干净，没有毛，皮薄。抬胳膊的时候被碰到就夹紧，夹紧了还会笑着骂一句
  发肤: 白金色的长发，长度过腰，平日里用一枚玳瑁发卡挽在脑后。她馋染发，要一磅千叶茑萝花。皮肤白得过分，通身滑，贴身是一股处子幽香
  羽翅: 一对洁白的羽翅，展开宽过一人，外面一圈长翎，里头全是绒。翼根长在肩胛底下，肉厚，常年带着风，这一处比歌坦妮的活，手指扣上去是两扇翅自己往外拍。羞到极点时她把两扇翅从头顶罩下来，整个人埋进去
  标志: 嘴角那颗与歌坦妮同一位置的美人痣、胳膊上未褪的朱颜血、手腕上那对金属护腕

气味:
  体味: 处子的幽香，贴着身子才闻得到。她与歌坦妮是一路香，只是更甜更腻
  逼味: 干净。未被开过的逼凑近了只有一点温热的皮肉气，不腥不酸
  动情味: 起得比歌坦妮快。水一多，腿上那股味道跟着变沉发甜。味一浓她就先脸红再发晕
  汗: 汗量不大。她不披甲只穿丝袍，行军走出汗来是清的，不发馊
  经水: 同族姊妹一个路数，量少，色淡，气味轻

分泌物:
  爱液: 来得极快。被揉几下大腿间就急速分泌，色清，能拉丝，一抹就是一片。量比一般人多，一上来她先撑不住，昏过去是常事
  初夜: 到磁城之后还没到这一步，朱颜血仍然长在胳膊上
  奶水: 未生育时没有。怀孕后期到哺乳期才有，量足
  眼泪: 来得极快，一串接一串往下滚。气急了哭，羞极了哭，被当众亲一口胸口能蹲在地上哭半天

敏感带:
  耳后与耳鬓: 凑到耳朵边说几句话，她半边身子就软，脸埋起来不肯抬
  腰与小蛮腰: 一挠就笑，笑完拧开那只手。被手掌从后头箍住腰就使不上劲
  翼根: 常年飞的一处，手指从翅根底下扣进去，两扇翅自己往外一拍，拍开的空档里她才塌下去
  奶头: 怕，非常怕。指腹擦一下就出声，含住吸的时候拽人头发。被当众亲到胸口会蹲在地上哭
  阴蒂: 拨开褶子碰一下，腰往上弹。再碰抓手腕。第三下多半已经没声了
  屁眼: 唯一进得去的地方。抵上去不死缩，揉一刻自己塌腰，摸它的时候逼里的水一起下来
  会阴与腿根: 手指从屁眼往下顺到逼口，两条腿并紧又慢慢松开，松开时水已经淌到席子上
  脚心与手心: 舔到脚心笑得踢人，含住脚趾她往回抽。会捶腿捏肩的一双手，指节被含住会攥紧，力气不小

名器:
  名目: 银涡随形
  由来: 斯迈族的战歌是气脉上的功夫，她魔歌双修，肺腑一口气练得比同辈深。加上魔宠水银巨蜗是液态金属系，能自由拟形，那种随外物成形的知觉长进了她的肉里
  表现: 鸡巴插进去以后逼肉不靠硬挤，像水银一样顺着形状贴上去，逐寸随形而变。她一张嘴唱，逼里的收放就跟着歌声走，拖到高音收得最紧，落回低音松半圈
  代价: 这门劲道吃她的歌力。用狠了第二天嗓子是哑的，禁空之歌唱不出来
  名声: 西南神庙那边传，二小姐这一身合起来像银，动起来像水。耶鲁绿洲那六位驼鸟中队长光看她走路的姿势就把事情看了个七八分

性癖:
  走后面: 逼不给人进，朱颜血要留着。翻身趴过去，屁眼那条路她肯走，也只认这一条，射在肠子里她也由着。她自己开的头，从此认下
  唱歌: 做的时候要唱。唱到高音逼收得最紧，被人顶到破音她自己听得见
  掐与拧: 手不闲。掐胳膊、拧腰、揪鼻子，掐到人叫疼才松手
  讨价还价: 动手之前先谈条件，拿嗲声换东西，要千叶茑萝花、要染发的草汁
  偷: 人前冷着脸不搭理，人后自己摸到房里来。她怕被人看见，越怕水越多
  翅膀罩头: 到了关头上把两扇羽翅从头顶罩下来，整个人埋进去。露在外面的只剩腰以下
