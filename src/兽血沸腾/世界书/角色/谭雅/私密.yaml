私密档案: 谭雅（起初叫珊瑚美人）的身子底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 谭雅
种族形体: 水晶人。史前瘟疫把这一族石化，僵固的躯壳换来无尽寿命。她从地底直布罗陀河河底的圣井里被当成一尊珊瑚像传上地表。象牙色的胶体在皮肤底下层层叠着，握在手里比真丝还光滑，有温度也有弹性，偏偏搭不出脉搏，长期浸在水里就能维持。刀尖在胳膊上拉一道口子，能看见深处红色的组织，却不见一滴血；愈合祷言撒上去，口子当场收口、弥合、脱疤
石化壳: 瘟疫留下的僵固没褪净。原本交合在胸口的双手，两个多月才挪到小腹上方。手指要曲一下得等很久，关节处比别处硬，有一圈发涩的壳感，壳底下的胶体是软的。动情到极处这层壳会松一次

外观:
  身量: 身材高挑惹火，线条圆润流畅，腰肢纤细到盈可一握。通身没有硬骨茬，抱起来比看着沉。姿态慢，一步要落很久
  奶子: 形状圆挺，份量沉，象牙白，皮薄到能透出指头按下去的影。按上去先陷半指，松开慢慢弹回来，回弹比血肉慢半拍。捏重了只留一小片压平的白痕
  奶头: 小，淡珊瑚色，朝前上方翘，平时缩在乳晕里。动情时硬成一整颗弹手的小粒，颜色往深玫红走。含住吸的时候她的眼波会变，人还是不动
  乳晕: 小，色淡，边线糊。面上有一圈极细的粒，一沾水就鼓起来
  逼: 黑毛，稀而软，毛色跟头发一路黑，这是全身唯一没被象牙色盖住的一处。里头紧得像从没被撑开过的胶质，温度比体表高一层，含进去是热的、绵的、滑的。肏的过程里逼肉不猛夹猛缩，是一圈一圈慢慢往里收，收到最里才生出吸力。整具身子浸进水里，这圈收束会自己动起来
  阴唇: 两片阴唇薄，贴合。大阴唇与小阴唇都是一层薄胶，分不出层次，象牙色，边上透出皮底下的黑，跟那一片黑毛连成一路。掰开有一点黏的阻力，胶体面上发涩，碾过去连着底下一起动，半天不回弹。动情时那层石化壳先擦得松一下，两片慢慢往外翻，缝口渗出黏液，拉得出长丝
  阴蒂: 藏在两片上端的褶子里，拨开才看得见。碰一下石化壳先紧一次，再碰眼白里的鹅黄血丝就重一层
  屁眼: 颜色浅，褶皱细密，一圈一圈收得紧，平时干爽，没有气味。手指抵上去，收得慢，松开也慢。推进去里头也是胶质，热、滑、绵软
  腰腹: 腰细，一把能圈住。小腹平，肚脐眼浅，往里凹。怀上以后这一处鼓出一团柔美的弧圆，她的两只手慢慢挪到那团弧圆上方摆着
  臀部: 小而圆，翘度靠腰托起来。整片臀肉是胶质的，拍上去不弹手，先陷下去再慢慢回。掰开臀缝里也是象牙色的胶体，不夹汗
  腿: 腿长，大腿根肉嫩，内侧的胶体比别处更软，掐一把要过一阵才回平。定型前走路一天挪不了多远，定型后站定了绷成一条线
  足: 脚小，脚背高，脚踝窄。脚趾能曲伸，只是慢。脚心一被舔到会往回缩，缩到一半就停在半路任人弄
  手: 修长的手指同样能够曲伸，指节上没有皱，像一段磨圆了的象牙。指腹按下去留个浅坑，能弹回来。这双手写过一整个文明的东西
  口舌: 嘴唇薄，唇色淡，不抿就有一层象牙色的光。舌头软，能往外推也能往里收，只是慢。她出不了声，要说的话都从精神力里走
  腋下: 干净，没有毛。皮薄，被舔到会缩肩，缩肩这一下比身上别处都快
  发肤: 一头黑长发，天然形成的线条勾勒得清晰，连发梢的层次都一眼看得见。皮肤比真丝还光滑，通身象牙色，光打上去泛一层绸缎的滑光。刀口能愈合，白痕能褪，褪不掉的只有那层石化壳
  珊瑚胶体: 整具身子是异种胶体珊瑚凝出来的，皮下的胶体一层压着一层，指头碾过去会连着底下一起动。浸在水里时整片胶体轻微地蠕动，从里往外，一处接一处。水一动她就软。动情时胶体的孔隙里往外渗黏液，量不大，能拉出长丝
  定型痕: 火焰塑形指留下的焊痕。表面看不出来，摸到肩胛与后腰能摸出一层极细的、比别处硬一点的纹，像石头被火烤过又冷下来
  标志: 象牙色的胶体肌肤、黑色长发与同色的毛、眼白里的鹅黄血丝、搭不出的脉搏、划开不流血的口子、肩胛那片被火烤过的细纹

气味:
  体味: 通身的气味很淡，凑到皮上闻是一股清水泡过的石头气，凉，干净，没有体温烘出来的腥
  逼味: 干净，凑近了只有一点象牙色的胶体气，带一丝水腥，不酸不臭
  动情味: 胶体孔隙里渗出的黏液带出一股甜，甜里压着水底的凉气，隔一层纱也闻得到
  汗: 不出汗。日头下晒一整天也不见汗珠，只起一层水汽
  经水: 这一族经水淡且少，色浅。怀孪生男婴那一段断了，生完也没按时回来

分泌物:
  爱液: 来得慢，要先沾水才起。色清，微甜，拉丝长，黏度比血肉女子高。它从整片胶体的孔隙里一层一层渗出来，逼口只是最后汇出去的那道缝
  初夜: 落红有，是干净的一小条，颜色极鲜艳，混着牛乳一样的白浊和一层腥膻气味。她自身不流血，只这一回，那一夜是谁，没人说得清
  奶水: 生下孪生男婴以后下来的，白，稠，带一点甜。喂奶时不让人看
  眼泪: 不掉眼泪。她无血无泪，难过到极处也只是眼白里的鹅黄丝更重

敏感带:
  珊瑚胶体: 全身最不经碰的一处。指腹顺着皮擦过去，擦过的地方整片胶体往里缩
  逼里那圈收束: 舌尖绕着舔的时候，收到最里的吸力自己起来，一下一下地拽
  阴蒂: 碰一下石化壳先紧一次，再碰，眼白里的黄丝就重一层
  奶头: 捻、含、吸都吃。吸住的时候她不出声，精神力会递过来一句
  耳后与耳鬓: 黑发被撩起来，耳后露在空气里，她会把肩缩起来。对着耳后说话，她会软
  后颈与发根: 手掌按在后颈上，整片胶体从颈子往下松
  腰侧: 手掌箍住腰侧，她挪不动，也不再试着挪
  脚踝与脚心: 脚踝被握住会往回抽，脚心被舔到会缩，缩到一半停在半路任人弄
  小腹与脐: 怀胎以后那团弧圆摸上去最软。脐眼被舌尖点住，精神力递过来一个字，停
  精神力: 最里的一处。搭上线以后情话、求饶、喊停全从这一条路上走，那句话直接落进对方脑子里

名器:
  名目: 卧绵藏潮
  由来: 寇涛人鱼进贡时就把这一条写在贡单上，说异种胶体珊瑚凝成，身体柔韧程度远超过任何智慧种族，男人与之欢好如卧绵上，浸在水中还会产生轻微的蠕动。后来那层僵固被火压进形里，绵劲没丢，反倒归了她自己使唤
  表现: 鸡巴进去以后逼肉贴着杆子一圈一圈慢慢往里收，缠的劲道像绵絮裹住一根东西，越往深处越绵，绵里带一层胶质的黏，抽出来的时候整圈跟着往外翻。她泡在水里的时候这门劲道自己动，节奏归那层胶体管
  代价: 一回下来整片胶体发干发涩，要泡一整夜的水才能回软。她无血无汗，耗掉的是水
  名声: 寇涛人鱼进贡时把她当淫具送人，说这是圣井一千年才涌一具的绝色。这话后来传成她最不爱听的一段

性癖:
  被摆弄: 石化那阵子摆什么姿势都得人替她摆。被人扳着手臂、分开腿、扭过腰来放到想要的位置，整片胶体会从里往外软，眼波跟着那只手走
  水: 泡在水里最放得开。胶体一沾水就自己蠕动，插进去的节奏由水接着走。她自己也认了，说老刘把她长期浸在水里养着这件事，她不肯出来
  被看: 眼波时时刻刻在变，站在哪个方位都像在回望。被一屋子人围观的时候，眼里那点东西就重起来
  通灵: 精神力搭上话以后，她能隔着几十里递过来一句。做的时候不出声，求的话、认的话、喊停的话全从脑子里过
  怀胎: 腹部隆起以后照样要。她自己把两只手摆在那团弧圆上方，摆了很久。生完一对孪生男婴以后抱着孩子站在二层高坡上喊话
  说话: 定型之后她的话多。床上也讲几万年前的事，讲矿石生命怎么造出植物和动物，讲哑月是台调好程序的登陆飞行器
