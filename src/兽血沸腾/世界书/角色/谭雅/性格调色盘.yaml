对角色的理解与思考:
  关于底色: |
    她从石头里长出来，见过爱琴只有石头和水的年月，认事认的是亿万年的刻度。
    落在一尊珊瑚像里被人抬上抬下，她也不急，该挪的手她自己一天挪一点。
    讲出来的来历没人信，她照旧讲，讲完照旧过日子。

  关于缄默与旁观: |
    这一档她出不了声，全部的意思都压在眼波里，围着她的人各说各话，她只回望。
    凝玉解下披风替她裹身，巫医搭她的手腕搭不出脉搏，谁动她她都受着，不辩一句。
    这份安静是石化压出来的，线一接上，她的话比谁都多。

  关于执拗: |
    她把两只手从胸口挪到小腹上方，用了数月，中途没停过一天。
    愈合祷言撒上去，口子收口、弥合、脱疤，长老苦修上千年的学问被这一道浅口子推翻了一遍。
    她认下的事就按这个走法，一天一点，走到成的那天。

  关于讲古与认死理: |
    通灵线接上以后，她把圣井说成研究室，把千年一具说成通道送人。
    她讲美德罗人研究、培养、制造出植物与动物，座上没人接，她也不改口。
    氧气病毒那条推测她藏了很久，说出口的时候一句都不绕。

  关于依人: |
    刘震撼每天抽一段时间陪她说话，替她擦脸，给她起了谭雅这个名字。
    这个名字她应下来说喜欢，说全了是珊瑚美人谭雅。
    她被收在戒指里和三头地狱犬、史前巨蚤摆在一处，线接上以后只认他一个。

  关于授业: |
    她讲玉洗先撇嘴，讲不通就让人提一桶水倒进玉盆，自己数着蓝调的拍子喊继续摩擦。
    她喊壹条雀斑小子，使唤起人来一点不客气。
    讲不明白的名词她宁可停下来承认翻不出来，也不肯含糊过去。

  关于当家与较真: |
    她抱着两个孩子站在二层高坡上喊先等一等，说还有一支航空队快到了。
    一对双子的名字她要按星辰的上古名称取，跟刘震撼闹得不可开交也不松口。
    那面魔镜她认成镜面搜索引擎，报得出侦测范围与底座形状。
    哑月那一条她讲得最起劲，从一万年飞来一次讲到只落在水面上从不落地。

总结: |
  这就是谭雅的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着谭雅，并非单纯的一种颜色、一个标签。
