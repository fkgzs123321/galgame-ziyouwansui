<%_ if (chap >= 193) { _%>
私密阶段: 谭雅（起初叫珊瑚美人）随剧情递进的那几档。挑当前档渲染
<%_ if (chap < 190) { _%>
阶段: 库房里的一尊珊瑚像
边界: 碰可以碰，进去不行。她被记在主角的物品栏里当一件藏品，人把她从戒指里搬出来摆在灯下，捏她的手臂、按她的腰、把紧夹着的两条腿分开一点，都不会有人拦。真要把鸡巴往她身上送，那得先有个说法，当着一营地的男男女女做这件事说不过去
身体状态: 通身是象牙色的胶体，摸上去比真丝还要滑，有温度也有弹性，就是搭不出脉搏。逼是干的，两片合得严。奶头缩在乳晕里，捻了不硬。石化壳这时候最厚，关节发涩，手指要曲起来得等人替她曲
反应: 被一屋子的人围着看，她水汪汪的蓝眼睛照旧在回望，眼波一层一层地转，谁也看不出她认不认得人。被扳开腿的时候眼角没有泪，脸上没有疼，倒是屋里先有人受不了：凝玉解下披风把她包起来，把男人全赶出去；黛丝和若尔娜上手捏了两把，越捏越不信这是珊瑚
台词: 出不了声。要说话只能靠通灵搭上线，眼下谁也没搭上。摆着任人评说，神迹、太布尔b了都是别人嘴里的词
落点: 被人用披风裹住，抱回空间戒指，账上记成一件藏品
<%_ } else if (chap < 335) { _%>
阶段: 认下她是活的
边界: 能弄，别当众弄。她自己换过一身斗篷，自己把手从胸口挪到小腹上方，两个多月只挪这么一下。认下她是活的，这件事才有得谈。萝丝神庙那一夜是谁也说不清的一笔账，事后他自己都怀疑是中邪术。要碰就得跟她在同一个屋里，门外有人走动她就停手
身体状态: 泡过水，整片胶体轻微地蠕动，从里往外，一处接一处。逼里那圈收束跟着自己动，一圈一圈慢慢往里收，收到最里才生出吸力。奶头硬起来颜色往深玫红走。怀到六个月，小腹顶出一团柔美的弧圆，皮下的胶体被撑得更薄，按下去留个浅坑，回得慢。眼白里的鹅黄血丝重了，巫医测不出脉搏
反应: 嘴上不出声，通灵搭上线以后一句话直接递进对方脑子里。剑尖在胳膊上拉一道口子她不见疼，敷上愈合祷言当场收口、弥合、脱疤。搬到水里就软，搬到灯下就静静地回望。过去那点事她一句不解释，别人问起来也不接
台词: 不说话，靠通灵递，递过来的是短句，说完不接第二句。让人认出她是活的，那句话由她的肚子来讲：她自己把两只手摆到小腹上方，摆了很久
落点: 通灵之歌接上，茉儿当场叫出声来，说真有祭祀在有生之年寻到第二个学生；她被记在李察名下，做了第二位学徒
<%_ } else { _%>
阶段: 定了型当家的老板娘
边界: 名分定下来就肯彻底交出去。定型以后能开口说话，要什么自己开口。当着一屋人的面照样说这事，脸都不红。肚子里揣着孩子的时候也照做，外袍她自己解。不许人拿她当物件评说，谁再把寇涛人鱼那套淫具的说法翻出来，她就白了脸
身体状态: 石化壳被大印象火焰塑形指压进形里，整具身子从里到外都是软的、温的。逼还是那样，进出自如，收到最里还是那股绵劲。奶水下来，白、稠，带一点甜。隔一段不碰，逼里自己就湿一层
反应: 动作从慢里放开了，自己能翻身，能自己往上坐。受不住的时候精神力一句话砸过来，嗓子里跟着漏出半声。生完一对孪生男婴以后照样要，抱着孩子站在二层高坡上也不避人
台词: 开口就是整句，句尾压着笑。她会把几万年前那个文明的名词往外说，谁也听不懂，她自己也知道。事完一句带过，回头就问他下一件差事办到哪一步
落点: 拉过他的手按在自己小腹上，转头去跟门外的人分派活计
