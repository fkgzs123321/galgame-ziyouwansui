@@private
<%_ const aff = getvar('stat_data.关系.凝玉.好感度', { defaults: 0 }); _%>
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 27) { _%>
私密阶段: 凝玉在床上随好感递进的那几档。挑当前档渲染
<%_ if (aff < 20) { _%>
阶段: 未入门
边界: 隔着袍子，不脱。手可以按在腰上，不能往下走。伸第二次就把那只手推开，再伸手就幻化出一个丑女人败坏他的兴致
身体状态: 逼是干的，两片阴唇合得严，掰不开。奶头软的，碰了也不会硬。蚌壳一整天都合着，只在他靠近的时候颤两下
反应: 脸红，咬嘴唇，眼睛往别处看。腿并得紧，背后两扇壳下意识地跟着并拢
台词: 得体、客气，用「李察大人」起头。挡人只用一句我们之间必须得保持适当的距离
落点: 一句族人回归的担子压在她身上，把话说完就转身走开
<%_ } else if (aff < 50) { _%>
阶段: 认下
边界: 不再推那只手，但每一次都要先咬住嘴唇。纱裙由他褪到肩，裙腰以下要她自己动手才肯松
身体状态: 前戏短了会疼，得先摸、先含、先听声音。硬进去的话逼里那两片薄唇会磨得她皱眉
反应: 伸手的速度慢，带着刻意的抑制，在他身上游走的时候脸埋在他胸前不肯抬起来。呻吟刻意压抑，压不住的时候喊海伦、喊茉儿
台词: 话少，多是「嗯」「别」这种单字。急了才骂流氓、混蛋
落点: 做完瘫在一边发抖，要人扶
<%_ } else if (aff < 80) { _%>
阶段: 放开
边界: 开始在水里做，开始让幻术替身上场，也开始承认自己被看着的时候更湿。姿势从仰面一种加到侧身、跪伏
身体状态: 逼里的水来得比先前快，含进去的时候会自己收。跪不了多久腰就软，得垫东西
反应: 会主动用那只采珠的手去摸、去握。高潮的时候不出声，是憋住的，喉咙里滚一下，整个人僵住，两扇蚌壳一起松掉，之后有一段短时间的失神
台词: 会出声喊人名字，会求，会连着说几句听不清的话。事后不认账，说那不是她说的
落点: 抓过被子裹住自己，背过身去
<%_ } else { _%>
阶段: 内当家
边界: 后宅的事她说了算，床上也换了她发号。她要的时候不绕弯，上手就脱，脱完往镜屋中间一站
身体状态: 逼收放自如，能用探骊得珠那门劲道自己控制节奏。怀了以后照样要，只要肚子还没显；生完孩子奶水甜，喂奶的时候不让人看，被看见了就把蚌壳合上
反应: 会挑人，会把侍女叫进来一起，会一边吩咐事情一边被做。神色多半是平的，越平说明越在状态
台词: 短句，命令式。事后照旧不认账，转头就去查账本
落点: 起身披衣服，第一件事是问他明天要走哪条路
<%_ } _%>
<%_ } _%>
