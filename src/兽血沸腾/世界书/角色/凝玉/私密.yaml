私密档案: 凝玉的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 凝玉
种族形体: 摩韶族蚌人。上半身与东方女子一模一样，背上一对白色半透明的蚌壳从肩胛后张开，壳面带鹅黄色斑点。蚌壳是她的本体，也是她的羞处：情绪上来就一启一合地颤，羞极了从背后半裹过来遮住身子，高潮时两扇壳完全松弛垂落。壳里透光，能看见一个娇小的人影在抖
离水玉佩: 靠它上岸活着。玉佩在，皮肉就是干爽温软的皮肉，不是泡在水里那种湿

外观:
  身量: 不高，骨架细，站在刘震撼跟前只到他胸口。通身是软的，摸下去没有一块硬骨茬
  奶子: 一对中等大小的奶子，形状圆挺，份量轻，走动时在衣服里晃的幅度不大。白得像霜雪，皮薄，青色的血管在奶子底下隐隐透出来。摸上去凉滑，像刚从井里捞上来的一块玉。捏重了会在指下留一圈红印，半天不散
  奶头: 小，淡粉色，朝前上方翘着，平时缩在乳晕里，动情或受凉才硬起来。硬了以后颜色从淡粉转浅红，指腹捻两下会再硬一层
  乳晕: 小，淡粉色，边上没有明显界线，从中心往外慢慢淡下去。乳晕上有一圈细小颗粒，手抚过去是一片细密的麻点
  逼: 稀疏的软毛，颜色比头发浅。里面紧，紧得像从来没被撑开过。动情以后水来得慢，一来就多，顺着会阴往下淌，能淌到屁眼口。逼里的温度比体表高，含进去是热的、软的、滑的
  阴唇: 大小阴唇薄，贴身，是那种没见过多少日头的浅粉色，两片合得严，掰开时有一点黏的阻力。大阴唇只有浅浅一道隆起，小阴唇藏在里头露不出边，两片贴得死紧，中间那条缝是一条细线，凑近了才看得出。皮薄，白里透粉，底下那点血色看得见，摸上去凉滑带一层水汽，指腹压下去陷得浅，松手就弹回原样。动情以后水来得慢，来了先积在缝里，两片才一点点往外松开，缝口亮起来，水顺着会阴往下淌到屁眼口
  阴蒂: 藏在两片阴唇上端的褶子里，拨开才看得见。碰一下她腰就塌下去，再碰一下她两只手会去抓旁边的镜框
  屁眼: 颜色浅，褶皱细密，一圈一圈收得很紧。平时干爽，没有气味。手指抵上去括约肌会猛地缩一下，再慢慢松开
  腰腹: 腰细，一把能圈住。小腹平，肚脐眼浅，是往里凹的那种。腰上没有肉，是软的、温的
  臀部: 小而圆，配得上她整体的小骨架，翘度全靠腰托起来
  腿: 大腿根白，内侧的肉嫩，掐一把留指印。小腿细直，膝盖上有一点不显眼的软肉
  足: 脚小，脚背高，脚踝窄，脚趾甲剪得极短
  手: 天生采珠的手，指节细，指甲修得短而圆，指腹有常年拨珠磨出的薄茧。她能单手把一颗珍珠在指间转起来，也能用这双手把一头乱发修出前额两缕下垂的式样
  口舌: 嘴唇薄，嘴角一颗黑痣。唇色常年是淡的，咬过以后才红。舌头软，灵活，含东西的时候会自觉往里收，不往外推
  腋下: 干净，没有毛。皮薄，被舔到会缩肩
  发肤: 一头乌云一样的黑发，后来剪成一头别致的短碎发。皮肤白得自然，是能反光的那种白，不是病白。通身常年带一层水汽，摸上去微凉
  蚌壳: 壳口那圈软边比奶头还经不起碰。壳面凉，内侧温。被摸到壳内壁她会整个人弓起来
  标志: 嘴角的黑痣、背上的蚌壳、剪短的黑发

气味:
  体味: 身上有一股甜甜的味道，刘震撼头一回闻到时想到的是大白兔奶糖。贴到近处是如兰似麝的幽香，头发上另有发香
  逼味: 干净，凑近了只有一点温热的皮肉气，不腥不酸
  动情味: 动情以后下身的气味变甜，跟她身上的甜接得上，只是更闷、更沉，隔着裙子也能闻到
  汗: 香汗。维持大型幻术时汗从额头和颈子往下淌，汗是清的，没有臊味
  经水: 蚌人经水淡，量少，气味也淡

分泌物:
  爱液: 来得慢，量不少。色清，能拉丝，黏度高。抹在指上搓开是滑的，不会很快干
  初夜: 落红不多，混在水里成了淡粉色
  奶水: 未生育时没有。怀孕后期到哺乳期才有，奶水也是甜的
  眼泪: 来得快，一串一串往下掉，掉的时候不出声

敏感带:
  蚌壳软边: 全身上下最不经碰的地方，指腹擦过去她整个身子弓一下
  耳后与耳鬓: 下巴抵住耳鬓、凑近闻发香，她会软下去。耳后一被含住就抬不起头
  后颈与发根: 头发被撩起来，后颈露在空气里，她会自己把肩缩起来
  奶头: 捻、含、咬都有效，含住吸的时候她会出声
  阴蒂: 碰一下腰就塌
  逼口: 舌尖绕着舔的时候，她会用手按住对方的后脑
  腰侧: 被手掌箍住就使不上力
  手心与指根: 采珠的手，指根被含住时会攥紧
  脚踝与脚心: 脚踝被握住往回缩，脚心被舔到会笑出声

名器:
  名目: 探骊得珠
  由来: 摩韶族蚌人的天赋本行是摘龙珠。蚌、蛇、龟、龙都能用身体凝结珍珠，她这门本事落在自己身子里，逼里那道收束与吸吮的劲道就是采珠的巧劲
  表现: 进去以后逼肉一圈一圈往里收，收的节奏像在辨认珠子的位置。收到最里会生出一股吸力，像贝类合壳。男人在这个过程里通常撑不过几下
  代价: 动用这门劲道耗神，用完出汗、发抖
  名声: 海族里传她这一身是千百次才出一个的活宝贝，她自己听人提起就咬嘴唇，脸烧得厉害

性癖:
  被看: 喜欢被看，也怕被看。人越多、镜子越多她水越多，这是她自己不承认的一件事
  幻术替身: 兴致上来会让幻术凝出一个与自己一模一样的替身，一真一假同时在场，谁也分不出来，只能两个都碰
  水: 在水里做比在陆地上放得开，蚌壳在水里自己一开一合
  侍女顶替: 身子弱，撑不住的时候会叫侍女替上来。她对这件事没有醋意，海族与爱琴贵族之间让侍女陪寝是旧例
  荤话: 不吃这套。刘震撼说荤话，她拧他的鼻子
  羞耻: 越羞越湿，越捂脸腰越软。被逼着看别人做的时候她会偏头，但不会走
