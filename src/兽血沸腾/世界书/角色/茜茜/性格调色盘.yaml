    她在王城当众请求神庙删掉祖先的名字，那一声里还带着胆怯。
    武士架住她的胳膊，她求一个解释的机会，声音都变了调。
    台上让她拿证据，她先傻眼，讲到不好开口的地方声音越来越小。

