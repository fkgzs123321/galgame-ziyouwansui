    她指着战神的名字起誓，说简爱战歌她已经掌握了。
    讲起祖先一条一条研究各族异能之歌的来路，她越说越激动。
    她本想把第一年青祭祀的桂冠换成一句请求，就是法典上那个名字。

  关于拗: |
