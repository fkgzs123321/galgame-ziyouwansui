对角色的理解与思考:
  关于底色: |
    亚力士海国在她的账本上是自家的产业，海族的兵、海底的盐、前线的补给线都在这本账上。
    她算账算得极细，盐耗亏空、奴隶人口、后勤负担，一笔一笔都要有人认。
    脸面是这本账的另一半：威瑟斯庞的沉戟折沙也要换算成国威，盟友面前的话一句不能软。

  关于骄横: |
    她的骄横是有底气的，海族三国合兵、风暴撕裂者上万，比蒙在她眼里是被人类赶到走投无路的丧家之犬。
    骄横里掺着私仇，家里那笔账她一直没有销，灭比蒙在她这里不只是国事。
    所以两位珊瑚顶亲王怎么劝都劝不动，她要的是把比蒙从爱琴版图上抹平。

  关于轻敌: |
    她的轻敌带着算计，人类军阵排得越整齐，她越要问来的是谁。
    地行龙骑兵这样的精锐被摆去做仪仗队，她立刻断定今天来人不是等闲人物。
    她敢当众说实力大过人类太多，也肯让幕僚把镜头再拉近一点，先看清楚再下判断。

  关于窥测: |
    窥测是她坐在这把椅子上最先学会的功课，敌人在数十里外，她只能靠水面上映出来的一角去推。
    她把军情参谋当眼睛，把海蛇情报官当耳朵，看完听完自己再下判断。
    镜头拉近一点、再近一点，她宁可折损这瓣千里壳，也要先把对面看真切。

  关于盘算: |
    盘算才是她坐稳宝座的本事，仗打到哪一步，她先算后勤部门还扛不扛得住。
    军情在她手里按轻重分开放，比蒙列装尼采武器这条情报她挑着时候往外说。
    她转述前线女公爵的汇报，说的是海上伐木团被超阶海兽强袭，底下压着的是物资撑不到底。

  关于稳阵: |
    稳阵靠的是替全军找一句站得住的说法，威瑟斯庞打了个平手也能被她说成打出了国威。
    一帐将帅犯傻的时候她不慌，先假意清咳一声把尴尬压下去，再把话慢慢铺开。
    肯承认比蒙已经不是丧家之犬，是她在阵脚快散的时候替海族把台阶搭好。

  关于掩饰: |
    掩饰是她替全军留的那层薄面，内幕消息接到手，她和贝肯鲍尔一样不敢直说。
    她挑部下们有点犯傻的空当假意清咳一声，把尴尬压回嗓子里，再拿一句国威把话头岔开。
    事后她又补一句盟友是谁暂时不方便透露，这颗定心丸发得比军令还及时。

  关于迁怒: |
    迁怒只在赶走所有下属之后发作，人前是两位海皇共商军略，人后是两个人的口水大战。
    忘忧谷得而复失、每天盐耗的亏空，这些账她一句一句往贝肯鲍尔脸上摆。
    骂完照旧坐下来谈正事，她肚皮里另有一本明帐，什么时候翻脸什么时候合作分得很清。

  关于结盟: |
    结盟是她在僵局里唯一肯做的事，谁有她要的东西她就去谈谁。
    伊夫堡这个天险隘口是她和贝肯鲍尔一起看上的，人类奴隶、赏格与惩罚条令都是她开的口。
    对魔族盟友她说望眼欲穿，说到水纹龙龟这样的条件也可以谈。

  关于娇嗲: |
    娇嗲是她放在丹犀上的招牌，见到俊美男子就发嗲，声音嗲到令人起鸡皮。
    两位银瞳武士联袂而来，她一边笑一边追问为什么不是一个人。
    笑够本以后再展开翅膀飞到空中，用一套替国争光的话把年轻人送上路。

  关于守本: |
    守本是她最后的算法，海龙与龙人战士在桑干河边窒息，她要留下能飞的塞壬。
    各支军团还能上阵的人数要一名名报上来，报完了才谈下一仗，报不上来的就不谈。
    送出去的特使、借出去的术士、许诺出去的佩饰，她也一样记在册子上等人还。

  关于观望: |
    观望是她在海底宝座上的姿态，前线的军报从珊瑚礁盘一份份递上来。
    忘忧谷战线开打，海族金银亢龙被追杀，她按住塞壬不动，等看清楚哪一边占先。
    忘忧谷前线两边都留着后手等援兵，谁也不肯先拼命，她按住塞壬，只在珊瑚宝座上等军报。

  关于押注: |
    押注是她这个位格上唯一还能做的事，收买海神仆人与湛蓝海龙，两条线各留一个价码。
    魔族盟军的到来被她算成下一仗的本钱，不花在没有胜算的僵持上。
    翅膀、登陆、援兵这三样摆上桌，她先掂量哪一样最经得起消耗。

总结: |
  这就是朝河兰的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着朝河兰，并非单纯的一种颜色、一个标签。
