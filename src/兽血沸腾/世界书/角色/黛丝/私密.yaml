私密档案: 黛丝的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 黛丝
种族形体: 仙女龙。人形与人类女子无异，靠额上一对龙角和一条龙尾认身份。通身覆一层极薄软鳞，平时收在皮肉里，动情或上阵才立起。体温比凡人高。真身是修长流线的一条龙，鳞色明黄夹赤。元素身体：刀剑箭矢能伤她，魔法与死灵术打到身上原样弹回施法者
眉心龙鳞: 眉心一片菱形嫣红龙鳞，滑润，按下去硬。这是已婚仙女龙的标志，破瓜那晚留下。她平时用斗篷压着

外观:
  身量: 高挑，肩窄腿长，站直与刘震撼齐肩，比若尔娜高半头。斗篷罩软皮甲把身段全遮住，脱下来才看得出。背直，行军练出的站姿，靠上去才软
  奶子: 丰满高耸，份量压手，走动时在皮甲里晃。皮白，血管淡青。捏下去先弹回来，再陷进指缝，掌心贴满一整只是烫的。含住吸的时候她会停下手里的活
  奶头: 小，淡粉，平时平贴。被指腹捻两下才立起来，比黄豆大一圈，颜色转深红。用牙轻轻磕，她拿膝盖顶人
  乳晕: 直径约一枚铜币，淡粉偏褐，外沿散开没有硬边，上一层细小颗粒。舔过去一片细麻
  逼: 毛少，只生在耻骨那一小片，颜色比头发浅。掰开要用力，里面比外面烫，进去头一段被鳞面刮着。动情的水起得快，一沾就滑到腿根
  阴唇: 大小阴唇薄而贴身，合得紧，浅粉色。大阴唇薄，小阴唇更薄，两片的界线分得清，边沿压着一道比肤色深一点的粉。平时干爽，皮面滑，捏起来只有薄薄一层，指腹碾过去摸不到皱褶。动情时血色先上来，两片涨成深粉，自己往外翻开，缝口滑出一层亮水
  阴蒂: 藏在两片阴唇上端的褶子里，米粒大，颜色深。舌尖顶两下跳出来，硬成一颗小豆。碰它她会抓住人的手腕，不推开也不放
  屁眼: 浅褐色一圈细褶，收得紧，平时干爽无味。手指抵上去括约肌先缩一下，再一层层松开。进去要油，进去以后她整个人绷着
  腰腹: 腰细，一把圈住，小腹平，只有一层薄肌。腰侧是死穴，从背后箍住她就使不上力。肚脐浅，往里凹
  臀部: 窄而翘，肉结实。一巴掌打上去声音脆，红印慢慢浮出来。从背后进去时两瓣自己往两边分
  腿: 修长，大腿白而直，内侧的肉细，掐一把指印留一阵。小腿一层薄肌，长年骑乘走出来的。站着做不了太久，腿会抖
  足: 脚背窄，脚踝细，脚趾长。常年塞在筒靴里，脚心一层薄茧，脱了靴子带皮革和汗味。脚心被舔会蜷起来踹人
  手: 手指纤细修长，指甲修得长而尖。握笔、指图、掐人的都是这双手。指甲插进背上的肉会留血痕。握鸡巴时手是凉的，握久了才热
  口舌: 嘴唇薄，颜色淡，咬过才红。亲上去是甜的，甜得发腻。口活生疏，牙齿磕到了也不道歉，抬眼看人
  腋下: 干净，毛少，腋窝浅。天热出汗时腋窝是湿的。被舔到会夹紧胳膊，把人的头夹住
  发肤: 皮肤白得发亮，摸上去滑，烫处多凉处少。皮下一层软鳞平时收着，动情时从背脊往下立起，一片片能摸到边。血是热的，滴下来不凝
  龙角: 额上斜飞出来的一对，指腹划过去是温的，从角根到角尖由软变硬。角根那圈皮最薄，含住角尖她会抖。成亲后角色转成白玉，摸着更滑
  龙尾: 尾椎长出来的一条，人形下不长，能盘在腰上。鳞细，内侧无鳞那一段最敏感。顺着鳞往下捋她站不稳，拽尾巴她会回头咬人
  鳞: 背脊正中一条鳞线，从后颈通到尾根，平时埋在皮肉里。动情时全部立起，一片片支着，摸过去是硬的。抓她的鳞她会叫出声
  标志: 眉心的菱形龙鳞、额上的一对龙角、尾椎的龙尾、背脊那条鳞线

气味:
  体味: 身上带一股凉香，凑到脖颈才闻得到，香里混一点铁腥。那股甜压在舌根上，尝着比闻着更甜
  逼味: 干净，腥气淡，凑近是烫的皮肉味。鳞面那层带一点水锈气
  动情味: 动情后味道变浓，腥里带咸，闷在腿根散不出去，隔着皮甲也压不住
  汗: 不臭，咸而清亮，背上和锁骨先湿。打到脱力时汗顺着背脊那条鳞线往下走
  经水: 量中等，颜色偏深，气味重。来经那几天她不肯让人近身，自己躲进军帐

分泌物:
  爱液: 来得快。腰上被按住就淌，颜色清亮，黏，能拉出丝。做一次能把腿根打湿一片
  初夜: 破瓜那晚落红不多，血里混着几片脱下来的软鳞，她自己收了起来
  奶水: 生过胎蛋以后才有，奶量足，味道偏淡
  眼泪: 不轻易掉。憋到极限才一滴一滴往下砸，掉的时候不出声，袖子一抹就没了

敏感带:
  龙角根: 指腹顺着角根那圈薄皮划一圈，她仰头闭眼，喉咙里滚一下
  眉心龙鳞: 按下去她会挡开手，挡得慢，挡完自己又凑回来
  后颈鳞线: 从后颈往下捋那条鳞线，她背脊弓起来，尾巴自己卷到身前去
  尾根与尾内侧: 尾巴内侧无鳞那段被含住，她站不住，得扶着东西
  腰侧: 手掌从背后箍住腰，她整个人使不上力，往后倒
  奶头: 捻、含、咬都有效。含住吸的时候她正说着的话断在半句
  阴蒂: 舌尖顶两下就硬成小豆，再顶她会抓人的手腕
  逼口与鳞面: 进去的头一下最要命，鳞面被撑开，她咬住自己的手背
  耳后: 贴着耳后说话，她偏头躲，躲的方向是往人怀里躲
  手心与指根: 手指被握住、被含住，她会攥拳，指甲掐进对方掌心

名器:
  名目: 龙鳞锁道
  由来: 仙女龙是巨龙里唯一在外表上接近人类的一支，逼道内壁生着一层细密软鳞。第一次交合时那层鳞连着落红一起脱下来，龙族把这件事叫走龙鳞道。内壁留下的鳞状褶皱带从此不消失，收束也比寻常人紧三分
  表现: 进去头一段是鳞面一片片刮着龟头，最里头那圈鳞带往里扣，扣住根部不放。撑过去的人少，多半在中途就交代了。抽出来时鳞带还咬着，得慢
  代价: 鳞带磨破了要养三五天，走路能觉出来，坐下也难受。挨冻或激动时鳞自己立起来，扎得自己疼
  名声: 彩虹龙城里传仙女龙开苞叫走龙鳞道，是龙族的一道成年礼。比蒙与人类那边没人知道这一层

性癖:
  斗篷: 不肯先脱斗篷。要脱也是从肩上褪到手肘，剩下那段搭在背上
  要灯: 不肯在暗里做。她说看不清就没法算账，也不肯在暗里出声
  嘴上不认: 做完不认账，说过的话一句不承认，转头就去翻图纸
  军令: 轮到她说了算的时候，她给军令式的短句，手放哪、腿抬多高、什么时候停，不给讨价还价的余地
  拒术法: 合欢术、助兴药一概不碰，魔法护具也不许带进帐。她要人凭力气
  双龙: 她与若尔娜共用一个丈夫。两人并排的时候她管节奏，谁先谁后由她定
