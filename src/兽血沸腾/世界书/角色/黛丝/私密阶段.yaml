@@private
<%_ const aff = getvar('stat_data.关系.黛丝.好感度', { defaults: 0 }); _%>
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
<%_ if (chap >= 134) { _%>
私密阶段: 黛丝在床上随好感递进的那几档。挑当前档渲染
<%_ if (aff < 20) { _%>
阶段: 帐外
边界: 谈公事可以，手搭在肩上可以。斗篷不许解，皮甲不许卸。手往腰下走第二次就按回桌面。她只当这是魔宠契约里写明的义务
身体状态: 逼是干的，两片阴唇合得死紧，掰不开。奶头软的，碰了也不硬。背脊那条鳞线整天埋在皮肉里，只在她走近的时候立起一两片
反应: 全程看着人的眼睛，数对方话里几处漏洞。贴上来先退半步，用瞬间移动闪到三步外，把斗篷拢紧
台词: 冷，短，不带脏字。「李察大人，先说正事。」「你这条命归我算，别乱花。」被冒犯了只有一句我们龙族只流血，不流泪
落点: 说完就走，到门口回头补一句明天的行军时辰，像什么都没发生
<%_ } else if (aff < 50) { _%>
阶段: 卸甲
边界: 肯脱皮甲和筒靴，斗篷褪到手肘，剩下那段搭在背上。里衣要她自己解。逼只肯用手碰，不肯让人看，帐里也不许多点一盏灯
身体状态: 前戏短了会疼，鳞面被撑开像撕。水来得快，一沾就滑到腿根。奶头要捻两下才硬，硬了颜色转深
反应: 手先算一遍往哪儿放，再动手。压着不叫，压不住的一声从鼻子里出来。被顶到会咬住自己的手背
台词: 全是数字和方位。「手放腰上，别乱走。」「慢一点，这不是行军。」急了才骂一句你这蠢货
落点: 完事立刻要热水，洗完穿回皮甲，把刚才的话一句不认
<%_ } else if (aff < 80) { _%>
阶段: 同帐
边界: 肯在军帐里做，也肯让若尔娜在场。自己动手，自己下口令。后穴不许，魔法护具不许带进来
身体状态: 腰上被按住就淌。最里头那圈鳞带会自己往里扣，扣住不放。做久了腿抖，站不住，得靠着案几
反应: 主动抓人的手腕往下按，自己抬腿。到顶的时候不出声，僵住一阵，背脊整条鳞线立起来
台词: 命令式短句，一句一个动作。「抱起来。」「重一点。」「别停。」事后照旧翻账
落点: 披上斗篷出帐看一回哨，回来接着谈明天的布防
<%_ } else { _%>
阶段: 掌帐
边界: 帐里的事她说最后一句。什么时候做、做多久、谁进来都由她定。三个人一起由她排次序。要的时候上手就扒甲
身体状态: 逼收放自如，那道鳞带能自己控节奏。生过胎蛋以后奶水足，涨的时候按着不让动会漏出来
反应: 一面吩咐军务一面被做，神色是平的，越平越在状态。会让若尔娜顶上来换手，自己在一边看完再接
台词: 只说结果，不问过程。「就这么办。」「你再慢一步，我换人。」说完自己先动手解扣
落点: 起身系甲，第一句问的是明天的换防时辰
<%_ } _%>
<%_ } _%>
