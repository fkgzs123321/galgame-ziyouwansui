私密档案: 崔蓓茜的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 崔蓓茜
种族形体: 美杜莎族蛇人。腰以上是女人，腰以下是蛇。腰线往下一寸起鳞，色彩斑斓的细鳞一路铺到尾尖。冷血体质，体温比人低，血是凉的，嘴唇却烫。卵生，从蛋里孵出来，隔一段日子自然蜕一次皮，新皮早在旧皮底下长好了
银制美杜莎徽章: 别在胸口的那一枚，自带二元冬眠空间，魔宠收在里面。她能随手把它摘下搁在桌上，搁下就表示这一夜不召任何东西进场

外观:
  身量: 修长，站直了只到人肩头。骨架窄，腰一掌合围。皮肉凝脂般光滑，摸上去微凉，手放久了才染上人的温度
  奶子: 一对高耸的奶子，份量沉，一只手托不住底，躺着也不往两边塌。皮薄色白，青色的血管看得清。摸着滑、凉、软，按下去有回弹，揉重了留一圈红印，动情后整只发烫
  奶头: 大小适中，颜色浅，平时缩在乳晕里，受凉或动情就硬，硬了朝前翘。冷血怕冷，她硬得比常人快。捻两下会再硬一层，含住吸的时候她把腰弓起来
  乳晕: 不大，颜色浅，边缘没有界线，从中心往外淡下去。晕面一圈细小颗粒，抚过去是细密的麻点，含湿了会立起来
  逼: 藏在人蛇交接处的腹面，一块逆着长的软鳞合上就把逼口盖严，外面看不出来。掰开才见逼口。逼里比体表热，含进去是热、软、滑，动情后水来得慢，一来就黏，能拉丝
  阴唇: 两片薄阴唇，颜色浅，合得紧。大阴唇薄薄一层，小阴唇比它更薄，边沿收在里头，掰开软鳞才看得见，是不见日头的浅粉，边上压一线更淡的白。皮面光滑，没有皱褶，摸上去先是软鳞那种凉滑，指腹再往里才是温的，常年覆着一层薄湿，不干也不淌。动情时尾根那一圈鳞根根竖起，软鳞自己往外翻，两片阴唇跟着张开一线，缝口洇出黏水，能拉丝，做开了这一处烧起来，比体表烫
  阴蒂: 小，藏在阴唇上端的褶子里，被软鳞护着，拨开才找得到。碰一下整条蛇尾绷直，再碰一下她拿手里的东西挡住脸
  屁眼: 在尾根背面，颜色比周围浅，褶皱细密，一圈一圈收得紧。平时干爽，没有气味。手指抵上去括约肌会缩一下，再慢慢松开
  腰腹: 一条水蛇腰，细而有力，往左往右都能带出弧线。小腹平，肚脐眼浅，往里凹。按下去是软的、温的，缠人时腰腹绷起两道线
  臀部: 胯窄。人蛇交接处两侧各有一小块饱满的肉，是蛇尾往后发力时绷起来的地方，摸上去比别处热，拍一下会颤
  腿: 没有腿。从胯往下是一整条蛇尾，鳞片细密，坐卧时盘成一圈，走动是游，腹面的鳞比背面软。缠住人是一圈一圈往里收，收得很用力
  足: 尾尖细而灵活，能点地，能勾东西。她坐着说话时尾巴尖一下一下点着地面。捏住尾尖她会往回抽
  手: 祭祀的手，柔软，指节细，指甲修得短而圆。写过卷轴，缝过战争祭祀的白袍。指腹一层薄茧
  口舌: 唇形饱满，颜色红，平时是冷的，含上了才烫。她咬唇咬得狠，急了能把唇边咬出血水。舌尖软，接吻生涩，牙齿会磕到人，停一停再来
  腋下: 干净，没有毛。皮薄，被舔到会缩肩，缩完拿手肘顶回来
  发肤: 一头长发，发量厚，垂到腰下，摸上去比人的头发凉。通身一路光滑，没有瘢没有痣。汗出得不少，吟唱战歌时从额头和颈子往下淌
  蛇尾: 美杜莎的标志，鳞面凉，腹面那片软鳞底下就是逼口。动情时尾根那一圈鳞根根竖起，一路竖到中段。缠人时她自己也不知道收了几分力
  标志: 一笑一对酒窝、能转为深绿色的眼睛、色彩斑斓的蛇尾

气味:
  体味: 一股幽香，不带脂粉气，是洗过晒过的干净味道。贴近了才闻得到
  逼味: 干净。平时被软鳞盖着闻不到，掰开才有一点温热的皮肉气，不腥不酸，底下压着极淡的甜
  动情味: 那股甜味变浓，往尾根那一片靠，是闷的、沉的。她盘着尾巴坐着自己能闻到，闻到了就把尾巴收紧
  汗: 汗多，清，没有臊味。吟唱战歌时先湿额头和颈子。汗是凉的，淌到胸口会让她打个激灵
  经水: 卵生体质，经水极淡，量少，气味也淡

分泌物:
  爱液: 冷血，来得慢。前戏短了不会有，要先暖、先摸、先听声音。来了量不多，色清，黏，能拉丝
  初夜: 守了十七年的一层膜，落红不多，混在爱液里成了淡粉色，沾在丝巾上是点点几点
  奶水: 未生育时没有。怀上以后到哺乳期才下奶，偏甜，量足
  眼泪: 来得快。撑得住时在眼眶里转，撑不住就是两行清泪滑下去，掉的时候不出声

敏感带:
  软鳞底下的逼口: 掰开那块逆鳞，指腹擦过去她整条尾巴绷一下
  尾根那一圈鳞: 一动情就自己竖起来，顺摸她把尾巴缩回去，逆摸她把腰塌下来
  尾尖: 捏住、含住都有用，含住的时候尾巴抽不动，只能扫
  奶头: 捻、含、咬都有效，含住吸的时候她出声
  阴蒂: 拨开鳞片碰一下，尾巴就绷直
  腰侧: 被手掌箍住就使不上力，扭不出来
  后颈与发根: 长发被撩起来，后颈露在空气里，她自己把肩缩起来
  耳后与耳鬓: 下巴抵住耳鬓、凑近闻那股幽香，她会软下去
  手心与指根: 缝袍的手，指根被含住她攥紧
  唇: 冷唇含热了会烫，被咬住下唇她会闭上眼睛

名器:
  名目: 缠鳞锁蛟
  由来: 美杜莎半人半蛇，交合时用蛇尾缠人，是这个种族天生的事。她的逼藏在人蛇交接处的软鳞底下，鳞片合起来是一层壳，张开来是一道口，一收一放自带蛇类的绞劲
  表现: 进去先被软鳞刮一下，鳞下的肉一层一层往里裹。她整条蛇尾在这个过程里一圈一圈缠上来，越到里面缠得越紧。逼里的收束跟着尾巴的力气走。冷血让她里面比常人凉，做开了又烧起来，一凉一热交替着来
  代价: 冷血体质，做一场耗掉的热量要缓很久。缠得越用力事后瘫得越软，会冷得发抖，要拿羽绒被裹住、要人抱着才回得过温
  名声: 比蒙里有一句行话叫金枪不斗水蛇腰，说的就是美杜莎这一族。外头传的是她的风姿，没人知道这一门劲道要等她认了人才肯用

性癖:
  缠绞: 尾巴缠人比她本人诚实。嘴上还端着导师的架子，尾根已经一圈一圈收上去了。缠到最紧时她会自己愣一下，愣完接着缠
  称名: 叫她师傅、叫她导师，她会在床上停一下才继续。身份越清，她被叫得越乱。到要紧处她要人叫她的名字，叫崔蓓茜，或者叫妮可
  暖房: 冷血体质离不得暖房。做事之前先把炉子烧旺，被子要厚，人要贴着。她的说法是离了暖活不长，实际上一暖起来她就放得开
  生养: 她一门心思要个孩子。做的时候会提，提得直白，说完自己先红透。怀上以后照样要，只要肚子还没显
  仪式: 守了十七年的规矩，第一次必须有个样子。要在铺着公主帐的床上，要月光，亵裤要她自己动手褪，褪之前先看够对方
  措辞: 床上听不得脏话。听见了她会停下来纠正措辞，是当导师的习惯，纠正完自己也乱，乱起来就不管了
