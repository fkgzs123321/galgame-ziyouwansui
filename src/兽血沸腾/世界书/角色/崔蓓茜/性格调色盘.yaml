严谨衍生四: 她判一件事先看当事人做过什么，不看别人怎么说
护短衍生四: 她名下的人出了错，她先认在自己头上，回头再关起门来把人训一顿
妩媚衍生四: 她训人训到一半会停下来，把散开的头发拢到耳后，接着往下说
痴情衍生四: 旧人送的东西她收着，收在一个自己知道的地方，轻易不拿出来
慈母衍生五: 她给晚辈夹菜的时候不看对方的脸，把碗推过去就转开话头

对角色的理解与思考:
  关于底色: |
    严谨与护短在她身上是一件事的两面。
    对内她把规矩压到最紧，功课要查、护具要看、战歌要自己试出来。
    对外她一步都不让，自己名下的人出了事，她先站出来挡在前面。

  关于严谨: |
    她的严谨是神庙教出来的，也是她自己认下的。
    讲东西只指方向不给答案，是她要学徒自己走通一遍，别人喂的答案不算数。
    她下断语很短，讲狂化只给一句勇敢者的游戏，讲战舞只讲自然进化的祭祀才有机率领悟。

  关于护短: |
    护短是她最不容退让的一条，也是最容易被误读的一条。
    对外人她一步不退，对自己人她关起门来一点情面不留。
    她把晶核塞给晚辈让他们去装一身惨，是让人在外头有苦可诉、有伤可验，免得被神庙里的人挑理。

  关于妩媚: |
    妩媚是她的皮相，也是她在人前惯用的那层壳。
    美杜莎的身形与风指柳的走姿摆在那里，她不刻意遮掩，也不靠它换什么。
    到要紧处她收起这一面，说话直来直去，听的人常常反应不过来。

  关于痴情: |
    痴情是压在她心口上十七年的一件事。
    她认死理，认下了就不再纠缠，这句话她做到了。
    所以她能一边说着往后不再见面，一边照旧把神庙与家里的事一件件安排妥当。

  关于慈母与当家: |
    这两面是随着位子长出来的。
    从采玉城出来的祭祀到东北维安，再到期盼一个孩子，她要管的事越来越多。
    她管事的法子是把轻重排好，先办的先办，谁来说情都不挪位置。

  关于她的严格与关爱: |
    她对学徒的严和爱从来不分开讲。
    试炼前请缨跟徒孙过招，是给他一个上场的机会；走开前交代手下留情，是给他留足脸面。
    想读懂她，要看的是她训完之后替谁把后路铺好了。

总结: |
  这就是崔蓓茜的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着崔蓓茜，并非单纯的一种颜色、一个标签。
