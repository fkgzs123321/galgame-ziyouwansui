好奇衍生四: 他见到没见过的法术就走不动路，蹲下去先问原理，不问值多少钱
促狭衍生四: 他骗人的时候一脸慈祥，等对方自己张口把话说完才笑出来
坦诚衍生五: 他对人说的每一句话都是真话，真话里藏着哪几分他从不解释
好为人师衍生四: 他骂人最重的一句是鼠目寸光，骂完接着讲该怎么看这件事
断后衍生四: 他一条命能换多少时间，他算得比谁都清楚

对角色的理解与思考:
  关于底色: |
    他邋遢是一辈子的事，学识也是。这两样在他身上不冲突，他从不觉得满头银丝和肩上的油渍要分开处理。
    他把真话说到底，包括对自己不利的那部分：他当面承认利用李察，也承认自己活不了多久了。
    这份坦诚不是美德，是他这个年纪剩下的最省事的活法。

  关于好奇: |
    他的好奇心超过一切立场。人类教廷与比蒙是敌对的两方，他见了没见过的东西照样凑上去。
    他判定哑月没有上古文明遗迹，依据是他真的去算过；他验李察的血系法力，凭的是他真的想知道。
    好奇心让他越过阵营说话，也让他成了教廷里最不按立场办事的那一个。

  关于考校: |
    考校是他跟晚辈说话的方式，先问再判，判完给结论。
    他对茉儿那句一心两用是惊叹，对李察那句置疑权威是点拨，两句话他都没有多说一个字。
    他考校的对象不分敌我，谁的法术在他看来有可取之处，他就说一句。

  关于促狭: |
    促狭是他跟世界打交道的手腕，不伤人，但一定让人记住。
    那个以毒攻毒加药性反噬的局，把一屋子人涮到哭，涮完他说这是玩笑。
    他的促狭带着分寸：玩笑只开到别人还能下台的地方。

  关于护短: |
    护短是他身上唯一不讲道理的地方。
    他可以把女儿寄养出去，可以十几年不认这个女儿，但他把她的后路铺得比谁都密。
    寄养证书上要盖教皇的御玺，是他替女儿留下的最后一道保险。

  关于好为人师: |
    他把该讲的都讲了，讲完不要求对方照做。
    他劝李察别倚仗装备，自己却照样把装备送过去，两件事他都不觉得矛盾。
    他认的门道是：东西给到手上，路怎么走是别人自己的事。

  关于断后: |
    断后是他给自己挑的收场，也是他算过的账。
    帝梵西那一夜，他把生的那一条路留给教皇，教皇活着比他有用。
    火鹘山脉那一场，他要的不是赢，是把魔族一起带走。

总结: |
  这就是普斯卡什的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着普斯卡什，并非单纯的一种颜色、一个标签。
