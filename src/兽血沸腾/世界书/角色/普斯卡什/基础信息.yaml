角色档案:
  基本信息:
    姓名: 普斯卡什
    性别: 男
    年龄: 两百六十九岁
    种族: 人类
    身份: 圣奇奥魔法师，圣弗郎西斯科帝国首席宫廷法师与国王导师，教廷一系的圣阶法师
    出身: 圣保罗教廷。他在人类世界游历多年，晚年才把落脚处挪到帝梵西
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 175) { _%>
    家眷: 女儿贞德，多洛特修道院修女与候补圣女。母女两代的来历他压了十几年才说出口
<%_ } else { _%>
    家眷: 女儿贞德，多洛特修道院修女与候补圣女
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 175) { _%>
    称谓: 李察当面叫他大师，比蒙王国的权贵跟着这么叫。教廷的人称他的全衔，他自己只认前两个字
<%_ } else { _%>
    称谓: 教廷的人称他的全衔，他自己只认前两个字
<%_ } _%>

  外貌特征:
    形貌: 丢在人堆里绝对找不出来的干瘪老头，满脸皱纹，头发发白
    头发: 一头白发里夹着丝丝金发，蓬松得像钻过黄鼠狼的鸡窝
    眼睛: 昏花而浑浊，眼角常留着一堆眼屎
    胡须: 沾满油光，说话时鼻涕会流出来
    衣着: 常年披着破旧油腻的斗篷，肩部那块魔法烙印已经模糊不堪
    仪表: 一副邋遢相，只有出席典礼时才换上华服，满头银丝梳得一丝不乱
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 531) { _%>
    额上: 死后被施加灵丝密码时，额上嵌着一枚猩红耀眼的晶钻
<%_ } _%>
    随身: 怀里揣着一枚鸽蛋大小、带金色翅翼的金属球，收到传讯时发出像受绞刑的青蛙一样的鸣叫

  背景设定:
    成名: 他与血系法师坎通纳交手，坎通纳的水平本来在他之上，这一战由他打赢；此战之后他得悟天道，苦修多年跨进圣奇奥境界
    身份: 圣阶法师之间没有孰强孰弱之说，评判依据模糊，爱琴大陆另外还有一位圣奇奥范.巴斯滕
    宫廷: 他做过圣弗郎西斯科帝国的首席宫廷法师，也是国王斯蒂法诺的老师
    血统: 女儿贞德的母亲是一个栗色头发的贝普赛女人。他改造了巫师变羊咒，让本该变成绵羊的魔法作用力变成那个女人的形象
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 185) { _%>
    寄养: 他把贞德寄养给翡冷翠领主李察，交付一份紫羔皮卷轴，上面盖着教皇保罗·马尔蒂尼的御玺与他火焰形状的亲笔签名
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 185) { _%>
    占卜: 他占卜出李察本该是魔界入侵爱琴的第一杀手，也占卜出这个人会杀死自己与范.巴斯滕
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 185) { _%>
    哑月: 他判定教廷想抢的哑月没有上古文明遗迹，接着说哑月万年一临，落在桑干河上，元素潮汐会撞开时空大裂缝的禁制
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 291) { _%>
    同侪: 他与安度兰长老互相推崇，两人接连指出地底堕落精灵积累了万年、早已武装到牙齿
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 531) { _%>
    结局: 帝梵西遭三大恐惧魔王与羽翼魔骑士突袭，他率众阻击掩护教皇突围，在三位恐惧魔王、两位羽翼魔骑士与九头骨龙巫妖的围攻下还坚持飞行了上千里
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 531) { _%>
    死因: 他把魔族引到火鹘山脉，想完整召唤恒火狱海禁咒与对手一同烧尽，禁咒没有放完
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 531) { _%>
    身后: 他的遗体被巫妖王嘉宝用灵丝密码水晶剥离奥术。剥离时他额上那枚血红晶钻映出人脸，灵魂燃烧自身补进奥术之中
<%_ } _%>
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 531) { _%>
    遗物: 剥离出的两道奥术是英捷尔法勒与巫师变形咒，这两样是他的得意之作，最后落到了李察身上
<%_ } _%>

  能力体系:
    阶位: 圣奇奥魔法师，人类魔法七级体系之外的圣阶，是高阶魔法师中走到顶端的那一层
    专修: 气系、闪电系与火系三系魔法
    寿命: 高阶魔法师能延长一两百年的寿命，他活到两百六十九岁还说活不了多久了
    领域: 领域力量的释放速度越快越说明魔法使用能力高绝，他的释放速度排在巫妖王与人面巨枭之后
    禁咒: 恒火狱海。若在火鹘山脉完整召唤，数百里中心地带会形成火山集体喷发的溶浆海洋，火山灰酸雨会毁掉爱琴大陆十分之一左右的绿色生态
    理论: 他坚持等级不代表才华，圣阶法术也未必胜得过见习级低阶法术
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 424) { _%>
    低阶战例: 对上宝典阿訇马拿利，他用自创的见习级气系法术二氧护盾扣住对方口鼻，让人吸入二氧化碳中断咒语、招致元素反噬
<%_ } _%>
    独创: 二氧护盾与火合围都是他自制的法术，火合围以气障裹住一簇火苗，火苗随掌声震动涨大，用来量歌德大剧院两边观众的掌声高低
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 253) { _%>
    带教: 他当众验出李察所修的是血系法力，此后一路替这位比蒙领主解释人类魔法体系的规矩
<%_ } _%>
    魔宠: 无

