名器:
  名目: 黑域收潮
  由来: 「黑洞领域」是她的看家本领，天幕一降，范围里元素力量被通幽黑洞鲸吞虹吸。这门劲道落在她身子里是同一路：逼里不夹不绞，是往里抽
