  动情味: 原文未详。淡、闷、沉。越动情越往沉里走，隔着法师袍闻不出来
  汗: 原文未详。她出汗少。原文写海加尔那一趟之后她满脸雪白、静养一个多小时也没回来血色，那次额角和颈上是冷汗
  经水: 巫妖族是血肉之族，月事照常。原文里嘉宝的原话是「我今天……身上刚刚来了……」，刀尖上的血是紫的。经水不多，色深，气味淡

分泌物:
  爱液: 原文未详。来得慢。她是奥力先动、身子后动的人，量不多，色清，能拉丝
  初夜: 原文未详。她与玉武亲王是「良缘初订」，名分定下，原文没写这一层落定没有。巫妖的血是紫的，落红是深绛色
  奶水: 原文未详。巫妖王的王位与血脉都是世袭，子嗣记在册上。未生育时没有奶水
  眼泪: 巫妖这一族的眼泪不缺，原文写嘉宝眼泪汪汪。梦露本人在原文里没哭过一场，撑得住时不在人前掉

敏感带:
  银色长发: 全身上下最瞒不住的一处。持咒时整头银发根根立起，翅膀一样铺开。抓紧发根，她那道术就散在半路
  指尖与指根: 施术靠一双手。十指被扣住，领域下不来，慧环也圈不成。含住指根她把手往回抽，抽不动就任人握着
