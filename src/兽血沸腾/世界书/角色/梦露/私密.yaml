私密档案: 梦露的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 梦露
种族形体: 巫妖，魔界专走死灵与通幽两系奥术的一支，世袭王亲，女巫妖爱穿高跟鞋。这一族有肉有血，不是腐尸。紫血：嘉宝被刀尖逼住时沁出紫色血珠，凝得快，铁腥里压一丝甜。孱弱：原文写巫妖王的身体素质非常孱弱，以奥术立身，胳膊腿没劲。不死形态是可选仪式，梦露没走这条路，登基前后都是血肉之身。王族血脉世袭
倾心契约: 巫妖血脉独有的种族异能，与恐惧族的恐惧光环同类，不用另腾余暇去放。作用只有一个，让双方深深相爱，拔不出来。她锁过玉武亲王。锁人动用血脉和名分，身子排后面

外观:
  身量: 原文未详尺寸。原文写她是一头银丝飞舞的性感女巫妖。骨架细，站王殿众人里不显高
  奶子: 原文未详形制与大小。合这副细架子，是一对不大的，圆，挺。皮白，青色血管透出来。通身温，握久了更烫，捏重了留一圈红印
  奶头: 原文未详颜色与形状。颜色淡，平时缩在晕里，碰两下才挺起来，挺起来深一号，捻过再硬一层
  乳晕: 原文未详大小。比奶头还淡，边上没有界线，往外慢慢散。晕面一层细颗粒，抚过去是麻的
  逼: 原文未详毛量、颜色与形制。里面紧，久不用更紧，比体表热，含进去是热、软、滑。巫妖的血是紫的，破皮淌出来是深绛色
  阴唇: 大阴唇薄，小阴唇更薄，两片贴身，合得严，把逼口盖住，颜色淡，白里透一点粉，比那头银发深一档。皮薄，底下透出青色血管，边沿没有硬线，往外淡进腿根的皮色。平时是干的，摸上去温，皮面滑，只有一道贴合的缝，看不出线。掰开有一点黏的阻力，掰开了两片往两边分，缝口那一点黏丝拉着不断，一松手立刻贴回去。动情时这一处先湿，从缝口往里洇开，滑得发亮，两片贴着指头往外翻，翻开了里头的肉色比外沿深一号
  阴蒂: 原文未详大小。藏在上端那道褶子里，拨开才找得到。碰一下她腰塌下去，再碰一下她两只手去抓扶手
  屁眼: 原文未详颜色与褶皱。一圈细密，收得紧，平时干爽，没有气味。手指抵上去会缩一下，再松开
  腰腹: 原文未详尺寸。一条细腰，一掌合得住。小腹平，肚脐眼浅，往里凹。腰侧被手掌箍住就使不上力
  臀部: 原文未详形制。小而圆，配得上这副细骨架，翘度靠腰托起来。两瓣中间的缝深，从后头按住时往前塌
  腿: 原文未详长度与粗细。大腿根白，内侧的肉嫩，掐一把留指印。小腿细直，膝弯软。她走路靠高跟鞋，站久了换脚
  足: 原文未详尺码与脚型。脚瘦，脚背高，脚踝窄，趾甲修得短。女巫妖爱穿十公分开外的高跟鞋。脱了鞋脚底凉，脚心被舔到往回缩
  手: 原文写的是白皙的小手、纤纤素指。这是施术的手：指头敲过冰封王座的白骨把手，圈出过银亮色的空间震音慧环。指节细，指甲短而圆，指腹凉。十指被扣住就松下来
  口舌: 原文写她贝齿微露、贝齿微启，饮完一支血髓之后舔了舔猩红润滑的唇角。唇薄，色偏红，平时冷，含热了才烫。她话短，讲完就抿住嘴
