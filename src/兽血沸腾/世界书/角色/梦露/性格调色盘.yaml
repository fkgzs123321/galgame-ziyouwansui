对角色的理解与思考:
  关于底色: |
    巫妖王这一族算事情先算收支，她父亲教她的第一课就是这个。
    她把这套算法用在了父亲身上：父亲唱白脸压价，她在旁边记账。
    底色里那副胆子是后来练的，父亲死后她不得不把整支魔族押上桌。

  关于敏察: |
    她识人的本事在她父亲之上，这一点王殿里没有人反对。
    卡鲁那种把锋芒藏在无聊里的人，她一眼就看出不对劲。
    魔龙一族的人坐在她对面的时候，她先看的不是那位皇太子，是父亲谈价的手势。

  关于护父: |
    她替父亲接风险的时候不多说，接完就去做该做的事。
    父亲在同一条阵线上出事以后，她把这层护变成了恨，恨写进了每一份战报。

  关于招安: |
    她招安匪帮的主张与鳄王的意思一模一样，只是她把话说得更省。
    给地盘、给名分、给一个可以繁衍族群的去处，这三样摆出来，对方自己会算。
    玉武亲王是她手上最顺手的一件收获，也是后来最不听话的一个。

  关于行险: |
    红音这个化身是她最冒险的一手，往对手的营垒里放一个女法师，隔着一张桌子听消息。
    她连博浪沙火鹤的乡音都学过，只差没学到那个俺字。
    变身术被拆穿以后，她的行险改了方向，从扮人改成押命。

  关于布局: |
    她打仗像排戏，先把上千将佐叫来看一遍实况，再定谁上谁下。
    制空权是她自己定的第一目标，这个位面上空的胜负就是地面上的胜负。
    她的地图上每一个点都写着谁在守、值多少兵，写到后面那张图被翻得起了毛边。

  关于断腕: |
    她敢把有用的部队当弃子，只要这笔账算得过来。
    金亢龙与银亢龙坠地的时候，她心里那本册子上这两行已经划掉了。
    保奥术师是整场战争里她做得最果断的一件事，也是唯一没有后悔的一件事。

  关于服气: |
    她的服气只服在事实面前，能解释的她就解释，解释不了的她就记下来。
    夏宫高手在黑洞领域里照常施法这一条，她记了整整一页。
    输了这一场，她承认输，却没有承认这套算法有问题。

总结: |
  这就是梦露的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着梦露，并非单纯的一种颜色、一个标签。
