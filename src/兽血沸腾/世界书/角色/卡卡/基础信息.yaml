背景设定:
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 539) { _%>
  出身: 落日大沼泽里的德鲁伊小王国，他是王储。祖先在数千年之中带着族人逐渐向南搬迁，渐渐接近了十万大山的范围，家族后来搬迁到十万大山的杜宾人王国
<%_ } else { _%>
  出身: 落日大沼泽里的德鲁伊小王国，他是王储
<%_ } _%>
  天赋: 自小在变身魔法上就具备超常的天赋。一次无意的试验让他闯过时空大裂缝，溜到了魔界
  世仇: 精灵和德鲁伊的大决裂在大约七千多年前，神魔大战发生在一万年前。他从长辈那里继承知识的同时，也同样继承到了对魔族无法磨灭的刻骨仇恨
  魔界五十年: 他在魔界肆虐了五十几年，靠变身成独角兽在晶矿地带大吃水晶宝石来提升等级，还打劫朝贡车队，吞下了本该敬献给巫妖王的雷藏珍珠，在魔界已经是家喻户晓
  被活捉: 荷里活大陆的部队先以人命去铺，再靠三大魔王与一位六天王出手，把这个德鲁伊王子活捉了回去。嘉宝曾为这次行动慨叹，说这帮家伙最奸诈
  侠盗的规矩: 他不抢有小孩妇孺的商队，理直气壮地把这条当招牌
  二老板: 他在翡冷翠被叫二老板，也被叫杜宾出身的老二。他仗着刘震撼弟弟的名义把肥罗和奥胖唬得一个劲喊二老板，也羡慕过贝克汉姆的大堆龙晶和九曲珠
  枪咏冲锋队: 他回十万大山招扈从，拉出了一支三百人的杜宾人雇佣军。杜宾人使用金属手柄灌注彩虹系魔法凝聚成彩虹长枪，可以投掷、舞动，也能靠棒击反弹魔法攻击
  一战成名: 三百名从十万大山带出来的杜宾战士没有让二老板丢面子，也没有辱没莫科纳萨尔这个光荣姓氏，战斗方式泼辣到把每个观战的人都吓出神经病
<%_ if (getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 654) { _%>
  杜宾求援: 他带父亲去参加杜宾王国的御前会议，想劝杜宾出兵援助比蒙，最终杜宾国王回话说路途遥远，爱莫能助
<%_ } _%>
  父子同行: 里瓦尔多公爵此行既是来谢救命之恩，也要替杜宾与比蒙重新搭起友谊的桥梁。他把当年战神化身名叫雷克萨.莫科纳萨尔、是半兽人半食人魔混血儿这桩秘密当面摊开
  记忆的短板: 他对自己国家机密以外的消息守得很紧，只肯说杜宾王国远远不是圣弗郎西斯科那样的人口大国
  修为的自知: 他说自己恐怕要到范尼斯特大德鲁伊级别才能和冥界大统领那类对手硬撼，还差一级。他认定这种级别的战斗变数太大，运气、策略、天时、地利都算数
  万金油: 南十字星神域大战、翡冷翠保卫战、魔界之战他都在场，靠着变身与雷电两头兼顾
  被排除的一次: 终局之战里他两大变身都不属于擅长作战的类型，于是与同样拥有加百列魔蝶的茉儿一道被直接排除出决战阵容。他憋着一口气，总撺掇大哥动用序列器珍珠

能力体系:
  变身魔法: 独角兽、双头龙鹰、美罗拉帝企鹅、迷踪飞鹭。后两样来自雾霭之海极北与极南两座岛屿的特有生物，飞鹭一名的写法在迷途与迷踪之间摇摆
  独角兽变身: 陆上变身。独角兽最喜欢吞吃珍珠、宝石和水晶，那是提升能力的手段。他靠这一手在魔界吃了五十年水晶，晋级成最年轻的科斯塔大德鲁伊
  双头龙鹰: 他的旧变身之一，资料已经过时
  美罗拉帝企鹅: 五米高的冰系猛禽形体，可以射出大变形毒气，也对毒雾免疫。这门毒气无视魔御，看中的幸运儿会在飘飘欲仙中变得英俊无比，被它讨厌的家伙则在洗髓伐毛的痛苦中变得奇丑无比
  迷踪飞鹭: 同样是毒气系魔兽，毒气系魔法只有一个，就是致幻迷路。它的迷踪致幻光环同样无视特性，不喜欢的倒霉鬼一旦中招就会原地打转三天三夜，看顺眼的只需在原地打转一百圈就能赢得它的友谊
  雷电魔法: 吞下雷藏珍珠之后获得了毁灭性的雷电魔法能力，保罗纽曼为此拿对付圣阶法师的排场去对付他
