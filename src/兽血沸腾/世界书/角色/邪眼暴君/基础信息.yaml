角色档案:
  基本信息:
    姓名: 邪眼暴君
    性别: 不明。远古时期的一个超强智慧生物，一万年前被龙族放逐到地底世界，至今仍然活着
    种族: 精神系超阶魔兽。蓝眼高棉巨蚁与它同属远古蛮荒时代被神圣巨龙在爱琴大陆四个不同地点放逐的四大史前魔兽
    地位: 第三层地底世界婆娑大陆上摩尔的守护者。地狱黑龙是黑暗精灵的守护者，它管血精灵
    归属: 血精灵（摩尔精灵）麾下灰矮人三十万，投靠的就是它。血精灵是第二层黑域大陆的另一位统治者，人口大概十万
    出身: 深渊界诸君主中的一位。生活在无底深渊里的暴君级存在，来到主物质界后大多不愿再回去
    称谓: 血精灵与海族称它为神使一类的存在，地底的超阶魔兽则视它和地狱黑龙为外来者
    死因: 果果把霜雪冰弹喷进未完成的魔法契约，它遭魔法反噬，触须上的独眼尽数炸碎；李察以魔导士血箭射爆它的主眼，与果果一道把它砸死

  外貌特征:
    身体: 笆斗大小，像一个巨大的皮球，没有胳膊
    主眼: 皮球上面有一只硕大的眼球
    触须: 拥有六条解手，每条解手上面还有一只眼球，合起来是十二根触须、十二只独眼，可以四面八方的无死角攻击
    口器: 只有一张獠齿密布的大嘴
    死状: 反噬之后触须上的独眼尽数炸碎，被当成皮球玩

  背景设定:
    放逐: 远古时期被龙族放逐到地底，从此不能回地表。地狱黑龙与它都是受地表龙族管辖的囚犯，只靠堕落精灵进贡的食物过活，没有胆量回到地表面对仙女龙和七彩龙
    结盟: 地底超阶魔兽怯于地狱黑龙与它，被迫结成同盟。火焰君主巴斯图尔克当面点破这一层，三方围猎反被魔兽当成猎物
    现身: 摩尔亲王贝尼特斯被李察拿话堵住仓皇告辞，它以精神力在所有人心里说话，众人才知它能无声控制精神
    暗中相助: 它对李察说它一直在暗中帮助他。它真正觊觎的是李察脑中那枚圣奇奥驮都
    血系禁忌: 它当着众人道破血系魔法的禁忌：等级护盾、以血还血赎罪诅咒、每月冷热交替的剧痛，以及脑海中凝结的血魄驮都。裸佩加持或食用魔导师、圣奇奥法师的血魄驮都，任何人都能拥有一个血系魔导师或血系圣奇奥法师的魔力
    裸战: 壹条以成名绝招倒挂旗枪刺穿它的精神力护盾、刺飞三根触须；它以精神冲击夺去壹条一瞬恍惚，再用四道霓虹射线将他重创。壹条自剥鹤皮使出大红袍，把它裹成流星砸落地面，随后倒地
    挟持: 它精神控制歌坦妮，令她反手刺穿李察的手掌、斩断他的右脚肌腱。李察与果果先后被触须裹住，果果被送到獠齿巨嘴边，它逼李察签下精神烙印契约
    反噬: 它忘了李察还是一位比蒙祭祀。果果一滴老鼠屎坏了一锅粥，霜雪冰弹喷进未完成的魔法契约，反噬当场炸碎了它触须上的所有独眼
    陨落: 李察以魔导士血箭射爆它的主眼，与果果一道把它砸死。它的肉球被李察当皮球玩
    遗物: 体内掏出十二颗崔卵型珍珠，每枚含一个十字星，凝玉鉴定为螟蚣珠。用它的尸体可以召唤冥火骷髅法师，也可以炼出碧血丹青
    后续: 艾玛尔大师设想以它的天使十二音阶之珠配六翼炎魔双角，辐射出十二邪恶光环领域，制成邪恶天灾骨钟

  能力体系:
    精神控制: 主眼拥有控制其他生物精神的能力。这不是魔法能力，是精神力极为强大，就算巨龙也不能豁免，包括仙女龙在内
    控制代价: 对普通人比较简单，对精神力坚毅的如巨龙就要费点手脚。它不会贸然使用这种精神力，这一手相当费神
    心灵沟通: 以精神力与心灵沟通，从不开口说话
    霓虹射线: 十二根触须上的独眼能发射霓虹射线，附带的负面力量隐蔽而狠辣
    恐惧之力: 霓虹射线附带的精神类负面力量，如瘟疫般蔓延，令人不寒而栗
    魔法契约: 能逼对手签下精神烙印契约
    精神护盾: 身上覆着一层精神力护盾，被壹条的倒挂旗枪刺穿
    无死角: 十二只独眼可以四面八方的无死角攻击
    魔宠: 无

  随身物品:
    邪眼珍珠: 从它体内掏出的十二颗崔卵型珍珠，每枚含一个十字星
    碧血丹青: 用它的枉死悲愤炼成的元素增幅圣药，茉儿服用后实力大涨
    冥火骷髅法师: 用它的尸体召唤出的骷髅脑袋，能连续喷出十二枚青幽幽的冥火骨朵烧灼灵魂
    天使十二音阶之珠: 取自它的珠子，是邪恶天灾骨钟的核心

  关系设定:
    李察: 它觊觎的那枚圣奇奥驮都在他脑中。它逼他签契约，被他以血箭射爆主眼，尸身被当皮球玩
    果果: 一滴老鼠屎坏了一锅粥的那一滴。她把霜雪冰弹喷进未完成的契约，破了它的魔法反噬防线
    壹条: 与它两败俱伤的对手。壹条的倒挂旗枪刺穿它的精神护盾，它则用四道霓虹射线把壹条重创
    歌坦妮: 被它精神控制后反手刺穿李察手掌、斩断李察右脚肌腱的那一位
    摩尔亲王贝尼特斯: 被李察拿话堵住仓皇告辞的那位血精灵亲王，与它同属血精灵一系
    火焰君主巴斯图尔克: 当面点破地底超阶魔兽因惧怕它与地狱黑龙而结盟的那位
    地狱黑龙: 黑暗精灵的守护者，与它同是被龙族放逐到地底的囚犯
    内德维德: 以豪斯族相马术降服三足金蟾的那位，那一场它也以精神力当众显露控制力
    凝玉: 鉴定它体内珍珠为螟蚣珠的那位
    茉儿: 服用碧血丹青后实力大涨的那位
    艾玛尔大师: 设想用它遗留的天使十二音阶之珠打造邪恶天灾骨钟的炼金大师
    奥特加: 以火焰轮锯打它，是围攻时少数未脱靶的打击
