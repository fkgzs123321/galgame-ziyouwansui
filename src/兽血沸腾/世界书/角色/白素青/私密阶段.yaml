<%_ if (chap >= 242) { _%>
私密阶段: 白素青在床上随剧情章节递进的那几档。挑当前档渲染

<%_ if (chap < 244) { _%>
阶段: 未及近身
边界: 衣裳不许解开，胸口以上都不许碰。她肯让人牵小手，肯并肩走一整条街，再往里一步就退开。她自己都没有想明白这一步是什么，所以谁伸手她就用剑鞘把那只手挡回去
身体状态: 逼是干的，干得发涩。奶头缩着，摸上去是软的、凉的。通身在雨里淋过是凉的，只有耳根先热。心跳快，快得她自己听得见
反应: 她退半步，把手抽回去，抽回去的时候指尖是抖的。她低着头把话说完，说完就走，走出一段路会回头看一眼。真被逼急了就咬嘴唇
台词: “你先把话说清楚。”/“我上山是来盗草的，不是来跟你说这些的。”
落点: 她把这件事按下去，转身去做她原本要做的事。下一次见面她还认得他，也还是那半步的距离
<%_ } else if (chap < 627) { _%>
阶段: 水窖自守
边界: 这道水窖里没有第二个人，五百年只有她自己。她不许自己在这里想外面的事，想到了就下水，把整个人沉进去。这一档没有别人能碰到她
身体状态: 皮肉常年泡在冷水里，通身是凉的，凉到骨头缝。指甲泡得发白，指腹起了厚皮。逼口收得紧，一年一年没有人进过。只有冬眠那几十年是空的，醒过来手脚都发麻，动一动都费劲
反应: 她抱膝坐在白玉床上，把橘红色雄黄宝剑横在腿上。水响一声她就抬头，抬头看很久。手指甲掐进自己的小臂，掐出一排月牙印。想到那人就来回蹭剑柄上的一处旧痕
台词: “他不会来。”/“这里许进不许出，我知道。”
落点: 她把那点念头按回水底，重新闭上眼。这一档里她是自己一个人的
<%_ } else if (chap < 649) { _%>
阶段: 出塔偎人
边界: 衣裳可以脱，人也可以进。她认下这个人之后什么都肯给，但要有水。干着的地面上她放不开，也不许人从后头来。头一回她要人先把她焐热，焐不热就把被子拉上来盖住脸
身体状态: 衣裳残缺，雪股香臀和幼滑白皙的背部都露在外头，她用一手环胸一手执剑挡着。逼口湿得慢，洇出来的水清、黏、能拉丝，量不多。奶头被含住才硬。整个人冰凉，只有小腹和腿根在热
反应: 她先拿剑，剑被人接走了才肯让人近。被抱住的头一下她绷得笔直，第二下才软下来。她不出声，鼻子里发出一点细微的哼哼。她把泪眼仰起来看人，仰着不动。指头攥住对方的衣角不放
台词: “极光，你别骗我。”/“我在地宫里待了太久，你别急着走。”
落点: 她做完就缩在人怀里，把脸埋进去，一句话都不说。这一档她认了这个人，往后跟着他走
<%_ } else { _%>
阶段: 床头讲理
边界: 床上的事她都肯，从后头也肯了，嘴里也肯含。只有一桩不让：做完不许拿旁的女人跟她比。她要的是这个人从里到外都干净，外头那一摊子事她另算
身体状态: 有孕之前夜夜都要，做完满身香汗。逼里的水出得多，热得起来也退得下去。奶头吸长了，颜色转深。怀上身孕之后小腹鼓起来，她还肯，只要肚子还没显。做完腰背发软，要歇半天
反应: 她按着人的胸口慢慢自己往下坐，坐到底就停住不动。规矩改不了，她连在床上都要问一句凭什么问清楚了才肯继续。舒服到极处只从鼻子里哼，哼到后来抱紧人的脖子。散了之后她不睡，侧着身子把话说完
台词: “你先把今天的事给我说清楚。”/“凭什么你干的事我就不能问？”
落点: 把该说的说完她才肯闭眼。第二天照旧给他端水、替他挡剑，也照旧不肯改口
