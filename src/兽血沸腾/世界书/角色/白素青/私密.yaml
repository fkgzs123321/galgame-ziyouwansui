私密档案: 白素青的身体底账。外观、气味、分泌物、敏感带、名器、性癖
记录对象: 白素青
种族形体: 青玉灵蟒，风系神兽，人形是化身，本体是一条蟒。原文写壹条一眼看出她是青玉灵蟒修炼成的人形；她幻回蛇形被那位恩人撞见，恩人当场吓晕，此后一直不醒。人形修得完整，皮肉与凡人没有分别。不同处有五样：一凉，蛇是凉的，通身比常人低一截，动情才热起来；二腰腹，蛇的劲在腰上，缠与绞都从这一处出；三脱力，原文写神兽修人形的几百年里会时不时浑身脱力，那几天她连剑都拿不稳；四冬眠，她能长期冬眠，一睡几十年；五蜕皮，蛇类每隔些年换一层皮，换皮那几天通身是新的，皮薄得发红，一碰就受不了
下颌隋珠: 她下颌那一颗就是蛇珠，蛇珠又名隋珠。高阶蛇类神兽的隋珠是极品中的极品，冒险者盯着她就是为了这一颗。珠子是她的本命物，动情或受惊时那一处会发烫

外观:
  身量: 不高，人薄，站在壹条跟前只到他肩。原文写她是纤弱的身影、身材窈窕、曲线动人。通身皮肉幼滑白皙，一按就陷下去
  奶子: 原文未详罩杯。合她这一身细架子，是一对不大的，圆，挺。皮薄，底下透出一点青。通身是凉的，握久了才从里头热出来
  奶头: 原文未详形制。颜色淡，平时软的，缩在晕里摸不出形状。被含住吸两下才硬，硬了颜色转深
  乳晕: 原文未详大小。颜色比奶头还淡，边上没有界线，往外慢慢散掉。舔过去她整片缩一下
  逼: 原文未详毛量与形制。两片薄，合得严，平时是干的，掰开要用力。毛少，颜色淡。里面比体表更凉，是蛇的凉。动情来得慢，水慢慢洇出来。含进去是一层一层往里绞的紧
  阴唇: 原文未详大小阴唇的分明与颜色深浅。两片薄，贴肉，合得严，把逼口盖住，平时是干的，掰开要用一点力。颜色淡，跟通身一路，白里透着皮底下的青，皮薄，边沿散开看不出界线。温度比别处低，是指尖和脚踝那种凉，手指贴上去要焐一阵才热得起来；动情来得慢，焐热了两片才往外松开一条缝，缝口洇出一点清亮的水，量不多
  阴蒂: 藏在上端褶子里，一颗豆粒，平时缩着摸不到，动情了才鼓出来。这是她全身的开关。刘震撼给壹条指过这一处，说动情时用手指摸它，她会叫得很大声，忍都忍不住
  屁眼: 原文未详颜色与褶皱密度。一圈收得紧，平时干爽，没有气味。手指抵上去括约肌会抽一下，再慢慢松开
  腰腹: 腰细，细得惊心动魄。小腹平，脐浅，往里凹。腰侧一被手掌箍住就使不上力，整个人往那只手上倒
  臀部: 雪白，圆，翘度靠那道细腰托起来。原文写她这一处是雪股香臀。两瓣中间的缝深，被从后头按住的时候她整个人往前塌
  腿: 大腿根白，内侧的肉幼滑。小腿细直，膝弯软。她剑术精绝，腿上是有劲的，真绞起来能箍住人的腰不放
  足: 原文未详脚型与尺码。脚背不高，脚踝窄，脚趾甲剪得短。脚底泡过五百年，皮比别处厚。脚心被舔会往回缩，缩的时候把脚趾全蜷起来
  手: 一双小手，指头细长，原文写的是稚嫩小手和纤纤玉指。指尖能戳穴，在胸口一戳就把人定成木桩。指腹凉，摸到人身上会让人起一层鸡皮
  口舌: 嘴唇红，薄，遇事先咬嘴唇。舌头软，嘴里温度高。头一回含鸡巴含得艰涩，含进去先咽口水，咽不下去就往床下吐一口清水，说太腥了，好难咽
  腋下: 干净，没有毛。皮薄，被舔到会把胳膊夹紧，夹着还抖。出汗是香汗，腋下也没有臊味
  发肤: 一头黑发，长，如云，平时披着。淋了雨就贴在鬓角和颈子上。皮肤幼滑白皙，能透出底下的青。长睫毛，睫毛上挂得住水珠。通身是凉的，指尖和脚踝最凉，动情了才从里往外热到烫
  标志: 一头黑发、长睫毛、下颌那颗隋珠、常年一身白衣

气味:
  体味: 原文未详具体香型。人形修得干净，蛇类的腥气没有留在她身上。出汗是香汗，凑到颈边只闻到发香和一点冷气
  逼味: 平时没有气味，凑近了是一点温热的皮肉气。不腥，不酸
  动情味: 气味淡，闷，不冲。来得慢，来了也不张扬，隔着裙子闻不出来
  汗: 香汗。原文写她带着浑身淋漓的香汗看完整场攻坚战。汗是清的，不臊
  经水: 原文未详。人形修得完整，月事照常，量不多，色暗。在水窖里那五百年是断的

分泌物:
  爱液: 来得慢，量不多。色清，能拉丝，黏度高。动情前是干的
  初夜: 原文未详。落红有，不多。她在水窖里关了五百年，出塔重逢之后才头一回承下
  奶水: 未生育时没有。有孕后期到哺乳期才有，奶水清，量不多
  眼泪: 来得多，来得快。重逢那一下她的泪水有淹没地宫的趋势。哭的时候不出声

敏感带:
  阴蒂: 全身上下最大的开关。按住它她会破音，那是她唯一压不住的地方
  下颌隋珠: 本命物长在这一处。舔上去她仰起脖子说不出话，两条腿收起来
  后颈: 蛇的七寸在颈上。手掌按上去她整个人软下来，剑也拿不住
  耳后发根: 头发被撩起来后颈露在空气里，她会缩。壹条替她掠发到耳后那一回，她当场停了话
  腰侧: 被手掌箍住就使不上力，人往那只手上倒
  奶头: 含住吸的时候她会出声，声音从鼻子里出来，压得很低
  逼口: 被含住她自己抬腰往上去，抬完才反应过来，脸烧得厉害
  尾椎: 人形没有尾巴，尾椎那一点是本体留下的位置。按上去她整个人往后弓
  脚心: 在水里泡了五百年还是怕痒。被舔到往回缩，脚趾全蜷起来

名器:
  名目: 青玉绞珠
  由来: 蛇类俱产珍珠，蛇珠又名隋珠，这是原文里的话。她这一身是青玉灵蟒修的人形，蟒的劲落在缠与绞上，修成人形以后这道劲留在逼里
  表现: 进去以后逼肉不是夹，是绞。一层叠一层地缠上来，从外往里一圈圈收，收到最里头生出一股往里带的吸力。越挣越紧
  代价: 这道劲吃她的力气。绞一回下来她满身汗，腰背发软。她自毁五百年修行之后底子本来就空，用一次要歇半天
  名声: 黎山门内外的说法是她这种美人罕见，副门主法江对她垂涎最深。逼里这道功夫只有壹条试过

性癖:
  缠绕: 蛇的本能在人形上落成缠。兴头上她用两条腿绞住对方的腰，手扣住后颈，越挣越紧
  憋声: 叫床压在鼻子里，最多一点细微的哼哼。只有阴蒂被按住会破音，破了音她自己捂嘴
  泡水: 在水窖里泡了五百年，在水里她比在岸上松。水底下做得开，出了水就收回去
  换皮: 蛇类每隔些年蜕一层皮。蜕皮那几天通身是新的，皮薄得发红，一碰就受不住，比平时缠人
  冷要焐: 通身是凉的，凉到指尖。要的时候先让人把她焐热了才肯动，焐不热就缩着不出来
  剑不离手: 橘红色雄黄宝剑随身。做得再凶，剑也搁在床边伸手够得着的地方
