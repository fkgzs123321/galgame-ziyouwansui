私密档案: 贞德的身体底账。修女袍裹着的那副身子，逐项记账
记录对象: 贞德
种族形体: 人类形体，无异常。贝普赛血统只落在两处，一头栗色长发，和一身怎么裹都裹不住的肉
修女巾: 平时把整头长发盘起来裹在里面的一块黑布。解了它，候补圣女就不是候补圣女

外观:
  身量: 个头不高，骨架细，站在李察跟前只到他肩下。腰细，胸口与臀上却各压着一份厚肉。宽大的修女袍把这一身遮了两年
  奶子: 一对饱满的大白奶子，单手托不住。皮薄得发亮，青色血管从锁骨走到乳根。摸上去先是一层薄汗的滑，再往里是沉甸甸的坠手。五指收紧能从指缝里挤出肉，松开留五道红印
  奶头: 不大，浅褐色，长在乳晕正中偏外。平时软的、平的，含进嘴里吸两口才立起来。立起来是硬的一小截，顶在舌头上。捻重了她会弓背，把胸口往前送
  乳晕: 不大，浅褐色，边上一圈颜色慢慢淡下去。晕面一层细小的颗粒，指腹擦过去是一片麻点。受凉或者动情，那圈颗粒立起来
  逼: 褐色软毛，常年闷在黑袍里，毛贴在肉上。掰开要用一点力气，里面紧，一层一层往里收，处女膜薄，碰一下她就往后缩。动情以后水来得慢，一来就多，顺着会阴淌到屁眼口
  阴唇: 两片阴唇厚，颜色偏深。大阴唇厚实，小阴唇稍薄，两片挨得死紧，把逼口严严实实合在里头，褐色软毛压着外沿，剩下的贴在肉上。颜色偏深，是常年闷在黑袍里闷出来的深褐。平时干爽，皮面软，指腹碾过去摸得出一层粗纹。掰开要用一点力气；动情时血色先沉下去，两片胀厚一圈，颜色转成深红，自己往外翻开一条缝，水从缝里一层一层往外淌
  阴蒂: 藏在上端两片褶子里，平时摸不着，拨开才露头。碰一下她膝盖就并起来，再碰一下两只手要去抓床沿。高潮的时候它鼓成一粒
  屁眼: 颜色浅，褶皱细密，一圈一圈收得很紧。平时干爽，没有气味。手指抵上去括约肌先猛缩一下，再慢慢松开，松到能进一指
  腰腹: 腰细，一把能圈住。小腹平，肚脐眼是往里凹的浅坑。生过孩子以后小腹松下来一层薄皮，从肚脐往下摸得到一条浅纹
  臀部: 全身最惹眼的一处。臀型圆，翘，两瓣分得开，臀缝深。站着不动也绷得住，拍一下整瓣肉跟着颤，颤完浮一层红。走路时两瓣一上一下地拧
  腿: 大腿根白，内侧的肉软，两腿并不拢，站直了中间留一道缝。小腿细直，膝盖上一点软肉，腿上一根毛也没有。被人从后面抱起来的时候，两条腿自己会缠上去
  足: 脚小，脚背高，脚踝窄，脚趾细长整齐，趾甲剪得极短。脚掌前部一层薄茧。脚趾被含住往回抽两下，第三下就不抽了
  手: 修长纤细的手指，指节细，指甲修成圆的。这双手做弥撒时捧圣体，也能把一头长发全部盘回修女巾里
  口舌: 嘴唇秀美饱满，唇色淡，咬过以后才红。舌头软，短，灵活，含东西的时候往里收，不往外顶
  腋下: 干净，一根毛也没有，皮薄。腋窝常年是温的，出汗时先湿一小片。被舔到会把胳膊夹紧，夹紧了还不放人走
  发肤: 栗色长卷发，发量厚，一把抓不住，散在枕头上铺满半个床。做的时候被压在两人背后，被抓住发根往怀里带，头皮一紧她整个人就软下去。皮肤白，胸口与大腿内侧更白。通身常年一层薄汗，摸上去滑
  标志: 脸颊上两个甜酒窝。一身从头罩到脚的黑色修女袍，外加那块修女巾。栗色的长头发

气味:
  体味: 淡淡的幽兰香，走动时从头发里散出来。过了这一层，皮下是一股温热的、干净的奶甜
  逼味: 修道院常年烧蜜蜡，逼上也沾一点甜腻的香火气。凑近了是干净的皮肉味，不腥不酸
  动情味: 动情以后幽兰味变浓变闷，混上一股像新剖开的蜜瓜的甜腥，隔着修女袍的下摆能闻到
  汗: 香汗。诵圣诗时额头与鼻尖先出汗，汗是清的，不臊
  经水: 人类女子的量，色暗红。气味是铁腥里带一点甜，头两天最重

分泌物:
  爱液: 来得慢。一旦来了就多，色清微白，稠，能拉丝。抹在指上搓开是滑的，不干
  初夜: 处女膜薄，撕开时出血不多，一滴一滴落在褥子上，混在爱液里成淡粉。她疼得咬自己的手背也不叫出声
  奶水: 未生育时没有。生了圣子以后奶水足，色白偏淡，稀，甜里带一点乳香，喂孩子时用修女袍前襟挡着
  眼泪: 来得极快，眼圈先红，接着一串一串往下掉，掉的时候不出声。用手背一抹，抹完接着说话

敏感带:
  发根与头皮: 头发被人抓住发根往后带，她头皮一紧，整个人从腰上软下去。做的时候被含着头发，她不出声，眼泪先出来
  耳后与后颈: 修女巾解掉，后颈露在空气里，她会自己把肩缩起来。耳后一被含住就抬不起头
  奶头: 捻、含、吸都有效。吸的时候她出声，出完声先捂嘴
  逼口: 舌尖绕着逼口打转的时候，她用手按住对方的后脑，按了又松，松了又按
  阴蒂: 拨开褶子碰一下，膝盖就并起来，碰第二下并不住
  臀缝与尾椎: 顺着臀缝往下摸，她会自己把屁股翘起来一点，翘完自己察觉，脸红到脖子
  大腿内侧: 从膝弯往上一路摸，摸到腿根，两条腿就并不拢了
  脚心与脚趾: 脚趾被含住往回抽两下，第三下就不抽了。脚心被舔到会笑出声
  小腹与肚脐: 小腹被手掌整个盖住按下去，她喘不上气，一只手扣住对方的手腕不放

名器:
  名目: 圣火长明
  由来: 圣女的职分是看守圣火。她这一处天生又紧又深又烫，含进去像把手探进长明灯的火苗里。耶鲁绿洲那一箭射穿小腹正中卵巢，她以处女之身怀了孕，这道火此后没熄过
  表现: 进去以后逼肉一层一层往里吞，吞得慢。越往里越烫，最深那一圈跟着心跳一下一下顶。射进去的东西留得住，半天不往外淌
  代价: 耗神。做完要躺着缓很久，起身时手抖，圣诗的头一句唱不上去
  名声: 教廷把她的身子当神迹传。告解室里那帮神甫与权贵私下都在算，这么个长发圣女要怎么才尝得到一口

性癖:
  念珠: 手里捏着念珠，捏得指节发白。念珠扯断过一回，珠子滚了一床，她跪着去捡，捡到一半被人从后面按回去
  背圣诗: 一边被顶一边背圣诗，背到岔行就停住不出声，眼泪掉下来接着背。越是背不下去，她收得越紧
  长发: 头发是父亲剃了又用魔法压住的旧账。被人抓着头发夸好看，她嘴上说不要，水先出来
  被看: 圣女是给一城人看着长大的。私下里被一个人从头看到脚，她会站着不动让他看，看到最后自己先红脸
  叫爸爸: 寄养证书上写的是义女，她管他叫爸爸。这两个字叫出口，她脸先红，做得最凶的时候叫的也是这两个字
  事后告解: 做完要跪在床边在胸口划十字，一句一句认罪。认完罪再伸手去拽他的胳膊，从来不改
