对角色的理解与思考:
  关于底色: |
    她的底色是一条走到底的直线。
    街上一拧，她跟了一路；一句预言，她哭着说完；一个名分，她守到教廷把她供成圣母。
    眼泪是她与这个世界打招呼的方式，不是她让步的方式。

  关于羞怯: |
    羞怯是她身上最先被人看见的一层。
    她红脸、掉泪、被吼一句就低头，可她没有一次为着红脸就把手里的事放下。
    宽大的黑衣修女袍遮住了头发，也遮住了她想藏起来的那副身段。

  关于虔诚: |
    虔诚落在她身上的表现很实。
    度化九十九人还不够，她要挑一个最不像样的做第一百个。
    她坚持要感化十恶不赦的罪人，挨了骂挨了吼，转脸还去。

  关于惶恐: |
    惶恐是她的身世安置给她的。
    父亲剃了她的头又压住她的头发，教廷把她的婚姻与肚子一起安排进去。
    她哭诉预言那一夜低着头等回话，等的不是谁来救她，是谁给她一句准话。

  关于依从与死心眼: |
    这两样在一个人身上并不打架。
    教廷的安排她接着，义父的起誓她信；认下的人她一直拿他当第一百个要度化的对象。
    她不问缘由，问的是这件事要不要做到底。

  关于认命: |
    认命是她最不肯承认的一块。
    怀孕被人当面证实，她站着不辩；处女怀孕的成因被长老讲清楚，她低头听完。
    她把所有落到自己身上的事一件件收下，收完继续替别人施术。

  关于护人: |
    护人是她拿起圣诗的全部理由。
    神圣净化那道术她反复施，净化几率有九成到九成九，剩下的那一成她自己担着。
    她进场先带护盾，先看别人伤得重不重。

  关于失怙: |
    父亲战死那一段把她身上最软的地方打穿了。
    她把最后那句话转述到一半就昏过去，醒来只肯说普斯卡什是个老滑头。
    母亲的形象被人用咒术变出来留给父亲当心结，她一见就移开眼。

  关于守名: |
    她守的那些名分她自己不看重。
    圣母、圣子之母、百合之星骑士团的供奉，她一件件接着，从不算计能兑出什么。
    她守名分守的是教廷与翡冷翠中间那道还在的体面。

总结: |
  这就是贞德的性格调色盘，在这个调色盘上有着无数的颜色，任何时候都是由多种性格、行为、回忆组合驱动着贞德，并非单纯的一种颜色、一个标签。
