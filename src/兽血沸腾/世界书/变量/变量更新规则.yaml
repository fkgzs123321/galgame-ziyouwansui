---
变量更新规则:
  世界:
    日期:
      format: YYYY/MM/DD
      check:
        - 纪年沿用爱琴历新历，开局为一百四十年五月，一年推进到头进位为一百四十一年
        - 每次场景推进、休息或长途行军后更新，保持时间流逝与路途距离相称
        - 场景内短时间对话不推进日期，只推进时段
    时段:
      type: 凌晨|清晨|上午|正午|下午|黄昏|夜晚|深夜
      check:
        - 随场景内的时间推进而变，一天走完一轮后回到凌晨并推进日期
    当前区域:
      check:
        - 玩家跨越地理区域时更新，取值必须与地理条目的区域名称一致，否则区域条目不会渲染
    当前场景:
      check:
        - 玩家在区域内部换到具体地点时更新，取值必须与场景条目的名称一致
    天气:
      type: 晴|阴|雨|雪|雾|沙暴|风暴
      check:
        - 换日时按当前区域的气候合理变化，沙漠多沙暴，海上多风暴，山地多雾雪
    近期事务:
      type: |-
        {
          [事务名: string]: {
            类型: '主线' | '支线' | '领地' | '私人';
            说明: string;
            状态: '未开始' | '进行中' | '已完成' | '已失败';
          }
        }
      check:
        - 同一时间进行中的主线不超过三条，新主线加入前先收束或降级旧主线
        - 事务完成后保留记录，状态改为已完成，不直接删除
  剧情:
    章节序号:
      type: number
      range: 0~763
      check:
        - 全书七百六十四章的连续序号，从开局所在的荒岛篇为 0 起算，只增不减
        - 玩家实际走完一条 时间线 节点的完成判定之后，才把它改成该节点「挂钩变量」里写定的那个数字，不跳号、不预支
        - 它是全部章节阶段条目与事件条目的渲染开关，改错会让同一批条目同时开或同时关
    当前卷:
      type: 荒岛篇|胸罩岛篇|海上篇|多瑙大荒原篇|博格村与领地初建|翡冷翠领主期|比蒙王国纵横
      check:
        - 仅当玩家完成当前卷的核心节点、且主动跨出本卷舞台时才推进到下一卷
        - 每次推进后同步更新 剧情.章节节点，并把已完成的节点并入 剧情.已触发事件
    章节节点:
      check:
        - 写当前推进到的原作章节名，与 故事大纲.yaml 的 chapters 名称保持一致
    主线进度:
      type: number
      range: 0~100
      check:
        - 按已完成的卷数与卷内节点比例估算，单次变化不超过 ±15
    已触发事件:
      type: |-
        {
          [事件名: string]: {
            卷: string;
            章节: string;
            结果: string;
          }
        }
      check:
        - 原作关键节点被玩家实际经历后写入，未经历的不要提前写入
    分歧记录:
      type: |-
        {
          [分歧名: string]: {
            卷: string;
            与原作差异: string;
            后果: string;
          }
        }
      check:
        - 玩家的选择导致剧情偏离原作走向时写入，供剧情编年史回溯
        - 只记录事实差异，不带评价
    名场面:
      type: |-
        {
          [场面名: string]: {
            卷: string;
            章节: string;
            内容: string;
          }
        }
      check:
        - 每卷挑三到五个真正值得回看的场面写入，不逐节点铺满
        - 玩家走出与原作不同的分支时同样可以写入，写清这一场为何值得记住
  主角:
    身份:
      check:
        - 公开头衔或职务变化时更新，如匹格族族人、比蒙男爵、翡冷翠领主、龙祭祀、神曲萨满、花王韦舵
        - 多个身份并存时用顿号连接，不用「/」
    阶位:
      type: 无|风语祭祀|灵魂祭祀|战争祭祀|权杖祭祀|维安大萨满|十二主祭|红衣大祭司
      check:
        - 只按圣坛祭祀七阶升迁；龙祭祀、星袍祭祀、神曲萨满、花王韦舵是荣誉头衔，写入 身份 而不是本字段
        - 升阶须有神庙或剧情明确授予，不能因实力增长自动升阶
    阵营声望:
      type: |-
        {
          [势力名: string]: number;
        }
      check:
        - 键为势力或种族名，取值为负一百到一百的整数，零表示中立无感
        - 只在玩家与某一势力的关系发生明确变化时写入该键，不要一次性铺满所有势力
        - 比蒙王国、比蒙神庙、翡冷翠、多洛特公国、圣弗郎西斯科帝国、圣保罗教廷、慕兰帝国、西雅海国、唐藏帝国、卢塞恩、魔族与侵略者联盟、冥界都是常用键
        - 同一势力名不要出现异写，如统一写比蒙王国而不是比蒙
    生命:
      type: |-
        {
          当前: number;
          上限: number;
        }
      check:
        - 战斗负伤、中毒、疾病扣当前值；治疗、战歌加持、休息恢复
        - 当前值降到 0 视为濒死或被俘，按 系统.难度 决定后果，不直接判定死亡
    歌力:
      type: |-
        {
          当前: number;
          上限: number;
        }
      check:
        - 每唱一首战歌按层级消耗，高阶战歌消耗显著更大
        - 靠冥想恢复，休息一晚可恢复大部分，战斗中无法恢复
        - 战歌被打断时，本次凝聚的歌力直接损失，不返还
    体力:
      type: number
      range: 0~100
      check:
        - 近身肉搏、长途行军、重体力劳作扣减；进食休息恢复
    属性:
      ${力量|敏捷|体质|感知|魅力|智慧}:
        type: number
        check:
          - 训练、战斗、重伤、异体原成长等显著事件才调整
          - 单次变化不超过 ±10，除非剧情有明确的强化或削弱来源
    状态:
      type: |-
        {
          [状态名: string]: {
            类型: '增益' | '减益' | '特殊';
            来源: string;
            剩余时限: string;
          }
        }
      check:
        - 负伤、狂化、加持、中毒、诅咒发作等状态出现时写入，解除时移除
        - 剩余时限按 世界.时段 推演，写具体描述如「三回合」「五盎司沙漏」
    诅咒:
      血之祭奠:
        type: boolean
        check:
          - 默认为 true 且不可解除；仅当剧情推进到终盘并达成特定条件才可改为 false
      说明:
        check:
          - 诅咒当前造成的具体影响，如正牌战歌失效、汉语自创战歌可奏效、获得类狂化与魔法元素力量
    战歌:
      type: |-
        {
          [战歌名: string]: {
            层级: number;
            熟练度: number;
          }
        }
      check:
        - 只能使用原作文本中真实出现过的战歌名，不得自造
        - 战歌被打断时熟练度不降，但本次施放失败
    自创战歌:
      type: |-
        {
          [战歌名: string]: {
            歌词: string;
            效果: string;
            熟练度: number;
          }
        }
      check:
        - 玩家自创的汉语战歌，歌词由玩家在剧情中写出后记录
        - 效果与同层级正牌战歌相当，但被神庙视为异端
    异体原:
      龙力系:
        type: number
        range: 0~100
        check:
          - 龙族相关事件、龙力灌注、血脉觉醒时增长
      花系:
        type: number
        range: 0~100
        check:
          - 与花界、草木相关的事件中增长
      金刚伏魔之力:
        type: number
        range: 0~100
        check:
          - 与唐藏、佛门相关的事件中增长
      秘银断臂:
        type: boolean
        check:
          - 断臂并以秘银手臂接续后为 true，此后不再变回 false
    装备:
      type: |-
        {
          [部位: string]: {
            名称: string;
            品阶: string;
            状态: string;
          }
        }
      check:
        - 穿脱、损毁、替换装备时更新；空置部位写入「空置」
    物品栏:
      type: |-
        {
          [物品名: string]: {
            数量: number;
            说明: string;
          }
        }
      check:
        - 获得、消耗、赠予、损毁物品时更新；数量归零时移除该项
    淫乱度:
      type: number
      range: 0~100
      check:
        - 亲密行为后累积上升，长期无亲密行为缓慢衰减
        - 影响 NSFW 场景中角色的主动程度与配合度
    精力:
      type: number
      range: 0~100
      check:
        - 亲密行为消耗，睡眠与休息恢复
        - 低于 30 时亲密判定成功率下降，低于 10 时无法进行
  技能树:
    战歌树:
      type: |-
        {
          [战歌名: string]: {
            解锁: boolean;
            熟练度: number;
            层级: string;
          }
        }
      check:
        - 键只能是原文真实战歌名；解锁受 主角.阶位 限制，低阶不可解锁高阶战歌
        - 熟练度靠实际使用提升，单次不超过 +5
        - 层级写阕次或战歌类型，如「第三阕」「交响」「单控」「独奏」「神曲」
    异体原:
      type: |-
        {
          [节点名: string]: {
            解锁: boolean;
            层级: number;
          }
        }
      check:
        - 节点取值为 龙力系、花系、金刚伏魔之力、秘银断臂 等主角专属成长线
        - 层级写已突破的层数，未解锁为 0
        - 解锁须有明确剧情来源，不靠点数兑换
    兵种树:
      type: |-
        {
          [兵种名: string]: {
            解锁: boolean;
            等级: number;
            训练度: number;
          }
        }
      check:
        - 键只能是原文真实兵种，如比蒙战士、猛犸骑兵、熊猫武士、獒人、泰戈族彪人武士
        - 解锁须有该族归附或被招募的剧情
    领地科技树:
      type: |-
        {
          [节点名: string]: {
            解锁: boolean;
            等级: number;
          }
        }
      check:
        - 节点为可建造项，如祭祀学院、祭坛、战歌图腾柱、摩云磁暴灯、军工基地
        - 解锁须先满足 领地.等级 与 领地.资源 条件
    自定义:
      type: |-
        {
          [节点名: string]: {
            说明: string;
            消耗: string;
            状态: '未解锁' | '已解锁' | '成长中';
          }
        }
      check:
        - 玩家自定义的技能或成长节点写入这里
        - 不给效果，只记状态；实际效果由叙事呈现
  战斗:
    进行中:
      type: boolean
      check:
        - 进入战斗时置为 true，战斗彻底结束并脱离接触后置为 false
    回合:
      type: number
      check:
        - 每完成一轮双方行动推进一次；战斗结束时不重置，留作战报编号
    阶段:
      type: 未开始|布阵|交锋|鏖战|追击|撤退|结算
      check:
        - 按战局实际推进单向变化，允许从鏖战直接进入追击或撤退
    环境:
      地形:
        check:
          - 写具体地形，如红土高坡、桑干河滩、森林、沼泽、城墙、舰船甲板
      天气:
        check:
          - 取 世界.天气 的值，随战场变化同步
      结界:
        type: |-
          {
            [结界名: string]: {
              施放者: string;
              范围: string;
              效果: string;
            }
          }
        check:
          - 双方布下的结界写入这里，如战歌图腾柱的魔法免疫结界、领域结界
    我方:
      type: |-
        {
          [单位名: string]: {
            兵种: string;
            生命: number;
            状态: string;
            站位: string;
          }
        }
      check:
        - 参战单位按实际出场写入，脱离战场或被消灭后移除
    敌方:
      type: |-
        {
          [单位名: string]: {
            兵种: string;
            生命: number;
            状态: string;
            站位: string;
          }
        }
      check:
        - 同 战斗.我方，按实际出场写入
    战歌加持:
      type: |-
        {
          [战歌名: string]: {
            施法者: string;
            剩余时限: string;
          }
        }
      check:
        - 战歌光环生效期间写入，时限耗尽或被驱散后移除
        - 同一战歌被更高阶施法者覆盖时替换 施法者 与时限
    战报:
      type: |-
        {
          [回合编号: string]: {
            摘要: string;
            我方损失: string;
            敌方损失: string;
          }
        }
      check:
        - 每回合结束后写入一条，供战斗面板回放
        - 只记事实，不带评价
  领地:
    名称:
      check:
        - 领地改名时更新，默认翡冷翠
    等级:
      type: number
      range: 1~10
      check:
        - 人口、建筑、声望综合达标后才提升，单次不超过 +1
    声望:
      type: number
      range: 0~100
      check:
        - 战功、外交、公开事件提升；败仗、失信、屠戮下降
    人口:
      type: number
      check:
        - 招揽、归附、生育增加；战损、逃亡、瘟疫减少
        - 低于一千时会触发贵族监察院的兼并程序
    民心:
      type: number
      range: 0~100
      check:
        - 税负、供给、治安、领主行为影响
        - 低于 20 时触发逃亡与抗命事件
    治安:
      type: number
      range: 0~100
      check:
        - 巡逻、驻军、司法提升；盗匪、内斗、外敌下降
    资源:
      ${金币|粮食|木材|石料|铁|精金|魔晶}:
        type: number
        check:
          - 生产与缴获增加，建造、军饷、消耗减少
          - 数值为 0 时对应建造项不可开工
    建筑:
      type: |-
        {
          [建筑名: string]: {
            等级: number;
            状态: string;
          }
        }
      check:
        - 建筑开工时写入并标为建造中，完工后改为已建成并给等级
    兵力:
      type: |-
        {
          [兵种名: string]: {
            数量: number;
            训练度: number;
          }
        }
      check:
        - 招募、征召增加；战损减少
        - 训练度靠操练提升，久不训练缓慢下降
    附庸族:
      type: |-
        {
          [族名: string]: {
            人数: number;
            代表: string;
            关系: '融洽' | '稳定' | '紧张' | '对立';
          }
        }
      check:
        - 部族归附时写入，需要先谈妥条件
        - 关系随待遇与事件变化，跌到对立会触发叛离
  魔宠:
    type: |-
      {
        [魔宠名: string]: {
          种类: string;
          忠诚: number;
          阶位: string;
          技能: string;
          状态: string;
          契约: '已签' | '未签';
        }
      }
    check:
      - 每个灵魂歌者终生只能有一只签订灵魂契约的魔宠，战斗或病死除外
      - 果果未签灵魂契约，可与其它魔宠并存
      - 忠诚随待遇与共同经历变化
  关系:
    type: |-
      {
        [角色名: string]: {
          好感度: number;
          信任度: number;
          关系阶段: '初识' | '同伴' | '相知' | '相爱' | '妻子' | '疏离';
          亲密: number;
          孕事: {
            状态: string;
            胎数: number;
            孕期: string;
            预产期: string;
          };
          房事: 见 后宫.房事（同一形状；此处只作同步副本，以 后宫.房事 为准）
          已触发互动: string;
          印象: string;
        }
      }
    check:
      - 首次与角色发生实质互动时创建该角色的条目
      - 好感度按关键事件跳升、日常互动小幅增长，冷落则缓慢衰减，单次变化不超过 ±20
      - 信任度对坦诚与帮助行为增长，对隐瞒与伤害行为大幅下降
      - 关系阶段按好感度与信任度综合判定，不单看其中一个
      - 房事以 后宫.房事.{角色} 为准；本项只在开局即在场的那几位身上保留同步副本，两边必须同值
      - 日常互动只动 亲密，房事只在亲密事件实际发生时更新
  后宫:
    成员:
      type: |-
        {
          [姓名: string]: {
            种族: string;
            身份: string;
            关系阶段: string;
            加入章节: string;
          }
        }
      check:
        - 由 关系.{角色}.关系阶段 达到「相爱」或以上、且完成确认事件后写入
        - 移出需要明确的分歧或死亡事件
    子嗣:
      type: |-
        {
          [姓名: string]: {
            母亲: string;
            种族: string;
            年龄: number;
            特征: string;
            天赋: string;
          }
        }
      check:
        - 由 后宫.孕事 孕期走完、自然分娩后写入
        - 种族与天赋按母系种族与父母属性衍生
    孕事:
      type: |-
        {
          [母亲: string]: {
            状态: string;
            胎数: number;
            孕期: string;
            预产期: string;
            受孕章节: string;
          }
        }
      check:
        - 仅在 系统.规则开关.孕事系统 为 true 时更新
        - 由亲密行为的受孕判定写入；孕期按 世界.日期 推进分期
        - 分娩后从本项移除并写入 后宫.子嗣
    房事:
      type: |-
        {
          [角色名: string]: {
            侍寝次数: number;
            最近: string;
            身体开发: number;
            名器觉醒: boolean;
            部位: {
              [部位名: string]: {
                熟练: number;
                备注: string;
              }
            };
            性癖: string[];
            床评: string;
          }
        }
      check:
        - 这是房事的权威名册；关系.{角色}.房事 若存在，只是同一份数据的同步副本，两边必须同值
        - 只对写有 世界书/角色/{角色名}/私密.yaml 的角色建账，其余角色不得出现
        - 部位 的键必须来自该角色自己的私密档案，原装部位为
          奶子、奶头、乳晕、逼、阴唇、阴蒂、屁眼、腰腹、臀部、腿、足、手、口舌、腋下、发肤，异体部位用该档案自己的名字（蚌壳、蛇尾、羽翅、龙角、九头蛇身、珊瑚胶体之类），不得套用别人的部位表
        - 部位.熟练 随该处被反复照顾而增长，首次触碰不写高值；身体开发与侍寝次数、部位熟练度同步推进
        - 名器觉醒 在该档案写明的名器真正显效时置真，不因好感度到顶而自动置真
        - 性癖 逐条追加，不覆盖已有的那条，也不因好感度下降而删除
        - 床评 写她的反应路数与忌讳，照 私密阶段 当前档位写，跨档要跟着改
    亲密记录:
      type: |-
        {
          [记录编号: string]: {
            对象: string;
            日期: string;
            场景: string;
            摘要: string;
          }
        }
      check:
        - 每次亲密行为后追加一条，供孕事判定与关系面板回看
        - 摘要写事实与地点，不写露骨细节
  系统:
    难度:
      type: 轻松|标准|硬核
      check:
        - 仅在玩家通过控制中心修改时变更，不由 AI 自行调整
    规则开关:
      ${孕事系统|战斗自动结算|领地自动产出|作者插话}:
        type: boolean
        check:
          - 仅在玩家通过控制中心修改时变更，不由 AI 自行调整
    玩家自定义:
      type: |-
        {
          [标记名: string]: string;
        }
      check:
        - 玩家自定义的身份、种族、出身与任意扩展标记写入这里
