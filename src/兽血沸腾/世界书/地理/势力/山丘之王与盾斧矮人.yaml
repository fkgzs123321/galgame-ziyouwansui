四大纯血杜伊嘉尔:
  性质: 上古泰坦最直系的血统溯源，守护整个爱琴四大擎天柱的泰坦血脉
  四支构成: 黄金矮人、白银矮人、野矮人、盾斧矮人
  各自特长: 黄金矮人是全族山丘的魔武士与魔法师天作之合，白银矮人擅长提炼黑索银，野矮人的炼金足以媲美爱琴所有炼金师团队，盾斧矮人精于混融金属
  典籍与图纸: 泰坦巡游战舰原版设计图纸被四大杜伊嘉尔各掌四分之一，缺少任何一部分都无法制造
  聚齐: 四大杜伊嘉尔如今齐聚翡冷翠，成员有托夫丁、里克尔梅与扬科勒
  能量武器谱系: 纯血杜伊嘉尔的黑索银、盾斧矮人的富氧金属与氧爆金属、堤丰巨人的磁悬浮盔甲、云秦帝国的玻理铜、魔族的纷舞妖姬音波武器以及西雅海族的艾薇尔铁塔

黄金矮人:
  性质: 被泰坦分封在爱琴第一高山泰穆尔拉雅雪山之上的四大纯血杜伊嘉尔之一
  出世条件: 从不出世，除非天下大变、爱琴危在旦夕
  别称: 又称雷鸣之子，后代只在雷鸣电闪的天气降生
  族体特征: 无论男女都是双胞胎且全是山丘之王，是矮人一族唯一的全族山丘；四百七十二名族人等于二百三十六名法师
  战力构成: 孪生黄金矮人一个是天生矮人战士，一个是天生雷电法师，彼此心灵相通，是极其完美的战斗组合；魔法师愈老弥坚
  装备铁律: 在战斗中必须披挂纯金战甲、使用纯金器械，连法师也不例外，否则只能发挥普通矮人战士与法师的战斗力甚至不如
  特殊定位: 四大纯血杜伊嘉尔中只有黄金矮人是纯粹的强战之族，也是唯一一支不会采矿锻造的矮人
  信仰: 摩拉丁的爱子
  投奔经过: 响应道格拉斯风暴号角全族四百七十二人拖家带口下山投奔翡冷翠，每人都索要黄金行头；族长克虏伯是雷鸣登之父，其孪生妹妹女战士勃郎宁索要五百磅黄金战锤
  战场用途: 八十位族人需十二吨黄金，刘震撼只能为四十位战士打造小型飞锤

白银矮人:
  性质: 四大纯血杜伊嘉尔之一
  特长: 擅长提炼黑索银，掌握黑索银提炼技术
  归属变动: 被圣弗郎西斯科帝国送给翡冷翠
  产物: 用秘银提炼的黑索银炮弹只造了三颗

野矮人:
  性质: 四大纯血杜伊嘉尔之一，天生的炼金大师
  族训: 信奉沉默是金
  工作模式: 分工明确、多人合作、配合默契的炼金方式被称为安特炼金模式
  产物: 以安特炼金模式分工协作，最终炼出六千七百七十枝杜蕾丝爆裂箭
  传承地位: 矮人中最好的魔法器械锻造者，古力火铳的发明者道根大师曾在这一族学艺
  驻地: 渣打峡谷一带
  代表作品: 亚伯拉罕重装锚弩是野矮人与白银矮人的结晶杰作，足以屠杀上古巨兽的单发重火力，弩箭用柳相铁打造又灌冲了黑索银并篆刻心灵指引法阵，每一枚都贵重到无法现场验证

盾斧矮人:
  性质: 四大纯血杜伊嘉尔之一，常年隐居高山守护四大擎天柱
  驻地: 北国高山与多洛特公国
  金属工艺: 精于混融金属，能按特殊配比熔炼金银铜铁，制造出富氧金属安大列与氧爆金属德雷勒布斯
  飞行能力: 具备独门的盾翼制造技巧，可以凭借两面飞盾在天空象小鸟一样翱翔，并利用手中的飞斧杀敌
  称号: 四臂飞人、蓝天娇子与氧气魔术师
  禁空免疫: 富氧金属不惧空气停止流动，斯迈族的禁空之歌也桎梏不了他们
  归顺经过: 隆美尔第二次来访共进午餐，自陈想脱离堕落精灵单干，愿演一出毁约戏把盾斧矮人送来；盾斧矮人一百二十七人归顺并献上泰坦巡游战舰图纸
  政治筹码: 隆美尔向凝玉与安度兰长老提出以盾斧矮人换取红土高坡，凝玉反提以剃刀山雪梨城交换，隆美尔因天鹅族采玉城毗邻而拒绝

安大列富氧金属:
  性质: 盾斧矮人按特殊配比熔炼金银铜铁所制的富氧金属
  物理特性: 能在空气中象云彩一样漂浮
  应用: 每个盾斧矮人都持一对安大列战盾，凭富氧盾翼在蓝天驰骋，让他们无须翅膀也能与雄鹰为伴
  降落控制: 靠弹弓式拉发装置弹出北国虎头巨鲛皮绡隔绝空气，从而控制降落

德雷勒布斯氧爆金属:
  性质: 盾斧矮人按特殊配比熔炼金银铜铁所制的氧爆金属
  撞碰效果: 撞击后摩擦出氧气震爆，以攻击耳膜为主
  附加特性: 具备近似山丘之王风暴之锤的晕眩特性
  应用: 德雷勒布斯短尾战斧是用氧爆金属打造的飞行战斧，撞击后摩擦出覆盖广泛的氧气震爆，以震晕对手为主
  巡游礼炮: 战斧巡游礼炮是盾斧矮人的贡献，蜂巢前端配后端风速涡轮，靠风力提供动力不停发射氧爆战斧，只能用于空中作战，射到距地面十米处就会被土壤吸收空气震爆波

泰坦巡游战舰:
  性质: 上古泰坦巨人巡游天空时的座驾，也是上古泰坦代替众神巡游天空的座驾
  构造: 以富氧金属为主体、靠氧爆金属舵轮的反作用力驱动
  图纸: 原版设计图纸被四大杜伊嘉尔各掌四分之一，缺少任何一部分都无法制造
  建造难点: 龙骨需要的富氧金属必须按配方勾兑，量太大无法短期造成，刘震撼只能先造它上面的武器

山丘之王:
  性质: 两位正宗灰矮人巴特尔与巴克利组成的作战组合
  擅长: 矮人绝技下盘斩
  归属: 新加入战神夏宫卫队，担任刘震撼的贴身侍卫
  收编经过: 两人求战，果果一拳掏中巴克利裤裆又用皮球戏耍，两人改口愿穿盔甲，被收为贴身侍卫
  刑讯贡献: 奥尼尔以烙铁与通条酷刑拷问无果，山丘之王巴克利献计以美酒攻心
  情报成果: 刘震撼用溺杀与美酒相逼，诱出沙舟部队编制、巨螺晶心驱动原理以及摩云神灯与温拿手套的霓虹磁暴机密
  地位参照: 黄金矮人全族皆为山丘之王，可见山丘之王是矮人体系中的高阶战力称号

灰矮人:
  性质: 摩尔血精灵麾下的矮壮战士
  种族异能: 隐形术，只是隐形术有冷却时间
  战力与装备: 装备精良力气巨大，有百年辫髯战士与下盘斩绝招
  隶属与驻地: 黑域大陆，血精灵麾下三十万
  首领称号: 山丘矮人王
  破解手段: 黑暗精灵能发出没有杀伤力的骨磷火焰，粘在灰矮人身上可让隐形者无所遁形
  工业产出: 翡翠兵工厂由灰矮人铁匠主理，为沙漠之战开发了五百加仑一桶的军用巨型水桶，表层铸有麦酒杯青铜铭牌

与主角的关系:
  - 隆美尔以盾斧矮人为筹码向翡冷翠换取红土高坡，凝玉以剃刀山雪梨城反提案
  - 盾斧矮人一百二十七人归顺翡冷翠并献上泰坦巡游战舰图纸
  - 黄金矮人全族四百七十二人响应风暴号角下山投奔翡冷翠，族长克虏伯与女战士勃郎宁索要纯金武装
  - 白银矮人被圣弗郎西斯科帝国送给翡冷翠
  - 山丘之王巴特尔与巴克利被收为刘震撼的贴身侍卫，编入战神夏宫卫队
  - 巴克利献计以美酒攻心，帮刘震撼撬出沙舟部队编制、巨螺晶心驱动原理与霓虹磁暴机密
  - 四大杜伊嘉尔齐聚翡冷翠后合力复现泰坦巡游战舰与亚伯拉罕重装锚弩等上古造物

当前处境:
  - 四大纯血杜伊嘉尔齐聚翡冷翠，盾斧矮人与堤丰巨人同在熔岩山谷劳作，该地被改造成翡冷翠军工基地
  - 泰坦巡游战舰因富氧金属龙骨用料过大而无法短期造成，只能先行制造舰载武器
  - 黄金矮人的纯金武装需求远超翡冷翠的黄金储备，全族装备只能分批解决
  - 隆美尔以盾斧矮人为筹码换取红土高坡的计划落空，五天后开战
