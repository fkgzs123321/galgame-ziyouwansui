冥界:
  性质: 亡魂的故乡位面
  统治: 冥神俄狄斯，冥界三大统领为其麾下
  地形与河系: 分灵魂大河、骸骨大河与碧落血河三条大河，另有死亡之地
  关键地点: 灵魂大河、骸骨大河、碧落血河、死亡之地、底特律灵魂大河、时空大裂缝、统领寝殿、冥界神殿
  光照条件: 冥界生物怕光，冥界靠父神俄狄斯设计的雨积云遮挡光线；爱琴只有一个帝波罗，冥界有四个
  战力定位: 冥界第一大统领茵格里切宝是圣奇奥级，冥界三大神器尽毁于爱琴

冥界三大统领:
  茵格里切宝: 司掌灵魂大河的第一大统领，圣奇奥级；以时间遗忘法则、暗黑失乐圆与名剑召唤作战；率领四头六阶铠甲冥龙增援采玉城战线
  瑞卡雅顿布: 司掌骸骨大河的第二大统领，持冥神骨朵；独眼是能分辨敌我的阿赖耶识之眼
  耐温尔因克: 碧落血河大统领，冥神俄狄斯的爱子，手持三股钢叉；是南十字星森林七十万冥族生物的领头者
  辨识标志: 冥界三大统领以眉心的白色勾形标志辨认
  图腾武器: 三大统领的图腾武器都是本命武器，时空大裂缝的联通性可让冥界第一大统领遥控使用湮灭镜轮
  究级角斗术: 冥界三大统领困兽犹斗的不世绝艺，掰断虬角作投枪，左角可跨时空传讯、右角带二十四种负面属性

冥界神器:
  湮灭镜轮: 能发出自上而下地毯式覆盖的湮灭之光，冷却前共有三次使用机会，被耐温尔因克当板砖砸出后由斯托克顿削成两瓣
  冥神骨朵: 瑞卡顿雅布的白骨战槌，以冥神俄狄斯指骨制成，天生自带七感剥夺领域剌斯领域
  黑暗三股叉: 即碧落三股钢叉，耐温尔因克世代相传的史诗武器，以碧炎之火锻造并搀杂缇奈伦尔黑暗金属，附加火焰与酸毒双重伤害并增幅一倍黑暗原力，可随主人缩身而变短
  割魂血镰刀: 茵格里切宝此次特地从冥界带来的神器，尚未派上用场便随六阶冥龙坠地
  达克摩利斯与埃克斯卡利巴: 并列的名剑，茵格里切宝宣称二者尚未出手
  佩尔修斯: 曲折圣剑，被茵格里切宝召唤后由刘震撼以血婴格飞
  暗黑失乐园: 冥界第一大统领茵格里切宝的独门终极防御法术，能形成无视任何外来攻击的绝对空间屏障
  时间遗忘法则: 茵格里切宝的圣普法则，可让整整一个位面世界彻底停转三刹那

冥族大军:
  性质: 从冥界前来爱琴狩猎的侵略者
  兵力: 南十字星森林潜伏七十万冥族生物躲避阳光，主力是羊角怪这类高阶魔兽，领头者正是血河大统领耐温尔因克
  潜入路径: 借马龙水晶传送阵与时空大裂缝潜入南十字星森林，根源在冥界阴风山谷
  随行者: 大恶魔瑞博克、地狱潜行者、伏地恶魔、哈迪斯冥狼与阿迪达斯玛部落
  锋刃: 以名剑召唤与六阶铠甲冥龙为锋刃
  战争目标: 用何塞家的孩子换回被俘的血河大统领
  战损: 骸河大统领阵亡、血河大统领被俘，七十万主力冥兽被南十字星森林吞没
  后续投入: 终极决战时茵格里切宝率四头六阶铠甲冥龙赶到采玉城

冥界守卫者阿迪达斯玛:
  性质: 碧落血河渡口守卫、准超阶龙兽档次的异界群居魔兽
  投送方式: 被阿仙奴的时空转换通道成批召唤到龙之墓地
  隶属: 血河大统领耐温尔因克

耐温尔因克的战力:
  领域: 深红枷锁领域牵引领域内一切有血生物的血液，使其失血或行动僵硬
  战绩: 与温格对决获胜，温格以引导之歌唤来堡狮龙，自身冻成空心冰雕战死
  三雄会首: 在魔龙、爱琴巨龙与冥族三方混战中扭断虬角施展究级角斗术，魔龙二太子穆图与未婚妻夏尔芬被它一叉串死，阿兰德隆放出裁决之刃重创它
  受创: 挤入时空通道时被维京重斧劈中眉心白色勾形标志，因体型过大反将骨冢之门崩裂
  被俘: 血河大统领被俘，冥族试图以何塞家的孩子换回

死亡领主遗物:
  来源: 神魔大战时代一位武技魔法俱佳的魔骑士投降魔族，巫妖王斯科拉里恩赐给他一整套骑士装备，即死亡领主遗物
  四件构成: 徽章型护盾、皇冠型戒指、摩钻型耳钉、护腕型镯轮
  集齐效果: 四件集齐可自由组装成魔界第一盔甲冰峰王座铠甲，即冰封王座战甲，胸铠浮雕插着战剑的骷髅头，浮现霜花与六根魔族战旗，可缩回护盾、耳钉、戒指与镯轮四处
  材质: 由魔界最稀有的黑昙金制成，每一件都内含一个功能不同的黑昙死灵空间，号称不死生物的失乐园
  排他性: 陌生不死生物未经拥有者同意进入黑昙空间，会被里面原本居住的不死生物吞噬
  净化难度: 死亡领主遗物中的邪恶力量即使是教皇的净化也无法消除
  现存状况: 已知只有三件，最后一个镯轮去向不明

戒指:
  形制: 魔族入侵爱琴大陆后留下的黑金戒指，泪滴形小皇冠造型、表面刻着黑昙花纹面具，戴上后会让手指变成布满黑昙花纹的铁指
  功能: 能把戒指主人杀死的生物转化为戒灵，戒灵每次只能拥有一位，可保留前生的思想和武技，但无法违抗主人的命令，永远被奴役与煎熬
  空间属性: 说穿了就是一个亡灵的次元空间，虽然戒灵只能收下一个，但有自我思想的亡灵也能住在里面，八位布尔族灵魂巡游者现在就待在里面
  幽灵庇护: 戒指上的死亡力量可以庇护幽灵，让它安全离开禁锢海岛，幽灵依附戒指不占据戒指内的空间，但一旦靠近就会被戒灵吞噬
  教廷藏品: 死亡领主的戒指是教廷仅有的两件死亡领主遗物之一；另一件是龙骑士加茜娅佩带的死亡领主护盾，六面笼罩黑色雾气、凸着昙花纹与骷髅头的黑色晶盾，能抵挡好几十个高阶魔法
  禁魔例外: 磁力禁魔领域由磁山持续供能维持，只能干扰元素波动，无法封禁空间戒指与死亡领主戒指

耳钉与镯轮:
  耳钉形制: 黑昙金与蓝色碎钻制成的七连环耳钉，能让导士阶以下魔法释放时节省六成魔力，附带技能耐奥祖穿心钉
  耳钉功能: 专门征召冥火骷髅法师，使用条件只是亲手杀死对手并取得一滴鲜血作为灵引；六翼天王斯托克顿被第三度利用后成为其中的冥火骷髅法师
  镯轮功能: 可以召唤出冥火骷髅法师，但召唤条件是宿主必须亲手杀死过对象，刘震撼最终选了十二连发的邪眼暴君
  召唤产物: 死亡领主装备可以召唤出八个浑身笼罩裴寂寒气、躯体凝结霜花的冰霜牛头人巡游者
  节魔定位: 节魔装备在爱琴大陆除刘震撼的死亡领主耳钉外还没听说过有其他种类

死亡领主萨穆埃尔:
  身份: 一万年前魔界的死亡领主，贴身兵刃是霜之哀伤，羚角吞口、结满雾凇的古雅长剑
  套装来源: 死亡领主套装是巫妖王斯科拉里诱骗萨穆埃尔穿上的邪恶魔法装备，能够潜移默化地改变拥有者的性格，把善良的人逐渐变成魔鬼
  十指剑芒: 死亡领主套装可以让穿戴者获得十指剑芒，代价是杀尽亲朋好友并把他们的亡灵变成戒灵与冥火骷髅法师，在黑昙空间中互相吞噬直至剩下最后一个戾气冲天的戒灵
  历史地位: 爱琴曾有人修炼出十指指芒，历史记载中最高者为死亡领主萨穆埃尔，其次是只有六指的荒野游侠阿拉贡
  法术前置: 万花朝宗的瞬间法力清零会转嫁给当时穿戴着死亡领主套装的人，萨穆埃尔正是依靠死亡领主套装的元素力量才能射出十指剑芒
  死亡一指: 萨穆埃尔的死亡一指饱含冰霜寒气，带有霜晶攻击和冷缩暴裂双重作用力，能在瞬间将人体冻至星碎

亡灵天灾:
  性质: 死灵系奥术的顶级禁咒
  施法门槛: 必须使用大量特制的奥术香料，除巫妖王之外其他魔族根本没有能力召唤使用，而魔族全族只有三位巫妖王
  代价: 亡灵天灾有冷却时间，一次不成功就意味着巨大无比的损失
  战史: 一万年前的神魔大战中，只有当时科技文明最发达的爱琴地精品尝过一次；魔族当年撤离爱琴大陆时曾裹挟两百多具巨龙骨骸一起撤离，并创造出基因型瘟疫亡灵天灾，消灭了绝大部分地精人口，从而灭绝了地精文化
  作用机理: 亡灵天灾对应特定的生命基因，再通过流动的人群大规模扩散，若无人因瘟疫大量死亡就不会产生恐慌与难民潮，传播范围便被锁死在狭窄区域内
  释放地点: 能释放亡灵天灾的地点是多洛特公国与卡瑞姆多大平原上范围够大的时空大裂缝
  解药: 吸香红豆可以立刻控制住亡灵天灾的传染源头，它由千叶茑萝的果实配合稀释后的生命之泉培植，千叶茑萝每一株都能结出上千颗果实；佩戴后体表形成净氧层，可吸收异味并净化成纯氧

与主角的关系:
  - 冥族目标是用何塞家的孩子换回被俘的血河大统领，二少三少在采玉城被掳走
  - 刘震撼在龙之墓地以死亡领主戒指汲取潮汐领主革瑞恩的血液，把它变成保持生前思想的戒灵
  - 刘震撼以血婴小癞痢格飞茵格里切宝的炼狱界名剑提尔锋，并领悟琴心召月光之陨竖琴齐射
  - 冥界大统领以暗黑失乐圆遁走，二少三少得保
  - 穆里尼奥默发冥语版名剑召唤，召出石中宝剑埃克斯卡利巴；茵格里切宝以时间遗忘法则定住位面三刹那，避过单控冬眠光环后以战剑穿其心口
  - 刘震撼的一剑劈伤血河大统领耐温尔因克，被萨尔国王列为世界大战的引线之一
  - 李察以死亡领主镯轮选定的第一个召唤对象是邪眼暴君

当前处境:
  - 冥族在南十字星森林一战损失惨重，骸河大统领阵亡、血河大统领被俘，七十万主力被森林之怒的古树根须绞杀埋葬
  - 茵格里切宝亲自出场增援采玉城，杀天鹅主祭穆里尼奥，最终以暗黑失乐圆全身而退
  - 冥界三大神器随三大统领一死一俘一逃而从历史上彻底变成过去式
  - 冥族与魔族的仇恨使其在魔龙、爱琴巨龙与冥族三方混战中同时对抗另外两方
