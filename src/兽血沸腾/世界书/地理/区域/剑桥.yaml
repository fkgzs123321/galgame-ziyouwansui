区域概况:
  - 比蒙王城两百公里处的沙漠绿洲，是奥斯崔特族鸵鸟人的驻地
  - 塔克拉玛戈大沙漠的源头部分夹在王国正西与正北两道海岸之间，沙漠形状像一个大鸭梨，最狭窄的梨柄就在剑桥绿洲这一端
  - 绿洲上有一座古代摩尼神庙旧址，修葺后成为比蒙剑桥祭祀学院的院址
  - 比蒙祭祀培养之地，海伦任大祭师，剑桥祭祀团驻地
  - 春季攻势预定为祭祀奥林匹克大会同时展开

绿洲与学院:
  剑桥绿洲: 王城两百公里处的沙漠绿洲，奥斯崔特族鸵鸟人驻地
  摩尼神庙旧址与摩尼神庙: 绿洲上的古代神庙，神像上有上万年不灭的青色圣火，那是美人鱼脂肪提炼的灯油
  康湖与康桥: 绿洲的水系与桥梁
  塔楼、驿站与兽栏: 绿洲上的设施
  比蒙剑桥祭祀学院: 院址设于绿洲上的摩尼神庙旧址
  剑桥祭祀团: 比蒙祭祀培养体系的实体

周边地形与通道:
  剑桥大沙漠: 海伦被调遣前往的沙漠地带，她将在那里的剑桥大祭师任上任职
  康湖水檀: 四百根十米长的水檀，不是钢铁因而不会被磁力吸附，在禁武的磁城里成了全军唯一可靠的枪杆
  兽栏: 骆马射手与鸵鸟骑兵的驻地
  四个沙漠绿洲: 王部参谋已掌握一千里范围内四个沙漠绿洲的分布图，意图与剑桥绿洲一起在王国西北部竖起屏障

祭祀体系:
  剑桥大祭师: 为表彰教育的重要性而新设的荣誉称号，划为等同红衣大祭司的最高品阶，授予孔雀翎祭祀袍
  祭师: 后期培养出的战舞教师统一授职为祭师，享受星袍待遇
  祭祀奥林匹克盛典: 一年一度，设死亡名额，同时举行剑桥大祭师加冕仪式与训兽师表演
  远征祭祀团: 比蒙远征塔克拉玛戈大沙漠的祭祀团总编制一百人，一半从奥林匹克年轻祭祀中选拔
  剑桥混编联队: 由鸵鸟战士编成的联队，含六名中队长

宗教与神祇:
  摩尼女神: 即魔梦女神，狮身人面美女是她的形象
  青色圣火: 摩尼神庙神像上万年不灭的灯油，由美人鱼脂肪提炼
  美人鱼灭绝: 三千年前摩尼神教捕杀淡水美人鱼致其灭绝
  斋戒: 盂盆节期间哈里发白天必须斋戒和祷告

势力分布:
  奥斯崔特族鸵鸟人: 剑桥绿洲的世居族群，出鸵鸟骑兵
  剑桥祭祀团: 海伦任大祭师
  博班: 只熟悉剑桥绿洲附近三百里
  骆马族: 驻绿洲的射手联队
  比蒙王国: 剑桥绿洲位于王国西北部，是比蒙设立沙漠屏障的支点

人物与器物:
  海伦: 福克斯狐女，红发系尼龙袜子条，手镯镶四块极品魔晶，胸口别美杜莎徽章，手戴七度金戒指，怀抱青铜版祭祀法典，手持黄金权杖
  姜之忍耐夔鼓: 海伦的祭器
  荆棘之光: 反弹百分之五十近战伤害
  孔雀翎祭祀袍: 剑桥大祭师的礼服
  脉冲引力香橼: 绿洲一带出产的魔法果实
  歌莉妮: 获称飞姬
  皮埃罗: 鸵鸟骑兵

战役与行军:
  - 祭祀团从沙巴克跋涉十五天抵达剑桥绿洲
  - 春季攻势将占四个沙漠绿洲加剑桥绿洲，可能再添一个小行省
  - 康湖水檀成交价从五十颗玛瑙被压到十五颗
  - 鸵鸟骑兵中队长皮埃罗出迎祭祀团；歌莉妮获称飞姬

注意:
  - 剑桥绿洲是沙漠中的绿洲，不是剑桥城或剑桥大学一类的人类城镇
  - 剑桥祭祀学院设在剑桥绿洲的摩尼神庙旧址；翡冷翠另有一处自办的祭祀学院，两者不是同一处
  - 摩尼女神就是魔梦女神，不是两位不同的神明
  - 剑桥大祭师是荣誉称号，等同红衣大祭司的品阶，不是行政职务
