区域概况:
  - 丝绸大陆由蛇类神兽构成的超阶门派，成员数量近五百，盘踞在唐藏帝国荷露城
  - 神兽在丝绸大陆是登记在册的合法居民，神兽们分成无数门派阵营
  - 丝绸大陆的天地灵气非常充沛，神兽地位与爱琴大陆的巨龙相当
  - 门派分山门与庄圆两处，庄圆建在荷露城的藕塘中央

驻地与工事:
  黎山门山门: 门派的山门
  黎山门庄圆: 荷露城中靠水而建的山精门派庄园，被夏宫卫队攻破后由唐藏军队接手
  黎山门庄圆城墙: 庄圆的城防，被航空兵与镜炮覆盖
  藕塘: 庄圆所在的湿地地形，只有一条通路
  路口封锁: 唐藏将军调大黄床架弩封锁路口，一再拖延交出人质
  城楼与照明烟花: 黎山门城楼灯火通明并放出照明烟花

阵法与防御:
  五行防御大阵: 唐藏最机密的军用守城设备，一个城市仅能配发一套，且是大型都市才有资格拥有；靠金、木、水、火、土五个系列的钻石才能制造，制作技术始终被唐藏皇室掌握
  阵法降级: 大阵被攻破一个部件后，由堪典罗盘师重新测定风水方位，剩下四个部件可构筑四象防御大阵；再破一次可构筑三才，最少可到两仪，防御能力逐重削减
  堪典罗盘师: 能根据天文星相和山川走势，利用司南罗盘测定风水方位，是真真正正的阵法灵魂；黎山门配有五行防御大阵却没有堪典罗盘师
  大型护盾结界: 黎山门人自设的结界，被黄金矮人法师集群击溃
  登空作战: 百余名神兽踩武器升空，抗打击力奇差

武技与秘法:
  隔山打布尔拳: 丝绸大陆传统武技，可隔物击物、隔空击物
  近身格斗与套路: 丝绸大陆传统武技的主流
  归来去兮露: 黎山门用以废掉壹条法力并制住白素青的药物
  爆内丹: 丝绸神兽的自毁手段，需运行内息走一套程序，不能立刻引爆
  截血指: 针对随时流动的血头，能作用于任何有血液的生物，却只能令人身体僵硬
  青雅.白玉: 本是黎山门第一年青高手，武技水准令黎山老母自叹不如

势力分布:
  黎山门: 蛇类神兽构成的超阶门派，为拆散白素青与壹条而以归来去兮露设伏，死伤近百人仍未讨到便宜
  黎山老母: 门主，墨玉金线蛇
  法江: 二当家，赤火毒龟，终被废去四肢双眼并取出毒火龟珠
  白素青: 门主最小的学徒，青玉灵蟒，被推入七宝塔禁锢法阵
  黎山门门人: 三四百名神兽在主力蒸发之役后不见踪影
  唐藏亲王冬五: 以慈悲为怀劝阻刘震撼大开杀戒，怕引发其他神兽门派同仇敌忾
  夏宫卫队: 血洗黎山门的比蒙部队

战事:
  - 黎山门趁势以归来去兮露废掉壹条法力并制住白素青，壹条仍打死打伤将近一百位黎山门人
  - 唐藏将军调大黄床架弩封锁路口，美杜莎是冷血生物，热源感应捕捉不到，五百名幻兽矢车箭手挡不住其跳水逃跑
  - 夏宫仆射射断吊桥铁链，百多位祭祀的战歌光环刷新全军，内德维德以心灵指引箭连穿数人
  - 温格以龙语大召唤术唤出六头元素龙，安瑞达化作黑烟巨兽
  - 法江以勾结外人残害同胞相威胁，五位人类大魔寻师为他打上锢魔烙印，终被取珠
  - 小空揭穿黎山门护盾实为唐藏皇室独有、一城仅配一套的军用机密

注意:
  - 黎山门是丝绸大陆的神兽门派，不是唐藏帝国的官方机构
  - 五行防御大阵本是唐藏皇室机密，黎山门私藏一套属于越制
  - 黎山门庄圆在荷露城中，山门与庄圆是两处不同的地点
  - 神兽在丝绸大陆是登记在册的合法居民，不是魔兽
