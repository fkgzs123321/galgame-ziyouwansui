区域概况:
  - 故事主舞台，比蒙、人类、海族、巨龙与凤凰共存的主位面
  - 已知的异界有冥界、龙界、魔界与深渊世界，爱琴大陆与它们之间有时空裂缝连通
  - 大陆以外另有澈桑大陆、黄金海岸大陆与丝绸大陆，海洋的疆域远比陆地宽广
  - 一千年前的海加尔战役后兽人退守多瑙荒原，人类牢牢占据大陆其余部分
  - 人类在千年之间分裂成大大小小数十个国家，各自为政，彼此攻伐不休
  - 泰穆尔拉雅雪山横亘大陆中部，安第斯信风的暖流越不过唐古拉峰，把春天留给了多瑙荒原
  - 陆上进出多瑙荒原只有多洛特隘口伊夫堡一个通道，两侧是泰穆尔拉雅雪山与白令山脉构成的封闭倒三角
  - 大陆腹心是卡瑞姆多大平原，面积三百三十二万平方公里，爱琴最大的产粮地

人类诸国:
  圣弗郎西斯科帝国: 三大军事强国之一，霸占卡瑞姆多平原大部，拥有爱琴最强步兵白银基座战士，也是魔法强国
  庞贝帝国: 三大军事强国之一，地处雷霆山脉，矿产丰富，是炼金强国，重装巨镰武士配三层精铁塔盾
  圣荷西帝国: 三大军事强国之一，爱琴腹地东大门，八百里密西西比湖占其三分之一领土，以十连发弩炮与圣甲虫折叠跳弩闻名
  多洛特公国: 唯一与比蒙王国接壤的人类国度，号称佣兵之国，名义上属于耶斯特王国
  慕兰帝国: 塔克拉玛戈大沙漠中的沙漠帝国，以飞驼军团闻名，通行苏丹、哈里发与阿訇的称谓，奉拜火教
  特拉维夫: 山的另一边的人类国度，以狂战士闻名，是比蒙唯一尊敬的人类国度
  唐藏帝国: 东方丝绸大陆当下最强大的国度，来往爱琴的东方商人多出自那里
  云秦帝国: 丝绸大陆上曾经最强盛的古代国度，早已不存，如今只有徐氏一族的后人还记着它
  梵特帝国: 设有蒙田学院，以哲学与思想之学研究闻名
  诺伊维尔公国: 设有条顿骑士学校，以系统的指挥作战训练闻名
  圣阿尔玛尼公国: 卡瑞姆多平原上的小国，出条顿武士
  圣安东尼奥公国: 卡瑞姆多平原上的小国
  圣罗兰士与圣瑞雪尔: 号称爱琴两大永久中立国，各藏有一部梦幻结界塔
  波尔图公国: 卡瑞姆多平原上的小国，盛产魇马
  商业大联盟: 顿河以南的商贸城邦联合体

教廷与神权:
  - 圣保罗教廷是整个爱琴人类世界的精神中枢，历代教皇驻在帝梵西城
  - 帝梵西城由海加尔时代的神圣帝国同盟划拨，是永久领土，世俗称为神之领土
  - 帝梵西城建在卡瑞姆多最富饶的伏门尔加河流域，夹在圣弗郎西斯科帝国与两个公国之间，占地一百二十亩
  - 教廷有两支圣骑士团，分别是金棕榈骑士团与宝剑橡叶骑士团，拱卫神之领土的仅四百名圣骑士
  - 爱琴绝大部分人类国度的国王由圣保罗教皇册封加冕，神之领土不存在被攻击的可能
  - 帝梵西城的居民全是苦修教士、神甫、牧师与最虔诚的信徒，不见俗务

主要城市:
  帝梵西城: 圣保罗教廷所在地，神之领土，全爱琴唯一的宗教圣都
  沙巴克: 比蒙王都，建在地下苦海之上，城内水源多为苦水，王宫甜水取自御苑的秋刀湖
  威瑟斯庞: 比蒙东北行省首府，狐族之城，比蒙古语意为荒原上的珍珠
  加里曼丹城: 慕兰西部行省省会，哈里发的驻地，城中有专门贩卖比蒙美女的奴隶市场
  大马士革城: 慕兰帝国的都城，驻有十八尊光之乞愿塔
  耶鲁绿洲: 塔克拉玛戈大沙漠中的绿洲，有椰枣树与水源

大陆地标:
  卡瑞姆多大平原: 爱琴腹心与最大产粮地，四周有十来个人类国家，除帝梵西外人口都在三百万以上
  泰穆尔拉雅雪山: 横亘大陆中部的巨大雪山，上到唐古拉峰山口只有一条路
  白令山脉: 比蒙王国西部边界的山脉，翻越之后是野蛮人国度与十万大山
  十万大山: 白令山脉以南的群山区，龙族的彩虹龙城与辰星龙城坐落其中
  南十字星森林: 大陆上重要的森林地带，精灵与牧树人在此居住，也是时空裂缝的少数分布地之一
  落日大沼泽: 比蒙西南边境的沥青湖群与沼泽，多瑙荒原与人类世界的天然分隔
  阿尔卑斯湿地: 卡瑞姆多平原以东的沼泽地带，内有忘忧谷，两侧住着十三个溪谷矮人部落
  火鹘山脉: 大陆北部的山脉，维京后裔的莽莽北国在其以北
  顿河流域: 圣荷西帝国引为天险的黄金水道，海族入侵时最早的主战场
  密西西比湖: 八百里水面，占圣荷西帝国领土的三分之一
  冰封之海: 大陆北端的冰封水域

海族与海域:
  - 西雅海国是海洋第一大国，幅员比爱琴大陆宽阔数倍，王室为美人鱼
  - 亚力士海国的王族是塞壬，水陆两栖，擅长精神控制之歌
  - 香帕海国由娜迦掌权
  - 两大海国之间预留了普莱恩族虾人的缓冲海域
  - 装载军队的舰船不许从西雅海族头顶的天空经过，只有签约的人类国度商船得以放行
  - 上千年前的海陆大战，仅一个西雅海国就把爱琴打得血流成河，比蒙水族十去其九

龙族与异界:
  - 彩虹龙城全部是雌性仙女龙，辰星龙城全部是雄性七彩龙，两座龙城共同守卫爱琴大陆的龙之墓地
  - 龙之墓地一万年前共有四个，两个最大的在两座龙城之内，另两个小墓地在爱琴大陆北端
  - 魔族扫荡爱琴时把那两座无人看守的小墓地挖掘一空，取走两百多具龙骨
  - 凤凰与独角兽同样稀见，多数人类国度终其国祚也未必见过一头
  - 大陆上分布着大量时空裂缝，其中卡瑞姆多大平原最多，比蒙王国只有白令山脉与南十字星森林有少量

历法与纪元:
  - 从远古时代开始，爱琴大陆每隔两千年更换一个新纪元
  - 人类掌控大陆之后，为编撰史书方便，确立以一万年为一个纪元单位
  - 爱琴历之前的纪元被统称为爱琴古历，一百一十五年以前古历刚好满一万年，之后是新历
  - 当下是爱琴历一百一十五年冬季，折合香帕历两千一百一十五年
  - 哑月每隔一万年从天外飞来一次，每次在爱琴大陆停留三十六年，期间会搅乱大陆的元素排列
  - 哑月是数万年前远古文明建造的空中壁垒，能抵消地心引力自行悬浮，可环游世界甚至潜进深海
  - 上一回哑月到来导致魔族从时空裂缝大举入侵，教廷推算这一回它会在桑干河之中降落

通行与边地:
  - 多洛特隘口上的伊夫堡由多洛特公国镇守，城中驻着西多夫元帅的银色弯月军团与常备佣兵
  - 桑干河上没有桥梁，两岸交通只能靠舟楫，雨季与冬春冰封期道路断绝
  - 蛮荒古道是穿越荒原的通道，多洛特掠夺者经此潜入比蒙王国绑架狐族少女
  - 落日大沼泽与阿尔卑斯湿地雨季泥泞难行，是天然屏障
  - 剑走偏锋的商队会绕开渡口，从芦苇丛掩护处涉水过河
  - 魔法传送阵是跨区域调兵与通商的主要手段，每一处传送坐标都独一无二

注意:
  - 三大军事强国是圣弗郎西斯科帝国、庞贝帝国与圣荷西帝国，梵特帝国不在此列
  - 泰穆尔拉雅雪山与白令山脉共同构成伊夫堡的天险，翻山进入荒原并不可行
  - 全爱琴最强大的数十个人类国度合计只有两个龙骑士，龙骑士不是随处可见的战力
  - 海加尔战役之后人类再没有人愿意出头挑起与比蒙王国的大规模战争，边境冲突却从未停止
  - 卡瑞姆多大平原周围的人类国家人口多在三百万以上，帝梵西城是唯一的例外
