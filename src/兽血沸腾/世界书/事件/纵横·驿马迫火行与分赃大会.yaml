@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 245 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 254
纵横·驿马迫火行与分赃大会:
  舞台: 全篇留在翡冷翠红土高坡。领主府的内务厅、后山的孵化洞、红土广场的炼金工坊与地底的传送阵房各自成戏；冰凰栖在后山的冰窟，两支堕落精灵的地底驻兵还扎在废矿旁边，兵工厂里四大铁匠已经开工
  前置条件: 壹条已西行，白素青自囚七宝塔未出；猛虎佣兵团团长罗西带夫人米娅与八百余森林精灵来投，兵工厂刚集齐四大铁匠；唐蓓尔金娜早产的凰蛋孵不出来，穆里尼奥扬言要为此杀人；玩家刚从美杜莎那边脱身，海伦与凝玉各自盯着领主府的账
  关键节点:
    内务统筹与兵工厂:
      触发: 加内特再次上门索要美婢，猛虎佣兵团同时抵达
      地点: 翡冷翠领主府内务厅
      在场: 玩家，凝玉，加内特，罗西，米娅
      经过: 加内特张口要美婢，玩家塞给他两个食人魔女奴，把话堵死；猛虎佣兵团团长罗西带着夫人米娅与八百余森林精灵投奔，兵工厂就此集齐四大铁匠；玩家顺手把这支佣兵团编进夏宫卫队的外围，又发现两支堕落精灵的地底驻兵留在废矿旁边是个隐患
      玩家可接: 一、先把地底驻兵的位置与人数摸清，再谈佣兵团的安置；二、把四大铁匠的产能排开，优先出皇冠荆棘战甲的配件；三、让罗西以佣兵身份守外围，不给他们正式编制
    孪生血婴:
      触发: 咸水夔牛牛黄误治冰凰，唐蓓尔金娜早产
      地点: 后山孵化洞与冰窟
      在场: 玩家，唐蓓尔金娜，穆里尼奥，安度兰长老，果果
      经过: 众人拿咸水夔牛牛黄去治冰凰，反而把早产的凰蛋冻成冰雕，蛋里孵不出来；穆里尼奥扬言杀他；玩家砸开冰雕血饲，孵出两只血婴，一只长着霜雪皮丘兽的模样，另一只酷似穆里尼奥的男婴
      玩家可接: 一、把两只血婴的来历瞒住，先安顿好冰凰；二、请安度兰长老验一验血婴的元素波动；三、先跟穆里尼奥把话说明白，别让他先动手
    天下第一伦理错乱:
      触发: 两只血婴落地后抽取宿卵的元素力量，冰凰与蛋的来历被摊开
      地点: 领主府内务厅
      在场: 玩家，穆里尼奥，安度兰长老，唐蓓尔金娜，凝玉
      经过: 血婴会抽取宿卵一半元素力量，还能延续法师的寿命；两只血婴身上测不到元素波动，众人推断那枚凰蛋是穆里尼奥与冰凰之子，遂取名唐家二少与唐家三少；玩家被这层关系绕得头疼，只能先按下不表
      玩家可接: 一、把二少三少的姓氏与名分定下来，免得日后翻账；二、趁着血婴能延续寿命这条，摸清它对玩家自己的用处；三、把这件事封在领主府内，不放风到神庙与军方
    调皮的儿子与凤凰之秘:
      触发: 两只血婴失踪，全城大乱
      地点: 翡冷翠全城与后山
      在场: 玩家，果果，安度兰长老，摩尔亲王贝尼特斯，卡鲁
      经过: 兄弟俩从卓尔精灵空骑士手里抢来一枚奇美拉卵，把冰雕飞凰搬去替换雪山山洞里的凰蛋，自己化成两棵佛肚竹；他们又化佛肚竹、在桑干河化成一只鸢尾大鸟合体飞行、再化成一红一白两朵并蒂莲；摩尔亲王警告这样下去会把宿卵的元素力量抽干；玩家谎称宿卵是蜡溶妖，长老却指出血婴的咳嗽是先天风寒；安度兰长老随后揭出凤凰的分支与凤凰之神夏圭维持世界平衡的旧事，飞廉、鸠鸟与巨龙都只能充当比蒙坐骑，黄金家族的血脉与凤凰作为精灵专属魔宠的关系一并摊开
      玩家可接: 一、先把化形乱跑的兄弟俩找回来，别让摩尔亲王看清底细；二、追问安度兰长老凤凰之神夏圭的旧事，弄清宿卵的来路；三、把先天风寒先治住，免得耽误孵化
    冰霜巨龙与剑咏绝技:
      触发: 穆里尼奥凭外籍精灵身份赢得神圣凤凰滴血认亲
      地点: 后山冰窟与红土广场演武场
      在场: 玩家，穆里尼奥，安度兰长老，唐蓓尔金娜，果果
      经过: 穆里尼奥以钻石家族的身份认下凤凰血脉，二少与三少被断定是受诅咒的鹣鲽，永生永世不能分开；两只血婴可以化身任何动植物，但变身时没有魔法；安度兰长老自承真身是五阶冰霜巨龙阿斯顿维拉·安度兰·帕克；冰凰登门道谢时被冰雕所惑，请求带两子回采玉城小住；玩家趁机修习摩尔剑咏，只学会起手剑式，索性换上一柄无柄战斧，自称圣奇奥斧咏，断臂与鼻洞这才渐愈
      玩家可接: 一、放二少三少随冰凰去采玉城，换穆里尼奥一份人情；二、把无柄战斧的斧咏练成套路，别停在起手式；三、拿安度兰长老的冰霜巨龙真身做底牌，先不外传
    分赃大会:
      触发: 战利品清点完毕，奥胖与茉儿各得重宝
      地点: 红土广场炼金工坊
      在场: 玩家，凝玉，安度兰长老，奥特加，茉儿，艾玛尔
      经过: 无柄战斧的月刃式钩型双翼定型，堤丰巨人焊接铁箱装载两百把，一息双发千码压制；摩尔亲王被圣奇奥鸡尾酒法术式的双重混搭吓傻；玩家把龙力与血系双修之理讲给众人，奥特加与茉儿各得重宝；了望者号角与死亡领主的护盾、姜之忍耐夔鼓、萨拉斯火焰魔弓各归其主，小修女贞德获一名不死战士，逃兵娜迦与塞壬被放逐远东；众人随后赴沙巴克王城参加奥林匹克盛典，安度兰长老独自留在高坡，醒悟那个诅咒已经应验
      玩家可接: 一、把两百把无柄战斧先装备夏宫卫队，再谈外销；二、让艾玛尔继续改斧咏的配件，把一息双发的射程再推远；三、带人去沙巴克赴奥林匹克盛典，把安度兰长老留在高坡看家
  本章可用资源: 加内特的人情与两个食人魔女奴、猛虎佣兵团的八百余森林精灵与团长罗西、兵工厂的四大铁匠、咸水夔牛牛黄、冰凰唐蓓尔金娜、二少与三少两只血婴、佛肚竹与鸢尾大鸟的化形、并蒂莲、安度兰长老的五阶冰霜巨龙真身、无柄战斧与月刃式钩型双翼、两百把量产战斧与堤丰巨人的铁箱、了望者号角、姜之忍耐夔鼓、萨拉斯火焰魔弓、死亡领主的护盾、茉儿与奥特加手上的重宝、沙巴克奥林匹克盛典的入场资格
  本章主要压力: 两支堕落精灵的地底驻兵留在废矿旁边，随时能反手封住传送阵房；唐蓓尔金娜早产又误治，冰凰与凰蛋都被冻住，穆里尼奥已经放话要杀人；两只血婴抽取宿卵一半元素力量，摩尔亲王警告再抽下去宿卵会毁；二少与三少是受诅咒的鹣鲽，永生永世不能分开，一旦被当作战利品两边都要翻脸；玩家只学会摩尔剑咏的起手式，断臂与鼻洞还没全好；安度兰长老悟出诅咒已应验，这话压在他自己身上
  章末落点: 血婴二少与三少的名分与化形能力定下，冰凰登门谢过并带走两子；分赃大会把战利品分派干净，无柄战斧与姜之忍耐夔鼓各归其主；众人启程去沙巴克参加奥林匹克盛典，安度兰长老独留高坡
