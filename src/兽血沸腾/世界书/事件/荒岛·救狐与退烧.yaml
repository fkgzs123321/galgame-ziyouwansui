@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 3 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 5
荒岛·救狐与退烧:
  舞台: 荒岛营地从沙滩挪到背风的红柳林与土丘之间，陆续搭起茅草屋、蓄水池与蚌壳灶；红柳林里有会喷水箭的肥兔，浅海里能钓上四五斤的大鱼，海鸟成群落在礁石上
  前置条件: 从沉船里捞回来的狐狸女孩一直昏迷高烧，浑身赤裸，尾巴上的毛被海水泡成一绺一绺；玩家自己的鼻梁塌成两个窟窿，手臂还没受伤，岛上没有药、没有布、没有锅
  关键节点:
    体温与冰块退烧:
      触发: 女孩烧得烫手，气息越来越弱，果果蹲在旁边啃鱼骨
      地点: 荒岛临时营地
      在场: 玩家，昏迷的狐狸女孩，果果，一头通体瓦蓝的巨狼（已死）
      经过: 他脱掉自己的破衣把人裹住，用体温抱着她熬到天亮；让她含着果果冻出的冰块，用嘴对嘴的方式把椰汁一点点渡进去，烧总算退了下去；换褥子时他的手碰到了她毛茸茸的尾巴
      玩家可接: 一、把她藏进茅草屋最里侧，先不问她是谁；二、趁她没醒把沉船上搜来的东西清点一遍；三、守在旁边等她睁眼，先把话问在前面
    造锅记与水箭魔兔:
      触发: 他去砍红柳树搭梁，红柳林深处蹿出一只会喷水箭的肥兔
      地点: 红柳林、营地与浅海礁石
      在场: 玩家，昏迷的狐狸女孩，果果
      经过: 水箭射穿他的胳膊，他追进林子把肥兔宰了炖成兔肉；他用嚼碎的方式把兔肉和鱼汤一口口喂给女孩，用弯刀在茅草屋门口挖出蓄水池，用弓箭射落海鸟，又把长袍拆成鱼线钓上一条四五斤的大鱼；他用鱼肋骨穿上鱼肠给自己缝好手臂伤口，却在煮东西的蚌锅水面上看到自己塌成两个窟窿的鼻子
      玩家可接: 一、把肥兔的巢找出来，把肉源固定住；二、先把蓄水池挖深，把饮水稳住；三、趁着鱼群还在，把晒鱼干的办法试出来
    瓜棚与开口说话:
      触发: 他吃野瓜吃坏了肚子，一夜泻到脱力，天亮发现女孩已经挣扎着做好了饭
      地点: 荒岛营地与瓜棚
      在场: 玩家，狐狸女孩，果果
      经过: 女孩把褥子让给他，自己缩在草堆里；他铲回长着瓜苗的粪便移栽成瓜棚；她开口唱歌为他行智慧启蒙，歌声落下两人接了吻，她第一次说话，讲出处女花冠对祭祀意味着什么
      玩家可接: 一、问她是什么人、从哪来、能不能带自己离开；二、先把瓜棚与蓄水池修好，稳住两个人的吃喝；三、旁敲侧击地打听她唱的那首歌是什么
  本章可用资源: 果果冻出的冰块与它的冰冻魔力、蓄水池与蚌壳灶、弓箭与自制的鱼线鱼钩、红柳木与茅草、肥兔的肉与皮、四五斤的大鱼与海鸟、女孩身上的女式里衣与祭祀袍残片
  本章主要压力: 岛上没有药，女孩的烧随时会反复；玩家的胳膊被水箭射穿，伤口只能自己缝；淡水要靠雨水与椰子，蓄水池还没挖好；荒岛周围有鲨鱼，出海打鱼等于赌命；女孩身份不明，可能是被贩卖的奴隶
  章末落点: 女孩开口说话，两人语言打通；玩家从她口里第一次听到祭祀、战歌与处女花冠的说法
