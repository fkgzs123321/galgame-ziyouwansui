领主期·剑桥祭祀学院:
  舞台: 白令山脉脚下的达多村刚经历一场龟灾，村外林地还留着时空裂缝的痕迹；南十字星森林从山脚一路铺进荒原深处，林间有不曾见过的人形树影；再往南是墨晶峡谷，谷口的兵站用原木与黑石垒成，站后那条矿洞就是暗精灵的地盘
  前置条件: 海伦的科摩多战争巨兽阿拉贡已经签下心灵契约，她往后注定要拿战鼓当乐器；队伍缺粮缺向导，马车上的物资只够撑到下一个集镇；星尾龟的尸体还倒在村外，没人去动它身上那颗漆黑的珠子；博格村采石场赎出来的獒人跟在队尾，古德带着二十名潘塔武士押后；神庙给海伦的任命状还揣在行李最底下，剑桥那边一直没有消息
  关键节点:
    偏门的龟珠与半身人主厨:
      触发: 玩家动手剖开星尾龟的尸身，海伦抱着新得的战争巨兽在旁看着
      地点: 白令山脉达多村外
      在场: 玩家，海伦.列娜，凝玉，艾薇尔，果果，罗伯特.巴乔，半身人长老
      经过: 硝石与松节油的味道还压在村子上空，玩家从星尾龟体内剜出一枚顶级晶核，又掏出一颗漆黑发亮、随手一搓就散出酒香的龟珠；半身人长老捧着珠子手都在抖，讲出龟珠泡水即出酒、能酿出比人间任何酒都香醇的东西，霍比特人一旦得了它，等于把整座世界交到手上；长老当场把话挑明，要拿这门酿酒的手艺换一个位置，玩家顺势定下日后由半身人做采邑烹调主管
      玩家可接: 一、把龟珠与主厨一并收下，采邑的酒窖从此交给半身人打理；二、先扣着龟珠谈价，让长老把酿法与配料先说全；三、不动龟珠，只应下半身人日后随队掌灶的事
    下一站天王与身份泄露:
      触发: 半身人长老把烤好的岩蛙腿端上来，劝玩家带走随队主厨
      地点: 达多村与南十字星森林边缘
      在场: 玩家，海伦.列娜，凝玉，艾薇尔，果果，古德，贝拉米，罗伯特.巴乔
      经过: 果果扒着艾薇尔的胳膊不肯松开，谁劝都不走；玩家一个人往南十字星森林去，临行前把龙祭祀的名头漏了出来，罗伯特当场呆立当场，贝拉米与古德趁乱顺走了他揣在怀里的雪茄；林子里魔兽出没的路数不清，玩家一边猎杀一边取晶核，整条路上的收获都记在随身的皮袋里
      玩家可接: 一、把龙祭祀的名头认下来，借着它往南十字星森林里压服沿途的部落；二、先追回雪茄与走漏的口风，把这桩事压回队伍内部；三、把海伦与果果留在村里看守辎重，自己只带古德进林子
    一笔大生意与恩特族牧树人:
      触发: 夜里的营火引来了寻香而至的人形树影
      地点: 南十字星森林深处
      在场: 玩家，恩特族牧树人
      经过: 牧树人自报是恩特族，是由植物进化来的智慧人类，与动物进化的族群本是两路；他拿出元素之泉、桫椤蕉与千色茑萝的种子，要换玩家手里的香瓜种子，双方当场把买卖做成；玩家趁对方不备，把两加仑元素之泉灌进自己的皮囊；牧树人顺口讲出上万年的森林才能生出生命之泉，一滴就能让荒芜之地变成沃土，也能让草木在一日里长到十年后的模样
      玩家可接: 一、把这一笔做成长久的往来，先订下种子与泉水的互换；二、只取眼下的份量，先把泉水的来路与效用问明白；三、不与牧树人照面，摸清水源的位置自己取
    厄运连连与墨晶峡谷兵站:
      触发: 玩家持军部文书抵达墨晶峡谷兵站，熊人中队长维埃里在站口接人
      地点: 墨晶峡谷兵站与站后的暗精灵矿洞
      在场: 玩家，维埃里，海伦.列娜，布尔战士，牛头人战士
      经过: 维埃里把军部的授权文书摊在桌上，命玩家带人进暗精灵的地盘，营救被困在里面的唐藏帝国亲王；他讲清暗精灵是由精灵一族为着追求黑暗法术堕落而来，箭术非凡又阴险，黑暗法术更要命，还霸着那片上万年的森林独占生命之泉；队伍刚进洞就吃了箭雨，牛头人在黑暗里看不远，倒下的人比预想的多得多
      玩家可接: 一、接下军部的差事，先把授权上的粮械与向导要足；二、先探明矿洞的地形与暗精灵的布防，再押着人往里走；三、只把维埃里当向导，救人的条件另谈
  本章可用资源: 星尾龟身上的顶级晶核与能酿酒的漆黑龟珠、半身人长老的酿酒手艺与即将到任的随队主厨、两加仑偷灌来的元素之泉、桫椤蕉与千色茑萝的种子、猎杀魔兽攒下的一整袋晶核、海伦与科摩多战争巨兽的心灵契约、贝拉米与古德那批獒人与潘塔武士、维埃里出示的军部授权文书与兵站的粮械、夜明珠与星辰精钢弹簧狼牙棒密集阵
  本章主要压力: 军部的授权书是一道催命符，救不出亲王就是抗命，救得出也未必有功劳；暗精灵的箭在洞里没有死角，牛头人的夜盲是硬伤；龙祭祀的名头一旦传开，神庙与沃尔夫军团都会盯上这支队伍；元素之泉的来路是偷灌来的，牧树人若回头追讨就是一笔烂账；剑桥那头一直没有任命下来，海伦的战舞与战鼓还没有正式的名分
  章末落点: 玩家手里多出一份龙祭祀的名头、一位半身人主厨和一袋能酿酒能换钱的龟珠，脚下却踩进了墨晶峡谷的暗精灵矿洞；洞里的箭雨刚歇，一名喝了生命之泉的匹格魔法师还等着他去认
