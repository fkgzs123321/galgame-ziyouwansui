纵横·淫亵战歌的后人:
  舞台: 从多瑙大荒原一路走到王都沙巴克。荒原上只有流浪牧民的帐篷与匪帮的旧营，进城之后是王宫、主神庙、金冠角斗台与贵族包厢；主神庙分莱茵、穆里尼奥与泰戈三派，各占一处院落，祭祀盛典就在这几处之间来回转场
  前置条件: 玩家刚以自创汉语战歌领悟战神光辉之神曲，被神庙封为神曲萨满；海伦的外公沃勒尔升任训兽总长并获伯爵头衔，海伦与茉儿已被皇家马车接走；狮虎王子李察率五十名战神之鞭牦牛重骑兵随后入城，歌坦妮随侍；内德维德、邓肯与果果随队，玩家手上没有沙巴克的通行文书
  关键节点:
    神曲萨满与国王的邀请:
      触发: 玩家随天鹅主祭穆里尼奥横穿多瑙大荒原赴王都，途中忽然顿悟
      地点: 多瑙大荒原与沙巴克王宫
      在场: 玩家，穆里尼奥，海伦，茉儿，果果
      经过: 队伍沿途向流浪牧民布道剿匪，玩家以自创的汉语战歌领悟出终极战歌战神光辉之神曲，就此挂上神曲萨满的名号；狮虎王子李察率五十名战神之鞭牦牛重骑兵迎上，外公沃勒尔升任训兽总长获伯爵头衔，皇家马车把海伦与茉儿先接走
      玩家可接: 一、把神曲光环的效力摸清，再决定怎么在盛典上亮出来；二、先跟李察把礼节走完，别在入城前就结怨；三、让海伦与茉儿先进宫，自己带队伍随后跟上
    井底之蛙与后台强劲:
      触发: 李察讥讽翡冷翠民兵是杂牌，双方在王宫门前动手
      地点: 沙巴克王宫门前
      在场: 玩家，李察，邓肯，歌坦妮，内德维德
      经过: 李察当众讥讽民兵，邓肯自称米诺陶斯人顶了回去，玩家与王子互殴，歌坦妮从旁劝阻；红衣大祭司布拉特霓下携两位角蝰神使与狮心亲王卡恩到场，卡恩要求军部发落民兵；玩家剥下王子臀部的甲片，被虎尾抽脸，内德维德以魔弓震慑全场
      玩家可接: 一、先把赌斗的由头握住，别让军部先把话说死；二、请布拉特霓下当场评理，把神庙拉进来；三、收手退让，把李察的账记到盛典上再算
    魔歌武三修祭祀与新颖的加冕仪式:
      触发: 李察狂化冲阵，两位祭祀与两位草原精灵法师随他上场
      地点: 沙巴克王宫广场与主神庙
      在场: 玩家，李察，邓肯，果果，穆里尼奥，布拉特
      经过: 玩家用迟钝光环加两道固态蛛网术裹住狂化的李察，果果率孪生血婴变成连体牧树人痛打剑甲龙，穆里尼奥以火凤凰威压制止混战；众人的结论是玩家走的是魔歌武三修祭祀的路子；邓肯在金属图腾柱与广场战神雕像之间连发两道神曲光环，布拉特当场点破神曲萨满的身份逼退王子，玩家换上歌唱衣冠等萨满装备
      玩家可接: 一、趁神曲萨满的身份公开，把装备规制一次办齐；二、让邓肯把两道神曲光环的用法写成册子；三、先盯住李察那边的追随者，别让他们在盛典上再挑衅
    初夜权与夜生活:
      触发: 沙巴克主神庙设清水面包之宴款待新封的萨满
      地点: 沙巴克主神庙
      在场: 玩家，布拉特，海伦，茜茜
      经过: 神庙分莱茵、穆里尼奥与泰戈三派，宴上请玩家以首席萨满身份随军出征沙漠，掠夺铁匠与矿区，又请封狈人沙罗曼为侍从神官；玩家看破自己是神庙与军方争夺战利品的出头鸟，仍装傻应承；布拉特霓下以姆格酒相待，把守宫、宫相与国子监这些古代神职称谓逐条讲明：守卫寝殿的壁虎兽亲称守宫，管家称宫相，账务主管称国子监，都算侍从神官
      玩家可接: 一、收下姆格酒与侍从神官的编制，把班底搭起来；二、答应随军出征沙漠，先谈妥铁匠与矿区的分配；三、把守宫与宫相的任命压后，先看清神庙三派的强弱
    禁卫军的消息与四重力道纹:
      触发: 贝拉米与内德维德拆了射戏摊子，四位绿党族螳螂刀圣现身
      地点: 沙巴克街市与海沟虹族驻地
      在场: 玩家，贝拉米，内德维德，希勒，切尼，果果
      经过: 半身人厨师偷吃第六顿晚餐被抓，四位绿党族螳螂刀圣来自王宫内廷，禁卫军刀法总教官希勒出面；希勒要求绿党僧侣回族群结婚生子，被玩家以苦行僧禁欲教义回绝，他索性宣布可设巫医神官收编僧侣；海沟虹族族长切尼替他纹刺青，背后山猛虎、左右臂各一行词句、大腿根两幅敦煌飞天神女，一共得下四重力道纹
      玩家可接: 一、把绿党僧侣正式编成巫医神官，收进夏宫卫队；二、先承受切尼的纹刺青，把四重力道纹拿到手；三、跟希勒谈禁卫军刀法的互授，别只换人情
    国王、王后、公主与海伦时间:
      触发: 祭祀盛典开幕，布拉特引见十一位主祭
      地点: 沙巴克金冠角斗台
      在场: 玩家，海伦，茉儿，布拉特，国王格雷克.萨尔，安琪尔王后，穆罕·阿里，茜茜
      经过: 国王格雷克.萨尔携安琪尔王后入场，调拨海伦赴剑桥绿洲建立祭祀学院，王后认海伦为义女；教宗点圣凯路袋鼠主祭穆罕·阿里下场与海伦比拼战歌光环，金冠角斗台上战舞压制，夔鼓爆出邪恶光环与辉煌光环，盐霜、石肤、荆棘、闪电多重护甲齐出，姜之忍耐夔鼓与血羽之心的来历当场揭示；茉儿与契克因族祭祀茜茜对垒，茜茜放出三胞胎三头火焰鳄首龟，茉儿以九连环闪电与云秦金人应对
      玩家可接: 一、让海伦把夔鼓的三重光环打成定式，再上台加赛；二、盯住茉儿的九连环闪电，别让金人的冷却空档露出来；三、借王后认义女的由头，把海伦的剑桥任命敲定
    淫亵战歌的后人:
      触发: 穆里尼奥以黄金笛与腹语术演示自创战歌
      地点: 沙巴克金冠角斗台与神庙
      在场: 玩家，穆里尼奥，茜茜，海伦，国王
      经过: 穆里尼奥吹黄金笛、用腹语术演示自创的大风歌，风刃集群把大理石花坛切碎，帝维水晶偷录全程；茜茜请求为三百二十四年前被烧死的祖父普拉蒂尼正名，玩家顺势质疑法典记载；茉儿先前已用帝维晶卡播放驯狮女与火眼狻猊的光幕破掉琶琴心理战，又把黑昙光环加在神曲之上
      玩家可接: 一、接茜茜的请求，把普拉蒂尼的案子翻出来重审；二、让帝维水晶把大风歌录全，回头当作册子发下去；三、先在神庙里查法典第一百八十四页的原文，再谈正名
    抬杠与决斗:
      触发: 长老院昆丁与贵族要求烧死异端
      地点: 沙巴克神庙与金冠角斗台
      在场: 玩家，茜茜，老雷德克纳普，斯普雷维尔，茉儿
      经过: 首席昆丁老雷德克纳普接手火刑，茜茜当众承认掌握简爱战歌，玩家质疑法典的记载；狼族主祭斯普雷维尔发起决斗，召出潮汐领主当场斩杀其魔宠；国王以三百年无危害为由劝阻教宗，穆里尼奥与崔蓓茜随后揭出真相：祭祀神话普拉蒂尼因竞选红衣大祭司、破坏莱茵与泰戈的三权平衡而被诬陷为异端，契克因本非天生妓户；国王单独召见玩家与海伦，授予战神骑士勋章，又警告新贵远离权力是非圈，明言无法为简爱战歌正名
      玩家可接: 一、把普拉蒂尼被诬陷的真相按住不宣，换国王的庇护；二、替茜茜把决斗接下来，用神曲光环压住狼族主祭；三、先收下战神骑士勋章，把神庙与军部的争夺往后拖
  本章可用资源: 战神光辉之神曲与神曲光环、歌唱衣冠等萨满装备、迟钝光环与两道固态蛛网术、孪生血婴所化的连体牧树人、穆里尼奥的大风歌与黄金笛、邓肯的金属图腾柱、内德维德的魔弓、海伦的姜之忍耐夔鼓与血羽之心、茉儿的九连环闪电与云秦金人、帝维水晶与帝维晶卡、国王的战神骑士勋章、布拉特霓下的姆格酒与侍从神官编制、巫医神官的名额、切尼的四重力道纹、剑桥绿洲祭祀学院的调拨令
  本章主要压力: 玩家是神庙与军方争夺战利品的出头鸟，装傻只能拖不能解；监察院与长老院的昆丁都盯着异端这条罪名，火刑随时能点起来；国王明言无法为简爱战歌正名，三权平衡碰不得；茜茜的三百二十四年旧案与祖父普拉蒂尼的异端罪名压在祭祀体系上；李察的追随者与狼族主祭的决斗都没完；多瑙大荒原的匪帮与流浪牧民还在，布道剿匪的战果需要人来守
  章末落点: 祭祀盛典落幕，海伦的剑桥大祭师与茉儿的苍穹先知名分落定，普拉蒂尼的冤案被揭开却没有正名；玩家带着战神骑士勋章与四重力道纹离开沙巴克，简爱战歌与淫亵战歌的旧账留在了神庙法典第一百八十四页上
