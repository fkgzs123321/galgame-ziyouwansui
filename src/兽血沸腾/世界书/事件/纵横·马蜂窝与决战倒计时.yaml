纵横·马蜂窝与决战倒计时:
  舞台: 前半在桑干河畔的威瑟斯庞与堤丰山谷之间来回，海慕联军的溃败与战利品清点都在这两处；中段摊开西南荒原的油丘、落日大沼泽的伦敦城与多瑙荒原，卢塞恩的摩尔与卓尔轮值城主制把战事拖进地底世界；后半转到忘忧谷与阿尔卑斯湿地，魔界的红骨祭坛与爱琴的海加尔圣山介丘仪式分头推进，末段两条线在翡冷翠与采玉城汇合
  前置条件: 海慕联军在桑干河一线全线崩溃，莱茵克尔亲王被马蹄终结，六十余万海族死在自相践踏里；隆美尔以五万沙漠战士换得与翡冷翠联手追杀海慕联军，又被萨尔国王擢升为比蒙的战役策划；巫妖女王嘉宝以皇极变身术潜入领主大厅，被玩家凭乡音识破后订下赌约放归魔界；谭雅刚生下双胞胎男婴，万国来朝；玉皇占据飞亚达城准备立国却被困死，上古皮亚琴察鳄王现身；魔族已与海族结盟，四百万大军兵发白令山脉
  关键节点:
    总攻与战争财富:
      触发: 比蒙发起总攻
      地点: 桑干河畔的威瑟斯庞
      在场: 玩家，穆里尼奥，特维斯，萨尔，隆美尔，莱茵克尔
      经过: 八十四头重型幻兽踏破海慕方阵，全军炸营溃逃，莱茵克尔亲王被马蹄终结；玩家以影侍吞噬慕赭阿訇的灵魂，穆里尼奥的致幻战歌使兽亲觉醒种族异能，萨尔国王为战死的九个爱子落泪；特维斯公开第四阕通灵之歌，野宠与终生守护骑士可扩大四到十倍并自带辉煌光环，貔貅帕瓦罗蒂登场；人类诸国争购战歌图腾柱与丝绸金丹，隆美尔以五万沙漠战士换联手追杀海慕联军
      玩家可接: 一、把第四阕通灵之歌编进祭祀学院，野宠与终生守护骑士这一路要铺开；二、先收下隆美尔的五万沙漠战士，联手追杀的条件照旧兑现；三、把战歌图腾柱与丝绸金丹的买卖定价，别让人类诸国联起手来压价
    约定与尽歼侵略者:
      触发: 堤丰山谷清点战利品，凝玉颁下封口令
      地点: 堤丰山谷与领主大厅
      在场: 玩家，凝玉，菲高，嘉宝，安度兰长老，隆美尔
      经过: 菲高指认敢死药丸即海槟榔的前身；巫妖女王嘉宝以皇极变身术假冒壹条混入领主大厅，骗大小s喝下惊寂之黄泉、废掉两名元素精灵使，玩家凭乡音识破，与她订下赌约后放归魔界；安度兰长老斥责放走嘉宝，玩家辩称要诱魔族按既定的步骤继续侵入爱琴；海族的安尔乐离水法阵被自家的溃兵冲垮，六十余万人死于自相践踏；隆美尔以围三阙一与幻术藤舟逼慕兰败兵火拼，萨尔国王擢升他为比蒙的战役策划
      玩家可接: 一、把封口令执行到底，堤丰山谷的战利品清单不能让外面知道；二、顺着嘉宝的赌约往下走，诱魔族按既定步骤继续侵入；三、先把安尔乐离水法阵被冲垮的内情记下来，海族的登陆线还会再用
    诡谲的使者与绣球战车:
      触发: 人类军界盛赞比蒙的新战术与新兵种
      地点: 多瑙荒原与西南荒原的油丘
      在场: 玩家，米哈伊洛维奇，隆美尔，香克利，幽月儿，玛莉亚.高树
      经过: 条顿军事学院院长米哈伊洛维奇称重型幻兽为当之无愧的地面之王；美人鱼皇帝贝肯鲍尔与塞壬女王朝河兰拒绝两位珊瑚顶亲王的劝谏，改任塞壬第一名将玛莉亚.高树女公爵为统帅；八月战局转入僵持，玛莉亚.高树女公爵派出的伐木队与斥候队被鬣狗群尽数歼灭，补给改走海路，海娜迦二十万大军三天内枭下荒原三大盗匪的首级，直扑落日大沼泽的伦敦城，隆美尔从帝维实况中剖析出曲射电浆的法术组合；卢塞恩实行摩尔与卓尔的轮值城主制，幽月儿主母与香克利陛下索要地底世界、军械与粮秣；隆美尔以投名状与战略纵深的利害力陈出兵，终获十万地面部队与十万空军，主战场定在西南荒原的油丘，娜迦的海狮石球战车首次亮相
      玩家可接: 一、把西南荒原油丘的主战场布防接下，隆美尔要的十万地面部队与十万空军不能白给；二、先查海娜迦二十万大军的补给线，海路这一条要切断；三、盯住卢塞恩的轮值城主制，摩尔与卓尔之间的缝能插进去
    海皇重弩与崛起之路:
      触发: 娜迦的石球战车碾碎卢塞恩战车与灰矮人
      地点: 西南荒原的油丘与多瑙荒原
      在场: 玩家，隆美尔，布吕克纳，卡恩亲王
      经过: 海澜战争古树的珍珠霰弹、竖琴战弓与巨鱿头顶的海皇重弩把卢塞恩的空军压回高空；卓尔主母咆哮催战，隆美尔只得放出齐布林飞行器与摩尔猪脸蝙蝠骑士的炭精燃烧弹；四位恩特投入战场，以琥珀脂浆把海狮石球战车风化成碧绿的树脂化石；隆美尔公开硫磺气航弹的原理，泰穆尔拉雅雪山的列奥尼达气矿配鱼鳔盛器、遇冷即成硫磺水，布吕克纳以唇典窃听，阻止卡恩亲王借魔界海族灌充毒雾航弹
      玩家可接: 一、把硫磺气航弹的原理锁住，鱼鳔盛器这条线不能让卡恩亲王先摸到；二、让四位恩特继续盯海狮石球战车，琥珀脂浆的用量要算清；三、先切断海皇重弩的弹药补给，巨鱿头顶那门弩是空军的头号威胁
    特别战役与无毒不丈夫:
      触发: 双飞战阵两翼被海狮石球战车与海象骑兵打散
      地点: 西南荒原的油丘
      在场: 玩家，隆美尔，布吕克纳，幽月儿
      经过: 中路上千名堕落法师遭群体默言术集体哑火后被屠灭，布吕克纳劝隆美尔用预备队被顶回；隆美尔挂出总攻赤旗，鹰牛空军与地狱黑龙倾巢而出，二十万娜迦投降；隆美尔自陈故意葬送千名法师以动摇堕落精灵的统治根基，好带五千特拉维夫狂战士脱离卢塞恩；他拒绝转让炭精提炼的配方只肯代炼，并索要五万骆驼骑兵，又点破海慕联军必攻多洛特；附庸种族与娜迦军人转投斯迈族
      玩家可接: 一、让隆美尔把炭精代炼的账算清，配方不外流这一条要写进约里；二、先接下降临的五千特拉维夫狂战士，隆美尔脱离卢塞恩这一步要扶；三、把多洛特的防线补上，海慕联军的下一个目标是那里
    意外发现与借兵:
      触发: 战后分赃，翡冷翠夺得海澜古树、八足巨鱿与永恒月藻
      地点: 翡冷翠与阿尔卑斯湿地
      在场: 玩家，卡卡，波利斯，卡恩，穆里尼奥，贝肯鲍尔，朝河兰
      经过: 莱茵剑士把绣球战车玩出任意球与盘带，玩家以魔法教官之职换娜迦团长波利斯传授双法合壁，又托卡恩把歌唱水晶转交穆里尼奥，卡卡说出杜宾的祭祀叫兽王；阿尔卑斯湿地的海族西征大营里，贝肯鲍尔与朝河兰为咸盐短缺和战略调整争执，又承认夏宫卫队全员列装精金羽箭、战歌图腾柱已被盟友找到克制之法；后半段玩家带两国特使参观熔岩山谷的军工基地后开口借兵
      玩家可接: 一、把双法合壁的教程编出来，娜迦团长的手艺换得值；二、先解决海族那边咸盐短缺的传闻，看能不能把这条线做文章；三、开口向两国特使借兵，祭祀与兽王的人数是这一趟的实货
    千古谜团的揭开与六宠时代:
      触发: 两国特使争相交出全部祭祀
      地点: 熔岩山谷与翡冷翠
      在场: 玩家，卡卡，德塞利，杜宾特使，美杜莎特使
      经过: 玩家索要人数，得知美杜莎可出六百二十位祭祀、杜宾可出两千四百一十七名兽王；他弄清对方图的是战歌师承，并揭开通灵之歌加副本能召语宠之谜，师徒结成的比扬德乐队可突破光环上限；玩家追问雷克萨的第三只战宠，得知是可代兽王释放星云连锁闪电的弑宠，斥其为堕落战歌，杜宾特使辩称魔兽自愿即豁免诅咒；美杜莎被迫交代隐宠战歌与真视之眼，各战歌的母语及鹦鹉学舌螺复唱的办法一并揭开
      玩家可接: 一、把比扬德乐队的编制定下来，通灵之歌加副本这条路要往全军推；二、先收下两千四百一十七名杜宾兽王与六百二十位美杜莎祭祀；三、把隐宠战歌与真视之眼的用法问全，再谈弑宠算不算堕落战歌
    海加尔圣山回归与红带屠城:
      触发: 玩家列席元老院圆桌会议
      地点: 比蒙元老院与忘忧谷
      在场: 玩家，贝克汉姆，西多夫，小贝，萨尔
      经过: 玩家为自创战歌平反却保住宗教裁判所，重划夏宫、军队、神庙三足鼎立的祭祀体制，并以狠话压服反对者接纳美杜莎；随后小贝求援，他回绝永久租借海加尔圣山等厚报，只换回贝克汉姆；海族以珊瑚虫母在忘忧谷筑起珊瑚海防线，人类的气系法师用英捷尔法勒遥控引爆加布林魔鲨武士；贝克汉姆献上人鼻肉山，讲述夏宫卫队屠灭十万人口的魔族城市，西多夫命人把鼻子送给海族
      玩家可接: 一、把三足鼎立的祭祀体制写进夏宫与神庙的约里；二、海加尔圣山的永久租借不接，只把贝克汉姆换回来；三、先把忘忧谷的珊瑚海防线摸清，珊瑚虫母是这条防线的根
    名将之局与马蜂窝:
      触发: 玩家伪装银瞳在落基山脉抄掉蒙太拿
      地点: 落基山脉、飞亚达城与忘忧谷
      在场: 玩家，夏莉莲，隆美尔，希斯菲尔德，玉皇，梦露
      经过: 蒙太拿是屠城计划的第四座也是最后一座，累计约二十五万魔界青民丧命；年轻城主骑变异奥兽挑战落败，美女巫妖夏莉莲被放走后立誓报复，隆美尔同步布局对沙巴克的轰炸；煤炭哥利亚酋长希斯菲尔德因恩人马特乌斯与十名青年被杀，决意唤醒金刚钻先祖并与魔族联手；玉皇占据飞亚达城准备立国却被内廷侍卫与元素干扰结界困死，上古的皮亚琴察鳄王现身，新任巫妖王梦露主张招安匪帮
      玩家可接: 一、盯住希斯菲尔德唤醒金刚钻先祖这一步，哥利亚的报复不能等它成形；二、先利用玉皇被困在飞亚达城的局面，内廷侍卫与元素干扰结界是现成的牢；三、把夏莉莲的报复记在案上，放走的人日后都要还
    世事无常与太子诞:
      触发: 忘忧谷的地理与海族防线铺开
      地点: 忘忧谷与翡冷翠
      在场: 玩家，隆美尔，斯蒂法诺，霞飞，谭雅，贝肯鲍尔，朝河兰
      经过: 人类以毫无阵型的乱战全线猛攻，比蒙祭祀用狂化战歌覆盖四十万平方，海族的炮灰成片倒伏；庆功酒会上玩家推介隆美尔，斯蒂法诺引荐三位年青法师，金精灵团长霞飞当众回绝招纳；贝肯鲍尔与朝河兰为盐耗亏空争吵，随后商定收买普莱恩虾人与湛蓝海龙、以龙龟组建幻兽空军；谭雅生下双胞胎男婴，取名刘抗美与刘援朝，万国来朝并引发三大教派争夺洗礼权；隆美尔借走五百金精灵空骑
      玩家可接: 一、把三大教派争夺洗礼权的事按住，孩子的名分不能成教派角力的筹码；二、让隆美尔借走五百金精灵空骑，账要记在他头上；三、先查海族收买普莱恩虾人与湛蓝海龙的进展，龙龟空军不能让他们先建起来
    备战与两个打一个:
      触发: 隆美尔把炭精配方卖给二十三个人类国度及唐藏、杜宾
      地点: 比蒙御前会议与卢塞恩
      在场: 玩家，隆美尔，克林斯曼，香克利，幽月儿，安瑞达
      经过: 比蒙御前会议商而无果，多瑙无煤，与美杜莎合作又恐资敌；玩家提议把配方也卖海族与魔族，另以两万份瑙白金诱安瑞达搅乱西海两国；人类十位高层密议屠灭卢塞恩，庞贝学者克林斯曼指卢塞恩是全木城池又紧邻针叶松林，力主火攻，人类愿赔采玉城的损失，玩家接下此事；十一天后卢塞恩一夜化作火海，同天海慕联军在沙巴克遭地毯式轰炸；被遗忘国度迎来使节玩家，香克利、幽月儿、海德欲以千叶茑萝花汁染色伪装；玩家在珍珠广场展示莫托洛夫炭精鸡尾酒，揭穿隆美尔是影系魔法传人，给十屈指的时间令其全族迁往波拿巴大陆，三百万人撤退耗时七天六夜
      玩家可接: 一、接下屠灭卢塞恩这一仗，火攻的时机要卡在风向最好的时候；二、把炭精配方同时卖海族与魔族，让两边都欠这份人情；三、用两万份瑙白金诱安瑞达去搅西海两国，海族后方要先乱起来
    宝剑峰战役与大块头有大智慧:
      触发: 沙隆巴斯以八十万海族大军强攻一线天
      地点: 宝剑峰与比蒙王都
      在场: 玩家，隆美尔，沙隆巴斯，贝肯鲍尔，朝河兰，阿尔贝蒂尼
      经过: 飞驼军团用胡桃火球与万国牌器械死守，隆美尔泼下一千两百吨酒精与风动岩，十五万海族烧死谷中，谷外五十万被打散，沙隆巴斯拔剑自刎，东部十七城光复起义；贝肯鲍尔与朝河兰斥责海族幕僚无用，魔族特使许诺出兵援助；两位海皇用人类艺术品换来的水晶收买五阶海龙阿尔贝蒂尼偷袭宝剑峰夺航弹技术；玩家把炭精配方交给美杜莎，并宣布介丘海加尔与废除双重国籍
      玩家可接: 一、把胡桃火球与风动岩的库存补齐，一线天这道口子还要守；二、先查阿尔贝蒂尼的动向，航弹技术不能被夺；三、把炭精配方交给美杜莎，介丘海加尔与废除双重国籍一并宣布
    决战倒计时与介丘仪式:
      触发: 介丘海加尔筹备，巫医伪造瑞兆
