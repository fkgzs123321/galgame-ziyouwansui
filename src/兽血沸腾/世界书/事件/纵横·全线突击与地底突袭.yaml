@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 295 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 334
纵横·全线突击与地底突袭:
  舞台: 沙巴克与剑桥绿洲之间来回，主战场是塔克拉玛戈大沙漠。剑桥大绿洲的摩尼神庙、耶鲁绿洲的补给基地、粟米特绿洲的土墙要塞与红石大峡谷一路排开；沙漠里有蝎人、蛇人与秃鹫人的土著据点，再往北是横断山脉的壑口，慕兰人的加里曼丹城还在更远处
  前置条件: 小鹦鹉马特拉奇与壹条都中了血腥玛莉之毒，靠壹条的血清与食毒蛊才解掉；玩家被教宗任命为远征祭祀团首席萨满，狮心亲王卡恩率远征军等候；茉儿顶着苍穹先知头衔，茜茜与小修女贞德随队；普斯卡什大师与安度兰长老都在沙巴克，加茜娅与兰帕德两位龙骑士刚到城外五十里；慕兰金刀魔羯阿里.代伊率三千人守在粟米特绿洲，加厚土墙、镜炮与登塔阿訇都已布好
  关键节点:
    吹哨子与毛遂之茜茜:
      触发: 教宗悻悻离去，海伦为冲撞教宗的死罪后怕
      地点: 沙巴克城外与营帐
      在场: 玩家，海伦，安度兰长老，果果，凝玉，茜茜
      经过: 四位彪人武士挑战领主被斥退，小鹦鹉恢复骂人；安度兰长老剖析李察与穆里尼奥互相较劲的根由；果果用海伦的空间戒指放出钢板魔法阵，凝玉、若尔娜、黛丝与壹条赶回沙巴克；黛丝与若尔娜误把茜茜当成新惹的情债，众人讨论小鹦鹉中毒的蹊跷，凝玉推测是采玉城美杜莎下的毒；壹条以自己的血替鹦鹉解毒，小鹦鹉康复后被海伦命名为马特拉奇；一直被忽视的茜茜毛遂自荐要用战歌辨毒
      玩家可接: 一、让茜茜先把辨毒的战歌唱一遍，把毒源钉死；二、把采玉城下毒的推测压住，别在出征前跟穆里尼奥翻脸；三、先安顿凝玉与两位仙女龙带来的补给，再谈战事
    本物天下霸唱与毒物连环陷阱:
      触发: 茜茜当场演示丝路水韵之歌，血色光幕浮现鹦鹉骨架与毒素名称
      地点: 沙巴克祭坛
      在场: 玩家，茜茜，海伦，茉儿，普斯卡什，安度兰长老
      经过: 海伦揭示五线曲谱与天下霸唱家族的来历，千古第一异端普拉蒂尼正是这个契克因家族的后裔；茜茜自述家族五十七口逃到塔克拉玛戈大沙漠牛津绿洲，四百多族人遭沙漠强盗屠杀；她讲出家族自创的丝路水韵之歌改编自司高帝族蝎人的卡尔文洞察韵律，可凭声波检测毒性，血色光幕上现出鹦鹉骨架与毒素名称血腥玛莉，战歌日志却没有解药配方；普斯卡什与安度兰解释血腥玛莉由精灵提取、成瘾难戒且无解，检测又发现壹条也已中毒；众人议定绑架美杜莎巫医或求食毒蛊，黛丝最后提出用龙珠辟毒
      玩家可接: 一、走食毒蛊这条线，派人去美杜莎求蛊；二、让黛丝与若尔娜取出下颌龙珠辟毒，把两人的修为押上；三、把血腥玛莉的来源往采玉城追，逼穆里尼奥给个说法
    珍珠收藏家与乱局已现:
      触发: 普斯卡什的传讯魔球送来消息，教廷龙骑士加茜娅与兰帕德已到城外五十里
      地点: 沙巴克城外与营帐
      在场: 玩家，娜娜，黛丝，凝玉，普斯卡什，兰帕德，加茜娅
      经过: 玩家清点多年收藏的各类魔兽珍珠，娜娜与黛丝甘愿取出下颌骊珠换取修习魔法的机会，凝玉以摩韶族蚌人的探骊取珠论证取珠不伤性命；普斯卡什坦承开龙骑士的玩笑，又与玩家探讨龙珠与魔晶的根本区别，凝玉推断仙女龙龙珠的能力是魔法闪耀；大师用千里传音宣告龙骑士到来，点明庞贝帝国与圣弗郎西斯科帝国即将开战，导火索在多洛特；普斯卡什与玩家闲谈魔族旧事，魔族撤离爱琴大陆时裹挟两百多具巨龙骨骸，以亡灵天灾瘟疫灭绝地精；玩家交出剪刀手爱德华的残骸泄密，随后献上十九头巨龙换一年停战
      玩家可接: 一、拿十九头巨龙把一年停战敲成条约；二、让黛丝与若尔娜先取龙珠修炼，把两位战斗型仙女龙养出来；三、趁两大人类帝国开战在即，把庞贝与圣弗郎西斯科的军援谈进来
    死亡领主的四件套与请君入瓮:
      触发: 兰帕德引荐四阶碧玉巨龙吉格斯与即将进化的哈塞尔巴因克
      地点: 沙巴克营帐
      在场: 玩家，兰帕德，加茜娅，普斯卡什，若尔娜，奥胖
      经过: 玩家炫耀内德维德的三足金蟾坐骑，兰帕德报告庞贝已出动四尊新型魔像开膛手黑杰克，玩家当场索要艾玛尔手中的死亡领主耳钉；普斯卡什讲出死亡领主四件套与冰峰王座铠甲的来历，答应替他向艾玛尔换取耳钉，玩家以燃灵之链与三头地狱犬尸体交换；兰帕德欲讨七度金空间戒指，亮出朗星护腕倒出五具阿卡那瑟德蝎龙尸体与一颗雄性蝎龙魔晶；若尔娜点明蝎龙甲壳富含琉璃水晶、可提纯后镀在机械高岑外壳上，劝他做成这笔一换五的买卖；奥胖交出七度金戒指换来蝎龙与朗星护腕，玩家又白送加茜娅一枚戒指，海伦因当众被吼落泪
      玩家可接: 一、把五具蝎龙尸体交给炼金实验室，先出镀层；二、先安抚海伦，别让家务事影响出征；三、守住死亡领主四件套的最后一件，不让它落到别人手上
    舍了孩子套了狼与和事佬:
      触发: 玩家向加茜娅自称也是龙祭祀，用凝玉的东方幻术变出西贝碧玉龙
      地点: 沙巴克营帐与宴厅
      在场: 玩家，加茜娅，凝玉，穆里尼奥，普斯卡什
      经过: 凝玉借抚摸下巴之机取走吉格斯下颌的碧玉龙珠，天鹅主祭穆里尼奥随即昂然入场；穆里尼奥讥讽玩家拣垃圾，两人当众口角，普斯卡什强行压服并为双方引荐；两位龙骑士奉命先行赶往庞贝，顺路观察雪山脚下堕落精灵新开辟的城市且绝不可与之接触；穆里尼奥的挽留宴请落空，只得当面写下邀请
      玩家可接: 一、把碧玉龙珠贴身收藏，按普斯卡什的嘱咐大量喝水；二、接下穆里尼奥写下的邀请，先看看他要什么；三、叮嘱两位龙骑士绕开堕落精灵的新城，别把行踪漏出去
    牧树人和元素之泉:
      触发: 穆里尼奥以藤蔓魔法戏弄壹条，被火焰墙化解
      地点: 沙巴克营帐与宴厅
      在场: 玩家，穆里尼奥，壹条，普斯卡什，克鲁伊夫
      经过: 普斯卡什痛骂两人内讧，宣布南十字星森林的恩特族牧树人克鲁伊夫将驻跸穆里尼奥领地，这名牧树人收藏着积攒整整一万年的元素之泉，玩家当场坚决反对；普斯卡什说明三十磅元素之泉将平均分配给爱琴大陆两千余名法师，玩家与穆里尼奥都表态豁达；穆里尼奥部署斯迈与精灵弓箭手封锁鹰牛人空军，玩家细数翡冷翠单兵装备，以箬莎草纸的用途逗笑全场并谈成火浦珠交易
      玩家可接: 一、把元素之泉的分配份额争到位，别让采玉城独占；二、先把火浦珠的交易落地，把翡冷翠的单兵装备换成实物；三、跟克鲁伊夫谈条件，让他把牧树人的手艺留在南十字星森林
    一句话煽动对立与碧玉龙珠:
      触发: 普斯卡什提出小鹦鹉与壹条中了血腥玛莉之毒，穆里尼奥当场暴怒
      地点: 沙巴克营帐
      在场: 玩家，穆里尼奥，普斯卡什，唐蓓尔金娜，安度兰长老
      经过: 穆里尼奥认定玩家一再伤害冰凰唐蓓尔金娜，民兵持鸟翼飞廉弩车闯入对峙，他更当众揭穿玩家曾用一枚蛋换走凤凰卵、血婴与他长得极像的旧事；玩家承认用奇美拉卵换走凤凰卵并孵出血婴二少三少，表示愿与他分享儿子但绝不允许被夺走，随后拔剑自刺腹部两剑还清旧怨，宣布此后只认唐蓓尔金娜与孩子的血缘关系，穆里尼奥转身离去，只与两个血婴挥手作别；绿党僧侣欧文止血咒连连失败，安度兰长老接手治伤并险些弄丢碧玉龙珠，普斯卡什鉴定出龙珠内蕴植物系生命本源力量，不能辟毒只能强力愈合，须贴身收藏并大量喝水，玩家却打起了制售治疗药水的主意
      玩家可接: 一、把碧玉龙珠捂紧，按大师的嘱咐办，先治自己的伤；二、把治疗药水的方子交给炼金实验室试着量产；三、先安抚冰凰那边，把与穆里尼奥的分歧按在桌下
    巨龙失珠与珊瑚美人之谜:
      触发: 安度兰长老拒绝交出自己下颌的冰霜巨龙龙珠
      地点: 沙巴克营帐与绿洲
      在场: 玩家，安度兰长老，普斯卡什，黛丝，若尔娜，果果
      经过: 普斯卡什提出龙珠既是龙神的恩赐也是桎梏，取出后方能突破魔法瓶颈，玩家遂批准黛丝与若尔娜取出龙珠修炼，两位仙女龙誓要成为历史上第一对战斗型仙女龙；普斯卡什以斯蒂法诺能封印禁咒卷轴为例说明等级不代表才华，玩家倒空空间戒指，取出竹节巨蜈蚣珠被大师命名为柳暗花明珠；大师负气离去后，果果指向珊瑚美人，众人发现其小腹隆起、手臂姿势已被改动；众人围论她是否怀孕，巫医诺查丹玛斯测不出脉搏，只见眼中鹅黄色血丝；玩家讲述德尚说的石女故事，承认在魔索布拉达城与珊瑚美人有过情缘，凝玉追问日期，若尔娜凭直觉断定怀孕；安度兰长老以剑伤加愈合祷言证明珊瑚美人是生命体，并由此推断她已受孕，玩家用通灵之歌收她为第二位学徒
      玩家可接: 一、用通灵之歌把珊瑚美人正式收为学徒，把关系定下来；二、让安度兰长老把受孕的事验实，再谈名分；三、取出二少三少的变身驮都给巫医做筹码，自己的血魄驮都按住不动
    痛苦的西贝父亲与痴情之花:
      触发: 玩家佩戴变身驮都化作穆里尼奥，住进西南会馆
      地点: 沙巴克西南会馆
      在场: 玩家，崔蓓茜，歌莉妮，歌麦斯，歌坦妮，费雯丽
      经过: 恰逢采玉城与伦敦城的祭祀归来，歌莉妮跳上膝头亲昵撒娇，歌麦斯与歌坦妮畏惧严父，他方知费雯丽是穆里尼奥的契女，险些当场穿帮；霍利尔与特雷泽盖请战教训李察，崔蓓茜力主送食毒蛊缓和关系，特雷泽盖点破零死亡全靠防御战与地利，玩家由此看清翡冷翠武士的短板，也得知崔蓓茜在美杜莎族中身份崇高、歌坦妮早已向父亲承认喜欢自己；玩家反省与穆里尼奥由师徒到决裂的经过，体谅天鹅主祭护女之心；歌坦妮在楼梯上哭泣，他以下令调拨两位巫医送食毒蛊解毒了结此事，被崔蓓茜说成与李察是一类人；崔蓓茜吟出穆里尼奥当年写给她的腓体诗等爱，十七年后终于献出守了十七年的处子之身，玩家因佩戴鹣鲽驮都被凝眸石化术定住无法脱身，美杜莎徽章被摘走
      玩家可接: 一、继续顶着穆里尼奥的身份把食毒蛊送到，别在这里穿帮；二、让壹条与小鹦鹉先经食毒蛊解毒，别耽误出征；三、把二少三少托付给教母唐蓓尔金娜，把家务事收尾
    剑桥印象与行军方略:
      触发: 祭祀团跋涉十五天抵达剑桥大绿洲
      地点: 剑桥大绿洲、摩尼神庙与耶鲁绿洲
      在场: 玩家，海伦，茉儿，卡恩亲王，皮埃罗，平托，茜茜
      经过: 鸵鸟骑兵皮埃罗出迎，狮心亲王卡恩率远征军等候，歌莉妮获称飞姬，玩家开价五十颗拳头大玛瑙要买全部康湖水檀，被歌莉妮故意压成十五颗成交；摩尼神庙中茉儿指认神像上万年不灭的青色圣火是美人鱼脂肪提炼的灯油，讲述三千年前摩尼神教为求永生捕杀淡水美人鱼致其灭绝，玩家则以海水盐分解释淡水美人鱼无法逃入大海避难；战前会议上茉儿讲述淡水美人鱼希丁克大师研究离水结界引发海陆大战，卡恩亲王引见宪兵总队长扎内蒂、混编联队长博班与幕僚长平托，玩家分派远征祭祀团，平托争抢祭祀优先挑选权被海伦斥退；玩家以采玉城祭祀实力压服战神之鞭，平托摊开羊皮地图讲补给基地设于耶鲁绿洲，茜茜指认自家小绿洲在耶鲁绿洲东侧，沿途有蝎人、蛇人与秃鹫人土著，卡恩决意先扫荡钉子；玩家一怒砸断摩尼女神像双臂，露出照壁上颂神诗与屠戮淡水美人鱼的落款，又跃上神坛在女神胸口题写淫秽的赠摩尼女神之赞歌，卡恩亲王哑然，奥尼尔击节称奇
      玩家可接: 一、把康湖水檀的十五颗价码付清，把水檀全数收进储物腰带；二、先扫荡耶鲁绿洲沿途的土著钉子，把补给线打通；三、把摩尼女神像的事压下来，别让神庙拿这条做文章
    太阳级武器与全线突击:
      触发: 沙漠行军第三日清水告急，匹格战士拒绝前进
      地点: 塔克拉玛戈大沙漠与粟米特绿洲土墙
      在场: 玩家，雷耶斯，平托，卡恩亲王，阿里.代伊
      经过: 督战队的斑马武士一天砍下上百颗抢水囚犯的头颅，雷耶斯惊觉远征祭祀团从不索要清水，派近卫潜入打探，结果被獒犬打成鼻青脸肿扔了出来；玩家中午接管土伦联队，搬出一百罐五百加仑巨型水桶供全军畅饮，匹格战士彻底折服；他当面点破中军三十里外并未跟进、前锋已成孤军，又教军官夜间跷脚睡眠恢复体力；金刀魔羯阿里.代伊的身世揭晓，摩雅人被慕兰吞并，他率三千人守粟米特绿洲拖延战，拷问两名精灵俘虏未果，女精灵心碎而死，他反手一刀斩下自己人的脑袋；他亮出加厚土墙骆驼、海螺号角、光之乞愿塔与十三名阿訇登塔、驯狮女驱火眼狻猊、窨黩蛇奴以笛声放出七条八米长眼镜王蛇钻入兽洞；玩家下令全军以散兵线无预备队突击土墙，违令者斩，令雷耶斯与众队长错愕，阿里.代伊放出两千骆驼骑兵绕墙夹击，并命阿訇与镜炮手待敌进入三百码集中射击
      玩家可接: 一、按散兵线无预备队的命令压上去，抢在镜炮齐射前贴墙；二、先把一百罐水桶的位置守住，别让督战队炸了水源；三、让獒犬先破兽洞里的眼镜王蛇，再谈攻城
    翡冷翠实战演习:
      触发: 阿里.代伊催动骆驼骑兵与镜炮，玩家唤出夏宫卫队
      地点: 粟米特绿洲土墙
      在场: 玩家，阿里.代伊，邓肯，奥尼尔，罗德曼，卡恩亲王
      经过: 翡冷翠夏宫卫队借金钢传送阵自空帐篷涌出，四十八位堤丰铁匠先以凝焰陨石压制阿訇，猛犸重骑、连环羚牛、奇美拉空骑与牛头人武士前后夹击，火眼狻猊与眼镜王蛇被獒犬撕碎，慕兰军阵崩溃；阿里.代伊经营多日的加厚土墙、海螺号角、光之乞愿塔与十三名登塔阿訇、驯狮女、窨黩蛇奴全部作废，玩家以散兵线无预备队的打法当场奏效，土伦军官与雷耶斯再无话可说
      玩家可接: 一、趁慕兰军阵崩溃压上土墙，把粟米特绿洲的城门拿下；二、守住金钢传送阵的门道，别让慕兰人摸清夏宫卫队从空帐篷涌出的底细；三、清点翡冷翠单兵装备的损耗，为下一场补上缺口
  本章可用资源: 茜茜的丝路水韵之歌与简爱战歌、天下霸唱家族的来历、食毒蛊与两位美杜莎巫医、壹条的血清、黛丝与若尔娜的下颌龙珠、十九头巨龙换来的停战承诺、死亡领主四件套与冰峰王座铠甲、五具阿卡那瑟德蝎龙尸体与一颗雄性蝎龙魔晶、朗星护腕与七度金空间戒指、碧玉龙珠与柳暗花明珠、克鲁伊夫的三十磅元素之泉、火浦珠与翡冷翠单兵装备、一百罐五百加仑水桶、夏宫卫队的金钢传送阵与四十八位堤丰铁匠、云秦金人、猛犸重骑与奇美拉空骑、十六尊光之乞愿塔与八尊机械高岑塔盾、双头奇美拉空骑、穆里尼奥写下的请柬、采玉城祭祀团的战歌编制
  本章主要压力: 血腥玛莉无解，小鹦鹉与壹条都中过毒，黛丝与若尔娜的龙珠只能辟毒不能治本；普斯卡什占卜出贞德六天后会与教父生下孩子，这条预言压在玩家头上；阿里.代伊在粟米特绿洲囤了三千人马与十三名阿訇，加厚土墙加镜炮阵让散兵线突击的代价极高；督战队一天砍下上百颗抢水囚犯的头颅，匹格战士与土伦联队的士气随时会崩；卡恩亲王拒绝祭祀助战又握着主帅之权，指挥权随时会撞车；玩家顶着穆里尼奥的脸在西南会馆过夜，美杜莎徽章被摘走，身份随时会穿
  章末落点: 夏宫卫队借金钢传送阵从空帐篷里涌出，阿里.代伊堆在粟米特绿洲的加厚土墙、镜炮与阿訇阵被一轮打乱，玩家不留预备队的散兵线打法当场奏效；碧玉龙珠与七度金戒指、五具蝎龙尸体与元素之泉的分配都已落袋，教廷龙骑士带着玩家写下的请柬赶往庞贝，翡冷翠与采玉城之间这条线暂时安稳
