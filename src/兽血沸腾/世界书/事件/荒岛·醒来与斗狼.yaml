荒岛·醒来与斗狼:
  舞台: 无名荒岛，金黄沙滩、红柳林、几座馒头土丘与椰子树林，外圈是珊瑚礁与一望无际的海面；浅海有虎头鲨巡游，夜里的风浪能把大船拍碎在礁石上
  前置条件: 玩家在南疆战场中弹后醒来，身上只有破衣，鼻梁被打塌成两个朝天的窟窿；没有火种、没有淡水、没有合用的木材，手边唯一像武器的东西是一根鲸鱼肋骨
  关键节点:
    荒岛醒来与风系魔狼:
      触发: 玩家在海水与沙砾之间醒来，入夜后林缘传来爪足踏断枯枝的声响
      地点: 荒岛海滩与内陆林缘
      在场: 玩家，一头通体瓦蓝的巨狼
      经过: 巨狼张口喷出高速内旋的风团，风刃削断他手里唯一的鲸鱼肋骨，鼻梁被削出两个朝天的窟窿；他以拳头与膝撞中狼的鼻梁，撕下树藤缠住狼颈，人与狼在沙里僵持
      玩家可接: 一、继续用蛮力勒住它，赌树藤比狼的力气撑得久；二、松开树藤退回海滩，捡回骨矛与石块再打一场；三、边打边退，把战场引向礁石密布的浅海
    果果与荒岛大采购:
      触发: 一头会模仿玩家动作的金毛小兽跟着他回到营地，围着食物打转
      地点: 荒岛海滩、珊瑚礁与浅海
      在场: 玩家，金毛小兽
      经过: 小兽挣脱他拎着它的手，鼓起肚皮喷出一团白色冰冻气团，冻住巨狼正在凝聚的风刃，狼当场毙命；他剥下狼皮、拔下狼牙制成弓与箭镞，潜入海中撬开巨大海蚌，用蚌壳当锅煮海水制盐，也替小兽取名果果；入夜他发现异界的月亮大得惊人
      玩家可接: 一、把果果当作战力养起来，喂它吃鱼吃肉；二、先顾自己的吃喝，把它当一头普通野兽放着；三、逼它反复喷冰，弄清这份本领的来历与极限
    触礁沉船与狐狸女孩:
      触发: 夜半狂风暴雨里，一艘巨大风帆木船撞上礁石沉没
      地点: 荒岛外的礁石区与沉船残骸
      在场: 玩家，四五个长着狐狸尾巴的红发女孩
      经过: 他披着狼皮游过去登船搜刮，在压在最底层的大木箱里找到她们；一群人里只有一个还有心跳，他把人绑在桌子上撞开舷窗跳海，拖回岸边
      玩家可接: 一、只救还有心跳的那一个，其余的不再回头；二、冒险再潜回沉船，看看还有没有第二个人活着；三、先把船上的工具与物资搜刮干净，再决定救谁
  本章可用资源: 鲸鱼肋骨削成的骨矛、狼皮狼牙制的弓与箭镞、巨大海蚌的壳与煮出的海盐、浅海的海蚌与鱼虾、椰子与雨水、会喷冰冻气团的果果、沉船里的货物与工具
  本章主要压力: 淡水与火种全无，只能现取；浅海有虎头鲨巡游；玩家鼻梁被风刃削毁，身上没有医药；沉船随时会被浪拆散，压在箱子里的女孩撑不了多久
  章末落点: 玩家从沉船里带回唯一还活着的狐狸女孩，荒岛上多出一个随时会断气的伤号
