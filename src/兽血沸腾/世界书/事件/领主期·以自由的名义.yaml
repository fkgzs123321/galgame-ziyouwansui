@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 59 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 64
领主期·以自由的名义:
  舞台: 从威瑟斯庞城外一路向南，荒原边境线上只有土路、枯草与零星的哨站；白令山脉脚下的霍比特半身人达多村靠酿酒过活，村外是南十字星森林的边缘，牛顿巨鸟在半空盘旋；队伍的终点是墨晶峡谷兵站，可地图上的方位一直对不上
  前置条件: 玩家手里有敲竹杠换来的钱与萨尔纹章的欠条，崔蓓茜给的一整袋魔兽晶核还没动；三女与果果随行，古德带着二十名潘塔武士；博格村采石场里那批獒人囚犯还戴着铁镣，刑期未满；队伍没有向导，随队只有一个巫医
  关键节点:
    以自由的名义与赎买獒人:
      触发: 玩家带着敲竹杠得来的钱回到博格村，向西马克子爵开口赎人
      地点: 威瑟斯庞城外与博格村采石场
      在场: 玩家，海伦.列娜，西马克子爵，獒人贝拉米，李察王子
      经过: 李察王子在城外显露亚龙坐骑，向海伦索要手套求爱，被婉拒；玩家用钱把獒人囚犯赎买出来，领头者贝拉米率众吻靴立誓效忠；他当众说好消息就是他们今后服刑的地点将在自己身边，不必再戴沉重的脚镣，但必须拿上沉重的武器替自己效劳；他唱起前线的牢歌，被海伦用《祭祀法典》里另类祭祀被烧死的记载警告
      玩家可接: 一、把獒人当第一批班底来带，先立规矩再开拔；二、先花几天把赎金与干粮的账算清，别欠着人情上路；三、就牢歌这件事跟海伦把异端的边界谈明白
    荒原大宴的开胃菜与飞刀教头:
      触发: 队伍沿荒原边境线开拔，地精日夜骚扰
      地点: 荒原边境线与宿营地
      在场: 玩家，海伦.列娜，凝玉，艾薇尔，古德，果果，贝拉米，巫医诺查丹玛斯
      经过: 獒人只肯接受皮甲，还自带着猡莎兽后腿的棒骨当武器；玩家甩出飞刀扎中贝拉米的掌侧，逼他学飞刀，说棒子砸之前先给对方一飞刀才是王道，熊猫武士也跟着练；随队的巫医诺查丹玛斯出场，海伦讲道格族的獒人一生只伺奉一个主人
      玩家可接: 一、把飞刀练成獒人的制式本事，赶路的时间都拿来操练；二、先让巫医把队伍的病伤与毒药管起来；三、放慢行军，把地精骚扰的来路摸清楚再走
    完全野性与食人魔卡鲁:
      触发: 队伍抓到一名食人魔俘虏
      地点: 荒原边境线
      在场: 玩家，海伦.列娜，贝拉米，食人魔卡鲁
      经过: 玩家逼问俘获的食人魔卡鲁，命他替队伍拉车；他让獒人踢裂地精俘虏的脾脏、踏断手腕立威，对地精俘虏说要颁发伤疤勋章以证明他们的英勇；他最后用雪茄在卡鲁的胯下烫出一个印签；队伍走到南十字星森林边缘，看见牛顿巨鸟在半空盘旋，他翻出地图才发现自己看错了，找不到墨晶峡谷兵站的方位
      玩家可接: 一、就地把地图的事问清，宁可多绕两天也不乱闯；二、顺着牛顿巨鸟的走向赌一条近路；三、先安排卡鲁与奴隶的看管，再谈路线
    沙罗曼祭祀罗伯特.巴乔:
      触发: 沃尔夫米格军团截住队伍，军官罗伯特.巴乔露出萎缩的双手
      地点: 荒原边境线
      在场: 玩家，海伦.列娜，凝玉，艾薇尔，罗伯特.巴乔
      经过: 罗伯特.巴乔被认出是狈族的沙罗曼祭祀，海伦话音都激动得走了调；她讲明狈族是用双手换来洗浑战歌的力量，那支战歌只对狼族的近支有效；罗伯特向玩家求助，要他把闯入半身人村庄的星尾龟赶走
      玩家可接: 一、接下这桩差事，用星尾龟换半身人的粮与酒；二、先跟罗伯特把洗浑战歌的代价问明白，再决定帮不帮；三、不恋战，护着队伍从这一带绕过去
    超级霉运与达多村:
      触发: 队伍抵达白令山脉的霍比特半身人达多村，长老哭着讲起星尾龟啃光了酿酒用的香酒百合
      地点: 达多村与村外林地
      在场: 玩家，海伦.列娜，凝玉，艾薇尔，贝拉米，罗伯特.巴乔，半身人长老
      经过: 罗伯特吟唱洗浑战歌，獒人与狼骑兵一同狂化；玩家以密集阵迎战，提醒众人千万不能让它施放沉醉之云，要速战速决；时空裂缝旁又钻出一头科摩多战争巨兽
      玩家可接: 一、先护住村子与酒窖，把星尾龟引开再打；二、直接冲裂缝那头巨兽，抢在它站稳之前动手；三、让狂化的狼骑兵顶在前面，队伍后撤整理阵形
    生命礼赞:
      触发: 凝玉以幻术变出的巨兽诱敌，酸液鱼鹰阿拉贡被雷霆闪电劈成焦炭
      地点: 达多村外与时空裂缝旁
      在场: 玩家，海伦.列娜，凝玉，艾薇尔，贝拉米，罗伯特.巴乔
      经过: 玩家回顾科摩多战争巨兽的习性与海加尔战役之后驯养术失传的旧事；鱼鹰阿拉贡阵亡，海伦因魔宠非自然死亡触发千年只有两次的生命礼赞，与那头战争巨兽签下心灵契约，说她和这只科摩多战争巨兽有心灵感应、它没有敌意；罗伯特认出生命礼赞，嫉妒到失态
      玩家可接: 一、把战争巨兽当成海伦的新底牌，先把契约的规矩问清；二、先安顿阿拉贡的后事，再谈巨兽的事；三、盯着罗伯特，防他把生命礼赞的事报回沃尔夫军团
  本章可用资源: 敲竹杠换来的钱与萨尔纹章的欠条、崔蓓茜给的一整袋魔兽晶核、贝拉米与那批赎出来的獒人、二十名潘塔武士与古德、巫医诺查丹玛斯的医药与毒药、食人魔卡鲁的力气、星辰精钢弹簧狼牙棒密集阵与棱枪匕首毒药、刚与海伦签下心灵契约的科摩多战争巨兽、达多村的粮与酒
  本章主要压力: 獒人是谕制之罪的重犯，赎出来就要替他担着沃尔夫与莱茵皇族的名义；队伍没有向导，地图看错就会走进南十字星森林深处；地精日夜骚扰，宿营时也睡不安稳；星尾龟一旦施放沉醉之云全队就要倒；时空裂缝旁的战争巨兽来路不明；海伦失去阿拉贡，而另类祭祀在《祭祀法典》里的下场一直悬在她头上
  章末落点: 海伦以生命礼赞与科摩多战争巨兽签下心灵契约，队伍多出一张底牌；罗伯特的嫉妒与沃尔夫军团的注视同时留在这片荒原上
