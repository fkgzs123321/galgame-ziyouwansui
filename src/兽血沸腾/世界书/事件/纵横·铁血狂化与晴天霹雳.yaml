@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 595 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 634
纵横·铁血狂化与晴天霹雳:
  舞台: 前半在桑日大陆与红土高坡之间来回，花官册封与建军都在红土广场与领主大厅完成；中段转到威瑟斯庞的斗兽场与比蒙王都，教宗布拉特与新任福克斯总督都在场；末段沿丝绸大陆展开，从墨文若克海岛到荷露城的梵宇，再到藕塘中央的黎山门庄园与全铜砌成的七宝塔
  前置条件: 玩家已得魔翼天王之名，背上生出星空倒影之翼，时空大裂缝因他的晋阶而全部洞开；小空以花将自居，唐藏亲王玄奥的壮汉与两位学徒随行，壹条正赶回丝绸大陆救白素青；两位血侍已进化为元素精灵使并宣告背叛，只留下终极血盾；崔蓓茜醉饮茱萸汁，教宗布拉特要她拿掉腹中的孩子换取齐位名份；革瑞恩与吉安娜刚吞下两位恐惧魔王与四翼骑士，两头亡灵正等着新的差事
  关键节点:
    报与桃花一处开:
      触发: 小空跪拜称玩家为父王
      地点: 桑日大陆军营
      在场: 玩家，小空，唐藏亲王，艾莉婕，明姚，壹条
      经过: 唐藏亲王解释花王、花后与花将三位一体共生，蕴含无法背叛的伦理关系；金蕊即帝女花，小空是天生金枝玉叶；艾莉婕被点破花后身份，众人目光一片暧昧；玩家把艾莉婕推出来认下花后的名分，并接受缘分认小空为九郎；佛巨人明姚当众指出玩家与艾莉婕有夫妻之实，凭姬丝凯碧能看穿人心，又驳斥他的否认，提醒他韦舵也是佛巨人的一员、生命和缘分密不可分；小空依次拜见母后、三位母妃与叔叔壹条，并请教花衔的奥秘；唐藏亲王讲述唐藏名山中的花廷，前身是门派怡花宫，壹条当年被怡花宫领头围攻、靠父亲相救；四大花仙与玉系神恩眷顾者玉皇是花廷的后盾，小空是控金又品玉的双系神恩眷顾者，凭控金术挥动十万八千磅的精金棍
      玩家可接: 一、认下花王的身份与九郎，把花衔这套伦理在夏宫立成规矩；二、向明姚把看穿人心的本事问到，佛巨人的眼力比斥候好用；三、先查怡花宫当年围攻壹条的旧怨，黎山门这条线要顺着摸下去
    满城尽带黄金甲与寥廓江天万里霜:
      触发: 艾薇尔设想用九郎的控金术搬起直布罗陀河底的精金山砸敌
      地点: 红土高坡
      在场: 玩家，艾薇尔，小空，壹条，海伦，艾莉婕
      经过: 小空说明控金受空间面积与掌心半寸的限制、原始形态决定能力，他说能点化三千花之国士，赐矢车箭技与大丽膂力，需细金装备方能成就金相玉质；壹条透露怡花宫靠至宝财神玉盂发家，一枚金币加水就能变成满盂金币，玩家怀疑那是矿物智慧生命的科学结晶，动了夺宝之心；海伦邀三位僧侣赴翡冷翠，艾莉婕犹豫收八歧巨蛇为魔宠，玩家要为众人表演制造绝世戒灵
      玩家可接: 一、让九郎点化三千花之国士，先把细金装备的缺口补上；二、把财神玉盂的底细查清，再谈夺宝的事；三、先把精金山的搬运方案与控金术的限制对上
    高处不胜寒与大雨落幽燕:
      触发: 革瑞恩与吉安娜吞噬魔族菁英、两位恐惧魔王与四翼骑士后连升一阶
      地点: 红土高坡与比蒙王都
      在场: 玩家，壹条，艾莉婕，果果，崔蓓茜，贝贝托，布拉特
      经过: 革瑞恩成为能幻化人形、掌控水晶宫领域的潮汐大公爵；时空大裂缝全开使爱琴与魔界成为同一片空间，玩家决定让两头亡灵回海中骚扰海族的后方；壹条向玩家解释丝绸大陆的渡厄与白日飞升，断言抗过九道闪电的圣上上之阶法师并非飞升，而是被血系终极护盾推向宇宙活活饿死，艾莉婕判定玩家的护盾会排斥地心引力，玩家决定不开启护盾，并继续让果果汲取血系魔力；崔蓓茜醉饮茱萸汁，回想自己为救凯文私许贝贝托并辞去东北大维安一职，教宗布拉特要她拿掉腹中的孩子换取齐位名份，她只能靠骨联宝盒向海伦求救；玄奥的壮汉殿下折服于佛巨人的十种祷言
      玩家可接: 一、把血系终极护盾压住不启用，先靠果果的汲取撑住战力；二、把崔蓓茜从布拉特的条款里捞出来，何塞家的脸面不能靠她一个人扛；三、让革瑞恩与吉安娜回海中打海族的后方，把海族的运力拖住
    假逢真时与比蒙武典的化身:
      触发: 威瑟斯庞斗兽场上，海加尔之星以比蒙各族失传武技赤手空拳一招击败彼尔熊人与沃尔夫角斗士
      地点: 威瑟斯庞斗兽场与比蒙王都
      在场: 玩家，海加尔之星，布拉特，崔蓓茜，贝贝托，兰帕德
      经过: 教宗布拉特亲临观战，翡冷翠夏宫卫队乘飞行巨兽降临，玩家的相貌已经变成另一副模样；他登上主看台，认出与自己相貌雷同的海加尔之星使的是鲮鲤族铁甲术；他质问新任福克斯总督为何把魔法传送阵装在总督府而非神庙，并向教宗布拉特赠送翡翠黄金三重冕；布拉特以法典条文对冲为由逼崔蓓茜改嫁贝贝托，贝贝托拒收翡冷翠的贿赂；玩家当众宣称与崔蓓茜早有白头之约、孩子是自己的，愿接受决斗，崔蓓茜放弃祭祀身份随他回翡冷翠；海加尔之星自称是玩家与仙女龙若尔娜来自未来世界的次子，在海加尔圣山获奇遇学全比蒙失传武技，当场演示木属性羽萝斗气与单手四级指芒，威力堪比高级魔法；他又自述借瀑布的天然六芒星阵穿越时空，依磁铁矿上的自然投影苦修百余年学全武技，自称玩家未来有四十七子十三女，玩家认其为十郎，却暗定待兰帕德学会指芒后除掉他
      玩家可接: 一、把海加尔之星认作十郎留在身边，先摸清他会的失传武技；二、让兰帕德盯着那套指芒，学成之前别让海加尔之星离开视线；三、先把崔蓓茜与孩子接回翡冷翠，教宗那边的法典条文另找人应付
    矢车冲阵与以母之名:
      触发: 玩家把醉酒的崔蓓茜送到猛犸故居千雪之幢醒酒
      地点: 千雪之幢与红土广场
      在场: 玩家，崔蓓茜，海华丝，艾莉婕，卡卡，斯蒂法诺，艾玛尔
      经过: 玩家由此想到用伏波珍珠固定雪山沸泉与寒泉的温度对付魔族；海华丝颁封花官，艾莉婕从鸳弗瑞蝴蝶比蒙中挑出八十八位人选；两大人类帝国的宫廷大师斯蒂法诺与艾玛尔争相索要魔法坐标，只为加入翡冷翠炼金实验室分享五五分成；玩家命人用年青祭祀试验自杀卷轴，并安排九郎点化三千花之国士；艾莉婕把余下的矢车箭手名额分给豪斯族的河马诗人与道格族的獒人，配夸克多水银弦战弓，奥尼尔当场试射一箭双发，被内德维德评为花哨有余战力不足，小空说明矢车花士分殿帅五弓、旅帅四弓、花士三弓；艾莉婕安排卡卡回十万大山招募杜宾人的枪咏冲锋队；西尔芙说明她当日是出嫁才穿大红、驾梦魇大车，因玩家的精神力过强被一并带入；贞德始终盯着玩家浑身发抖，真魂侍与巫师裸女咒的形象都是贞德死于难产的母亲，普斯卡什大师以此留下心结，玩家因此无法用该咒帮珊瑚美人谭雅解除石化；两大人类帝国派亲王送来胡克火控小组与白银基座战甲的原版图纸
      玩家可接: 一、把自杀卷轴的试验停下来，年青祭祀的命经不起这么耗；二、先用白银基座战甲的原版图纸把皇冠荆棘战甲升上去；三、把贞德母亲的事按住，真魂侍的形象不能再用在别人身上
    战争已经来临与十万死士:
      触发: 翡冷翠收下两大人类帝国的厚礼，皇冠荆棘战甲将升级为第四代
      地点: 红土高坡
      在场: 玩家，萨尔，布吕克纳，穆里尼奥
      经过: 入夜国王萨尔带血渍赶回，单独告知玩家战争已经打响，时空大裂缝提前开启三小时内大量魔族涌入爱琴，但都不是正规军；萨尔引荐穆里尼奥之父布吕克纳老公爵，老公爵讲述美杜莎一族两千年前已迁往波拿巴大陆；玩家自认魔翼天王；国王宣布比蒙灭族的概率高达百分之九十九点九，已派十万沃尔夫骑兵入魔界执行必死的狙击任务
      玩家可接: 一、接下十万沃尔夫骑兵的调动，把这支必死之军的后路留出来；二、先把第四代皇冠荆棘战甲赶制出来；三、向布吕克纳老公爵把美杜莎一族的去向问清
    割乳令与与时间赛跑:
      触发: 萨尔宣布将在王城发布海廷加动员令即割乳令
      地点: 比蒙王都与红土广场
      在场: 玩家，萨尔，布吕克纳，安度兰长老，兰帕德，内德维德，克鲁伊夫
      经过: 割乳令要十支主战种族的成年妇女割去右乳参战，玩家与布吕克纳老公爵激烈反对，萨尔许诺若能尽快把海族拖进战争泥潭便暂缓发布；安度兰老爹质问玩家带回的魔族女子，萨尔训他看人不应带个人好恶，布吕克纳老公爵附议；玩家讨要一个半联队的豪斯箭手，获赐比加之海联队与沙漠之战残部共一千五百人及四百万金币，并献上通灵战歌第三阕；比蒙王都与二十一个人类国度会谈敲定军援计划，由三大人类军事强国统筹，众人揭示魔族禁咒亡灵天灾须巫妖王持咒，魔族全族仅三位巫妖王，翡冷翠以吸香红豆锁死瘟疫传播，人类提议递交战书逼海族参战；玩家重组空中部队并赐名斯图卡幻兽骑士团，班尼路武士菲高出任兰帕德副手，夏宫仆射团扩至两千九百三十三人，内德维德任百人留守仆射团团长，骷髅重装步兵团与婴儿重装骑士团、盖世魔法太保团一并亮相；他暗令安瑞达须被安排在最前线，贝克汉姆的魔法太保团扩至六百四十三人；祭祀团选定澈桑大陆的引力脉冲香橼树为植宠，克鲁伊夫长老反对烧树逼服，香橼树先拒后突然集体同意，长老疑与十太子文泰克莱尔有关
      玩家可接: 一、把海族拖进战争泥潭，赶在割乳令发布之前兑现；二、让斯图卡幻兽骑士团与盖世魔法太保团按新编制跑一次合练；三、先查香橼树的态度为何突然翻转，文泰克莱尔这条线要盯死
    长缨在手与何时缚得苍龙:
      触发: 祭祀们折损魔宠后统一换上基头座龙，豪斯祭祀的座龙将变身为龙人射手
      地点: 红土高坡与广寒月影法阵
      在场: 玩家，克鲁伊夫，艾莉婕，海华丝，文泰克莱尔，内德维德
      经过: 克鲁伊夫长老提醒玩家提防十太子文泰克莱尔；巴比伦炮兵由三百三十四位长老操控六门巨炮，文泰克莱尔被留入警卫旗队监视；圣荷西帝国也挤进翡冷翠参与五五炼金分成，三大人类国度的炼金师却各专攻一项，玩家识破圣荷西只造光之乞愿塔的半成品、回国嵌上月石即可开火的算计，又由对手密告得知黑索银破击炮与海菲冰的存在；野矮人以安特炼金模式分工协作，最终炼出六千七百七十枝杜蕾丝爆裂箭；壹条飞回丝绸大陆，距七宝塔仅一天一夜的路程；玩家获爱琴魔法师工会承认为圣霄魔法师，五位人类大魔导师上门祝贺并解开大小s血侍的疑团；五位人类大魔导师应邀观礼广寒月影仪式，孔雀美人与海华丝被转为夏宫专职圣女，艾莉婕着旗袍登场，玩家与祭祀们一身清朝官服；两人在月石法阵的铜镜前昭告英雄归来，号召爱琴人前来多瑙荒原迎战入侵者
      玩家可接: 一、接下圣霄魔法师的名分，把魔法师工会的祝贺变成实打实的军援；二、把圣荷西的光之乞愿塔半成品扣住，不给它回国嵌月石的机会；三、按广寒月影仪式的名头把爱琴人召到多瑙荒原，先把迎战的阵势排开
    新任龙领领主与技术换外交:
      触发: 龙城贵宾驾临翡冷翠，远古巨龙温格现身并赠十太子文泰克莱尔一块仙道樟魔芯
      地点: 红土高坡与荷露城梵宇
      在场: 玩家，温格，阿加西，波姬小丝，哈塞尔巴因克，唐藏亲王，壹条
      经过: 彩虹龙城城主阿加西与辰星龙城城主波姬小丝颁封玩家为爱琴新任龙领领主，授奥喀理拉魔法水银徽章，众人方知所谓龙领即幻兽座龙；众人惊觉龙领领主的头衔意味着幻兽座龙被承认为巨龙谱系，双头黄金巨龙哈塞尔巴因克直言反对；玩家索得一百五十万金币，才明白龙城是把他和座龙拉上对抗魔龙的战车，温格答应随他远行荷露城救援白素青；玩家为玄奥的壮汉殿下既是唐藏亲王又是苦行僧侣而烦恼，怕在荷露城动武伤了亲戚情面；温格与伊布夫妇道出龙族的禁足戒律与魔界魔龙噬龙的秘密；他率军抵达荷露城，在梵宇中与亲王谈七宝塔与黎山门的旧怨；唐藏亲王早猜到永夜的极光身份，说明神兽在丝绸大陆是登记在册的合法居民并劝玩家慈悲为怀；壹条在旧怨与白素青的师门之间犹豫，玩家替他决定铲平黎山门，又提出以军械制造技术合作换取那枚玉佩信符
      玩家可接: 一、把龙领领主的名分与奥喀理拉魔法水银徽章收下，借龙城的力对付魔龙；二、替壹条拍板铲平黎山门，把七宝塔与旧怨一起了结；三、先用军械制造技术换那枚玉佩信符，唐藏这边的关系要留
    黎山门与东方防御体系:
      触发: 黎山门庄园建于藕塘中央，唐藏将军调大黄床架弩封锁路口并一再拖延
      地点: 藕塘中央的黎山门庄园
      在场: 玩家，壹条，小空，温格，安瑞达，内德维德，法江
