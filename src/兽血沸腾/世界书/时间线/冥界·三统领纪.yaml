@@private
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
冥界与三大统领:
  时间: 远古
  事件:
    - 冥界是亡魂的故乡位面，父神俄狄斯设计雨积云为全境遮挡光线，冥界生物怕光
    - 俄狄斯麾下设三位统领，分掌灵魂大河、骸骨大河与碧落血河
    - 第一大统领茵格里切宝司掌灵魂大河，是圣奇奥级；第二大统领瑞卡顿雅布司掌骸骨大河；碧落血河大统领耐温尔因克是俄狄斯的爱子
    - 三大统领以眉心的白色勾形标志辨认，各自的图腾武器都是本命武器
    - 耐温尔因克身高四十米左右，头生一对超过十米的虬曲巨角，皮肤为钢化熔岩质地，手持碧落三股钢叉
    - 冥语只有三大统领、瑞博克大恶魔、瓢甲虫法老与冥龙等少数存在会说
  后果:
    - 冥界权力集中在俄狄斯与三位统领手中，彼此以血脉与图腾武器相连
    - 冥界魔兽常年与亡灵交手，暴君级与恶魔级魔兽数量庞大
  对当前格局的影响:
    - 冥界生物只在积厚气与雨云的遮蔽下活动，爱琴的阳光帝波罗对它们等于刑罚
    - 本命武器可隔着时空大裂缝遥控使用，防线不能只盯正门

死亡领主四件套:
  时间: 约一万年前
  事件:
    - 神魔大战时代，一位武技与魔法俱佳的魔骑士投降魔族
    - 巫妖王斯科拉里恩赐给他一整套骑士装备，即死亡领主遗物，由魔族巫妖王加持奥术
    - 四件分别为徽章型护盾、皇冠型戒指、摩钻型耳钉与护腕型镯轮，全部由魔界最稀有的黑昙金制成
    - 每件内含一个功能不同的黑昙死灵空间，四件集齐可自由组装成冰峰王座铠甲
    - 套装由斯科拉里诱使萨穆埃尔穿上，能潜移默化改变穿戴者性格，把善良的人逐渐变成魔鬼
    - 套装赋予穿戴者十指剑芒，代价是杀尽亲朋好友并把他们的亡灵变成戒灵与冥火骷髅法师
  后果:
    - 死亡领主萨穆埃尔成为爱琴历史上十指指芒的最高者，仅次于他的是只有六指的荒野游侠阿拉贡
    - 阿拉贡天生拥有号令亡灵的能力，在神魔大战中召集无数亡灵大军重创魔族
    - 四件套在爱琴与魔界之间流散，最后一件镯轮去向不明
  对当前格局的影响:
    - 谁凑齐四件套谁就握有魔界第一盔甲，也同时背上一整套反噬
    - 戒指与耳钉都要靠亲手杀死对手取血作灵引，使用者注定一路见血

冥界三神器尽毁:
  时间: 神魔大战之后的万年间
  事件:
    - 冥界三大神器尽毁于爱琴，镇族之器没有一件留在冥界本土
    - 萨弗拉斯权杖能永久魔阻实体化，湮灭镜轮能令元素逆流引发噬爆
    - 湮灭镜轮发出的是自上而下地毯式覆盖的湮灭之光，冷却前只有三次使用机会
    - 三大统领的图腾武器都是本命武器，时空大裂缝的联通性使神器能隔着位面遥控出手
  后果:
    - 冥界的家底被一件件拆散在爱琴，神器碎件散落各地
    - 冥界再插手爱琴，只能靠统领亲征与冥兽海
  对当前格局的影响:
    - 冥界出手一次便少一分家底，无法像魔族那样反复试探
    - 熔毁在爱琴的冥界神器碎件成了各方争抢的物证

<%_ if (chap >= 245) { _%>
四件套散落爱琴:
  时间: 大战爆发前
  事件:
    - 死亡领主的戒指是魔族入侵爱琴后留下的黑金戒指，泪滴形小皇冠造型，表面刻着黑昙花纹面具，能把戒指主人杀死的生物转化为戒灵
    - 兰帕德以死亡领主的戒指换回巨龙性命，戒指落到刘震撼手里
    - 教廷仅有的两件死亡领主遗物是这枚戒指与龙骑士加茜娅佩带的死亡领主护盾
    - 炼金之王艾玛尔手里有一枚死亡领主的耳钉，以黑昙金与蓝色碎钻制成七连环，能让导士阶以下魔法释放时节省六成魔力
    - 镯轮由亡灵法师赞迪诈降献出，可以召唤出冥火骷髅法师
    - 死亡领主装备还能召唤八个浑身笼罩裴寂寒气、躯体凝结霜花的冰霜牛头人巡游者
  后果:
    - 四件套中的三件先后集中到刘震撼手上，最后一件靠交易补齐
    - 教廷与翡冷翠之间多出一条以遗物为筹码的暗线
  对当前格局的影响:
    - 死亡领主套装成了主角正面碾压冥界生物的底牌
    - 持有者随时可能被套装的邪恶力量反噬，连教皇也救不回来

血河统领初叩关:
  时间: 冥族试探爱琴的初期
  事件:
    - 耐温尔因克挤入时空通道时被维京重斧劈中眉心白色勾形标志，创口不愈、不时流脓
    - 他因体型过大反将骨冢之门崩裂
    - 阿仙奴变形求情，果果趁机锁住她，逼她撤除迷踪冥界领域
    - 迷踪冥界领域撤掉九龙帘幕后化作看不到边的灰蒙原野，只能由阿仙奴自愿放行
    - 冥界守卫者阿迪达斯玛被阿仙奴的时空转换通道成批召来，四头比蒙巨兽堵住骨冢之门
  后果:
    - 冥界的第一次叩关以统领带伤撤退收场
    - 冥界守卫者的来历与族群习性被摸清，阿迪达斯玛源自冥界古代恶魔的谱系与血脉，是碧落血河渡口的守卫，个体战力相当于准超阶龙兽
  对当前格局的影响:
    - 眉心的勾形标志成了辨认三大统领的唯一凭证，也成了最脆弱的靶子
    - 迷踪冥界领域落在阿仙奴手上，出入冥界要经她放行

冥族潜入森林:
  时间: 大战中期
  事件:
    - 堕落精灵的盟友是冥族大军，七十万冥族生物已借马龙水晶传送阵与时空大裂缝潜入南十字星森林
    - 冥族主力是羊角怪这类高阶魔兽，领头者正是血河大统领耐温尔因克
    - 随行的有大恶魔瑞博克、地狱潜行者、伏地恶魔、哈迪斯冥狼与阿迪达斯玛部落
    - 五天的通牒并非堕落精灵所订，而是冥族定下的总攻时间
    - 冥兽被阳光帝波罗的光斑照到即隆起血水四溢的脓包
  后果:
    - 爱琴大陆在一夜之间多出一个位面的敌人
    - 冥族只能蛰伏在森林深处避光，行动被日升日落掐着表
  对当前格局的影响:
    - 白天成了爱琴一方唯一的作战窗口，夜战等于把主动权交给冥族
    - 南十字星森林的地形决定了冥族的兵力优势施展不开

森林之怒绞杀:
  时间: 南十字星森林之战
  事件:
    - 刘震撼率两路大军趁清晨突袭，避开冥族最擅长的夜战
    - 牧树人长老克鲁伊夫发动森林之怒，古树根须把冥族绞杀埋葬
    - 耐温尔因克受脑痛之苦，哈格里夫斯借卓尔主母之手献上血腥玛莉
    - 冥界黑暗公爵瑞博克被父子三人联手围杀
    - 战事落幕后刘震撼拒答黑索银之秘
  后果:
    - 七十万冥族主力被南十字星森林吞没
    - 翡冷翠折损过半幻兽座龙与六十二头巨龙，冥兽尸体在烈日下腐化成脓水无法利用
  对当前格局的影响:
    - 冥族失去人海优势，只能改由统领级战力单点突破
    - 以日光与林地消耗亡灵的战法由此确立

虬角与血系领域:
  时间: 南十字星森林之战末期
  事件:
    - 冥界第二大统领瑞卡顿雅布持冥神骨朵登场，骷髅暴君、瓢甲虫法老与祖玛冥龙等超阶冥兽随后涌出
    - 魔龙、爱琴巨龙与冥族三方混战，魔龙二太子穆图与未婚妻夏尔芬被耐温尔因克一叉串死
    - 耐温尔因克扭断虬角施展究级角斗术，左角把场面跨时空传给冥界两位兄长，右角带上二十四种负面属性
    - 冥界大统领世代相传的虬角折断后不能再生长
    - 耐温尔因克借道被拒后以二重奏吟唱释放深红枷锁领域，抽取领域内一切有血生物的血液
    - 瑞卡顿雅布用湮灭镜轮把文托拉与里杰卡尔德化为碎片
  后果:
    - 冥族的战斗方式由兵团推进转为统领级的领域对撼
    - 深红枷锁领域把战场上的有血生物全部变成供给冥族的血包
  对当前格局的影响:
    - 与冥界统领正面交手时，有血生物都要先算一遍失血的代价
    - 三大统领的虬角只能折一次，右角那二十四种负面属性不可复制

血河统领被俘:
  时间: 南十字星森林之战终局
  事件:
    - 海伦以生命礼赞夺走耐温尔因克的契约
    - 冥族骸河大统领阵亡，血河大统领被俘，魔族全军覆没
    - 被俘后的耐温尔因克宁肯自残也要逼兄长离开，对海伦言听计从
    - 生命礼赞是战神坎帕斯对仆人的奖赏，也是祭祀与魔宠感情升华到极点的证明
  后果:
    - 冥界三大统领一死一俘，只剩第一大统领茵格里切宝撑场
    - 冥界换俘的动机就此产生，目标落在何塞家的孩子身上
  对当前格局的影响:
    - 海伦手上握着一张能牵动整个冥界的契约
    - 冥界从此更想把何塞家的孩子抢回冥界

名剑召唤采玉城:
  时间: 大战末期
  事件:
    - 冥界第一大统领茵格里切宝亲自跨出冥界，率四头六阶铠甲冥龙赶到采玉城战线
    - 他以炼狱界名剑提尔锋与暗黑失乐园出战，名剑召唤降临后采玉城超阶力量折损过半
    - 暗黑失乐园是茵格里切宝的独门绝技，它出现在西雅美人鱼国王的填海钻石佩饰中
    - 刘震撼用血婴小癞痢格飞茵格里切宝的名剑提尔锋
    - 刘震撼领悟琴心，召月光之陨竖琴齐射，逼茵格里切宝以暗黑失乐园遁走
  后果:
    - 冥界把最后的底牌从冥兽海换成第一大统领本人
    - 爱琴一方以琴心找到了压制冥界名剑召唤的手段
  对当前格局的影响:
    - 茵格里切宝一露面，西雅海族与冥界之间也接上了线
    - 采玉城的折损把冥界的损失推到建界以来的最高点

<%_ } _%>
<%_ if (chap >= 705) { _%>
换俘与统领之死:
  时间: 大战终局
  事件:
    - 冥界的目标是用何塞家的孩子换回被俘的血河大统领
    - 茵格里切宝跪求饶过冥界，被小空砸死
    - 亡灵生物与亡灵法术在爱琴主流宗教中被定义为亵渎光明，黑暗系魔法长期处于低谷
    - 圣保罗教廷与冰雪女神教为对付带亡灵特性的冥界生物，与比蒙神庙破天荒坐到一起
    - 人类教廷的小修女贞德身为候补圣女却驱使亡灵战士，正向圣坛祭祀的方向发展
  后果:
    - 冥界三大统领尽数折损，位面失去主政者
    - 人类神权与比蒙神庙之间的世仇被冥族这条共同敌人撬开一道缝
  对当前格局的影响:
    - 冥界再也拿不出牵制爱琴的筹码，位面事务退到次要位置
    - 教廷藏的死亡领主遗物与比蒙战歌之间的隐秘往来被摆上台面
<%_ } _%>
