@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 9 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 20
第一章至第二章·胸罩岛与启蒙:
  时间: 胸罩岛篇第一、二章，荒岛篇结束之后
  事件:
    - 刘震撼梦见与列娜洞房后醒来，为造木筏探遍全岛，岛上没有合用木材
    - 海伦吟唱通灵战歌召来一只酸液鱼鹰作魔宠，补上先前战死的那一只
    - 他登上退潮石梁对面的死火山口小岛，发现火山口里长满十米高的佛肚竹
    - 半月后两人再登邻岛，海伦讲歌力靠冥想积攒、战歌加持有五盎司沙漏时限、祭祀体质孱弱但可收追随者
    - 刘震撼苦练侦察兵锁技赛勃，果果跟着学压韧带
  后果:
    - 造筏的木料从邻岛解决，出海从空想变成工期
    - 赛勃锁技成为他手里唯一练到熟的空手手段
  对当前格局的影响:
    - 退潮时的石梁是两岛之间唯一的通路，行动被潮水时刻卡住
    - 海伦的魔宠是一只被神庙看作魔法微薄的酸液鱼鹰，果果则是身份不明的霜雪皮丘兽

第三章·火山坑探秘:
  时间: 胸罩岛篇第三章
  事件:
    - 他在火山口唱起歌，山谷回声让海伦听出歌声里有澎湃歌力
    - 同一首换成比蒙语再唱，却毫无效果
    - 海伦纠正他的粗口，两人斗嘴后她表白异族之恋的心意
    - 他以树藤垂降二十多米深的火山口，把血渍袜子裁成布条系在海伦与果果身上
  后果:
    - 汉语唱法与歌力之间的关联被当场验证，比蒙语反而唱不出来
    - 袜子布条成为两人之间第一件信物，海伦把它系在发梢
  对当前格局的影响:
    - 玩家手里多出一条不能对外人说的唱法，越用越显眼
    - 火山口深处还有没探完的洞穴，两人把这里当成常来的地方

第四章·自然进化:
  时间: 胸罩岛篇第四章
  事件:
    - 他在谷底发现幽深山洞，涂满狼粪掩去气味潜入，用手刀与扭颈连杀三只幼狼
    - 出洞后海伦的战歌忽然变化，自然进化出祝福战歌，令他目明体敏
    - 竹林深处随即响起母风系魔狼的示威狼嗥
  后果:
    - 海伦在法典之外完成一次自然进化，战力越过她原本的阶位
    - 杀幼狼的动静招来母狼，竹林里多出一头复仇的魔兽
  对当前格局的影响:
    - 玩家不敢再让海伦单独待在崖上，两人的行动此后绑在一起
    - 母风系魔狼成为火山口竹林里最直接的一层危险

第五章·双兽相斗:
  时间: 胸罩岛篇第五章
  事件:
    - 难产的母风系魔狼与一头头生鹿角的巨龟在竹林中央对峙
    - 巨龟卡着一枚龟蛋、失血虚弱，魔狼的风刃砍不动它的龟壳
    - 魔狼舍命扑咬巨龟咽喉，巨龟一爪把魔狼半截身子砸进地面
    - 扑斗的气浪震得刘震撼险些呕吐
  后果:
    - 母狼被砸进土里无法脱身，巨龟也耗尽了力气
    - 龟蛋与龟壳都留在竹林中央，成为他面前的两件东西
  对当前格局的影响:
    - 玩家可以自由选择先取狼还是先取龟，两条收获互不冲突
    - 火并现场是一片开阔地，此后成为他与海伦常走的一处

第六章至第七章·处女召唤:
  时间: 胸罩岛篇第六、七章
  事件:
    - 他补一箭射穿嵌在土里的母狼喉咙
    - 巨龟壳上刻着中国古篆数字，他认出刻字者与自己同源
    - 他吟唱通灵战歌把巨龟收作自己的第一只魔宠，只收到赑屃断续的心念，巨龟随即死去
    - 海伦攀崖赶到，他用枯竹火葬巨龟并剥下半条狼皮
    - 海伦辨出龙息，说导师崔蓓茜是亚龙祭祀，家乡神庙的维安大萨满是模特族龟人
  后果:
    - 处女召唤以魔宠当场死亡收场，他此生不能再征召第二只魔宠
    - 海伦推断龟壳文字与李察同源，他从此不再提回家的事
  对当前格局的影响:
    - 玩家背上终生只有一只魔宠的名额已经用掉的既成事实
    - 龟壳成为他随身携带的物件，也是龙祭祀身份的凭据

第八章·龙蛋大餐:
  时间: 胸罩岛篇第八章
  事件:
    - 他剖开巨龟尸体，掏出番瓜大的龟蛋烤着吃，果果跟着同食
    - 他邀海伦共餐被婉拒
    - 两人聊起霍比特半身人与匹格族贪食的原罪
    - 海伦警告他不可吃自己的魔兽
  后果:
    - 一人一兽把亚龙蛋吃下肚，身上的变化从此开始
    - 海伦没有吃蛋，后面才被她自己排除在诅咒之外
  对当前格局的影响:
    - 玩家与果果共享同一份来路不明的力量，谁也甩不开谁
    - 岛上食物储备被这一顿消耗掉一大块

第九章·大鼓之议:
  时间: 胸罩岛篇第九章
  事件:
    - 两人定下带走龟壳当帐篷，他从龟下颌剖出夜明珠，龟头内没有晶核
    - 海伦讲晶核的用途与比蒙出口晶核的缘由，又论祭祀与魔法师、人类与比蒙的优劣
    - 海伦将转职战争祭祀，选乐器时被他劝用大鼓
  后果:
    - 大鼓成为两人争执的第一件正事，海伦当场生气
    - 龟壳与夜明珠成为离岛后要带走的家当
  对当前格局的影响:
    - 玩家与海伦在战歌乐器上的分歧没有真正解决
    - 海伦的转职意味着她的战力与地位都要往上走一层

第十章·竹林初夜:
  时间: 胸罩岛篇第十章
  事件:
    - 海伦为大鼓一事生气，又被哄好
    - 刘震撼与果果吃下龙蛋后浑身滚烫，胸口浮出怪兽脑袋
    - 海伦依狐族传说以处女花冠为他解除不良状态
    - 两人在竹林中初夜，海伦自认背弃教导、失去处女祭祀花冠
  后果:
    - 龙蛋带来的高热被压下去，胸口与颈上的纹路留了下来
    - 海伦失去处女花冠，此后无法再以狐族花冠解不良状态
  对当前格局的影响:
    - 玩家的身体状况成为需要长期观察的隐患
    - 两人的关系越过师徒界限，回不去了

第十一章·诅咒前奏:
  时间: 胸罩岛篇第十一章
  事件:
    - 果果拖走羽衣并捅醒海伦，闹剧收场
    - 海伦见他颈上有血色怪兽纹身，郑重警告祭祀不可随意文身
    - 两人先怀疑是吃下亚龙蛋导致的类狂化
    - 海伦讲狂化战歌的威力与后遗症，又讲比蒙巫医的双重身份与自主狂化的狂兽战士
  后果:
    - 纹身被列入祭祀禁忌，他颈上的记号瞒不住同行
    - 类狂化这条思路被摆上台面，海伦开始往更坏的方向查
  对当前格局的影响:
    - 玩家身上多出一处一眼可见的破绽
    - 海伦的手里没有可用的医者，诊断只能靠她自己翻典籍

第十二章·诅咒降临:
  时间: 胸罩岛篇末章，离岛扎筏之前
  事件:
    - 海伦在祭祀法典中找到对应条文：魔宠非自然死亡后极少数会把自身的魔法元素力量嫁接给祭祀
    - 她讲这种现象千年以来只出现过两次，神庙称之为血之祭奠的诅咒
    - 她排除狂化，判定他中的正是血之祭奠的诅咒，战歌效用只剩两成
    - 他同时拥有魔力与歌力，两者剧烈排斥，类狂化状态已经发作过
    - 果果因趴在他头顶吃下龙卵被牵连，被她称作厄运之兽，他护短改称幸运之兽
  后果:
    - 正牌比蒙战歌在他嘴里全部作废，龙祭祀的名头只剩一个空壳
    - 他此后再想在战歌上继续进阶已无路可走
  对当前格局的影响:
    - 玩家此后只能靠自创的汉语战歌出手，暴露即被判异端
    - 果果从最低阶魔兽变成他唯一的战力与唯一的同伴
