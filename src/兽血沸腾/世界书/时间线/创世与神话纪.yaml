矿石生命创世:
  时间: 无可考纪年，爱琴最古的创世传说
  事件:
    - 矿石生命创造了爱琴万物，后因造物的呼吸循环改变大气含氧量，反遭氧气病毒侵蚀，整族陷入永恒石化
    - 创世者就此缺席，爱琴再没有造物主直接干预
    - 地底圣井是水晶人的研究室
    - 寇涛人鱼每千年发现的珊瑚美人，实为石化的水晶美德罗人
  后果:
    - 矿物进化种族散落爱琴与地底，寿命极长
    - 造物留下了物种与生态，没有留下律法或代言人
  对当前格局的影响:
    - 各族信仰都无创世者的直接神谕，教义只能由教会与神庙自行裁定
    - 地下深处的矿物种族遗存是地底世界的重要居民来源

泰坦治世:
  时间: 远古，矿石生命石化之后的第一个强权时代
  事件:
    - 上古泰坦巨人代替众神巡游天空，座驾为泰坦巡游战舰，以富氧金属为主体、靠氧爆金属舵轮的反作用力驱动
    - 泰坦分封四大纯血杜伊嘉尔，即黄金矮人、白银矮人、野矮人与盾斧矮人，守护爱琴四大擎天柱
    - 黄金矮人被分封在爱琴第一高山泰穆尔拉雅雪山，从不出世，除非天下大变、爱琴危在旦夕
    - 泰坦巡游战舰原版设计图纸被四大杜伊嘉尔各掌四分之一，缺任何一部分都无法制造
  后果:
    - 泰坦血脉成为爱琴血统与力量的最高溯源，巨人按与泰坦血脉的远近分独眼与双眼两类，身高跟着眼睛走，三只眼极为罕见
    - 依附泰坦血脉的种族需以道格拉斯风暴号角召唤，号角必须以超阶魔兽的角制成并用泰坦之血楔刻古代铭文
  对当前格局的影响:
    - 四大杜伊嘉尔的血脉散落各地，泰坦巡游战舰图纸被分成四份，缺任何一份都造不出龙骨
    - 冰霜巨人、佛巨人、泥足巨人、堤丰巨人、雾霭巨人与灰矮人在爱琴各地的巨人谱系里都能找到同源分支
    - 黄金矮人全族受神之限制，战斗中必须披挂纯金战甲、使用纯金器械，法师也不例外

创世之神的宠儿:
  时间: 一万年前
  事件:
    - 地精是当时世界上最聪明的种族，最早拥有楔形文字的智慧种族，被称为创世之神的宠儿
  后果:
    - 地精文明崩落，后世只余遗民，社会地位卑微
  对当前格局的影响:
    - 地精的上古身份与万年后处境反差极大，炼金、爆破与机关之术的渊源多指向地精旧文明

远古天神血脉:
  时间: 远古
  事件:
    - 巨龙之中除却拥有远古天神血脉的七彩龙与仙女龙，其他巨龙必须达到四阶之后才能幻化成人形
    - 远古巨龙温格是龙族最长寿的一位土系四阶巨龙
    - 七彩龙的天赋特技龙威可以暂时吹熄灵魂活跃能力，只有泰坦的叹息才可媲美；仙女龙的天赋特技翡翠之梦可以剥离奥术并调度帮手，另有元素免疫之体与元素反噬指
    - 龙威一生只能使用一次，正面承受者会被震晕一盎司沙漏时间
  后果:
    - 龙族以血统分阶层，上位龙族把持龙城
    - 巨龙的血脉在爱琴广布，远古巨龙的直系后裔并不罕见
  对当前格局的影响:
    - 龙城由彩虹龙城与辰星龙城两大上位龙族共同主导，是爱琴龙族最高权力机构
    - 巨龙骄傲，只有最高贵的勇士才能得其亲睐，龙骑士与龙祭祀因此成为传说中才该出现的英雄

史前魔兽放逐:
  时间: 远古蛮荒时代至一万年前
  事件:
    - 神圣巨龙在爱琴大陆四个不同地点放逐四大史前魔兽，蓝眼高棉巨蚁与邪眼暴君同属其中
    - 一万年前邪眼暴君被龙族放逐到地底世界，至今仍然活着
    - 一万零七百五十三年前，地狱黑龙当代族长特拉帕多尼被辰星与彩虹两大龙城请出的远古巨龙温格重伤，全族被驱入地底世界
  后果:
    - 地底世界聚集了大量上古魔兽与流放种族，成为爱琴地表之下的另一套生态与权力结构
  对当前格局的影响:
    - 地底世界是独立于爱琴诸国的战场，黑龙、卓尔、矮人与史前魔兽在此并存
    - 邪眼暴君与蓝眼高棉巨蚁仍在地底存活，是地下探险的高危目标

远古神祇与封印:
  时间: 远古
  事件:
    - 艾瑞达焰魔是从混沌世界来的领主级别魔兽，又名安瑞达或毒焰魔王，崇尚混乱鄙视秩序，被月神爱露尼封印后深埋在十星连珠寒潭附近的冻土之中
    - 狂战士信奉的雷神欧丁骑着八足巨马征战沙场，多足巨马即远古祖马的变种后裔，通常六条腿，最优秀者八条腿
    - 燃灵之火来自混沌世界，属高端火系元素力量，是终生制的强化版照明术，专克藏形匿影一类高阶隐身术
  后果:
    - 混沌系力量被神祇封印在爱琴各处，封印点成为长期隐患
  对当前格局的影响:
    - 混沌世界与爱琴之间存在裂缝通道，魔族与混沌领主的入侵路线由此而来
    - 寒潭冻土与时空大裂缝一类地点的禁制一旦松动，战局就会转向

神授战歌的源头:
  时间: 远古
  事件:
    - 斯迈族天鹅人属博德族，远古时被战神坎帕斯赐予禁空之歌而失去飞翔能力，在变身体系里算空栖形态
    - 比蒙战歌中任何一首都有拗口的古精灵语与远古龙语音阶，只有导师弄懂含义才能把整首战歌完整转嫁给学徒
  后果:
    - 战歌来自神授与古语传承，掌握上古音阶的族群才能完整传歌
    - 模特族龟人祭祀因年龄大懂得几个上古音阶，因此能传承完整战歌
  对当前格局的影响:
    - 神庙对「另类战歌」的敌意有神话依据，擅自改创战歌被判为异端
    - 战神坎帕斯是比蒙的守护神，给勇士与祭祀同样通往更高更强的道路

史前文明遗存:
  时间: 数万年前至远古
  事件:
    - 哑月是数万年前远古时代神秘亚特兰蒂斯大陆的智慧种族建造的空中飞行壁垒，能抵消来自地心的引力自行悬浮，有大型元素法阵可以环游世界甚至潜进深海
    - 远古曾有水晶美德罗人与钟乳石美人等史前生命
    - 沙漠在很久以前也是大海，巨螺是远古时代一种比较厉害的海底魔兽
  后果:
    - 爱琴各处散布着无法复现的上古造物与遗迹
  对当前格局的影响:
    - 拿仑角海峡两侧山体雕成持剑巨神石像，是远古神魔大战的遗迹
    - 上古遗迹是各方争夺的战略资源，图纸、神器与遗迹本身都能改变战局
