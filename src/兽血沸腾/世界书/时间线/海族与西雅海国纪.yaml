@@private
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
海外三国并立:
  时间: 远古以来
  事件:
    - 海里的国分三家，西雅归美人鱼，亚力士归塞壬，香帕归娜迦
    - 三家的疆界都不与陆地接壤，单拿一国出来就比整片爱琴大陆更宽
    - 西雅水族的王族按血缘分作五支，四方海疆由世袭的珊瑚顶亲王分领
    - 西雅王都把上百座死火山掏空砌成蜂巢状的冕冠之城，额廊嵌夜明珠，海草笼里养着发萤光的鱼
    - 光西雅与亚力士两家就能拉出两千万专司征战的职业军人
  后果:
    - 三家的王与平民是两副模样，一望便知出身
    - 海中国度以疆界为脸面，外族的船帆越过界线就算上门挑衅
  对当前格局的影响:
    - 魔界三个大陆的正规军加起来还不到海族总兵力的三分之一
    - 海族出征爱琴时，专管运动辎重后勤的民夫多达二十一亿人

摩尼教灭淡水人鱼:
  时间: 三千年前
  事件:
    - 摩尼神教的信徒一心求长生，把淡水美人鱼捕来杀了，取脂肪熬灯油
    - 剑桥绿洲摩尼神庙的神像上那盏万年不灭的青色圣火，烧的就是人鱼脂肪熬出的油
    - 淡水美人鱼原本住在爱琴大陆的江河湖泊里，与西雅的海洋美人鱼是同一血脉
    - 剩下的淡水美人鱼躲不进海，海水里的盐分对它们就是绝路
  后果:
    - 淡水美人鱼自此灭绝，可能存世的最后一支退进南十字星森林的沉寂之海
    - 侥幸活下来的淡水美人鱼靠着长年守着寒潭修出冰霜系魔法，与花精灵一族相依为命
  对当前格局的影响:
    - 淡水美人鱼发明了离水保湿法阵，靠它在陆地久留不腐
    - 摩尼神教与海族之间的旧账至今没有结清

水结界与海陆大战:
  时间: 两千年前
  事件:
    - 西雅海族出了一位极出色的风暴撕裂术士，钻研出超强水结界，海族军队这才挣脱了不能久离水面的束缚，有本事上岸侵略
    - 光西雅一国就把爱琴大陆杀得血流成河
    - 人类、比蒙、精灵、矮人四族齐上，才勉强把这支海族军队打退
    - 比蒙里的水族在这一仗中十去其九
  后果:
    - 比蒙王国从此再没有成规模的水军，远洋航行只能靠人类的船
    - 海族把这场败仗记成旧仇，两千年后仍在筹划再战
  对当前格局的影响:
    - 加布林族鲨鱼人当年是那场海陆大战的海上主力，水里陆上都是霸主
    - 海族军队一上岸就得靠离水法阵撑着，法阵一破，人成片窒息

封海与行船许可:
  时间: 海陆大战之后
  事件:
    - 比蒙的先人与西雅海族的先人立过一纸盟约，陆上种族这才被准许涉足七海
    - 西雅海族容不得载着军队的舰船从自家头顶的天空开过去，视之为对尊严的挑衅
    - 想把货船开进各大海洋，只有特别强盛的国度按年纳贡，才换得到海族给的许可
    - 爱琴大陆有句谚语，说海族本来就有出尔反尔和说谎的权利，海族贵族的话再金贵也能随时收回
  后果:
    - 海路成了海族手里的开关，陆上国家的远洋贸易要看海族的脸色
    - 一千年过去，西雅海族认为那份老盟约到了结束的时候
  对当前格局的影响:
    - 比蒙没有大型战舰，海路一封，海伦与主角回家无望
    - 人类商船与比蒙的物资往来被迫挤在近海和纳贡国的航线上

深渊神使与海神教:
  时间: 千年前
  事件:
    - 西雅海域盘着两个狠角色，潮汐领主革瑞恩与九头蛇怪许德拉，海族封它们作神使
    - 这两个一年醒一次，一醒就要吞掉五百个灵魂和脑浆
    - 填它们肚子的是残余的蝴蝶人与蝉人
    - 革瑞恩是欺诈者的化身，春季醒来，召得来潮汐；许德拉秋季醒来，召得来海啸
  后果:
    - 虫族比蒙的鸳弗瑞族蝴蝶人与斯凯德族蝉人只剩遗脉流落海外，成了海族按时上缴的贡品
    - 海神教设大侍祭一职，海族的信仰与王权绑在一起
  对当前格局的影响:
    - 两头深渊强者后来被云泰方士的八门金锁阵禁锢在西雅海域的孤岛上，海族的供奉随之中断
    - 它们被放出后转身成为刘震撼一方的战力，革瑞恩当上潮汐大公爵

陆地金属的渴求:
  时间: 近千年来
  事件:
    - 海里的火点不着，铁也炼不出来，海族要兵器只能从陆地换，手头那些贸易来的刀剑在海水中泡不了多久就锈了
    - 除王族之外的海族都上不了两栖，上陆之后连水元素都召不动
    - 海族城里珍珠堆得跟土一样、金子跟铁一样贱，可阳光、月色与篝火在海族眼里反倒跟陆上人看见珍珠水晶一般稀罕
    - 海族年年派人上陆打秋风，官面上不出面，出面的多是海族盗贼和佣兵
  后果:
    - 海族与陆上势力做买卖时，要的不是钱而是成船的金属兵器
    - 海族的对外关系因此长期围着矿产与军械打转
  对当前格局的影响:
    - 拿金属兵器就能换海族的物资，这条线成了跨族贸易的开端
    - 只要有人能稳定供铁，海族就愿意在别的条件上让步

鲸脉计量与后勤:
  时间: 近千年来
  事件:
    - 西雅海国不用沙漏计时，改用鲸鱼脉搏，一呼一吸算一个单位
    - 脉搏每分钟走七次，走到第四百二十次刚好是一整小时，换成云泰古制就是半个时辰
    - 攻城器械的组装期限同样按鲸脉开，数满四百二十下还装不起来便算误期
    - 海族踏上陆地之后，一天要吃的盐比陆地种族多出上百倍，离水结界只管皮肤的水分，盐分一点也补不上
    - 海族的辎重与攻城器械全靠奴隶拖着滚木搬，没有畜力可以代劳
  后果:
    - 海族作战的时间表按鲸脉排，与陆上国家的沙漏计时合不上
    - 咸盐成了海族远征就地补不上的死项，后勤线一断全军瘫痪
  对当前格局的影响:
    - 咸盐被海族后勤列作天字第一号军需
    - 海族的海洋牧民会驱赶回游鱼群堵死桑干河的通海口，堵上之后至少要一个月才恢复通航

攻占黄金海岸:
  时间: 主角穿越前后
  事件:
    - 西雅海族打下黄金海岸大陆，就地开矿，自己锻起钢铁武器
    - 海族往西方海域调集了三万风暴撕裂者
    - 西雅的马库拉族招潮蟹人术士能召来雷电，登陆时专做开路法师
    - 海族筹划半年，与亚力士海国联兵入侵爱琴大陆
  后果:
    - 海族补上了缺铁的短板，兵工产能从无到有
    - 亚力士海国与西雅海国谈判结盟，两国合力图谋爱琴大陆
  对当前格局的影响:
    - 海族的入侵不再只为掠夺，而是要在陆地上站住脚
    - 海族登陆时带着自锻的钢铁武器，与陆上军械的质量差距被拉近

<%_ if (chap >= 21) { _%>
公主出走与封海:
  时间: 主角成为龙祭祀之后
  事件:
    - 西雅海国的公主艾薇尔跟比蒙一方私奔，从此与本国恩断义绝
    - 王子西米里安出面索还妹妹，被回绝后要刘震撼带头投降
    - 西雅海族放出话来要血洗比蒙王国，把艾薇尔架上祭坛
    - 西雅海族正式作废千年盟约，封了海路
  后果:
    - 海族与比蒙的旧盟约作废，海上通道对陆上种族彻底关闭
    - 艾薇尔同时失去海族公主的地位与安全，成为双方争夺的目标
  对当前格局的影响:
    - 比蒙与人类之间的物资改走陆路，多洛特一线的重要性上升
    - 海族把私人恩怨升级成国战，陆地各族只能被动应战

<%_ } _%>
<%_ if (chap >= 43) { _%>
娜迦登陆与缴械:
  时间: 主角经营翡冷翠期间
  事件:
    - 海娜迦出自堕落精灵，住在多瑙西海，被塞壬女王征召到多瑙西部登陆
    - 娜迦的兵种齐全，指挥官、法师团长、海狮战士与海象骑兵编成四支建制，是海族里打法最像陆军的偏师
    - 二十万娜迦大军三天内枭下荒原三大盗匪首级，直扑落日大沼泽的伦敦城
    - 卢塞恩与比蒙联手击溃这支大军，娜迦集体缴械投降
  后果:
    - 娜迦的法师团留下给翡冷翠当教官，海族的法术底细向翡冷翠敞开
    - 长老级的八臂娜迦能用风洞传送把人送回西雅海国，海族的后撤线始终握在手里
  对当前格局的影响:
    - 堕落精灵的参战使魔族与海族在目标上分道，魔族成为终盘的真正主敌
    - 海族失去一支陆战化偏师，登陆作战只能靠西雅本国的主力

