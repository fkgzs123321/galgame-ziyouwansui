<%_ if (chap >= 245) { _%>
海慕联军西征:
  时间: 主角成为神曲萨满之后
  事件:
    - 海族与慕兰人结成西征联军，由莱茵克尔亲王统帅，贝肯鲍尔与西米里安王子在列
    - 联军从海上登陆，经阿尔卑斯湿地推进，海族西征大营设在一年中有三百二十天阴雨不歇的湿地上
    - 海族工兵在忘忧谷一带筑起珊瑚海防线，忘忧谷与叹息之墙扼住海族西进的黄金水道
    - 比蒙在桑干河一线击溃联军，辎重被烧，离水法阵被冲垮，上岸的海族战士成片窒息
  后果:
    - 联军主战场折在阿尔卑斯湿地一带，海族再没有单独发动大规模报复的力气
    - 海族与慕兰退居次要战线，魔族成为终盘的真正主敌
  对当前格局的影响:
    - 海族在天上没有一兵一卒，地上也架不起防空火力，这两处死穴决定了他们只能挑落点打
    - 离水法阵被端掉就会成片死人，这一条死穴决定了登陆战的打法
<%_ } _%>
