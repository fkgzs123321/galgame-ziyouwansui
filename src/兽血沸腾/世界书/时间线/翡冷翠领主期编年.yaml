@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 59 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 72
第一章至第二章·赎买獒人:
  时间: 领主期第一至二章，威瑟斯庞城外、博格村与采石场
  事件:
    - 李察王子在威瑟斯庞城外显露亚龙坐骑，向海伦索要手套求爱被婉拒
    - 刘震撼用敲竹杠得来的钱回到博格村，向西马克子爵赎买獒人囚犯
    - 领头者贝拉米率众吻靴立誓效忠
    - 他唱前线牢歌，被海伦用《祭祀法典》中另类祭祀被烧死的记载警告
    - 獒人只肯接受皮甲并自带猡莎兽后腿棒骨，他甩飞刀扎中贝拉米掌侧逼其学飞刀，熊猫们也练起飞刀
    - 随队巫医诺查丹玛斯出场，海伦讲道格族獒人一生只伺奉一个主人
  后果:
    - 队伍得到第一批誓死效忠的班底，也第一次把异端的边界摆到明面上
    - 飞刀成了獒人的制式本事，行军课目添了一项
  对当前格局的影响:
    - 赎金已付，玩家还欠着西马克子爵一笔人情
    - 汉语战歌已经在队伍里被人听过，海伦手里有法典的判例

第三章·完全野性与迷路:
  时间: 领主期第三章，荒原边境线
  事件:
    - 队伍抓到一名食人魔俘虏卡鲁，刘震撼逼问后命其拉车
    - 他让獒人踢裂地精俘虏的脾脏、踏断手腕立威
    - 他用雪茄在卡鲁胯下烫出印签
    - 队伍走到南十字星森林边缘，看见牛顿巨鸟盘旋
    - 他发现自己看错地图，找不到墨晶峡谷兵站的方位
  后果:
    - 食人魔卡鲁成了随队的苦力，地精俘虏成了立威的样本
    - 队伍在荒原上失去兵站的方位，路线成了眼下最大的变数
  对当前格局的影响:
    - 玩家要就地图的事当场问清，宁可多绕两天也不乱闯
    - 卡鲁与奴隶的看管必须排在人手前面

第四章至第五章·沙罗曼祭祀与达多村:
  时间: 领主期第四至五章，荒原边境线与白令山脉霍比特半身人达多村
  事件:
    - 沃尔夫米格军团截住队伍，军官罗伯特.巴乔露出萎缩的双手
    - 罗伯特被认出是狈族沙罗曼祭祀，海伦讲明狈族以双手换来洗浑战歌、只对狼族近支有效的来历
    - 他求助驱赶闯入半身人村庄的星尾龟
    - 队伍抵达达多村，长老哭诉星尾龟吃光酿酒用的香酒百合
    - 罗伯特吟唱洗浑战歌令獒人与狼骑兵狂化，刘震撼以密集阵迎战
    - 时空裂缝旁又钻出科摩多战争巨兽
  后果:
    - 半身人的粮与酒成了这桩差事的报酬，狈族的人情也记在他名下
    - 洗浑战歌的代价被摆上台面，狂化兵种第一次正面撞上密集阵
  对当前格局的影响:
    - 玩家要接下星尾龟这桩差事，还是护着队伍从裂缝旁绕过去
    - 时空裂缝旁随时会钻出战争巨兽，路线必须避开

第六章至第七章·生命礼赞与龟珠:
  时间: 领主期第六至七章，白令山脉达多村外
  事件:
    - 凝玉以幻术巨兽诱敌，海伦的鱼鹰阿拉贡被雷霆闪电劈成焦炭
    - 海伦因魔宠阵亡触发千年只有两次的生命礼赞，与科摩多战争巨兽签下心灵契约
    - 狈人罗伯特嫉妒得发狂，海伦注定要以战鼓为乐器
    - 刘震撼从星尾龟尸身取出顶级晶核与散发酒香的漆黑龟珠
    - 半身人长老道出龟珠泡水成酒、能酿出最香醇美酒的奇效
    - 双方约定日后由半身人做采邑的烹调主管
  后果:
    - 海伦得到千年一遇的战争巨兽，乐器与人选都还没定
    - 半身人主厨与龟珠酿酒的手艺被定给未来的采邑
  对当前格局的影响:
    - 罗伯特为生命礼赞嫉妒得发狂，狈族与狼族的旧账随时会翻出来
    - 队伍要先把海伦与新魔宠安顿下来，战鼓的事往后放

第八章至第九章·牧树人与元素之泉:
  时间: 领主期第八至九章，达多村与南十字星森林
  事件:
    - 半身人长老用烤岩蛙腿说服刘震撼收下随队主厨，果果赖在艾薇尔怀里不肯随他上路
    - 他独自前往南十字星森林，临行前泄露龙祭祀身份，罗伯特惊得痴呆，古德与贝拉米偷走他的雪茄
    - 他一路猎杀魔兽取得晶核
    - 夜间恩特族牧树人寻香现身，自称植物进化的智慧人类
    - 牧树人用元素之泉、桫椤蕉与千色茑萝种子换走他的香瓜种子
    - 他被偷灌走两加仑元素之泉
  后果:
    - 他手里多了一批种子与两加仑元素之泉，南十字星森林的物产成了长期的买卖
    - 龙祭祀的身份在狈人面前彻底露了底
  对当前格局的影响:
    - 元素之泉的来路与效果还没有问清，队伍只能先带着走
    - 玩家要独自面对荒原上的魔兽与陌生人，果果留在了艾薇尔身边

第十章·墨晶峡谷兵站与维埃里:
  时间: 领主期第十章，墨晶峡谷兵站
  事件:
    - 他抵达墨晶峡谷兵站，熊人中队长维埃里出示军部授权书
    - 维埃里命他去暗精灵地盘营救被困的唐藏帝国亲王
    - 维埃里讲述暗精灵来历、黑暗法术与生命之泉
    - 队伍进洞即遭箭雨伏击，牛头人夜盲伤亡惨重
  后果:
    - 军部的差事落到他头上，授权与粮械成了谈判的筹码
    - 暗精灵地盘的箭雨与夜盲成了这趟任务的头号杀手
  对当前格局的影响:
    - 玩家要先把授权与粮械要足，再带人进洞
    - 洞里地形与暗精灵布防都没有摸清，只能先探路

第十一章·艰难任务与暗精灵洞窟:
  时间: 领主期第十一章，暗精灵地盘与生命之泉洞窟
  事件:
    - 他抛出夜明珠照亮战场，以密集阵狼牙棒与细刺剑连杀四名暗精灵女弓箭手
    - 十六名布尔战士眼眶中箭阵亡
    - 他逼供女俘虏，问出四名东方旅行者中有一位会魔法的匹格喝了生命之泉
  后果:
    - 队伍在洞中付出惨重伤亡才打开局面
    - 生命之泉与东方旅行者的下落被问了出来
  对当前格局的影响:
    - 暗精灵地盘仍被箭雨压着，退路与补给都要自己张罗
    - 玩家手里攥着军部的授权与一个活口，救人还差最后一步

第十二章·一个崭新的生命:
  时间: 领主期第十二章 一个崭新的生命，生命之泉洞窟
  事件:
    - 东方旅行者现身，奄奄一息的匹格魔法师产下兽亲小猪崽后死去
    - 苦行僧亲王将女儿托付给同为匹格的刘震撼
    - 亲王留下白色玉佩与精金钵盂
    - 亲王答应回国后推动唐藏帝国与比蒙王国通商
  后果:
    - 他手里多了一个兽亲孩子与唐藏帝国的信物
    - 唐藏与比蒙的通商线有了一个开口
  对当前格局的影响:
    - 玩家要收下这个孩子与信物，把唐藏这条线攥在手里
    - 亲王的身份与暗精灵为何扣人都还没有问清

第十三章·这个小猪好厉害:
  时间: 领主期第十三章 这个小猪好厉害{V第十二章}，暗精灵地盘与博格村
  事件:
    - 刘震撼与维埃里解剖地狱黑龙，取出龙晶与龙皮
    - 维埃里单膝跪地立誓追随
    - 回到博格村，小猪崽喀秋莎连发水箭射倒食人魔卡鲁、射塌两座角楼
    - 三个美女与果果惊叹不已
  后果:
    - 队伍里多了一头能解剖巨龙的中队长与一个会水箭的兽亲孩子
    - 队伍从一名匹格学徒扩成能带出去打仗的班底
  对当前格局的影响:
    - 玩家要替喀秋莎定下路子，把水箭当战力来练
    - 维埃里的位置与随众的名分都还没有安排
