@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 0 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 8
第一章·勇斗魔狼:
  时间: 荒岛篇第一章，穿越落点当夜
  事件:
    - 刘震撼在南疆战场中弹后于荒岛醒来，落点是一具匹格族猪头人的身体，身上只有破衣
    - 他以鲸鱼肋骨作矛、椰瓢遮身求生，认下会模仿他动作的金毛小兽并取名果果
    - 入夜一头通体瓦蓝的风系魔狼现身，从狼吻里喷出高速内旋的风团，风刃削断鲸鱼骨矛
    - 他以拳膝砸中狼的鼻梁，撕下树藤缠住狼颈
  后果:
    - 鼻梁被风刃削成两个朝天的窟窿，一张脸就此毁掉
    - 人与狼在沙里僵持，树藤成为他手里唯一的凭仗
  对当前格局的影响:
    - 玩家开局无火种、无淡水、无合用木材，第一场战斗决定能否活过第一夜
    - 果果此刻只是一头会模仿动作的小兽，冰冻本领尚未显露

第二章·荒岛采购:
  时间: 荒岛篇第二章，斗狼的次日
  事件:
    - 果果挣脱他拎着它的手，鼓起肚皮喷出白色冰冻气团，冻住巨狼正在凝聚的风刃，狼当场毙命
    - 他勒住狼颈直到树藤绷断，剥下蓝狼皮、拔下狼牙，制成弓与箭镞
    - 他潜入海中撬开巨大海蚌，用蚌壳当锅煮海水制盐
    - 入夜他发现异界的月亮大得惊人
  后果:
    - 岛上有了弓、箭镞、蚌壳锅与海盐，肉食与饮水第一次稳定下来
    - 魔狼头部留下一颗六棱形蓝色晶核，被火一烧泛出蓝光，他误认作胆结石挂在果果脖子上
  对当前格局的影响:
    - 玩家获得岛上唯一的远程兵器，也第一次确认果果能杀魔兽
    - 霜雪皮丘兽的身份与晶核的来历都没人给他解释

第三章·沉船救孤:
  时间: 荒岛篇第三章，夜半狂风暴雨
  事件:
    - 一艘巨大风帆木船撞上礁石沉没
    - 他披着狼皮游过去登船搜刮，在压在最底层的大木箱里找到四五个长着狐狸尾巴的红发女孩
    - 一船人里只有一个还有心跳，他把人绑在桌子上撞开舷窗跳海，拖回岸边
  后果:
    - 荒岛上多出一个随时会断气的伤号
    - 沉船里的货物与工具成为他此后取用物资的地方
  对当前格局的影响:
    - 玩家要同时扛住救人与求生的两份压力，淡水和药物依旧没有
    - 他只知道救下的是狐女，不知道她的族属与身份

第四章至第五章·定居造锅:
  时间: 荒岛篇第四、五章
  事件:
    - 他抱着赤裸的小狐狸用体温救她，用果果冻出的冰块与嘴对嘴渡椰汁退烧
    - 他去砍红柳树时被一只会喷水箭的肥兔子射伤胳膊，回程砍树炖兔肉
    - 他嚼碎兔肉与鱼汤一口口喂小狐狸，用弯刀在门口挖出蓄水池
    - 他用弓箭射海鸟，以长袍做鱼线钓上一条四五斤的大鱼，又用鱼肋骨穿上鱼肠缝好手臂的箭伤
    - 他在煮东西的蚌锅水面上看到自己塌成两个窟窿的鼻子
  后果:
    - 蓄水池、火与锅齐备，岛上的定居条件成型
    - 小狐狸退烧转醒，仍未开口说话
  对当前格局的影响:
    - 玩家与狐女从单纯救助转入朝夕相处，换褥时已抓过她的尾巴
    - 岛上确认存在第二种会魔法的魔兽，水箭魔兔能发射水箭

第六章·开口说话:
  时间: 荒岛篇第六章，吃瓜泻肚之后
  事件:
    - 他吃瓜吃坏肚子，一夜泻到虚脱，醒来发现小狐狸已挣扎着做好饭并把褥子让给他
    - 他铲回长着瓜苗的粪便移栽成瓜棚
    - 小狐狸唱歌为他行智慧启蒙，两人接吻后她第一次开口说话
    - 她讲出处女花冠对祭祀的意义
  后果:
    - 他获得听懂与使用比蒙语言的能力，岛上交流不再靠手势
    - 两人之间立下以智慧启蒙为凭的师徒名分
  对当前格局的影响:
    - 玩家从此听懂比蒙语，信息获取与议价能力一次拉高
    - 狐女的身份指向比蒙圣坛祭祀体系，主角被这条线拖住

第七章·定名李察:
  时间: 荒岛篇第七章
  事件:
    - 小狐狸自报姓名海伦.列娜，并按战神坎帕斯的指引给刘震撼取名李察
    - 她讲智慧启蒙与比蒙战歌的规矩，讲爱琴大陆上兽人、人类、矮人与精灵的分布
    - 她讲千年前海加尔战役比蒙惨败、退守多瑙荒原的历史
    - 她认出果果是霜雪皮丘兽，最低阶的魔兽
  后果:
    - 主角定名李察，从此与战神预言绑在一起
    - 海伦判定他唱得出正宗比蒙战歌，是天生灵魂歌者
  对当前格局的影响:
    - 玩家拿到「李察」这个日后要顶着走遍诸国的名字
    - 千年对峙的格局第一次摊开，回家有了明确方向

第八章·美女之族:
  时间: 荒岛篇第八章
  事件:
    - 海伦讲人类魔法师的缺点与禁咒要消耗寿命的威力，又讲狐族萨满用星云连锁闪电掩护族人撤退的往事
    - 她说明福克斯族因军功被封世袭贵族，自己有男爵采邑
    - 她讲出狐香是狐族少女掩不掉的特征，也是她们被贩卖的缘由
  后果:
    - 主角第一次知道比蒙战歌与人类魔法师的路数差在哪里
    - 海伦的贵族头衔与采邑成为两人日后落脚的去处
  对当前格局的影响:
    - 福克斯族的世袭地位为进入比蒙社会留出一个身份入口
    - 玩家明白海伦身上的狐香意味着什么风险

第九章·望乡:
  时间: 荒岛篇末章，伐竹扎筏之前
  事件:
    - 海伦说出比蒙没有大型战舰、西雅海族封锁海路，回家无望
    - 刘震撼提议召鱼鹰当魔宠，并要她教自己燃烧生命的魔法
    - 海伦透露自己才十五岁，祭祀十八岁前不能成家
    - 她要他答应隐瞒人类身份，免得被当成异端烧死
  后果:
    - 回家的路被海族封死，两人只能先造筏朝外漂
    - 十五岁的年纪与十八岁前不成家的规矩，把两人的关系压在明文限制下
  对当前格局的影响:
    - 玩家背上隐姓埋名的硬约束，身份一旦暴露就是神庙的火刑
    - 荒岛篇收束，下一段舞台是退潮石梁对面的竹林岛
