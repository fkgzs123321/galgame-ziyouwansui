<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
三大上位精灵并立:
  时间: 一万年前
  事件:
    - 爱琴大陆的精灵以花精灵、金精灵与月精灵三支为上位精灵，花精灵擅舞、金精灵擅乐、月精灵擅唱
    - 精灵在当时的族群规模仅次于比蒙，仅花精灵一支就分出十几个大部落
    - 三大纯血精灵素来不和，精灵大帝国的分崩离析正是这个缘故
    - 精灵依靠永恒月井中的小精灵汲取森林与自然的精华，再由生命古树把精华传输给所有精灵植物
    - 普通精灵拥有风之古树，德鲁伊拥有智慧古树，最高贵的月精灵拥有香帕古树，嗜血的堕落精灵拥有战争古树
  后果:
    - 三大上位精灵各自成势，精灵一族再没有共主
    - 精灵植物必须由永恒月井与生命古树提供大量营养，还要靠高阶精灵祭司提供神力才能生长
  对当前格局的影响:
    - 花精灵的莲拔丝、金精灵的兰勒尔与月精灵的诺多林分别是粮食、肉蕈与千味盐果香料，缺粮的势力都盯着这三样精灵植物
    - 精灵古树随分支而异，收编哪一支精灵就一并收编了那一种古树

月精灵陆沉与娜迦:
  时间: 神魔大战期间
  事件:
    - 娜迦的前身是高位精灵中的月精灵，得名于月色一样的头发
    - 三大恐惧魔王在神魔之战中同施陆沉术，把整个月之精灵王国沉进海底深渊
    - 沉入深渊的月之精灵以亵渎精灵之神爱露尼的仪式获得海底生存能力，身体进化成半人半蛇
    - 娜迦与美杜莎的区别在于娜迦能长出四条手臂，高阶娜迦可长六臂或八臂
    - 娜迦聚居在多瑙西海那片涡流密布、海兽与毒珊瑚环伺的浑浊海域，部众约两万，倾力动员也只有八千人
  后果:
    - 月精灵失去故土，爱琴大陆上血统的月精灵少之又少
    - 娜迦成为月精灵这种上位精灵的直系后裔，被归入正宗的堕落精灵
  对当前格局的影响:
    - 娜迦随军携带海洋生命古树与永恒月藻，需配合森林树木种植古灯海莲
    - 爱琴大陆残余的月精灵以落日沼泽青蒿森林的部落为正统，穆里尼奥以月精灵驸马的身份卷入其中

堕落精灵被逐入地底:
  时间: 神魔大战后不久
  事件:
    - 精灵一族向地底放逐了血精灵和黑暗精灵，与龙族放逐地狱黑龙、矮人一族放逐灰矮人同期
    - 追求邪恶黑暗法术的精灵由精灵一族堕落而来，退入黑暗的山洞，箭术非凡而阴险狡诈
    - 暗精灵霸占墨晶山谷的生命之泉泉眼，用自身的生命精华为代价孕育崭新的生命
    - 整个暗精灵王国只有五六百人口，巢穴构筑在不见阳光的黑暗山洞之中
  后果:
    - 精灵一族就此分出堕落的一支，地表与地底的精灵再无往来
    - 墨晶峡谷成为暗精灵地盘与生命之泉泉眼的所在地
  对当前格局的影响:
    - 暗精灵的繁衍依附墨晶山谷的生命之泉泉眼，全族人口压在五六百人
    - 这处泉眼诞生于上万年的森林之中，一滴泉水即可让人不经交媾孕育崭新的生命，各方势力都盯着它

精灵与德鲁伊决裂:
  时间: 约七千多年前
  事件:
    - 德鲁伊与精灵同出一源，彼此之间有说不清道不明的血缘关系
    - 神魔大战发生在一万年前，精灵与德鲁伊的大决裂在约七千多年前
    - 决裂之后两族老死不相往来，互相都不再承认彼此之间有血缘关系
    - 德鲁伊信奉的神祇从月神爱露尼改成森林女神梅莉凯
  后果:
    - 德鲁伊与精灵各自守着森林，两族之间不再有往来
    - 德鲁伊的信仰与精灵分家，森林里从此有两套互不相认的神系
  对当前格局的影响:
    - 精灵与德鲁伊至今互不承认血缘，任何一方被拉进同一阵营都要先绕过这道旧账
    - 德鲁伊教义与精灵月神信仰分成两条线，收编德鲁伊不等于收编精灵

大精灵帝国崩解:
  时间: 大决裂之后
  事件:
    - 精灵一族曾经建起大精灵帝国，随着三大上位精灵的内争而分崩离析
    - 大精灵帝国时代结束之后，精灵古树早已经失传的七七八八
    - 栽培精灵古树的时间不够几千年就起不了大作用，古树虽能移动但速度堪比乌龟
  后果:
    - 精灵一族的森林经营从成体系的营造退回到零散部落的栽种
    - 树龄接近两万年的战争古树只有握着生命之泉的势力才养得出来
  对当前格局的影响:
    - 精灵古树成了稀缺品，地底那座城把战争古树由十六棵增至二十棵即视为战力跃升
    - 精灵植物城市靠生命之树与永恒月井维持运转，掐断养料就掐住了精灵的城

三片林地分立:
  时间: 数千年来
  事件:
    - 南十字星森林中还存有一个约五千人口的精灵王国，分成三个部落星散在森林之中
    - 德鲁伊的地盘落在落日大沼泽，数十个沼泽德鲁伊部落在此聚居，人口约五万
    - 德鲁伊王国藏在落日大沼泽深处，与斯迈族天鹅互为假想敌，变身魔法在那里几近失传
    - 存世的花精灵数量比月精灵还少，领地隐秘，对同族也隐隐不屑
  后果:
    - 落日沼泽德鲁伊的人口数字已达到威胁比蒙王国安全的地步
    - 沃尔夫狼族、彼尔军团与斯迈族天鹅驻守南十字星森林与落日大沼泽，防范森林中的巨人部落、精灵一族和德鲁伊王国
  对当前格局的影响:
    - 南十字星森林的精灵王国是比蒙东北方向的邻居，也处在堕落精灵下一个吞并目标的名单上
    - 花精灵的领地藏在南十字星森林深处，同族也进不去

密林半精灵诞生:
  时间: 近三千多年来
  事件:
    - 黑暗精灵主母做主，让族中女子与地底那个半人半兽的塞纳留斯交媾
    - 生下的雄性叫密林守护者，雌性叫密林树妖，合称密林半精灵
    - 黑暗精灵八位主母分主八座主城而无女王，全族仅五万人口，只能拿密林半精灵补人口与战士的缺口
  后果:
    - 地底多出两族密林半精灵，黑暗精灵的兵力缺口得到填补
    - 塞纳留斯被拖进黑暗精灵的血脉之中，成为地底森林的母体
  对当前格局的影响:
    - 密林半精灵随卓尔主母的行动游走于地底与南十字星森林之间
    - 黑暗精灵与地表精灵之间多了一层血脉上的旧账

德鲁伊的当代分化:
  时间: 近千年来
  事件:
    - 德鲁伊（艾茜米兰部落）以塔库塔与科斯塔大德鲁伊为尊，教义改为所有生命体都有延续后代的权利
    - 德鲁伊王子卡卡的部族因精灵与德鲁伊决裂迁居落日沼泽，此后又南迁至十万大山
    - 卡卡闯时空大裂缝到魔界五十年，因劫富济贫遭魔界派兵围剿
    - 雷克萨的后裔杜宾王国人口三千多万，分裂成十几个国家，拥有四百多名彩虹系杜宾法师与两百多名德鲁伊
  后果:
    - 德鲁伊不再只守一处森林，一部分随杜宾人散到十万大山与佛罗仑多盐碱地森林
    - 变身魔法在不少部落里已经近乎失传，能变身巨龙的说法只留在传说中
  对当前格局的影响:
    - 德鲁伊并非一整块，与谁结盟取决于哪一个部落
    - 魔界决战关头杜宾王国拿出全部家底来援，两百多名德鲁伊随军进入爱琴

<%_ if (chap >= 73) { _%>
森林危局:
  时间: 主角成为翡冷翠领主之后
  事件:
    - 花精灵全族两百四十四人，被迫以夏宫神姬的名义加入翡冷翠
    - 战争古树树龄接近两万年，卢塞恩城的战争古树已由十六棵增至二十棵
    - 堕落精灵集结后最多十天就将开拔去征服南十字星森林的精灵与巨人
    - 希芙精灵图谋重新整合精灵一族
  后果:
    - 南十字星森林的精灵王国与巨人部落同时处在堕落精灵的兵锋之下
    - 花精灵从隐世的森林住进了比蒙领主的法师团
  对当前格局的影响:
    - 精灵一族只剩零散部落与残支，花精灵、月精灵与娜迦各据一方
    - 收编精灵的途径落在永恒月井、生命古树与莲菝丝这三样东西上
