<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
穿越前:
  身份: 现代军人，侦察兵出身，在南疆的战场上中弹
  本事: 掌握侦察兵一招制敌的格斗术，懂战场常识与野外生存，能读地图、设伏、审讯俘虏
  缺项: 不是空降部队，也不是飞行员，空军作战技巧一概不会；不懂魔法，不会任何爱琴的语言与文字
  性子: 骨子里就有小坏，不是道明臣那种忠臣坯子，没那么多原则，被逼急了什么招都肯使

穿越落点:
  时间: 爱琴历的五月，比蒙王国的荒岛海岸
  身体: 自己的人类身体，浑身一丝不挂，只有一只脚上还套着灰色的涤纶袜子；黑色头发的人类相貌，因鼻子被魔狼风刃打烂变形，被海伦误认为匹格族猪头人
  原身评价: 族里人都说这具身体的原主懦弱贪懒，是个笑话
  开局遭遇: 刚醒过来就撞上魔狼袭击，鼻梁被风刃削成两个朝天的窟窿，从此鼻子成了他身上最出名的一处残疾
  落差: 一身现代军事技能落在一具被人看不起的猪头人身体里，力气与敏捷都远不如自己原来的身体

<%_ if (chap >= 9) { _%>
诅咒来源:
  天赋: 凭这具肉身原主的天赋，他成了天生灵魂歌者，是不需要导师启蒙就能听见战神之歌的极少数
  诅咒: 爱琴历一百四十年，魔宠战死后他因血之祭奠遭战神坎帕斯降咒，正牌比蒙战歌全部失去神奇效果，唱出来只剩调子
  转折: 转而用汉语另辟蹊径自创战歌，效果与正宗比蒙战歌等同，却成了神庙眼里的异端
  风险: 一旦被人听出他唱的是汉语，随时可能被送上火刑架

姓名由来:
  本名: 刘震撼。他在原世界叫这个名字，穿越后自己也没打算改
  李察: 海伦成为圣坛祭祀那天，战神坎帕斯借巫医的预言术指引出她未来丈夫的名字应为李察，她执意用这个名字称呼他
  重名: 比蒙王室另有一位同为龙祭祀的王子也叫李察.萨尔，两人重名这件事后来常被人拿来调侃
  封号: 他自己更习惯用「爵士大人」，在红土高坡收服熊地精强盗时就是这么报的名

<%_ } _%>
<%_ if (chap >= 73) { _%>
名号沿革:
  匹格: 蠢蛋之族匹格族的猪头人，这是他最常被人拿去羞辱的一层身份
  天生灵魂歌者: 与生俱来、不经启蒙就能听见战神之歌的祭祀苗子
  被诅咒的祭祀: 因魔宠之死而战歌失效的那一个，这个身份跟了他很久
  另辟蹊径者: 独创汉语比蒙战歌的人，也是神庙判定异端时最重的那条罪状
  大力士: 祭祀中最强壮的一个，偏偏是辅助兵种里最不该长成这样的一位
  天王祭祀: 纵横篇里比蒙平民传唱的名号，多半是长老院与河马族吟游诗人替他造出来的声势

<%_ } _%>
性格底色:
  求生第一: 先活下来，再谈原则。饿极了能啃生蟹，被逼到墙角就翻脸
  嘴硬心软: 嘴上从不认怂，见了自己人就护到底，谁动他的人他就跟谁没完
  记仇: 谁害过他、害过他的人，他都一笔一笔记着，翻脸时不讲情面
  护短: 对外是恶棍，对自己收下的人毫无底线地偏袒，连奴隶都护
  不装: 不摆英雄架子，贪财好色都摆在明面上，反倒让比蒙贵族拿他没办法
