@@private
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
花精灵凋零与花后:
  时间: 一万年前，神魔大战及其后
  事件:
    - 神魔大战那一代出了战神四友，艾莉婕是其中唯一的花精灵，另三位分别是金精灵莱戈拉斯、人类游侠阿拉贡与矮人金
    - 那时的精灵族规模只排在比蒙之后，花精灵自己就分出十几个大部落
    - 精灵大帝国随后散架，三大纯血精灵各守一门技艺，彼此素来不和
    - 一万年过去，花精灵只剩两百多人一支，数量比月精灵更少
    - 花后不是练出来的，只有八月十五月圆之夜出生、又在神庙受洗时被神佑光环照到的花精灵女婴才可能得此异能，约一千年才出一个
  后果:
    - 花精灵全族退守南十字星森林的沉寂之海，与同样濒危的淡水美人鱼一族彼此依靠
    - 花后异能成了全族翻身的唯一指望，千年来只出了一个艾莉婕
  对当前格局的影响:
    - 沉寂之海的十星连珠寒潭边封印着艾莉婕，花精灵因此拒绝搬迁
    - 花精灵的元素屏蔽结界能藏住超阶生物的存在，夏宫卫队靠它掐断魔族的远程通讯

云秦倾覆与唐藏继起:
  时间: 云秦帝国覆灭之后
  事件:
    - 云秦从丝绸大陆上消失，最强盛的位置由唐藏帝国接了过去
    - 唐藏的四个亲王里已有两个死在皇帝手上，剩下的都成了插手江湖的实权人物
    - 唐藏皇室把武力与供奉分作两条线，执金吾管武班，鼎湖仙师管供奉
    - 唐藏一并收下前朝翰留帝国的旧学，方士一脉的技艺就此转入唐藏官府
  后果:
    - 东方大陆的权柄从帝制改朝变成皇室与江湖门派并立
    - 云秦留下的阵法、金人与宝塔成了唐藏官民都在打主意的前朝遗产
  对当前格局的影响:
    - 唐藏五殿下既是禁卫统帅又是第一神力王，好大喜功又精于商道，随身带笔记录战例并借机大发战争财
    - 唐藏手里的筹码是金丹、五行防御大阵，还有朔士与万里飞云，图的是一份军工合作

朔士重拾方士旧学:
  时间: 唐藏立国之初
  事件:
    - 唐藏立国后接收前朝翰留帝国的东方朔士，这批人靠挖古墓、整理古云秦方士遗物重建了职业
    - 朔士仍按方士旧法烧汞炼铅，丹药成了主业，法宝反倒只算兼职
    - 皇室在朔士之外另养一批供奉，鼎湖仙师分管琴棋书画酒五系，十大执金吾仙长则是武班
    - 皇室把最要紧的守城阵法收归自己手里，五行防御大阵的做法从此不出宫门
  后果:
    - 唐藏有了自己的丹药与法阵班底，不必再求云秦后裔
    - 唐藏复现不出云秦金人那样的陆战终极武器，只能守着残余的法阵部件
  对当前格局的影响:
    - 朔士的丹药与皇室的五行防御大阵成了唐藏对外交换军工技术的筹码
    - 唐藏把五行防御大阵的五个部件分置一城五个方向，遭元素攻击时自动联成蛋形屏障

怡花宫转为花廷:
  时间: 唐藏立国之后
  事件:
    - 花廷原先是唐藏名山里的门派怡花宫，改换门庭之后成了宗教机构，香火供的是四大花仙
    - 花廷的班底是花爵中人，后台是玉系的神恩眷顾者玉皇，能打不能打全看手头攒了多少玉石
    - 总坛落在云雾山，山门交给两只博浪沙火鹤把守，门前立着石兽驼住的七杀碑，碑上刻七条禁令
    - 花廷靠几件镇廷之宝聚财，其中财神玉盂摩擦弦耳后能让水自行翻滚并按参照物重排分子，七八个钟头就把一盆水换成同体积的金属
    - 云雾山好景致却不设防，箭塔碉楼一类军事建筑一概没有，五行防御大阵同样缺位
  后果:
    - 花廷的财力压过唐藏官面上的大户，官府碍着旧日渊源，轻易不碰它的江湖恩怨
    - 花廷在魔界拿下飞亚达城当据点，还沿路杀空了银瞳贵族在海岸贡献大陆上的四十四座城市
  对当前格局的影响:
    - 魔界的玉石本就出得少，整个海岸贡献大陆只有三座城市能供得上
    - 花廷传信只认火符，明黄色的纸鹤一扇翅膀便悬在空中

花衔立制分等:
  时间: 花廷成为宗教机构之后
  事件:
    - 花廷拿名卉当凭信，一个人对应一朵花，谱系自上而下是花王、接着花中皇后、再往下花中宰相，最末是花爵中人
    - 花王坐镇千红一窟，花中皇后调得动天下群芳，花中宰相能用百花
    - 再往下的花衔中人只使得动本系那几种花，多半还是单体攻击，名下那朵花就是权限的边界
    - 花衔之间谁也管不了谁，传承一路在爱琴叫惜花族，一路在沙漠叫爱花族
  后果:
    - 三花的名分互相绑定，动一个就等于动另外两个，花爵中人无法在花王与花后之间另择靠山
    - 名卉的授予权收在花廷手里，想升等只能先在花廷挂上字号
  对当前格局的影响:
    - 花精灵不吃这一套，自己另立一门叫魔力指挥家的职称，发髻上簪几片花瓣就代表几级
    - 花王可册封五朵金花，册封权成为调动各方花爵的手段

<%_ if (chap >= 43) { _%>
唐藏亲王东来:
  时间: 主角穿越后不久
  事件:
    - 唐藏亲王被暗精灵困在墨晶峡谷，熊人中队长维埃里拿着军部授权书点名要刘震撼带队去救
    - 一行人刚进洞就挨了一轮箭雨，牛头人夜里看不清，折损极重
    - 奄奄一息的匹格族水系魔法师学徒生下兽亲小猪崽便断了气，亲王把自己的女儿交到同为匹格的刘震撼手上
    - 亲王把白色玉佩与一只精金钵盂留下当信物，许诺回国后替比蒙与唐藏牵线通商
  后果:
    - 唐藏与比蒙之间开出通商的口子，白色玉佩成了两家往来的信物
    - 兽亲喀秋莎成为刘震撼收养的女儿
  对当前格局的影响:
    - 唐藏亲王既是唐藏国王的亲弟弟又是苦行僧侣，刘震撼在荷露城动武须顾及亲戚情面
    - 白色玉佩后被凝玉拿来换钱，赎回它成了刘震撼与唐藏打交道的一桩旧账

<%_ } _%>
<%_ if (chap >= 73) { _%>
花王归位与花将诞生:
  时间: 主角成为翡冷翠领主之后
  事件:
    - 刘震撼靠着韦舵巨人的身子闯过醍醐灌顶，成了史上头一个生日与百花生日撞在同一天的韦舵巨人
    - 二月二十二日这一天的百花生日从此记在他名下，天下群芳认他做王
    - 刘震撼把艾莉婕推出来认下花后名分，并接受缘分认小空为九郎
    - 小空是控金又品玉的双系神恩眷顾者，既是金蕊帝女花，又凭控金术挥动十万八千磅精金棍
  后果:
    - 三花共生的名分在爱琴这边落了地，小空自号花将
    - 艾莉婕凭花后身份取得调用天下群芳的依据
  对当前格局的影响:
    - 花卉的生杀予夺都在花王手里，花中宰相见他必须行最高礼节
    - 小空的帝女花身份让他同时握有唐藏方面的血脉与爱琴方面的花衔

<%_ } _%>
<%_ if (chap >= 245) { _%>
花相确认花王:
  时间: 主角进入魔界期间
  事件:
    - 丽塔.海华丝是从魔界来的花中宰相，自报神恩眷顾者，手上兼着光影霓虹与控花两门异能
    - 她鬓边那朵香水风信子是花衔的凭信，被刘震撼当场摘走
    - 她带着二十来个孔雀圣女，里头十几个手上都拈着花，一看便知是花衔中人
    - 她手上三门花系奥术分别是名花有主、耍花枪与落花流水，一杆花枪就把刘震撼拦在半路
  后果:
    - 她认下刘震撼的花王名分，花衔这一套从此在魔界也站住了脚
    - 原来的两路传承之外，多出魔界这一支
  对当前格局的影响:
    - 花衔成为横跨爱琴、丝绸大陆与魔界的一套传承谱系
    - 海华丝另有文莱神庙魔梦神使的身份，花王的名分因此带上魔界的势力底色

风尘四花之争:
  时间: 主角抵达唐藏荷露城之后
  事件:
    - 风尘四花的授业恩师是花廷四大花仙，四位姑娘的婚事由师门按父母之命、媒妁之言做主
    - 想上擂台争风尘四花，头一条得应下替玉皇与花廷卖命，不应就没门
    - 打赢也不算了结，还得回花廷摆开筵席把名分定死，之后才能取处子红丸
    - 紫色霞云是花廷的花娼，也是合欢主人，天然魅惑长在身上，金系修炼者越强越吃这一套
    - 刘震撼以素帝之名册封五朵金花，随后把五颗绝世珍珠与云秦金人斋殆扳指一起推上赌桌，赌的是玉钟乳与财神玉盂
  后果:
    - 玉皇丢下风尘四花赶回木兰城取财神玉盂，火符飞入花廷五大高层手中
    - 花廷只能自己应付这场赌局，唐藏官府不插手
  对当前格局的影响:
    - 刘震撼从耍流氓改为豪赌，把云秦金人斋殆扳指押上了赌桌
    - 玉皇取盂拉走了云雾山的玉石与人手，花廷的战斗力随之走低

花廷总坛倾覆:
  时间: 风尘四花之争后不久
  事件:
    - 壹条按老板的密令走「加菲不在家」，借金钢魔法传送阵将夏宫人马连同外援一锅端到山门
    - 幕僚长罗比拿帝维放起滹夜古城那一仗，算作开打前的动员
    - 壹条不惧火，两只博浪沙火鹤在他手上撑不过一招
    - 四头守山神兽尽数死在湮甲箭下，只有两只火鹤冲出重围，留守的人拼命放火符叫援
    - 白素青见不得这番血洗，当面说壹条心肠太冷，两人为强盗逻辑与立场吵得不可开交
  后果:
    - 花廷总坛被攻破，战利品随上百口花梨木箱搬进领主大厅
    - 壹条当年被怡花宫带头围堵、全凭父亲出手才脱身的旧怨，到这一天算是清了
  对当前格局的影响:
    - 花精灵全族两百四十四人顶着夏宫神姬的名头进了翡冷翠，编进法师团
    - 搬回来的战利品里有九宫玉露丸与三转金丹，后者一颗就能补回五成法力
