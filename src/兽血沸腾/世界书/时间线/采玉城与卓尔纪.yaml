@@private
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
卓尔女王出走:
  时间: 被放逐到地底之初
  事件:
    - 早在一万多年前被放逐到地底的时候，卓尔的女王就逃跑了
    - 女王之位从此空悬，谁也不能凭血统坐上那个位置
    - 萝丝神赐予暗精灵女王的七度金蛛足皇冠流落在地底，只有拿着这顶皇冠的人才能重新称女王
  后果:
    - 卓尔由一位女王统治变成由平级的主母分治
    - 每年从主母中选出一位大主母过问事务
  对当前格局的影响:
    - 七度金蛛足皇冠是卓尔唯一能重新立王的凭证，皇冠落到谁手里谁就能整合八城
    - 摩尔血精灵有国王，卓尔只有主母，两支堕落精灵的政体从根上不同

八座主城:
  时间: 地底定局之后
  事件:
    - 八位主母分主八座主城，卓尔人口仅五万
    - 八座主城的军团曾长期围困堤丰山谷
    - 主母分成激进与保守两派，激进一方主张立即回地表算账
    - 魔索布拉米城的主母是八位主母中最暴戾的一位
  后果:
    - 卓尔没有共主，出兵与迁徙都要八城谈成一致
    - 几万人口摊在八座城上，兵员调度慢于摩尔
  对当前格局的影响:
    - 主母之间的分歧成为外人谈判与拉拢的切入口
    - 八大主城的守望者海选把一万三千余名密林半精灵集中到一处筛选

蛛后与蝎神的信仰:
  时间: 地底定居之后
  事件:
    - 卓尔的内部信仰混乱，一部分信奉蛛后萝丝，一部分是信奉蝎神巢农的蝎化卓尔，还有一些奇怪的小宗教
    - 卓尔堕落仪式本是与蛛后神仆交合完成
    - 萝丝神庙的台阶共十三级，从门口走到正殿是二百五十步，正殿中供着人首蜘身的青铜萝丝女神像
    - 巢农神庙位于魔索布拉达城北一侧，卓尔武技长们在此同时举行日光洗礼仪式
  后果:
    - 神权分散在两座神庙与若干小教派之间
    - 蛛后祭司以咒声检验实力，神庙的话语权跟着仪式走
  对当前格局的影响:
    - 主母以虿盆威胁要把改信萨满教义的族人投进去
    - 卓尔武技长主持日光洗礼，蛛后神仆则是仪式的降神对象

堕落仪式:
  时间: 近千年来
  事件:
    - 日光洗礼仪式即卓尔精灵的最高堕落仪式，能让黑暗精灵转变成为可在日光下行走的暗夜精灵
    - 仪式要一位极其强壮的男子与所有暗精灵主母交媾降神
    - 淫媒若中途死掉，巢农与萝丝这两位都请不出来
    - 蛛后萝丝的侍女蜡溶妖以自身燃烧充当仪式的计时器
    - 从仪式中幸存下来的淫媒可拥有光荣的守望者称号与堕落之神的诅咒
  后果:
    - 卓尔要挑的是能撑过仪式的强壮男子，而不是寻常战士
    - 守望者备选只能靠本能与赤裸的身体应付主母及武技长
  对当前格局的影响:
    - 日光豁免权是卓尔在地表有所作为的前提，仪式办不成卓尔就回不了地表
    - 降神是卓尔唯一能请动蛛后的场合，也是主母地位的来源

黑暗吮吸术与缚灵尸:
  时间: 地底定居之后
  事件:
    - 黑暗吮吸术是卓尔精灵独有的秘术，主母们用来在堕落仪式中汲取守望者的精华
    - 与暗精灵主母交媾的淫媒必死无疑，只有身具名器寸金者才有指望全身而退
    - 只有主母级别才有制作缚灵尸的能力，缚灵尸以施法者的意志永久禁锢并控制另一个生物的灵魂
    - 卓尔的黑暗魔法可以从异界位面召唤不死生物，那种不死生物有召唤时限
  后果:
    - 卓尔的主要岗位全是女性精灵，族群中的男性永远处于少数
    - 卓尔的秘术偏向控制而非杀伤，正面决战要靠外族兵种顶上
  对当前格局的影响:
    - 黑暗吮吸术的霸道把卓尔的男人压成少数，人口只能靠外来者与密林半精灵补
    - 缚灵尸是卓尔压箱底的手段，摩尔精灵没有这门法术

地底三类货物的源头:
  时间: 地底定居之后
  事件:
    - 卓尔麾下有河仙人两百万，靠掠夺穴居人维生
    - 石腭穴居人是暗精灵与血精灵眼中最廉价的炮灰与生产力
    - 地底军械与巨人手臂做的饰物都经这支矮人的手卖出去
    - 人类商人惦记的两样东西是冰封之海的水晶与幽暗地底的冥界黑水晶
    - 七度金是地底岩洞中钟乳石的金属结晶，是人类魔法师制作空间魔法制品的极品材料
  后果:
    - 地底成了人口、军械与珍品三类货物的源头
    - 石腭穴居人既是劳力也是可以交割的货物
  对当前格局的影响:
    - 这座地底城全民皆兵的基础压在地底世界的石腭穴居人身上
    - 一旦失去地底世界的兵源，它最多只能保持十万常备军力

人类一侧的贩奴网:
  时间: 四百年前起
  事件:
    - 慕兰商人四百年间持续进比蒙境内掳掠美女，转手卖进加里曼丹的奴隶市场
    - 加里曼丹是慕兰的奴隶贸易中心，城中的哈里发与显贵喜欢豢养比蒙美女，尤其福克斯
    - 自加里曼丹再往西，要穿过沙漠走三千多里才到比蒙王国
    - 多洛特公国夏尔巴家族子弟是专家级奴隶贩子
  后果:
    - 狐族美女在人类世界的黑市被炒到惊人价格
    - 比蒙边境成了货源，加里曼丹成了销地
  对当前格局的影响:
    - 佣兵团伙每年沿蛮荒古道潜入比蒙境内绑走狐族少女，这条边贸至今没断
    - 人类贩奴团持有合法手续时，奴隶主有权决定奴隶的生死，买卖受到保护

比蒙一侧的贩奴勾结:
  时间: 近三十年来
  事件:
    - 东北行省总督罗森博格与慕兰人贩子勾连，三十年里把福克斯少女一船船卖到加里曼丹
    - 隆美尔的母亲十三岁被比蒙权贵卖到加里曼丹城，二十岁死于凌辱
    - 隆美尔点名罗森博格是贩奴的同谋
  后果:
    - 罗森博格被制成瓮人
    - 隆美尔与比蒙之间的这笔旧账，是他日后与比蒙往来的底色
  对当前格局的影响:
    - 贩奴这条线上人类、慕兰与比蒙三方都有份，禁绝的阻力来自比蒙内部
    - 隆美尔身世中的这一笔，是旁人拿捏他的切口

<%_ if (chap >= 73) { _%>
采玉城的迁址与兴建:
  时间: 主角成为翡冷翠领主之后
  事件:
    - 穆里尼奥不惜工本，把原先在大荒原上的采玉城迁址到唐古拉峰下山雪道南侧
    - 从加里曼丹掳掠而来的两万慕兰奴隶铺就出这座要塞
    - 新址背靠雪山，倚仗左右两侧浓密的针叶松林
    - 采玉城与雪梨城相隔三四里地，互成犄角
    - 采玉城仅有三千人口却出产十七位祭祀
  后果:
    - 采玉城成为比蒙祭祀密度最高的城邦，也是魔族绕开桑干河的一条小道上的门户
    - 采玉城的建造劳力是加里曼丹掳来的慕兰奴隶，不是比蒙本族
  对当前格局的影响:
    - 采玉城与桑干河、忘忧谷并列为终盘三大战线之一
    - 玉廷与三十头魔龙在采玉城全军覆没

卓尔迁回地表:
  时间: 主角成为翡冷翠领主之后
  事件:
    - 卓尔与摩尔两族已完成堕落仪式与日光洗礼
    - 主母幽月儿率部交割十枚血羽之心与仅剩四百二十七只双头奇美拉后迁徙地表针叶松林
    - 两族回到地表后计划组织精灵联合王国
    - 卢塞恩实行摩尔与卓尔轮值城主制，每隔一个月轮换一次
  后果:
    - 卓尔从一个地底族群变成地表针叶松林中的一方势力
    - 采玉城的针叶松林带成了卓尔与比蒙直接相邻的地方
  对当前格局的影响:
    - 卢塞恩向翡冷翠下最后通牒索还地底世界控制权
    - 卓尔与摩尔全部搬迁到地表至少需要半年时间

缺粮与掠夺:
  时间: 当前
  事件:
    - 南十字星森林被刘震撼打下、地底世界被掐断后，卢塞恩全族缺粮
    - 卢塞恩出征南十字星森林掠夺精灵奴隶，并索取全部地穴居人奴隶
    - 卢塞恩向翡冷翠开出的成交条件是十磅生命之泉、一万精灵奴隶与全部地穴居人奴隶
    - 血精灵与暗夜精灵已摈弃祖传箭术改修速成魔法
  后果:
    - 奴隶成了卢塞恩换粮的硬通货
    - 堕落精灵的战争从占地盘变成抢人口与粮道
  对当前格局的影响:
    - 生命之泉被卢塞恩榨干后，比蒙只能下达荆棘草环征召令，五大行省收缩防御
    - 卢塞恩的出兵日程以天计算，南十字星森林的精灵与巨人来不及构筑防线
