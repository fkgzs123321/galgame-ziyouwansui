@@private
<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
三族放逐:
  时间: 一万年前
  事件:
    - 精灵一族向地底放逐了血精灵和黑暗精灵，龙族向地底放逐了地狱黑龙，矮人一族向地底放逐了灰矮人
    - 灰矮人这一支的先人本是自愿跟着摩尔血精灵下地底的
    - 地底世界与地表世界同处于一个位面，是地表各大智慧种族放逐最邪恶同类的邪恶之地
    - 那时地表各族还没有今天的国界，放逐令由族群而非王国发出
  后果:
    - 地底聚起三支被放逐的种族，与地表分成两套互不往来的秩序
    - 兽人这个后缀到一千年前才兴起，那时比蒙王国已只剩兽族比蒙
  对当前格局的影响:
    - 地狱黑龙数量不下于十头，全都是黑暗精灵的靠山
    - 被放逐到地底的种族对本族都抱巨大仇恨，这种仇恨要靠生命和鲜血才能做了断

罡风天堑与门户:
  时间: 放逐之后
  事件:
    - 通往地底的入口设有一万年前的上古魔法阵，借助自然与魔法的力量不停循环制造地底罡风
    - 罡风并非长年恒定，每年只在十月底有两天冷却
    - 罡风天堑是囚禁被送到地底的囚徒的牢门，每一天的每一个时间段罡风威力都有起伏
    - 想从地底入口进出还要逼退守卫地底门户的三头地狱犬克耳柏洛斯，它的三个狗头可以同时运用不同的魔法进行攻击
  后果:
    - 地底成了进得去出不来的牢笼，地底种族只能世代困在下面
    - 地表一方也无法随意下探，进出被压缩到每年两天的窗口
  对当前格局的影响:
    - 风洞传送阵在滚石与灼炎两谷建成，地底的老弱可以成批转运
    - 地表势力要大规模进出地底，只能等十月底那两天

三层大陆定形:
  时间: 放逐后的漫长岁月
  事件:
    - 地底世界已知只有三层，第一层怒焰大陆、第二层黑域大陆、第三层婆娑大陆
    - 第一层怒焰大陆有七八万平方公里，第二层黑域大陆在两千多米之下，第三层约三四万平方公里
    - 地底太阳是悬浮在空中的黑色磁石山，山体与地心磁场磁极相斥而悬空
    - 地底太阳上面聚居着散发金光的金乌，为地底植物与穴居人提供必需的光照
    - 地底各地的井梯下面另有小天地
  后果:
    - 三层大陆各成一套生态，怒焰大陆上穴居人、黑犀部落牛头人与堤丰巨人共存
    - 黑域大陆这一层被摩尔血精灵与暗精灵两支堕落精灵占住
  对当前格局的影响:
    - 没有地底太阳的光线俯耀，地底的庄稼、隐花苔藓和蛇莓灌木都无法生长
    - 地底任何有人居住的地方都选在有地底太阳照耀的地方

堤丰巨人的火焰锻造:
  时间: 地底定居之后
  事件:
    - 堤丰巨人是天生焰肤的地底巨人，浑身火焰蒸腾、裂缝冒火苗，能凝结火焰陨石，外号地狱火
    - 堤丰巨人和矮人一样非常擅长锻造，用黏土模具浇灌法冶铁
    - 堤丰巨人需供应大量穴居人的农具，锻造出的半成品多是锄头犁铧
    - 堤丰巨人与黑犀部落有盟约，帮助牛头人保护怒焰大陆的穴居人
  后果:
    - 地底的农具与兵器出自同一批炉子，锻造世代积累成体系
    - 堤丰巨人成了地底军械的底层供给者
  对当前格局的影响:
    - 堤丰巨人最怕水，地底的雨对他们是严重伤害
    - 地底从不下雨，堤丰巨人在这里唯一犯怵的对手是寇涛人鱼

熔岩山谷的冶炼体系:
  时间: 地底定居之后
  事件:
    - 熔岩山谷由一座死火山改成，谷里的地底青焰直接拿来做冶炼燃料
    - 地底世界的青色地焰温度极高，不用耗费任何木材或者煤炭做燃料，足以溶炼绝大多数金属
    - 只有特种金属需要油瓜汁和酒精提纯温度才能锻造
    - 地底炼铁不需采矿开炉，用坩埚去熔岩河流中舀流淌的铁水即可，是上好的混合金属钢
    - 堤丰巨人与盾斧矮人在熔岩山谷劳作
  后果:
    - 地底冶炼不依赖木炭与矿脉，产能不随森林与矿藏起落
    - 落进地底的矮人支系与巨人支系在同一座山谷合流
  对当前格局的影响:
    - 地底盛产金属与稀有矿藏，黄金矮人的冶炼技艺与这些炉子对接
    - 精金羽箭、摩云磁暴灯与火铳的生产地设在井梯深处的地底兵工厂

灰矮人的工匠阶层:
  时间: 地底定居之后
  事件:
    - 灰矮人这一支属于摩尔血精灵麾下，矮壮、装备精良、力气巨大
    - 这个种族的天赋异能是隐形术，用一次之后要等冷却
    - 军中编有百年辫髯战士，下盘斩是他们的成名招数
    - 魔法武器与巨人手臂做的饰物都是这支矮人对外出售的货
    - 灰矮人铁匠主理翡翠兵工厂
  后果:
    - 灰矮人握住了地底军械的出口，也握住了地底与人类商人之间的珍品买卖
    - 血精灵十万人口麾下有灰矮人三十万，堕落精灵的兵力与军械来自同一批人
  对当前格局的影响:
    - 这座地底城的统治者手里有三十万灰矮人与两百万河仙人
    - 人类商人看重的是冰封之海的水晶与幽暗地底的冥界黑水晶

穴居人与地底粮荒:
  时间: 地底定居之后
  事件:
    - 石腭穴居人懦弱矮小，适应力与生育力却极强，三层大陆到处都有他们劳作的身影
    - 石腭穴居人帮助过刚逃入地底的牛头人和鹰身人，如今成为两个精灵种族掠夺奴役的对象，仅怒焰大陆就有三千万
    - 地底的蕨类食物和苔藓类粮食都无法发酵，自从地精行脚商人一万多年前离开地底之后，地底世界就再没有过酒
    - 地底三大土著是穴居人、堤丰巨人和河仙人，河仙人自称是比蒙的蚯蚓族
  后果:
    - 穴居人成了地底最廉价的炮灰和生产力
    - 两支堕落精灵的吃喝压在地底穴居人身上
  对当前格局的影响:
    - 堕落精灵全民皆兵的基础是地底世界三千万石腭穴居人
    - 地底世界被掐断后堕落精灵缺粮，最多只能保持十万常备军力

矮人工艺的当代落差:
  时间: 近千年来
  事件:
    - 四大纯血杜伊嘉尔之中，只有黄金矮人一支是纯粹的强战之族，也是唯一不会采矿锻造的
    - 白银矮人擅长提炼黑索银，野矮人的炼金足以媲美爱琴所有炼金师团队
    - 慕兰人打出来的刀具，比爱琴这边的矮人铁匠还胜一筹
    - 沙漠矮人的信仰与爱琴比蒙分成两路，摩拉丁这位矮人之神他们并不认
    - 沙舟部队由四百名沙漠矮人组成，乘巨螺沙舟自地底破土突袭，专职毁坏对方辎重
  后果:
    - 矮人的手艺在沙漠一侧另开出一支，与爱琴矮人不同路
    - 比蒙王国的软肋落在军工业基础薄弱上
  对当前格局的影响:
    - 比蒙王国补军工业的途径只剩收拢地底炉子与散落各处的矮人支系
    - 盾斧矮人被当成人情送给外人，骨子里本就想脱离地底

坎通纳出走:
  时间: 一百多年前
  事件:
    - 一百多年前的血精灵法师坎通纳从罡风天堑安然离开地底
    - 他此行是为寻找搭救族人的办法，一去不返
    - 族人以为他被外界迷住，反而更坚定冲出地底牢笼的信念
  后果:
    - 地底第一次有人凭本事走出罡风天堑，牢笼的说法被动摇
    - 出走成了堕落精灵证明自己还能回地表的一条路
  对当前格局的影响:
    - 坎通纳的血婴破坏了时空大裂缝的魔法禁制，他因此被赶出地底
    - 血婴西罗身上有坎通纳魔导师传下的血魄驮都，加上瞬发的鸡尾酒魔法，战力压过巨龙

<%_ if (chap >= 73) { _%>
地底军力的现实:
  时间: 主角成为翡冷翠领主之后
  事件:
    - 两支堕落精灵在地底住了一万多年，手上有精灵与矮人两脉精通冶炼的族人，早已武装到牙齿
    - 堕落精灵如今繁衍到三百万人口，其中河仙人两百万、灰矮人三十万、血精灵十万
    - 暗精灵霸占墨晶山谷的生命之泉泉眼，全族人口稀少
    - 地底的两支堕落精灵全部搬迁到地表至少需要半年时间
  后果:
    - 地底的冶炼底子把人口劣势补成了军械优势
    - 迁徙的粮草仍旧压在地底穴居人身上，走不了也留不安
  对当前格局的影响:
    - 堕落精灵的常备军一度达到七十万
    - 失去地底世界与生命之泉后，堕落精灵的家底只剩地表这一条线
