@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 73 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 763
第三章至第四十章·立旗与设卡:
  时间: 第七卷纵横篇开局，第三十章至第四十章
  事件:
    - 刘震撼以李察之名在红土高坡升起双剑交叉滴血龙首的红旗，骷髅猪头标志挂上红土高坡半空
    - 自创的邪恶光环战歌首次施展，施法后歌力透支
    - 翡冷翠渡口收费站开张，过路费的价码按货主身家浮动，人类商旅按人头与货物被打点抽成
    - 通往领地的路原本没有，是往来商旅踩出来的
  后果:
    - 领地拿到稳定的过路收入，同时被当成强盗巢穴
    - 人类商旅把桑干河渡口视作必须打点的关口
  对当前格局的影响:
    - 桑干河渡口是领地的主要水陆门户，收费标准由领主单方面定
    - 骷髅猪头与滴血龙首成为翡冷翠香军的旗号来源

第六十八章至第九十六章·空军与秘银战甲:
  时间: 第七卷前段，第六十八章至第九十六章
  事件:
    - 穆里尼奥搬出人类狮鹫部队的旧例，翡冷翠空军的构想正式提出
    - 牛顿巨鸟一次抓到五十四只，比预算多出小一半，翡冷翠空军得到第一批坐骑
    - 圣弗郎西斯科帝国四百年前发掘的秘银矿所制白银基座战甲首次登场，被双料油瓜全歼
    - 翡冷翠抢到一百套秘银战甲，民兵不满百、满百不可敌的说法由此传出
  后果:
    - 翡冷翠建立起不依赖鸟族比蒙的空中兵种
    - 秘银装备流入领地，民兵的单兵防护抬升
  对当前格局的影响:
    - 空军坐骑与秘银战甲构成翡冷翠以少胜多的早期底牌
    - 牛顿巨鸟的驯养与繁殖成为领地的长期兵源

第一百六十七章·唇枪可比十万军:
  时间: 第七卷前段，第一百六十七章
  事件:
    - 十二头地狱黑龙现身索要两位仙女龙，族长罗纳尔迪尼奥以全族之力相胁
    - 刘震撼先抛出魔族万年入侵之期劝黑龙投奔魔族，被黑龙斥退
    - 他改以祖先之罪不该由后代承担的说法游说，黑龙最终动身去地表
  后果:
    - 地底黑龙一族与翡冷翠建立往来
    - 仙女龙黛丝与娜娜留在翡冷翠
  对当前格局的影响:
    - 黑龙成为翡冷翠在地底的潜在兵源与情报渠道
    - 仙女龙的天赋绝技是领地对抗高阶施法者的核心手段

第一百八十五章·内务统筹:
  时间: 第七卷前段，魔族入侵之前
  事件:
    - 翡冷翠的兵力、人才与产业一次性盘点，领地的家底第一次成形
    - 猛虎佣兵团与森林精灵部落来投
    - 两支地底堕落精灵的驻兵被安置在领地，隐患就此埋下
  后果:
    - 领地由单一比蒙聚落变成多族混编的武装集团
    - 地底精灵驻兵与本地势力长期并存
  对当前格局的影响:
    - 多族混编是翡冷翠屡次以少胜多的编制基础，也是内部矛盾的源头
    - 附庸族各有自己的利益诉求，领主无法用单一族规统辖

第二百二十六章至第二百四十二章·龙城参战与献龙停战:
  时间: 第七卷中段，第二百二十六章至第二百四十二章
  事件:
    - 龙城拒绝调拨巨龙坐骑，并说明主动参战是为报一万年前魔族盗空两处龙之墓地两百多具龙骨之仇
    - 大陆巨龙不满两百头，与两龙城有往来者仅十七头，伊布擅作主张答应调拨一百五十名成年龙人
    - 普斯卡什与刘震撼闲谈魔族旧事，魔族撤离爱琴时裹挟两百多具巨龙骨骸，并以亡灵天灾瘟疫灭绝地精
    - 龙骑士赶到沙巴克，刘震撼献十九头巨龙换一年停战
  后果:
    - 翡冷翠未来法师团以龙人为主干成形
    - 比蒙与人类之间用巨龙换来一年缓冲
  对当前格局的影响:
    - 龙族参战的动机是复仇而非盟约，作战目标与翡冷翠不完全一致
    - 骨龙威胁成为龙城与魔族之间的死结

第二百七十一章至第二百八十九章·横断山脉战事:
  时间: 第七卷中段，比蒙远征慕兰
  事件:
    - 金刀魔羯阿里.代伊身世揭晓，摩雅人被慕兰吞并，他率三千人守粟米特绿洲拖延战
    - 慕兰帅帐中挂着绘制数百年的军用地图，比蒙边境布防与剃刀山、红土高坡尽在其中，蒙席阿訇交代慕兰三百年吞并十七国
    - 远征军团主力抵达耶鲁绿洲，四波斥候全部折损，对手是隆美尔麾下的慕兰风暴军团与秃鹫空军
    - 三千比蒙战士在横断山脉壑口与慕兰军对峙，狮心亲王拒绝祭祀助战
  后果:
    - 比蒙军看清慕兰对多瑙荒原的图谋早于战争数百年
    - 隆美尔的名号与战法进入比蒙军部视野
  对当前格局的影响:
    - 翡冷翠在慕兰地图上被标为要点，领地从此成为慕兰重点打击对象
    - 狮心亲王坚持勇士的荣誉，祭祀在比蒙军中的位置始终受军部牵制

第三百一十一章至第三百四十五章·狂蚁与屠城:
  时间: 第七卷中段，第三百一十一章至第三百四十五章
  事件:
    - 慕兰人以侏儒蒸汽攻城战车抛射上百吨血浆，引出地下亿万嗜金蚁，比蒙步兵方阵溃乱、狼骑兵被啃成骨架
    - 慕兰围城七天，苏丹近卫军统帅戈勒穆罕默迪与飞驼军团争功后强攻，比蒙放弃城楼退守城内，以人头蚁身神像堵门、仙人刺毒箭覆盖云梯
    - 慕兰使者劝降被拒，隆美尔骑银象携两百砒霜巨人与一联队沙漠美莱茨现身，卡恩亲王从狐尾认出他是福克斯
    - 伊布开启狱门，普斯卡什以沉睡之云放倒美茵茨射手，翡冷翠战士血洗军营并救出巨人女眷
  后果:
    - 隆美尔放话明年率军南下，比蒙与慕兰的战事转入长期
    - 刘震撼集结两万余精锐下达红带屠城令，只留工匠
  对当前格局的影响:
    - 隆美尔是福克斯与慕兰混血，腰悬可挡一次致命伤害的卡嘉瑞德宝石
    - 比蒙远征军以劫掠与屠城补给的做法固定下来

第三百四十九章至第三百七十四章·加里曼丹与后路:
  时间: 第七卷中段，第三百四十九章至第三百七十四章
  事件:
    - 加里曼丹仅剩九个千人编制的慕兰战士与五千赏金猎人，王城守军一千、宫廷阿訇二十五人
    - 翡冷翠武士破阵杀入殿前广场，刘震撼以山丘之王抛掷阿訇打靶，出城时宝典阿訇马拿利现身拦路
    - 刘震撼自加里曼丹返回翡冷翠，半月内基头座龙已达十九头，罗纳尔多被凝玉以十柄慕兰金刀挽留
    - 他与四位方士长老谈判云秦旅人去留，不到两千人愿加入，遂定下澈桑大草原为二城与退路
  后果:
    - 翡冷翠拿到跨大陆的第二处立足点
    - 云秦旅人大部分返回家乡，少部分并入领地
  对当前格局的影响:
    - 澈桑大陆的二城是翡冷翠在大陆决战中的退路与第二兵源
    - 加里曼丹一战让慕兰帝国的腹地门户洞开

第三百八十五章至第四百三十二章·军备与政治风暴:
  时间: 第七卷后段，第三百八十五章至第四百三十二章
  事件:
    - 黄金矮人全族四百七十二人下山投奔翡冷翠，族长克虏伯是雷鸣登之父，索要全族黄金行头
    - 黄金矮人为翡冷翠带来二百三十六名法师的法师团基础，油瓜短缺由爆裂箭与伽马巨炮接续
    - 翡冷翠法师团成立，三大战略杀手锏的蓝图定型，领地由守成转向对外扩张
    - 艾莉婕以战神遗孀身份自称夏宫之主，抢在国王面前把翡冷翠推进政治风暴
    - 海族掌握安全离水之法并将在半年内入侵爱琴的情报揭晓，翡冷翠与刘震撼是首要打击目标
  后果:
    - 翡冷翠获得成建制的法师力量与跨大陆投送能力
    - 领地同时面对比蒙王国的政治压力与海族的军事威胁
  对当前格局的影响:
    - 夏宫神姬的身份使花精灵在比蒙王国获得平等目光成为可谈的条件
    - 海族的离水法阵是陆地势力数百年来的技术缺口

第四百三十八章至第五百五十四章·教皇来投与战争爆发:
  时间: 第七卷后段，第四百三十八章至第五百五十四章
  事件:
    - 圣保罗教皇保罗·马尔蒂尼率圣堂飞行骑士被魔族追杀，逃至黑幕笼罩的翡冷翠
    - 小鹦鹉马特拉齐以龙语魔法与火中取栗痛击魔族追兵，龙骑士兰帕德率幻兽骑士出击
    - 刘震撼说出留任做官的真实计划，先扫平海族一支先头部队，逼海族与魔族驳火，保全比蒙后再从旁插刀
    - 入夜国王萨尔带血渍赶回，单独告知时空大裂缝提前开启三小时内大量魔族涌入爱琴
    - 翡冷翠收下两大人类帝国的厚礼，皇冠荆棘战甲将升级为第四代
  后果:
    - 教廷最高首脑在翡冷翠落脚，领地与教廷的关系逆转
    - 魔族先头部队进入爱琴，但都不是正规军
  对当前格局的影响:
    - 教皇在翡冷翠的战力体系与情报网之间形成新的合作关系
    - 魔族正规军与海慕联军的到达时间成为各方推算的焦点

第五百五十八章至第六百零四章·军援与龙领:
  时间: 决战之前，第五百五十八章至第六百零四章
  事件:
    - 比蒙王都与二十一个人类国度会谈敲定军援计划，由三大人类军事强国统筹
    - 魔族禁咒亡灵天灾须巫妖王持咒，魔族全族仅三位巫妖王，翡冷翠以吸香红豆锁死瘟疫传播
    - 慕兰美帅隆美尔到访翡冷翠，提出以四大纯血杜伊嘉尔之一的盾斧矮人换取红土高坡，凝玉反提以剃刀山雪梨城交换
    - 刘震撼凯旋回到翡冷翠，三万狼骑经隔雾通道撤入海岛，缴获的慕兰地图上翡冷翠被标为战略要点、落款是隆美尔
    - 魔族一万五千阻击兵团在圣盔大平原拦截三万沃尔夫狼骑残旅，纷舞妖姬发威，超声波在阵中剃出一条人肉弄堂
  后果:
    - 人类军援落地，翡冷翠的物资与人力缺口被部分填平
    - 隆美尔的交换条件被拒，双方约定后日开战
  对当前格局的影响:
    - 亡灵天灾只能由三位巫妖王施展，锁死瘟疫等于废掉魔族一大杀器
    - 隆美尔长驻翡冷翠研究海族兵种与打法，成为最难对付的对手

第六百二十六章至第六百三十八章·大战善后:
  时间: 决战之后，第六百二十六章至第六百三十八章
  事件:
    - 大战落幕，翡冷翠折损过半幻兽座龙与六十二头巨龙，冥族骸河大统领阵亡、血河大统领被俘，魔族全军覆没
    - 冥兽尸体在烈日下腐化成脓水无法利用，刘震撼拒答黑索银之秘
    - 刘震撼用航用六管重机枪连发奥骨斯都法杖法术，扫退慕兰骑兵与幻兽骑士，老壁虎发现羚牛武士装备伊斯西丁金属
    - 隆美尔带巫妖王嘉宝游历翡冷翠，分析海陆战局并建议魔族走采玉城雪山小道进攻北部荒原
  后果:
    - 翡冷翠的空军与幻兽座龙元气大伤，贝克汉姆与奥特加出走
    - 萨尔国王在沙巴克以魔法传送阵为诱饵，用巨型爆破铁桶炸死海慕联军三百余名法师
  对当前格局的影响:
    - 海慕联军的高阶法师被成建制消灭，联军的攻坚能力大幅下降
    - 隆美尔把翡冷翠的防御细节带回魔族，双方进入互摸底牌的阶段

第六百七十七章至第六百八十七章·决战倒计时:
  时间: 决战前夜，第六百七十七章至第六百八十七章
  事件:
    - 魔族高层决战部署首次完整摊开，方略是航弹、奥力改造与先夺制空权
    - 澈桑大陆比蒙作战实验室的参谋们分析魔族三路进兵，四百万人马在桑干河沿岸集结却无渡河之法
    - 魔界三大海族介入，魔族翻越桑干河天险，四位魔海使节当众发难，高端决战引爆
    - 海加尔介丘仪式成了决战导火索，六翼天王阿泰斯特率三十万魔族大军进逼翡冷翠
    - 决战第一枪由隆美尔在采玉城主动打响，他猜出魔族保护针叶松林是为制造松节油航弹
  后果:
    - 魔族渡河成功，翡冷翠失去桑干河天险
    - 采玉城与翡冷翠同时开战，战线由一条变成三条
  对当前格局的影响:
    - 穆里尼奥提议以十头巨龙设伏并请隆美尔指挥，敌我阵营在战术层面出现交叉
    - 巨龙在采玉城无处藏身，龙族的参战方式被迫改写

第六百八十九章至第七百零六章·终极决战与大结局:
  时间: 决战与战后，第六百八十九章至第七百零六章
  事件:
    - 采玉城捷报称魔龙一族覆灭，翡冷翠以北冕座流星雨、覆雨翻云、雷狱森林三记禁咒压阵，美萝乐被逼为翡冷翠持杖施法
    - 铁幕发生器被石像鬼以通体石化自杀投石砸毁，翡冷翠要塞全貌暴露，小空以燚火焚退魔族空军
    - 魔龙皇族以星澜之门召出镜面双生的两位星界之王达历桑德罗，六翼天王被娜迦默言术弄哑后遭刘震撼一记鞭腿抽飞
    - 魔族首轮强攻失败，一窝蜂弩车与绞肉机战车把攻城器械尽毁
    - 比蒙王国颁发荆棘草环征召令拣魔族大军的洋落，萨尔国王到翡冷翠试探削兵权被拒
  后果:
    - 魔族首轮强攻在翡冷翠城下被击退，要塞转入全面战争状态
    - 比蒙王国开始征收魔族战场的战利品，翡冷翠的军权与王权出现摩擦
  对当前格局的影响:
    - 萨尔国王见识夏宫卫队的毒系法术、鹦鹉学舌螺名琴、冥龙机甲与奥骨机炮后心惊
    - 刘震撼表明不扩张，宣布翡冷翠的征途是星辰大海，领地不再以多为目标
    - 夏宫卫队的装备谱系已超出比蒙王国常备军体系，削兵权的尝试难以落地
