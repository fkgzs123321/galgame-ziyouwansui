<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
荒原缓冲格局:
  时间: 海加尔战役后
  事件:
    - 横穿多瑙大荒原需一个月路程，这片缺石少树的平地成为比蒙与人类之间唯一的隔断
    - 比蒙王国东北部行省由福克斯族狐人镇守，与人类的多洛特公国在荒原上遥遥对峙
    - 比蒙正规军全部驻守边境，防线拉得极长，兵力只够维持警戒
    - 多瑙荒原越往内部走强盗越是厉害，靠近边境线的地方有比蒙军队的定期围剿
  后果:
    - 双方都没有能力再打一场决战，小规模边境冲突成为常态
    - 再也没有谁愿意做出头鸟挑起大规模战争
  对当前格局的影响:
    - 人类与比蒙至今没有任何国家签定正式的贸易开发
    - 东南行省狼族比蒙的战略任务只是防守而不是进攻

多洛特与封锁线:
  时间: 海加尔战役后
  事件:
    - 荒原西侧的多洛特公国以雇佣兵输出立国，是比蒙边境线上唯一的人类陆上邻邦
    - 多洛特和卡瑞姆多大平原的入口相连接，一千年来堵住了所有向往圣山海加尔的眼睛
    - 人类国家在经济和贸易上封锁比蒙王国
    - 多洛特掠夺者经蛮荒古道绑架狐族少女转卖
  后果:
    - 人类商人每年为了丰厚的利润从多洛特跨越边境线来比蒙王国淘金
    - 威瑟斯庞城成为人类商人的首站
  对当前格局的影响:
    - 长老院允许人类商人拥有小型卫队，但人数不能过多
    - 打通多洛特后前往海加尔圣山朝圣成为比蒙领主的政治筹码

五大贵族与神庙:
  时间: 海加尔战役后数百年
  事件:
    - 比蒙王位十年一任，可由五大贵族推举挑战者比武夺位
    - 权杖祭祀已经接近祭祀金字塔的顶端，多在各自家族中握有实权
    - 神庙与长老院分庭抗礼，国王与神庙无权干预长老院上千年前制订的奴隶制度
    - 圣坛祭祀的宠物非自然死亡后，极少数的偶然情况下会把自身魔法元素力量嫁接到祭祀身上，神庙称之为血之祭奠的诅咒
  后果:
    - 比蒙各族家族的兴衰取决于圣坛祭祀的产出量
    - 神庙视另类祭祀为异端，宗教裁判所拥有裁决权
  对当前格局的影响:
    - 由于大规模元素潮汐的减退，比蒙祭祀的数量远不如千年前
    - 血之祭奠的诅咒千年以来只出现过两次，两次都在祭祀法典中留名

生育与人口结构:
  时间: 千年对峙期间
  事件:
    - 除匹格族外，比蒙各族的生育能力都很不理想
    - 匹格族因人口过多被计划生育
    - 比蒙王国仍贯彻一万年前由毫斯族寅初长老提出的计划生育政策
    - 水族比蒙在两千年前的海陆战争中十去其九，从此一蹶不振
  后果:
    - 比蒙现任国王格雷克.萨尔只拥有四个湾鳄武士作为仪仗队
    - 昆克族臭鼬人是比蒙中人数最多的种族，匹格族人口最多
  对当前格局的影响:
    - 比蒙王国唯一两支成建制的水军是模特族乌龟战士与左丹奴族蛙人，全部镇守西南边境落日大沼泽
    - 兵源紧张使王国对边境村庄的民兵编制依赖极深

海族千年盟约:
  时间: 千年对峙期间
  事件:
    - 比蒙祖先与西雅海族祖先立下盟约，允许陆上种族涉足七海
    - 两千年前西雅海族一位杰出的风暴撕裂术士研究出超强水结界，让不能长时间离开水面的海族军队拥有了脱离海洋约束、侵略陆地的能力
    - 两千年前仅一个西雅海国就打得整个爱琴大陆血流成河，人类、比蒙、精灵、矮人全部团结起来才勉强击败这支海族军队
    - 加布林族鲨鱼人是那场海陆大战中海上部队的主力，在水中与地上都是霸主
  后果:
    - 西雅海族认为千年盟约到了结束的时候
    - 海族因此封锁海路，陆上种族的远洋航行受制
  对当前格局的影响:
    - 海族与慕兰人组成百万侵攻军从威瑟斯庞方向登陆
    - 海族既无空战能力也缺乏防空火力，两个弱点是陆地作战的死穴

魔界千年渗透:
  时间: 千年对峙期间
  事件:
    - 魔界为报复圣战惨败成立渗透机构，最高层代号火狐
    - 魔族在五千年前研制出双胞胎药丸并用一位六翼天王做临床实验
    - 三千年前魔族开始使用三胞胎药丸，用药范围牢牢控制在巫妖王和恐惧魔王之间，随后销毁研究人员与全部资料
    - 整个爱琴大陆所有的华伦泊尔都投靠了魔族
  后果:
    - 魔族对爱琴的情报掌握扩展到人类各国宫廷与比蒙边境
    - 魔族入侵爱琴大陆的第一军事目标定为比蒙王国
  对当前格局的影响:
    - 魔族四百万大军兵发白令山脉，步步进逼多洛特公国伊夫堡天险
    - 比蒙王国边境的白令山脉与南十字星森林是魔族可能聚集重兵的方向

元素潮汐衰退:
  时间: 近千年来
  事件:
    - 爱琴大陆现在正处于元素潮汐的低谷期
    - 人类魔法师和比蒙祭祀的数量都远不如千年前
    - 人类魔法分为气火水土四系，一般魔法师只能学一系，天资最好者也只学两系互不冲突的魔法
    - 人类一国往往只有十几位熟练魔法师
  后果:
    - 魔法与战歌的绝对战力在千年之间整体下移
    - 高端战力稀缺使单个强者能左右整场战役
  对当前格局的影响:
    - 人类魔法师中最厉害的几个可以呼唤天外陨石，将一座城市变成燃烧的火海，一千年中也出不了几个
    - 战歌与魔法之外，各族军队回归到依托地势与工事的消耗战

<%_ if (chap >= 73) { _%>
圣山回归议题:
  时间: 海加尔战役后约一千年，主角成为翡冷翠领主之后
  事件:
    - 人类提出将海加尔圣山永久租借给比蒙并保留土地所有权，换取比蒙派祭祀部队参战
    - 永久租借的条件是土地所有权仍归圣弗郎西斯科帝国所有，比蒙可以在那里驻军五千维护治安，但不能禁止人类在海加尔山进出
    - 刘震撼回绝永久租借与厚报，只换回贝克汉姆
    - 海加尔圣山与黄金之路是比蒙最想得到的东西，人类常以此为筹码向比蒙领主开价
  后果:
    - 回归圣山成为比蒙千年国耻的洗刷，具有压倒一切的政治分量
    - 海加尔圣山成为人类与比蒙之间最重的一张交易牌
  对当前格局的影响:
    - 海加尔之星李察在海加尔圣山获奇遇，学全比蒙失传武技
    - 介丘海加尔成为比蒙整合国籍与兵力的政治开关
