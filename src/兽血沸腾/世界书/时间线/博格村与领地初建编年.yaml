@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 43 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 58
第一章至第二章·亲人相见与龙祭祀招牌:
  时间: 博格村篇第一至二章，荒原边境线与博格村监狱
  事件:
    - 队伍沿荒原边境线向内陆走，艾薇尔一边自责一边咒骂刘震撼，走不动路只好让他背着
    - 海伦说多瑙荒原地广人稀，除匹格族之外各族的生育力都很差
    - 海伦哭诉枫叶村惨案，家人被借多洛特公国商船潜入的沙漠人类杀死
    - 凝玉清点干粮，只够三天
    - 部队抵达博格村监狱，老匹格约克夏跪吻海伦手背，醉酒的叔叔西马克子爵抱住她痛哭
    - 海伦谎称船触礁家人全亡，他自称散居匹格、获封骑士伺从，又亮出天生灵魂歌者与龙祭祀身份震住全场
  后果:
    - 队伍在荒原上有了第一个落脚点，西马克子爵的采邑与采石场向他们打开
    - 枫叶村惨案成了海伦与多洛特公国之间的旧账
  对当前格局的影响:
    - 玩家只有一具匹格族身体和一个说不清的头衔，来历经不起细查
    - 吃食与护送要靠博格村的人情与龙祭祀的名头来换

第三章至第四章·采石场与獒人囚犯:
  时间: 博格村篇第三至四章，博格村采石场
  事件:
    - 刘震撼吹嘘龙宠带自己漂到荒岛并死于风暴，西马克说须神庙高阶神官认证
    - 他介绍熊猫武士、摩韶蚌女与美人鱼奴隶，还撩裙展示脚踝鱼鳞
    - 采石场里黄鼠狼人耍流氓，被古德一拳打飞；一群戴铁镣的金发犯人引起他注意
    - 西马克解释这些是沃尔夫附庸道格族中的獒人，因长相酷似莱茵皇族而以谕制之罪获罪，须参战活下来才能豁免
    - 他献出弯刀上的宝石抵伙食费，西马克劝他放弃，凝玉出言反驳
    - 海伦偷听到这场争论，仍然选择他
  后果:
    - 獒人囚犯的去处被摆上桌面，赎金成了他欠博格村的第一笔账
    - 海伦在明知他底细不全的情况下站到他这一边
  对当前格局的影响:
    - 玩家手里只剩弯刀宝石一路的盘缠，赎人与赶路只能选一样
    - 龙宠的说法没有神庙认证，随时会被戳穿

第五章至第六章·威瑟斯庞与神庙东大殿:
  时间: 博格村篇第五至六章，狐族之城威瑟斯庞与坎帕斯神庙
  事件:
    - 队伍进入狐族之城威瑟斯庞，八万常住人口，此城意为荒原上的珍珠
    - 海伦凭祭祀身份获得十名士兵护送
    - 坎帕斯神庙高踞数百级台阶之上，有十二对石雕巨柱与战神三魔宠雕像
    - 两位狮虎王子自报是国王之子，其中一位也叫李察
    - 神庙东大殿以中空穹顶的天光照射中央，维安大萨满拖着龟壳在四名圣殿骑士与十几名权杖祭祀簇拥下登场
    - 大萨满宣布海伦与匹格学徒申请晋级战争祭祀，并称他是天生灵魂歌者且收过一条龙宠，满殿哗然
  后果:
    - 他第一次站进比蒙的贵族与神庙政治场里，身份成了满殿议论的焦点
    - 同名王子李察.萨尔成了他的情敌
  对当前格局的影响:
    - 龙祭祀的说法被大萨满当众抬出来，他只能顺着往下接
    - 海伦的晋级与他的试炼绑在同一场仪式上

第七章至第九章·果果的拳击:
  时间: 博格村篇第七至九章，神庙东大殿与殿前广场
  事件:
    - 维安大萨满召出地行龙证明自己正职亚龙祭祀的眼光，并说李察王子也是亚龙骑士
    - 他谎称龙宠是火系龙兽且已死于风暴，又捧出果果当新魔宠，令大萨满失望地嘟囔败家子，只给他红袍
    - 他以歌力不足被拒战争祭祀后据理力争，称祭祀每年都有权申请试炼
    - 大萨满给出与试炼神官比试控制魔兽的任务，人马祭祀普约尔放出熔岩雕齿兽并出言讥讽，果果先装求饶，随即一套拳击把雕齿兽砸得吐牙翻倒
    - 沃尔夫权杖祭祀雷德克纳普以唐古拉冰熊登场，果果穿裆绕后一拳黑虎掏心打倒祭祀本人
    - 他以黑加菲白加菲之喻舌战群雄，大萨满喝止众人，宣布他通过试炼
  后果:
    - 果果的名声压过在场的所有魔兽，神庙只好认下这场试炼
    - 雷德克纳普当众成了笑柄，这份账记在他名下
  对当前格局的影响:
    - 玩家拿到红袍与试炼资格，战争祭祀的名分仍差一步
    - 汉语战歌与拳击魔兽的路子已经被人记住了

第十章至第十一章·试炼地与导师的馈赠:
  时间: 博格村篇第十至十一章，神庙与崔蓓茜的卧房
  事件:
    - 李察王子与维安大萨满耳语之后，大萨满给出南十字星森林与落日大沼泽两个试炼地
    - 刘震撼选最近的南十字星森林
    - 崔蓓茜私下召二人到卧房，赠一整袋魔兽晶核，并道破两地是权杖祭祀的晋级试炼地
    - 她讲权杖祭祀的实权与福克斯仰狼族鼻息的处境，点破越级试炼是为平息众怒
    - 她讲出身世，导师穆里尼奥在南十字星森林捡到一枚蛋并孵化出她，她与导师的师生恋被家族与长老院拆散
    - 临别她赠出《祭祀法典》
  后果:
    - 他手里多了一袋晶核与一部法典，也认下一位护短的导师
    - 南十字星森林从最近的试炼地变成拿命换资格的权杖祭祀晋级场
  对当前格局的影响:
    - 越级进试炼地就是拿命换资格，这条路没有退路
    - 福克斯族仰狼族鼻息的处境成了他日后在东北行省的把柄

第十二章至第十三章·人鱼买卖与五百万金币:
  时间: 博格村篇第十二至十三章，威瑟斯庞街头
  事件:
    - 神庙外凝玉与艾薇尔被人类佣兵围住，古德散布了出售美人鱼奴隶的消息，多洛特商人上门要买
    - 崔蓓茜看到美人鱼已有人类双腿，明白海伦失去处子花冠并怒斥她，他以师门传统堵住导师
    - 多洛特富商向李察王子控告他，反被砸得骨裂呕血
    - 王子以剥夺称号相逼，他喊出五百万金币卖艾薇尔，商人用记忆魔法水晶录下她的容貌
    - 崔蓓茜点明人鱼是海中王族，王子揭出女大公之争与好色亲王张伯伦
    - 李察王子换便装出场，随后显露亚龙坐骑公开追求海伦
  后果:
    - 艾薇尔的容貌流进人类商团的记忆水晶，多洛特与海族的眼睛都盯住了这座城
    - 海伦失去处子花冠的事被导师当面点破，神庙随时可能追究
  对当前格局的影响:
    - 玩家必须把艾薇尔的事收干净，不许再有人拿她做生意
    - 封地与爵位的文书还没有到手，他身上的称号全靠王子一句话

第十四章·打土豪与彩蛋求爱:
  时间: 博格村篇第十四章，威瑟斯庞商业街与远东之路商店
  事件:
    - 刘震撼借口采购装备拉李察王子同行，王子带众人逛威瑟斯庞商业街博取好感
    - 王子赠海伦彩蛋并当街求爱，被海伦以他送的尼龙袜子发带婉拒
    - 凝玉与艾薇尔吃醋后也各得一条发带
    - 他在远东之路为三女与熊猫成批采购衣服，决意狠敲竹杠
  后果:
    - 王子成了他采购军械的冤大头，人情债开始往军械上堆
    - 海伦用一条尼龙袜子发带把求爱挡了回去
  对当前格局的影响:
    - 玩家的日常开销全靠赊账，欠条与回扣都攥在别人手里
    - 与李察王子的交情是眼下唯一能换到军械的凭据

第十五章·军火大采买:
  时间: 博格村篇第十五章，道根之锤武器店
  事件:
    - 他冲进道根之锤，识破踏弩与双手大剑的成色并震慑矮人工匠罗格
    - 他买下棱枪、柳叶匕首并索要毒药
    - 矮人推荐他订购星辰精钢的弹簧狼牙棒黑龙，他当场改名密集阵
    - 他此前已在远东之路为三女与熊猫成批采购衣服
  后果:
    - 他手里第一次有了成套的制式军械与毒药
    - 矮人工匠罗格成为他长期的军械来路
  对当前格局的影响:
    - 军械账全部挂在李察王子头上，早晚要结
    - 密集阵狼牙棒与棱枪柳叶匕首成了队伍的制式装备

第十六章·闷棍一般的竹杠:
  时间: 博格村篇第十六章，道根之锤武器店
  事件:
    - 刘震撼再向罗格订购软甲与棱枪匕首，让罗格直接找李察王子结账
    - 王子签下盖着萨尔纹章的羊皮欠条
    - 罗格认出姓氏后拒收货款，甚至要把签单裱起来挂在店堂
    - 他自称扈从，还向罗格索要回扣
  后果:
    - 军械与软甲到手，账全记在萨尔王室的名下
    - 欠条成了罗格店堂里的招牌，也成了他日后要还的人情
  对当前格局的影响:
    - 他揣着崔蓓茜的晶核与李察王子的欠条接下南十字星森林的试炼
    - 队伍带着成套军械与三百童男童女向荒野出发
