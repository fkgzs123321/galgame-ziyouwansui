@@if getvar('stat_data.剧情.章节序号', { defaults: 0 }) >= 21 && getvar('stat_data.剧情.章节序号', { defaults: 0 }) <= 30
第一章·卧牛石:
  时间: 海上篇第一章，荒岛篇的次日
  事件:
    - 果果举起竹林边二千多斤的卧牛石验证诅咒，刘震撼单手掀飞石头救它，砸倒无数佛肚竹
    - 他感到双臂有使不完的神力，诅咒带来的类狂化已经落在身上
    - 两人扎竹筏顺安第斯信风漂流大半月，沿途骄阳似火，一望无际
    - 竹筏上的椰子被虎头鲨咬碎，海伦病重
    - 远处现出拿仑角海峡的青色痕迹
  后果:
    - 他把祭祀萨满的期望全部转到海伦身上，自己认下受诅咒的身份
    - 淡水与食物跟着竹筏一起消耗，海伦的病情压过一切
  对当前格局的影响:
    - 玩家确认身体力量来自诅咒，这份力气与战歌失效是同一笔账
    - 漂流是唯一出路，拿仑角成为第一个可望的落点

第二章·发如血:
  时间: 海上篇第二章，竹筏驶入拿仑角
  事件:
    - 竹筏驶过拿仑角两侧山体雕成的持剑巨神像
    - 海伦弥留之际求他唱歌
    - 他以比蒙通用语自创发如血，金色光线穿透海伦、酸液鱼鹰与果果
    - 这一唱竟使出权杖祭祀级别的心灵锁链战歌，海伦由此好转
    - 礁石之间传来美人鱼的歌声
  后果:
    - 自创战歌第一次在他手里生效，诅咒并不是死路
    - 歌声把海族的注意力引到这只竹筏上
  对当前格局的影响:
    - 玩家确认汉语战歌能用，代价是这门本事暴露就是异端
    - 海伦从弥留中拉回来，两人此后再没有分开过

第三章·人鱼公主:
  时间: 海上篇第三章，爱琴海域的雾中礁石
  事件:
    - 西雅帝国皇族美人鱼拨水晶竖琴现身，十二名骑虎头鲨的加布林魔鲨骑士围住竹筏
    - 她称两人中只许一人活命，另一个要献给她口中的海神之妻安菲特里忒
    - 两人以迎战作答
    - 她遂命虎鲨骑士理查德出战
  后果:
    - 竹筏被海族围死，退路彻底断掉
    - 西雅海国的封海令从传闻变成眼前的敌意
  对当前格局的影响:
    - 玩家第一次直面海中国家，海族的实力与礼节都按骑士规矩走
    - 海伦的性命与他的性命被摆在同一张台面上称量

第四章·绞杀魔鲨骑士:
  时间: 海上篇第四章
  事件:
    - 理查德以波涛之盾挡下果果的霜球
    - 刘震撼用赛勃锁技徒手绞杀这位魔鲨骑士，把成型的水龙扼散
    - 波塞冬请战，被美人鱼以骑士荣誉喝止
    - 公主自报名艾薇尔后骑海马离去
    - 海伦提醒他海族有出尔反尔的权利
  后果:
    - 一个魔鲨骑士死在竹筏上，海族与东方旅人的梁子就此结下
    - 艾薇尔记住了这张脸，也记住了这份不受规则约束的打法
  对当前格局的影响:
    - 玩家在水里的近身格斗成为可用手段，但深海仍是海族的主场
    - 海族信誉不可依赖，谈成的事随时可能被推翻

第五章·蓬莱号:
  时间: 海上篇第五章
  事件:
    - 海伦力竭倒在他怀里，说祭祀是比蒙前进的明灯，不许他与强敌硬拼
    - 他自称受诅咒的龙力祭祀，又提出入赘福克斯
    - 海伦神色黯淡，哭着求他永不放弃自己
    - 竹筏撞上一艘巨船，东方比蒙古德自报蓬莱号水手长兼护卫
  后果:
    - 竹筏生涯结束，两人登上一条能横渡海域的大船
    - 他给出了永不放弃的承诺，海伦把它当成往后所有事的前提
  对当前格局的影响:
    - 玩家有了船与栖身处，但船上的人各有自己的来路与盘算
    - 龙力祭祀这个名头被他自己抛出来，往后要被反复查验

第六章至第七章·云秦旅人:
  时间: 海上篇第六、七章
  事件:
    - 人类老者福格森.徐现身，自称祖先是丝绸大陆云秦帝国最优秀的方士
    - 他讲云秦横扫六国、始皇帝派三千童男童女出海求长生不老仙药，找不到便不许归国，族人从此定居澈桑大陆
    - 蚌女凝玉以海市蜃楼幻术变出假刘震撼
    - 凝玉讲明摩韶幻术只欺视觉，比不上猛禽德鲁伊
    - 福格森.徐答应送两人回多瑙荒原，条件是让族人进入南十字星森林、泰穆尔拉雅雪山与落日大沼泽采药，海伦以男爵身份担保
    - 海面浪起，海族再次追至
  后果:
    - 回多瑙荒原的路换成一份采药契约，海伦的男爵头衔第一次被押上去
    - 船上的方士一脉、蚌女与三百童男童女都成了他要打交道的人
  对当前格局的影响:
    - 玩家多了一条靠契约换取归途的路，代价是替别人跑腿采药
    - 海族的追击不会停在竹筏上，封锁同样罩住蓬莱号

第八章至第九章·暗流:
  时间: 海上篇第八、九章
  事件:
    - 虎头鲨群围船，班尼路族鲸鱼武士、西雅海国禁卫军总长路易斯.菲高现身，质问箭鱼被杀一事，抽出生锈铁锚要教训东方旅人
    - 人鱼公主艾薇尔乘黑色海马再现，指认要船交出刘震撼与海伦两人谢罪
    - 鲸鱼武士掷锚，熊猫武士以渔叉硬拼成平手
    - 刘震撼假意下跪，趁众人回头用定石砸塌其鼻梁又扇耳光
    - 福格森.徐念咒召出两个十米高的斋殆金人，把鲸鱼武士拖入海中
  后果:
    - 熊猫武士与鲸鱼武士打成平手，船上的人第一次并肩对外
    - 斋殆金人出手，方士一脉压箱底的本事露了一角
  对当前格局的影响:
    - 玩家认定海族要的是人不是理，往后交手不再讲场面
    - 海伦起身称战死沙场是比蒙祭祀最好的归宿，把死志摆到明面上

第十章·想唱就唱:
  时间: 海上篇末章
  事件:
    - 凝玉召十二金人围住海族，人鱼公主仍逼徐老头交出二人
    - 海伦高唱悲壮的通灵战歌，凝玉唱摩韶送行歌
    - 刘震撼自创狂化战歌，使二十名潘塔武士狂化
    - 古德一叉重创艾薇尔
    - 刘震撼跳海捞回人鱼公主做人质
  后果:
    - 人质在手，海族一时不敢再逼，船暂时保住
    - 他同时得罪了西雅海国的王族与军队
  对当前格局的影响:
    - 玩家手里多出一个烫手的人质，也把海族王族的仇结到底
    - 汉语战歌当众用过一次，异端的风险从此常驻
