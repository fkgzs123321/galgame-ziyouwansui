神魔大战:
  时间: 约一万年前。爱琴大陆有明确记载的最大一次异界入侵
  事件:
    - 魔族大军从时空大裂缝涌入爱琴，比蒙王国首当其冲，一族损失百分之八十的人口
    - 爱琴大陆曾最强盛的比蒙王国自此走下坡路，灿烂文明与悠久历史成为过眼云烟
    - 战后人类信仰剧变，圣保罗教排斥异教，发动十字军护教征战
    - 拿仑角海峡两侧山体被雕成持剑巨神石像，是这场大战留下的遗迹
  后果:
    - 比蒙人口基数被永久削去一大截，祭祀稀少与生育力偏低的问题从此无解
    - 比蒙王国疆域大幅萎缩，退守多瑙大荒原一线，由攻转守
    - 时空大裂缝成为爱琴持续千年的隐患，也是魔族后续入侵的固定通道
  对当前格局的影响:
    - 神魔大战是所有比蒙历史叙事的原点，神庙与现实政治都靠它论证合法性
    - 人类与比蒙的世仇从这一战定型：人类视比蒙为异端，比蒙视人类为叛出的同族
    - 终盘魔族再次大规模渡河时，比蒙上下把它当作神魔大战的重演

海加尔战役:
  时间: 约一千年前。比蒙与人类联军的决战
  事件:
    - 比蒙败于人类联军，退出海加尔一线，退守多瑙大荒原
    - 田纳西空战中，人类龙骑士与狮鹫对阵比蒙博得族，成为这场战役的转折点
    - 斯迈族天鹅人属博德族，被战神坎帕斯剥夺飞翔能力后以禁空之歌应战，对巨龙无效
    - 战后巨龙不再愿意与人类签下契约，龙骑士衰落，全大陆仅剩极少数
    - 猛犸族在海加尔战役后被官方遗忘，只余零星记载
  后果:
    - 龙骑士体系崩塌，龙祭祀与龙骑士都成了传说中才该出现的存在
    - 比蒙正规军全部转为边境守备，再无能力发起进攻性战争
    - 人类一方同样元气大伤，双方进入长期相持
  对当前格局的影响:
    - 海加尔圣山成为比蒙精神圣地，有守护一族的传说，是通往圣地的必争之地
    - 猛犸族在海加尔战役后被官方遗忘，只余零星记载散落在荒原各部
    - 禁空之歌与田纳西空战的记忆，是比蒙面对人类（以及后来的魔族）空军时的心理底色

千年对峙:
  时间: 海加尔战役之后至今
  事件:
    - 比蒙正规军全部驻守边境，防范人类已很吃力，无力他顾
    - 多瑙大荒原成为比蒙与人类之间的巨大缓冲，横穿需一个月路程
    - 唯一接壤的人类势力是多洛特公国，号称佣兵之国
  后果:
    - 比蒙内部神庙与长老院分庭抗礼，权杖祭祀多在家族中握有实权
    - 各族家族兴衰取决于圣坛祭祀的产出量，祭祀成了最稀缺的战略资源
    - 边境常年小规模摩擦，佣兵与走私成了荒原上的常态生意
  对当前格局的影响:
    - 主角被贬到多瑙大荒原边缘时，面对的正是这条千年未变的边境线
    - 多洛特公国的佣兵传统，是荒原上唯一成规模的人力市场
    - 地底世界、十万大山与海外诸国是比蒙在正面战场之外仅有的腾挪余地

神魔大战遗迹:
  拿仑角海峡: 两侧山体雕成持剑巨神石像，是远古神魔大战留下的遗迹，也是海路进入爱琴腹地的地标
  时空大裂缝: 魔族从异界涌入爱琴的通道，终盘由胡须迎客合拢，切断魔族后续兵力

历史对当下的影响:
  人口: 比蒙祭祀稀少且生育力低，各族家族兴衰取决于圣坛祭祀的产出量，一名圣坛祭祀足以撑起一个家族
  权力: 神庙与长老院分庭抗礼，权杖祭祀多在家族中握有实权，王位十年一任
  世仇: 人类视比蒙为异端，比蒙视人类为叛出的同族，双方都不承认对方的正统
  圣地: 海加尔圣山是比蒙精神圣地，有守护一族传说，一万年来无人打通上山道路
  龙族: 巨龙不再与人类签约，龙骑士近乎绝迹，龙族自身也以内战与放逐消耗

纪年:
  爱琴历: 新历，人类掌控爱琴大陆后为编撰史书之便所立，以一万年为一个纪元单位，爱琴历之前的纪元统称爱琴古历
  香帕历: 古历。爱琴古历满一万年改元爱琴历，故爱琴历一百一十五年折合香帕历两千一百一十五年
  当下: 爱琴历一百四十年五月。萨尔国王于爱琴历一百一十五年加冕，此时在位满二十五个年头
  换算: 香帕历纪年减去两千即得爱琴历纪年，两者相差两千年整
