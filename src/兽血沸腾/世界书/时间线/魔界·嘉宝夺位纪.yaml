<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
三大陆分治成局:
  时间: 魔族退守魔界之后的漫长岁月
  事件:
    - 魔界分为海岸贡献、荷里活与宝莱坞三块大陆，各由一位巫妖王统治
    - 宝莱坞属克拉克·盖博，荷里活属保罗纽曼，海岸贡献属嘉宝
    - 三块大陆被饱含剧毒的怒洋海瘴分割，每个大陆面积都有上百万平方公里
    - 三王彼此井水不犯河水，另有占领爱琴全境后各自划定地盘建国的君子协定
    - 魔界未开发的蛮荒之地至少占总体面积的一半，魔族的大型森林多到无法尽数
    - 魔界神祇众多，银瞳族供奉魔梦女神，恐惧族信奉睡魔之神，巫妖一族供奉的魔神耐奥祖被尊为众魔之神
  后果:
    - 魔族没有单一君主，最高权力由三位巫妖王分持
    - 爱琴所见的魔族大军实为三大陆联军，各带各的算盘
  对当前格局的影响:
    - 外来者进入魔界，每换一块大陆都要重新拜码头
    - 侵略者联盟始终缺一位一言九鼎的主帅，根子在这里

王爵位次与王族血脉:
  时间: 三大陆分治之后
  事件:
    - 魔界王爵分巫妖王、恐惧魔王与六翼天王三等，恐惧魔王为二等王爵，六翼天王为三等王爵
    - 王爵拥有特殊王者血脉，学习元素力量时禀赋特殊，进阶神速
    - 恐惧魔王是整个魔界大军的二号高层并掌管所有魔族空军，地位约等于爱琴龙族族长
    - 恐惧族特殊血脉一向只会诞生出三位首领，魔界恐惧族因此只有三大部落
    - 魔界只有三块大陆，最多只能出现三位巫妖王与九位恐惧魔王
    - 魔族天王就是爱琴所说的堕落天使
  后果:
    - 王爵数量被大陆数量锁死，扩编只能靠改造与补位
    - 统治者刻意避免出现主弱仆强的局面
  对当前格局的影响:
    - 王爵头衔本身是稀缺资源，竞选与补位都牵动三块大陆
    - 魔族祖制规定只有王爵有资格做军团首脑，主帅压不住下属会被借挑战之名干掉

克隆药丸与王位限数:
  时间: 五千年前至三千年前
  事件:
    - 魔族在五千年前研制出双胞胎药丸，并用一位六翼天王做临床实验
    - 三千年前开始使用三胞胎药丸，用药范围牢牢控制在巫妖王与恐惧魔王之间
    - 药丸启用之后，研究人员与全部资料被销毁
    - 魔族高层可以用灵丝密码以其他恐惧魔王为转载单位补齐恐惧魔王
    - 巫妖王保罗纽曼能施行灵丝密码剥离术，改造新生代恐惧魔王
    - 三块大陆的魔族高层班子里都出现过恐惧魔王缺位后由他人改造补位的先例
  后果:
    - 魔界始终维持三位巫妖王与五位天王的格局，王爵没有随药丸翻倍
    - 若对六翼天王隔代用药会出现十五位天王，这一条被统治者主动封死
  对当前格局的影响:
    - 克隆药物一旦外流，王爵数量与三大陆的权力平衡同时失控
    - 补位出来的恐惧魔王在战功与资历上先天不足，容易被推去当消耗品

<%_ if (chap >= 245) { _%>
女王坐镇海岸贡献:
  时间: 大战之前的漫长岁月
  事件:
    - 嘉宝是海岸贡献大陆的巫妖女王，王宫大殿设在卡萨布兰卡城
    - 她的王朝有灵丝密码与替身傀儡两项统治传统
    - 替身傀儡以身体发肤为材料制作，受伤即反噬宿主
    - 后宫八百，女王对后宫出身的新贵拥有绝对操控权
    - 巫妖王的奥术以死灵术与通幽术两系为顶端，她的灵力密码、剥离奥术与灵魂剥离都出自这两系
  后果:
    - 海岸贡献的权力中枢收拢在女王一人身上
    - 女王的赏赐与头衔可以直接改写一个人的身份
  对当前格局的影响:
    - 想跟魔族打交道的人绕不开女王，也绕不开她的后宫
    - 受封者一身的战力都攥在女王手里，她的奥术可以随时剥离或转嫁

天王竞选与左岸补位:
  时间: 大战前的和平年月
  事件:
    - 魔界共有十位四翼魔骑士，前期损失后只剩七位，宝莱坞三位、荷里活三位、海岸贡献只有一位
    - 左岸天王竞选在卡萨布兰卡开幕，竞选规则与四翼魔骑士的分布被一并点明
    - 嘉宝封无名之辈卡鲁为海岸贡献的左岸天王
    - 左岸拳甲以魔界珍稀的黑云金编成，平时当拳套，战斗时可随心转换为全身盔甲
    - 嘉宝替卡鲁剥离圣阶奥术时，在奥术里夹带了巫妖血脉独有的倾心契约
  后果:
    - 左岸天王成了女王钉在魔王竞选体系里的一枚棋子
    - 倾心契约让契约双方不可自拔地相爱，这一手最后套住了女王自己
  对当前格局的影响:
    - 竞选制度给了外来者上位的口子，主角借此混进魔族高层
    - 头衔连着拳甲与奥术封印，受封者的名分与战力是同一笔账

魔龙密约与圣火熄灭:
  时间: 大战前夜
  事件:
    - 克拉克·盖博与曙光龙城缔结魔龙骑士密约
    - 他向魔龙吐露，文莱主神庙永不熄灭的圣火已经燃烧殆尽
    - 魔龙一族拥有噬龙技能，吞噬巨龙的皮骨晶核即可获得爱琴巨龙的魔法能力
    - 曙光龙城用曼德亚哥巨兽骨骼砌起八面漏风的骨冢大殿，是魔界唯一不浸染阳光的放逐圣地
    - 魔族圣战军团由六翼天王、恐惧魔王与巫妖王体系主导
  后果:
    - 魔界神权的背书随圣火熄灭一起失去分量，魔族与魔龙结盟成为唯一出路
    - 魔界圣战的走向就此确立，魔族要防的不只是爱琴
  对当前格局的影响:
    - 魔龙与魔族各怀心思的同盟，随时可以在战场上翻面
    - 神权退到幕后，魔族远征的锋刃全在六翼天王与恐惧魔王手上

斩首突袭爱琴:
  时间: 大战初期
  事件:
    - 嘉宝与保罗纽曼、克拉克盖博共同策划对爱琴大陆的斩首突袭，目标是各族最危险的高手
    - 宝莱坞那一路全军覆没，荷里活一路活捉德鲁伊王子卡卡，海岸贡献损失惨重
    - 先遣别动队与两大巫妖王全军覆没
    - 战报送到时，嘉宝正在魔界皇宫宴请隆美尔
    - 荷里活大陆的政权实力为三大陆之首，先遣军在斩首计划中损失最小
  后果:
    - 魔族高端力量只剩一位巫妖王、一位六翼天王、三位四翼骑士与五十位羽翼骑士
    - 三大陆被迫招纳奥兽英豪扩充实力
  对当前格局的影响:
    - 魔族由攻转守，女王的目标从占地改成猎杀对位面最危险的天位强者
    - 斩首让三大陆的损失比例失衡，荷里活成了实力最强的一家

先遣军备战爱琴:
  时间: 大战前期至大战中期
  事件:
    - 魔界社会体制完善，三大陆已掌握离水徽章技术，等时空大裂缝一开就进军爱琴
    - 三大陆为远征赶制航弹，由嘉宝与邓波尔殿下亲自督促
    - 五百万机关憎恶武士发动叛乱，约两百万固守宝莱坞大陆的一座地下城市
    - 魔界金属矿藏不多而水晶矿最多，魔族正规军已列装晶石甲胄与晶石武器
    - 魔界三大海族以靼菲叙族海胆人的无水结界法阵助魔族渡河
  后果:
    - 魔族把主力压上爱琴一条陆路，宝莱坞抽不出兵去剿叛军
    - 三大陆的出兵比例被叛乱拖成一边倒
  对当前格局的影响:
    - 时空大裂缝成了魔族唯一的输血管，掐住它就掐住六百万大军
    - 机关憎恶武士成了魔界内部的第二战场，谁都不敢先调兵去剿

裂缝封阖与魔族断粮:
  时间: 大战末期
  事件:
    - 唐藏仙师胡须迎客在魔界度厄晋级圣霄，刘震撼趁机提前关闭时空大裂缝
    - 裂缝一封，六百万魔族大军的粮道断绝
    - 十一月十五日大雪冻死数万魔族，十万伪军工兵被刘震撼下令屠杀
    - 嘉宝求上古皮亚琴察鳄王出手被拒，鳄王只护魔界本土，不肯助魔族远征
  后果:
    - 魔界大批兵力留在爱琴回不去，本土也丢了补给线
    - 女王从侵略者变成被困者，只能拿赌斗换退路
  对当前格局的影响:
    - 魔界退回守势，守势的支点全在时空大裂缝能不能再开
    - 六百万大军困在爱琴，粮道与归路是同一个口子

