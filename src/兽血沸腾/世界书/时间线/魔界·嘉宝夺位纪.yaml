三对三的邀战:
  时间: 大战终局
  事件:
    - 太阳升起时，嘉宝在白令山脉下的时空大裂缝约刘震撼三对三
    - 赌约写明，魔界赢了则明年哑月回归爱琴时再开裂缝，爱琴不得侵略魔界；输了则从此不再跨进爱琴半步
    - 她要刘震撼用战神坎帕斯的名起誓，也要他把这一战通知爱琴大陆所有势力
    - 她提前送回血婴，只要求海伦解除与耐温尔因克签下的心灵契约
    - 上古鳄王在赌斗中出阵被秒杀，嘉宝召唤秘名失败
  后果:
    - 魔界与爱琴的往来被压在一纸赌约上
    - 魔界最后的指望从六百万大军缩成一场三对三
  对当前格局的影响:
    - 女王把复位与保命的筹码全押在时空大裂缝
    - 爱琴诸势力被要求为赌约作见证，日后反悔要面对的是整个大陆
