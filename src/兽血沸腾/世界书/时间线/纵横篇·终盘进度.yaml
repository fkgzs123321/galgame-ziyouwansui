      完成判定:
        - 隆美尔盛赞采玉城是依托雪山树墙、藤桥与温泉人工湿地构建的军事杰作，并猜出魔族保护针叶松林是为制造松节油航弹；穆里尼奥带众人传送回斯迈老巢伦敦城，揭开四头血龙与六个雾霭巨人都是被血族初拥过的存在，并讲述初拥三原则
        - 隆美尔召唤禁咒的代价是肉身死亡，但他修影系魔法可借影子不死；玉皇不请示嘉宝便带嫡系猛扑采玉城，玩家令众人不得用目光锁定，并擒下六翼天王
        - 翡冷翠以北冕座流星雨、覆雨翻云、雷狱森林三记禁咒压阵，美萝乐被逼为翡冷翠持杖施法；一窝蜂弩车与绞肉机战车把攻城器械尽毁，魔龙皇族以星澜之门召出镜面双生的两位星界之王达历桑德罗
        - 梦露女王释放元素黑洞领域以四位物理无敌的金刚钻哥利亚为底牌，却连带抽干了湛蓝海龙贴身的离水法阵，两百头海龙与两千龙人战士陷入窒息绝境；海龙与龙人战士为求生路猛扑桑干河，壹条立下猎杀四十头海龙的军令状
        - 玉武亲王率上千玉廷高手与三十头魔龙俯冲城楼，被树冠中的禁空之歌摔成肉雨；冥界大统领茵格里切宝率四头六阶铠甲冥龙赶到；魔界三大海族携三千五百四十七名奥术师与二百四十二头变异超阶奥兽现身采玉城
        - 穆里尼奥向隆美尔致歉并立誓永为朋友，随即以布雾石起雾、月石闪光弹激活晶化，把海洋魔族化为水晶雕像
        - 里贝里以律令系奥术得手，地狱黑龙带头逃亡引发巨龙溃散，隆美尔与谛听银象被四头铠甲冥龙射碎；穆里尼奥被擒后以单控辉煌光环连杀冥龙与影侍，默发冥语版的名剑召唤召出石中宝剑埃克斯卡利巴，茵格里切宝以时间遗忘法则定住位面三刹那，避过单控冬眠光环后以战剑穿其心口；天鹅主祭战死化蓝天鹅星屑
        - 介丘节战役落幕，穆里尼奥被记为救世英雄，李察则被揭示为大战的幕后黑手，最亮眼的名号与兵燹战火的始作俑者落在同一个人头上；唐藏仙师胡须迎客在魔界度厄晋级圣霄，他趁机提前关闭时空大裂缝，断掉六百万魔族大军的粮道
        - 比蒙王国颁发荆棘草环征召令，准备拣魔族大军的洋落；萨尔国王到翡冷翠试探削兵权被拒
        - 十一月十五日大雪冻死数万魔族，十万伪军工兵被他下令屠杀，伊夫堡失守，两位人类魔寻师阵亡
        - 嘉宝约定明天太阳升起时在白令山脉下的时空大裂缝前以三对三公平较量，茵格里切宝跪求饶冥界被小空砸死，上古鳄王被秒杀，他被幻境送回地球，嘉宝召唤秘名失败
