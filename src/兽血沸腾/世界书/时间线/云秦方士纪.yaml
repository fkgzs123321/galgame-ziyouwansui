<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
洛书与阵法起源:
  时间: 约六千年前
  事件:
    - 洛水里浮出一头神龟，龟背上的点阵就是洛书，云秦人照着它解开了十二金人身上的奇门阵法
    - 云秦法阵不吃魔力，只在不同方位各摆上一件东西，禁锢的力量就出来了
    - 阵眼是布阵者自己的秘密，旁人无从得知
    - 全铜的宝塔是关犯禁者的牢，塔底水窖里就埋着禁锢法阵
  后果:
    - 云秦法阵走出一条不靠魔力的路，与爱琴的元素魔法各成体系
    - 阵眼只由布阵者一人掌握，法阵从此带上独门秘技的性质
  对当前格局的影响:
    - 外人即便夺走法阵部件也解不出用法，破阵须先找出阵眼
    - 云秦后裔只能照阵眼摆阵，摆不出的法阵等于失传

云秦荡平六国:
  时间: 云秦开国之初
  事件:
    - 云秦出兵把六个最大的人类国家一一扫平，又沿着北疆垒起一道长约一万里的城墙
    - 云秦的疆域大到能与海中国度相提并论，水军里当兵的多是水族战士
    - 开国那几年，云秦曾一次坑杀数十万人，帝王待下刻薄寡恩
    - 云秦的方士自小练的就是炼铅化汞，靠一手房中秘药讨君王欢心
  后果:
    - 方士看明白了，再大的本事与再超越时代的创举，一样能被推上断头台
    - 方士把立身的本事放在延寿与阵法上，不以伤害人的魔法为目的
  对当前格局的影响:
    - 方士一脉从此以丹药与阵法傍身，从不把身家性命交给君王的恩宠
    - 东方修行体系由此与爱琴分道，丝绸大陆来往靠云系道具腾空，始终没走出跨地域的魔法传送阵

十二金人铸成:
  时间: 云秦全盛期
  事件:
    - 云秦始皇帝把六国的青铜兵器搜罗一空，一炉熔了铸成十二尊斋殆金人
    - 金人立起来有十米高，一尊重达二十四万磅，驱动力来自方士那套奇门遁甲与水银符箓
    - 金人身上伤痕累累，水银符箓浮在表面游走，动作又慢又沉
    - 十二尊金人之外另有一路挂甲金人，是十米高、重二十四万磅的黑曜石魔像，膝肘关节闪着金光
    - 十二尊金人的启动咒语只由方士一族执掌，扳指平时锁在方士手中
  后果:
    - 云秦凭这套陆战武器镇住刚被荡平的六国旧地
    - 方士一族靠金人的咒语与阵眼在帝国里立住脚跟，帝王对他们始终既用且防
  对当前格局的影响:
    - 十二尊金人到今天只余四尊，另外八尊都在往年的远航途中损毁
    - 爱琴的魔偶多是木胎土胎石胎，个头远比不上斋殆金人，金属附着力也差

七宝塔圈饿书儒:
  时间: 云秦统一丝绸大陆之后
  事件:
    - 铸完十二尊金人，剩下的铜汁又拿去起塔，塔身通体是铜，分镇天下九州
    - 为除掉最能打的书儒武士，云秦暴君让方士在塔底布下禁锢法阵
    - 立过战功的武士被诓进地宫，说是领赏，实际被关在里面活活饿死
    - 替云秦出过死力的东方比蒙书儒，被始皇帝与二世两个暴君灭了个干净，多半是烧死或坑杀
    - 麋人与蚕人手艺好、既不能打又没有桀骜脾气，被暴君手下留了情
  后果:
    - 书儒是丝绸大陆的叫法，换成爱琴通用语就是比蒙，东方比蒙这一脉从此断了根
    - 七宝塔的地宫成了云秦方士阵法留存最完整的地方
  对当前格局的影响:
    - 七宝塔地宫的九宫数独阵比八门金锁阵更高一级，连声音与闪烁瞬移都被圈禁
    - 白素青自囚七宝塔地宫水窖五百年，靠蛇蜕术才脱身

方士的营生与红铅:
  时间: 云秦时代
  事件:
    - 云秦方士自号生命的礼赞者，最拿手的是奇门阵法与续命的法术
    - 替君王炼铅化汞之外，方士还秘制宫廷催情药红铅，缺了催情极品的巨型海马便配不出来
    - 一年到头也炼不出几颗红铅，采药与炼制两头的折损都得算进去
    - 要是连巨型海马这类催情至宝都弄不到，十年也未必开得了一炉
  后果:
    - 巨型海马与各类催情至宝成了云秦皇室的专供物资
    - 方士的丹药与阵法一样，都靠独门配方维持身价
  对当前格局的影响:
    - 红铅落到云秦后人手里仍是拿得出手的筹码，福格森.徐靠它算计过刘震撼
    - 摩韶族蚌人、巨型海马一类药材的产地因此成了方士必须走通的路

船队纵横七海:
  时间: 云秦船队出海时期
  事件:
    - 云秦船队走遍七海，沿途替海中国度用法阵困住为害一方的超阶魔兽
    - 卡帝乐族扬子鳄武士在船队里当水军护卫，凭自己的勇武跟所有海族立了约
    - 潘塔族熊猫武士的先人也跟着船队出海，充当护卫
    - 潮汐领主革瑞恩与九头蛇怪许德拉被云秦方士用八门金锁阵镇住，一困就是一千五百余年
  后果:
    - 当年船队所到之处海族不敢刁难，卡帝乐的威名至今还刻在海族的摩崖上
    - 海族给革瑞恩与许德拉封了神使的名号，一年贡上一次虫人充饥
  对当前格局的影响:
    - 时光过去太久，那些海族国度在互相吞并之后已经不认这笔旧账
    - 蓬莱号的船首仍镶着象征契约的卡帝乐鳄鱼撞角，成了那场盟约唯一的凭证

蚌人归附与离水玉佩:
  时间: 云秦船队纵横七海之后
  事件:
    - 方士把阵法刻进玉佩，摩韶族蚌人戴上便不必再回水里过活
    - 摩韶族的男子要等有了子嗣才拿得到探骊取珠的种族异能，女子生来就有
    - 摩韶族的妇人一向老蚌怀珠，四十岁以前怀不上孩子
  后果:
    - 摩韶族自此与云秦旅人绑在一起，蚌人与美人鱼一样濒临绝迹
    - 篆刻离水阵法的技艺只留在那几块玉佩上，阵法随后失传
  对当前格局的影响:
    - 无人能再造离水玉佩，摩韶族仅存的那一块成了绝版之物
    - 凝玉摘下玉佩换钱买粮，那块玉佩因此有了被赎回来的价值

寻药船与千年漂流:
  时间: 云秦末年
  事件:
    - 云秦天子的旨意摆在那里，寻不到长生不老的仙药，谁也别想回故土，三千童男童女就这么跟着方士上了船
    - 这批寻药人的后代只能在澈桑大陆安家，隔上五十年仍旧派一船使者出海问药
    - 云秦旅人中只有方士研习和制作云秦法阵，是旅人的领导
    - 云秦后人在澈桑大陆立起长老会，由四位方士长老主持
  后果:
    - 云秦后人为此漂流千年，寻药从王命变成族规
    - 上船的孩子原本只当是献给海神的祭品，护送的卡帝乐武士为这条航线填进去无数性命
  对当前格局的影响:
    - 长老会派遣福格森.徐任寻药船全权负责人，把定药与开矿的算盘打到爱琴
    - 云秦旅人每到一处先找药材与矿脉，与东道主的冲突由此而起

阵法失传:
  时间: 云秦覆灭之后
  事件:
    - 云秦一朝覆灭，方士阵法多半湮没，后人里最强的也只学到七星系列以下
    - 最先出海寻药的那代方士留下一部秘密笔记，只传长房，各大著名阵眼都记在里面
    - 丝绸大陆上如今没有云秦这个国家，最强盛的名号归了唐藏帝国
  后果:
    - 云秦时代的阵法只剩遗存，后人只能照着阵眼摆，摆不出的一律失传
    - 唐藏的官方炼金术士朔士靠挖古墓、整理古云秦方士文化重建职业，主业却已变成烧汞炼铅
  对当前格局的影响:
    - 四位云秦后裔方士只会七星以下阵法，破九宫数独阵须靠福格森.徐随蓬莱号送走的秘密笔记
    - 古阵法大范围失传之后，唐藏朔士那一摊法宝营生只能退居其次

<%_ if (chap >= 31) { _%>
安尔乐法阵入海族:
  时间: 主角穿越后，海陆大战之前
  事件:
    - 丝绸方士福格森.徐替海族造出安尔乐离水法阵，一加持便撑起罩住整座城市的超大型离水结界
    - 这套法阵占地百来个平方，重达数吨，平时得有专门的卫队负责藏匿与搬移
    - 海族军队靠它摆脱出水一个小时的死限，才能在陆地上大举推进
  后果:
    - 海族筹划半年后与亚力士海国联合入侵爱琴，登陆战从添头变成主攻
    - 法阵一旦溃败被冲垮，上岸的海族战士成片窒息而死，这是他们最致命的弱点
  对当前格局的影响:
    - 海族登陆的命脉握在一名云秦后人手里，这份技艺成了左右战局的砝码
    - 夏宫武士把缴获的离水结界法阵纳入腰包，海族的死穴从此摆在明面上

