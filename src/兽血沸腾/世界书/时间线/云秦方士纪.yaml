<%_ if (chap >= 43) { _%>
云秦余脉入爱琴:
  时间: 主角成为翡冷翠领主前后
  事件:
    - 福格森.徐以蓬莱号与一枚血玉扳指作价，二十名潘塔武士宣誓效忠刘震撼
    - 刘震撼坐下来跟四位方士长老谈云秦旅人的去留，肯加入翡冷翠的不到两千人，多数云秦后裔选择回乡
    - 唐藏亲王把云秦后裔寻药旅人安置在梵宇
    - 云秦年间的丝绸大陆上还有人数很少的金发人种，肉搏功夫出众，惯用弹爪
  后果:
    - 云秦血脉在爱琴留下一支，熊猫武士与云秦法阵一起进了翡冷翠
    - 金发人类因天生厌水晕船，当年未被方士出海寻药时带走
  对当前格局的影响:
    - 血玉扳指内藏一尊云秦金人，咒语仍只有方士一族掌握
    - 刘震撼把斋殆扳指押上花廷的赌桌，云秦金人由此进入爱琴的权力交易
<%_ } _%>
