<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
神魔大战的龙骑规模:
  时间: 约一万年前
  事件:
    - 一万年前的神魔大战中，龙骑士与龙祭祀的数量不少于一百位
    - 龙族没有直接参战，却有许多巨龙甘心成为勇士的座骑一起抵御魔族侵略者
    - 一万年前击败魔族的主力是比蒙的水军、空军、龙骑士、龙祭祀、战争巨兽祭祀与召唤亡灵大军的阿拉贡
    - 魔族是紫发银瞳的种族，理论寿命恰为一千年
  后果:
    - 龙骑士与龙祭祀成为传说和神话中才应该出现的英雄
    - 一万年前那个时代所有智慧种族都保留了大量的空军编制
  对当前格局的影响:
    - 巨龙的骄傲闻名遐迩，只有最高贵的勇士才可以得到他们的亲睐
    - 人类遗留下来的龙骑士手札记载，龙骑士在飞跃海洋的时候发现整个世界的海洋远比陆地宽广

海加尔空战:
  时间: 约一千年前
  事件:
    - 一千年前决定大陆主人归属的海加尔战役中爆发过一场惨烈的田纳西空战
    - 海加尔战役中比蒙一方的龙祭祀与龙骑士总共只有十一位
    - 华伦泊尔蝙蝠人临阵变节，鸟族比蒙被人类龙骑士、狮鹫骑兵部队与蝙蝠叛徒三面夹攻而彻底灭绝
    - 比蒙唯一的天生灵魂歌者刚进阶战争祭祀，拥有一条龙作魔宠，是比蒙历史上唯一的龙骑祭祀，最终在与人类十位龙骑士的对阵中战死
  后果:
    - 博得族鸟族变得仅剩两支，高傲的斯迈族天鹅人与奥斯崔特鸵鸟战士
    - 一千年前田纳西空战之后，人类和比蒙的空中部队集体退出了历史舞台，至今没有大规模重建
  对当前格局的影响:
    - 组建空中部队花费巨大却没有太多实战用途，这条账各国至今没有算清
    - 被放逐到地底一万多年的堕落精灵战斗习惯仍停留在一万年前

柯奇士的生命礼赞:
  时间: 约一千年前，海加尔战役中
  事件:
    - 千古第一龙祭祀柯奇士在自己的风系巨龙赫斯基战死时爆发生命礼赞的祝福
    - 生命礼赞可以把巨龙的生命精华转移给他人，代价是巨龙自身肉体的死亡
    - 那次祝福使一条原本属于人类龙骑士坐骑的火系巨龙产生了心灵契约的转嫁
    - 柯奇士以一己之力格杀了三位人类龙骑士
  后果:
    - 龙祭祀这条路径在比蒙一侧彻底断绝，此后千年再没有出现第二位
    - 心灵契约可以从一个主人转嫁到另一个主人，巨龙的归属并非不可更改
  对当前格局的影响:
    - 龙祭祀一脉在战后断绝，比蒙再没有出现过拥有一条龙作魔宠的祭祀
    - 刘震撼的龙宠战死后，血之祭奠让龙力嫁接于他，他成为亚龙祭祀

空中部队的空白:
  时间: 海加尔战役后
  事件:
    - 祭祀的假想敌并不是面对自己的比蒙祭祀，万一对手是一个人类龙骑士，人家在空中有一百种办法可以玩死祭祀
    - 禁空之歌能使空气突然产生束缚力，让依赖空气飞翔的飞鸟从高空坠下摔死，但无法束缚巨龙
    - 龙骑士最主要依靠座下龙兽强大的魔法和物理攻击力，格斗并不依靠那七米长的超重龙枪
    - 圣保罗教廷一共就两名龙骑士，放眼整个爱琴大陆最最强盛的几十个人类国度，总共只有五十几个亚龙骑士和两个龙骑士
  后果:
    - 人类世界三大龙骑士和两大圣奇奥魔法师只代表外界知道的强者
    - 爱琴大陆幅员辽阔，隐居避世的强者也不在少数
  对当前格局的影响:
    - 比蒙祭祀面对人类龙骑士时只能靠地面手段应对，制空权长期空缺
    - 比蒙一侧能上天的只剩两支鸟族比蒙，编制小到不足以编成军团

<%_ if (chap >= 73) { _%>
三位龙骑士压境:
  时间: 主角崛起前后
  事件:
    - 人类世界三名龙骑士先后在多洛特与翡冷翠登场
    - 龙骑士兰帕德与飞马圣骑士托马西赶到多洛特战场，中毒的壹条以鹤语魔法和脱羽箭雨重创金龙与飞马后返航
    - 龙骑士加茜娅自报宝剑橡叶圣骑士团副团长并挑战刘震撼，刘震撼定下输赢都能带走贞德、输了教廷还须答应他一件事的赌约
    - 壹条抽出星辰精钢狼牙棒几棒砸晕白色风龙，人类世界三名龙骑士全部败于翡冷翠领主
  后果:
    - 刘震撼在此战中成为天下第一，比蒙佣兵远远低唤他为天王祭祀
    - 巨龙被洞穿，死亡领主的戒指易主，人类阵营集体被石化
  对当前格局的影响:
    - 人类世界的三名龙骑士全部败于翡冷翠领主，各国对这支领地的空战能力重新估算
    - 刘震撼赢下赌约带走了贞德，教廷还欠他一个承诺

慕兰双龙骑:
  时间: 主角崛起前后
  事件:
    - 慕兰帝国共有两位龙骑士
    - 其中一位已被刘震撼干掉
    - 另一位沙蜥骑士胡迈德.法克赫尔实为沙系巨龙骑士，兼任王都禁军帕夏
    - 慕兰帝国是第一个摸索出幻兽作战方式的国家，用阿訇以菠萝密药丸节魔
  后果:
    - 慕兰帝国只剩一名沙系巨龙骑士撑起空中威慑
    - 慕兰的幻兽骑士团与飞蜥骑士成为龙骑士之外的替代方案
  对当前格局的影响:
    - 慕兰帝国的幻兽骑士规模远超龙骑士，沙漠方向的空中威胁来自幻兽而不是巨龙
    - 慕兰王国对龙骑士的依赖降低，把资源转向菠萝密药丸与飞蜥骑士的扩编

<%_ } _%>
巨龙拒绝签约:
  时间: 海加尔战役后至今
  事件:
    - 海加尔战役之后空中部队集体退出历史舞台，龙骑士的数量再没有恢复到战前
    - 大陆巨龙不满两百头，与两龙城有往来的仅十七头
    - 骄傲的巨龙不再愿意与人类签下契约
    - 龙骑士已衰落，巨龙并非一视同仁地亲近人类
  后果:
    - 全爱琴的人类诸国合计仅两个龙骑士，龙骑士一职无法靠新契约补充
    - 龙骑士的席位只能靠旧日契约与遗物延续，损失一位就少一位
  对当前格局的影响:
    - 巨龙贪婪，只对金属与宝石感兴趣，人类的金银换不来一头龙的效忠
    - 龙族是魔法免疫不错，但只是同系魔法全免，旁系魔法不能免

<%_ if (chap >= 73) { _%>
替代兵种的兴起:
  时间: 主角崛起前后
  事件:
    - 庞贝帝国没有龙骑士，靠骏鹰骑士与破魔弩箭对抗圣弗郎西斯科帝国的龙骑士
    - 圣弗郎西斯科帝国以四百年积攒的秘银战甲武装白银基座战甲部队，还有二十人编制的电隼骑士
    - 刘震撼给牛顿空骑兵讲解自编空战战术，又谋划用多普勒射线改造基头座龙为幻兽
    - 教廷龙骑士与普斯卡什、七彩龙伊布、仙女龙伦娜先后离开，或回国通报或重排龙城部署
  后果:
    - 各国用骏鹰、幻兽座龙与亚龙填补巨龙留下的空中空缺
    - 龙骑士在编制上仍是各国的最高战力象征，人数却再难增长
  对当前格局的影响:
    - 空中部队重建的账重新被各国摆上桌面
    - 堕落精灵在雪山脚下新开辟的城市拥有数量惊人的空军，两位教廷龙骑士奉命顺路观察且绝不可与之接触
