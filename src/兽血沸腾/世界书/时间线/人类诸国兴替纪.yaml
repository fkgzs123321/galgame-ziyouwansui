两大帝国的对峙:
  时间: 主角崛起前后
  事件:
    - 庞贝帝国和圣弗郎西斯科帝国撕破脸皮，准备开战
    - 导火索在多洛特，现任大公德鲁伊艾尔.皮耶罗重病垂危，两个已出嫁的女儿各自支持托蒂
    - 教廷调解后双方由一触即发转为对峙谈判，约定只打常规战争
    - 刘震撼献十九头巨龙换两大帝国一年停战
  后果:
    - 龙骑士兰帕德与飞马圣骑士托马西赶到沙巴克
    - 人类十位高层密议屠灭卢塞恩，庞贝学者克林斯曼指卢塞恩是全木城池又紧邻针叶松林，力主火攻
  对当前格局的影响:
    - 多洛特公国的内战把庞贝、教廷与圣弗郎西斯科三股势力同时卷了进来
    - 依附两大帝国的小国被迫选边，卡瑞姆多大平原上的军援与征兵同时加码
