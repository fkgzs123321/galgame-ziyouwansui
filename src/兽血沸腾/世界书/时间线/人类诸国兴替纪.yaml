<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
芒克自立门户:
  时间: 远古，比蒙王国立国之后
  事件:
    - 人类是比蒙兽人中的芒克族猴人自立门户而来，脱离比蒙已久
    - 芒克族曾负责比蒙魔法师工会的事务，后来自立军队、划地而治
    - 芒克族与比蒙决裂后改称人类，比蒙视人类为信奉异端邪教的叛出同族
  后果:
    - 人类自诩神的后代，不再承认这段由猴人进化而来的历史
    - 人类神甫与特蕾莎嬷嬷都不会召唤魔宠，与比蒙祭祀已分属两途
  对当前格局的影响:
    - 人类与比蒙的世仇从分裂的那一天起就写在教义与史书里
    - 人类诸国之间的征伐从不影响他们对兽人的一致仇视

海加尔战后分裂:
  时间: 约一千年前，海加尔战役后
  事件:
    - 海加尔战役后人类已经分裂成大大小小数十个国家，牢牢占据着爱琴大陆
    - 圣弗郎西斯科帝国与庞贝帝国同属古代耶斯特人类大帝国的分支
    - 大多数人类国度都极为仇视比蒙兽人
  后果:
    - 数十个国家之间没有共主，结盟与开战都由各国王室自行决定
    - 比蒙与人类隔着多瑙大荒原长期对峙
  对当前格局的影响:
    - 多洛特公国是与比蒙王国接壤的人类国度，隶属于圣弗郎西斯科帝国
    - 人类诸国之间没有共同君主，任何一国都能单独与比蒙做交易

耶斯特帝国遗产:
  时间: 海加尔战役后
  事件:
    - 圣弗郎西斯科帝国与庞贝帝国同属古代耶斯特人类大帝国的分支
    - 圣弗郎西斯科帝国霸占着卡瑞姆多平原大部分地区，是爱琴大陆最大的产粮地
    - 庞贝帝国地处雷霆山脉，矿产丰富，是标准的维京人种，民风彪悍
  后果:
    - 两大帝国各自继承旧帝国的不同家底，一个握粮仓，一个握矿脉
    - 卡瑞姆多大平原成为人类诸国的粮仓与战场
  对当前格局的影响:
    - 圣弗郎西斯科帝国与庞贝帝国是爱琴人类的两大强国
    - 古代耶斯特大帝国的名号被两大帝国同时借用，谁都不肯让出正统

<%_ if (chap >= 73) { _%>
秘银矿与基座战甲:
  时间: 四百年前
  事件:
    - 圣弗郎西斯科帝国四百年前发掘出一个巨大的秘银矿
    - 白银基座战甲是天才炼金术士迈克.乔丹大师的构思，将秘银炼化后浇铸在钢甲表面
    - 战甲利用秘银的储魔属性篆刻风系魔法阵减低自重，再以金属契合法阵与星云魔法阵吸取天然魔力
    - 白银基座战甲重达两百磅，一千套战甲耗费秘银一千多磅
  后果:
    - 白银基座战士总共是一个联队的编制，每个战士都是精挑细选的彪形壮汉
    - 这套战甲成为圣弗郎西斯科帝国积攒四百年的御林军
  对当前格局的影响:
    - 白银基座战士用对抗重骑兵都能稳操胜券，好色亲王张伯伦把面首军团当作宠儿
    - 秘银战甲在战场上会被歼获，一百套战甲曾落入翡冷翠手中

<%_ } _%>
骏鹰骑士诞生:
  时间: 数百年前
  事件:
    - 庞贝帝国没有龙骑士，圣弗郎西斯科帝国拥有一名龙骑士
    - 骏鹰是狮鹫和母马结合之后产下的飞行魔兽，性情比野生狮鹫容易驯化
    - 庞贝骏鹰骑士自诞生之日起就带着对抗圣弗郎西斯科帝国龙骑士的使命
    - 骏鹰骑士每人配备一匣破魔弩箭，箭上有庞贝帝国炼金魔法师特制的魔法阵，可以破开坚硬的龙鳞
  后果:
    - 人类历史上曾有狮鹫部队，如今连狮鹫骑兵发源地的人类王国也已失传驯育狮鹫的方法
    - 庞贝帝国总共只有五十名骏鹰骑士和十名宫廷魔法师
  对当前格局的影响:
    - 骏鹰斥候是庞贝插手多洛特事务的先锋
    - 破魔弩箭在多洛特战场上被用来射杀骑乘飞行兽的斥候，箭上浸过人面蜘蛛毒腺

<%_ if (chap >= 73) { _%>
钢铁魔偶与精金:
  时间: 数百年前
  事件:
    - 钢铁与魔法的契合性极差，只有庞贝帝国这类挖掘到精金矿脉的国家能用精金在钢铁魔偶表面镀上附着面制造钢铁魔像
    - 钢铁魔偶由块垒状的钢铁拼装而成，用精金绘制金属法阵，每尊铆钉上万颗，双手是一把锋利的大剪刀
    - 庞贝帝国共有十六尊钢铁魔偶，与庞贝帝国君主同名，被称作剪刀手爱德华
    - 第二代改良型魔像开膛手黑杰克摈弃巨型剪刀改用霸王型链锯，整重十五吨，共有四尊
  后果:
    - 在炼金术士普遍只能拥有石偶的时代，钢铁魔偶在战场上无人可当
    - 庞贝帝国是拥有炼金大师艾马尔与精金矿脉的炼金强国
  对当前格局的影响:
    - 刘震撼手上拥有四尊剪刀手爱德华残骸，以交出一尊供圣弗郎西斯科帝国研究为条件换取罢兵
    - 庞贝已出动四尊开膛手黑杰克，钢铁魔偶的机密开始外泄

<%_ } _%>
慕兰吞并十七国:
  时间: 三百年前起
  事件:
    - 塔克拉玛戈大沙漠中大小国度分裂吞并、战争杀戮永不停歇
    - 慕兰帝国是三十六国中最强盛者，三百年间吞并了十七个小国
    - 慕兰商团四百年前便开始潜入比蒙境内掳掠美女
    - 沙漠通用语中把比蒙称作勃泥
  后果:
    - 沙漠诸国的边界不断向比蒙一侧推进
    - 慕兰帝国与比蒙王国成为爱琴大陆上最直接的两个对手
  对当前格局的影响:
    - 比蒙全国只有六百万人口，慕兰帝国人口近两千万
    - 慕兰帝国原有两位龙骑士，沙蜥骑士胡迈德.法克赫尔实为沙系巨龙骑士

三大军事强国:
  时间: 近百年来
  事件:
    - 爱琴三大人类军事强国是圣弗郎西斯科帝国、庞贝帝国和东海岸的圣荷西帝国，军援计划由它们负责统筹
    - 爱琴大陆的军事强国如圣弗郎西斯科帝国与庞贝帝国，宫廷魔法师数量不过十位左右
    - 算上魔法学徒与见习法师也不会超过三四十位
    - 爱琴大陆的活火山集中在庞贝帝国境内的火鹘山脉，大大小小一共十来个，百来年就会喷发一次
  后果:
    - 庞贝帝国是拥有炼金大师艾马尔与精金矿脉的炼金强国，圣弗郎西斯科帝国是拥有斯蒂法诺大师的魔法强国
    - 人类二十三国家各自手握神器，组成松散联盟
  对当前格局的影响:
    - 冰雪女神教盘踞庞贝，以庞贝帝国为首，另有六个人类国家供奉冰雪女神海菲丝
    - 人类诸国向比蒙恳请祭祀助战并争购战歌图腾柱与幻兽改造技术

