<%_ const chap = getvar('stat_data.剧情.章节序号', { defaults: 0 }); _%>
帝梵西永久领地:
  时间: 约一千年前，海加尔战役后
  事件:
    - 海加尔战役后人类的信仰发生很大改变，强大霸道的圣保罗教排斥异教，大肆发动十字军护教征战
    - 圣保罗教将其他教派基本上从各个人类国家一扫而空
    - 帝梵西是海加尔时代由神圣帝国同盟划拨的永久领土，位于卡瑞姆多最富饶的伏门尔加河流域
    - 帝梵西占地面积仅有一百二十亩，是典型的袖珍型领土，世俗称之为神之领土
  后果:
    - 教廷在人类诸国之上取得了一块不隶属任何王室的直辖地
    - 爱琴大陆的贵族血统讲究古老谱系，圣地帝梵西教堂按血统排座
  对当前格局的影响:
    - 教廷设于帝梵西城，城中的圣女专门负责看顾圣火
    - 圣女穿白色长袍，在整座城里非常受人尊崇并拥有很多特权

苦行僧侣被钉死:
  时间: 海加尔战役后
  事件:
    - 苦行僧侣是人类宗教中以刻苦修炼与风餐露宿锻炼意志的派别，掌握祷告抚慰之光
    - 海加尔战役中随队出征僧侣的祷言庇佑与牧师的圣光治疗术让许多受伤垂危的战士重新投入战场
    - 圣保罗教以传播异端的罪名用十字架钉死苦行僧侣，残余者漂流修行
    - 圣保罗教把苦行僧的流浪说成异端应有的下场，借此警告其余派别
  后果:
    - 人类诸国的宗教派别只剩圣保罗教一门
    - 苦行僧残余者漂流到人烟罕至的地方继续修行
  对当前格局的影响:
    - 圣保罗教与冰雪女神教均设有暗黑裁决执事编制，专门赶赴各地消灭不死生命
    - 圣保罗教廷与冰雪女神教为对付带有亡灵特性的冥界生物，与比蒙神庙破天荒坐到一起

天使十二音阶:
  时间: 海加尔战役后
  事件:
    - 人类圣保罗教廷的圣诗又被称为天使的十二音阶，一共只有十二首
    - 比杀专用的比蒙战歌少了很多
    - 天使的十二音阶中一部分是剽窃比蒙战歌的饶舌版本，另一部分是人类的原创
    - 教廷的圣诗与比蒙的战歌同出一源，只是吟唱方式上有所改变
  后果:
    - 比蒙祭祀与圣保罗神甫同属歌唱系魔法，战歌却无法像人类魔法师那样撑起防护结界
    - 爱琴大陆的神庙战歌中本没有盐霜护甲之歌与荆棘护甲之歌，后者的原型是教廷神甫用于神圣护甲的荆棘之光
  对当前格局的影响:
    - 教廷的神圣法术和比蒙祭祀的战歌一样都是标准的辅助型手段，不具攻击性
    - 教廷宣称神圣法术是比蒙邪恶战歌光环的克星，圣保罗教廷的记载中留有亚特兰蒂斯文明的说法

两支教会武装:
  时间: 数百年前
  事件:
    - 人类圣保罗教廷拥有金棕榈骑士团和宝剑橡叶骑士团两支教会武装
    - 比蒙五大神庙加起来的圣殿骑士只有两百人
    - 圣保罗教廷权势滔天，拥有剑袍骑士、圣堂、神甫与牧师，圣堂装备都是魔法装备
    - 圣殿骑士是比蒙最强的勇者，经过残酷的试炼才能选拔出来
  后果:
    - 军事力量的差距让教廷在人类诸国中取得仲裁者的位置
    - 比蒙的圣殿骑士唯一的对手是人类圣骑士与传说中的魔族死亡骑士
  对当前格局的影响:
    - 教廷从比蒙武士中选拔圣堂部队的计划已经摆上桌面
    - 比蒙神庙的官方武装每个神庙仅四十人编制，只能靠荣誉骑士与权杖骑士扩编

<%_ if (chap >= 43) { _%>
两位教廷龙骑士:
  时间: 数百年前至主角崛起前后
  事件:
    - 圣保罗教廷一共就两名龙骑士，黄金龙骑士兰帕德与碧玉龙骑士加茜娅
    - 兰帕德是剑袍骑士，加茜娅自报宝剑橡叶圣骑士团副团长
    - 加茜娅佩带死亡领主护盾，六面笼罩黑色雾气、凸着昙花纹与骷髅头的黑色晶盾
    - 死亡领主护盾能抵挡好几十个高阶魔法，是教廷收藏的两件死亡领主遗物之一
  后果:
    - 两位龙骑士是教廷对外施压的底牌，奉命先行赶往庞贝
    - 教廷空骑士不足百人，剿灭数千蝙蝠人必须借调翡冷翠航空兵
  对当前格局的影响:
    - 兰帕德与加茜娅先后赶到沙巴克，教廷的意志直接送到比蒙王都
    - 两位龙骑士顺路观察雪山脚下堕落精灵新开辟的城市，且绝不可与之接触

