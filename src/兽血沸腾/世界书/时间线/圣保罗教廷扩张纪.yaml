神迹降生的圣子:
  时间: 主角崛起前后
  事件:
    - 圣保罗教崇尚神祗唯一论，至高神保罗使一位虔诚信教的人类处女不婚而孕，在冬日马厩中诞下圣子扫罗
    - 圣子诞辰成为人类第一大节日约斯特雷节
    - 小修女贞德身为候补圣女却驱使亡灵战士，在教义上属于骇人听闻的禁忌
    - 加茜娅与兰帕德宣称贞德处女怀孕是神迹，孩子是圣子，李察只能做圣子养父并获圣李察主保头衔
  后果:
    - 教廷欲将贞德所怀之子认定为神迹降生的圣子
    - 刘震撼最终认下孩子，还盘算借教廷之力建翡冷翠圣母院
  对当前格局的影响:
    - 贞德的身份把教廷教义与比蒙战歌体系绑在一起
    - 教廷的圣子认定若成立，比蒙神庙在神权层面将被彻底压过一头

圣阶陨落与帝梵西血洗:
  时间: 主角崛起前后
  事件:
    - 教皇保罗.马尔帝尼详述帝梵西遭三大恐惧魔王等魔族突袭
    - 圣奇奥魔法师普斯卡什率众阻击掩护突围，教廷传送阵遭干扰光波破坏，抵达者仅十八人
    - 圣阶法师普斯卡什大师陨落
    - 教廷一行人逃入黑幕笼罩的翡冷翠，小鹦鹉马特拉齐以龙语魔法与火中取栗痛击魔族追兵
  后果:
    - 教廷第一次在自家首都被魔族打穿，帝梵西遭血洗
    - 教皇向圣主保李察求助，教廷与翡冷翠的地位发生倒转
  对当前格局的影响:
    - 教宗布拉特亲临威瑟斯庞斗兽场观战，又率神殿骑士团与夏宫卫队会师
    - 教廷与比蒙神庙在共同敌人面前破天荒坐到一起，两派宗教武装暗中较劲
