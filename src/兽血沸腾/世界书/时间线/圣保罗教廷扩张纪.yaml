剿杀蝙蝠人:
  时间: 海加尔战役后至今
  事件:
    - 华伦泊尔族是海加尔战役中叛变到人类阵营的比蒙蝙蝠人
    - 战后华伦泊尔族被圣保罗教廷宗教裁判所冠以吸血鬼之名剿杀
    - 纯血的蝙蝠人如今已经很少，即使是混血也一直被圣保罗教廷缉捕
    - 兰帕德代表教皇与圣弗郎西斯科大帝借调翡冷翠航空兵剿灭多洛特公国的蝙蝠人
  后果:
    - 教廷正设法抹平剿杀蝙蝠人带来的不良影响
    - 残余的蝙蝠人退入多洛特公国，托蒂伯爵现出华伦泊尔族原形
  对当前格局的影响:
    - 教廷借剿杀之名清理异己的先例，让比蒙神庙对教廷的介入保持警惕
    - 多洛特公国的蝙蝠人还没有清干净，教廷的手已经伸到多瑙荒原边上

竹子与翡翠树:
  时间: 近十几年
  事件:
    - 爱琴大陆并不产竹子，近十几年才有海外商人把竹子带来
    - 目前只有圣保罗教廷所在地帝梵西城才有少量种植
    - 人类教皇给这种植物起的爱琴名字叫做翡翠树
  后果:
    - 竹子成为教廷领地独有的物产，外界只在帝梵西城能见到少量种植
    - 这种植物的爱琴名字由人类教皇亲自定下，也叫翡翠树
  对当前格局的影响:
    - 海外商人用竹子打通了与帝梵西城的往来，这是教廷与海外商路之间仅有的纽带
    - 爱琴大陆其他地方的竹子另有来路，与帝梵西城的种植分属两条来源

<%_ if (chap >= 43) { _%>
讨伐比蒙的战书:
  时间: 主角崛起前后
  事件:
    - 加茜娅抛出教廷即将讨伐比蒙王国，卡卡主教宣布正准备递交战书
    - 刘震撼当场认输求教廷施展神圣净化与神圣还原却被拒
    - 驸马府邸夜宴上果果一拳打掉红衣主教的牙齿，双方定下文斗与武斗
    - 刘震撼以交出一尊钢铁魔偶残骸换得圣弗郎西斯科帝国不支持教廷讨伐
  后果:
    - 比蒙王国与圣弗郎西斯科帝国在利益交换下由敌转友
    - 教廷的讨伐之战被化解，教廷失去了借助人类诸国围攻比蒙的机会
  对当前格局的影响:
    - 教廷想征讨比蒙王国的异教徒并把圣保罗教传播到世界每一个角落
    - 刘震撼用一具魔偶残骸换取帝国中立，比蒙从此多了一条直达人类宫廷的渠道

苍穹先知的推算:
  时间: 约一万年前至今
  事件:
    - 苍穹先知是与主祭平级的神庙正职头衔，已取消将近一万年
    - 哑月上一次出现是在一万年前，它影响了爱琴大陆的元素潮汐，导致魔族从时空裂缝大入侵
    - 教廷观星家推算哑月会在今年或者明年再次光临
    - 哑月的降落地点就在翡冷翠领地的桑干河之中
  后果:
    - 教廷的档案库里锁着一万年前神魔大战的全部秘密史料，只对教宗与枢机开放
    - 教廷对元素潮汐与魔族入侵的时间表掌握得比人类诸国更清楚
  对当前格局的影响:
    - 刘震撼要求教宗为茉儿准备苍穹先知的先知袍
    - 时空大裂缝在爱琴大陆有很多处，教廷的圣骑士与法师团每年都会剿灭一些潜入者

