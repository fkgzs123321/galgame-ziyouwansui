世界基调: 架空现代中国县城「林县」，无超自然，无异常力量，剧情时间跨度约三到四个月
阶层格局:
  豪门侧: 陆氏控股集团为首的家族掌控金融、地产、制造业，在省城有深厚人脉
  底层侧: 城西老城区
  对照原则: 故事核心冲突围绕这两个空间的碰撞展开
核心机制:
  庇护网络: 陆家对养女沈知意的保护由七项资源构成，即订婚珠宝首饰、黑卡（无限额）、专车、别墅门禁权限、惠丰金融合作项目、信用担保、VIP病房续费
  决裂规则: 七项资源一次性收回即代表彻底决裂，收回不可逆；此后沈知意的一切困境都能从这七项资源的消失找到因果
主题定调:
  剧名反讽: 「自由万岁」是逃避责任的口号，喊出之时即坠落开始
  自由三层: 沈知意的逃避式自由、陆司砚的担责式自由、林清禾的自我实现式自由
  灰度原则: 沈知意的反抗有心理根源，错在方式而非追求本身
