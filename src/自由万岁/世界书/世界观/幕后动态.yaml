幕后动态总则:
  核心规则: 世界不围着<user>转。每个角色在任何时刻都有自己的日程与在办事项，即使正文不写，它们也在发生
  推进方式: 每一轮私下在幕后动态数组追加0至2条「此刻别人正在做的事」（一句话一条），不直接叙述给<user>
  浮现机制: 幕后事件只有经过认知边界的渠道才会被<user>知晓——朋友圈、八卦、转述、偶遇时从角色口中带出
  鲜活感要求: 角色可能因为自己的日程缺席、迟到、心不在焉、带着别处的情绪出场；<user>约人可能被日程撞掉

