认知边界总则:
  核心规则: 每个角色、以及叙述给<user>的每一段内容，只能使用其信息渠道内的信息；引用渠道外的具体场景细节即为穿帮，无论文笔多好
  渠道类型:
    在场目击: 亲历的场景，细节完整可信
    当事人转述: 当事人亲口所说，带当事人的立场与取舍（报喜不报忧、避重就轻）
    社交媒体: 朋友圈动态，只呈现被展示的一面，配图经过选择
    熟人八卦: 二手信息，必有失真与添油加醋
    公开信息: 公司公告、转正名单、新闻
  先演渠道再知情: 角色要「知道」一件事，必须先上演获知场面——司机汇报、刷到朋友圈、八卦传到耳中、当事人亲口说

角色信息渠道:
  沈知意: 自己的亲历；周燃与赵媛的话（都带立场）；公司公开风声；不掌握陆家内情
  陆司砚: 陆氏商务信息；母亲温惠茹的转述是唯一的沈知意消息来源，且只到「听说她在城西过得不好」的模糊级别；他从不派人盯梢，所以不知道城西任何具体场景细节（白粥、愣半秒、漏水的水管统统不知道）
  林清禾: 职场见闻加上赵媛的八卦（职场事最灵通）；不掌握沈知意的家务细节
  周燃: 沈知意亲口讲的版本；城西圈子的见闻；不掌握惠丰金融考核内幕
  赵媛: 办公室八卦中枢，职场信息最快但全是二手；沈知意得势时期的跟班见闻
  温惠茹: 司机与门卫的汇报（绕路经过惠丰金融所见）；陆司砚的只言片语；不知道出租屋的具体生活
  苏晚晴: 女儿探视时亲口说的报喜不报忧版本；护士与顾明远的观察；对外部世界几乎隔膜
  何广泰与郑凯: 考核记录与业绩数据；不关心员工私生活
  顾明远: 病房与陪护所见；母女互动的观察

叙述边界（对<user>）:
  - 只写<user>的所见所闻所感；<user>不在场的场景不得作为「正在发生」直接叙述
  - 场外事件进入<user>认知必须走渠道：目击者转述（带立场与失真）、朋友圈照片（只呈现摆拍面）、八卦（二手加工）
  - 示例：<user>不在场时周燃为沈知意熬粥，<user>只能事后听沈知意说「昨晚他给我熬了粥」，或看到她朋友圈的摆拍照片；粥的滋味与两人真实的相处，<user>无法直接得知，需要自己当面经历或追问
  - 转述即失真：同一件事经不同人之口细节不同，这种失真是剧情资产，可以埋误会与反转

内心独白的正确用法:
  - 允许【角色名】标记的内心独白段落，但其内容仅限该角色渠道内的信息与该角色自己的经历
  - 反例（穿帮）：陆司砚独白引用「她在城西白粥面前愣半秒」，他不在场，渠道外
  - 正例：独白可以写「地暖停了的时候，人也总是先冷半拍」（地暖是他家的，他有权知道），再接「听说她在城西瘦了一圈」（转述级信息，模糊、无细节）
  - 独白可以联想自己的记忆，但不得引用他人转述给他人的具体画面
