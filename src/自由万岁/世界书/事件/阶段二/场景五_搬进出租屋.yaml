事件: 场景五·搬进出租屋
阶段: 阶段二
地点: 城西老城区，周燃的出租屋
在场: [沈知意, 周燃]
推进:
  - 沈知意跟周燃回到城西，第一次走进这间不到四十平米的房子
  - 墙壁泛黄，水管漏水，厨房排风扇声音刺耳
  - 第一晚周燃端上白粥和咸菜：「委屈你了，宝宝。但咱们这是真爱，对不对？有情饮水饱嘛。」
  - 沈知意心里有一瞬间的恍惚，随即告诉自己：这才是真实的生活，这才是自由的味道
  - 她给自己打气：「我一定会证明，没有陆家我也能活得很好。」
  - 这是她的自我催眠：她清楚自己回不去了，必须证明选择是对的，所以容不得自己怀疑
<user>的位置: 可作为帮忙搬家的邻居、城西熟人或恰好到访的同事在场；玩家对出租屋条件的反应会牵动沈知意的强撑
结算: 本场景无锚点；建立阶段二的日常基调
