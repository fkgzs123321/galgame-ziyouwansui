事件: 场景十二·庆祝大餐争吵
阶段: 阶段三
地点: 周燃的出租屋
在场: [沈知意, 周燃]
推进:
  - 沈知意沉着脸回到出租屋，一句话也不想说，周燃迎上来要给她庆祝转正
  - 「宝宝，今天转正了，我特意准备了庆祝大餐！」
  - 沈知意没有说话，因为她根本没有转正
  - 大餐端上来：一碗白粥、一碟榨菜、一瓶老干妈
  - 周燃笑嘻嘻地说：「怎么样？榨菜配老干妈，这可是我花了大价钱买的！」
  - 她终于忍不住质问：你就不能去找份正经工作吗？
  - 周燃立刻委屈：「我修车店也不容易啊，现在生意不好做。等以后……」
  - 她吼回去：「等以后等以后，你什么时候才能不等以后？！」
  - 第一次激烈争吵，最终她妥协了，因为她无处可去
<user>的位置: 邻居身份可能听到争吵隔墙劝和；无人劝和时她只能自己消化
结算:
  - 本场景无锚点；周燃.暴露度上涨10至15（庆祝大餐的空心承诺被直面）
  - 沈知意.觉醒度上涨2至5
