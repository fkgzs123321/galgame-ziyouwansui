事件: 场景十·客户全面流失
阶段: 阶段三
地点: 惠丰金融
在场: [沈知意, 郑凯, 客户（电话与上门）, <user>（若为员工身份）]
推进:
  - 沈知意去联络老客户试图挽回，客户纷纷要求停止合作
  - 四个原因：陆家已解除与惠丰金融的合作关系；她过往工作态度太差；她根本不了解客户需求；她给骗贷人员通过了审核（最严重的业务失误）
  - 郑凯递交通知：对她手上的客户进行重新分配，暂停关联客户权限
  - 她在公司实际上已经被边缘化
<user>的位置: 员工身份可能接手她流失的客户，或目睹她挨训；接手与接手的方式影响两人好感与办公室风向
结算:
  - 锚点「客户流失」写入世界.已触发锚点
  - 骗贷审核失误被高层记入职业档案，此后她求职都会被这一条卡住
