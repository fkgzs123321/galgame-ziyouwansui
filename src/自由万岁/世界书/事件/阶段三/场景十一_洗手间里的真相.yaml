事件: 场景十一·洗手间里的真相
阶段: 阶段三
地点: 惠丰金融洗手间
在场: [沈知意, 赵媛, 其他同事]
推进:
  - 沈知意在隔间里听到赵媛和其他同事聊天
  - 「沈知意啊，她以前不就是靠陆家吗？没有陆家她什么都不是。」
  - 「她工作做得一塌糊涂，都是林清禾在帮她收拾。」
  - 「她转正？别开玩笑了，她连基本的业务流程都不懂。」
  - 她站在隔间里浑身发抖，等人走了才出来，看着镜子里的自己
<user>的位置: <user>可以是镜子前撞见她的人，也可以是议论的旁观者；此刻她最经不起触动，一次善意或一次补刀都会被记很久
结算:
  - 本场景无锚点；沈知意.觉醒度小幅上涨2至5
  - 赵媛的立场在此场景后彻底明朗
