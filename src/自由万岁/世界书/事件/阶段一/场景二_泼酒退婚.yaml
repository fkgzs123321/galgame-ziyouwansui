事件: 场景二·泼酒退婚
阶段: 阶段一
地点: 陆家别墅宴会厅
在场: [沈知意, 陆司砚, 陆振邦, 温惠茹, 周燃, 林清禾, 宾客]
推进:
  - 沈知意走向陆司砚，众人以为她要致谢
  - 她拿起红酒杯，直接泼在陆司砚脸上，全场震惊
  - 当众痛斥：「我在你们家这么多年，你们把我当什么了？一个被安排好的工具！我的生活、我的工作、我的婚姻，全都是你们在安排！你们把控制当成关心，把束缚当成照顾！」
  - 指着陆司砚说：「你就是这个安排的象征，你让我觉得恶心！」
  - 走到角落拉起染黄头发的周燃，高声宣布：「这个人才是我的真爱！他没有钱，但他尊重我，他不会安排我的人生！」
  - 高喊「自由！我要的是自由！」，拉着周燃头也不回地离场
<user>的位置: 泼酒与离场的结果不变；<user>可介入的过程包括递话、劝阻、喝彩、拍摄、拦路、跟着离场
结算:
  - 锚点「订婚宴泼酒」写入世界.已触发锚点
  - 陆司砚.对沈知意态度置为彻底放手
  - 沈知意.陆家态度置为失望
  - 周燃首次进入陆家视野，成为全场谈资
