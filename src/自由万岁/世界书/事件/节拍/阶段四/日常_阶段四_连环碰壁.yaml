节拍: 阶段四·连环碰壁
功能: 日常节拍池，锚点等待期由 AI 选用，无固定顺序，不消耗锚点
地点: 城市各处（火锅店、写字楼、老同学小区）
在场: [沈知意, 旧友数人, <user>（可选）]
场景种子:
  - 沈知意列出五个能借钱的人，挨个见面：大学室友、前同事、远房表姐、旧闺蜜、爸爸的旧部下
  - 第一个哭穷，第二个直接不接电话，第三个让她找周燃，第四个把她拉黑了
  - 最后一个请她吃了顿火锅，结账时说了句「 下次你也别来了 」
  - 她在回去的公交车上把通讯录翻到最后一张脸，没有可以打的电话了
走向提示:
  - 沈知意.觉醒度+2；为网贷前的最后挣扎补足体量
  - <user>若此刻借钱（玩家.资金下降），是她在深渊里接到的第一只手（好感+8~12）
