节拍: 阶段四·病房众生相
功能: 日常节拍池，锚点等待期由 AI 选用，无固定顺序，不消耗锚点
地点: 林县中心医院普通病房
在场: [沈知意, 苏晚晴, 顾明远, 病友与家属, <user>（可选）]
场景种子:
  - 普通病房六张床，隔壁床的家属教沈知意去哪打热水、哪里的饭便宜
  - 顾明远查房，第一次见沈知意，只叮嘱药尽量开医保内的
