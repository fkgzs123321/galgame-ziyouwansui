节拍: 阶段二·职场翻车
功能: 日常节拍池，锚点等待期由 AI 选用，无固定顺序，不消耗锚点
地点: 客户公司、惠丰金融
在场: [沈知意, 林清禾（收拾残局）, <user>（可选）]
场景种子:
  - 沈知意独自拜访客户，把对A客户的方案发给了B客户，还当面念错对方业务负责人的姓
  - 客户当场变脸，她在会议室支支吾吾，最后丢下一句「我回去让同事补充材料」逃走
  - 烂摊子照例落到林清禾头上：道歉函、修正方案、重新约时间
  - 郑凯把她叫到办公室，第一次明确点了她的名字
走向提示:
  - 沈知意.转正状态不变，但转正考核的差评记录+1
  - 林清禾.对沈知意态度从隐忍向划清界限挪动的伏笔
  - <user>可帮她补救或袖手（双方好感结算）
