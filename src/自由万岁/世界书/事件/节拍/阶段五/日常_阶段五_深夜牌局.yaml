节拍: 阶段五·深夜牌局
功能: 日常节拍池，锚点等待期由 AI 选用，无固定顺序，不消耗锚点
地点: 城西牌桌（城中村出租屋）
在场: [周燃, 牌友, 沈知意（找上门）, <user>（可选）]
场景种子:
  - 周燃凌晨两点还没回家，沈知意按他牌友发的朋友圈定位找上门
  - 牌桌上烟雾缭绕，他面前压着的钱里有她昨天刚取的药费
  - 牌友们起哄「嫂子来了」，他头也没抬「最后一把，赢了就回」
  - 她没吵没闹，站在门口把那句话听完，转身走进夜里
  - 回去的路上她想明白了一件事：这个人救不了母亲，也救不了她
走向提示:
  - 周燃.暴露度+15~20（药费上牌桌是重大失信）
  - 沈知意.对周燃态度滑向名存实亡；觉醒度+3
