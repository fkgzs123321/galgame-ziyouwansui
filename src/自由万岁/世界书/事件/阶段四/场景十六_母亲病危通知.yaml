事件: 场景十六·母亲病危通知
阶段: 阶段四
地点: 林县中心医院
在场: [沈知意, 苏晚晴, 顾明远, 周燃（电话或在场）, <user>（若在场）]
推进:
  - 从陆家别墅失魂落魄离开时，医院来电
  - 「请问是沈知意女士吗？您母亲的状况非常不好，需要立即缴费进行抢救。我们之前打了几十个电话给您，您都没有接……」
  - 她打开手机：几十个未接来电，全部来自医院
  - 因欠费，母亲已从VIP病房转到普通病房，现在需要急救费
  - 她翻遍银行卡，陆家给的卡早已冻结；周燃说「我手上没钱」
  - 她去借了高利贷，付了急救费；利息逐月滚动，她算了算，不吃不喝也要还上好几年
  - 她追求「自由」的代价，第一次由母亲来承受
<user>的位置: <user>可以借钱给她、陪她守夜、垫付部分费用或帮她找正规渠道；这些行为降低债务数额并推动觉醒度，但病危本身不改写
结算:
  - 锚点「母亲病危」写入世界.已触发锚点
  - 沈知意.母亲病情置为病危抢救（缴费后视走向转入病情反复或脱离危险）
  - 沈知意.债务金额跳升至50000以上
  - 沈知意.陆家态度转为心碎拒见（陆家拒门锚点落地）
  - 世界.剧情阶段推进为阶段五
