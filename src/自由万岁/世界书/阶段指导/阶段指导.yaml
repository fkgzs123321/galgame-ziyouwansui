@@private
<%_ const stage = getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }); _%>
<%_ const beat = getvar('stat_data.世界.阶段节拍', { defaults: 0 }); _%>
节奏总纲:
  节拍定义: 一次有推进的剧情互动（一段完整的对话、一个事件、一场冲突或一次情感交流）记一拍
  记拍规则: 每完成一拍，世界.阶段节拍加1；进入新阶段时归零
  强制节奏: 任何锚点事件在当前阶段节拍数达到门槛前禁止触发，无论剧情条件多么成熟
  填充方式: 节拍不足时，从本阶段的「节拍池」条目中选取日常节拍上演，或让<user>与角色们的自由互动自然成拍
  体量对齐: 全剧六阶段合计至少46拍，对应原剧71集的体量；宁可慢，不许赶

<%_ if (stage === '阶段一') { _%>
阶段一_订婚宴决裂:
  节拍门槛: 至少4拍（宴会前奏、宣布订婚、泼酒退婚、资源收回各有过程）
  goal: 主持订婚宴之夜到资源收回的决裂进程，把<user>以自选身份卷入开局
  narration_focus:
    - 宴会的豪门气派与沈知意的窒息感对照
    - 宣布订婚、泼酒、拉周燃、离场的场面调度
    - 七项资源逐项收回的具体过程
  interaction:
    - <user>以所选身份在场，可影响过程与场面
    - 锚点结果固定：退婚发生、资源收回，不因<user>行为改变
  progression_boundary: 阶段节拍不足4时，禁止触发资源收回、禁止进入阶段二；宴会过程可反复展开（宾客、敬酒、闲言、试探）
<%_ } else if (stage === '阶段二') { _%>
阶段二_落差初现:
  节拍门槛: 至少8拍
  goal: 主持城西生活的展开与职场处境的建立
  narration_focus:
    - 出租屋的漏水水管、白粥咸菜与陆家生活的记忆对照
    - 周燃话术的日常渗入与沈知意的自我催眠
    - 惠丰金融里沈知意的迟到早退与光环消失
  interaction:
    - <user>可作为同事、邻居或城西熟人介入日常
    - <user>目击周燃推脱抠门时，周燃.暴露度上涨
  progression_boundary: 阶段节拍不足8时，禁止公布转正名单；等待期从节拍池（价钱冲击、人走茶凉、大单跳票、职场翻车、存款见底）中上演日常
<%_ } else if (stage === '阶段三') { _%>
阶段三_职场挣扎:
  节拍门槛: 至少14拍（全剧体量最大的阶段）
  goal: 主持转正崩溃、对质、客户流失与林清禾崛起的双线推进
  narration_focus:
    - 晨会念名单与当场崩溃的爆发
    - 质问陆司砚的对峙戏
    - 洗手间真相与庆祝大餐争吵
    - 林清禾的五分钟陈述、攻关夜、拿下项目与正面回怼
  interaction:
    - <user>选择立场与介入深度，影响赵媛.站队立场与各角色好感
    - 锚点顺序固定：转正名单、质问陆司砚、客户流失、林清禾拿下项目
  progression_boundary: 阶段节拍不足14时，禁止进入阶段四；双线必须交替上演，两个锚点之间至少间隔2拍；等待期从节拍池（申诉资历、楼下接人、催租风波、八卦流转、项目攻关夜、初次兼职）中上演日常
<%_ } else if (stage === '阶段四') { _%>
阶段四_全面崩溃:
  节拍门槛: 至少10拍
  goal: 主持道歉被拒、陆家拒门、母亲病危与收入对比的下行
  narration_focus:
    - 陆家大门紧闭的沉默压迫与门卫转达
    - 医院来电与几十个未接来电
    - 周燃的「我手上没钱」与网贷抉择
    - 月入五万与四千五的量化对照
  interaction:
    - <user>可借钱、陪护、报信、劝和，影响债务数额与沈知意.觉醒度
    - 病危本身不可逆转
  progression_boundary: 阶段节拍不足10时，禁止进入阶段五；每扇关上的门之间至少隔1个日常节拍；等待期从节拍池（连环碰壁、断舍离、病房众生相、债主轰炸）中上演日常
<%_ } else if (stage === '阶段五') { _%>
阶段五_触底与转折:
  节拍门槛: 至少10拍
  goal: 主持至暗时刻、林陆感情升温与沈知意的反思
  narration_focus:
    - 债务催收、职场边缘化、感情失效、病榻照料的四维低谷
    - 反思场景里陆家的好与陆司砚克制的回放
    - 林清禾与陆司砚在工作会议里的渐进
  interaction:
    - <user>的陪伴与反思引导直接推动沈知意.觉醒度（反思类互动+10至+20）
    - 觉醒度达到70开启反弹支线
  progression_boundary: 阶段节拍不足10或觉醒度未结算分支时，禁止进入阶段六；本阶段禁用爆点，等待期从节拍池（三点一线、深夜牌局、旧物反思夜、庆功宴对比）中上演日常
<%_ } else { _%>
阶段六_结局:
  节拍门槛: 无（结算阶段）
  goal: 按变量结算各角色命运收束
  narration_focus:
    - 默认线：沈知意失去一切、与周燃关系名存实亡、周燃继续画饼
    - 反弹线（觉醒度70以上）：学业务、还债、母女和解
    - 周燃败露线（暴露度80以上）：摊牌与切割
    - 苏晚晴新生线（脱离危险）：搀扶散步与重新拿起绣绷
  interaction:
    - <user>的身份线命运一并结算
  progression_boundary: 本阶段为终局；结算完成后可应<user>要求开启新的轮回
<%_ } _%>

群像档案引用:
  说明: 每个阶段都有一条「阶段群像」档案常驻生效，内含全员在该阶段的外在状态、经济状况、心理基调、行为模式、阶段语料库与关系动态。写任何角色言行前，先对照当阶段群像
  使用要求: 角色台词优先从当阶段群像的语料库中取用或化用；跨阶段的语料不可混用（阶段二的沈知意说不出阶段五的话）
