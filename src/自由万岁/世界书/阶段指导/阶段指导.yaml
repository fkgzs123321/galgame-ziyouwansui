@@private
<%_ const stage = getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }); _%>
<%_ if (stage === '阶段一') { _%>
阶段一_订婚宴决裂:
  goal: 主持订婚宴之夜到资源收回的决裂进程，把<user>以自选身份卷入开局
  narration_focus:
    - 宴会的豪门气派与沈知意的窒息感对照
    - 宣布订婚、泼酒、拉周燃、离场的场面调度
    - 七项资源逐项收回的具体过程
  interaction:
    - <user>以所选身份在场，可影响过程与场面
    - 锚点结果固定：退婚发生、资源收回，不因<user>行为改变
  progression_boundary: 订婚宴泼酒与资源收回两个锚点完成前，不得进入阶段二
<%_ } else if (stage === '阶段二') { _%>
阶段二_落差初现:
  goal: 主持城西生活的展开与职场处境的建立
  narration_focus:
    - 出租屋的漏水水管、白粥咸菜与陆家生活的记忆对照
    - 周燃话术的日常渗入与沈知意的自我催眠
    - 惠丰金融里沈知意的迟到早退与光环消失
  interaction:
    - <user>可作为同事、邻居或城西熟人介入日常
    - <user>目击周燃推脱抠门时，周燃.暴露度上涨
  progression_boundary: 转正名单公布前属于本阶段，不得提前进入晨会念名单
<%_ } else if (stage === '阶段三') { _%>
阶段三_职场挣扎:
  goal: 主持转正崩溃、对质、客户流失与林清禾崛起的双线推进
  narration_focus:
    - 晨会念名单与当场崩溃的爆发
    - 质问陆司砚的对峙戏
    - 洗手间真相与庆祝大餐争吵
    - 林清禾的五分钟陈述、拿下项目与正面回怼
  interaction:
    - <user>选择立场与介入深度，影响赵媛.站队立场与各角色好感
    - 锚点顺序固定：转正名单、质问陆司砚、客户流失、林清禾拿下项目
  progression_boundary: 四个锚点完成前，不得进入阶段四
<%_ } else if (stage === '阶段四') { _%>
阶段四_全面崩溃:
  goal: 主持道歉被拒、陆家拒门、母亲病危与收入对比的下行
  narration_focus:
    - 陆家大门紧闭的沉默压迫与门卫转达
    - 医院来电与几十个未接来电
    - 周燃推脱无钱与网贷抉择
    - 月入五万与四千五的量化对照
  interaction:
    - <user>可借钱、陪护、报信、劝和，影响债务数额与沈知意.觉醒度
    - 病危本身不可逆转
  progression_boundary: 母亲病危锚点完成前，不得进入阶段五
<%_ } else if (stage === '阶段五') { _%>
阶段五_触底与转折:
  goal: 主持至暗时刻、林陆感情升温与沈知意的反思
  narration_focus:
    - 债务催收、职场边缘化、感情失效、病榻照料的四维低谷
    - 反思场景里陆家的好与陆司砚克制的回放
    - 林清禾与陆司砚在工作会议里的渐进
  interaction:
    - <user>的陪伴与反思引导直接推动沈知意.觉醒度（反思类互动+10至+20）
    - 觉醒度达到70开启反弹支线
  progression_boundary: 觉醒度结算与分支落定前，不得进入阶段六
<%_ } else { _%>
阶段六_结局:
  goal: 按变量结算各角色命运收束
  narration_focus:
    - 默认线：沈知意失去一切、与周燃关系名存实亡、周燃继续画饼
    - 反弹线（觉醒度70以上）：学业务、还债、母女和解
    - 周燃败露线（暴露度80以上）：摊牌与切割
    - 苏晚晴新生线（脱离危险）：搀扶散步与重新拿起绣绷
  interaction:
    - <user>的身份线命运一并结算
  progression_boundary: 本阶段为终局；结算完成后可应<user>要求开启新的轮回
<%_ } _%>
