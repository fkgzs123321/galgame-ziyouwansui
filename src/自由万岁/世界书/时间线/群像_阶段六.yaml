阶段群像_阶段六·结局:
  时间跨度: 分支结算后至尾声（对应原剧第66-71集体量，数周至数月跨度可用蒙太奇带过）
  阶段氛围: 各归其位。命运不再制造事件，只是把每个人送到自己的位置上；玩家的存在感在这一阶段达到最大，因为每一个人的位置，都有玩家的指纹

  默认线群像（觉醒度不足70、暴露度未达80、母亲未脱离危险）:
    沈知意: 失去所有：住在漏水的出租屋，背着滚利的网贷，日复一日照顾病中的母亲。周燃仍在身边，但关系名存实亡。
    沈知意语料:
      - 「我不后悔泼那杯酒，我后悔的是泼完之后，我以为全世界都欠我。」
      - 「妈，今天天气好，我推你下楼晒晒。」
      - 「自由啊……我见过它了。它长什么样，我现在知道了。」
    陆司砚: 继续经营产业，与林清禾的关系走向确定；对沈知意不帮忙也不报复。
    林清禾: 成长为公司骨干，与陆司砚的感情落定；用自己的方式证明努力的人值得被善待。
    林清禾语料:
      - 「陆总，下季度的规划，我想听你的想法。」
    周燃: 继续维持修车店，继续说「以后会更好」。他可能永远不会成功，但他永远会有下一个「沈知意」。
    周燃语料:
      - 「哥几个看着，我明年肯定翻盘。」
    苏晚晴: 病情进入漫长的平稳与反复交替；她是女儿一切选择最终的账本。
    温惠茹与陆振邦: 与沈知意不再往来；珍珠胸针收在抽屉最里层。

  反弹线群像（觉醒度≥70，可与默认线细节并存）:
    沈知意: 与周燃摊牌后搬出出租屋；白天上班晚上学业务，还款记录贴满床头；考取业务资格那天，她把床头的纸一张张撕下来，撕得很慢。
    反弹线语料:
      - 「周燃，账我算了三遍，你欠我的每一笔我都记着。今天不是来吵架的，是来告诉你要还的。」
      - 「老师，这个公式我课后能再问您十分钟吗？」
      - 「妈，等我考过了，带你去看海。」
    苏晚晴: 病房里学着用智能手机，第一件事是给女儿的工作邮箱发了一封恭喜信
    陆司砚: 听说她还清了第一笔，让秘书查了查那家夜校的口碑，查完什么也没说，也没做
    林清禾: 在行业聚会上遇到来发传单的沈知意，接过传单，认真说「谢谢」，没有多问一句
    周燃: 被要账后离场，城西圈子传遍他的做派；结尾他在另一座县城的酒桌上，讲起一个和「宝宝」很像的新故事开头

  周燃败露线群像（暴露度≥80）:
    沈知意: 翻出账本与欠条照片逐条对质，全程没有哭，这是她泼酒之后第一次让人看见脊梁
    周燃: 深情、委屈、凉薄依次失效后，留下「过不下去就不过」和顺走的老干妈，搬去牌友家
    阶段语料:
      - 周燃转身收行李，动作利落得像早就打好了包。
      - 沈知意「门锁我会换，你剩下的东西我放物业了。」

  苏晚晴新生线群像（脱离危险）:
    苏晚晴: 第一次走完医院花园，重新拿起绣绷；账本里「都要还」那一页撕了
    顾明远: 搀扶散步的人；他的老花镜后面，藏了很多年的一句话，还在等合适的时机
    阶段语料:
      - 「顾医生，花园的桂花，比我年轻时候那棵香。」
      - 「老太太，是你自己争气。」
    沈知意: 在普通病房和母亲包了一顿饺子，面粉沾了两个人一脸

  尾声通则:
    - 玩家身份线的结局在此一并落定：玩家的职业、关系网、资金与每一次判定都应影响尾声的写法
    - 尾声可用蒙太奇（数周至数月的时间跳跃），每个角色至少一个定格镜头
    - 无论哪条线，最后的镜头建议留给「自由」两个字，它此刻的含义由玩家一路的选择决定
