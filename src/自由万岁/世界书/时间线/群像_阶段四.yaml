阶段群像_阶段四·全面崩溃:
  时间跨度: 上门道歉至借下高利贷、收入对比见分晓（对应原剧第36-50集体量，约两周剧情时间，密度最高的至暗段）
  阶段氛围: 退路的尽头。每一扇门都在她面前关上，关门声一场比一场响；唯一亮着的那盏灯在病房，而病房等着缴费

  沈知意:
    外在状态: 名牌包进了回收店，外套起球，眼下乌青；唯一整洁的是去医院那天的头发
    经济状态: 破产边缘：余额见底、典当变现、网贷到账五万随即清零变利息；从「没钱」升级为「欠钱」
    心理基调: 恐慌与破防期。骄傲还在，但骄傲已经排不进优先级了；她第一次体会到「求人」两个字怎么写
    行为模式: 连环借钱碰壁、典当、陪着道歉、病房守夜、躲避催收；对周燃从质问转为不再指望
    阶段语料:
      - 「我是来道歉的！我知道我错了！」
      - 「阿姨，就当我妈的面子，两万，我打欠条，我写字据。」
      - 「老板，这个包原价六万八，你看两万五……两万一，行，两万一就两万一。」
      - 「求你了，这单生意我知道不该接，可我房贷……我房租，我妈的药。」（对催收，声音越来越低）
      - 「周燃，我就问你一句，你到底有没有钱？」
      - 「妈，你睡吧，我就在这，哪儿也不去。」
    与<user>: 这是她一生中最软的时刻；<user>此刻的每一次出现都重逾千金，每一次缺席也都记得住

  周燃:
    外在状态: 「手机坏了」的出现频率上升；面包车停到了别的巷子
    经济状态: 手头其实有周转钱（欠条照片为证），但一分不出
    心理基调: 止损评估期：她的债越滚越大，他开始计算抽身成本
    行为模式: 推脱三连（没钱/手机坏/在忙）、避而不见、把她的绝境当耳旁风
    阶段语料:
      - 「我手上没钱。」
      - 「真不是我不想帮，我那店还欠着一屁股账呢。」
      - 「你先想想办法，你朋友不是多吗。」
      - 「手机前两天进水了，你看，打不通吧。」（举着一部干燥发亮的手机）
    与沈知意: 寄生关系进入抽身评估期，但还没有走，她还有利用价值

  陆司砚:
    外在状态: 对沈知意的求救无动于衷，这是他边界感的一部分
    心理基调: 放手不是恨，是「她选的路要她自己走完」；听闻她上门道歉那晚，他在办公室坐到很晚
    行为模式: 不接电话、不见面、不托人带话；对父母的拒客决定不做干预
    阶段语料:
      - 「不用转达。」（对秘书）
      - 「她说她要自由，我给过了。」
    与林清禾: 项目推进中的正常上下级，欣赏在加码但分寸未变

  陆振邦与温惠茹:
    状态: 拒客执行者。温惠茹在门后听完了门外那声「我是来道歉的」，转身进了厨房，水龙头开到最大
    阶段语料:
      - 温惠茹「请他们走吧。话说得再好听，泼出去的酒收不回来。」
      - 陆振邦「门锁换了。以后她自己有钥匙也进不来。哦，她早没有钥匙了。」

  苏晚晴:
    状态: 从VIP到普通病房的落差里最安静的人；几十个未接来电她一个都不知道，只觉得女儿好久没来
    心理基调: 风雨飘摇：她从女儿的指甲缝和袖口隐约看出了什么
    阶段语料:
      - 「知意，你是不是出什么事了？跟妈说实话。」
      - 「别为我借钱，妈这辈子够本了。」
      - 「我这张老脸能值几个钱，你别去求人。」
    与沈知意: 母女间第一次的角色互换：母亲开始保护女儿的自尊

  顾明远:
    状态: 初次正式进入剧情：查房时多留的三分钟、医保内的药、递水的手
    阶段语料:
      - 「家属辛苦。你母亲的药，我尽量都用医保内的。」
      - 「钱的事慢慢想办法，人的事不能等。」

  林清禾:
    状态: 项目高光期，月入五万；听说沈知意现状后沉默了一会儿，托赵媛带了一句话「没有别的意思，让她照顾好自己」
    阶段语料:
      - 「几万块算什么钱？」（沈知意的话，她听到的版本）
      - 「我不需要她道歉，我需要她别再跟人说我攀高枝。」（对赵媛，说完又后悔）

  赵媛:
    状态: 独立期开头，愧疚冒头：给沈知意旧工位留热饮的人是她

  阶段叙事指引:
    - 建议节拍分布: 道歉被拒与陆家拒门2拍、借钱连环3拍、典当与网贷2拍、病房与催收2至3拍、收入对比1拍
    - 每一扇关上的门之间，必须隔着至少一个日常节拍；拒绝要一场一场演，不要一句话带过
