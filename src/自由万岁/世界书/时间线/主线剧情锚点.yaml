主线锚点链:
  顺序规则: 十个锚点按下列顺序推进，不可跳过、不可颠倒；锚点之间为自由互动区间，玩家行为影响过程与分支
  锚点清单:
    - 锚点: 订婚宴泼酒
      阶段: 阶段一
      地点: 陆家别墅宴会厅
      内容: 沈知意当众泼酒退婚，宣布周燃是真爱，高喊要自由
      后续: 陆家开始收回资源
    - 锚点: 资源收回
      阶段: 阶段一
      地点: 陆家
      内容: 七项资源全部收回，决裂落地
      后续: 进入阶段二，沈知意搬入城西出租屋
    - 锚点: 转正名单
      阶段: 阶段三
      地点: 惠丰金融晨会会议室
      内容: 赵媛与林清禾转正，沈知意落选当场崩溃
      后续: 沈知意冲到陆氏企业对质
    - 锚点: 质问陆司砚
      阶段: 阶段三
      地点: 陆氏控股集团
      内容: 陆司砚声明不再兜底，自由意味着为选择负责
      后续: 客户全面流失、洗手间真相
    - 锚点: 客户流失
      阶段: 阶段三
      地点: 惠丰金融
      内容: 客户终止合作，权限暂停，被边缘化
      后续: 林清禾的五分钟陈述与项目崛起
    - 锚点: 林清禾拿下项目
      阶段: 阶段三
      地点: 惠丰金融
      内容: 林清禾拿下陆氏项目，回怼沈知意嘲讽，收入跃升
      后续: 阶段三收束，进入阶段四
    - 锚点: 道歉被拒
      阶段: 阶段四
      地点: 陆家别墅大门
      内容: 沈知意带周燃上门道歉，大门紧闭，门卫转达请他们离开
      后续: 医院来电
    - 锚点: 母亲病危
      阶段: 阶段四
      地点: 林县中心医院
      内容: 欠费转普通病房、病危催费、周燃说没钱、借高利贷
      后续: 进入阶段五，网贷压身
    - 锚点: 收入对比
      阶段: 阶段四
      地点: 惠丰金融
      内容: 林清禾月入五万对沈知意四千五
      后续: 阶段五至暗时刻
    - 锚点: 陆家拒门
      阶段: 阶段四
      地点: 陆家
      内容: 陆振邦与温惠茹正式表态不再信任沈知意的任何话语，家中不再提起她
      后续: 沈知意.陆家态度转为心碎拒见
阶段推进规则:
  - 阶段一内完成订婚宴泼酒与资源收回后进入阶段二
  - 转正名单触发即进入阶段三
  - 阶段三内质问陆司砚、客户流失、林清禾拿下项目完成后进入阶段四
  - 母亲病危完成后进入阶段五
  - 阶段五按沈知意.觉醒度结算分支后进入阶段六
