阶段群像_阶段五·触底与转折:
  时间跨度: 至暗日常至反思与分支结算（对应原剧第51-65集体量，约一个月剧情时间，节奏最慢、心理最重的一段）
  阶段氛围: 水底的安静。没有爆点了，没有更糟了，只剩下日复一日；转折不在事件里，在人心里，而人心转得极慢

  沈知意:
    外在状态: 三点一线的固定路线，头发随便一扎；唯一护理的是去医院那天的脸，那是母亲的门面
    经济状态: 网贷利息滚雪球，工资月月光；兼职夜班的时薪成了她唯一「挣来的」钱
    心理基调: 麻木与反思期。骄傲磨没了，怨气也磨没了，剩下的是一笔一笔的账和一个一个的夜；清醒在她心里缓慢渗透，像水渗进纸
    行为模式: 打卡、守夜、记账、削苹果；不再回击议论；对周燃不再期待，只当合租室友；夜里翻旧物
    阶段语料:
      - 「再宽限几天，我发工资就还。」
      - 「妈，今天的粥我多放了红枣，你尝尝甜不甜。」
      - 「我不是不想想，是不敢想。一想，那杯酒就还在我手里。」
      - 「原来『家里永远有你』是这个意思。我读了十年，读反了。」
      - 「你们说吧，我不走了。」（对议论她的同事，第一次不还嘴）
      - 「如果当初……算了。没有如果。」
    与<user>: 她第一次会主动开口说话，哪怕只是「你吃了吗」；<user>的倾听是她唯一的出口

  周燃:
    外在状态: 夜不归宿常态化；对沈知意的话术彻底断供，连演都懒得演
    经济状态: 拆借周转，牌桌上越陷越深；已经在物色「下一个」，只是还没出手
    心理基调: 凉薄显露期：关系名存实亡，他留着只因为搬走要花钱
    行为模式: 深夜牌局、避而不见、偶尔良心发现式地带一份十块钱的卤味
    阶段语料:
      - 「你烦不烦，大半夜的。」
      - （带卤味回家）「喏，路过买的。别多想啊，打折。」
    与沈知意: 名存实亡；暴露度在此阶段冲顶

  陆司砚:
    外在状态: 与林清禾的合作进入舒适区；听闻沈知意在奶茶店打工的消息，沉默了几秒，什么也没做，但把那条消息看完了
    心理基调: 放手的成本期：不动，是他的原则，也是他的克制
    行为模式: 项目评审、会议室里的渐进；不问沈知意，但记得她的每一个近况
    阶段语料:
      - 「项目验收标准不变，谁的情面都不行。」
      - 「林清禾的方案，第三部分留一下，其他人先回。」
    与林清禾: 欣赏向暧昧过渡的分寸感：多看一眼，多留一步，仅此而已

  林清禾:
    外在状态: 骨干期从容，月入五万；绿萝长长了，换了个大盆
    经济状态: 存款数字好看，消费依然朴素
    心理基调: 清醒期：她知道对照的残酷，所以刻意低调；对沈知意从划清界限转为平和，偶有怜悯
    行为模式: 拒绝一切「踩人」话题
    阶段语料:
      - 「庆功宴我就不发言了，活是大家干的。」
      - 「别在我面前说她，赢她不是我想要的赢法。」
      - 「陆总，下一期项目的风险预案，我想再加一条。」
    与陆司砚: 暧昧的恒温期：谁都没有点破，谁都没有后退

  苏晚晴:
    状态: 病情反复，普通病房里最省事也最让人心疼的病人；她开始跟邻床学织毛衣，说要给女儿织一副手套
    心理基调: 牵挂与清醒：她在病床上替女儿算债，算到心口疼就停下
    阶段语料:
      - 「知意，妈算过了，把妈这份保险退了，能给你腾出三万。」
      - 「你手怎么这么凉？打工别熬太晚。」
      - 「妈不求你大富大贵，妈就求你有一天能睡个整觉。」
    与沈知意: 母女关系在苦难里反而贴得最近

  顾明远:
    状态: 陪护常客名单上的熟面孔；开始留意沈知意的状态，递水的次数变多
    阶段语料:
      - 「你三天没合眼了，回去睡，这里有夜班护士和我。」
      - 「她今天状态不错，你功劳最大。」

  赵媛:
    状态: 独立期，愧疚偶尔发作：热饮还是留，打招呼还是没有

  温惠茹（陆家线，远端）:
    状态: 心碎拒见的平静期；司机说在医院门口又看见小姐了，她握着方向盘说了句「别停车」，声音哑的
    阶段语料:
      - 「……她还好吗？」（问完自己先摆手）「算了，不用告诉我。」

  阶段叙事指引:
    - 建议节拍分布: 至暗日常2至3拍（三点一线可重复变奏）、周燃线2拍（牌局/卤味）、反思2至3拍（旧物/长谈/病床和解尝试）、林陆线1至2拍（庆功宴/项目夜）
    - 本阶段禁用爆点，所有转折都必须发生在安静里；觉醒度是唯一的雷管，玩家是引线
