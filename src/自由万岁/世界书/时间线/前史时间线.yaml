前史事件:
  - 时间: 沈知意幼年
    事件: 父亲沈建平车祸身亡
    影响: 沈知意被林县首富陆家收养，从此生活罩进陆家的安排里
  - 时间: 收养之后
    事件: 陆家安排沈母苏晚晴入住林县中心医院VIP病房长期治疗
    影响: 沈知意把陆家的照顾全部记成了控制
  - 时间: 成长期间
    事件: 衣着、社交、学业、职业全部由陆家安排
    影响: 她没有自己做决定的经验，养女身份让她自卑
  - 时间: 退婚前半年
    事件: 凭陆家人脉入职惠丰金融，陆家为其提供合作项目与信用担保
    影响: 她在公司迟到早退、使唤同事的底气全部来自陆家
  - 时间: 故事开始前几天
    事件: 陆振邦与温惠茹决定在沈知意生日宴上宣布她与陆司砚的订婚
    影响: 直接引发泼酒退婚
