变量更新规则:
  世界:
    当前日期:
      format: YYYY年MM月DD日
      check:
        - 每次场景推进后更新，保持时间流逝与剧情阶段匹配
    当前场景:
      check:
        - 进入新地点或时段变化时更新，格式为「地点·时段」
    剧情阶段:
      type: 阶段一|阶段二|阶段三|阶段四|阶段五|阶段六
      check:
        - 阶段一内完成「订婚宴泼酒」与「资源收回」后改为阶段二
        - 「转正名单」触发后改为阶段三
        - 阶段三内「质问陆司砚」「客户流失」「林清禾拿下项目」完成后改为阶段四
        - 「母亲病危」完成后改为阶段五
        - 阶段五按沈知意.觉醒度结算分支后改为阶段六
        - 锚点顺序固定，不可跳过或颠倒
    阶段节拍:
      type: number
      check:
        - 当前阶段每完成一次有推进的剧情互动（完整对话、事件、冲突、情感交流）加1
        - 进入新阶段时归零
        - 锚点触发的节奏门槛：阶段一达4拍、阶段二达8拍、阶段三达14拍、阶段四达10拍、阶段五达10拍后，对应锚点才允许触发
        - 两个锚点之间至少间隔2拍
    已触发锚点:
      check:
        - 锚点达成时把锚点名追加进数组，只增不减，同一锚点不可重复
        - 更新方式为整体替换数组（原数组元素加新元素后整体写入），禁止按下标修改单个元素
    最近判定:
      type: |-
        {
          说明: string; # 触发判定的行动简述
          骰值: number; # 1到100的整数
          目标: number; # 1到100的整数
          结果: '无需判定'|'大成功'|'成功'|'失败'|'大失败';
        }
      check:
        - <user>尝试有失败可能的关键行动（质问、摊牌、说服、侦查、争取机会、借钱博弈）时判定；日常对话与既定锚点不判定
        - 目标值为50加情境修正：目标角色好感60以上+10、对方怀有敌意-10、沈知意觉醒度40以上+10、周燃暴露度40以上+10、明显不合理或准备不足-20
        - 骰值为1到100的整数，如实结算：90以上大成功、达到目标成功、未达目标失败、10以下大失败；不许迁就剧情偏好
        - 结算的同时把本条判定追加到世界.判定记录末尾
    判定记录:
      check:
        - 每次判定后把同一记录追加到数组末尾；历史记录不改不删，schema自动只保留最近5条
  玩家:
    身份:
      check:
        - 开场确定后固定，除非玩家明确更改身份
    资金:
      type: number
      check:
        - 单位为元；工资、借钱、垫付、还贷时更新；负值会被自动纠为0
  沈知意:
    对玩家好感:
      type: number
      range: 0~100
      check:
        - 根据<user>对她的态度与帮助调整 ±(2~8)
    转正状态:
      type: 实习生|已转正|被淘汰
      check:
        - 转正名单锚点后置为被淘汰
    七项资源:
      type: |-
        {
          订婚珠宝: boolean; # true=已被陆家收回
          黑卡: boolean;
          专车: boolean;
          门禁权限: boolean;
          合作项目: boolean;
          信用担保: boolean;
          病房续费: boolean;
        }
      check:
        - 「资源收回」锚点后逐项置为 true，不可逆
        - 更新时整体替换对象，不可遗漏其余键
    债务金额:
      type: number
      check:
        - 母亲病危抢救后跳升至50000以上
        - 此后每阶段利滚利递增；反弹线按还款计划下降
    母亲病情:
      type: 长期治疗|转入普通病房|病危抢救|病情反复|脱离危险
      check:
        - 资源收回且欠费后改为转入普通病房
        - 缴费抢救后改为病危抢救
        - 阶段五默认转为病情反复；<user>促成良好治疗或新生线时改为脱离危险
    陆家态度:
      type: 视为己出|失望|心碎拒见
      check:
        - 订婚宴泼酒后改为失望
        - 道歉被拒与陆家拒门后改为心碎拒见
    觉醒度:
      type: number
      range: 0~100
      check:
        - 周燃暴露度达到80或母亲病危后开始增长
        - 反思类互动+10至+20，日常挫折+2至+5
        - 达到70开启反弹支线
    对周燃态度:
      type: 真爱|动摇|失望|名存实亡|决裂
      check:
        - 默认真爱；阶段三争吵与目睹其推脱后改为动摇
        - 暴露度达到80或进入败露线后改为失望或决裂
        - 阶段五默认名存实亡
    对陆司砚态度:
      type: 视为兄长|怨恨|复杂|愧疚
      check:
        - 默认视为兄长；泼酒退婚后改为怨恨
        - 阶段五反思后改为复杂；觉醒度50以上或进入反弹线后改为愧疚
  陆司砚:
    对玩家好感:
      type: number
      range: 0~100
      check:
        - 根据<user>的专业表现与分寸感调整 ±(2~6)
    对沈知意态度:
      type: 兄长式照顾|失望克制|彻底放手
      check:
        - 订婚宴泼酒后置为彻底放手且不可逆（分支剧情除外）
  林清禾:
    对玩家好感:
      type: number
      range: 0~100
      check:
        - 根据<user>的认真程度与协作调整 ±(2~8)
    职业阶段:
      type: 新人|转正|骨干
      check:
        - 转正名单后改为转正
        - 拿下陆氏项目并稳定表现后改为骨干
    月收入:
      type: number
      check:
        - 初始约5000，拿下陆氏项目后跳升至50000
    与陆司砚感情:
      type: 初识|相识|欣赏|暧昧|确定
      check:
        - 五分钟陈述与厂房考察后改为相识或欣赏
        - 项目合作升温后改为暧昧
        - 阶段六终局改为确定
    对沈知意态度:
      type: 隐忍|划清界限|平和|怜悯
      check:
        - 默认隐忍；正面回怼后改为划清界限
        - 阶段四起转为平和；善意相待且目睹其落魄时改为怜悯
  周燃:
    对玩家好感:
      type: number
      range: 0~100
      check:
        - 本质是利用价值的度量，按<user>可利用程度调整
    暴露度:
      type: number
      range: 0~100
      check:
        - 沈知意或<user>目睹其推脱、抠门、谎言时+5至+15
        - 重大失信+20以上
        - 达到80时沈知意清醒认清其本质
    修车店经营:
      type: 惨淡|维持|起色
      check:
        - 默认惨淡几乎不变
  赵媛:
    对玩家好感:
      type: number
      range: 0~100
      check:
        - 根据<user>的处境与风向调整 ±(2~8)
    站队立场:
      type: 跟随沈知意|观望|站队林清禾|独立
      check:
        - 默认跟随沈知意
        - 转正名单后改为站队林清禾
        - <user>的干预可改变或提前
  温惠茹:
    对玩家好感:
      type: number
      range: 0~100
      check:
        - 根据<user>的得体与真诚调整 ±(2~6)，门槛极高
    婚姻心境:
      type: 安稳|寂寥|重温
      check:
        - 默认安稳；阶段四心碎拒见期间转为寂寥
        - 高信任修复事件或新生线推进后可改为重温
  苏晚晴:
    对玩家好感:
      type: number
      range: 0~100
      check:
        - 根据<user>的探视与照料调整 ±(2~8)
