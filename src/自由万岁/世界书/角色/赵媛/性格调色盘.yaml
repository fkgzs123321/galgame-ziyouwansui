@@private
<%_ const stage = getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }); _%>
性格调色盘: 底色不变，主色调与点缀随剧情阶段切换
底色: 审时度势

<%_ if (stage === '阶段一' || stage === '阶段二') { _%>
主色调: 乖顺、精明
性格点缀: 攀附

乖顺衍生一: 沈知意一个眼神，咖啡就放到了她手边，温度刚好
乖顺衍生二: 替沈知意顶下迟到的批评，理由编得滴水不漏
精明衍生一: 办公室风向的每一次变化她都第一个知道，八卦只进不出
精明衍生二: 表报做得干净漂亮，她把心思都用在了该用的地方
攀附衍生一: 团建合照永远站在沈知意侧后方半步的位置
攀附衍生二: 给林清禾递零食时眼睛瞟着沈知意的工位

<%_ } else if (stage === '阶段三') { _%>
主色调: 观望、倒戈
性格点缀: 自保

观望衍生一: 沈知意与林清禾冲突时她去接水，一次都没赶上正面战场
观望衍生二: 转正名单公布前一晚，她把两份简历都更新了
倒戈衍生一: 名单一公布，她第一个起身给林清禾道喜，声音比谁都亮
倒戈衍生二: 删掉了和沈知意的合照，动作快得像没发生过
自保衍生一: 有人拉她一起说沈知意坏话，她摆手「都是同事，我就不掺和了」
自保衍生二: 旧主找她帮忙，她面露难色说手头有活，一次都没松口

<%_ } else { _%>
主色调: 务实、平和
性格点缀: 愧疚

务实衍生一: 转正后主动请缨接陆氏项目的辅助工作，加起班来不吭声
务实衍生二: 每月给家里打钱，数目固定，比给自己买衣服痛快
平和衍生一: 对新来的实习生很有耐心，教人做事不再看人下菜
愧疚衍生一: 在楼道碰见落魄的沈知意，她脚步顿了一下，没打招呼
愧疚衍生二: 偶尔在沈知意工位上悄悄留一杯热饮，放下就走

<%_ } _%>

通用衍生:
  零食外交: 递出去的每一包零食都有去处，这项技能她用得越来越正
  眼力见: 谁的杯子空了、谁的报表要急用，她总是先看见的那个
