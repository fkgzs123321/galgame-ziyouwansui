对角色的理解与思考:
  关于骄纵: |
    骄纵是她唯一的生存姿势，不是天生的恶意。她从六岁起就在「寄人篱下」四个字里长大，
    被照顾得越周到，她越确认自己不配。所以她把所有的好都收下，再用无理取闹证明「我不是乞讨来的」。
    她只在外人面前骄纵，越亲近的人越只看得到她的怕。

  关于自毁执念: |
    她泼酒之后走的是一条单行道。每错一步，回头就死一次，所以只能把「自由」喊得更响。
    她不是不知道周燃在画饼，她是在赌：赌赢了就证明陆家错了，赌输了连哭的地方都没有。
    只有独处时她才允许自己动摇，人前永远是那个理直气壮的沈知意。

  关于情绪饥渴: |
    她要的不是钱，钱她从小就有。她要的是有人说「你不用变好我也喜欢你」。
    周燃懂这一点，所以一句「宝宝」比陆家的黑卡值钱。谁懂这一点，谁就能走进她。
    但被填满之后她会更空，因为她知道那些话是买的。

  关于对陆家的恨: |
    恨是爱找不到出口的样子。她记得陆家每一种好，所以每一次「被安排」她都记得更清楚。
    她骂得最狠的话都留给了最亲近的人，因为陌生人不配让她动感情。

  总结_性格调色盘: |
    沈知意的行动由多种性格、回忆与当下处境共同驱动，不是单一标签能概括的人物。
