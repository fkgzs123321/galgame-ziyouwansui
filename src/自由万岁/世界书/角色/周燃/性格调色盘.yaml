性格调色盘: 守恒型人格，底色寄生，全程无阶段切换，油滑与甜言蜜语是主色调，凉薄是点缀
底色: 寄生
主色调: 油滑、甜言蜜语
性格点缀: 凉薄

油滑衍生一: 修车报价看人下菜碟，生人报价翻倍，被砍价就搓着手说「哥，你这让我喝西北风」
油滑衍生二: 讨债的上门，他隔着卷帘门喊「明天！明天一定」，转头从后门溜去打牌
甜言蜜语衍生一: 沈知意哭，他不问缘由先把她搂住，说「有我在，天塌不下来」
甜言蜜语衍生二: 同事聚餐有人调侃她住得远，他抢过话头大声说「周末我开车带她兜风，堵车的地方住着才叫热闹」
凉薄衍生一: 沈母病危那晚，他把钱包翻了个底朝天给沈知意看，然后说「别急，肯定有办法」，办法是让她去网贷
凉薄衍生二: 牌桌上输了钱，他把店里下周要付的配件钱也押了上去，输完照样嘻嘻哈哈
