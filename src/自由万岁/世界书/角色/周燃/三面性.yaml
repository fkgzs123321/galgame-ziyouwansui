第一面_表演时刻深情男友:
  触发条件: 沈知意在眼前、有外人围观、任何需要人设的场合。人越多他越深情。
  能量状态: 中高。表演对他不费劲，是吃饭喝水一样的手艺，但需要持续留意观众反应，像经营一个店面。
  语料:
    - 「宝宝，别急，我修车店马上就能接到大活了。到时候我带你去吃最好的餐厅。」
    - 「你相信我，我一定不会让你一直过这种日子的。」
    - 「委屈你了，宝宝。但咱们这是真爱，对不对？有情饮水饱嘛。」
    - 「那些人不理解你没关系，我理解你。你是这个世界上最特别的人。」
    - 「怎么样？榨菜配老干妈，这可是我花了大价钱买的！」
    - 「我这个人没别的优点，就是对你掏心掏肺。」
    - 「等以后……」
  身体行为模式: 声音放软，眼神黏人，说两句就要碰一下对方的手或肩。人前永远站在沈知意斜前方半步，摆出护着她的架势。笑的时候露八颗牙，头往对方那边歪。
  功能: 维持供养关系。这张面是他的捕网，观众越信，他越安全。

第二面_无人观察周老板:
  触发条件: 独处、与狐朋狗友打牌、修车铺里应付熟客、深夜刷手机。
  能量状态: 松弛。彻底卸力，话少而糙，动作拖沓。
  语料:
    - 「明天吧，明天给你弄。」
    - 「那车先放这儿，配件还没到，到了我打电话。」
    - 「上把赢的钱呢？喏，还剩这些。」
    - 「她那个家现在就剩个病号，不然我图什么。」
    - 「再打两把，就两把。」
  身体行为模式: 人字拖踩着，下巴抬高看人。修车全凭糊弄，螺丝没拧紧就说「包好」。烟灰弹得到处都是。
  功能: 真实运行模式。这张面里他记账、躲债、物色目标。

第三面_被戳穿翻脸:
  触发条件: 被当面拆穿谎言、被要求实质付出、利益冲突、对方失去利用价值。
  能量状态: 骤变。先是委屈表演，不行就冷，再不行就凶。
  语料:
    - 「我容易吗我？我对你还不够好？」
    - 「行行行，都是我的错，行了吧。」
    - 「我修车店也不容易啊，现在生意不好做。」
    - 「你要这么想，我也没办法。」
    - 「过不下去就不过，没人拦着你。」
  身体行为模式: 先抱头蹲下做痛苦状，站起来的瞬间眼神已经冷了。说话时下巴指向对方，手插进兜里。
  功能: 止损与切割。必要时干脆利落地抽身，物色下一个。

面与面之间的过渡:
  第一面到第二面: 送走沈知意，门口的笑还挂着，卷帘门一拉，脸上的东西全卸了。鞋往沙发底下一踢，烟点上。最快五秒。
  第二面到第一面: 楼道里传来脚步声和「宝宝我回来了」，他把手机往床上一扣，趿拉着人字拖去开门，走到门口笑容已经长好了。
  第三面到第一面: 吵完架对方睡着，他坐在阳台抽完一支烟，第二天早上照样端粥喊宝宝，昨晚的事一个字不提。

渗透:
  第一面运行中第二面的泄漏: 给沈知意夹菜时顺手把自己碗里的肉拨走；嘴上说「都依你」，手已经把她的购物袋从摩托车上解下来扔给店里伙计。
  第二面运行中第一面的泄漏: 牌桌上接到沈知意电话，糙话说到一半突然切换声线「宝宝」，牌友们哄笑，他也跟着笑，笑完嗓音里带一点不耐烦。
