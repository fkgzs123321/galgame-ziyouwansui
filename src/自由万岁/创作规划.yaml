mvu:
  structure: |
    顶层结构：
    ├── 世界
    │   ├── 当前日期（YYYY年MM月DD日）
    │   ├── 当前场景（地点·时段）
    │   ├── 剧情阶段（阶段一至阶段六，EJS 门控核心）
    │   ├── 阶段节拍（当前阶段已进行的剧情互动数，锚点节奏门槛，进新阶段归零）
    │   ├── 已触发锚点（字符串数组，只增不减）
    │   ├── 最近判定（说明/骰值/目标/结果，判定骰子系统）
    │   └── 判定记录（数组，schema自动只保留最近5条）
    ├── 玩家
    │   ├── 身份（开场自选身份文本）
    │   └── 资金（元，借钱垫付等玩法资源）
    ├── 沈知意
    │   ├── 对玩家好感（0~100）
    │   ├── 转正状态（实习生/已转正/被淘汰）
    │   ├── 七项资源（订婚珠宝/黑卡/专车/门禁权限/合作项目/信用担保/病房续费，各为布尔，true=已收回）
    │   ├── 债务金额（元，高利贷本息）
    │   ├── 母亲病情（长期治疗/转入普通病房/病危抢救/病情反复/脱离危险）
    │   ├── 陆家态度（视为己出/失望/心碎拒见）
    │   ├── 觉醒度（0~100，对自身错误的认知，分支结算依据）
    │   ├── 对周燃态度（真爱/动摇/失望/名存实亡/决裂）
    │   └── 对陆司砚态度（视为兄长/怨恨/复杂/愧疚）
    ├── 陆司砚
    │   ├── 对玩家好感（0~100）
    │   └── 对沈知意态度（兄长式照顾/失望克制/彻底放手）
    ├── 林清禾
    │   ├── 对玩家好感（0~100）
    │   ├── 职业阶段（新人/转正/骨干，EJS 调色盘门控）
    │   ├── 月收入（元）
    │   ├── 与陆司砚感情（初识/相识/欣赏/暧昧/确定）
    │   └── 对沈知意态度（隐忍/划清界限/平和/怜悯）
    ├── 周燃
    │   ├── 对玩家好感（0~100）
    │   ├── 暴露度（0~100，寄生本质被识破程度）
    │   └── 修车店经营（惨淡/维持/起色）
    ├── 赵媛
    │   ├── 对玩家好感（0~100）
    │   └── 站队立场（跟随沈知意/观望/站队林清禾/独立）
    ├── 温惠茹
    │   ├── 对玩家好感（0~100）
    │   └── 婚姻心境（安稳/寂寥/重温）
    └── 苏晚晴
        └── 对玩家好感（0~100）
  variables:
    - path: 世界.当前日期
      format: YYYY年MM月DD日
      description: 当前剧情内日期
    - path: 世界.当前场景
      description: 当前地点与时段
    - path: 世界.剧情阶段
      enum: [阶段一, 阶段二, 阶段三, 阶段四, 阶段五, 阶段六]
      check: 锚点结算推进——阶段一内完成「订婚宴泼酒」与「资源收回」后→阶段二；「转正名单」触发即进入阶段三；阶段三内「转正名单」「客户流失」「林清禾拿下项目」完成后→阶段四；「母亲病危」完成后→阶段五；阶段五按觉醒度结算分支后→阶段六；锚点顺序固定不可跳过
    - path: 世界.阶段节拍
      type: number
      check: 当前阶段每完成一次有推进的剧情互动+1，进入新阶段归零；锚点节奏门槛——阶段一≥4拍、阶段二≥8拍、阶段三≥14拍、阶段四≥10拍、阶段五≥10拍，未达门槛锚点禁止触发；两锚点间至少间隔2拍
    - path: 世界.已触发锚点
      type: z.array
      description: 已发生的关键锚点标记（订婚宴泼酒/资源收回/转正名单/质问陆司砚/客户流失/林清禾拿下项目/道歉被拒/陆家拒门/母亲病危/收入对比），只增不减，同一锚点不可重复触发
    - path: 世界.最近判定
      type: object
      fields: { 说明: string, 骰值: number, 目标: number, 结果: string }
      description: 判定骰子系统：最近一次判定的行动说明、骰值（1~100）、目标值（1~100）与结果（无需判定/大成功/成功/失败/大失败）
    - path: 世界.判定记录
      type: z.array
      description: 判定历史数组，schema自动只保留最近5条
    - path: 玩家.身份
      description: 开场自选的身份文本（如惠丰金融信贷部新人）
    - path: 玩家.资金
      type: number
      description: 玩家资金（元）；借钱、垫付、工资、还贷玩法资源；初始8000
    - path: 沈知意.对玩家好感
      type: number
      range: 0~100
      description: 对玩家角色的态度温度；初始25
    - path: 沈知意.转正状态
      enum: [实习生, 已转正, 被淘汰]
      description: 惠丰金融职业状态
    - path: 沈知意.七项资源
      type: object
      fields:
        订婚珠宝: boolean
        黑卡: boolean
        专车: boolean
        门禁权限: boolean
        合作项目: boolean
        信用担保: boolean
        病房续费: boolean
      check: 锚点「资源收回」触发后全部置为 true 且不可逆
    - path: 沈知意.债务金额
      type: number
      description: 高利贷网贷本息（元）；母亲病危抢救后跳升至 50000 以上，此后每阶段利滚利递增
    - path: 沈知意.母亲病情
      enum: [长期治疗, 转入普通病房, 病危抢救, 病情反复, 脱离危险]
      check: 资源收回且欠费后→转入普通病房；缴费抢救后→病危抢救或脱离危险（分支）
    - path: 沈知意.陆家态度
      enum: [视为己出, 失望, 心碎拒见]
      check: 泼酒退婚后→失望；道歉被拒后→心碎拒见
    - path: 沈知意.觉醒度
      type: number
      range: 0~100
      check: 周燃暴露度≥80 或母亲病危后开始增长；反思类互动+10~20；日常挫折+2~5；≥70 开启反弹分支，影响阶段五至六走向
    - path: 沈知意.对周燃态度
      enum: [真爱, 动摇, 失望, 名存实亡, 决裂]
      check: 默认真爱；阶段三争吵与目睹推脱后→动摇；暴露度≥80 或败露线后→失望或决裂；阶段五默认名存实亡
    - path: 沈知意.对陆司砚态度
      enum: [视为兄长, 怨恨, 复杂, 愧疚]
      check: 默认视为兄长；泼酒退婚后→怨恨；阶段五反思后→复杂；觉醒度≥50 或反弹线→愧疚
    - path: 陆司砚.对玩家好感
      type: number
      range: 0~100
      description: 对玩家角色的态度温度；初始25
    - path: 陆司砚.对沈知意态度
      enum: [兄长式照顾, 失望克制, 彻底放手]
      check: 锚点「订婚宴泼酒」后置为彻底放手且不可逆（分支剧情除外）
    - path: 林清禾.对玩家好感
      type: number
      range: 0~100
      description: 对玩家角色的态度温度；初始25
    - path: 林清禾.职业阶段
      enum: [新人, 转正, 骨干]
      check: 转正名单后→转正；拿下陆氏项目并稳定表现后→骨干
    - path: 林清禾.月收入
      type: number
      description: 月收入（元）；初始约 5000，拿下陆氏项目后跳升至 50000
    - path: 林清禾.与陆司砚感情
      enum: [初识, 相识, 欣赏, 暧昧, 确定]
      check: 五分钟陈述与厂房考察→相识/欣赏；项目合作升温→暧昧；阶段六→确定
    - path: 林清禾.对沈知意态度
      enum: [隐忍, 划清界限, 平和, 怜悯]
      check: 默认隐忍；正面回怼后→划清界限；阶段四起→平和；善意相待且目睹其落魄时→怜悯
    - path: 周燃.对玩家好感
      type: number
      range: 0~100
      description: 对玩家角色的态度温度（本质是利用价值的度量）；初始25
    - path: 周燃.暴露度
      type: number
      range: 0~100
      check: 沈知意目睹其推脱、抠门、谎言时+5~15；重大失信+20以上；≥80 时沈知意清醒认清其本质
    - path: 周燃.修车店经营
      enum: [惨淡, 维持, 起色]
      description: 周记汽修经营状态，默认惨淡且几乎不变化
    - path: 赵媛.对玩家好感
      type: number
      range: 0~100
      description: 对玩家角色的态度温度；初始25（同期同事为40，由开场覆盖）
    - path: 赵媛.站队立场
      enum: [跟随沈知意, 观望, 站队林清禾, 独立]
      check: 默认跟随沈知意；阶段三转正名单后→站队林清禾；玩家的干预可改变或提前
    - path: 温惠茹.对玩家好感
      type: number
      range: 0~100
      description: 对玩家角色的态度温度；初始25，陆家亲故身份可更高
    - path: 温惠茹.婚姻心境
      enum: [安稳, 寂寥, 重温]
      check: 默认安稳；阶段四心碎拒见期间→寂寥；高信任修复事件或新生线后→重温
    - path: 苏晚晴.对玩家好感
      type: number
      range: 0~100
      description: 对玩家角色的态度温度；初始25，探视病人、医护身份可更高

ejs:
  entries:
    - name: 阶段指导
      complexity: 段落控制
      stages:
        - name: 阶段一·订婚宴决裂
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段一'"
        - name: 阶段二·落差初现
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段二'"
        - name: 阶段三·职场挣扎
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段三'"
        - name: 阶段四·全面崩溃
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段四'"
        - name: 阶段五·触底与转折
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段五'"
        - name: 阶段六·结局
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段六'"
    - name: 沈知意_性格调色盘
      complexity: 段落控制
      stages:
        - name: 决裂前·骄纵顶点
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段一'"
        - name: 落差·自我催眠
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段二'"
        - name: 挣扎·推卸与嫉妒
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段三'"
        - name: 崩溃·直面代价
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段四'"
        - name: 触底·麻木与反思
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段五'"
        - name: 结局·分支
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段六'"
    - name: 林清禾_性格调色盘
      complexity: 段落控制
      stages:
        - name: 隐忍新人期
          condition: "getvar('stat_data.林清禾.职业阶段', { defaults: '新人' }) === '新人'"
        - name: 崛起期
          condition: "getvar('stat_data.林清禾.职业阶段', { defaults: '新人' }) === '转正'"
        - name: 从容骨干期
          condition: "getvar('stat_data.林清禾.职业阶段', { defaults: '新人' }) === '骨干'"
    - name: 赵媛_性格调色盘
      complexity: 段落控制
      stages:
        - name: 跟随期
          condition: "['阶段一', '阶段二'].includes(getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }))"
        - name: 转向期
          condition: "getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }) === '阶段三'"
        - name: 独立期
          condition: "['阶段四', '阶段五', '阶段六'].includes(getvar('stat_data.世界.剧情阶段', { defaults: '阶段一' }))"
    - name: 温惠茹_性格调色盘
      complexity: 段落控制
      stages:
        - name: 视为己出
          condition: "getvar('stat_data.沈知意.陆家态度', { defaults: '视为己出' }) === '视为己出'"
        - name: 失望
