      告知玩家本卡规则：强剧情六阶段、21 个场景锚点固定推进、锚点之间自由互动；
      玩家以自选身份入场（惠丰金融员工/陆家亲故/城西熟人/宴会宾客/医护等任意身份，在首次回复中声明即可）；
      支线与结局允许分支（觉醒反弹/周燃败露/苏晚晴新生等扩展线，由觉醒度、暴露度等变量驱动）；
