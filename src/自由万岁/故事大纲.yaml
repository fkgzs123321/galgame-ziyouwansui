summary: |
  现实向县城情感故事：林县首富陆家在养女沈知意生日宴上宣布她与继承人陆司砚订婚，沈知意视陆家照顾为控制，当众泼酒退婚，宣布修车店小老板周燃是真爱。陆家随即收回珠宝、黑卡、专车、门禁、合作项目、信用担保与VIP病房续费七项资源。失去庇护的沈知意职场溃败、母亲病危、网贷缠身，一路跌至谷底；同期新人林清禾凭专业能力拿下陆氏项目、月入五万，与陆司砚渐生情愫。剧名构成反讽：逃避责任的自由让沈知意失去一切。
story_summary: |
  短剧共71集，跨三到四个月，分六阶段：订婚宴决裂（第1-5集）、落差初现（第6-15集）、职场挣扎（第16-35集）、全面崩溃（第36-50集）、触底与转折（第51-65集）、结局（第66-71集）。双线推进：沈知意线自泼酒退婚后一路下行——转正落选、质问陆司砚、客户流失、道歉被拒、母亲病危、网贷缠身至谷底；林清禾线自递手帕上行——五分钟陈述、拿下陆氏项目、月入五万、与陆司砚感情确定。两线以收入与地位的巨大差距形成对照，最终各角色命运收束。
