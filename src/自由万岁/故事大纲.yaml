# 《自由万岁》故事大纲
# 源材料：素材原文.md（短剧全剧情深度解析，混合材料：结构化档案 + 21 个叙事场景）
# 章节粒度说明：源材料以「场景一至场景二十一」组织剧情，每个场景对应一个章节条目

chapters:
  - name: 场景一：陆家别墅宴会厅
    notes: 陆家在灯火通明的别墅宴会厅为沈知意庆生，陆父陆母当众宣布她与陆司砚订婚，宾客鼓掌道贺。沈知意毫无喜悦，感到人生最后一层安排落下，长期积压的窒息感达到顶点，成为决裂前奏。
  - name: 场景二：泼酒退婚
    notes: 沈知意在全场宾客注视下将红酒泼在陆司砚脸上，痛斥陆家把控制当成关心、把束缚当成照顾，指陆司砚是安排的象征，随后拉起周燃宣布真爱，高喊要自由，头也不回地离开宴会厅。
  - name: 场景三：陆司砚的反应
    notes: 陆司砚没有追出去也没有发怒，用林清禾递来的手帕默默擦脸，只对宾客说让大家见笑了。作为陆氏合作公司员工出席的林清禾因本能善意递手帕，被陆司砚看在眼里，为日后好感埋下种子。
  - name: 场景四：陆家收回资源
    notes: 宴会结束后陆家决定彻底收回给沈知意的一切：订婚珠宝、黑卡、专车、别墅门禁权限、依附陆家的合作项目、信用担保以及沈母VIP病房续费。陆家态度鲜明：既然选择自由，那就自由到底。
  - name: 场景五：搬进出租屋
    notes: 沈知意随周燃搬进城西不到四十平米的出租屋，墙壁泛黄、水管漏水。第一晚周燃端上白粥咸菜，以真爱和有情饮水饱安抚她。沈知意内心一度动摇，随即自我催眠，决心证明没有陆家也能活好。
  - name: 场景六：入职惠丰金融
    notes: 沈知意退婚前已凭陆家人脉入职惠丰金融，但合作项目与信用担保撤回后处境尴尬。她毫无察觉，依旧迟到早退、使唤同事尤其林清禾、不学业务，管理层已开始关注她，身上的光环正在消失。
  - name: 场景七：周燃的“画大饼”日常
    notes: 周燃每天用白粥咸菜和甜言蜜语维持付出假象：早上许诺修车店做大后带她吃大餐，中午自称最理解她，晚上让她相信自己会成功。句句不假却毫无实质行动，修车店依旧破败、收入依旧入不敷出。
  - name: 场景八：转正名单公布——第一次崩溃
    notes: 晨会上总经理公布新员工转正名单，只有赵媛和林清禾两人。自信满满的沈知意当场表情凝固，眼见小跟班和被自己使唤最多的林清禾转正、自己却被淘汰，第一次直面没有陆家背景的无力，崩溃冲出会议室。
  - name: 场景九：质问陆司砚
    notes: 沈知意认定转正失败是陆司砚背后做手脚，冲到陆氏企业对质。陆司砚平静反问她觉得有必要吗，声明决裂后不再兜底、不再承担沈家旧债，自由意味着为每个选择负责。沈知意无法接受，摔门而去。
  - name: 场景十：工作中的全面失败
    notes: 沈知意联络旧客户试图挽回，但陆家已解除与惠丰金融的合作、她过往态度恶劣、不谙客户需求，还给骗贷人员通过审核，客户纷纷要求停止合作。总经理重新分配她的客户并暂停关联权限，她被边缘化。
  - name: 场景十一：洗手间里的真相
    notes: 沈知意在洗手间隔间听到赵媛与同事议论：她以前靠陆家、没有陆家什么都不是，工作一塌糊涂全靠林清禾收拾，连基本业务流程都不懂。她浑身发抖，直到她们离开才出来面对镜中的自己。
  - name: 场景十二：出租屋的“庆祝大餐”
    notes: 沈知意失意回到出租屋，周燃不知她落选，端出白粥、榨菜、老干妈充作转正庆祝大餐。她质问周燃为何不找正经工作，周燃委屈推脱生意难做、念叨以后，两人爆发第一次激烈争吵，她终因无处可去而妥协。
  - name: 场景十三：林清禾的崛起
    notes: 林清禾为争取保留与陆氏的原定合作项目主动求见陆司砚，获五分钟陈述机会。她以详实数据与方案展示专业准备，陆司砚认出她是订婚宴递手帕的女生，决定带她考察厂房现场，职业轨迹就此改变。
  - name: 场景十四：项目成功与收入飞跃
    notes: 林清禾成功拿下陆氏合作项目，在公司地位迅速上升。沈知意眼红冷嘲她靠陆司砚上位、想嫁陆家是痴心妄想，林清禾正面回怼：嫁给陆司砚只需他本人同意，自己只想做好项目，管理层随后训斥了沈知意。
  - name: 场景十五：道歉被拒
    notes: 沈知意怀念陆家优渥生活，意识到自己可能错了，带周燃上陆家别墅道歉求挽回。大门紧闭，门卫转达陆先生陆太太的话请他们离开。伤透心的陆家父母不再信任她的任何话语，最后一条退路被堵死。
  - name: 场景十六：母亲病危通知
    notes: 离开陆家别墅时医院来电：沈母因欠费已转入普通病房，状况危急需立即缴费抢救，此前几十个来电均被她拒接。银行卡早已冻结，周燃自称没钱，沈知意被迫借高利贷付急救费，利息压得她喘不过气。
  - name: 场景十七：收入的巨大差距
    notes: 项目推进后林清禾单月收入达到五万元，而业绩不达标的沈知意月薪只有四千五百元，扣除房租与基本开支后所剩无几，还背负网贷。她嘴上嘲讽几万块算什么钱，心里清楚两人处境已是天差地别。
  - name: 场景十八：沈知意的至暗时刻
    notes: 沈知意全面陷入低谷：网贷利息越滚越高、朋友无人肯借钱；客户全被重新分配，上班只是打卡混日子；周燃的甜言蜜语失效；母亲病情反复、医疗费如无底洞，她每天活在恐惧医院来电的煎熬中。
  - name: 场景十九：林清禾与陆司砚的渐进式感情
    notes: 林清禾与陆司砚在项目合作中感情渐温。他欣赏她的专业能力与踏实态度，她也在合作中真正了解他的原则、克制与温柔。两人关系发展克制，没有刻意浪漫桥段，在一次次工作会议与讨论中逐渐靠近。
  - name: 场景二十：沈知意的反思
    notes: 连串挫折后沈知意开始反思：她把陆家的关心当成控制，也看到陆司砚被羞辱后不报复、不为难、只尊重她选择的克制与涵养。但反思无法改变现实，一切早已推得太远，她只能继续承担后果。
  - name: 场景二十一：各角色的命运收束
    notes: 结局收束：沈知意失去陆家庇护与前途，住漏水的出租屋、背网贷、照顾病母，与周燃关系名存实亡；陆司砚继续经营产业、与林清禾感情走向确定；林清禾成长为公司骨干；周燃继续画饼，永远会有下一个目标。

worldview:
  - 现实向现代中国县城故事，舞台为虚构的林县，无超自然设定
  - 林县阶层分化悬殊：以陆家为首的少数家族掌控绝大部分经济资源与社会话语权，在省城也有人脉网络
  - 城西老城区是底层生活区：修车铺、出租屋、小饭馆聚集，漏水的水管与精打细算的房租是常态，与豪门世界构成核心冲突的两个空间
  - 陆家庇护网络由七项资源构成：订婚珠宝、黑卡、专车、别墅门禁权限、依附的合作项目、信用担保、沈母VIP病房续费——一次性收回即代表彻底决裂
  - 惠丰金融以业绩为导向，实行新员工转正制度，转正名单是新人职场命运的审判时刻
  - 高利贷网贷：沈知意为支付母亲急救费所借，利息滚动成为压垮她的经济枷锁
  - 剧名构成反讽：「自由」在剧中分三个层次——沈知意的逃避式自由、陆司砚的担责式自由、林清禾的自我实现式自由
  - 养女心理机制：沈知意将陆家的照顾解读为控制，把反抗等同于自由，无法承认错误，只能用新错误掩盖旧错误，形成自毁循环
  - 收养前史：沈知意幼年丧父（沈建平车祸身亡），被陆家收养，其母苏晚晴由陆家安排在VIP病房长期治疗——陆家的恩情与沈知意心中的「控制」同源
  - 命名补全说明：陆振邦（陆父）、温惠茹（陆母）、苏晚晴（沈母）、沈建平（沈亡父）、何广泰（总经理）、郑凯（经理）、林县中心医院、陆氏控股集团、周记汽修均为用户授权补全的命名，非源材料原有

regions:
  - name: 林县
    description: 故事舞台，典型中国县级城市，阶层分化悬殊
  - name: 陆家别墅
    scenes: [宴会厅, 大门]
    description: 林县首富陆家的宅邸，订婚宴举办地，也是沈知意道歉被拒之地
  - name: 城西老城区
    scenes: [周记汽修, 周燃的出租屋]
    description: 修车铺、出租屋、小饭馆聚集的底层生活区，沈知意退婚后的栖身之处
  - name: 惠丰金融
    scenes: [晨会会议室, 洗手间]
    description: 沈知意与林清禾入职的金融公司，职场主线发生地
  - name: 林县中心医院
    scenes: [VIP病房, 普通病房]
    description: 沈母苏晚晴长期就医之处，陆家停止续费后她被转入普通病房等待缴费抢救

factions:
  - name: 陆家（陆氏控股集团）
    summary: 林县首富家族，产业涉及金融、地产、制造业，在省城有深厚人脉；对养女沈知意有养育庇护之恩，决裂后系统性收回全部资源
    territory: 林县（陆家别墅）
    key_members: [陆司砚（独子、继承人）, 陆振邦与温惠茹（家主夫妇）, 沈知意（养女，已决裂）]
  - name: 惠丰金融
    summary: 林县本地金融公司，以业绩和表现说话，实行新员工转正制度，与陆氏控股集团有原定合作项目
    territory: 林县
    key_members: [何广泰（总经理）, 郑凯（经理）, 林清禾（新员工）, 赵媛（新员工）, 沈知意（实习生，转正落选）]

characters:
  - name: 沈知意
    age: 约22-24岁
    gender: 女
    appearance:
      - 长相明艳，气质中带着长期养尊处优的娇气
    identity: 陆家养女，退婚后为惠丰金融实习生，最终无业
    personality: 表层骄纵理所当然，深层自卑不安，病态渴望情绪价值，把反抗陆家等同于追求自由，用新错误掩盖旧错误的自我毁灭式执念
    relationship: 陆家养女、与陆司砚曾有婚约后被自己当众退婚，与周燃恋爱同居，沈母之女
    quotes:
      - chapter: 场景二：泼酒退婚
        context: 沈知意当众痛斥陆家的安排，宣布退婚
        text: 我在你们家这么多年，你们把我当什么了？一个被安排好的工具！我的生活、我的工作、我的婚姻，全都是你们在安排！你们把控制当成关心，把束缚当成照顾！
      - chapter: 场景二：泼酒退婚
        context: 沈知意指着陆司砚的指控
        text: 你就是这个安排的象征，你让我觉得恶心！
      - chapter: 场景五：搬进出租屋
        context: 面对出租屋现实，沈知意给自己打气的自我催眠
        text: 我一定会证明，没有陆家我也能活得很好。
      - chapter: 场景九：质问陆司砚
        context: 沈知意认定陆司砚操纵转正，冲到陆氏企业对质
        text: 是不是你？是不是你让公司不给我转正的？
      - chapter: 场景十二：出租屋的“庆祝大餐”
        context: 沈知意与周燃第一次激烈争吵中对他的质问
        text: 等以后等以后，你什么时候才能不等以后？！
      - chapter: 场景十五：道歉被拒
        context: 沈知意在陆家门外喊出的道歉
        text: 我是来道歉的！我知道我错了！
  - name: 陆司砚
    age: 约26-28岁
    gender: 男
    identity: 陆家独子，陆氏企业继承人
    personality: 理性克制，原则感与边界感极强，温柔有分寸，不吵不求，认为自由必须由选择者承担代价
    relationship: 沈知意曾经的未婚夫与兄长式照顾者（决裂后彻底放手），与林清禾在项目合作中渐生情愫，陆父陆母之子
    quotes:
      - chapter: 场景九：质问陆司砚
        context: 面对沈知意指责他操纵转正时的平静反问
        text: 你觉得我有这个必要吗？
      - chapter: 场景九：质问陆司砚
        context: 向沈知意阐明自由的责任含义
        text: 自由意味着你要为自己的每一个选择负责。
  - name: 林清禾
    gender: 女
    appearance:
      - 装扮朴素，被沈知意称作「朴素女」
    identity: 惠丰金融新员工，出身普通，凭专业态度逆袭为公司骨干
    personality: 踏实内敛有韧性，善良自尊，被使唤不抱怨、默默收拾烂摊子，被嘲讽时能正面回怼
    relationship: 沈知意的同期新员工兼被使唤对象，订婚宴上递手帕被陆司砚记住，后在项目合作中与他感情升温
    quotes:
      - chapter: 场景十四：项目成功与收入飞跃
        context: 面对沈知意嘲讽时的正面回怼
        text: 嫁给陆司砚只需要陆司砚自己同意，不需要你同意。而且我现在只想把项目做好，别的我都不想。
  - name: 周燃
    gender: 男
    appearance:
      - 染黄头发，气质痞气（外号黄毛）
    identity: 城西修车店小老板，靠情感寄生为生的骗术型伴侣
    personality: 深谙情绪价值话术，能快速控制情绪、再苦也嬉皮笑脸，只用甜言蜜语画饼从无实质付出，危难时以没钱推脱，关系名存实亡仍不离开
    relationship: 沈知意退婚后选择的恋人，利用其情感缺口寄生的伴侣
    quotes:
      - chapter: 场景五：搬进出租屋
        context: 出租屋第一晚，用最小成本维持对她好的假象
        text: 但咱们这是真爱，对不对？有情饮水饱嘛。
      - chapter: 场景七：周燃的“画大饼”日常
        context: 早上以未来承诺替代实际付出
        text: 宝宝，等我的修车店做大了，天天带你去吃大餐。
      - chapter: 场景七：周燃的“画大饼”日常
        context: 中午以理解之名提供情绪抚慰
        text: 那些人不理解你没关系，我理解你。你是这个世界上最特别的人。
      - chapter: 场景七：周燃的“画大饼”日常
        context: 晚上安抚因经济拮据而烦躁的沈知意
        text: 相信我，我一定会成功的。到时候你想买什么就买什么。
      - chapter: 场景十二：出租屋的“庆祝大餐”
        context: 以寒酸饭菜充当庆祝大餐的说辞
        text: 怎么样？榨菜配老干妈，这可是我花了大价钱买的！
      - chapter: 场景十二：出租屋的“庆祝大餐”
        context: 被质问为何不找正经工作时的推脱
        text: 我修车店也不容易啊，现在生意不好做。等以后……
  - name: 赵媛
    gender: 女
    identity: 惠丰金融新员工，沈知意在职场的跟随者
    personality: 审时度势，沈知意得势时甘当小跟班，失势后转向林清禾，业务上具备转正实力
    relationship: 沈知意的小跟班，后站到林清禾一边，与林清禾同批转正
  - name: 陆父陆母（陆振邦、温惠茹）
    identity: 陆家当家人夫妇——陆振邦（夫）与温惠茹（妻），林县知名企业家，陆氏控股集团创始人，沈知意的养父母
    personality: 待人和善，被触碰底线后决策果断冷酷；宣布订婚本意为给养女名分与保障，被当众退婚与控制指责伤透心，拒见上门道歉的沈知意
    relationship: 陆司砚的父母，沈知意的养父母（决裂后将其拒之门外）
  - name: 沈母（苏晚晴）
    gender: 女
    identity: 沈知意的母亲苏晚晴，长期住院治疗（陆家安排的VIP病房）
    personality: 源材料无直接刻画，长期病中，是沈知意所有选择的代价承受者
    relationship: 沈知意的母亲，丈夫沈建平车祸身亡后由陆家庇护，陆家停止续费后病危
